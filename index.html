const NOVEL_CHAPTERS=[{"t": "第一章 廢根", "c": "青石鎮的春天來得潮濕，藥鋪「濟生堂」的木門一開，霉味混著艾草味便撲面而來。\n\n墨飛蹲在門檻邊，膝上攤著一本翻爛了的《百草辨疑》，指尖在「三葉魅·葉背有紫紋者毒」那一行反覆摩挲。他生得清瘦，眉眼卻亮，只是那身洗得發白的粗布衣衫，把這點亮也壓成了尋常。\n\n「墨飛！又偷懶。」\n\n裡屋傳來一聲咳，跛著左腿的老鎮醫程伯拄杖出來，花白鬍子抖了抖，「今日鎮口設測靈石，你不去？」\n\n墨飛頭也沒抬：「去了也是那句話。」\n\n他學程伯的腔調，捏著嗓子：「駁雜之根，五行不純，此子……無緣仙途。」\n\n程伯被他逗得險些笑出來，又硬生生板回臉：「去。人這一生，總得親耳聽個明白，才死得了心，或者……活得出希望。」\n\n墨飛終於抬眼。老人渾濁的眼裡，有他看不懂的東西。他嘆了口氣，把書一合：「行吧。反正閒著也是搗藥。」\n\n——\n\n就在墨飛起身要走時，藥鋪的門簾一掀，鄰街的王嬸扶著她那病懨懨的小孫子進來了。\n\n「程大夫，程大夫!」王嬸滿臉焦急，「這孩子燒了三日，鎮上另兩位大夫的藥都吃了，總不見好，您給看看!」\n\n程伯拄杖上前，搭脈、看舌、翻眼皮，眉頭越擰越緊。孩子的脈象浮數，是外感發熱無疑，可尋常退熱的方子下去，怎會三日不退?\n\n墨飛本已走到門邊，腳步卻頓住了。\n\n他這雙眼睛，一落到那孩子身上，就再挪不開。旁人看的是「發熱」，他看的卻是別的——那孩子雖燒得雙頰通紅，指甲卻泛著一絲不易察覺的青;左手總是無意識地護著右腹，那護的姿勢，太刻意了。\n\n「程伯，」墨飛忍不住開口，「不是外感。」\n\n裡屋一靜。王嬸愕然，程伯也回過頭。\n\n墨飛走近，蹲下身，也不搭脈，只輕輕按了按孩子的右下腹。孩子「嘶」地一聲，疼得縮起了身子。\n\n「是這裡。」墨飛抬頭，「腸癰初起，鬱而化熱。退熱的方子，自然壓不住。得先清這裡的火。」\n\n程伯重新搭脈、按腹，臉色驟變——這一按，那孩子疼得直掉眼淚，果然如墨飛所言。老人手忙腳亂地改了方子，一副清熱消癰的藥下去，不過半日，孩子的燒便退了大半。\n\n王嬸千恩萬謝地走時，看墨飛的眼神都變了，出門還不住回頭:「這墨家小子，一雙好眼睛……可惜了，可惜了。」\n\n那「可惜」二字，墨飛聽得清清楚楚。\n\n可惜什麼，他也清楚——可惜他是個廢根。一雙能看穿病灶的好眼睛，在這個以靈根論命的世道裡，終究只配在藥鋪裡辨辨草、看看病，上不了那萬丈仙途。\n\n程伯送走王嬸，回頭深深看了墨飛一眼，那目光複雜難言，末了只重重一嘆:「這雙眼睛……去，去測靈石。聽個明白。」\n\n墨飛沒再多話，掀簾出了門。\n\n——\n\n鎮口老槐樹下，早圍了半圈人。\n\n一塊半人高的青灰石柱立在正中，石面天然生著五色細紋，正是「測靈石」。凡人少年將手掌貼上，石中五色便隨其靈根流轉——金者鋒、木者潤、水者柔、火者烈、土者厚。哪一色最盛，便是主靈根；愈純，仙緣愈厚。\n\n主持測靈的是問劍宗下派的一名執事，煉氣後期，腰間掛玉，神情倨傲。他每念一個名字，人群便「哦」地一聲，或羨或嘆。\n\n「趙元。」\n\n一個錦衣少年昂首上前，把手往石上一按。石柱轟然亮起，金光如刀，刺得眾人瞇眼。\n\n「金根中上，脈絡順暢——好苗子。」執事難得點頭。\n\n趙元收手，目光在人群裡逡巡，最後落在墨飛身上，嘴角一挑：「哎，那個搗藥的也來了？石頭都要被你薰出藥味了。」\n\n哄笑聲起。墨飛面色不變，只在心裡默默記了一筆：趙元，金根中上，嘴賤，走路右肩先動——習武之人的舊習慣，出手多半也從右來。\n\n他不知道自己為什麼會留意這些。他只是……習慣看細節。\n\n「墨飛。」執事念到他，語氣已經先淡了三分。\n\n墨飛上前，把手按上石柱。\n\n五色一起亮起。\n\n然後，一起黯下去。\n\n金木水火土，五色如五盞將盡的殘燈，忽明忽暗，誰也壓不過誰，攪成一團渾濁的灰白。石柱嗡了兩聲，竟像是「不知該說什麼」，索性熄了。\n\n人群靜了一瞬，隨即笑得更響。\n\n「五行俱全？我看是五行俱廢！」\n\n「駁雜之根，千中無一——是說千個裡難得出這麼一個廢的。」\n\n執事收回目光，連評語都懶得給，只擺擺手：「下一個。」\n\n墨飛收手。掌心一片冰涼。\n\n人群裡的議論，像鈍刀子，一下一下。\n\n「墨家這孩子，命也苦。爹娘走得早，跟著個跛腳老頭，如今連根都是廢的。」\n\n「聽說他辨藥辨得比程大夫還準呢，一雙好眼睛。」\n\n「眼睛再好有什麼用?這世道，看的是靈根。沒有靈根，你就是把整座藥山看穿了，也不過是個搗藥的。」\n\n墨飛立在那團熄滅的灰白光芒裡，一字一句，都聽進了耳裡。\n\n他沒有辯解。辯解什麼呢?他們說的是實話。這青石鎮，這修仙界，衡量一個人的，從來不是他看得多準、算得多清，而是——他那與生俱來的、他自己半分做不了主的「根」。\n\n趙元搖著摺扇踱過來，居高臨下地打量他，嘖嘖有聲:「墨飛啊墨飛，我勸你還是死了這條心。你這種廢根，就算讓你活到八十，也踏不進煉氣的門檻。安分點，守著你那破藥鋪，倒也能混口飯吃。」\n\n他湊近半分，壓低了聲音，笑意卻更冷:「別總拿那雙眼睛，四處亂看。看多了，惹人嫌。」\n\n墨飛終於抬眼，迎上趙元的目光。\n\n他沒有怒，沒有辯，只是靜靜地、極認真地，把趙元從頭到腳「看」了一遍——看他那因常年錦衣玉食而略顯虛浮的氣色，看他右肩習慣性微沉的舊態，看他眼底那點被人捧慣了的、經不起挫折的驕矜。\n\n這一眼，看得趙元莫名地心裡發毛，竟先別開了視線，惱羞成怒:「看什麼看!晦氣!」\n\n墨飛收回目光，什麼也沒說，轉身，往人群外走去。\n\n\n\n他早知道會是這樣。可親耳聽見、親眼看見那五色一起熄滅的模樣，心口還是像被人用鈍刀慢慢刮了一下——不疼，卻空。\n\n他沒說話，轉身往人群外走。趙元在背後又補了一句什麼，引來一陣笑，他沒回頭。\n\n——\n\n回程他沒走大路，繞去了鎮後的青石山。\n\n程伯常讓他上山採藥。今日他也懶得回鋪子挨那一屋子的沉默，便信步往深處去。山道濕滑，兩旁是齊腰的野草，露水打濕了褲腳。\n\n他一邊走，一邊在心裡跟自己算帳。\n\n廢根又如何？濟生堂的方子他背得比誰都熟，鎮上誰家孩子發熱、誰家老人咳血，他一搭脈就知道七八分。他這雙眼睛，看藥、看病、看人走路的姿勢，從來沒錯過。\n\n「仙途走不了，」他低聲對自己說，「那就把眼前這條路，走到別人走不到的地方。」\n\n話是這麼說，胸口那點空，還是沒填上。\n\n他不知不覺走到了一處從沒來過的斷崖邊。崖下雲霧翻湧，看不見底；崖壁上，一叢罕見的紫紋靈芝正貼著石縫生長——正是《百草辨疑》裡說能續三日壽元的「三葉紫」，程伯找了半輩子。\n\n墨飛眼睛一亮，什麼廢根不廢根，全拋到腦後。\n\n他解下腰間麻繩，繫在崖邊一株老松上，另一頭纏住手腕，小心翼翼往下探。指尖離那株三葉紫只剩半尺。\n\n就在他伸手的剎那——\n\n腳下那塊看似結實的青石，「咔」地一聲，裂了。\n\n墨飛整個人往下一沉。麻繩繃直，老松發出不堪重負的呻吟，樹根竟連著鬆軟的崖土一起被拔起。\n\n天旋地轉。\n\n風聲在耳邊炸開，雲霧撲面，冰涼刺骨。他甚至來不及害怕，只覺得那株沒摘到的三葉紫，在越來越遠的崖壁上，紫得晃眼。\n\n「……程伯的壽元藥，」他腦子裡沒頭沒尾地冒出一句，「這下真沒了。」\n\n然後他撞進了霧裡。\n\n不知墜了多久，一片黑暗漫上來，把那點紫、那點光、那點不甘，統統吞了進去。\n\n——\n\n再有知覺時，墨飛聞到的是塵土與……某種很古老的、說不清的氣味。像是陳年的墨，又像是被歲月磨薄了的金屬。\n\n他睜開眼。\n\n頭頂不是天，是一片幽暗的洞頂，石鐘乳垂落，隱隱有微光流轉。他躺在一堆鬆軟的腐葉上——多半是這堆葉子，加上崖壁的緩衝，撿回了他半條命。\n\n他動了動手腳。除了渾身酸痛、額角一道破口，竟沒傷筋動骨。\n\n「命大。」他咧嘴想笑，扯到傷口又倒抽一口涼氣。\n\n他撐著坐起，環顧四周。這是一處天然洞窟，深不見底，石壁上偶有暗紋，像是某種極古老的刻痕，被塵封了不知多少年。而在洞窟正中——\n\n一方青灰玉盤，靜靜懸浮在半空。\n\n玉盤約莫巴掌大小，通體古樸，盤面天然生著繁複的道紋，正緩緩流轉著他在測靈石上見過的、卻又截然不同的光。測靈石的光是死的；這玉盤的光，是「活」的。\n\n墨飛的心跳莫名快了起來。他不是修士，卻本能地知道——這東西，不凡。\n\n他鬼使神差地伸出手。\n\n指尖離玉盤還有三寸，那盤面驟然一亮。\n\n一道細若游絲的光，順著他的指尖沒入體內，直竄額心。\n\n墨飛悶哼一聲，眼前一花——\n\n刺啦。\n\n一行行從未見過的、卻又詭異地看得懂的字符，憑空浮現在他的視野裡，就懸在眼前，旁人看不見，唯他可見。\n\n那第一行字，清清楚楚寫著：\n\n【姓名：墨飛　│　境界：凡人　│　戰力：０】\n\n墨飛張了張嘴，半晌，從乾裂的喉嚨裡擠出一句：\n\n「……我戰力是零？」\n\n「這破盤子，還挺會補刀。」"}, {"t": "第二章 問道盤", "c": "「我戰力是零。」墨飛盯著那行懸空的字，又念了一遍，像是要把這份荒謬嚼碎了嚥下去。\n\n那方玉盤在他額心「安了家」，此刻正安安靜靜地把他這具身體，攤成一張明明白白的清單。\n\n他一動念，那行字便如水波一散，湧出更多內容：\n\n【墨飛　│　凡人　│　修為 0／突破所需 ○】\n【氣血 12／12　法力 6／6　精力 100】\n【八維　根骨1　體魄1　悟性2　眼力3　身形2　心性2　福緣1　機緣1】\n【戰力 0】\n\n墨飛看得眼睛發直。\n\n他不懂修行，可他懂秤、懂帳、懂一副藥裡君臣佐使各佔幾錢。眼前這一串，分明就是把「他這個人」，秤了個底朝天。\n\n氣血十二——難怪他一場風寒能病半月。眼力三——濟生堂上下就數他辨藥最準，原來不是他勤快，是這「眼力」比旁人略高。悟性二、心性二……\n\n他的目光最後落回那個「根骨1」上，忍不住嘖了一聲。\n\n「一。」他喃喃，「滿分我不知道多少，但這個數字，怎麼看都像是墊底的。」\n\n盤面似有所感，那「根骨1」旁，悄然浮出一行極淡的註解：\n\n〔根骨：影響傷害力與減傷。眾生之基，越高越堅。〕\n\n墨飛怔住。\n\n它……會解釋？\n\n他心念一動，去看「悟性」。註解果然又浮現：〔悟性：影響修煉效率、法力上限、法術攻擊。〕\n\n再看「戰力」：〔戰力：攻防命中暴擊閃避反擊減傷各項之綜合評分。衡量整體戰鬥實力。〕\n\n墨飛只覺得一股寒毛倒豎的戰慄，順著脊背爬了上來——不是害怕，是興奮。\n\n他這一生看過無數雙眼睛：貨郎看貨、賭徒看牌、江湖郎中看病人。人人都在「猜」。而此刻，這方玉盤把一個活人拆成了看得見、算得清的數字，明明白白攤在他眼前。\n\n「這東西……」他喉頭發乾，「是把『看不見的道』，變成了『看得見的帳』。」\n\n洞窟幽暗，他卻覺得眼前亮堂得刺眼。\n\n——\n\n墨飛按捺住狂跳的心，決定「試」一試這方玉盤的本事。\n\n洞壁的石縫裡，一隻通體青黑的洞蛛，正結網靜伏。墨飛凝神望去，念頭方動，那蛛身之上，便浮出一行字:\n\n【青毒蛛　│　凡·妖蟲　│　戰力 3　│ 毒牙，喜自暗處偷襲】\n\n墨飛的瞳孔，微微一縮。\n\n它連一隻蟲子，都能看穿——看穿它的戰力，看穿它「喜自暗處偷襲」的習性。\n\n他不動聲色地往旁挪了半步，避開那洞蛛可能撲落的軌跡。果然，下一瞬，那青毒蛛倏地自石縫躍下，撲了個空，悻悻地又爬回了暗處。\n\n若是往常，墨飛未必躲得過這一撲。可此刻，問道盤把那蟲子的「意圖」提前攤在了他眼前——他不是反應快，是他「早就知道」。\n\n「知己……知彼。」墨飛喃喃，一股寒意混著狂喜，順著脊背爬上來。\n\n他又試著去看洞頂垂落的石鐘乳、看石壁上那些古老的暗紋、看腳下的腐葉——大多數，問道盤只淡淡回一句〔尋常之物，無可述〕;可偶爾，掃過某一處石壁的刻痕時，盤面會極輕微地一顫，浮出一行〔道韻殘留，不可解讀〕，隨即又歸於平靜，像是連它自己，都對這古洞的來歷，有所忌憚。\n\n墨飛把這些一一記在心裡。他隱隱覺得，這方玉盤能看見的東西，遠不止「數值」這麼簡單——它看見的，是這世間萬物背後，那一層旁人看不見的「道理」。\n\n而他最在意的，還是自己。\n\n他反覆調閱著自己的面板，把每一項數值、每一句註解，都嚼碎了、記牢了。他發現，這面板並非死物——當他嘗試屏息凝神、按著幼時聽人講過的粗淺法門調息時，那「修為」一欄，竟極其緩慢地，跳動了一下:【修為 0 → 1】。\n\n就這一下，讓墨飛如遭雷擊。\n\n「動了。」他死死盯著那個「1」，聲音發顫，「我這廢根……修為，竟然也能動?」\n\n一個念頭，如驚雷般在他腦中炸開——測靈石測的是「純」，可修為漲不漲，靠的分明是「引氣入體」的法門!他缺的，從來不是資質，是——一部能教他引氣的功法!\n\n想到此處，墨飛的呼吸都急促了幾分。他強迫自己冷靜下來，決定先把這方玉盤的門道，摸得再透一些。\n\n\n他試著多念了幾個字眼。「功法」二字一出，盤面卻只回了一行灰暗的：〔尚未習得任何功法。〕\n\n「境界」——〔凡人。未曾引氣入體。〕\n\n墨飛摸著下巴。他不懂修行，但這幾天鎮口的閒言碎語沒白聽：修士第一步，是「引氣入體」，踏入煉氣。而引氣，得靠功法。\n\n問題是，他一個廢根，去哪弄功法？就算弄到了，那五色一起熄滅的測靈石還歷歷在目——他練得動嗎？\n\n正想著，他撐著石壁要站起來，掌心卻按到一樣硬物。\n\n是一卷竹簡，半埋在腐葉裡，簡面朽得幾乎脫線，卻在他指尖觸到的剎那，額心的問道盤驟然一跳。\n\n一行新字，浮了出來：\n\n【偵測到功法·殘卷】\n《吐納訣（殘）》　修練型　│　凡品\n效果：修煉效率 +2／秒；氣血 +25（常駐）\n適修境界：凡人起　│　學習：可\n\n墨飛的呼吸，停了半拍。\n\n他一個字一個字地讀。修煉效率加二，氣血加二十五——他現在氣血才十二，這一部功法要是練成，光「氣血加二十五」，就等於把他這條小命翻了三倍。\n\n而最讓他心跳如鼓的，是最後那兩個字。\n\n學習：可。\n\n不是「駁雜之根，無緣」；不是「五行不純，難成」。\n\n是——可。\n\n「它說……我可以？」墨飛的聲音有點抖。\n\n他猛地想起測靈石那一幕。石柱測的是「哪一色最盛」，可他五色俱全、俱雜，於是被判了「廢」。可修練型功法，練的是「吐納」，是把天地之氣一絲絲引進來、養著——它不挑你哪一色純，它只問你「引不引得進」。\n\n一直以來，世人用「純」來衡量仙緣。而他這雙眼睛，此刻透過問道盤看見的，是另一套帳：不是純不純，是夠不夠、配不配、划不划算。\n\n廢根墨飛，在這暗無天日的古洞裡，第一次笑了。笑得像撿到寶的貨郎。\n\n「五行俱全怎麼了？」他把那卷朽爛的竹簡小心翼翼捧起，像捧著整個濟生堂最貴的那味藥，「五色都能引一點——那我不就是……什麼都能沾一手的雜家？」\n\n他學程伯抓藥的口氣，一本正經：「君臣佐使，講究的就是個『配』。純有純的好，雜有雜的用。」\n\n盤面靜靜浮著那行「學習：可」，彷彿在等他。\n\n墨飛深吸一口氣，盤膝坐下，將竹簡置於膝上，依著《吐納訣》殘卷上僅存的幾行口訣，闔上雙眼。\n\n「引氣入體……」他默念，「第一口氣，往哪引?」\n\n他不會。他真的不會。他連丹田在哪都是聽人閒扯來的。\n\n可就在他茫然的剎那，額心問道盤微微一熱，一縷極淡的光，順著他的呼吸，在他體內描出一條若隱若現的路徑——像有人在漆黑的屋子裡，替他點亮了一盞燈，照出腳下的第一級台階。\n\n墨飛心頭大震，卻不敢分神，屏息凝神，順著那條被「照亮」的路，緩緩、緩緩地，將洞中那一絲清冷的靈氣，往體內引。\n\n一絲。\n\n兩絲。\n\n那靈氣入體的剎那，冰涼裡透著一種說不出的舒暢，順著四肢百骸淌過，連額角的傷口都似乎不那麼疼了。\n\n而在他眼前，那行冰冷的數字，正在動。\n\n【修為 0 → 1 → 2 …】\n【氣血 12／12 → 13／37 …】\n\n墨飛闔著眼，眼角卻不受控地濕了。\n\n他看不見自己的靈根純不純。他只看見——這一次，數字，是往上走的。\n\n這一絲一絲引進來的靈氣，冰涼裡透著暖，順著他孱弱的經脈緩緩淌過。每淌過一處，那處便像久旱的田，貪婪地吸吮著甘霖。他這具被判了死刑的廢軀，此刻正一寸一寸地，活了過來。\n\n他忽然想起白日裡王嬸那句「一雙好眼睛，可惜了」，想起趙元那句「你這種廢根，踏不進煉氣的門檻」，想起測靈石前那一團熄滅的灰白。\n\n可惜嗎?踏不進嗎?\n\n墨飛闔著眼，唇角卻慢慢揚起。\n\n他這雙「好眼睛」，如今借著問道盤，看得比誰都清、算得比誰都明;而他那被判了「無緣」的根——此刻，正一口氣、一口氣地，把靈氣引進體內。\n\n「誰說廢根，就踏不進煉氣的門?」他在心底，輕輕地反問，反問這方玉盤，也反問這個以「純」定人生死的世道，\n\n「我偏要，一絲一絲，把這扇門，引開。」\n\n\n\n洞外不知晝夜。青石鎮的人此刻多半以為，那個掉下斷崖的搗藥廢材，已經沒了。\n\n他們不會知道，就在這方被歲月遺忘的古洞深處，一個「戰力為零」的少年，正就著一部朽爛的殘卷，一絲一絲地，把自己那條被判了死刑的仙途，重新引回了體內。\n\n一口氣。\n\n又一口氣。\n\n墨飛在心裡，對那方玉盤，也對自己，輕輕說了一句：\n\n「來吧。反正——我現在，看得見了。」"}, {"t": "第三章 引氣入煉", "c": "墨飛在古洞裡，一坐就是三天。\n\n他不知道是三天。洞中無晝夜，他只知道，餓了就啃兩口隨身乾糧，渴了就飲石壁滲下的清泉，睏了便伏在腐葉上淺眠片刻，醒來繼續盤膝——引氣。\n\n支撐他的，是問道盤上那一串不停往上走的數字。\n\n凡人修煉，最苦的是「看不見」。今日打坐一個時辰，究竟長了多少道行？誰也說不清，只能憑一股虛無縹緲的「感覺」。多少人就是在這種看不見盡頭的黑暗裡，熬幾年、練幾年，最後認了命。\n\n墨飛不必。\n\n他每引一口氣，眼前那行【修為】便實實在在地跳一個數。他甚至能算出——照這個速度，還差多少，能到下一階。\n\n「這哪是修煉，」他咧著嘴，一絲不苟地調著呼吸，「這是記帳。一筆一筆，童叟無欺。」\n\n這三日，並不好熬。\n\n乾糧第二日便見了底。他靠著石壁滲下的清泉續命，餓得前胸貼後背時，便嚼幾片洞裡尋來的、問道盤標註「無毒可食」的青苔——苦澀難嚥，卻能壓一壓那折磨人的飢餓。\n\n更難熬的，是「看不見盡頭」。\n\n凡人修煉，最磨人的從來不是苦，是「不知道還要多久」。今日打坐一個時辰，究竟離煉氣近了幾分?無人知曉。多少資質尋常的少年，就是在這種望不到頭的黑暗裡，一年、兩年地耗，最後心灰意冷，認了命。\n\n可墨飛不必。\n\n問道盤上那一行【修為】，像一盞永不熄滅的燈，替他照亮了前路的每一級台階。他甚至能粗略算出:照這個速度，還需引氣多少口，便能蓄滿突破的門檻。\n\n於是他不慌。餓了嚼青苔，睏了淺眠片刻，醒了繼續盤坐引氣。他把這枯燥的過程，當成了濟生堂裡最尋常的搗藥——一杵，一杵，不急不躁，終能成粉。\n\n「別人熬的是『不知道』，」他在心底自嘲，「我熬的，不過是『時間』。這帳，划算。」\n\n第二日夜裡，他也曾動搖過。\n\n那是他餓得眼冒金星、四肢發軟的時候。他靠在冰冷的石壁上，望著頭頂那片幽暗的洞頂，第一次生出一絲怯意——他一個廢根，躲在這暗無天日的古洞裡，啃著青苔修煉，這一切，當真會有結果嗎?還是不過是他這個廢材，臨死前一場自欺欺人的美夢?\n\n可就在那一刻，問道盤上，那個「修為」的數字，又極輕地，往上跳了一格。\n\n就這一格。\n\n墨飛怔怔地看著，忽然就笑了，眼角卻濕了。\n\n美夢也好，自欺也罷——這數字，是真的在漲。他這條被判了死刑的命，是真的，在往前走。\n\n「哪怕只是一格，」他抹了把臉，重新闔上眼，盤膝坐直，「往前一格，就不是原地。」\n\n他不再動搖。\n\n\n到了第三日，那盤面終於浮出他等了許久的一行:\n\n【修為已滿　│　可突破：凡人 → 煉氣一層】\n【突破成功率 92%　（心性2 · 抗心魔加成）】\n\n墨飛精神一振。\n\n九成二。這數字他看得懂——十次裡難得敗一次。他嚥了口唾沫，又見那盤面貼心地補了一句:〔突破失敗將走火入魔，折損壽元。心性越高，成功率越高、折損越輕。〕\n\n「還會提醒風險。」墨飛失笑，「比鎮上放印子錢的還周到。」\n\n他不再猶豫，收攝心神，將體內積蓄了三日的靈氣盡數往那道無形的「關隘」上撞去。\n\n第一撞，關隘紋絲不動。\n\n第二撞，他只覺氣血翻湧，眼前發黑，體內那點微薄的靈氣像撞在鐵壁上，幾乎要潰散。一絲細微的心魔趁隙而入——是測靈石熄滅的那一幕，是趙元的哄笑，是「無緣仙途」四個字。\n\n墨飛咬牙。\n\n「無緣?」他在心底冷笑，「我這帳都記到這兒了，你現在跟我說無緣?」\n\n那點譏誚，竟像一根針，把翻湧的心魔戳破。他神台一清，借著這一線清明，第三次、也是最後一次，狠狠撞了上去——\n\n咔。\n\n一聲彷彿只在靈魂深處響起的輕響。\n\n那道無形的關隘，碎了。\n\n一股前所未有的暖流自丹田升起，順著經脈奔湧四肢。墨飛渾身一顫，睜開眼，只覺天地間那些原本看不見、摸不著的靈氣，此刻竟隱隱可感——像一個瞎了半生的人，忽然看見了牆角浮動的塵光。\n\n眼前，數字翻新:\n\n【墨飛　│　煉氣一層】\n【氣血 37／37　法力 18／18】\n【八維　根骨1 → 5　體魄1 → 5　悟性2 → 5 …（突破自動成長）】\n【戰力 0 → 8】\n\n「戰力八。」墨飛看著那個數，由衷地、真心實意地感慨了一句，「……離趙元那金根中上，大概還差他個十來八個吧。」\n\n他頓了頓，又補一句:「不過三天前是零。」\n\n從零到八。旁人聽了要笑掉大牙，可只有墨飛自己知道，這八點戰力，是他一口氣一口氣，從一具被判了死刑的廢軀裡，硬生生「引」出來的。\n\n他站起身，踉蹌了一下——三日未曾好好活動，腿都麻了。可他挺直了背，只覺得那具孱弱的身子裡，第一次有了點「份量」。\n\n——\n\n活動開了筋骨，墨飛才想起正事:得出去。\n\n程伯還等著他。鎮上多半以為他死了。而崖上那株沒摘到的三葉紫……他嘆了口氣，先顧命要緊。\n\n他舉著一支就地取材的火把，沿洞壁摸索。這古洞比他想的深，岔道縱橫，若無問道盤指引方位，只怕要困死其中。走著走著，他在一處石龕前停下——龕中積塵盈寸，擱著一只朽爛的木匣。\n\n額心問道盤，又是一跳。\n\n【偵測到功法】\n《厚土樁（殘）》　內功型 · 土　│　凡品\n常駐:防禦 +2　│　掛機自療 微\n啟用效果:防禦提升、受擊反彈、減傷\n學習:可\n\n墨飛的眼睛，又亮了。\n\n他這幾日把問道盤摸得七七八八，已隱約懂了個門道:功法分四型——修練型養己(修為、氣血)、靈力型蓄力(法力)、內功型護體、外功型殺敵。而每一型，都像鎮上鐵匠鋪裡的傢伙，「學會就有個底，掛上啟用才使得出全力」。\n\n《吐納訣》是他的「修練」，養命養道。而這部《厚土樁》——是他的第一件「護身符」。\n\n「一攻沒有，先撿個防。」墨飛把木匣裡的殘卷小心收好，自語道，「廢命一條，得先學會別讓人一巴掌拍死。」\n\n他就地盤坐，依樣畫葫蘆，將《厚土樁》也引入體內。這一回有了《吐納訣》的底子，又有問道盤照路，順暢了許多。片刻後，盤面更新:\n\n【已習得功法】\n修練型《吐納訣（殘）》Lv1　│　內功型《厚土樁（殘）》Lv1 · 土\n〔啟用內功可增戰鬥防禦;學習越多內功，常駐防禦與自療越厚〕\n\n「學越多越厚。」墨飛咀嚼著這句話，若有所思。\n\n這意味著，哪怕是他這種撿破爛似的東學一部、西學一部，只要「學得夠多、配得夠巧」，積少成多，終能堆出旁人瞧不上、卻紮紮實實的份量。\n\n天才靠一部絕世功法一飛沖天;他墨飛，大概只能靠這一部一部撿、一分一分算，把路鋪出來。\n\n「也行。」他拍拍身上的塵土，舉著火把往問道盤指的方向走去，「反正我這輩子，就沒指望過走捷徑。」\n\n墨飛依著《厚土樁》的口訣，試著將這部內功「啟用」。\n\n一股厚重、沉穩的土系之氣，自丹田升起，在他體表結成一層薄薄的、若有若無的護罩。問道盤上，他的【防禦】一欄，應聲跳了一小格;更妙的是，那護罩並非只在他「想用」時才有——只要學會了，它便如影隨形，常駐於身。\n\n「常駐。」墨飛咀嚼著這個詞，若有所悟。\n\n他忽然明白了問道盤先前那句「學習越多內功，常駐防禦與自療越厚」的深意——這四型功法，竟像藥鋪裡的君臣佐使，各司其職，又能相互配伍。修練型養己身，內功型護己命，只要搭配得當，積少成多，終能在他這副廢軀之上，堆出一套旁人瞧不上、卻紮紮實實的「底子」。\n\n這對他而言，簡直是量身定做的活路。\n\n天才們，一部絕世功法便可通神，他們不必「配」，只需「精」。可他墨飛，資質駁雜、樣樣稀鬆，偏偏——他有一雙能看穿每部功法價值的眼睛，有一顆最擅長「配伍」的心。\n\n「別人練的是一柄神兵，」他握了握拳，掌心裡土系的護氣還在流轉，「我墨飛，練的是一整副藥。」\n\n「一味不夠猛?那就十味、二十味，配起來。」\n\n「總有一天，我要讓這一副『雜藥』，喝倒那些捧著神兵的天才。」\n\n想通了這一節，墨飛只覺得眼前那條被判了死刑的仙途，豁然開朗。他不再糾結於自己「不夠強」的每一項，而是開始盤算——下一味「藥」，該補什麼?攻?還是……能救命的「回血」?\n\n他舉著火把，循著問道盤指引的方位，一步一步，往那透進天光的洞口走去。腳步，比來時穩了太多。\n\n\n洞道盡頭，漸漸透進一線天光。\n\n墨飛加快腳步，鑽出洞口，一頭撞進了久違的、刺眼的日光裡。\n\n他抬手遮眼，眯著眼望出去——洞口竟在青石山半腰的一處密林後，離鎮子不算遠。山風拂面，帶著熟悉的草木氣。\n\n他回頭望了一眼那幽深的洞口。三天前墜崖的少年，和此刻走出來的，已經不是同一個人了。\n\n「程伯，」他望著山下鎮子的方向，輕聲道，「我回來了。」\n\n「而且——」他低頭看了眼那行淡淡浮著的【戰力 8】，咧嘴一笑，\n\n「還帶著帳本回來的。」"}, {"t": "第四章 歸鎮", "c": "濟生堂的門，是被墨飛一腳踹開的。\n\n倒不是他想威風。是他抬手推門時，手還在抖——三日水米不繼、又剛突破，這具身子虛得很。門沒推開，人先撞了上去。\n\n「誰家的——」程伯拄杖從裡屋出來，話說到一半，僵住了。\n\n老人渾濁的眼死死盯著門口那個灰頭土臉、衣衫破爛、額角結著血痂的少年，喉結上下滾了兩滾，拄杖的手，抖得比墨飛還厲害。\n\n「……墨、墨飛?」\n\n「程伯。」墨飛咧嘴想笑，牽動嘴角的乾裂，「我回來了。三葉紫沒摘到，對不住。」\n\n程伯拄著杖，一步一步挪過來，枯瘦的手抬起，在墨飛肩上、臉上、額角，反反覆覆地按、揉、確認，像是不信這是活人。末了，老人別過臉去，用袖子狠狠抹了一把眼睛，聲音卻凶巴巴的：\n\n「死小子!崖都掉下去了!鎮上的人都說……都說……」他罵不下去，「你倒好，晃三天，自己走回來了?」\n\n「命大。」墨飛扶著老人坐下，自己也順勢癱進椅子裡，「還撿了點東西回來。」\n\n他頓了頓，斟酌著。問道盤這事，他信程伯，可乍然說出「我識海裡有個玉盤，能看見人的數字」，只怕老人要以為他摔壞了腦子。\n\n於是他只揀了能說的說：「我在山裡，尋著了一部殘破的吐納功法。程伯……我引氣入體了。我入了煉氣。」\n\n裡屋一下子靜得能聽見藥碾子上殘留的一粒芥子滾落。\n\n程伯猛地抬頭，那雙渾濁的老眼裡，翻湧起墨飛看不懂的、極複雜的東西——有震驚，有狂喜，還有一絲……極深、極遠的追憶。\n\n「你……引得進?」老人的聲音發顫，「你這五行俱雜的根……引得進?」\n\n「引進了。」墨飛認真道，「程伯，測靈石測的是『純不純』。可修練型功法，練的是『引不引得進』。我五色都能沾一點，純是不純，可——五條路我都走得通半步。」\n\n程伯怔怔地看著他，良久，忽然仰頭，發出一聲又像哭又像笑的長嘆。\n\n「好……好啊。」老人喃喃，「原來如此，原來……不是無緣，是無人替你點那盞燈。」\n\n墨飛心頭一動。\n\n這句話，怎麼聽著，不像個尋常鎮醫能說出口的?\n\n他不動聲色，心念微轉，將目光落在程伯身上——問道盤，亮了。\n\n【程伯　│　境界:凡人?（識海有霧，難以盡窺）】\n【心性 ??　│　機緣 ??】\n〔此人氣息深藏，問道盤僅能窺其表，不能盡其里〕\n\n墨飛的呼吸一滯。\n\n他這幾日，拿問道盤看過洞裡的蟲、看過自己，清清楚楚，分毫不差。可此刻看程伯——一個跛腳的、在青石鎮熬了半輩子的老鎮醫——盤面竟浮出「難以盡窺」四個字?\n\n一個凡人，能有什麼「深藏的氣息」，連問道盤都看不透?\n\n墨飛面上不顯，心裡卻悄悄記了一筆，壓在最底。他抬眼，見程伯已收斂了神色，又是那個嘮叨的老頭:\n\n「餓壞了吧?鍋裡有粥。吃完給我躺下，那點傷口再化膿，神仙也救不回你這條爛命。」\n\n「哎。」墨飛應著，起身盛粥，背對著老人，唇角卻壓下一絲若有所思的弧度。\n\n——\n\n這兩日，墨飛白天在濟生堂幫著搗藥、看診，夜裡便關起門來打坐引氣。\n\n而每當有鎮民上門求醫，他那雙眼睛，便有了新的用處。\n\n他悄悄用問道盤，「看」過來求診的每一個人。大多數，不過是尋常凡人:【凡人│戰力0】;偶有幾個練過幾手粗淺拳腳的鎮上護衛，也不過【戰力3、4】。\n\n這讓墨飛心裡漸漸有了一桿秤——他如今這煉氣一層、戰力八的身板，擱在青石鎮，竟已算得上「一號人物」。\n\n「難怪。」他心中瞭然。這世上絕大多數人，終其一生都是凡人，連引氣入門的門檻都摸不到。他這一步踏出去，看似微不足道，實則已將這鎮上九成九的人，甩在了身後。\n\n只是……他也清楚，青石鎮這方小小的池塘，養不出真正的蛟龍。趙元那金根中上的資質，早晚是要飛出去的;而他若只滿足於做個「鎮上一號人物」，這輩子也就到頭了。\n\n「打坐養道太慢。」墨飛盤算著。他清楚地記得，在古洞裡，他之所以三日便能破境，除了日夜打坐，更因為隨手捏死的那幾隻洞蟲——每一隻，問道盤都跳出過【修為 +】。\n\n擊殺，才是成長最快的路。\n\n這個念頭一旦生根，便再壓不下去。他攤開一張青石山周邊的舊圖，指尖點在鎮外那片標著「落霞谷」的區域——鎮上老獵戶說過，那裡有低階妖獸盤踞，尋常人避之唯恐不及，卻正是煉氣修士練手、換取修為與掉落的好去處。\n\n危險嗎?自然危險。可他有問道盤——能提前看穿每一頭妖獸的戰力與破綻。這世上，還有比「知己知彼」更大的底氣嗎?\n\n「打坐養道，歷練換命。」墨飛把這八個字在心裡念了一遍，越念越覺得在理，「兩條腿走路，才走得快。」\n\n他抬眼望向窗外落霞谷的方向，眸中，燃起了躍躍欲試的光。\n\n\n又養了兩日，墨飛的身子已大好。額角的破口，靠著程伯的金瘡藥，結了痂。他心裡那把去落霞谷的火，燒得越來越旺。\n\n他正盤算著，鋪子門口忽地暗了一暗。\n\n一身錦衣的趙元，搖著把摺扇，大剌剌地堵在門口，身後跟著兩個狗腿。他一眼瞧見墨飛，先是一愣——顯然也聽說了「墜崖」的傳言——隨即那點錯愕化作更濃的譏誚:\n\n「喲?我當是誰。掉下崖還能爬回來?搗藥的，你這條命，是拿藥渣糊起來的吧?」\n\n兩個狗腿哄笑。\n\n墨飛慢條斯理地放下藥杵，抬眼。\n\n問道盤，亮了。\n\n【趙元　│　煉氣二層　│　戰力 21】\n〔慣用右手，起手偏右下路;身形3，閃避平庸〕\n\n墨飛心裡有了數。\n\n戰力二十一，煉氣二層。比他這剛破境的煉氣一層、戰力八，高出足足一截。若是硬拚，他討不了好。\n\n可他這雙眼睛，連對方「起手偏右下路、閃避平庸」都看得一清二楚。\n\n打不過，不代表算不過。\n\n「趙少爺。」墨飛卻笑了，笑得溫吞，「來抓藥?還是——來送我點修為?」\n\n趙元一愣:「你說什麼?」\n\n「沒什麼。」墨飛拾起藥杵，重新低頭搗藥，語氣平平，「我就是覺得，趙少爺這身戰力，擺在鎮上是塊招牌;可要是哪天，栽在一個『搗藥的』手裡——」\n\n他抬眼，目光清亮，一字一句:\n\n「那才叫熱鬧。」\n\n趙元臉上的譏誚，一寸寸僵住。\n\n他盯著低頭搗藥的墨飛，總覺得這搗藥的，跟三月前那個被測靈石判了廢根、灰溜溜逃走的窩囊廢，哪裡……不一樣了。可具體哪裡不一樣，他又說不上來——只覺得那雙抬起來看他一眼的眼睛，靜得讓他莫名地心裡發毛。\n\n「你……」趙元色厲內荏地一甩摺扇，「一個廢根，也敢跟我耍嘴皮子?我告訴你墨飛，過幾日問劍宗要來咱們這一片招收弟子，我趙元金根中上，是十拿九穩的。等我入了問劍宗，成了正經的仙門弟子，回頭捏死你這搗藥的，比捏死隻螞蟻還容易!」\n\n他撂下狠話，又覺得對著個廢根發這麼大火，實在跌份，這才悻悻地一甩袖子，帶著兩個狗腿，揚長而去。\n\n墨飛始終沒有抬頭，直到那陣喧鬧走遠，才停下藥杵，望著門外趙元離去的方向，若有所思。\n\n「問劍宗……招收弟子?」他低聲重複著這四個字。\n\n方才趙元惱羞成怒間漏出的這句話，卻像一顆石子，在他心裡漾開了一圈圈漣漪。\n\n問劍宗，這一片方圓千里最頂尖的修行大宗。是無數小鎮少年做夢都不敢想的地方。\n\n而招收弟子……\n\n墨飛低頭，看了眼識海裡那行【煉氣一層│戰力8】，又想起趙元那「金根中上、十拿九穩」的張狂。\n\n換作三月前，他連湊上去看一眼的念頭都不會有。\n\n可如今——\n\n他握了握藥杵，掌心裡，是三日引氣、一場苦修換來的、實實在在的份量。\n\n「趙元，你先別急著捏死我。」墨飛唇角，極輕地揚起一絲弧度，那弧度裡，是連他自己都未曾察覺的、破土而出的野心，\n\n「說不定……問劍宗那道門檻，我也想去，試一試呢。」\n\n窗外，青石鎮的天，一如往常地藍。可墨飛知道，有一扇他從前想都不敢想的門，正隨著趙元那句無心之言，在他面前，悄然裂開了一道縫。\n\n而他要做的，就是先去落霞谷——把自己這副廢軀，再往上，狠狠地，堆高一截。"}, {"t": "第五章 落霞谷首殺", "c": "天未亮，墨飛就出了鎮。\n\n程伯沒攔他。老人只在他腰間塞了三枚止血丹、一小包乾糧，末了盯著他，沉聲道：「落霞谷外圍的妖，多是煉氣一二層的野物。記住——打不過就跑，命比什麼都值錢。」\n\n「知道。」墨飛把丹藥揣好，「我這人，最惜命。」\n\n他說的是真話。他這條命，是從斷崖底下撿回來的，比誰都金貴。\n\n出了鎮往南三十里，霧色漸濃，草木愈發蓊鬱，空氣裡浮起一絲若有若無的腥氣——落霞谷到了。\n\n墨飛沒有莽撞地闖進去。他伏在谷口一塊青石後，先讓問道盤替他「探路」。\n\n不多時，一頭灰毛野物從林間鑽出——形似巨兔，卻獠牙外露，雙目泛紅，正是煉氣期常見的低階妖獸「赤睛兔」。\n\n墨飛凝神望去。\n\n【赤睛兔　│　煉氣一層　│　戰力 6】\n【氣血 約 40　攻擊偏低　防禦薄　│　習性:先蹬後撲，撲擊為主】\n\n墨飛心裡的帳，一筆筆算開了。\n\n戰力六，比他這煉氣一層、戰力八，還低了兩點。氣血四十，防禦薄。習性是「先蹬後撲」——起手會先用後腿蹬地蓄力，再一躍撲來。\n\n「有破綻的仗，才是好仗。」墨飛低聲自語。\n\n他這幾日已把《厚土樁》啟用，常駐防禦墊了底；又把撿來的一柄凡品斷刀（基礎攻擊雖不高，卻聊勝於無）握在手裡。他不求一擊斃命——他求的是「算準每一下」。\n\n他撿起一塊石子，往赤睛兔身側的草叢一擲。\n\n赤睛兔警覺，紅眼一瞪，後腿果然「先蹬」——蓄力的剎那，它整個身子微微下沉，露出一個極短的、動彈不得的空當。\n\n就是這一瞬。\n\n墨飛從青石後暴起，斷刀直取那下沉的兔頸。他戰力不高，這一刀談不上凌厲，可他算準了時機、算準了角度——刀鋒正正切在赤睛兔「蓄力未發、避無可避」的空當上。\n\n噗。\n\n刀入三寸。赤睛兔一聲淒厲的嘶鳴，撲擊的勢頭卻已收不住，帶著滿腔血氣撞進墨飛懷裡。\n\n墨飛被撞得倒退兩步，胸口一悶——那撲擊的餘勁，實打實地砸在他身上。若非《厚土樁》的常駐防禦與減傷墊著，這一下只怕要斷他兩根肋骨。\n\n饒是如此，他眼前也是一花，氣血刷地掉了一截：\n\n【氣血 37 → 22】\n\n「嘶——」墨飛齜牙，「防禦還是太薄。」\n\n可赤睛兔更慘。刀傷加撞擊，它翻滾在地，紅眼漸漸黯去。墨飛穩住身形，補上一刀，結果了它。\n\n下一瞬，問道盤上，那行他等了許久的字，亮了起來——\n\n【擊殺 赤睛兔】\n【修為 +18　│　氣血回復少許】\n【掉落:妖獸皮 ×1】\n\n墨飛喘著氣，看著那「修為 +18」，忍不住笑出了聲。\n\n打坐一個時辰，修為漲不了十。而這一頭赤睛兔——一刀、一撞、一補，前後不到十息，換來十八。\n\n「這才對嘛。」他抹了把臉上的兔血，眼睛發亮，「歷練換命，童叟無欺。」\n\n他低頭看著腳邊那頭氣絕的赤睛兔，心情有些複雜。\n\n這是他第一次，親手取一頭妖獸的性命。那撲擊撞在胸口的悶痛還在，可比起疼痛，更清晰的，是一種踏踏實實的「換」——他用一分險、一點傷，換回了十八點修為、一張妖皮。\n\n在青石鎮，他是個連靈根都廢了的搗藥少年，是別人口中「可惜了」的談資。可在這落霞谷裡，他手起刀落，就能把一頭妖獸，換成自己往上走的階梯。\n\n「原來這就是修士。」他喃喃。\n\n原來所謂修行，並不只是打坐吐納那般清淨。它也有這血淋淋的一面——是弱肉強食，是以命博命，是把天地間的凶險，一分一分，煉成自己的道行。\n\n墨飛握了握手裡那柄還在滴血的斷刀。他沒有害怕，反而覺得胸口那口鬱結了十六年的悶氣，鬆動了些。\n\n「趙元說我一輩子踏不進煉氣的門。」他自語，唇角揚起，「程伯說命比什麼都值錢。」\n\n「他們說的，都對。可他們都不知道——」\n\n他望向落霞谷更深處那片濃霧，眼底燃著火:「我這條撿回來的命，不是用來守著藥碾子的。是用來，一頭一頭妖、一分一分道，把那扇被判了『無緣』的門，親手砸開的。」\n\n說罷，他拾起那張妖皮，仔細收進隨身的粗布背囊，重新握緊斷刀，往谷中走去。\n\n\n\n——\n\n有了第一頭的經驗，墨飛越打越順。\n\n第二頭，是一隻盤在樹上的「青鱗蛇」。\n\n【青鱗蛇│煉氣一層│戰力7│習性:自上而下，絞殺為主】\n\n問道盤的批註，讓墨飛半步都沒往那樹下站。他繞到側面，拾起一根長枝，去撩撥蛇尾。青鱗蛇果然自樹上急撲而下，撲向他方才站立的空地——撲了個空。墨飛趁它落地、絞勢未成的剎那，一刀釘穿蛇頭。\n\n第三頭、第四頭，是一對結伴的「灰毛狼」。\n\n這回麻煩些。【灰毛狼│煉氣一層│戰力9│習性:成對，一誘一襲，善包抄】——兩頭一組，一頭在前吸引，一頭繞後偷襲。\n\n若無問道盤，墨飛多半要著了那「繞後」的道。可此刻，那頭「繞後」灰狼的位置與撲擊時機，都清清楚楚地攤在他眼前。他佯裝只顧眼前那頭誘敵的，卻在繞後的灰狼撲來的前一瞬，猛地轉身，斷刀迎上——正正捅進那頭偷襲者的咽喉。\n\n失了偷襲的默契，剩下那頭誘敵的灰狼便成了孤軍。墨飛啟著《厚土樁》硬扛下它一撲，再算準破綻，補刀了結。\n\n一場「一誘一襲」的埋伏，被他反過來，變成了「先斬偷襲、再收殘敵」。\n\n他越打越是心驚——不是驚險，是驚喜。\n\n原來這世上的爭鬥，當真是可以「算」的。旁人打獵，靠的是力氣、是運氣、是九死一生的搏命;而他墨飛，靠的是那一雙看得見「戰力、習性、破綻」的眼睛，把每一場搏命，都拆成了一道可解的算術題。\n\n打不過的，繞開;算得過的，一擊。\n\n到第七頭時，墨飛的動作已行雲流水。他甚至開始有餘裕去「挑」——專挑那些掉落成色好、修為給得多的妖獸下手，把每一分力氣、每一點氣血，都花在最划算的地方。\n\n\n\n他從不硬拚。每遇一頭妖，先讓問道盤讀出戰力、氣血、習性、破綻，再決定打不打、怎麼打。戰力高於他兩點以上、又無明顯破綻的，他繞開；戰力相當或偏低、習性有隙可乘的，他就算準時機，一擊，或幾擊，取其性命。\n\n打不過的算過去，算得過的打過去。\n\n一個上午，他獵殺七頭低階妖，修為蹭蹭往上漲，眼看就要摸到煉氣二層的門檻。他找了處背風的石凹，就著乾糧歇腳，順手清點掉落——妖皮、妖骨、還有兩枚成色不差的下品靈石。\n\n「靈石。」墨飛捏著那兩枚溫潤的石子，心頭火熱。\n\n修士的一切——功法、丹藥、裝備——都要靈石換。他一個廢根、一介白身，如今總算攢下了第一筆「本錢」。\n\n他正盤算著這點靈石夠不夠去鎮上萬寶閣分號換一部像樣的外功，忽然，額心的問道盤，毫無預兆地，猛跳了一下。\n\n不是偵測到功法的那種輕跳。\n\n是一種……墨飛從未見過的、帶著寒意的警示。\n\n盤面驟然浮出一行猩紅的字：\n\n【警示:偵測到高危目標接近】\n【？？？　│　煉氣三層 · 變異　│　戰力 47】\n〔血厚攻升，遠超同階;此為「變異妖」——莫要輕近〕\n\n墨飛的心，一下子沉到了谷底。\n\n戰力四十七。\n\n他此刻不過煉氣一層、將破二層，戰力堪堪十來點。四十七——是他的四倍不止。\n\n他猛地抬頭，循著那股寒意望去。\n\n谷口那片濃霧，正被什麼東西自內而外地緩緩推開。一頭比尋常赤睛兔大了三圈的巨影，踏著沉重的步子，一步、一步，走了出來。它渾身赤毛倒豎，雙目不是尋常的紅，而是一種近乎黑的、凝滯的暗紅，獠牙間垂著涎水，每一步落下，地面都微微一顫。\n\n那是同樣的「先蹬後撲」的姿態——可它蓄力的空當，快得墨飛的眼睛幾乎捕捉不到；那撲擊的力道，光是想像，就讓他胸口發疼。\n\n破綻還在。\n\n可這一次，就算算得準——他這副身板，接得住嗎？\n\n墨飛握緊了手裡的斷刀，指節發白。程伯的話在耳邊響起：「打不過就跑，命比什麼都值錢。」\n\n跑，是對的。\n\n可就在他後退半步的剎那，那頭變異赤睛兔猩紅的暗眸，已經死死鎖住了他。\n\n它後腿一沉。\n\n蓄力了。\n\n墨飛的瞳孔驟然收縮——來不及跑了。\n\n問道盤上，那行猩紅的戰力，刺得他眼睛生疼。\n\n而他腦子裡，卻異常地、冷靜地，飛快轉起了另一本帳：\n\n它撲擊必經的直線、他厚土樁能扛下的傷害上限、腰間那三枚止血丹、斷刀能切入的唯一空當……\n\n「打不過。」墨飛盯著那頭撲來的龐然巨物，喉頭乾澀，卻在心底一字一頓，\n\n「——那就算著打。」"}, {"t": "第六章 算著打", "c": "那頭變異赤睛兔後腿一沉，蓄力的剎那，墨飛的世界，靜了下來。\n\n不是真的靜。是他把所有雜念——恐懼、程伯的叮囑、逃跑的本能——統統掃出腦海，只剩下一本冷冰冰的帳，在心裡飛快地翻。\n\n它的戰力四十七，我十二。硬接必死。\n\n但它是「變異」，不是「異種」——習性不變，還是先蹬後撲。撲擊走直線，直線就有起點、有終點、有落點。\n\n我算不過它的力，我算它的『線』。\n\n問道盤上，那頭巨兔的資訊在他眼底一字排開：血厚、攻高、防同樣厚了三分，唯獨——身形依舊笨重，撲出之後，收勢極慢。\n\n一撲落空，它至少要一息才能調頭再起。\n\n一息。對墨飛來說，夠了。\n\n「來。」墨飛沒有退，反而向前墊了半步，把自己送進那條撲擊必經的直線上——像一塊主動擺上砧板的肉。\n\n變異赤睛兔暗紅的眸子裡閃過一絲近乎人性的獰笑。它猛地蹬地，赤紅的龐軀化作一道血影，裹著撕裂空氣的尖嘯，直直撲向墨飛的咽喉。\n\n快。\n\n比尋常赤睛兔快了何止一倍。墨飛甚至能感到那撲擊帶起的勁風，已經割得他臉頰生疼。\n\n可他算準了。\n\n就在血影臨體、獠牙即將咬穿他喉管的前一線，墨飛的身子詭異地向側後方一沉——不是閃，是「卸」。他順著那撲擊的直線，往斜下方一滾，肩頭擦著兔腹的赤毛滾了過去，泥水濺了滿身。\n\n咔嚓!\n\n變異赤睛兔撲了個空，那雷霆萬鈞的一擊，結結實實砸在墨飛方才立足的青石上。碗口粗的石頭應聲炸裂，碎屑四濺——那要是砸在人身上，血肉之軀，連渣都不剩。\n\n而它，正如墨飛所算——收勢不及。\n\n龐大的身軀因慣性向前衝出半丈，四肢在濕滑的泥地上刨動，笨拙地想要調頭。\n\n一息的破綻，露了出來。\n\n墨飛滾地的動作沒有停。他借著翻滾的勁，一個鯉魚打挺竄起，斷刀在手，不去砍那厚甲般的兔背，而是精準地、狠狠地，捅向變異兔後腿內側——那根牽動「蹬地蓄力」的筋腱。\n\n問道盤早替他標好了那個位置:〔要害:後肢筋腱。斷之，則撲擊之力去半。〕\n\n噗嗤。\n\n斷刀沒入。變異赤睛兔發出一聲淒厲到變調的嘶鳴，那條後腿一軟，龐大的身子歪斜地砸進泥裡。\n\n墨飛卻沒有半分得手的欣喜。他早算到了——這一刀傷不了它的命，只會激怒它。\n\n果然，變異兔暴怒地一甩頭，那對獠牙帶著腥風橫掃而來。墨飛躲避不及，被掃中左臂，一股大力將他掀飛出去，重重摔在一叢灌木裡。\n\n【氣血 37 → 19】\n\n半條命，沒了。\n\n墨飛嘴角溢出血絲，撐著手臂想爬起，左臂卻一陣鑽心的疼——脫臼了。他悶哼一聲，右手死死攥住斷刀，抬眼盯著那頭一瘸一拐、卻仍向他逼近的龐然巨物。\n\n十九點氣血。再挨一下，他就要交代在這兒了。\n\n逃?它雖傷了一腿，可撲擊之力仍在他之上，他這副摔散了架的身子，跑不過。\n\n「……程伯，」墨飛咧開染血的嘴，低低地笑了一聲，「你那句『打不過就跑』，這回怕是要失靈了。」\n\n他強撐著站直，將問道盤上那頭兔子的每一個數字，最後過了一遍——\n\n血厚，但那一刀斷了筋腱，撲力已去大半;攻高，但它此刻只剩三條腿，起勢比方才慢了；它暴怒，暴怒的東西，只會直來直去。\n\n它還能撲最後一次。撲完，就再也起不來。\n\n而我，只夠再扛最後一次。\n\n一換一。\n\n墨飛的呼吸沉了下去。他把斷刀反握，刀尖朝下，貼著小臂，擺出一個連他自己都覺得笨拙的、玉石俱焚的架勢。他把《厚土樁》的常駐防禦、把身上僅剩的十九點氣血、把腰間最後一枚止血丹，全都算進了這一撲裡。\n\n「來吧。」他盯著那雙暗紅的眸子，一字一句，「這一下，我讓你。」\n\n變異赤睛兔嘶吼著，用盡最後的兇性，拖著殘腿，向墨飛發起了最後一撲。\n\n這一次，慢了。\n\n在墨飛被放大到極致的視野裡，那撲擊的血影，慢得像浸在濃稠的糖漿裡。他看清了它咬來的角度、看清了它獠牙間的涎水、看清了它咽喉下方那片赤毛稀疏、防禦最薄的死穴。\n\n他沒有躲。\n\n他迎了上去。\n\n用左肩，硬生生扛下那一口獠牙——劇痛炸開，血肉翻飛，氣血瘋狂跌落：\n\n【氣血 19 → 3】\n\n只剩三點。一步之遙，就是黃泉。\n\n可就在獠牙咬穿他左肩的同時，墨飛反握的斷刀，也帶著他全身的重量、全部的算計、還有一個廢根少年不肯認命的全部倔強——\n\n自下而上，捅進了那片稀疏赤毛下的死穴。\n\n刀，沒柄。\n\n變異赤睛兔龐大的身軀劇烈一顫，暗紅的眸子驟然睜到極致，隨即，那點兇厲的光，一寸一寸地，黯了下去。\n\n它龐大的身子往前一栽，將墨飛整個壓在身下。\n\n一人一兔，倒在血泊與泥濘裡，都不動了。\n\n——\n\n不知過了多久。\n\n墨飛在一頭死兔的重壓下，艱難地睜開眼。他還活著。三點氣血，像風中殘燭，卻，還亮著。\n\n他用僅剩的右手，摸索著掏出最後那枚止血丹，塞進嘴裡。清涼的藥力化開，翻湧的傷勢被強行按住，氣血總算不再往下掉。\n\n而就在藥力入腹的同時，他眼前那方問道盤，爆發出前所未有的、明亮的光——\n\n【擊殺 變異·赤睛兔（越級）】\n【修為 +860!　│　越級擊殺，豐厚加成】\n【氣血、法力回復】\n【福緣觸發·稀有掉落——】\n\n墨飛的心跳，漏了一拍。\n\n那行字之後，緩緩浮出一卷散發著幽幽綠光的虛影:\n\n《木靈訣（殘）》　內功型 · 木　│　凡品·稀有\n常駐:防禦、掛機自療（回氣血/法力）\n啟用效果:每回合回復氣血/法力、暫增根骨\n〔木系內功·稀有。此類功法不入商鋪，唯機緣可得——拿到，是運氣，更是掙來的〕\n\n墨飛怔怔地看著那行「唯機緣可得」，又看看身下這頭差點要了他命的變異巨兔，忽然就笑了。\n\n笑得渾身傷口崩裂，笑得眼淚混著血水往下淌。\n\n「回血。」他喃喃，聲音抖得不成樣子，卻亮得驚人，「一部……會回血的內功。」\n\n他這一路，最缺的是什麼?是命。是那薄如紙的氣血，是每一場仗都要拿半條命去換的窘迫。\n\n而此刻，天道——或者說，他自己拿命拚來的機緣——遞給他的，恰恰是一部能讓他「邊打邊回」的木系內功。\n\n「別人靠天賦，」墨飛仰躺在血泊裡，望著落霞谷斑駁的天光，一字一句地對自己說，「我墨飛……」\n\n「靠撿。靠算。靠一條命換一條路。」\n\n他闔上眼，將那卷《木靈訣》的殘影，緩緩納入識海。問道盤上，他的功法欄，又多了一部——修練、內功土、如今再添內功木。\n\n三部功法，一步步搭起來的，是一個廢根少年，在這弱肉強食的仙途上，第一個真正屬於自己的「配置」。\n\n而在他昏睡過去之前，識海最深處，那方問道盤的邊緣，極其隱晦地、一閃而逝了一行連它自己都彷彿在遲疑的字——\n\n〔宿主道途初現……問道之路，始於一算。〕\n\n墨飛沒有看見。\n\n他睡著了。在一頭被他「算」死的變異妖身旁，睡得又沉又香，像個終於掙到了明天的、尋常的少年。\n\n——\n\n再醒來時，天光已斜。\n\n墨飛在那頭死兔身下掙了半天，才把自己從冰冷僵硬的軀體下拖出來。左肩的獠牙傷口猙獰可怖，可有《木靈訣》那一縷剛入體的、生生不息的木靈之氣溫養著，血竟已止住，傷口邊緣甚至泛起一層極淡的新肉。\n\n「這東西……」墨飛咧嘴，牽動傷口，倒抽一口涼氣，卻仍忍不住嘖嘆，「比程伯的金瘡藥還好使。」\n\n他試著把《木靈訣》啟用，那股溫潤的暖流便在體內緩緩流轉，一絲一縷地，替他填補著虧空的氣血。問道盤上，那行【氣血】的數字，竟真的在自己往上爬——雖然慢，卻是實實在在的「不必吃藥，也能回」。\n\n墨飛盤膝坐了小半個時辰，把身子將養到勉強能行動，這才起身，開始「清點戰場」。\n\n變異赤睛兔的軀體是好東西。妖丹、妖皮、筋骨，樣樣值錢。他忍著渾身的痛，用斷刀笨拙地剖取，一邊割，一邊在心裡把問道盤標出的價值一筆筆記下——這一頭變異妖身上的收穫，抵得上他這幾日獵殺的所有低階妖加起來還多。\n\n尤其那枚拳頭大小、內蘊暗紅光華的變異妖丹，問道盤給出的批註是:〔可換不菲靈石，或供煉丹、淬體之用〕。\n\n「發了。」墨飛把妖丹揣進懷裡，貼著心口，隔著粗布衣衫，都覺得燙手。\n\n他這一趟落霞谷，出來時是個攢下兩枚下品靈石就沾沾自喜的白身;回去時，懷裡揣著一枚變異妖丹、一部稀有的木系內功、一身雖重卻甘之如飴的傷。\n\n夕陽把他的影子拉得很長。他一瘸一拐地往鎮子的方向走，背著沉甸甸的收穫，走得緩慢，卻一步比一步穩。\n\n路過谷口那塊被變異兔一撲砸碎的青石時，墨飛停了停。\n\n他低頭看著那攤石屑，又抬手摸了摸自己還在隱隱作痛的左肩，忽然明白了一件事——\n\n方才那一戰，他若早一步逃、晚一息算、或是少了《厚土樁》墊底、《木靈訣》續命，他此刻就已經是這攤石屑旁的一具冷屍。\n\n天賦，他沒有。可他有一雙看得見帳的眼睛，有一顆肯拿命去算的心，還有——他低頭看了看識海裡那三部拼湊來的功法——一件件撿來、算來、拚來的「配置」。\n\n「這條路，」墨飛望著鎮子上空第一縷升起的炊煙，輕聲道，「我走得通。」\n\n他頓了頓，又補了一句，像是說給那方沉默的問道盤聽，也像是說給那個曾經在測靈石前被判了死刑的自己聽:\n\n「而且，我還要走到——那些天才們，抬頭才看得見的地方。」\n\n炊煙嫋嫋。少年負傷而歸。\n\n青石鎮不會知道，今日走進鎮門的這個搗藥廢材，懷裡揣著的，是他往那萬丈仙途上，踏出的、第一塊真正屬於自己的墊腳石。"}, {"t": "第七章 萬寶閣", "c": "墨飛是半夜摸回濟生堂的。\n\n他不想驚動旁人——一個「墜崖生還」的廢材，隔幾日又背著一身血傷、揣著變異妖丹回來，這要是傳出去，青石鎮能嚼上半年的舌根。\n\n可他推開後院柴門時，程伯已經拄著杖，站在院中的老槐樹下等他了。\n\n老人沒問他去了哪、遇了什麼。渾濁的目光只在他血透的左肩上一掃，眉頭便擰成了疙瘩:「進來。」\n\n濟生堂的燈重新點亮。程伯替他解衣、清創、上藥，手法又快又穩。當那道被獠牙咬穿的肩傷完整地暴露出來時，老人的動作，卻頓住了。\n\n那傷口，本該深可見骨、血肉翻捲。可此刻，創面邊緣竟已生出一層薄薄的、透著生機的嫩肉，隱隱有青綠色的靈氣在皮下游走。\n\n「木靈之氣。」程伯的聲音，忽然低了下去，也……穩了下去。那一瞬間，墨飛分明覺得，眼前這個嘮叨的跛腳老頭，像是換了一個人。\n\n「你，得了木系的護體功法?」\n\n墨飛心頭一凜。他還沒開口說功法的事。\n\n「一部殘卷。」他斟酌著答，「落霞谷……一頭變異妖身上掉的。」\n\n程伯沉默了很久。久到藥碾子上的燈花結了又落。他枯瘦的手指，極輕地拂過墨飛肩上那層新生的嫩肉，眼神悠遠得彷彿穿透了濟生堂的屋頂，望向了某個極遙遠的、墨飛無從想像的過往。\n\n「木系內功……稀有得很。」老人終於開口，聲音沙啞，「這類養命的功法，天道最是吝嗇，尋常修士窮其一生也未必得見一部。你一個剛入煉氣的……倒是好機緣。」\n\n「程伯，」墨飛忍不住問，「你怎麼……懂這些?」\n\n濟生堂裡靜了一瞬。\n\n程伯像是被這一問驚醒，臉上那份深沉悠遠，眨眼間又化回了尋常老頭的嘮叨。他把藥碗往桌上重重一擱，沒好氣道:「老頭子在這鎮上待了三十年，南來北往的修士見得多了，聽也聽會了!怎麼，你還想考較起我來?」\n\n「趕緊把藥喝了，睡覺!」\n\n墨飛沒再追問。可他把這一夜——程伯看見木靈之氣時那瞬間的「變」、那句「天道最是吝嗇」的了然——一併壓進了心底那本「關於程伯」的帳裡。\n\n那本帳，已經記了兩筆:問道盤看不透他;他懂得，遠比一個鎮醫該懂的多。\n\n墨飛端起藥碗，一飲而盡。苦。可他心裡是熱的。\n\n——\n\n養傷三日，墨飛把《木靈訣》練得初通。有了這部「邊打邊回」的內功，他只覺得腰桿都硬了幾分。\n\n第四日，他揣上那枚變異妖丹，去了鎮東的萬寶閣分號。\n\n青石鎮的萬寶閣，不過是總閣灑在偏鄉的一粒芝麻，小小一間鋪面。可對墨飛而言，這已是他此生見過最「大」的地方——修士的一切，功法、丹藥、法寶、裝備，都在這方寸櫃檯間流轉。\n\n跨進門檻，一股清冽的靈氣撲面而來。櫃檯後坐著個打瞌睡的青衫老者，是分號掌事，煉氣後期。牆上懸著琳琅滿目的木牌，標著各色貨品與價碼。\n\n墨飛的問道盤，在這一刻，成了他最鋒利的兵器。\n\n旁人進當鋪、進商鋪，最怕的是「不識貨、被人宰」。可墨飛不同。他目光一掃，那些貨品的真實價值、那枚妖丹的公道行情，便清清楚楚地攤在他眼前——誰也別想糊弄他一分一毫。\n\n「掌事，」他把變異妖丹擱上櫃檯，「換靈石。」\n\n青衫老者掀起眼皮，本是懶洋洋的，可一觸到那枚妖丹內蘊的暗紅光華，瞌睡瞬間醒了大半。他取出一方玉盤驗看，指尖微顫:「變異妖丹?成色還這般足……小子，你哪來的?」\n\n「落霞谷撿的。」墨飛答得平淡，「掌事只管開價。公道，我就換;不公道——」他抬眼，笑意溫吞，「隔壁鎮的萬寶閣，想來也收。」\n\n老者被他一噎，又深深看了他一眼。這少年一身粗布、面帶稚氣，偏偏那雙眼睛亮得瘮人，開口閉口不卑不亢，竟半點不像個鄉下白身。\n\n「……罷了。」老者報了個價，「三百下品靈石。看你順眼，多添二十。」\n\n墨飛心裡的帳早算好了——這妖丹的公道價，正在三百上下。老者沒宰他，那多添的二十，是識趣，也是拉攏。\n\n「成交。」\n\n三百二十枚下品靈石入袋，沉甸甸的。墨飛只覺得，這輩子從沒這麼有底氣過。\n\n他沒急著走。有了本錢，他要辦正事——補一部外功。\n\n他的三部功法:修練養道、內功護身、內功回血。可他至今沒有一部像樣的「殺招」。落霞谷那一戰，他全靠一柄斷刀和算計硬撐，太險。他需要一部能主動施放、能傷敵於身前的外功法術。\n\n他走到功法書鋪的木架前，問道盤逐一掠過那些功法書，將它們的類型、元素、傷害、耗法、學習費，一一在他眼前排開——\n\n哪一部划算、哪一部虛高、哪一部與他現有的搭配相剋或相成，纖毫畢現。\n\n尋常修士買功法，如同盲人摸象，全憑掌事一張嘴、自身一點運。墨飛卻像在自家藥櫃前抓藥——君臣佐使，配伍分明。\n\n最終，他的目光，落在一部並不起眼、卻被問道盤標出「性價比最高」的功法上:\n\n《裂石訣》　外功型 · 金　│　凡品\n啟用:單體攻擊，破甲，無視部分防禦\n常駐:傷害力（小）　│　耗法適中\n學習費:一百二十下品靈石\n\n「金系，破甲。」墨飛眼睛一亮。\n\n他現有的內功偏防偏補，獨缺一記能「洞穿高防」的攻手。而金系外功「無視部分防禦」的特性，恰恰能補上這塊短板——尤其對付落霞谷那些防禦厚實的變異妖，再合適不過。\n\n更妙的是，金系外功的「常駐傷害力」，與他日後可能習得的金系內功「攻擊+穿透」隱隱相成。他在心裡把這一部功法，穩穩地嵌進了自己那套「配置」的空缺裡。\n\n「掌事，」墨飛把一百二十枚靈石推上櫃檯，「這部，我要了。」\n\n青衫老者替他辦妥手續，又忍不住多嘴:「小子，你這眼光……嘖。尋常煉氣修士，買功法只挑威力最大的，個個貪高求猛，買回去卻與自身功法相沖，徒耗靈石。你倒好，專挑這『不起眼卻合用』的。」\n\n他瞇著眼，意味深長:「這份『識貨』的本事，可比你這煉氣境界，值錢多了。」\n\n墨飛心頭一動，面上卻只是笑笑:「掌事過獎。我不過是……窮怕了，不敢亂花錢罷了。」\n\n他將《裂石訣》殘卷收入懷中，轉身出了萬寶閣。\n\n門外，青石鎮的市集人聲鼎沸，一如往常。可墨飛知道，有些東西，已經不一樣了。\n\n他懷裡揣著兩百枚靈石、一部新到手的外功。識海裡，問道盤靜靜浮著他此刻的【戰力】——比起三日前，又漲了一截。\n\n而更重要的是，他終於湊齊了一套雖然簡陋、卻五臟俱全的「配置」:修練養道、金外攻堅、土內護體、木內續命。\n\n攻、防、補、養，四角俱全。\n\n「一部一部撿，一分一分算。」墨飛走在熙攘的市集裡，低聲對自己說，唇角壓著一絲連他自己都沒察覺的、屬於少年的鋒芒，\n\n「趙元，你那金根中上的天賦，再等等。」\n\n「等我這套『雜家』的配置，配齊了——」\n\n「我讓你看看，什麼叫『算著打』。」\n\n——\n\n出了萬寶閣，墨飛沒回鋪子，徑直往鎮外的荒坡去了。\n\n新到手的功法，得先「試」過，心裡才踏實。這也是問道盤給他養出的習慣——旁人學了功法，只知威力幾何全憑感覺；他卻要親眼看著那串數字，才肯認帳。\n\n荒坡無人。墨飛依《裂石訣》的口訣，將法力自丹田引出，順著金系特有的、鋒銳凜冽的路徑，凝於右掌。\n\n這是他第一次施法。\n\n那股法力在掌心凝了三息，化作一枚拇指大小、通體流轉著金屬冷光的氣刃。墨飛心念一動，氣刃「嗤」地激射而出，正中十步外一塊半人高的青石——\n\n咔嚓!\n\n青石應聲裂開一道深痕，碎屑迸濺。\n\n墨飛的呼吸粗重了幾分。他低頭去看問道盤——那上面，一行嶄新的數字正跳動著:\n\n【施展《裂石訣》　│　法術攻擊 生效】\n【對 青石 造成傷害:破甲·無視部分防禦】\n【法力 18 → 11】\n\n「破甲。」墨飛盯著那道裂痕，眼底發亮。\n\n尋常的攻擊，砍在防禦厚實的目標上，總要被「防」去一截。可這金系外功「無視部分防禦」的特性——那道劈開青石的裂痕，就是明證。它像一把鑿子，專鑿旁人鑿不透的硬殼。\n\n他又試了兩回，把耗法、冷卻、傷害的數字，一一在心裡記牢。法力見底時，那部《木靈訣》的回法之效，又悄悄替他填補了一些——攻與補，在他這套配置裡，第一次咬合了起來。\n\n墨飛滿意地收了功。攻堅有了《裂石訣》，續命有了《木靈訣》，護體有了《厚土樁》，養道有了《吐納訣》。四角俱全，環環相扣。\n\n他正欲回鎮，坡下的官道上，卻遠遠傳來一陣喧鬧。\n\n一隊人馬正往青石鎮的方向去。為首的騎著青鬃馬，一身問劍宗的雲紋弟子服，腰佩長劍，氣度不凡。鎮上的百姓遠遠避讓，指指點點，議論聲隱約飄上坡來——\n\n「聽說了嗎?問劍宗三年一度的招收弟子，這回輪到咱們這一片了……」\n\n「可不是!過幾日就在鎮口設壇考較，凡是煉氣境的少年，都能去試一試!」\n\n「嗨，去了也是白去。人家問劍宗要的是根骨靈根上上之選，咱鎮上……也就趙家那位金根少爺，還有點指望。」\n\n墨飛立在坡上，望著那隊絕塵而去的問劍宗人馬，久久沒有動。\n\n問劍宗。\n\n那是這一片方圓千里之內，最頂尖的修行大宗。是無數青石鎮這樣的小鎮少年，做夢都不敢想的地方。是「天才」們的舞台。\n\n而招收的門檻——根骨、靈根，上上之選。\n\n墨飛低頭，看了看識海裡那行刺眼的〔靈根:駁雜〕、那個一度被判了死刑的〔根骨〕。\n\n換作三月之前，他連湊上去試一試的念頭都不會有。\n\n可此刻——\n\n他握了握拳，掌心裡，那部《裂石訣》餘留的金系氣息，仍在隱隱鼓盪。\n\n「根骨、靈根，上上之選……」他低聲重複著那道門檻，忽然咧開嘴，笑了。笑意裡沒有半分自卑，只有一種近乎張狂的躍躍欲試。\n\n「可惜啊，問劍宗，」他轉身往鎮子走去，背影在夕陽下拉得筆直，\n\n「你們考的是『天賦』——」\n\n「而我墨飛，這輩子，最擅長的，恰恰是把『天賦不夠』這四個字，一筆一筆，算成別的東西。」"}, {"t": "第八章 資質關", "c": "「我想去試問劍宗的招收。」\n\n濟生堂的晚膳桌上，墨飛把這句話擱下時，程伯正夾著一箸青菜。老人的手，頓在半空。\n\n墨飛做好了被潑冷水的準備。以他這駁雜靈根、孱弱根骨去試問劍宗——傳出去，是要被人笑掉大牙的。連他自己都覺得，這念頭近乎癡妄。\n\n可他忘不了荒坡上那道劈開青石的金光，忘不了落霞谷裡那頭被他「算」死的變異妖。他心裡有個聲音，越來越響:別人考天賦，我考我的『算』。憑什麼不能去?\n\n程伯沉默了很久。久到墨飛以為他不會答了。\n\n「你可知道，」老人終於開口，聲音很輕，「問劍宗的招收考較，第一關，便是『資質測』?比鎮口那塊測靈石，還要精準百倍。」\n\n「知道。」\n\n「你那駁雜之根，在那儀器前，會被照得一絲不剩。上百雙眼睛看著，你會很難堪。」\n\n「我知道。」墨飛放下碗筷，抬眼，目光清亮而堅定，「程伯，我這輩子，被人看不起的難堪，早受夠了。多這一回，不多。」\n\n「可要是連試都不試——」他頓了頓，一字一句，「我怕我這輩子，都要在濟生堂的藥碾子邊，想著『當初若是去了會怎樣』。」\n\n「那種難堪，才是真的，一輩子。」\n\n濟生堂裡靜下來。油燈的火苗跳了跳，映著老人溝壑縱橫的臉。\n\n良久，程伯放下筷子，長長地、長長地嘆了一口氣。那嘆息裡，有擔憂，有無奈，卻更多的，是一種墨飛看不懂的、近乎欣慰的釋然。\n\n「罷了。」老人喃喃，「是老頭子我，小看你了。」\n\n他拄杖起身，一瘸一拐地進了裡屋。窸窸窣窣一陣翻找後，他捧著一個物件出來，擱在桌上，推到墨飛面前。\n\n那是一只樣式極古樸的、暗青色的布袋，巴掌大小，袋口以一縷不知名的絲線束著，摸上去，竟有種說不出的溫潤。\n\n墨飛的問道盤，驟然一跳。\n\n【納物袋（舊）　│　品階:遠超凡品】\n〔內蘊獨立空間，可儲納物件。此物來歷……問道盤無法盡窺〕\n\n墨飛的呼吸一滯。\n\n又是「無法盡窺」。\n\n儲物法器!這是連煉氣期修士都未必用得起的東西——尋常修士出行，背筐挑擔;有一只儲物袋，便是身份與底蘊的象徵。而問道盤竟說它「遠超凡品」、「來歷無法盡窺」?\n\n一個鎮上的跛腳老鎮醫，怎麼會有這種東西?\n\n「程伯，這……」\n\n「老頭子年輕時，四處遊方行醫，一個路過的修士，拿它抵了一副救命的藥。」程伯答得平淡，平淡得近乎刻意，「擱在我這兒也是壓箱底，你拿去。出門在外，總比背個破筐體面。」\n\n墨飛盯著那只納物袋，又抬眼望向程伯。老人的目光，坦然得沒有一絲破綻——正因為太坦然、太滴水不漏，反倒讓墨飛心底那本「關於程伯」的帳，又重重地添了一筆。\n\n問道盤看不透的老人，懂得遠超鎮醫的修行見識，如今，又拿出一件「遠超凡品」的法器。\n\n這三筆帳串在一起，指向的，絕不是一個尋常的跛腳鎮醫。\n\n可墨飛什麼都沒問。他只是伸出雙手，鄭重地，接過了那只溫潤的納物袋。\n\n「謝謝程伯。」他說得很輕，卻很重。\n\n程伯別過臉，擺擺手，聲音又恢復了那副嘮叨的凶巴巴:「謝什麼謝!考不上，滾回來繼續搗你的藥!考上了——」\n\n老人的聲音，在這裡忽然低了下去，低得幾乎融進了油燈的噼啪聲裡:\n\n「……考上了，就替老頭子，好好去看看那外面的天。」\n\n墨飛重重地點頭。他沒有聽見，老人在轉身回屋時，那聲幾不可聞的、蒼老的呢喃——\n\n「墨家的種……到底，還是要飛的。」\n\n——\n\n三日後，鎮口。\n\n問劍宗招收弟子的考壇，設在了那棵老槐樹下——正是墨飛當初被測靈石判了「廢根」的地方。\n\n命運兜兜轉轉，又把他送回了這裡。只是這一次，他的腰間，多了一只納物袋;他的識海裡，多了一方問道盤，和四部拼湊來的功法。\n\n考壇周圍，人山人海。方圓百里的煉氣少年，都聚到了這裡，個個摩拳擦掌，眼中燃著對問劍宗的熱望。人群外圍，更擠滿了看熱鬧的鄉民。\n\n高台上，端坐著三位問劍宗的執事，為首的正是那日騎青鬃馬的雲紋弟子，築基修為，神情淡漠。台側，立著一具通體瑩白、遍布靈紋的玉柱——那便是「資質測」的儀器，「照靈鏡」。\n\n「趙元。」\n\n錦衣的趙元第一個被喚上台。他志得意滿，手掌往照靈鏡上一按——\n\n鏡中金光大放，一道凝練的金色光柱沖天而起，久久不散!\n\n「金根中上，根骨上乘!好苗子!」為首的執事眼中終於有了幾分神采，當場取出一枚問劍宗的白玉弟子令，「直入外門，免試!」\n\n滿場譁然，羨慕的目光如潮水般湧向趙元。趙元傲然環視，那目光掃過人群，最終，又一次落在了墨飛身上——這一回，多了幾分毫不掩飾的譏誚。\n\n「喲，搗藥的?」他揚聲，故意讓四周都聽見，「你也來試問劍宗?我當你有多大能耐，墜個崖還沒摔死。怎麼，想上來給咱們添個笑話?」\n\n哄笑聲，如三月前那般，再次響起。\n\n墨飛立在人群裡，面色不變。他只是靜靜地凝視著台上那具照靈鏡，又在心底，把趙元方才那道「金色光柱」的凝練程度，默默估了個數。\n\n輪到他了。\n\n「墨飛。」執事念到這個名字時，語氣裡已帶了三分不耐——顯然，這個「墜崖廢材」的名聲，已經傳到了他耳中。\n\n墨飛深吸一口氣，在滿場或譏誚、或看笑話、或漠然的目光中，一步一步，走上了考壇。\n\n他抬起手，掌心，貼上了那具冰冷的照靈鏡。\n\n全場的目光，都聚了過來。\n\n墨飛能感覺到，自己識海裡那駁雜的五色靈根，正被這具遠比測靈石精準的儀器，一絲不剩地照出、剖開、攤在天光之下。\n\n他知道接下來會發生什麼。\n\n照靈鏡的光，亮起——五色。\n\n然後，如三月前的測靈石一般，那五色，一起黯淡、攪渾、熄滅，化作一團誰也壓不過誰的、可悲的灰白。\n\n鏡面嗡了兩聲，竟連一根光柱都凝不起來。\n\n「駁雜之根，五行俱雜——」執事的聲音，冷得像冰，帶著毫不掩飾的鄙夷，「連凝光都做不到。此等資質……也敢來試問劍宗?」\n\n「哈哈哈哈!」趙元第一個放聲大笑，「我就說吧!搗藥的，回你的濟生堂去!問劍宗，不是你這種廢根待的地方!」\n\n哄笑聲，如雷。無數道鄙夷、嘲弄、看好戲的目光，如針一般，扎在墨飛身上。\n\n換作三月前，墨飛或許已經無地自容，狼狽逃離。\n\n可此刻，他立在那團熄滅的灰白光芒中，脊背挺得筆直。他甚至……笑了。\n\n那笑容，讓台上鄙夷的執事微微一怔，讓放聲大笑的趙元，莫名地，收了聲。\n\n「執事，」墨飛開口了，聲音不大，卻異常清晰地傳遍了鴉雀無聲的考壇，「資質關，我認了。我這根，是廢的。」\n\n他頓了頓，抬眼，目光直直望向那位築基執事，一字一句:\n\n「可我聽說，問劍宗招收，除了資質關——」\n\n「還有一關，叫『實戰』?」\n\n——\n\n「實戰?」台上的築基執事挑了挑眉，似乎沒料到這廢根少年，被當眾羞辱至此，竟還能不卑不亢地問出這麼一句。\n\n他身側一位執事湊過來，低聲道:「按宗規，招收確有『實戰關』——資質未達直入之選者，可入實戰場，擊敗指定對手或斬殺指定妖獸，以戰功補資質之不足。只是……」\n\n他掃了墨飛一眼，嗤笑:「歷來走這一關的，多是資質中平、卻有幾分苦練之力的。似他這般連光柱都凝不起的廢根，走實戰關，無異於自取其辱。」\n\n築基執事沉吟片刻。他本欲一口回絕，可對上墨飛那雙清亮得近乎放肆的眼睛，心底莫名生出一絲異樣——這少年的眼神，太靜了。靜得不像一個剛被當眾羞辱、行將被趕下台的廢材，倒像一個……早已把接下來的一切，都算計好了的獵手。\n\n「也罷。」執事終於開口，語氣裡帶著一絲看戲的意味，「宗規既有此例，本執事便不駁你。實戰關，即刻開始。」\n\n他大手一揮，考壇旁的空地上，靈光一閃，一座百丈方圓、四面立著隔絕靈氣的光牆的「實戰場」，憑空浮現。\n\n「規矩很簡單。」執事朗聲道，聲音傳遍全場，「入場者兩兩相搏，點到為止，認輸、出界、或喪失戰力者，判負。連勝三場者，得入外門。」\n\n他頓了頓，目光似笑非笑地落在墨飛身上:「至於對手——抽籤定之。生死各安天命，場中不論資質，只論輸贏。」\n\n此言一出，全場譁然。\n\n「兩兩相搏?那廢根豈不是……」\n\n「連勝三場才能入門?就他?一場都撐不過吧!」\n\n人群裡，趙元笑得前仰後合:「妙啊!實戰關!搗藥的，我倒要看看，你連光柱都凝不出來的廢根，拿什麼跟人打!別到時候被一拳打趴，哭著喊娘啊哈哈哈——」\n\n墨飛對這些議論充耳不聞。\n\n他的目光，已經越過喧鬧的人群，落在了實戰場另一側那些同樣要走「實戰關」的少年身上。他的問道盤，正無聲地掃過他們每一個人——\n\n【少年甲　│　煉氣二層　│　戰力 23　│ 起手偏猛，重攻輕守】\n【少年乙　│　煉氣一層　│　戰力 15　│ 身形靈巧，善纏鬥】\n【少年丙　│　煉氣三層　│　戰力 34　│ 修習一部火系外功，遠攻為主】\n\n一個個對手的底細，連同他們的戰力、習性、破綻，都清清楚楚地，攤在了墨飛的眼前。\n\n這是一場，別人蒙著眼睛打，而他，睜著眼睛算的仗。\n\n執事捧出一只竹筒，內盛刻名竹籤:「抽籤——定首戰之敵。」\n\n墨飛上前，探手入筒。指尖觸到竹籤的剎那，他心念微動——問道盤雖不能替他作弊，卻能在他抽出竹籤、看清名字的第一時間，便把那名字背後的一切，盡數奉上。\n\n他抽出一支，展開。\n\n竹籤上，一個名字。而幾乎同時，他識海裡的問道盤，已亮起一行——\n\n【首戰對手:趙元　│　煉氣二層　│　戰力 21】\n〔慣用右手，起手偏右下路;身形3，閃避平庸;新得金系外功一部，恃強好勝，必求速勝〕\n\n墨飛捏著那支竹籤，緩緩抬起頭。\n\n考壇對面，趙元也剛剛看清了自己抽中的對手，臉上那嘲弄的笑，一瞬間僵住，隨即化作一種「天助我也」的猙獰狂喜。\n\n「哈!老天有眼!」趙元大笑著跨進實戰場，金光在他掌心凝聚，「搗藥的，是你自己撞上來的!今日，我就當著全鎮的面，把你這廢根，打回你的藥碾子邊去!」\n\n四周，是山呼海嘯般的哄笑與叫好。\n\n墨飛卻在這一片喧囂中，慢慢地，笑了。\n\n他一步跨進實戰場，與趙元遙遙相對。他將腰間那柄不起眼的斷刀握入手中，識海裡，四部功法悄然運轉——土內護體、木內續命、金外攻堅、修練養道，四角俱全，嚴陣以待。\n\n他望著對面那張志得意滿的臉，望著那個曾經無數次踐踏他尊嚴的名字，一字一句，輕聲道:\n\n「趙元。」\n\n「我等這一場，等了很久了。」"}, {"t": "第九章 算著打臉", "c": "「開始!」\n\n執事一聲令下，趙元便迫不及待地動了。\n\n正如問道盤所料——恃強好勝，必求速勝。他右足一蹬，身形化作一道錦色殘影，右掌金光暴漲，一記凝了金系外功的掌刃，直取墨飛面門。起手，果然偏右下路。\n\n快，且狠。這一掌若實實砸中，饒是墨飛有《厚土樁》護體，也要被打得七葷八素。\n\n四周的哄笑聲還沒落下，眾人只當這一掌下去，那廢根便要被轟出場外。\n\n可墨飛沒有硬接，也沒有慌亂後退。\n\n在趙元掌刃臨體的前一瞬，他的身子如落霞谷中卸開變異兔那一撲時一般，向著趙元「右下路」的反方向——左上，微微一斜。\n\n不多。只斜了半尺。\n\n卻恰恰讓那勢在必得的一掌，擦著他的耳際，轟然掠過，砸在身後的光牆上，激起一片刺目的金色漣漪。\n\n「——!」趙元一擊落空，微微一愣。\n\n就這一愣。\n\n墨飛的問道盤，早已把趙元這一掌「起手偏右下路、收勢時右肩微沉」的破綻，標得清清楚楚。他等的，就是這對方舊力已盡、新力未生的剎那。\n\n他沒有用斷刀。他抬起右掌——一枚凝練的金系氣刃，《裂石訣》，無聲激射!\n\n破甲。無視部分防禦。\n\n趙元護體的靈氣剛剛因那一掌落空而鬆懈，這枚氣刃便如鑿子鑿透薄冰般，穿過他倉促凝起的護體光暈，狠狠打在他右肩上。\n\n「嘶——!」趙元一聲悶哼，踉蹌後退，右臂一麻，那點錦衣被氣刃割開一道口子，滲出血來。\n\n全場的哄笑，戛然而止。\n\n死一般的寂靜，籠罩了考壇。所有人都瞪大了眼睛，難以置信地看著場中——那個連光柱都凝不出的廢根，竟一招之間，傷了金根中上的趙家少爺?\n\n台上，那位一直神情淡漠的築基執事，身子微不可察地前傾了幾分，眼中，第一次露出了一絲真正的興味。\n\n「你——!」趙元又驚又怒，一張臉漲得通紅。他堂堂金根中上，竟在一個廢根手上吃了虧，這比殺了他還難受，「僥倖!不過是僥倖!」\n\n他咆哮著，不再輕敵，金系外功盡數催發，掌刃連綿，如暴雨般向墨飛攻來。這一次，他學乖了，攻勢兇猛卻不再一味求快，虛實相間，想逼墨飛露出破綻。\n\n墨飛卻不與他硬拚。\n\n他戰力終究比趙元低了幾分——這是問道盤攤在他眼前、無法作弊的事實。可「戰力低」，從來不等於「打不贏」。\n\n他只做一件事:算。\n\n趙元每一掌的角度、力道、收勢的間隙，都被問道盤拆解成一串串清晰的數字，在他眼前流淌。他不去接那些兇猛的實招，只以最小的動作卸、避、讓，把自己那薄弱的氣血，一分一毫地省著用;而每當趙元一輪攻勢舊力用盡、露出那半息的破綻，他的《裂石訣》，便如附骨之疽，精準地啄上一記。\n\n一記，不重。破甲的氣刃，傷不了趙元的命。\n\n可十記呢?二十記呢?\n\n趙元的攻勢一輪比一輪暴躁，一輪比一輪散亂——他被墨飛這「打不死、躲不完、還時不時咬你一口」的無賴打法，徹底激怒了，也徹底拖入了他最不擅長的、比拚耐性與精算的泥潭。\n\n而墨飛，靠著《木靈訣》那源源不絕的回血回法，把這場仗，活生生拖成了一場「續航的較量」。\n\n趙元的法力，在肉眼可見地枯竭;墨飛的氣血，卻在《木靈訣》的溫養下，始終維持在一條安全的線上。\n\n問道盤上，兩人的戰力對比雖未變，可另一組數字——法力、氣血的餘量——早已悄然逆轉。\n\n「你到底……為什麼打不倒!」趙元喘著粗氣，額角滲汗，眼中第一次露出了驚懼。他攻了近百招，竟連對方一根寒毛都沒能真正傷到，反被那破甲氣刃啄得渾身是傷。\n\n「因為我算得到你的每一招，」墨飛的聲音很平靜，平靜得可怕，「而你，算不到我的。」\n\n「趙元，你的天賦比我好。」他一邊卸開趙元一記散亂的掌刃，一邊淡淡道，「金根中上，根骨上乘。這些，我一樣都沒有。」\n\n「可是——」\n\n他忽然不再後退。\n\n問道盤上，趙元的法力值，終於見了底。那意味著，他再也凝不出足以護體的靈氣。破綻，不再是半息，而是——門戶大開。\n\n墨飛等的，就是這一刻。\n\n他一改連日的守勢，身形暴起，斷刀出鞘，借著《裂石訣》最後一縷金系餘勁灌注刀身，一刀，直取趙元咽喉!\n\n這一刀，不再是啄，是斬。是他把整場仗的算計、把四部功法的配合、把一個廢根少年積壓了太久的那口氣，盡數凝於一擊!\n\n趙元瞳孔驟縮，想擋，法力已竭;想躲，身形已被墨飛封死了退路——他這才驚恐地發現，方才那看似無用的、被墨飛一次次「讓」出去的走位，竟早已在不知不覺間，把他逼到了光牆邊緣，退無可退!\n\n刀鋒，抵上了他的咽喉。\n\n一絲血珠，順著趙元的脖頸，滑落。\n\n「——可是，」墨飛立在他面前，一字一句，把方才那句話，說完，\n\n「配置齊全的廢材，打得贏天賦異稟的蠢材。」\n\n實戰場內，鴉雀無聲。\n\n實戰場外，是死一般的、瞠目結舌的寂靜。\n\n無數道方才還盛滿譏誚的目光，此刻，盛滿了難以置信的震撼。他們親眼看著——那個連光柱都凝不出的搗藥廢材，把金根中上的趙家少爺，逼到了認輸的絕境。\n\n「我……我認輸!」趙元面如死灰，從牙縫裡擠出這三個字，那聲音裡的屈辱與難以置信，讓四周的鄉民都聽得一清二楚。\n\n墨飛收刀，退開一步，不再看他。\n\n「首戰，墨飛勝!」執事的聲音，帶著一絲他自己都未察覺的鄭重，傳遍全場。\n\n——\n\n接下來的兩場，再無懸念。\n\n第二場，對上那修習火系外功、遠攻為主的煉氣三層少年丙。墨飛以《厚土樁》的減傷硬扛過幾輪火術，算準對方施法的耗法間隙，近身，一套破甲氣刃連消帶打，對方法力一竭，便再無還手之力。\n\n第三場，對上身形靈巧、善於纏鬥的少年乙。這是最難纏的一個。可墨飛靠著《木靈訣》的續航，與對方耗;耗到對方氣力漸衰，再抓住那一閃即逝的破綻，一擊定勝負。\n\n三戰，三勝。\n\n當執事宣佈「墨飛，連勝三場，得入外門」時，整座考壇，靜默了足足三息。\n\n隨即，爆發出一陣近乎失控的譁然。\n\n「他贏了?那廢根，真的連勝三場入了問劍宗?」\n\n「我沒看錯吧……資質墊底，卻靠打，活生生打進了外門?」\n\n台上，築基執事終於起身。他走下高台，踱到墨飛面前，那雙淡漠的眼睛，此刻正深深地打量著他，彷彿要把這少年看穿。\n\n「你的資質，是本執事平生僅見的差。」執事緩緩開口，話說一半，卻話鋒一轉，\n\n「可你的『眼力』與『算計』，亦是本執事平生僅見的……好。」\n\n他自袖中取出一枚白玉弟子令，遞到墨飛面前:「墨飛，問劍宗外門弟子。三日後，隨隊入宗。」\n\n墨飛雙手接過那枚溫潤的白玉令牌。\n\n冰涼的玉，貼著他的掌心，一如三月前那塊熄滅的測靈石。可這一次，他掌心裡握著的，不再是「無緣」的宣判，而是一張——親手掙來的、通往那更廣闊天地的門票。\n\n他抬起頭，望向人群外圍。\n\n那裡，程伯拄著杖，不知何時來了，遠遠地立在人潮的最邊緣。老人沒有出聲，也沒有走近，只是望著台上那個握著弟子令的少年，渾濁的老眼裡，水光瀲灩。\n\n墨飛朝他，重重地點了點頭。\n\n——他做到了。\n\n那個被判了「無緣仙途」的廢根，那個被全鎮當作笑話的搗藥少年，靠著一方問道盤、四部撿來的功法、和一顆肯拿命去算的心，親手，把「不可能」三個字，一筆一筆，算成了「外門弟子」。\n\n而這，不過是開始。\n\n墨飛握緊了弟子令，望向北方——那是問劍宗所在的方向，是天才雲集、強者如林的更高處。\n\n「趙元，不過是第一個。」他在心底，輕聲道，\n\n「這仙途上，還有無數個『天賦比我好』的人，在前面等著。」\n\n「那就一個一個——」\n\n他唇角揚起，那抹屬於少年的鋒芒，在夕陽下，亮得灼人:\n\n「算過去。」\n\n——\n\n那一夜，濟生堂的燈，亮到很晚。\n\n程伯破天荒地溫了一壺鎮上釀的濁酒，給墨飛也斟了一碗。老人平日滴酒不沾，今夜卻自斟自飲，喝得臉頰微紅，話也比往日多了幾分。\n\n「問劍宗，」他望著碗中晃動的酒影，緩緩道，「不比青石鎮。那裡，天才如過江之鯽。今日敗在你手下的趙元，到了宗門，怕是連提鞋都不配。」\n\n「你要記住三件事。」老人豎起三根枯瘦的手指。\n\n「其一，藏拙。」他盯著墨飛，目光罕見地銳利，「你這雙能看穿旁人虛實的『眼力』，是你最大的倚仗，也是最大的禍根。這世上，最招人忌恨的，不是強，是『不該強而強』。你若把底牌盡數亮出，那些真正的大人物，只需動一根手指，便能把你這外門弟子，碾成齏粉。」\n\n墨飛心頭一凜。他想起問道盤，想起自己那些不能宣之於口的祕密，重重點頭。\n\n「其二，」程伯呷了口酒，「莫要與人比天賦。你比不過，也不必比。你走的，是另一條路——別人以力證道，你，以『算』證道。這條路，古往今來，走的人不多，可一旦走通了……」\n\n老人的聲音，在這裡忽然頓住，眼底掠過一絲極深、極遠的追憶，像是想起了某個湮沒在歲月裡的故人。\n\n「……一旦走通了，便是別人一輩子都望塵莫及的境地。」他終究把後半句，說得極輕。\n\n「其三呢?」墨飛追問。\n\n程伯放下酒碗，久久沒有言語。良久，他抬起頭，望著墨飛，那眼神裡，有慈愛，有期許，還有一絲墨飛始終參不透的、沉甸甸的東西。\n\n「其三，」老人一字一句，「無論你走到哪一步，登上何等高的天，都莫要忘了——」\n\n「你為何而修。」\n\n「是為了力，還是為了……道。」\n\n濟生堂的燈火，在這句話裡，輕輕搖曳。\n\n墨飛怔怔地看著眼前這個跛腳的老人。他忽然無比清晰地意識到——程伯絕不是一個尋常的鎮醫。這句「為何而修」，這句「以算證道」，這只「來歷無法盡窺」的納物袋……老人的身上，藏著一個他此刻還無從觸及的、龐大的祕密。\n\n可他什麼都沒問。\n\n他只是端起那碗濁酒，仰頭，一飲而盡。辛辣的酒液燒過喉嚨，燙進心口。\n\n「程伯，」他放下酒碗，聲音鄭重得不像個少年，「這三件事，我記下了。」\n\n「等我在外面站穩了腳跟，」他望著老人蒼老的臉，一字一句，「一定回來，親口告訴你——我墨飛，修的是什麼。」\n\n程伯笑了。那笑容裡，有欣慰，有不捨，還有一絲如釋重負的、隱祕的悵然。\n\n「去吧。」老人擺擺手，別過臉去，聲音又恢復了那副熟悉的凶巴巴，只是這一回，尾音裡藏著他自己都壓不住的顫，\n\n「去吧，墨家的……小子。」\n\n窗外，青石鎮的夜，靜謐而深沉。\n\n三日之後，墨飛就要離開這座生養了他十六年的小鎮，踏入那個天才如林、暗流洶湧的問劍宗，踏上那條真正意義上的——萬丈仙途。\n\n而此刻，他還不知道，程伯口中那句「墨家的小子」，那聲欲言又止的呢喃，將在許多年後，牽引出一段連他自己都不敢想像的、驚天動地的身世。\n\n他只知道，今夜的酒，很暖。\n\n前路，很長。\n\n而他，已經迫不及待。"}, {"t": "第十章 問劍宗", "c": "三日後的清晨，墨飛背著程伯給的納物袋，站在了青石鎮的鎮口。\n\n沒有盛大的送別。程伯拄著杖，一瘸一拐地送他到老槐樹下，塞給他一小瓶親手煉的療傷丹，又絮絮叨叨地叮囑了一路「按時吃飯」「莫要逞強」「傷了就用木靈訣養著」，末了，只重重拍了拍他的肩，什麼也沒再說，轉身回了濟生堂。\n\n墨飛望著老人蹣跚的背影消失在晨霧裡，久久佇立。\n\n他知道，自己這一走，再回來，便是另一番天地了。\n\n「墨師弟，久等了。」\n\n一名問劍宗的執事弟子駕著一葉靈舟，停在鎮口。舟上，已坐了七八個這一片新招收的弟子——資質直入的、實戰入門的，皆有。趙元也在其中。\n\n見到墨飛登舟，趙元的臉色瞬間陰沉下去，別過頭，冷哼一聲，卻到底沒敢再出言譏諷。考壇上那一敗，像一根刺，深深扎在他心裡；而墨飛那雙能看穿他每一招的眼睛，更讓他從心底生出一絲說不清道不明的忌憚。\n\n墨飛沒理他，尋了個角落坐下。\n\n靈舟破空而起，青石鎮在腳下飛速縮小，化作群山間一枚不起眼的墨點。墨飛趴在舟舷邊，望著這生平第一次見到的、從天上俯瞰的人間——阡陌、河流、城郭，都成了棋盤上的紋路。\n\n他心中震動難言。\n\n三月之前，他的世界，不過是濟生堂那一方小小的藥鋪。而此刻，他正乘著靈舟，飛向一個他從前連做夢都不敢想的地方。\n\n「這，才是修行。」他喃喃。\n\n靈舟飛了整整三日。\n\n當第三日的朝陽升起時，前方雲海翻湧處，一座巍峨到令人窒息的仙山，撞入了墨飛的眼簾。\n\n那山，高聳入雲，主峰之上，一柄由整座山峰天然形成的、萬丈高的「石劍」直指蒼穹，劍身之上，銘刻著億萬道古老的劍紋，靈光流轉，劍氣沖霄。環繞主峰，是九座各具形態的靈峰，宮殿樓閣，飛瀑流泉，錯落其間，靈禽仙獸往來翱翔——\n\n問劍宗。\n\n饒是墨飛心志堅韌，此刻也不由得屏住了呼吸。\n\n那股撲面而來的、磅礴浩瀚的靈氣，濃郁得幾乎化為實質。他只是站在靈舟上，遠遠望著，便覺得體內那點微薄的修為，都在這天地靈氣的滋養下，隱隱躍動。\n\n「在此地修煉一日，」他心念一動，問道盤立刻替他印證了猜想——〔此地靈氣濃度，遠超青石鎮數十倍。修煉效率大增〕——「怕是抵得上青石鎮修煉旬月。」\n\n天才們為何是天才?\n\n墨飛在這一刻，隱隱懂了。除了那份與生俱來的資質，更因為，他們自幼便沐浴在這等修行聖地的靈氣裡，用著最好的功法，得著最好的資源。而他這樣的鄉野少年，連引氣入門，都要靠一場墜崖的機緣。\n\n起點，天差地別。\n\n可墨飛望著那萬丈石劍，眼中非但沒有半分氣餒，反而燃起了更熾烈的火。\n\n「起點低，」他握了握拳，「那就把後面每一步，都走得比他們更精、更巧、更不浪費。」\n\n「天賦給的差距，我用『算計』，一分一分，追回來。」\n\n——\n\n靈舟落在問劍宗山門外的廣場上。\n\n這裡，早已聚集了數百名這一屆新入門的弟子，來自方圓萬里的各個城鎮。人聲鼎沸，卻又井然有序。一名內門執事立於高台，將眾人按資質與入門方式，分作三六九等。\n\n「資質上上、直入內門者，隨我來。」\n\n寥寥數人出列，個個氣度不凡，引來無數艷羨的目光。趙元不在其列——他那金根中上，在青石鎮是天驕，到了這裡，也不過堪堪擠進「直入外門」的中上之選。\n\n「直入外門者，往東峰報到。」\n\n趙元等一批人出列。他經過墨飛身邊時，腳步頓了頓，卻終究只是冷冷瞥了他一眼，一言不發地走了。\n\n「至於……」執事的目光，落到了最後那一小撮人身上，語氣裡帶著毫不掩飾的淡漠，「資質不足、由實戰關入門者——」\n\n「亦入外門，但需先於『雜役堂』歷練一年，以觀後效。往西峰報到。」\n\n人群裡響起一陣壓抑的嗤笑。所謂「雜役堂歷練」，說白了，就是外門裡最底層的雜役——挑水、劈柴、看守藥園，做的是連正式外門弟子都不屑做的粗活。\n\n墨飛被分到了西峰。\n\n與他同去的，是另外五六個和他一樣「實戰入門」的少年，個個面帶不忿與沮喪。同樣是入了問劍宗，卻從一開始，就被劃到了最底層。\n\n墨飛卻很平靜。\n\n他一邊隨眾往西峰走，一邊不動聲色地，用問道盤，將沿途所見的每一個人，都「掃」了一遍——\n\n那些直入內門的天驕，戰力，是他的百倍不止；那些正式的外門弟子，也大多在他數倍之上。他這剛入問劍宗的煉氣境雜役，在這座仙山裡，確實是最不起眼的一粒微塵。\n\n可墨飛毫不氣餒。\n\n他記得程伯的第一句叮囑:藏拙。\n\n在這強者如林的地方，一個資質墊底的雜役弟子，反而是最好的偽裝。沒有人會忌憚一粒微塵。而他，正好可以躲在這層「廢材雜役」的偽裝之下，睜著那雙看得見一切的眼睛，安安靜靜地——\n\n算。\n\n算這座宗門的規矩，算資源的分佈，算功法的取捨，算每一個可能的機緣。\n\n「一年雜役?」墨飛望著西峰那片略顯簡陋的院落，唇角，卻壓著一絲旁人看不見的笑意，\n\n「好啊。」\n\n「給我一年。」\n\n他在心底，對那座巍峨的仙山，對那些高高在上的天驕，也對這個嶄新的、廣闊的世界，輕聲道:\n\n「一年之後，這問劍宗的外門——」\n\n「我墨飛的名字，會讓你們，重新算一遍。」\n\n雜役堂的鐘聲，在這一刻，悠悠響起。\n\n墨飛整了整衣衫，握緊了腰間那枚白玉弟子令，一步跨過了西峰的門檻。\n\n一個廢根少年在問劍宗的傳奇，就從這最不起眼的雜役堂，這最底層的一磚一瓦，正式，開始了。\n\n雜役堂的管事，是個尖嘴猴腮、姓錢的煉氣後期修士。他把這一批新來的雜役掃了一眼，眼神像在看一堆會喘氣的柴火。\n\n「規矩就一條。」錢管事拖著長腔，「每人領一份差事，做滿一年，不出岔子，才有資格轉正式外門弟子。做不好——」他嗤笑一聲，「哪來的，滾回哪去。」\n\n分派差事時，旁人都盼著能得個輕省的看門、掃地。輪到墨飛，錢管事斜眼瞄了瞄他手上那本翻爛的《百草辨疑》，隨口道:「你，藥園。伺候那幾畝靈草去。那地方活多、油水少，正配你。」\n\n眾人又是一陣低低的哄笑。藥園在雜役堂裡，是出了名的苦差——靈草嬌貴，稍有不慎枯死一株，便要挨罰。\n\n墨飛卻在聽到「藥園」二字的剎那，心底幾不可察地，跳了一下。\n\n他是誰?他是濟生堂裡辨藥辨了十年的墨飛。這世上，若說有什麼是他這廢根少年天生就比旁人強的，除了那雙眼睛——便是「藥」。\n\n而問道盤，更是把這份天賦，放大到了極致。\n\n他隨錢管事走進那片藥園時，識海裡的問道盤，已經無聲地掃過一畦畦靈草——哪一株靈根將枯、哪一株火候未到、哪一株，其實已悄然孕育出可入丹的靈韻……那些管事與尋常雜役看不出的門道，在墨飛眼前，纖毫畢現。\n\n他甚至在藥園最角落、一叢被眾人當作雜草、無人搭理的墨綠藤蔓上，讀到了一行讓他呼吸微滯的批註:\n\n【幽冥藤·三百年份　│　罕見靈材，可淬體、可入丹】\n〔此藤畏光喜陰，園中人皆不識，誤作雜草〕\n\n墨飛面上不動聲色，蹲下身，做出一副笨拙拔草的模樣，指尖卻極輕地，護住了那叢藤蔓的根。\n\n「油水少?」他在心底，對那尖嘴猴腮的錢管事，無聲地笑了。\n\n「錢管事，這藥園裡的門道，怕是連你自己，都算不清吧。」\n\n別人眼中的苦差、賤役、無人問津的角落——\n\n在一個「看得見價值」的人眼裡，處處都是，別人瞧不上、卻真金白銀的機緣。\n\n墨飛捲起袖子，一頭扎進了那片藥園。他知道，他這一年的雜役生涯，絕不會像旁人以為的那般，是熬時間、混日子。\n\n這片被所有人看輕的藥園，將是他在問劍宗，掘到的第一桶金。\n\n而在那雲霧繚繞的內門深處，一位白衣勝雪、劍眉星目的少女，正立於瀑布之巔，閉目御劍。她的周身，環繞著數十柄流光溢彩的飛劍，劍氣縱橫，驚才絕艷。\n\n她睜開眼，目光似有所感地，向著西峰那不起眼的方向，淡淡掃了一眼，卻又很快收回，重新沉入那高深莫測的劍意之中。\n\n她不會知道，那個此刻正跨進雜役堂門檻的、最卑微的廢材雜役，將在不久的將來，成為攪動整個問劍宗風雲的名字。\n\n也將成為——她這一生，都無法忽視的，那個「算」贏了所有天賦的男人。\n\n（卷一·廢材觀道 完）"}, {"t": "第十一章 藥園", "c": "雜役堂的日子，比墨飛想的還要苦。\n\n天不亮，一聲刺耳的銅鑼便把西峰的雜役們從草席上敲醒。挑水、劈柴、灑掃、伺候藥園靈草——一整日連軸轉，到了夜裡，累得倒頭就睡。那尖嘴猴腮的錢管事，更是變著法子刁難，稍有差池，非打即罰。\n\n同來的幾個「實戰入門」的少年，不出三日，便已滿腹怨氣，私下裡沒少罵娘。\n\n唯獨墨飛，安之若素。\n\n他被分去的藥園，在旁人眼裡是苦差，在他眼裡，卻是一座無人看守的寶山。\n\n問劍宗的藥園，佔地數畝，種著上百種靈草，供宗門煉丹、療傷之用。這些靈草嬌貴，火候、水土、靈氣，樣樣講究，尋常雜役伺候不好，動輒枯死一片，挨罰是常事。\n\n可墨飛是誰?他是濟生堂裡辨了十年藥的墨飛，如今又有問道盤加持。\n\n他第一日進園，只在畦間走了一圈，問道盤便將每一株靈草的狀態，纖毫不差地攤在他眼前——〔此株靈根將枯，需移至陰處〕〔此株火候已足，三日內當採〕〔此畦土中靈氣不足，靈草徒長無韻〕……\n\n那些管事與老雜役摸索半輩子都未必參透的門道，於他，一目了然。\n\n於是別人伺候的靈草，三天兩頭枯死一片；墨飛伺候的那幾畦，卻愈發水靈，靈韻十足。不過旬日，連錢管事來巡視時，都忍不住多看了兩眼，嘴上卻仍不饒人:「哼，運氣罷了。」\n\n墨飛也不辯解。他要的，本就不是這尖嘴管事的一句誇。\n\n他要的，是那些藏在藥園角落、無人識得的真正的寶貝。\n\n——\n\n「墨兄弟，歇會兒吧，這活兒沒個完的。」\n\n一個憨厚的聲音在身後響起。墨飛回頭，見是同屋的雜役，一個生得虎背熊腰、卻一臉老實的少年——石敢。\n\n石敢也是實戰入門的。他資質平平，卻有一身憨力氣，為人實誠得近乎木訥，在這爾虞我詐的雜役堂裡，反倒成了少數幾個墨飛看得順眼的。\n\n「石大哥。」墨飛直起腰，抹了把汗，「你那邊柴劈完了?」\n\n「早完了!」石敢咧嘴一笑，露出兩排白牙，湊過來，壓低聲音，「墨兄弟，我瞧著奇怪——你伺候的這幾畦，怎麼就長得比別人的好?錢管事那老摳，背地裡都說你邪門呢。」\n\n墨飛笑了笑，沒直接答。他蹲下身，指著自己畦邊一株不起眼的、葉片微黃的靈草:「石大哥，你看這株，像不像要死了?」\n\n石敢瞪大眼:「可不是嘛，黃不拉幾的。」\n\n「旁人一看它黃，便當它病了，要麼拔了，要麼猛灌靈泉。」墨飛卻極輕地，將那株靈草從土裡移出，換到旁邊一處背陰的濕土裡，「可它不是病，是『畏光』。挪到陰處，三日就活過來。」\n\n石敢看得一愣一愣的:「你咋知道的?」\n\n「看出來的。」墨飛拍拍手上的土，語氣平淡，「石大哥，這世上的東西，都有它自己的『理』。你把它的理摸清了，它自然就長得好。」\n\n石敢似懂非懂地撓撓頭，卻對墨飛更添了幾分佩服。這少年雖瞧著文弱，可那份對「門道」的通透，讓他這實誠人打心底裡服氣。\n\n「墨兄弟，」石敢憨憨道，「往後這藥園的粗活，我幫你搭把手!你這雙眼睛金貴，別累壞了!」\n\n墨飛心中一暖。在這處處算計、人人怨懟的雜役堂裡，這份不求回報的實誠，難得。\n\n「那就多謝石大哥了。」他鄭重道。\n\n——\n\n有了石敢分擔粗活，墨飛便有了更多餘裕，去做他真正想做的事——摸清這座藥園的底。\n\n接下來幾日，他借著伺候靈草的由頭，把整座藥園的每一個角落，都用問道盤細細「掃」了一遍。\n\n收穫，遠超他的預期。\n\n除了先前那叢被眾人當作雜草的三百年幽冥藤，他又在園子西北角一處廢棄的、堆著爛葉的陰溝旁，發現了一小簇散發著微光的墨色菌菇:\n\n【玄陰芝·百年份　│　罕見靈材，陰寒屬性，可入淬體丹】\n〔生於至陰之地，園中人皆不識，踩踏於腳下〕\n\n在園子中央那口老井的井壁上，他甚至讀到了一株倒懸生長的、指甲蓋大小的赤紅小花:\n\n【一點紅·結珠將成　│　可解百毒，亦是煉製療傷丹的引子】\n\n墨飛越查，心越是火熱。\n\n這座藥園，被雜役們當作最苦的差事，被錢管事當作不入流的偏僻角落。可在他這雙「看得見價值」的眼睛裡，這裡處處都是被人踩在腳下、視若無睹的真金白銀。\n\n「錢管事啊錢管事，」墨飛望著那株倒懸的一點紅，唇角壓著笑，「你把我丟進這藥園，是想磨我的性子。」\n\n「可你萬萬想不到——」\n\n「你這是把一座金山，親手，交到了一個識貨的人手裡。」\n\n他沒有急著去採。他很清楚，這些靈材雖珍貴，卻也是宗門的財產，明著採，是取死之道。他要的，是「細水長流」，是不動聲色地，把這座金山，一點一點，變成自己往上走的階梯。\n\n夜裡，回到那間簡陋的雜役屋，墨飛盤膝而坐，運轉《吐納訣》。問劍宗濃郁的靈氣，加上白日藥園裡靈草環繞的滋養，讓他的修為漲得飛快。問道盤上，那行【煉氣一層】，已悄然逼近了二層的門檻。\n\n他睜開眼，望著窗外那輪懸在問劍宗萬丈石劍之上的明月，心中一片清明。\n\n入宗不過旬日，旁人還在為那磨人的粗活怨天尤人，他卻已在這無人看重的藥園裡，悄然掘到了自己的第一桶金，尋到了第一個真心的夥伴，摸到了往上走的路。\n\n「一年雜役。」墨飛低聲自語，眼底是化不開的篤定，\n\n「給我一年。這問劍宗的藥園裡藏著的東西，夠我，把根基，打得比誰都紮實。」\n\n月光如水，灑在少年沾著藥香的衣襟上。\n\n——\n\n墨飛的「與眾不同」，終究還是招來了麻煩。\n\n這一日，錢管事黑著臉，領著一名青袍外門管事，急匆匆地闖進藥園。那外門管事臉色鐵青，指著園子最深處一方單獨圈起的玉欄，厲聲道:「都廢物!長老要的『九轉還魂草』，怎麼就蔫成這樣了?!」\n\n眾雜役噤若寒蟬。\n\n墨飛遠遠望去，問道盤已將那玉欄中的靈草，照得清清楚楚:\n\n【九轉還魂草·三百年│極品靈材】\n〔狀態:垂危。根系受寒毒侵蝕，三日內必枯〕\n〔病因:非缺靈氣，乃鄰畦『玄冰草』寒氣滲入土中，寒毒攻根〕\n\n這株九轉還魂草，是問劍宗一位化神長老閉關療傷的救命之物，價值連城。它一旦枯死，整個雜役堂，怕是都要被牽連問罪。\n\n「錢管事!」那外門管事怒喝，「三日之內，救不活這草，你這雜役堂上下，都給我去思過崖跪著!」\n\n錢管事嚇得魂飛魄散，連聲應諾，回頭便對著雜役們破口大罵，卻沒一個人敢應——這等極品靈材的救治，連宗門的藥師都束手無策，他們這些粗使雜役，哪有這個本事?\n\n眼看一場大禍將至，人人自危。\n\n「我來試試。」\n\n一個平靜的聲音，響了起來。\n\n眾人循聲望去，只見那個素來不起眼的搗藥雜役墨飛，越眾而出。\n\n「你?」錢管事又驚又怒，「就憑你?連宗門藥師都救不活的草，你一個廢根雜役，別是想害死大家!」\n\n「連藥師都救不活，」墨飛不卑不亢，「是因為他們都當它『病了』，忙著給它續靈氣、灌藥液。」\n\n他抬眼，一字一句:「可它不是病，是『中毒』。」\n\n滿園皆靜。\n\n墨飛也不多言，走到那玉欄邊，蹲下身，指向緊鄰的一畦玄冰草:「這九轉還魂草，性喜溫養;偏偏三月前，有人在它旁邊，種下了這一畦性寒的玄冰草。玄冰草的寒氣，日復一日滲進土裡，攻的正是還魂草的根。」\n\n「續再多靈氣，也是往一具中著寒毒的身子裡，猛灌補藥——不死才怪。」\n\n那外門管事悚然一驚。他細看之下，那玄冰草確是三月前新移來的，位置就緊挨著還魂草!\n\n「要救，不難。」墨飛站起身，「其一，即刻將這畦玄冰草移走;其二，取『玄陰芝』引出土中殘餘寒毒——恰好，這園子西北角的陰溝旁，就有一簇無人識得的百年玄陰芝。」\n\n那外門管事將信將疑，卻已是死馬當活馬醫，當即命人依墨飛所言，移草、取芝、引毒。\n\n三日後。\n\n那株原本垂危的九轉還魂草，竟真的一日日緩了過來，重新舒展開翠綠的葉，靈韻流轉，比先前更盛。\n\n那位化神長老的救命之物保住了，一場潑天大禍，消弭於無形。\n\n外門管事看墨飛的眼神，徹底變了——那哪裡是看一個廢根雜役，分明是看一塊蒙塵的璞玉。他重重拍了拍墨飛的肩:「小子，你叫墨飛?記住了。」臨走前，還特意留下十枚中品靈石作賞。\n\n而那尖嘴猴腮的錢管事，看著墨飛的目光，則變得又是忌憚、又是複雜——他怎麼也想不通，這個被他丟進藥園磨性子的廢根，怎麼就成了連他都要仰仗幾分的「能人」?\n\n墨飛收起那十枚中品靈石，面上平靜，心底卻雪亮。\n\n他要的，從來不是這一時的封賞。他要的，是「立足」——是在這座強者如林的宗門裡，讓那些高高在上的人，記住「墨飛」這個名字;是把「廢根雜役」這層偽裝，一點一點，變成無人敢輕視的底氣。\n\n「藏拙。」他想起程伯的叮囑，唇角壓下一絲笑意，「可也不能拙得，讓人隨手就能捏死。」\n\n「偶爾露一手，讓他們知道我『有用』——這樣的雜役，才沒人敢動。」\n\n這一手救草，露得恰到好處。\n\n\n一個廢材雜役，在問劍宗最底層的藥園裡，開始了他悄無聲息、卻步步為營的崛起。"}, {"t": "第十二章 藥堂", "c": "救活九轉還魂草一事，很快在西峰傳開了。\n\n那個連宗門藥師都束手無策的難題，竟被一個廢根雜役三言兩語點破，還開出了藥到病除的方子——這事透著邪門，卻也透著真本事。一時間，墨飛在雜役堂裡的地位，悄然變了。\n\n先前對他冷眼相待、暗中使絆的雜役，如今見了他，都客氣了幾分;連那尖嘴猴腮的錢管事，也不敢再明著刁難，只是背地裡的忌憚，愈發深了。\n\n而最實在的變化，是三日後的清晨。\n\n一名外門藥堂的執事親自來了西峰，點名要調墨飛去藥堂「打下手」。\n\n「藥堂?」石敢聽說了，替墨飛高興得直搓手，「墨兄弟，那可是好去處!藥堂管著宗門的丹藥、靈材，比咱這藥園體面多了!你這是……熬出頭了啊!」\n\n墨飛卻很平靜。他知道，這不是「熬出頭」，是那位化神長老的救命草，替他換來的一絲門縫。\n\n而他要做的，是把這絲門縫，撬成一扇門。\n\n——\n\n問劍宗的藥堂，設在半山一處清幽的院落，藥香馥郁，靈氣氤氳。掌管藥堂的，是一位鬚髮皆白、面色紅潤的老者，姓孫，眾人稱他「孫藥師」。這老者是築基後期修為，一手煉丹、辨藥的本事，在外門堪稱翹楚，性子卻孤僻古怪，尋常弟子近不得身。\n\n墨飛被領到孫藥師面前時，老者連眼皮都沒抬，只淡淡道:「聽說你點破了還魂草的病因?僥倖罷了。藥堂重地，不是讓你來擺弄玄虛的。那邊有一堆待分揀的雜靈材，揀完了，再說話。」\n\n說罷，指了指牆角一座堆積如山的靈材雜堆——那都是各處收上來的、品類混雜、真假難辨的靈材，尋常要好幾個藥師忙上十天半月，才分揀得清。\n\n這是刁難，也是考較。\n\n墨飛沒有半句怨言。他挽起袖子，走到那堆雜靈材前。\n\n問道盤，悄然運轉。\n\n在旁人眼裡，那是一堆需要逐一嗅、嚐、驗，耗費無數心神才能辨明的雜物;可在墨飛眼裡，每一株靈材的名目、年份、品階、真偽，都清清楚楚地浮在眼前——〔百年黃精，真〕〔以次充好·假三葉紫，實為凡草染色〕〔火候過老，藥效減半〕〔罕見:五百年赤朮，混於凡材之中〕……\n\n他手指翻飛，將靈材一一分揀歸類，快得如同流水。真的一堆，假的一堆，上品一堆，殘次一堆——分毫不亂。\n\n半日不到，那座堆積如山的雜靈材，竟被他分揀得井井有條，連其中三株被前人當作凡草、險些丟棄的珍稀靈材，都被他一一挑了出來，單獨放好。\n\n孫藥師本是漫不經心地喝著茶，可當他起身，踱到那分揀好的靈材堆前，一株株驗看下去時，那雙渾濁的老眼，越睜越大，握著茶盞的手，微微顫抖起來。\n\n分毫不差。\n\n不只分毫不差，就連他這浸淫藥道數十年的老藥師，都險些看走眼的三株珍材，都被這少年，精準地挑了出來!\n\n「你……」孫藥師的聲音都變了，「這些，你如何辨的?可是嗅出的?嚐出的?」\n\n墨飛垂手而立，恭謹答道:「回孫藥師，晚輩自幼在藥鋪長大，辨藥，是吃飯的本事。」\n\n這是實話——只是，他略去了問道盤這半句。\n\n孫藥師死死盯著他，良久，忽然仰頭大笑，那孤僻古怪的臉上，第一次露出了毫不掩飾的欣喜與……愛才之意。\n\n「好!好一個『吃飯的本事』!」老者一把拉住墨飛的手臂，力道之大，全然不似個老者，「老夫在這藥堂，尋一個真正懂藥的苗子，尋了二十年!那些天之驕子，眼裡只有功法、只有境界，誰肯沉下心來，鑽這辨藥煉丹的『雜學』?」\n\n「今日，總算，讓老夫尋著了!」\n\n墨飛心頭一動。\n\n他要撬的那扇門，就這麼，被自己這一雙「辨藥」的手，推開了。\n\n自這日起，墨飛便正式在藥堂，跟著孫藥師習藥、辨材、學那煉丹的門道。孫藥師傾囊相授，墨飛則憑著問道盤與那顆七竅玲瓏心，一點就通，進境神速。而藥堂裡那些珍稀的靈材、丹方，更讓他大開眼界——這些，都是他日後配置功法、淬鍊己身的無價之寶。\n\n更重要的是，有了孫藥師這位外門翹楚做靠山，再無人敢輕易動他這個「廢根雜役」。\n\n在藥堂的日子，墨飛過得如魚得水。\n\n孫藥師見他是塊璞玉，索性連煉丹的門道，也一併傳授。煉丹，是修仙界最玄奧、也最耗心血的技藝之一——藥材配伍、火候拿捏、靈氣調和，差之毫釐，便前功盡棄。尋常弟子學上三五年，煉出的丹藥，十爐九廢，已是尋常。\n\n可墨飛不同。\n\n當他第一次立於丹爐前，孫藥師講解火候時，他識海裡的問道盤，竟將那看不見、摸不著的「火候」，化作了可見的數字——〔當前爐溫:偏低〕〔藥性融合度:六成〕〔再候三息，投次藥〕……\n\n那些老藥師需憑數十年經驗、靠一雙眼一顆心去「感」的東西，於墨飛，盡數化作了明明白白的指引。\n\n他第一爐煉的，是最基礎的「回氣丹」。孫藥師本沒指望他能成——頭一回煉丹便能成丹的，百年也難遇一個。\n\n可當爐蓋掀開，三枚圓潤飽滿、靈韻內斂的回氣丹，靜靜躺在爐底時，孫藥師手裡的蒲扇，「啪」地掉在了地上。\n\n「頭……頭一爐?」老者聲音發顫，「三枚成丹?還……還是上品?」\n\n墨飛拈起一枚回氣丹，問道盤上，清晰地標著:〔回氣丹·上品│服之回復法力〕。\n\n「僥倖罷了。」他學著孫藥師的口吻，淡淡道。\n\n孫藥師卻已激動得鬍子直抖，看他的眼神，簡直像在看什麼稀世珍寶:「僥倖?老夫煉了一輩子丹，就沒見過這般『僥倖』的!墨飛，你這一手，是天生吃這碗飯的!」\n\n墨飛心中卻是雪亮。\n\n煉丹，於他，不只是一門技藝。丹藥，是修士的續命符、增益符——回氣、回血、增益突破、淬鍊肉身……每一枚，都是他日後行走仙途的底牌。\n\n而如今，他不但能識盡天下靈材，更能親手，將它們煉成一枚枚無價的丹藥。\n\n「這藥堂，」墨飛望著爐中那三枚溫潤的丹藥，心底火熱，「當真是，一座取之不盡的寶山。」\n\n他不動聲色地，將那三枚回氣丹中的一枚，悄悄收入懷中——藥堂記檔，只認他這一爐煉了「兩枚」。這一枚「私藏」，是他為自己那套「配置」，又添的一塊底牌。\n\n\n——\n\n然而，樹欲靜而風不止。\n\n這一日，墨飛奉孫藥師之命，去外門的靈材庫領取一批丹材。剛到庫房門口，一個熟悉的、令人生厭的聲音，便自身後傳來。\n\n「喲?這不是搗藥的墨飛嗎?怎麼，在問劍宗，還是幹著搗藥的老本行?」\n\n墨飛回頭，果然是趙元。\n\n三月不見，趙元穿上了問劍宗外門弟子的雲紋服，眉宇間更添了幾分得意。他身邊還跟著兩個外門弟子，顯是new結交的狐朋狗友。\n\n「趙師兄。」墨飛淡淡拱手，不卑不亢。\n\n「別跟我攀師兄!」趙元冷哼，居高臨下地打量著他，眼中滿是譏誚，「我早聽說了，你這廢根，靠著幾分辨藥的下作伎倆，鑽進了藥堂，給那老古董孫藥師打雜。墨飛啊墨飛，我當你入了問劍宗能有什麼出息，原來，還是個伺候人的下人命!」\n\n他身邊兩個弟子哄笑起來。\n\n墨飛面色不變。他的問道盤，早已將趙元掃了個清楚:【趙元│煉氣三層│戰力34】——入宗三月，靠著宗門資源，趙元的戰力，確實漲了不少。\n\n可墨飛，也不曾停下。\n\n他垂在袖中的手，微微一動，識海裡，那行【煉氣二層│戰力19】，正安靜地浮著。而藉著藥堂那些靈材的滋養，他距離煉氣三層的門檻，也已不遠。\n\n「趙師兄說得是。」墨飛卻並不動怒，只溫吞一笑，「搗藥，伺候人，確是下人的活計。」\n\n「不過——」他抬眼，目光清亮如昔，「趙師兄可還記得，青石鎮實戰關那一場?」\n\n趙元臉上的笑，瞬間僵住。那是他此生最大的恥辱——被一個廢根，當著全鎮的面，逼得認輸。\n\n「你——!」\n\n「我只是想提醒趙師兄，」墨飛語氣平和，卻字字如針，「三月之前，你也曾說，我這廢根，一輩子踏不進煉氣的門。」\n\n「結果如何，趙師兄比我清楚。」\n\n他不再看那張漲得通紅的臉，領了丹材，從容轉身:「這仙途還長。趙師兄的『戰力』，還是留著，對付那些真正該對付的人吧。」\n\n「省得哪一天，又栽在一個『搗藥的』手裡——那，才叫難堪。」\n\n趙元氣得渾身發抖，卻對著墨飛那從容離去的背影，一個字也罵不出來。因為那場實戰關的敗績，像一道疤，深深烙在他心裡——他比誰都清楚，眼前這個「搗藥的」，那雙眼睛，到底有多可怕。\n\n——\n\n回到雜役屋，夜深人靜。\n\n墨飛盤膝而坐，取出白日裡從藥堂「順」來的一小撮靈材殘料——那都是些孫藥師不要的邊角，於旁人無用，於他，卻是淬鍊修為的好東西。\n\n他將靈材化入靈氣，運轉《吐納訣》，日夜不輟地引氣、煉化。\n\n不知過了多久，體內那道無形的關隘，終於在他一次次的沖擊下，發出了熟悉的輕響——\n\n咔。\n\n【墨飛│煉氣三層】\n【戰力 19 → 34】\n\n墨飛睜開眼，眸中精光一閃。\n\n戰力三十四。\n\n與此刻的趙元，堪堪持平。\n\n他望著窗外那輪明月，唇角，緩緩揚起。\n\n「趙師兄，」他低聲道，「你靠宗門資源，漲到三十四，用了三月。」\n\n「而我——」\n\n他握了握拳，掌心裡是藥堂靈材的餘韻，是問道盤的篤定，是一個廢根少年一步一個腳印堆起來的份量，\n\n「我從零開始，追平你，也不過三月。」\n\n「下一次再見，你我之間的這點差距——」\n\n「該輪到你，追我了。」"}, {"t": "第十三章 採藥", "c": "「墨飛，交你一樁差事。」\n\n這一日，孫藥師將墨飛喚到跟前，遞來一張靈材清單，神色是難得的凝重。\n\n「藥堂近日要為幾位長老煉製一批療傷丹，尚缺三味靈材——寒潭陰蓮、赤焰果、還有一株七竅玲瓏草。這三味，宗門庫存已盡，只能去『後山靈脈』採。」\n\n「後山靈脈?」一旁的石敢——他如今也常來藥堂幫墨飛搬運粗重靈材——聽得一愣。\n\n「問劍宗後山的一處靈脈，靈氣濃郁，故而靈材遍地。」孫藥師捋著鬍鬚，「只是那裡地處宗門外圍護山大陣的邊緣，時有煉氣、築基期的妖獸出沒，尋常外門弟子，也未必敢單獨深入。」\n\n他看向墨飛，眼神複雜:「本不該讓你一個煉氣雜役去涉險。可藥堂人手不足，那幾位懂採藥的師兄，又個個推三阻四……墨飛，你辨材的本事，老夫信得過。這差事，你可敢接?」\n\n墨飛心中一動。\n\n後山靈脈——靈氣濃郁、靈材遍地、又有妖獸出沒。這於旁人是險地，於他，卻又是一座「藥園」之外的、更大的寶山。有問道盤在，妖獸的戰力、靈材的品階，皆逃不過他的眼。這差事的兇險，於他，反倒成了難得的機緣。\n\n「晚輩，接了。」墨飛拱手。\n\n「我也去!」石敢立刻挺起胸膛，「墨兄弟去哪，我石敢就跟到哪!有妖獸，俺這身力氣，還能替墨兄弟擋一擋!」\n\n孫藥師見二人主意已定，便不再多勸，只取出一枚傳訊玉符與兩瓶療傷丹，鄭重交予墨飛:「萬事小心。若遇築基期以上的妖獸，切莫戀戰，即刻捏碎玉符，老夫自會設法。」\n\n——\n\n翌日清晨，墨飛與石敢便出了宗門，往後山靈脈去了。\n\n越往深處，靈氣越是濃郁，草木越是蓊鬱。奇花異草隨處可見，墨飛的問道盤幾乎沒有停過，將沿途靈材一一標註——〔百年靈芝〕〔三百年何首烏〕〔清心草·可入靜心丹〕……他一路走，一路採，不多時，程伯給的那只納物袋，便裝了小半。\n\n「墨兄弟，你這眼睛，可真是……」石敢在一旁看得目瞪口呆，「這滿山的草，在俺眼裡都一個樣，咋到你這兒，就成寶貝了?」\n\n「石大哥，」墨飛笑道，「寶貝一直都在，只是……看得見的人少罷了。」\n\n他心裡卻清楚，這尋常靈材，不過是順手之利。孫藥師要的那三味——寒潭陰蓮、赤焰果、七竅玲瓏草，才是此行真正的目標，而它們，無一不生於險地。\n\n行至午後，兩人來到一處幽深的寒潭邊。潭水冰寒刺骨，潭面之上，一朵通體瑩白、散發著森森寒氣的蓮花，靜靜綻放。\n\n【寒潭陰蓮·五百年│極寒靈材】——正是所需之物。\n\n可就在墨飛欲上前採摘時，問道盤驟然一跳，浮出猩紅的警示:\n\n【警示:高危目標·潭中】\n【寒潭冰蟒│築基一層│戰力 210】\n〔潛於潭底，護蓮而生，喜以寒氣凍敵，再一擊絞殺〕\n\n墨飛瞳孔一縮，一把拉住正要湊近的石敢。\n\n「別動。」他沉聲道，「潭裡，有東西。」\n\n話音未落，那平靜的潭面，驟然炸開!一條通體覆著青白冰鱗、水桶般粗的巨蟒，裹挾著漫天寒氣，自潭底暴射而出，猩紅的雙目死死鎖住了岸邊的二人!\n\n築基一層，戰力二百一十。\n\n墨飛此刻不過煉氣三層、戰力三十四。這一次的差距，比落霞谷那頭變異兔，還要懸殊數倍!\n\n「墨兄弟，跑!」石敢面色劇變，一把將墨飛護在身後。\n\n「跑不掉!」墨飛盯著那條冰蟒，飛快地盤算著——冰蟒身形雖巨，卻盤桓於寒潭，一旦離水太遠，威勢必減;它「先凍後絞」的習性，破綻在那「凍」與「絞」之間的換勢。\n\n可就算算得再清，這懸殊的戰力，也絕非他此刻能正面硬撼的。\n\n「石大哥，聽我的!」墨飛當機立斷，「往那片赤石林退!它離了潭水，力弱!」\n\n二人且戰且退。那冰蟒果然離水追來，可一離了寒潭，那漫天的寒氣便弱了三分。饒是如此，它一口吐出的寒霜，仍將墨飛半邊身子凍得幾乎麻木——若非《厚土樁》死死撐著那一層護體，他這條命，怕是當場就要交代。\n\n【氣血 37 → 11】\n\n退入赤石林，墨飛一眼瞥見林中幾株生於灼熱赤石間的火紅果實——【赤焰果·純陽靈材】!正是所需的第二味，更是此刻的救命之物!\n\n「石大哥，拖住它三息!」墨飛暴喝，不顧手掌被赤石灼傷，一把摘下數枚赤焰果，盡數捏碎，那純陽的汁液潑灑於地，騰起一片灼人的熱浪!\n\n冰蟒最懼純陽。那片熱浪一起，它盤旋的身軀猛地一縮，發出淒厲的嘶鳴，護體的寒氣被灼得節節潰散。\n\n破綻，終於露了出來。\n\n「就是現在!」墨飛催動《裂石訣》，一枚凝練到極致的金系氣刃，借著純陽熱浪灼開冰蟒護體的剎那，無視其厚鱗，直直洞穿了它咽喉下方那片被熱浪逼得寒氣盡散的死穴!\n\n而石敢，更在同一瞬，爆發出一身蠻力，一柄開山巨斧，狠狠劈在了那氣刃洞穿的傷口上!\n\n一擊破防，一擊重創。\n\n冰蟒巨大的身軀劇烈抽搐，翻滾著跌回寒潭，激起沖天的水花，漸漸沒了聲息。\n\n——\n\n潭水重歸平靜。\n\n墨飛與石敢，一個凍得渾身發抖、氣血將竭，一個累得癱坐在地、雙臂酸麻，卻都望著那條浮上潭面的冰蟒，難以置信地，笑了。\n\n「贏……贏了?」石敢喘著粗氣，「墨兄弟，咱倆，把一頭築基期的妖獸，給……給打死了?」\n\n「是你我合力，打死的。」墨飛服下一枚療傷丹，又運轉靈氣，緩緩平復著傷勢。他望向那條冰蟒，問道盤已亮起豐厚的獎勵:\n\n【擊殺 寒潭冰蟒(越級·協力)】\n【修為 +3200!│越級豐厚加成】\n【掉落:冰蟒內丹·築基級 ×1│冰鱗 ×若干】\n\n三千二百點修為!還有一枚珍貴的築基級內丹!\n\n墨飛心頭火熱。這一頭越級妖獸的收穫，抵得上他在藥園辛苦月餘。更難得的是那枚築基內丹——煉化之後，足以讓他的修為，再上一個大台階。\n\n他採下那朵失了守護的寒潭陰蓮，又收好赤焰果，望向靈脈更深處——第三味，七竅玲瓏草，還在等著他。\n\n「石大哥，」墨飛扶起癱坐的石敢，眼中戰意不減反增，「歇夠了?」\n\n「這採藥的差事，」他望著那片深不見底的、危機四伏卻又寶藏遍地的靈脈，唇角揚起，\n\n「才剛開始呢。」\n\n休整片刻，二人繼續深入。\n\n第三味七竅玲瓏草，生於靈脈最深處一座終年雲霧繚繞的斷崖之巔。那草有七片葉，葉葉相通，靈韻玄妙，是煉製上乘療傷丹不可或缺的引子，卻也因生於絕壁、罕有人至，而愈發珍稀。\n\n崖壁光滑陡峭，無處攀附。石敢空有一身蠻力，卻也對著這千仞絕壁犯了難。\n\n墨飛卻不急。他用問道盤細細掃過整面崖壁，將那些肉眼難辨的、可供借力的細微凸起與裂隙，一一標了出來——哪一處結實可踏，哪一處風化將崩，清清楚楚。\n\n「石大哥，你在下面接應。」墨飛將納物袋繫緊，「這崖，我上。」\n\n他依著問道盤標出的「路」，手腳並用，一步一步，穩穩地往上攀。每一次落腳、每一次借力，都精準地踏在那唯一安全的位置上。旁人眼中的九死一生，於他，不過是一道被問道盤解開了的、標好了每一步的算術題。\n\n小半個時辰後，墨飛終於攀上崖頂，採下了那株通體瑩潤、七葉流光的七竅玲瓏草。\n\n三味靈材，盡數到手。\n\n——\n\n歸途，暮色四合。\n\n墨飛與石敢一身疲憊，卻滿載而歸。納物袋裡，除了孫藥師要的三味主材，更塞滿了沿途採得的各色靈材，以及那枚珍貴的冰蟒內丹。\n\n「墨兄弟，」石敢憨憨地笑著，「跟著你，俺這輩子見過的寶貝，比前十六年加起來還多!」\n\n墨飛笑而不語。他心裡盤算的，卻是另一本帳——這一趟後山之行，於他而言，收穫遠不止靈材。\n\n越級擊殺冰蟒的三千二百修為，讓他距離煉氣圓滿，只剩一步之遙;那枚築基內丹，煉化之後，足以助他叩響築基的門扉;而這一路的歷練，更讓他將那套「配置」的實戰之道，磨礪得愈發純熟。\n\n他忽然停下腳步，回望那片沉入暮色的靈脈，若有所思。\n\n「石大哥，你有沒有覺得，」他緩緩道，「這後山靈脈，靈材遍地、妖獸橫行，尋常外門弟子卻鮮少踏足——這裡頭，是不是，有點古怪?」\n\n石敢撓撓頭:「古怪?不就是危險嘛。」\n\n「危險是一回事。」墨飛眸光微凝，「可你想，問劍宗這等大宗，護山大陣之內，怎會容一頭築基期的冰蟒，護著一株五百年靈蓮，盤踞這許多年，無人問津?」\n\n他方才擊殺冰蟒時，問道盤曾一閃而逝過一行極淡的批註——〔此獸靈智已開，似受某種禁制牽引……道韻殘留，不可解讀〕。\n\n與那古洞石壁上的「道韻殘留」，如出一轍。\n\n墨飛心底，那本記著「疑點」的帳，又悄然添了一筆。這問劍宗的後山靈脈，這遍地的機緣與兇險，只怕，並不像表面看上去那般簡單。\n\n「罷了。」他搖搖頭，將這疑慮暫且壓下。以他此刻的境界，想這些，還太早。\n\n「先回去交差。」他拍了拍石敢的肩，加快了腳步，「孫藥師，怕是等急了。」\n\n暮色中，兩個少年的身影，一前一後，往那燈火漸明的問劍宗行去。\n\n墨飛還不知道，這一趟看似尋常的採藥之行，他無意間窺見的那一絲「古怪」，將在許多章之後，牽引出問劍宗一樁塵封已久的驚天祕辛——而那祕辛的中心，竟與他識海中的問道盤，隱隱相連。\n\n此刻的他，只知道自己這一趟，賺得盆滿缽滿，離那更高的境界，又近了一大步。\n\n而這，已然足夠。"}, {"t": "第十四章 大比將至", "c": "交差之後，孫藥師對墨飛的看重，又深了一層。\n\n那三味險地靈材，連幾位懂採藥的師兄都推諉不敢去，墨飛一個煉氣雜役，竟帶著個夥伴，全須全尾地採了回來，還順手獵殺了一頭築基期的冰蟒——這份膽識與本事，讓孫藥師嘖嘖稱奇之餘，更起了幾分傾囊栽培之心。\n\n老者大手一揮，不但將那枚冰蟒內丹判給了墨飛作為「採藥之酬」，還特許他日後可在藥堂，取用一些尋常的靈材殘料。\n\n墨飛謝過孫藥師，回到雜役屋，便迫不及待地，將那枚築基級的冰蟒內丹，取了出來。\n\n內丹，是妖獸畢生修為的凝聚。煉化之，可得其精純的妖力，化為己身修為。這一枚築基內丹蘊含的能量，遠非尋常靈材可比。\n\n他盤膝而坐，將內丹含於口中，緩緩化開，那一股磅礴而狂暴的妖力，便如江河決堤般，湧入他的經脈。\n\n墨飛渾身一震，險些把持不住。他強自鎮定，依著《吐納訣》的法門，將那狂暴的妖力，一絲一絲地馴服、煉化，納為己用。有問道盤照著路，這本該兇險萬分的煉化，於他，竟也有條不紊。\n\n一夜之間，他體內的修為，以肉眼可見的速度暴漲。\n\n【修為】那一欄，一路狂飆，直至——\n\n咔!\n\n【墨飛│煉氣圓滿】\n【戰力 34 → 58】\n\n煉氣圓滿!\n\n只差最後一步，便可衝擊築基!\n\n墨飛睜開眼，長長吐出一口濁氣，只覺得體內靈氣充盈，四肢百骸都透著一股前所未有的力量。他低頭看著那【戰力58】，唇角揚起——\n\n入宗不過月餘，他這廢根，已從那戰力為零的凡人，一路走到了煉氣圓滿，戰力，更是將那金根中上的趙元，遠遠甩在了身後。\n\n「配置的力量。」他握了握拳，心底一片篤定。\n\n天才靠天賦，一步登天;而他，靠著一雙看得見的眼睛、一顆會算計的心、一套精心搭配的功法，和每一分都用在刀口上的資源——同樣，能後來居上。\n\n——\n\n墨飛破境的第三日，整個問劍宗，因一樁大事而沸騰了。\n\n三年一度的外門大比，將在半月之後，於論劍峰舉行。\n\n石敢一臉興奮地跑來報信:「墨兄弟!你聽說了嗎?外門大比!據說，這回大比的頭三名，不但能得宗門重賞、上乘功法，前三甲，更有資格，破格晉入——內門!」\n\n「內門?」墨飛心中一動。\n\n問劍宗等級森嚴。內門，才是這座大宗真正的核心——那裡有最頂尖的功法、最豐厚的資源、最強大的傳承。無數外門弟子熬盡一生，也未必能踏入內門一步。而外門大比的前三甲，竟可破格晉入!\n\n更讓墨飛在意的，是石敢接下來的話:「而且啊，這回大比，不論資質、不論出身，連咱們這些雜役，只要是煉氣境的，都能報名!勝者為王!」\n\n不論出身，勝者為王。\n\n墨飛的眼睛，亮了。\n\n這八個字，簡直是為他這樣的人，量身定做的舞台。\n\n在問劍宗，他這廢根雜役，永遠低人一等。可在這「只論輸贏」的大比擂台上——他那套算無遺策的配置，那雙看穿一切的眼睛，將不再是見不得光的偽裝，而是，堂堂正正碾壓對手的利器。\n\n「石大哥，」墨飛緩緩起身，眸中戰意熊熊，「這大比，我報名。」\n\n「俺就知道!」石敢一拍大腿，「俺也報!雖說俺多半走不了幾輪，可給墨兄弟你搖旗吶喊，俺樂意!」\n\n——\n\n報名這日，論劍峰下人山人海。\n\n各峰的外門弟子、乃至墨飛這樣的雜役，凡有幾分自信的，都來了。人群之中，墨飛一眼便瞧見了趙元——他也在報名的隊伍裡，一身錦衣，趾高氣揚，身邊圍著一圈奉承的弟子。\n\n趙元也瞧見了墨飛。他先是一愣，隨即嗤笑出聲，那笑聲不大，卻剛好能讓周遭聽見:「喲?搗藥的雜役，也敢來報外門大比?墨飛，我勸你還是省省吧。這大比，可不比青石鎮那鄉下地方的實戰關，高手如雲。你這廢根，別到時候第一輪就被人打下擂台，丟盡了咱們青石鎮的臉。」\n\n墨飛淡淡瞥他一眼，懶得多言。他的問道盤，早已將趙元掃過——【趙元│煉氣三層│戰力34】。\n\n月餘之前，兩人尚且持平;而如今，墨飛煉氣圓滿、戰力五十八，已是趙元的近一倍。\n\n只是墨飛謹記程伯「藏拙」的叮囑，並未將這份實力顯露分毫。在旁人眼裡，他，依舊是那個不起眼的、來湊數的廢根雜役。\n\n「趙師兄放心，」墨飛只淡淡回了一句，「擂台之上，見真章便是。」\n\n就在這時，人群忽然一陣騷動。\n\n「快看!是內門的師姐!」\n\n「是凌霜師姐!天啊，竟是凌霜師姐親臨!」\n\n墨飛循聲望去。\n\n只見論劍峰半空，一道白衣勝雪的身影，御劍而立。那是一位約莫十七八歲的少女，眉目如畫，清冷絕塵，周身環繞著數十柄流光溢彩的飛劍，劍氣縱橫，不怒自威。她只是靜靜立於雲端，那股睥睨眾生的氣勢，便讓山下數千弟子，盡皆屏息。\n\n【凌霜│築基後期│戰力 ????】\n\n墨飛凝神望去，問道盤上，那少女的戰力一欄，竟是一片刺目的問號——如同當初的程伯一般，深不可測，不能盡窺!\n\n饒是墨飛心志堅定，此刻也不由得心頭微凜。\n\n這，便是問劍宗真正的天驕。內門凌霜，劍道奇才，年紀輕輕便已築基後期，傳聞其戰力，更是遠超同境，直逼元嬰!\n\n她與趙元那等「金根中上」的所謂天才，根本不在一個層次。趙元若是螢火，她便是皓月。\n\n「此屆外門大比，由本座監臨。」凌霜清冷的聲音，自雲端傳來，響徹整座論劍峰，不高，卻字字清晰，「望諸位，以劍問道，莫墮我問劍宗之名。」\n\n言罷，她清冷的目光，淡淡掃過山下黑壓壓的人群。\n\n那目光掃過墨飛所在之處時，幾不可察地，頓了一頓。\n\n墨飛心頭一跳。\n\n只是那一頓，快得如同錯覺。凌霜的目光，已然移開，御劍離去，徒留滿場弟子，對著那絕塵而去的背影，如癡如醉。\n\n墨飛卻立在原地，望著那道消失在雲端的白影，若有所思。\n\n「深不可測……」他低聲自語，握了握拳，「又一個，問道盤看不透的人。」\n\n「凌霜師姐。」他在心底，將這個名字，鄭重地記下，\n\n「總有一天，我要站到，能讓問道盤，把你也看個清楚明白的高度。」\n\n——\n\n接下來的半月，墨飛沒有半分懈怠。\n\n他很清楚，這外門大比，高手如雲，絕非青石鎮那小小的實戰關可比。趙元之流不足為懼，可那些真正的外門天才，戰力遠在他之上者，比比皆是。他若想脫穎而出，靠的，依舊是那套算無遺策的「配置」——而這套配置，還遠未到極致。\n\n他將這半月，掰成了三份。\n\n其一，精進功法。他取出攢下的靈石與這些時日採藥所得，換來的一應資源，將識海中那四部功法，一一升級。《吐納訣》《厚土樁》《木靈訣》《裂石訣》——每一部升上一階，那常駐的加成、施展的威力，便在問道盤上，實實在在地漲一截。他甚至又補了一部水系外功《寒瀑劍》，添了一記「降速降命中」的手段，讓自己那套「配置」的攻防之網，織得更密。\n\n其二，錘鍊實戰。他日日拉著石敢對練。石敢一身蠻力，攻勢剛猛，正是磨鍊墨飛「算破綻、卸勁力」的好陪練。一場場打下來，墨飛對自身功法的搭配、對戰機的把握，愈發爐火純青。\n\n其三，備足底牌。他在藥堂日夜煉丹，將回氣丹、回血丹、乃至一枚增益爆發的「淬鋒丹」，一一備齊，貼身收好。孫藥師知他要參加大比，更是睜一隻眼閉一隻眼，任他取用靈材，末了還塞給他兩枚珍貴的「凝神丹」:「擂台之上，心神最要緊。這丹，護你神台清明，莫要被人以心魔手段所趁。」\n\n墨飛鄭重收下。\n\n半月苦修，他那套「配置」，已然脫胎換骨。問道盤上，他的【戰力】，也在功法升級與實戰磨礪中，悄然攀升——由五十八，一路漲至七十有餘。\n\n大比前夜，墨飛獨坐屋中，最後一次，將自己這套配置，在問道盤上，從頭到尾，細細推演了一遍。\n\n修練養道、土內護體、木內續命、金外攻堅、水外制敵——攻、防、補、控，五角俱全，環環相扣。這是他一路撿來、算來、拚來的，屬於他墨飛，獨一無二的「道」。\n\n「趙元，還有那些瞧不起我的天才們。」他闔上眼，唇角壓著一絲鋒芒，\n\n「明日擂台，你們的『天賦』，該來會一會我的『算計』了。」\n\n窗外，論劍峰的輪廓，在夜色中巍然聳立。\n\n\n半月之後，外門大比。\n\n墨飛望向那座巍峨的論劍峰，眼底，是化不開的戰意與期待。\n\n他這一路算計、隱忍、積蓄而來的力量，終於，要在這座「只論輸贏」的舞台上，第一次，堂堂正正地，亮出鋒芒了。"}, {"t": "第十五章 擂台", "c": "外門大比之日，論劍峰上，人聲鼎沸。\n\n九座擂台，並列於論劍峰廣場之上，皆以精鋼靈石鑄成，外覆隔絕靈氣的光罩。數千名外門弟子與雜役，或參賽、或觀戰，將廣場圍得水泄不通。峰頂高台之上，幾位外門執事居中而坐;而在那更高處的雲端，一道白衣勝雪的身影，御劍靜立——正是監臨此屆大比的內門天驕，凌霜。\n\n「大比之規，簡單明瞭。」一名執事的聲音，響徹全場，「九台同開，捉對廝殺，勝者晉級，敗者淘汰。連勝者，逐級而上，直至決出三甲!三甲者，重賞功法，更可破格，晉入內門!」\n\n「即刻——開始!」\n\n九座擂台，同時燃起戰火。\n\n墨飛立於待戰的人群中，不動聲色。他的問道盤，正無聲地掃過那一座座擂台上廝殺的身影，將每一個可能的對手，都拆解成一串串清晰的數字，牢牢記下。\n\n輪到他上台時，對手是一名生得五大三粗的外門弟子。\n\n【錢通│煉氣三層│戰力40│修一部土系外功，力大防厚，拙於變化】\n\n墨飛心中有數。此人戰力四十，比他低了近半;更兼「拙於變化」——正是他最好拿捏的那一類。\n\n戰鼓一響，那錢通便怒吼著，土系外功盡數催發，一雙拳頭裹著厚重的土黃靈光，如兩座小山般砸來。力道是真足，破綻，也真大。\n\n墨飛沒有硬接。他身形靈動，依著問道盤標出的軌跡，將那一拳拳勢大力沉的攻擊，盡數卸開、避過。他甚至沒有動用《裂石訣》，只以《寒瀑劍》那降速降命中的水系法術，一點一點，將對方的攻勢，拖得又慢又亂。\n\n錢通打了十幾拳，竟連墨飛的衣角都沒沾到，反被那陰魂不散的水系寒氣纏得手腳發沉，又惱又急。\n\n「就這點本事?」墨飛瞅準他一拳打老、破綻大開的剎那，身形一晃，欺身而近，斷刀刀背，不輕不重地，搭上了錢通的頸側。\n\n「你，輸了。」\n\n錢通一愣，隨即面如死灰。他這才驚覺，自己從頭到尾，竟連對方一根寒毛都沒能碰到，便已被封了咽喉。\n\n「墨飛，勝!」\n\n台下響起一陣稀稀落落的議論。多數人只當是那錢通太拙，倒沒太在意這個不起眼的雜役。\n\n墨飛卻不在意這些。他從容下台，靜待下一輪——他要的，從來不是這第一輪的喝彩。\n\n——\n\n一輪，兩輪，三輪。\n\n墨飛如同一台精密的算珠，不聲不響地，將一個又一個對手，送下了擂台。\n\n他的打法，詭異而高效。他從不與人比拚境界與蠻力——事實上，他那煉氣圓滿的境界，在許多對手面前，並不佔優。他靠的，是那一雙看穿一切的眼睛:他總能提前算到對手的每一招，總能精準地抓住那一閃即逝的破綻，總能用最省力、最刁鑽的方式，將勝勢，一點一點，攥進自己手裡。\n\n戰力高於他的，他以配置與算計，拖垮、耗死;戰力相當的，他一擊制敵，乾淨利落。\n\n四輪過後，九座擂台上的參賽者，已淘汰大半。而墨飛這個「廢根雜役」的名字，終於，開始引起了一些人的注意。\n\n「那個雜役……四連勝了?」\n\n「邪門啊。他境界不高，出手也不見多兇，怎麼就沒人打得過他?」\n\n「你仔細看——他每一步走位、每一次出手，都恰好卡在對手最難受的地方。這哪是在打架，分明是……在算!」\n\n台下的議論漸漸多了起來。而高台之上，幾位外門執事，也開始頻頻將目光，投向墨飛所在的擂台。\n\n墨飛卻始終謹守著「藏拙」二字。他每一場，都只贏得剛剛好——絕不多顯露一分實力，總讓人覺得他是「險勝」、是「僥倖」，是靠著對手的失誤，才勉強過關。\n\n唯有他自己知道，那一場場「險勝」的背後，是何等精密的算計。\n\n——\n\n第五輪。\n\n墨飛的對手，終於換成了一塊硬骨頭。\n\n【周乾│築基一層│戰力 130│修一部雷系外功，攻速極快，遠近皆能】\n\n築基一層!戰力一百三，是墨飛的近一倍!\n\n這是墨飛入大比以來，遇上的第一個真正意義上的強敵。此人已然築基，無論境界、戰力，都遠在他之上;那雷系外功攻速奇快，更是難纏。\n\n台下，不少人已開始搖頭:「這回，那雜役怕是要栽了。築基境的壓制，豈是算計能彌補的?」\n\n趙元更是站在人群裡，幸災樂禍地大笑:「哈!我就等著看你這廢根，被打下台的狼狽樣!」\n\n擂台之上，那周乾也是傲然一笑，渾不將墨飛放在眼裡:「一個煉氣雜役，也配站在我面前?小子，認輸吧，免得傷了性命。」\n\n墨飛卻只是靜靜地，凝視著對手，問道盤，在他識海中，飛速地運轉——\n\n〔周乾:雷系外功，攻速極快，然每三記快攻之後，必有一息滯澀，以蓄雷力〕\n〔弱點:恃境界之高，輕敵冒進;築基護體雖厚，然咽喉、氣海二處，仍可為《裂石訣》破甲所趁〕\n\n一息滯澀。破甲可趁。\n\n墨飛的眼底，寒光一閃。\n\n境界的差距，是真;戰力的懸殊，也是真。可他這一路走來，何曾是靠「境界」與「戰力」贏的?\n\n落霞谷的變異兔，戰力是他的四倍;後山的寒潭冰蟒，戰力是他的六倍。他，不都算著，打贏了嗎?\n\n「認輸?」墨飛握緊了斷刀，唇角，揚起一絲趙元最熟悉、也最恐懼的弧度，\n\n「周師兄，你戰力是我的一倍。」\n\n「可惜——」\n\n他一字一句，清晰地，傳遍了整座驟然安靜下來的擂台:\n\n「這擂台之上，決定輸贏的，從來，不只是戰力。」\n\n戰鼓，轟然擂響。\n\n周乾眼中厲色一閃，周身雷光暴漲，化作一道紫電，朝著墨飛，疾射而至!\n\n而墨飛，迎著那道足以將他碾碎的紫電，非但沒有退，反而——向前，踏出了一步。\n\n台下，無數道目光驟然收縮。\n\n雲端之上，那位始終清冷淡漠、彷彿對台下一切都漠不關心的白衣少女，凌霜，那雙秋水般的眸子，終於，在這一刻，真正地，落在了那個迎著紫電、踏步向前的、瘦削的少年身上。\n\n她微微，眯起了眼。\n\n那道紫電轟至的剎那，墨飛動了。\n\n他沒有硬接——以他煉氣圓滿的境界，硬接一記築基雷術，是取死之道。他踏前那一步，是「算」出的死中求生:紫電走的是直線，直線便有軌跡。他側身一擰，貼著那道雷光的邊緣，險之又險地卸了過去，鬢角的髮絲被雷光燎焦了一縷，焦味刺鼻。\n\n「厚土樁」的常駐護體，替他扛下了那擦身而過的雷光餘勁。【氣血 79 → 61】——傷了，卻沒傷及根本。\n\n而周乾這一記全力快攻，落了空。\n\n墨飛的問道盤，早已替他數好了——〔一記。〕\n\n周乾自恃境界，攻勢如潮，紫電連綿，一記快過一記。墨飛不與他硬拚，只以《寒瀑劍》的水系寒氣纏其手腳、降其攻速，自己則如水中游魚，在那漫天雷光的縫隙間，一次次，堪堪避過。\n\n〔二記。〕〔三記。〕\n\n就在周乾第三記快攻堪堪使老、周身雷光為蓄下一擊而出現那一息滯澀的剎那——\n\n墨飛，動了。\n\n他不再閃避，身形暴起，將這半月苦修、將四部功法的搭配、將一枚「淬鋒丹」的增益，盡數在這一瞬爆發!《裂石訣》金系氣刃凝於刀尖，借著淬鋒丹那一線鋒銳的加持，無視周乾那厚重的築基護體，如鑿子鑿冰，直直洞穿了他氣海之下、那唯一為破甲所趁的死穴!\n\n「噗!」\n\n周乾瞳孔驟縮，那一息的滯澀，讓他避無可避。金系氣刃洞穿護體，重創氣海，他一身雷力，登時潰散大半!\n\n「這、這不可能!」周乾踉蹌後退，又驚又怒，「一個煉氣的，怎麼傷得了我!」\n\n「因為你太相信『戰力』了。」墨飛不給他喘息之機，身形再進，斷刀已抵上他咽喉，「相信到，忘了防備一個你瞧不起的人。」\n\n「這一戰——」他的聲音，平靜卻清晰地，傳遍了鴉雀無聲的全場，「你輸在，把『境界』當成了唯一的底牌。」\n\n擂台之上，死一般的寂靜。\n\n一個煉氣圓滿的廢根雜役，越級，擊敗了一位築基一層、戰力翻倍的外門強者!\n\n「他……他贏了?」\n\n「越級!煉氣勝築基!那雜役，他到底是什麼來歷?!」\n\n嘩然之聲，如驚雷般，在論劍峰廣場上炸開。趙元站在人群裡，臉上的幸災樂禍，早已凝固成一片死灰般的驚駭。他張著嘴，望著擂台上那個從容收刀的少年，只覺得一股寒意，自脊背直竄天靈——\n\n他忽然無比清晰地意識到，青石鎮那一敗，絕非僥倖。眼前這個「搗藥的」，是一頭他從未真正看清過的、深不見底的猛獸。\n\n而在那高高的雲端。\n\n白衣的凌霜，望著擂台上那個瘦削的、正淡然抱拳退場的少年，清冷的眸中，第一次，漾起了一絲毫不掩飾的興味。\n\n「戰力五十八……勝一百三十。」她朱唇輕啟，聲音輕得只有自己聽見，「不靠境界，不靠蠻力，只靠……算。」\n\n「有點意思。」\n\n她的目光，久久地，停在了「墨飛」那個方向。\n\n而擂台之下，墨飛剛一退場，識海裡的問道盤，便悄然亮起一行——\n\n【擊敗 周乾(越級)】\n【戰功大漲│已引起「監臨者」注意】\n\n墨飛腳步一頓，抬眼，望向那雲端的白影。\n\n四目，遙遙相接。\n\n墨飛心底一凜——她在看他。那個問道盤都看不透的內門天驕，正饒有興味地，看著他。\n\n「藏拙……怕是藏不住了。」他垂下眼，唇角卻壓著一絲不易察覺的、迎向強者的鋒芒，\n\n「不過——」\n\n「能讓你這種人，正眼看我一回。」\n\n「這一戰，值了。」\n\n論劍峰上，大比的戰火仍在燃燒。而一個廢根少年的名字，已隨著這一場驚天動地的越級之勝，第一次，傳入了問劍宗真正的頂層。"}, {"t": "第十六章 八強", "c": "越級擊敗周乾一戰，讓墨飛這個名字，如同一塊投入靜湖的石子，在論劍峰上，激起了一圈圈越來越大的漣漪。\n\n先前那些漫不經心的觀戰弟子，如今每逢墨飛上台，都會不約而同地圍攏過來，屏息凝神。他們想看清楚——這個境界不高、出手不猛的廢根雜役，究竟是靠什麼，一次次將戰力遠勝於己的對手，送下擂台。\n\n可他們看不懂。\n\n他們只看見，墨飛的每一步走位，都恰好避開對手的鋒芒;每一次出手，都精準地咬在對手最脆弱的破綻上;每一場看似兇險的苦戰，最終都以他不緊不慢的「險勝」告終。\n\n那不是打鬥。那是一場又一場，被人提前解開了答案的算術。\n\n只有墨飛自己知道，這份「看得懂」的從容背後，是問道盤將對手的戰力、習性、破綻，盡數攤在他眼前的碾壓性優勢;是他這一路撿來、算來、拚來的那套環環相扣的配置;更是他十六年如一日、看人辨物磨出來的那一雙眼睛。\n\n——\n\n第六輪，墨飛的對手，是一名修習冰系功法的清秀少女，名喚蘇晚。\n\n【蘇晚│築基一層│戰力 120│冰系，善控場，以凍結、遲滯纏敵】\n\n又是一位築基。冰系控場之術極為難纏，一旦被那寒冰凍結了身形，便是任人宰割的局面。台下不少人都以為，墨飛這一回，怕是要栽在這防不勝防的控場上了。\n\n蘇晚一上台，便是漫天冰晶激射，寒氣鋪地，將整座擂台，化作了一片她的主場。那冰晶軌跡飄忽，封鎖了墨飛幾乎所有的騰挪空間。\n\n可墨飛的問道盤，早已將那看似無跡可尋的冰晶，拆解成了一條條清晰的軌跡與時序——〔冰晶三息一輪，輪換之際，東南角有半息空檔〕。\n\n他不慌不忙，如同踩著某種只有他能聽見的鼓點，在那漫天冰封之中，精準地，一步一步，往那唯一的空檔挪去。旁人只見他步伐飄忽古怪，卻恰好每一步，都踏在了冰晶封鎖的縫隙裡。\n\n蘇晚越打越是心驚。她的控場，向來滴水不漏，可對上這少年，那一張她引以為傲的寒冰之網，竟像是被人看穿了每一個網眼，處處落空。\n\n待她心神一亂、冰陣出現一絲紊亂的剎那，墨飛已如附骨之疽般，欺至她三尺之內。《寒瀑劍》以水克冰，一記水系法術壓住她的冰力;斷刀順勢一封，抵上了她的手腕。\n\n「承讓。」墨飛淡淡道。\n\n蘇晚怔怔地看著他，良久，忽然嘆了口氣，斂了冰力，抱拳認輸:「我輸了。你這雙眼睛……太可怕了。」她敗得心服口服，退場前，還深深看了墨飛一眼，眼中，是毫不掩飾的驚異與欣賞。\n\n——\n\n七輪過後，數千參賽者，只餘下寥寥數十人。而墨飛，赫然在列。\n\n當執事宣佈晉級名單，念到「墨飛」二字時，台下已是一片壓抑的譁然。\n\n「一個煉氣圓滿的雜役，殺進了前三十二強?」\n\n「何止!你看他這一路，連斬兩名築基，越級都越了幾回了!」\n\n高台之上，幾位外門執事交頭接耳，看墨飛的眼神，早已從最初的漠視，變成了鄭重的審視。而那雲端的凌霜，更是自墨飛擊敗周乾之後，便未曾將目光，真正移開過。\n\n墨飛謹守藏拙，卻也清楚，事已至此，他這身「算計」的本事，已再難掩藏。\n\n「藏不住，那就……不藏了。」他望著擂台，眸中戰意漸盛，「三甲之位，內門之門——既已近在眼前，我墨飛，沒有半途而廢的道理。」\n\n——\n\n八強戰前，論劍峰上，忽然一陣騷動。\n\n「雷無極來了!是外門第一人，雷無極!」\n\n「奪魁大熱，雷師兄!有他在，這屆的頭名，怕是早已內定了……」\n\n墨飛循聲望去。\n\n只見一名身形挺拔、劍眉入鬢的青年，自人群中緩步走來。他一襲玄色勁裝，周身隱隱纏繞著紫金色的雷弧，每一步落下，空氣中都彷彿有電光炸裂。所過之處，眾弟子紛紛避讓，眼中滿是敬畏。\n\n墨飛凝神望去，問道盤上，那青年的資訊，讓他心頭一凜:\n\n【雷無極│築基三層│戰力 480】\n〔問劍宗外門第一人。修習頂階雷系功法「九霄神雷」，攻速、爆發皆冠絕外門。心高氣傲，唯強者方入其眼〕\n\n築基三層，戰力四百八十!\n\n這是一個，遠比周乾、蘇晚可怕得多的存在。他的戰力，幾乎是墨飛此刻的八倍!哪怕是那些同為八強的築基高手，在他面前，也如螢火之於皓月。\n\n雷無極目不斜視地走向自己的擂台，途中，卻不經意地，與墨飛的目光，遙遙一觸。\n\n他腳步微頓，那雙睥睨眾生的眼睛，饒有興味地，在墨飛身上停留了一瞬。\n\n「你，就是那個越級連斬築基的煉氣雜役?」雷無極的聲音，帶著上位者的漠然，卻也有一絲難得的鄭重，「墨飛?」\n\n「正是。」墨飛不卑不亢地拱手。\n\n雷無極打量他片刻，忽然，唇角勾起一抹極淡的、近乎期待的笑意:「有點意思。」\n\n「這一屆的三甲，若少了你墨飛，倒也無趣。」他收回目光，聲音平淡卻透著不容置疑的自信，「爬上來。爬到我面前——」\n\n「我倒要看看，你那雙傳說中的眼睛，能不能，算得過我這一身，堂堂正正的雷。」\n\n言罷，他不再看墨飛一眼，逕自走上了擂台。\n\n台下，一片對雷無極的敬畏與吹捧之聲。而墨飛，望著那個玄衣青年挺拔的背影，望著他周身那睥睨一切的紫金雷弧，非但沒有半分怯意，反而，心底那股迎向強者的火，燒得更旺了。\n\n「戰力四百八十……」他垂眸，指尖在袖中，無意識地，推演著什麼，「八倍的差距。」\n\n「這一回，只怕，是真正的九死一生了。」\n\n他抬起頭，望向那高高的雲端。凌霜清冷的目光，正靜靜地，落在他與雷無極之間，彷彿也在期待著，這兩個截然不同的存在，終將在擂台之上的相遇。\n\n墨飛深吸一口氣，將那份九死一生的凶險，連同那份不肯認命的戰意，盡數壓進眼底。\n\n「雷無極。」他在心底，鄭重地，記下了這個名字，也記下了那「戰力四百八十」的、如山般的差距，\n\n「爬到你面前……好。」\n\n「我墨飛，這就，一步一步，算著，爬上來。」\n\n八強戰的戰鼓，即將擂響。而所有人都知道，真正的好戲，才剛剛，開始。\n\n——\n\n八強對陣，抽籤而定。\n\n墨飛沒有抽中雷無極——那位外門第一人，被分在了另一側的擂台。墨飛的八強對手，是一名修習風系功法的瘦高青年，名叫顧塵。\n\n【顧塵│築基二層│戰力 260│風系，身法飄忽，攻速快，善以殘影惑敵】\n\n築基二層，戰力二百六。又是一場實打實的越級之戰。\n\n顧塵一上台，便化作一道青色殘影，身法快得幾乎撕裂空氣。他繞著墨飛高速遊走，一時分作三四道殘影，虛虛實實，令人難辨真假。台下觀者，只覺得眼花繚亂，全然跟不上那風一般的身法。\n\n這是比周乾的快攻、蘇晚的控場，都更難纏的對手——你連他的「本體」在哪都看不清，又談何算計破綻?\n\n可墨飛的問道盤，卻不受那殘影所惑。\n\n在他眼裡，那三四道殘影之中，唯有一道，頭頂懸著那行清晰的【顧塵│戰力260】——其餘的，皆是虛影。任那身法再快、殘影再亂，「本體」二字，始終無所遁形。\n\n墨飛不動聲色，任由顧塵在四周高速遊走、虛張聲勢，自己卻只以一雙眼睛，死死「盯」著那道真身，靜待時機。\n\n他甚至故意賣了個破綻，露出一側門戶。\n\n顧塵果然中計。他自以為身法無雙、墨飛絕難捕捉，當即收攏殘影，本體暴起，一記風刃，直取墨飛露出的空門!\n\n這一撲，快則快矣，卻正正撞進了墨飛張好的網裡。\n\n墨飛等的，就是他「本體現形、全力一擊」的這一瞬。他側身避過那記風刃的同時，《寒瀑劍》的水系寒氣驟然潑出，壓住顧塵的身法;《裂石訣》金系氣刃緊隨而至，破開風系護體，狠狠釘在他的肩頭!\n\n「不可能!」顧塵慘呼一聲，踉蹌跌退，一身飄忽的風勢，被那寒氣與破甲，攪得潰不成軍，「你怎麼分得清我的真身?!」\n\n「你的殘影，能騙過所有人的眼睛。」墨飛欺身而上，斷刀已抵咽喉，一字一句，「可惜——騙不過我的。」\n\n顧塵望著那雙古井無波、卻彷彿能洞穿一切虛妄的眼睛，只覺得一股寒意直透心底。他頹然垂下手臂:「我……認輸。」\n\n「墨飛，勝!晉級，四強!」\n\n執事的宣佈，讓整座論劍峰，徹底沸騰了。\n\n一個煉氣圓滿的廢根雜役，一路越級，連斬數名築基高手，竟殺進了外門大比的四強!這等戰績，縱觀問劍宗歷屆大比，也是聞所未聞。\n\n墨飛從容退場，抬眼望向另一側的擂台——那裡，雷無極僅用一招，便將他的八強對手，轟下了台。那一身九霄神雷的霸道與絕對，讓全場為之膽寒。\n\n兩人的目光，隔著整座喧囂的廣場，再次相接。\n\n雷無極眼中，是毫不掩飾的戰意與期待;墨飛眼中，則是一片沉靜如水的、迎向那座「戰力大山」的篤定。\n\n四強之後，便是半決。而依著這對陣之勢——\n\n墨飛與雷無極，那場八倍戰力差距的碰撞，已然，近在眼前。"}, {"t": "第十七章 雷無極", "c": "半決賽這一日，論劍峰上，萬人空巷。\n\n外門大比進行至此，只餘四人。而所有人的目光，都聚焦在同一座擂台之上——那裡，站著本屆奪魁的最大熱門、外門第一人雷無極，以及那個一路越級、震動全宗的廢根雜役，墨飛。\n\n戰力四百八十，對戰力七十有餘。\n\n八倍的差距。\n\n在絕大多數弟子看來，這場對決毫無懸念。墨飛先前那些越級之勝，對手至多不過築基一二層，戰力兩三倍;可雷無極是築基三層的外門第一人，戰力，是墨飛的整整八倍。這已不是「算計」能夠彌補的鴻溝。\n\n「那雜役能走到這一步，已是奇蹟。」\n\n「是啊，遇上雷師兄，也算雖敗猶榮了。」\n\n台下的議論，大多如此。唯有那雲端的凌霜，始終沉默地注視著擂台，清冷的眸中，看不出情緒。\n\n擂台之上，雷無極負手而立，周身紫金雷弧繚繞，睥睨著對面那個瘦削的少年。\n\n「墨飛。」他緩緩開口，語氣是難得的鄭重，「你能一路殺到我面前，我雷無極，敬你是個對手。」\n\n「所以這一戰，」他周身雷光驟然暴漲，紫金電芒撕裂空氣，發出令人牙酸的爆鳴，「我不會留手。」\n\n「來吧。讓我看看，你那雙眼睛，在絕對的實力面前——」\n\n「還算不算得動。」\n\n墨飛沒有答話。\n\n他只是靜靜地，凝視著對手，識海裡的問道盤，正以前所未有的速度，瘋狂運轉，將雷無極周身那浩瀚如海的雷力，拆解、分析、推演——\n\n〔九霄神雷:攻速極快，雷力霸道，遠近皆能。無明顯招式破綻〕\n〔弱點……計算中……〕\n〔警示:以宿主現有戰力，正面接其一擊，即敗。〕\n\n正面接一擊，即敗。\n\n墨飛的心，沉了下去。\n\n問道盤給出的結論，冷酷而清晰:這一戰，他沒有正面取勝的可能。雷無極的實力，是碾壓性的;他那套引以為傲的配置，在如此懸殊的戰力面前，脆弱得像一層紙。\n\n可墨飛的眼底，卻沒有半分退意。\n\n「算不動?」他握緊了斷刀，唇角，反而揚起一絲近乎瘋狂的鋒芒，「那是因為，還沒算到最後一刻。」\n\n「雷無極，你戰力是我八倍。」他一字一句，聲音不大，卻透著一股不肯認命的執拗，「我贏不了你。」\n\n「但我，要讓你，贏得很難看。」\n\n戰鼓，轟然擂響!\n\n——\n\n雷無極動了。\n\n一道紫金雷光，快到肉眼幾乎無法捕捉，撕裂長空，直取墨飛。這一擊的速度與威勢，遠非周乾那三腳貓的雷術可比。\n\n墨飛避無可避——問道盤上，那道雷光的軌跡剛剛成形，便已臨體。\n\n千鈞一髮之際，墨飛做出了一個所有人都意想不到的選擇。\n\n他沒有硬接，也沒有妄圖閃避那快到極致的雷光。他將《厚土樁》催發到極致，那一層土系護體之上，又疊加了一枚「淬鋒丹」的增益，硬生生，以血肉之軀，「卸」開了那一擊的鋒芒。\n\n轟!\n\n墨飛整個人被那磅礴的雷力掀飛出去，重重砸在光罩上。護體的土黃靈光，一觸即潰;他口中溢出鮮血，氣血瘋狂跌落——\n\n【氣血 79 → 23】\n\n一擊。僅僅一擊，他便去了大半條命。\n\n「墨飛!」台下的石敢，嘶聲大喊。\n\n雷無極卻微微一怔:「以厚土卸力，再借丹藥硬扛……你竟連我這一擊，都算到了三分?」他眼中的鄭重，更深了，「可惜，你的境界太低，扛不住幾下。」\n\n墨飛掙扎著站起，抹了把嘴角的血，笑了:「幾下?」\n\n「我不需要幾下。」\n\n他的問道盤，在方才硬扛那一擊的剎那，已捕捉到了他苦等的東西——〔九霄神雷·蓄力規律:每記全力雷擊之後，雷力需一息半歸攏;此間，護體最薄〕。\n\n一息半。\n\n比周乾的一息更短，更兇險。可對墨飛而言，這一息半，就是那絕境之中，唯一的一線生機。\n\n他不再躲。他拖著那半條命，以近乎自殺的方式，一次次迎上雷無極的全力雷擊，用《厚土樁》和丹藥硬扛，用氣血去換——只為換取那一擊之後，那轉瞬即逝的、一息半的破綻。\n\n一擊。氣血 23 → 9。\n\n墨飛在那一息半的破綻裡，一記《裂石訣》，破開雷無極的護體，在他身上，留下第一道傷。\n\n雷無極眼中的漠然，第一次，化作了震動。\n\n「你瘋了?!」他難以置信，「你在拿命，換我一道傷?!」\n\n「不然呢?」墨飛服下最後一枚回血丹，氣血堪堪回了一線，眼神卻亮得駭人，「我戰力是你八分之一。不拿命換，我拿什麼，在你身上，留下痕跡?」\n\n台下，已是一片死寂。\n\n所有人都看呆了。他們看著那個廢根雜役，以一種近乎自毀的、慘烈到讓人不忍卒睹的方式，一次又一次，用自己的血肉，去撞那座名為「雷無極」的大山;又一次又一次，在那必死的縫隙裡，倔強地，啄下一道又一道的傷。\n\n那不是勝負之爭。\n\n那是一個弱者，向一座他明知無法逾越的高山，發起的、最悲壯、也最耀眼的挑戰。\n\n雲端之上，凌霜清冷的臉上，第一次，浮現出了動容。她望著擂台上那個渾身浴血、卻始終不肯倒下的少年，那雙秋水般的眸子裡，翻湧起一種她自己都未曾預料的情緒。\n\n擂台之上，雷無極望著墨飛。這個煉氣圓滿的雜役，此刻已是強弩之末，渾身浴血，搖搖欲墜。可他身上，那八道由性命換來的傷，那雙至死不肯熄滅的、燃燒著戰意的眼睛，卻讓這位睥睨外門的第一天驕，生出了一股由衷的、近乎敬畏的震撼。\n\n「夠了。」雷無極忽然收斂了雷力，聲音沉了下來，「墨飛，你已經輸了。你的氣血，撐不過我下一擊。」\n\n「再打下去，你會死。」\n\n墨飛搖搖晃晃地站著，喘著粗氣，咧開染血的嘴:「那就……打到我死之前的，最後一刻。」\n\n雷無極沉默了。\n\n良久，他長長吐出一口氣，周身的雷力，盡數斂去。他望著墨飛，鄭重地，抱了抱拳:\n\n「這一戰，是我贏了。」他一字一句，聲音卻透著前所未有的鄭重，「但你墨飛，值得我雷無極，以全力相待。」\n\n「我認你，是我雷無極，平生第一個——對手。」\n\n言罷，他不再出手，朗聲對台上執事道:「此戰，墨飛力竭，我勝。但——我請求，予他季軍戰資格。此等心志，若埋沒於此，是我問劍宗之失。」\n\n全場，寂靜無聲。\n\n隨即，爆發出雷鳴般的、發自肺腑的喝彩。\n\n墨飛望著眼前這個堂堂正正、勝而不驕的對手，終於，支撐不住，單膝跪倒在擂台上。可他的脊背，依舊挺得筆直;他的眼睛，依舊亮如星辰。\n\n「多謝。」他喘息著，對雷無極，也是對自己，輕聲道，\n\n「這一戰，我輸了。」\n\n「可我墨飛的名字——」他望向那雲端動容的白影，望向這滿場為他喝彩的人群，唇角揚起，\n\n「你們，再不會忘了。」\n\n——\n\n墨飛是被石敢背下擂台的。\n\n「墨兄弟!墨兄弟你別嚇俺!」憨厚的漢子早已淚流滿面，背著渾身浴血的墨飛，一路狂奔向藥堂。\n\n孫藥師見到墨飛這副模樣，鬍子都氣歪了:「胡鬧!簡直是胡鬧!拿命去換傷，你當你這條小命，是大風颳來的?!」老者嘴上罵著，手底下卻快得驚人，一連數枚上品療傷丹餵下，又親自替他運功療傷。直到墨飛的氣血穩住，脫離了危險，才頹然坐倒，望著昏睡過去的少年，又是心疼，又是欣慰:「這孩子……這股狠勁，這份心志……老夫這輩子，都沒見過。」\n\n墨飛在藥堂昏睡了整整一日。\n\n他這一戰，雖敗猶榮。越級挑戰八倍戰力的外門第一人，以性命相搏，在對方身上留下八道傷，更逼得那心高氣傲的雷無極，親口稱他一聲「對手」，還為他求來季軍戰的資格——這一戰的分量，早已超越了勝負本身。「墨飛」這個名字，如今，響徹了整個問劍宗的外門，甚至，隱隱傳入了內門。\n\n——\n\n墨飛醒來時，已是次日黃昏。\n\n他抬手，識海裡的問道盤，悄然亮起:\n\n【墨飛│煉氣圓滿│戰力 72】\n【與雷無極一戰:雖敗，道心大進;「監臨者」關注度……極高】\n\n「道心大進。」墨飛咀嚼著這四個字。\n\n那一戰，他站在生死邊緣，將那套「算著打」的道，推到了極致——用命去算，用血去換。他忽然對「以算證道」這條路，有了更深一層的體悟。程伯說過，他走的是別人一輩子都望塵莫及的路;而昨日那一戰，便是他在這條路上，踏出的、最重的一步。\n\n就在這時，藥堂的門，被輕輕推開。\n\n一縷清冷的、彷彿帶著霜雪之氣的靈息，飄了進來。墨飛抬眼，呼吸，倏地一滯。\n\n門口，立著一道白衣勝雪的身影——正是那位連問道盤都看不透的內門天驕，凌霜。\n\n「你，就是墨飛。」凌霜開口，聲音清冷，如玉石相擊。藥堂裡的孫藥師與石敢，早已驚得屏住了呼吸——內門天驕親臨外門藥堂，何等罕見!\n\n「昨日一戰，你明知必敗，為何，還要以命相搏?」\n\n墨飛怔了怔，隨即，坦然一笑:「因為我不服。」他一字一句，「我不服『戰力』二字，就能定人生死。我這一生，從被判『廢根』的那一日起，就沒服過。」\n\n凌霜靜靜地望著他，那清冷的眸中，那一絲自昨日便已浮現的動容，此刻，終於化作了一縷極淡、卻真實的欣賞。\n\n「不服……」她輕聲重複，唇角，似有若無地彎了一下，快得如同錯覺。\n\n「季軍戰，好好打。」她轉身，白衣飄然，臨去前，只留下一句清冷的話語，卻讓墨飛的心，重重一跳——\n\n「我在內門，等你。」"}, {"t": "第十八章 三甲", "c": "季軍戰，於大比次日午時舉行。\n\n墨飛在孫藥師連夜以珍稀丹藥的溫養下，氣血已恢復了七八成。他站上擂台時，那渾身浴血、搖搖欲墜的慘烈已然不見，取而代之的，是一種歷經生死磨礪後、沉靜如淵的氣度。\n\n台下，早已圍得水泄不通。經過昨日那一戰，墨飛之名，已無人不曉。今日這座擂台之下，再無一聲譏諷，唯有滿場屏息的期待——他們想親眼看看，這個以命搏道的少年，能否，真正踏入那三甲之列。\n\n墨飛的季軍戰對手，是另一場半決賽的敗者，一名修習土系重功的築基二層弟子，名喚孟石。\n\n【孟石│築基二層│戰力 240│土系，防禦奇厚，以力壓人，持久戰見長】\n\n又是越級。可與昨日那八倍戰力的雷無極相比，這三倍的差距，於此刻的墨飛而言，反倒有種「輕鬆」的錯覺。\n\n戰鼓擂響。孟石一身厚土護體，如一座移動的山嶽，穩紮穩打，攻勢雖不凌厲，卻密不透風，更兼那驚人的防禦與續航，擺明了要與墨飛打一場消耗戰。\n\n尋常人對上這等「烏龜流」，最是頭疼——你攻不破他的防，他便耗到你力竭。\n\n可墨飛是誰?他有的是「破防」的手段。\n\n《裂石訣》金系破甲，本就是為這等重防目標量身定做。而他昨日與雷無極一戰，更將「算破綻、抓時機」的本事，磨到了爐火純青。\n\n他不與孟石硬拚續航，只以《寒瀑劍》的水系寒氣，緩緩侵蝕那厚土護體的靈氣;每當孟石一輪攻勢用老、護體最薄的剎那，一記《裂石訣》，便如鑿子般，精準地鑿在同一處。\n\n一鑿，兩鑿，三鑿……\n\n孟石那看似固若金湯的厚土護體，在墨飛這般「水滴石穿」的精準打擊下，竟一寸一寸地，裂開了縫。\n\n「你這打法……」孟石又驚又怒，「怎麼每一下，都鑿在同一個地方?!」\n\n「因為那裡，是你護體最薄的地方。」墨飛一邊卸開他的攻勢，一邊平靜道，「你以為你防得滴水不漏，可在我眼裡——你渾身，都是破綻。」\n\n待那護體被鑿開一個致命的缺口，墨飛不再遲疑，將一枚「淬鋒丹」的增益盡數灌注刀身，一記蓄勢已久的破甲重擊，自那缺口洞穿而入，直搗孟石氣海!\n\n孟石悶哼一聲，一身厚土靈力盡數潰散，龐大的身軀，轟然跪倒。\n\n「我……認輸。」他喘著粗氣，望著墨飛，滿是不甘，卻也心服，「你這雙眼睛，防不住，躲不掉……我輸得，不冤。」\n\n「墨飛，勝!季軍戰，墨飛勝!」\n\n執事的宣佈，讓整座論劍峰，爆發出山呼海嘯般的歡呼。\n\n墨飛，一個煉氣圓滿的廢根雜役，一路越級，連斬數名築基高手，力撼外門第一人，終於，堂堂正正地，奪下了本屆外門大比的——季軍!三甲之位!\n\n——\n\n大比落幕。頒獎大典，於論劍峰主殿之前舉行。\n\n冠軍，毫無懸念，是外門第一人雷無極。他一襲玄衣，立於高台，睥睨眾生，卻在目光掃過墨飛時，鄭重地，頷首致意——那是強者之間，惺惺相惜的認可。\n\n亞軍，是另一名半決賽勝者。\n\n而季軍，墨飛。\n\n當墨飛走上高台，立於雷無極身側時，台下數千弟子的目光，皆聚於他一身。那目光裡，再無半分昔日的輕蔑，唯有敬佩、驚異，與難以置信。\n\n而在人群的角落，趙元早已在數輪之前便被淘汰。他望著高台上那個曾被自己踩在腳下、如今卻立於萬眾矚目之巔的「搗藥的」，臉色慘白如紙，嘴唇顫抖，一個字也說不出。那一刻，他終於徹底明白——他與墨飛之間的差距，早已不是「天賦」二字所能丈量;那個他從未真正看得起的廢根，早已走到了他窮盡一生，也望塵莫及的地方。\n\n主持大典的，是一位元嬰期的外門大長老。\n\n「本屆大比三甲——雷無極、蕭何、墨飛!」大長老聲如洪鐘，「依宗規，三甲者，重賞!賜上乘功法一部、靈石千枚、丹藥一應!更破格——晉入內門!」\n\n「內門!」\n\n台下再次沸騰。破格晉入內門——這是無數外門弟子，窮盡一生也難以企及的榮耀!\n\n輪到墨飛領賞時，那位元嬰大長老，深深地看了他一眼，眼中滿是讚許:「墨飛，你以煉氣之境，越級力戰，奪此三甲，古今罕見。你這雙眼睛，這份心志，是我問劍宗之幸。」\n\n他頓了頓，話鋒一轉，聲音裡多了幾分鄭重:「內門凌霜特意交代——你入內門後，可入『藏經閣』，自選一部，更高深的功法。」\n\n此言一出，四周一片艷羨的抽氣之聲。內門藏經閣!那是收藏問劍宗頂尖傳承的聖地，便是尋常內門弟子，也難得入內一觀。而墨飛，竟得凌霜親自開口，許他自選功法!\n\n墨飛心頭一震，望向那雲端——凌霜依舊靜立，清冷的目光，遙遙與他一觸，隨即淡然移開。\n\n墨飛雙手接過那象徵著內門身份的、溫潤的玄色令牌，只覺得一股滾燙的熱流，自心底奔湧而上。\n\n從青石鎮那塊熄滅的測靈石，到問劍宗的內門令牌。\n\n從「駁雜之根，無緣仙途」的宣判，到「我問劍宗之幸」的讚許。\n\n這一路，他走了不過數月。可這數月，抵得上旁人的數十年。\n\n他抬眼，望向那雲霧繚繞的內門深處——那裡，有更頂尖的功法，有更豐厚的資源，有更強大的對手，也有那個，始終看不透、卻已在等他的白衣身影。\n\n「內門。」墨飛握緊了手中的令牌，唇角，揚起一抹沉靜而鋒銳的弧度，\n\n「我來了。」\n\n而在那一刻，他識海中的問道盤，悄然亮起了一行，他從未見過的新字——\n\n【身份晉升:內門弟子】\n【問道盤·權能解封中……偵測到:內門「道韻」濃郁，可窺見更深一層】\n\n墨飛心頭一跳。\n\n問道盤……要解封新的權能了?\n\n他望向內門，眼底，是化不開的期待。\n\n「看來，」他低聲自語，「這高一層的天，不只有更強的對手。」\n\n「還有，更深的道。」\n\n——\n\n離開外門的前夜，墨飛去尋了石敢與孫藥師。\n\n石敢憨厚的臉上，寫滿了不捨。他這回大比，果然沒能走出幾輪，早早便被淘汰，仍要留在外門雜役堂。而墨飛，卻要去那高高在上的內門了。\n\n「墨兄弟，你……你可要好好的。」石敢搓著手，眼眶紅紅的，「內門那些人，個個都是天之驕子，你、你別受欺負……」\n\n墨飛心頭一暖，重重拍了拍他的肩:「石大哥，你放心。我墨飛認你這個兄弟，一輩子。」他頓了頓，鄭重道，「我入了內門，會替你留意合適的功法與資源。你這身力氣是好底子，只是缺一部相配的功法。等我尋著了，送你——你我兄弟，一同往上走。」\n\n石敢聽得又是感動又是激動，重重點頭，一個七尺漢子，竟紅了眼圈。\n\n孫藥師則捋著鬍鬚，佯裝不在意，末了卻塞給墨飛一只沉甸甸的錦囊:「這裡頭，是老夫壓箱底的幾張丹方，還有些內門也難尋的靈材。拿著。」老者難得地，語重心長，「墨飛，你煉丹的天賦，是老夫平生僅見。莫要入了內門，就把這門『雜學』丟了——他日，它必是你的一大倚仗。」\n\n墨飛鄭重接過，深深一揖:「孫藥師的傳授之恩，墨飛沒齒難忘。」\n\n——\n\n翌日，墨飛憑著三甲的資格，踏入了內門的藏經閣。\n\n那是一座矗立於雲霧之巔的九層寶塔，塔內靈光流轉，一排排玉架之上，陳列著問劍宗歷代積累的頂尖功法。那一部部功法散發出的、深邃的道韻，讓墨飛剛一踏入，識海中的問道盤，便微微發燙。\n\n尋常弟子入藏經閣選功法，最是為難——那琳琅滿目的功法，威力高下、是否相合、能否駕馭，全憑一雙肉眼與幾分運氣，選錯了，便是抱憾終生。\n\n可墨飛不同。\n\n問道盤逐一掠過那一部部功法，將它們的類型、元素、效果、與他現有配置的契合度，一一在他眼前排開——他要選的，從來不是「威力最大」的那一部，而是，最能補全他這套「配置」的那一味「藥」。\n\n他的目光，最終，定格在三樓一部散發著溫潤金光、卻被置於角落、少有人問津的功法之上:\n\n《太一光明經》　內功型 · 光　│　上品·稀有\n常駐:防禦、掛機自療\n啟用:全屬性提升(攻/防/暴/閃/減傷……皆增)\n〔光系·全屬性。此類功法極為稀有，非機緣不可得。多數弟子貪求單項極致，反棄此「均衡增幅」如敝屣〕\n\n墨飛的呼吸，微微一滯。\n\n光系內功——全屬性增幅!\n\n這正是他這套「攻防補控」俱全、卻樣樣不算頂尖的「雜家」配置，夢寐以求的那塊拼圖!旁人貪求單項極致，故而看不上這「全屬性小幅提升」的功法;可對墨飛而言，這「全屬性」三字，恰恰能將他那套環環相扣的配置，整體拔高一截——這是為他量身定做的至寶!\n\n「別人棄如敝屣，」墨飛伸手，將那部《太一光明經》取下，唇角壓著笑意，「於我，卻是無價之寶。」\n\n「這，就是『看得見價值』的好處。」\n\n他將這部稀有的光系內功，鄭重納入識海。至此，他那套配置——修練養道、土內護體、木內續命、金外攻堅、水外制敵，再添一部光內全屬性增幅——攻、防、補、控、增，六維俱全，已然脫胎換骨。\n\n走出藏經閣，墨飛立於雲霧繚繞的內門之巔，回望那已然遠在腳下的外門。\n\n數月之前，他還是青石鎮那塊熄滅的測靈石前，人人恥笑的廢根。\n\n而如今，他已站在了問劍宗真正的核心，握著一部稀有的頂階功法，懷揣著一套獨一無二的配置，識海裡的問道盤，更即將解封新的權能。\n\n「凌霜師姐說，她在內門，等我。」墨飛望向那更深、更高處，眼底戰意與期待交織，\n\n「這內門的天，比外門更高，更廣。」\n\n「那我墨飛，就在這片新天地裡——」\n\n「算得更遠，飛得更高。」"}, {"t": "第十九章 內門", "c": "內門，與外門，是兩個截然不同的世界。\n\n墨飛踏入內門的第一步，便被那撲面而來的、濃郁到近乎液化的靈氣，震得心神一顫。這裡的靈氣，比外門濃郁了何止十倍。他只是靜靜站著，體內的修為，便如久旱逢甘霖的禾苗，隱隱瘋長。\n\n「在此修煉一日，抵得上外門旬月。」問道盤悄然印證了他的猜想。墨飛心中瞭然——難怪內門弟子個個進境神速。這等修行環境的差距，本身，便是天塹。\n\n內門依山而建，殿宇巍峨，飛瀑流泉，靈禽仙獸往來其間，宛如仙境。往來的內門弟子，個個氣度不凡，最低也是築基之境。墨飛這一身煉氣圓滿的修為，走在其間，竟成了最刺眼的「異類」。\n\n「聽說了嗎?就是他，那個外門越級的雜役，靠著大比僥倖，擠進了咱們內門。」\n\n「煉氣境也配入內門?真是丟人。我看啊，不過是運氣好，碰上雷師兄手下留情罷了。」\n\n議論聲，並不避諱他。內門弟子多是天之驕子，眼高於頂，對墨飛這個「煉氣雜役」出身的新人，自是不屑一顧，冷嘲熱諷者，比比皆是。\n\n墨飛卻恍若未聞。\n\n這些冷眼，他從青石鎮的測靈石前，一路受到現在，早已習慣。他也懶得辯解——辯解無用，唯有實力，才能讓這些人閉嘴。而他相信，那一天，不會太遠。\n\n——\n\n墨飛被分入內門的「聽濤居」，得了一座獨立的清幽小院。院中甚至自帶一座小型的聚靈陣，靈氣氤氳。這等待遇，於外門雜役而言，簡直是雲泥之別。\n\n安頓下來的第一件事，墨飛便盤膝而坐，凝神內視，去查探那問道盤「解封」的新權能。\n\n自踏入內門，識海中的問道盤，便一直隱隱發燙，盤面上的道紋，比往日亮了幾分，彷彿被這內門濃郁的「道韻」所滋養，正緩緩甦醒著什麼。\n\n墨飛心念一動，那盤面驟然一亮，浮出一行新字:\n\n【問道盤·權能解封:「觀道」初階】\n〔可窺見靈材、法器、功法之中，殘留的「道韻」層次;亦可粗淺感知天地間，道則流轉之痕。〕\n\n墨飛精神一振。\n\n他當即取出那部剛得的《太一光明經》，凝神望去。往日，問道盤只能告訴他這部功法的「效果數值」;而此刻——那功法之上，竟浮現出一縷縷玄奧的、流轉的金色道韻，隱隱勾勒出一種他從未見過的、關於「光」與「均衡」的至理!\n\n「這是……功法背後的『道』?」墨飛心頭巨震。\n\n他忽然意識到，問道盤先前給他的，不過是「術」的層面——數值、效果、破綻。而這新解封的「觀道」，卻讓他，第一次，窺見了那數值背後，更深的「道」。\n\n若說從前，他是在「看帳」;那麼如今，他，開始能「讀懂帳背後的道理」了。\n\n這一權能，對旁人或許玄之又玄、無甚大用;可對墨飛這等以「算」證道、以「配」為法的修士而言，卻是如虎添翼——他不但能算清一部功法「有多強」，更能漸漸看懂它「為何強」、與其他功法「該如何相生相剋」。\n\n他這套「配置」之道，即將，邁入一個全新的層次。\n\n「原來如此。」墨飛闔上眼，喃喃道，「境界越高，這問道盤能『看見』的，便越深。」\n\n「難怪程伯看不透，凌霜師姐看不透——」他心底那本記著疑點的帳，又浮了上來，「或許不是他們特殊，是我這問道盤的境界，還不夠。」\n\n「等我站得更高……那些看不透的謎，是不是，就都能看清了?」\n\n這個念頭，讓他心底那股向上的火，燒得更旺。\n\n——\n\n在內門安頓的第三日，墨飛正於院中參悟《太一光明經》的道韻，院門，忽被人推開。\n\n一縷清冷的霜雪之氣，飄了進來。\n\n墨飛抬眼，果然是凌霜。\n\n她一襲白衣，立於院中那株靈木之下，清冷絕塵。那雙深不可測的眸子，落在墨飛身上，一如既往地，看不出情緒。\n\n「凌霜師姐。」墨飛起身見禮。這幾日，他已隱約打聽清楚——凌霜不僅是內門第一天驕，更是問劍宗掌門的親傳弟子，身份尊貴，實力更是深不可測，尋常內門弟子，亦難得一見。而她，卻接連兩次，主動來尋他這個煉氣新人。\n\n「你的境界，太低了。」凌霜開門見山，清冷的聲音裡，聽不出褒貶，「內門臥虎藏龍，你這煉氣圓滿的修為，若不儘快突破築基，遲早會被人尋釁，吃大虧。」\n\n墨飛心中一動。他自然明白這道理。\n\n「多謝師姐提點。」他拱手，「墨飛正欲衝擊築基。只是……」\n\n「只是缺一味『破境』的機緣。」凌霜淡淡接口，彷彿早已看穿。她玉手一翻，一枚流轉著溫潤白光的丹藥，出現在掌心，隨手拋給墨飛，「築基丹。內門所出，可助你穩固根基、提升突破成功率。拿著。」\n\n墨飛接過那枚築基丹，問道盤上，清晰地標著:〔築基丹·極品│服之大增突破成功率〕——這等丹藥，便是他日日泡在藥堂，也難得一見。\n\n「師姐為何……如此照拂於我?」墨飛忍不住問。他與凌霜，素昧平生，她卻接二連三地，施以援手。\n\n凌霜聞言，那清冷的眸子，深深地凝視了他一瞬。\n\n「因為，」她緩緩開口，聲音輕得如同雪落，「在你身上，我看見了一種……與眾不同的『道』。」\n\n「這內門的天之驕子，人人以力證道，以境界壓人。」她的目光，掠過一絲不易察覺的複雜，「唯獨你——以算證道，以弱勝強。這條路，古往今來，少有人走通。」\n\n「我，有些好奇。」她頓了頓，唇角似有若無地彎了一下，「好奇你這條路，究竟能走到哪一步。」\n\n言罷，她白衣一振，飄然離去，只留下一句清冷的叮囑，迴盪在院中:\n\n「三日之內，突破築基。我，會來考較你。」\n\n墨飛握著那枚溫潤的築基丹，望著凌霜消失的方向，久久出神。\n\n「以算證道……」他低聲重複著凌霜的話，心底，那份對自身道途的認知，愈發清晰而堅定。\n\n他低頭，望向掌心的築基丹，又望向識海裡那六維俱全的配置、那剛剛解封「觀道」的問道盤。\n\n「築基。」他眸中，燃起熊熊的戰意，\n\n「師姐，你要考較我——」\n\n「那我便讓你看看，一個廢根雜役的『築基』，能築出何等，與眾不同的道基。」\n\n——\n\n凌霜前腳剛走，麻煩，後腳便到了。\n\n墨飛正欲閉關衝擊築基，院門卻被人一腳踹開。\n\n一名錦袍青年，帶著幾名內門弟子，趾高氣揚地闖了進來。那青年生得面白如玉，眉宇間卻透著一股掩不住的驕橫與陰鷙。\n\n墨飛凝神望去，問道盤浮現:\n\n【洛雲軒│築基後期│戰力 350】\n〔內門「雲」字輩天驕，出身煉器世家，心胸狹隘，睚眥必報。方才，見凌霜親臨此院〕\n\n「你就是墨飛?」洛雲軒斜睨著他，語氣充滿了毫不掩飾的輕蔑，「一個煉氣的雜役，也配住聽濤居?也配……讓凌霜師姐，親自來尋?」\n\n墨飛心下瞭然。原來癥結在此——這位洛公子，怕是對凌霜心存愛慕，見她接連照拂自己這個「外門雜役」，妒火中燒，故而尋釁而來。\n\n「洛師兄。」墨飛不卑不亢地拱手，「凌霜師姐緣何照拂，墨飛也不知。師兄若有疑問，不妨去問師姐。」\n\n「放肆!」洛雲軒身側一名弟子喝道，「一個煉氣賤役，也敢對洛師兄直呼師兄?!」\n\n洛雲軒卻擺了擺手，那陰鷙的目光，在墨飛身上緩緩逡巡，唇角勾起一抹冷笑:「墨飛，我勸你識相些。這內門，不是你那越級耍猴的擂台。這裡，論的是實打實的境界與底蘊。」\n\n「你一個煉氣的，在我洛雲軒眼裡，」他湊近半分，聲音壓得極低，唯有二人可聞，「與一隻螞蟻，無異。」\n\n「凌霜師姐一時興起，護你幾日。可她，總有膩的時候。」他直起身，冷冷道，「到那時——你這隻僥倖爬進內門的螞蟻，我隨時，都能碾死。」\n\n墨飛靜靜地聽著，面色不變。\n\n他的問道盤，早已將洛雲軒掃了個通透——築基後期，戰力三百五。這是一個此刻的他，遠遠無法企及的強者。硬碰，是取死之道。\n\n可墨飛的眼底，沒有半分懼意，唯有一片沉靜。\n\n「洛師兄說得是。」他淡淡道，語氣溫吞，卻字字清晰，「此刻的我，在師兄眼裡，確如螞蟻。」\n\n「不過——」他抬眼，目光清亮如昔，直直迎上洛雲軒陰鷙的視線，「洛師兄可知，我墨飛這一路走來，踩死過多少頭，自以為能隨手碾死我的『大象』?」\n\n「趙元、周乾、雷無極……」他一個一個，將這些名字報出，「他們當初，也都當我是螞蟻。」\n\n「結果如何，師兄不妨，去打聽打聽。」\n\n洛雲軒臉上的冷笑，微微一僵。\n\n「墨飛！」他眼中厲色一閃，卻到底顧忌著凌霜方才親臨此院的情面，不便當場發作，只陰狠地撂下一句，「牙尖嘴利。我倒要看看，你這隻螞蟻，能蹦躂到幾時!」\n\n「你給我記住，這內門，是我洛雲軒的地界。」\n\n言罷，他一甩衣袖，帶著人，悻悻離去。\n\n墨飛望著那群人離去的背影，唇角，壓下一絲冷意。\n\n「又一個。」他搖搖頭，重新走回院中，盤膝坐下，「當我是螞蟻的。」\n\n他攤開掌心，那枚凌霜所贈的築基丹，溫潤如玉。\n\n「洛雲軒，築基後期，戰力三百五。」他闔上眼，將這個新的名字、新的差距，鄭重記下，「又是一座，擋在我路上的山。」\n\n「不急。」他運轉起《太一光明經》的道韻，那六維俱全的配置，在體內緩緩流轉，「這內門的山，一座比一座高。」\n\n「那我，便一座一座，算著，爬過去。」\n\n「而這第一步——」他將築基丹含入口中，神識沉入丹田，直指那道橫亙已久的、名為「築基」的關隘，\n\n「便是，築基。」"}, {"t": "第二十章 築基", "c": "築基，是修士生涯中第一道真正的天塹。\n\n煉氣，不過是引氣入體、淬鍊己身;而築基，卻是要以一身靈氣為基石，於丹田之中，築起一座承載大道的「道基」。道基是否穩固、是否純粹，將直接決定一名修士未來能走多遠。基礎不牢，縱有通天資質，也難免中道崩殂。\n\n墨飛盤膝於院中聚靈陣的中央，將凌霜所贈的極品築基丹之藥力，緩緩化開。那磅礴而精純的靈氣，順著經脈奔湧，直衝那道橫亙於煉氣與築基之間的關隘。\n\n他運轉《吐納訣》，引動天地靈氣;《太一光明經》的道韻，則在體內流轉，將六維根基，溫養得均衡而堅實。有問道盤照著路，那本該玄之又玄、全憑感悟的築基之途，於他，化作了一條清晰可循的階梯——\n\n〔靈氣凝聚度:七成……八成……〕\n〔道基雛形:凝聚中。以「均衡」為骨，以「算」為魂〕\n\n尋常修士築基，多是以自身最強的那一項靈根為根基，追求「極致」;可墨飛的道基，卻與眾不同。他六維俱全、樣樣不算頂尖，於是他索性反其道而行——不求一枝獨秀，但求根根皆穩;以那部稀有的《太一光明經》為引，將攻、防、補、控、增六維，均衡地，築入道基之中。\n\n這是一座，前所未有的「均衡道基」。\n\n也是一座，唯有他這等「以配為法、以算證道」之人，才築得出的道基。\n\n——\n\n築基的最後一關，是心魔。\n\n當道基即將成形的剎那，那深埋於墨飛心底的、最陰暗的記憶，如潮水般，翻湧而上——\n\n是青石鎮測靈石前，那一團熄滅的灰白;是「駁雜之根，無緣仙途」的宣判;是趙元的哄笑，是「一輩子踏不進煉氣門檻」的譏諷;是無數道鄙夷的、看笑話的目光……\n\n那些聲音，在他識海中反覆迴盪，化作一個個猙獰的心魔，撕扯著他那即將成形的道基。\n\n〔警示:心魔侵蝕。道基動搖。〕\n\n「你不過是個廢根。」\n\n「你走到這一步，全靠僥倖。」\n\n「你這雜家的道基，不倫不類，注定，走不長遠……」\n\n墨飛的道基，在這心魔的侵蝕下，劇烈地震顫起來，出現了一絲絲裂痕。\n\n千鈞一髮之際，墨飛服下了那枚孫藥師所贈、凌霜所提的「凝神丹」。清涼的藥力，護住了他搖搖欲墜的神台。而在那一線清明之中，墨飛猛地睜開了心眼，直面那些猙獰的心魔——\n\n「僥倖?」\n\n他在心底，冷冷地，反問。\n\n「落霞谷的變異兔，是僥倖?後山的寒潭冰蟒，是僥倖?力戰雷無極的八道傷，是僥倖?」\n\n「你們說我廢根。」他一字一句，那聲音，在識海中，越來越響，越來越堅定，「可我這廢根，一路踩著你們的『天賦』，走到了內門。」\n\n「你們說我這道基不倫不類。」他望著那即將崩塌的「均衡道基」，眼底，燃起熊熊的信念，「可這，正是我墨飛的道!」\n\n「別人以力證道，我以算證道!別人一枝獨秀，我六維俱穩!這道基，不是不倫不類——」\n\n「這叫，獨一無二!」\n\n信念如烈日，那一瞬間，墨飛心中再無半分自疑。他這一路的血與汗、算與拚，盡數化作了道心之上，最堅不可摧的基石。那些猙獰的心魔，在這如日中天的道心面前，如冰雪消融，節節潰散!\n\n咔!\n\n一聲彷彿響徹天地的輕鳴。\n\n墨飛那座以「均衡」為骨、以「算」為魂、以「不肯認命」為基的獨特道基，轟然成形!\n\n【墨飛│築基一層】\n【氣血、法力、靈力……全面暴漲】\n【戰力 72 → 195】\n【道基:均衡·圓融(特殊)。〔此道基六維皆穩，無有短板，契合宿主「以配證道」之路〕】\n\n築基一層!戰力，一舉突破一百九十五!\n\n墨飛睜開眼，只覺得天地為之一新。內門那濃郁的靈氣，此刻在他感知中，纖毫畢現;體內那座嶄新的道基，圓融無漏，六維俱穩，蘊藏著磅礴的力量。\n\n他終於，從那個被人隨手可捏的「煉氣螞蟻」，一躍成為了，真正有資格立足內門的——築基修士。\n\n——\n\n「不錯。」\n\n一道清冷的聲音，自院外傳來。\n\n墨飛抬眼，凌霜不知何時，已立於院中那株靈木之下，正靜靜地望著他。她那雙深不可測的眸子裡，掠過一絲毫不掩飾的訝異。\n\n「三日之期未到，你便築基成功。」她緩緩道，「而且……這道基。」\n\n她的目光，落在墨飛身上，那訝異，愈發深了:「六維俱穩，圓融無漏。這是……『均衡道基』?我問劍宗典籍記載，此等道基，千年難見一例——因它太難築成，需修士對自身每一分力量，都有近乎苛刻的『掌控』。」\n\n「你，是如何做到的?」\n\n墨飛坦然一笑:「回師姐，我不懂什麼千年難見。我只是……」\n\n他頓了頓，一字一句:「把自己這副身子裡的每一分力量，都算清楚了，再一分一分，築進去而已。」\n\n凌霜怔怔地望著他。\n\n「算清楚……」她輕聲重複，眼中那縷欣賞，化作了真正的、發自內心的動容。以「算」築基，以「算」證道——這少年，當真是，將那條旁人視為虛妄的「以算證道」之路，走出了實實在在的、驚世駭俗的一步。\n\n「很好。」凌霜收斂了神色，那清冷的臉上，第一次，浮現出一絲極淡的、卻真實的笑意，「墨飛，你沒有讓我失望。」\n\n「考較，便免了。」她轉身，白衣飄然，臨去前，卻留下了一句，讓墨飛心頭劇震的話——\n\n「三月之後，宗門將開啟『萬妖森林』秘境歷練，擇內門弟子入內。」\n\n「屆時，」她清冷的目光，回眸一瞥，落在墨飛身上，「我，會帶上你。」\n\n「那裡，有真正的凶險，也有，真正的機緣。」\n\n「以及——」她的聲音，忽然低了下去，帶著一絲墨飛聽不懂的、遙遠的意味，「或許，還有你那『問道盤』，一直在尋的答案。」\n\n墨飛心頭巨震，猛地抬頭:「師姐，你——」\n\n可凌霜的身影，早已化作一道流光，消失在雲端。唯有那句「問道盤」，如驚雷般，在墨飛心中，反覆炸響。\n\n她……知道問道盤?!\n\n墨飛立於院中，望著凌霜消失的方向，久久不能平靜。他識海裡的問道盤，在這一刻，竟也微微震顫起來，彷彿……在回應著什麼。\n\n——\n\n當夜，墨飛做的第一件事，不是急著參悟新境，而是——踐諾。\n\n他還記得離開外門那日，對石敢許下的承諾。\n\n如今他入了內門，得了資源，更以三甲之身，有了每月自藏經閣借閱、自靈材庫支取的份例。他花了一整夜，以那新解封的「觀道」之能，將內門可尋的低階功法一一比對，終於，替石敢尋出了一部再合適不過的功法——\n\n《磐石訣》　內功型 · 土　│　中品\n常駐:防禦、氣血　│　啟用:力量提升、受擊反彈\n\n石敢一身蠻力、體魄驚人，卻苦無一部相配的功法，將那身力氣化為真正的戰力。而這部《磐石訣》，以力為基、以土為骨，剛猛厚重，恰是為石敢這等人量身定做。\n\n次日，墨飛託相熟的外門管事，將這部功法與幾瓶療傷丹、一袋靈石，一併送到了外門雜役堂石敢的手中。\n\n據那管事回來說，那憨厚的漢子接到功法時，捧著那卷竹簡，愣了半晌，隨即，一個七尺男兒，當場紅了眼眶，對著內門的方向，重重磕了三個響頭，什麼話也說不出，只反覆念著:「墨兄弟……墨兄弟……」\n\n墨飛聽罷，久久不語，心底，一片溫熱。\n\n他這一路，見慣了測靈石前的鄙夷、擂台上的血腥、內門中的算計。可石敢那份不求回報的實誠，那三個重重的響頭，卻讓他無比清晰地記起——自己走這條路，不只是為了向那些看輕他的人證明什麼。\n\n「程伯，石敢……」他望向青石鎮的方向，又望向外門雜役堂那片簡陋的院落，低聲道，「你們的份，我墨飛，都記著。」\n\n「這條路，我不會只是一個人往上走。」\n\n——\n\n翌日，墨飛立於院中，最後一次，將自己這築基之後的全新配置，在問道盤上，細細推演。\n\n築基一層，戰力一百九十五。六維俱穩的均衡道基。六部環環相扣的頂尖功法。一雙看穿萬物、更解封了「觀道」的眼睛。\n\n他已不再是那個站在測靈石前，被判了死刑的廢根少年。\n\n\n「萬妖森林……」墨飛握緊了拳，眼底，是驚濤駭浪，更是熊熊燃燒的戰意與探尋，\n\n「凌霜師姐知道問道盤的祕密。後山的道韻，古洞的刻痕……還有這一切背後，那個一直看不透的謎。」\n\n「答案，或許，就在那座秘境裡。」\n\n他抬眼，望向那雲霧繚繞、通往更高處的內門深處，一字一句:\n\n「築基一層，不過是新的起點。」\n\n「萬妖森林——我墨飛，來定了。」\n\n（卷二·問劍內門 完）"}, {"t": "第二十一章 入秘境", "c": "三月，轉瞬即逝。\n\n這三月，墨飛幾乎足不出戶，一頭紮進了內門那濃郁的靈氣與充沛的資源之中。有均衡道基為底，有六部功法環環相扣，有問道盤將修煉的每一步都化作清晰的階梯——他的進境，快得連他自己都心驚。\n\n三月之間，他已自築基一層，一路突破至築基三層，戰力，更是攀升至了三百有餘。\n\n【墨飛│築基三層│戰力 320】\n\n三百二十。\n\n這個數字，已然逼近了那位內門宿敵洛雲軒。若論真正的戰力，配上他那套算無遺策的配置，只怕，已隱隱超出。\n\n只是墨飛謹記藏拙，這三月深居簡出，除了偶爾去尋凌霜請教劍道、去藏經閣參悟功法道韻，鮮少在人前顯露。內門眾人，大多仍當他是那個「僥倖入門的煉氣雜役」，殊不知，那隻曾被洛雲軒視為螞蟻的少年，早已悄然，長出了獠牙。\n\n——\n\n這一日，內門廣場。\n\n三月前凌霜提及的「萬妖森林」秘境歷練，終於開啟。\n\n萬妖森林，是問劍宗轄下最古老、也最凶險的秘境之一。傳聞其地靈氣紊亂，妖獸橫行，更有上古遺留的凶險禁地;然而，凶險之中，亦藏著無數機緣——珍稀靈材、失傳功法、乃至上古傳承，皆可能現於其中。故而，每逢秘境開啟，內門弟子無不趨之若鶩。\n\n此番入秘境的內門弟子，共二十人，皆是築基期的翹楚。領隊的，正是內門天驕凌霜。\n\n墨飛立於隊伍之中，一身樸素青衫，在那一眾氣度不凡的內門天驕裡，顯得格格不入。而他那「築基三層」的境界，更是全隊最低——旁人最低也是築基中期，領隊的凌霜更是深不可測。\n\n「哼。」一道陰陽怪氣的聲音傳來，正是洛雲軒。他斜睨著墨飛，滿是譏誚，「我當是誰，能入這萬妖森林的名單。原來，是靠著抱凌霜師姐的大腿，才擠進來的雜役。」\n\n「墨飛，我勸你進去之後，老實跟緊隊伍。那萬妖森林凶險萬分，隨便一頭妖獸，都能要了你這築基三層的小命。」他冷笑，「別到時候，拖累了大家。」\n\n周遭幾名與洛雲軒交好的弟子，也跟著發出鬨笑。\n\n墨飛淡淡瞥他一眼，問道盤悄然掃過:【洛雲軒│築基後期│戰力355】——三月不見，此人也漲了些，卻已與墨飛相差無幾。\n\n「洛師兄放心。」墨飛不卑不亢，語氣溫吞，「秘境之中，誰拖累誰，進去便知。」\n\n「你——」\n\n「都住口。」\n\n一道清冷的聲音響起，如玉石相擊，瞬間壓下了所有的喧囂。\n\n凌霜白衣勝雪，立於隊伍之前，那雙深不可測的眸子淡淡一掃，眾人皆噤若寒蟬，連洛雲軒也悻悻閉了嘴。\n\n「萬妖森林，非比尋常。」凌霜聲音清冷，卻字字千鈞，「入內之後，靈氣紊亂，神識受阻，傳訊玉符十有八九失效。你們須得，時刻警醒，不可獨自妄動。」\n\n「此行，以歷練、採集為主。若遇築基以上的妖獸，或……那些古怪的禁地——」她眸光微凝，掠過一絲不易察覺的鄭重，「即刻退避，不得逞強。」\n\n她這番話，說得眾人心頭一凜。連向來心高氣傲的洛雲軒，神色也認真了幾分。\n\n墨飛卻敏銳地捕捉到，凌霜提及「古怪的禁地」時，那一瞬的異樣。他心底那本記著疑點的帳，又動了動——凌霜三月前那句「或許，還有你那問道盤，一直在尋的答案」，言猶在耳。\n\n這萬妖森林的深處，到底，藏著什麼?\n\n——\n\n秘境入口，是一座矗立於問劍宗後山、古樸而斑駁的巨大石門。石門之上，銘刻著繁複到極致的、早已無人能解的上古符文，靈光流轉，隱隱透出一股洪荒般的氣息。\n\n當墨飛的目光掃過那石門的剎那——\n\n識海裡的問道盤，驟然一跳!\n\n那盤面之上，那新解封的「觀道」之能，竟自發運轉起來，將那石門符文之中蘊藏的道韻，映入他眼簾。而那道韻——\n\n〔警示:此地道韻，與宿主識海『問道盤』，同源!〕\n〔偵測到……微弱的『呼應』。〕\n\n墨飛渾身一震，險些站立不穩。\n\n同源!呼應!\n\n這萬妖森林的秘境石門，與他識海中的問道盤，竟是同源之物?!\n\n他猛地想起古洞石壁上「不可解讀的道韻殘留」，想起後山靈脈那頭「受禁制牽引」的冰蟒，想起凌霜那句意味深長的話——\n\n一條條看似無關的線索，在這一刻，隱隱串聯了起來，共同指向了這座萬妖森林的深處，指向了那個關於「問道盤」身世的、龐大的謎團。\n\n「原來如此。」墨飛望著那座古樸的石門，心跳如鼓，「凌霜師姐帶我來，不只是歷練。」\n\n「這裡，真的，藏著問道盤的答案。」\n\n他抬眼，恰見凌霜也正回眸望他，那清冷的眸中，似有深意。四目相接，凌霜幾不可察地，微微頷首，彷彿在無聲地印證著他的猜想。\n\n「入陣!」領隊的凌霜一聲令下，率先踏入了那扇散發著洪荒氣息的石門。\n\n二十名內門弟子，魚貫而入。\n\n墨飛深吸一口氣，壓下心頭的驚濤駭浪，握了握拳，眼底，是探尋的熾熱，更是迎向未知的戰意。\n\n「問道盤的祕密，後山的古怪，古洞的來歷……」他望著那扇吞吐著上古之力的石門，一步，踏了進去，\n\n「這一趟，我墨飛，要親手，把這團謎，算個明白。」\n\n石門之後，白光一閃。\n\n當那刺目的白光散去，墨飛只覺得腳下一實，一股混雜著腐葉、妖血與濃郁到令人窒息的靈氣的氣息，撲面而來。\n\n他睜開眼——\n\n眼前，是一片遮天蔽日、古木參天、瀰漫著紫黑色瘴氣的、廣袤無垠的原始森林。林深處，隱隱傳來妖獸的嘶吼，此起彼伏，令人毛骨悚然。\n\n萬妖森林，到了。\n\n而墨飛還不知道，這一趟深入，他不但將揭開問道盤身世的第一角，更將在這妖獸橫行的凶險之地，迎來，他修行路上，最兇險、也最關鍵的一場淬鍊。\n\n——\n\n入林不過半個時辰，第一場凶險，便驟然降臨。\n\n森林深處，紫黑瘴氣翻湧，一陣密集而急促的破空聲，自四面八方，同時響起!\n\n「小心!是『噬魂鴉』群!」隊中一名經驗豐富的弟子失聲驚呼。\n\n漫天黑影，如烏雲壓頂般，自林冠間俯衝而下。那是一群通體漆黑、雙目泛著幽綠鬼火的妖鴉，每一頭都有孩童大小，尖喙利爪，更兼那幽綠的鬼火，專噬人神魂。\n\n【噬魂鴉·群│築基一至二層│單體戰力80-120│數量:百餘】\n〔群攻，以鬼火亂人神識，再蜂擁啄食。單體不強，勝在數量與亂神〕\n\n百餘頭!\n\n饒是這二十名內門弟子皆是築基翹楚，驟遇這鋪天蓋地、又能亂人神智的鴉群，一時也陣腳大亂。那幽綠的鬼火四處亂竄，不少弟子被鬼火撲中，神識一陣恍惚，護體靈光都險些潰散。\n\n「結陣!背靠背，護住神台!」凌霜清喝一聲，率先出手。數十柄飛劍縱橫，所過之處，鴉群成片墜落。可她一人再強，也護不住全場，那鴉群數量太多，又刁鑽難纏，弟子們漸漸被沖散，陷入各自為戰的險境。\n\n洛雲軒也自顧不暇，一身煉器世家的法器盡數祭出，才堪堪護住自己。\n\n慌亂之中，一名年輕的女弟子被鬼火撲中神識，身形一滯，數頭噬魂鴉立刻蜂擁而上，尖喙利爪，朝她面門啄去!\n\n「小心!」墨飛暴喝。\n\n千鈞一髮之際，他動了。\n\n問道盤，早已將這鴉群的攻擊軌跡、鬼火的規律，盡數拆解——〔鬼火三息一亂，間隙可尋;鴉群雖眾，然懼『金』屬鋒銳與『光』屬純陽〕。\n\n墨飛一馬當先，擋在那女弟子身前。他將新得的《太一光明經》催發到極致——那光系內功的純陽之力，竟化作一圈溫潤而灼目的金光，將撲來的鬼火，盡數消融!噬魂鴉最懼純陽，觸之即退。\n\n同時，他一記《裂石訣》金系氣刃橫掃，鋒銳無匹，將那幾頭撲近的噬魂鴉，盡數斬落!\n\n「跟緊我!」墨飛拉起那嚇得魂不附體的女弟子，以《太一光明經》的光罩護住二人神台，又以《寒瀑劍》的水系寒氣封鎖身側，那套攻防補控俱全的配置，在這混亂的鴉群中，竟硬生生開闢出一片安穩之地。\n\n他一邊護人，一邊揚聲，將問道盤算出的破解之法，傳遍全場:「莫要慌亂!這鴉群懼純陽鋒銳!催動金系、火系、光系功法，守住神台，鬼火自破!」\n\n那清晰而篤定的指引，如定海神針，讓陷入混亂的弟子們，瞬間找到了主心骨。眾人依言而行，催動相剋的功法，護住神識，鴉群的攻勢，登時被遏制。\n\n凌霜見狀，飛劍一引，配合墨飛指出的破法，一輪凌厲的劍雨，終將那百餘頭噬魂鴉，盡數絞殺。\n\n——\n\n鴉群退去，林中重歸死寂。\n\n弟子們驚魂未定，劫後餘生地喘著粗氣。而所有人的目光，不約而同地，聚向了那個一身青衫、神色沉靜的少年——墨飛。\n\n方才那場混亂，是他一眼看穿鴉群的破綻，是他一馬當先護住同門，更是他那一句清晰的破法，力挽狂瀾。\n\n「他……那個築基三層的?」\n\n「方才若非他指出破法，咱們怕是要折損幾人……」\n\n那被他救下的女弟子，更是感激涕零，盈盈一拜:「多謝師兄救命之恩!」\n\n墨飛淡淡回禮，並未居功。\n\n而人群中的洛雲軒，望著墨飛，那張陰鷙的臉，一陣青一陣白。他堂堂築基後期，方才自顧尚且不暇;而那個被他斥為「拖累」的雜役，卻在亂局中，護人、破陣、指揮全場，出盡了風頭。\n\n這一巴掌，打得他，火辣辣地疼。\n\n「哼，不過是些取巧的雕蟲小技。」他冷哼一聲，別過頭去，卻掩不住眼底那愈發濃烈的忌恨。\n\n凌霜將這一切，盡收眼底。她清冷的目光，在墨飛身上停留了片刻，那眸中的欣賞，又深了一分。\n\n「走。」她收起飛劍，淡淡道，「這裡，只是萬妖森林的最外圍。」\n\n「真正的凶險與機緣，還在，更深處。」\n\n墨飛望向那瘴氣瀰漫、深不見底的森林腹地，握了握拳。\n\n他知道，問道盤的答案，正在那更深處，等著他。"}, {"t": "第二十二章 呼應", "c": "越往森林深處，瘴氣越濃，靈氣越是紊亂，妖獸的嘶吼也越發密集。\n\n凌霜領著眾人，沿著一條相對安穩的路徑，緩緩推進。一路之上，眾弟子倒也採集了不少珍稀靈材，斬殺了幾頭落單的妖獸，收穫頗豐。\n\n而墨飛，卻在這一路上，心緒難平。\n\n自踏入秘境石門，他識海裡的問道盤，那股「同源呼應」的感應，便一直隱隱牽引著他。越往深處，那呼應，便越是清晰、越是強烈。就像一根無形的絲線，一頭繫著他識海中的問道盤，另一頭，繫著這森林深處某個他看不見的所在，正輕輕地，一下一下，拉扯著他。\n\n他不動聲色地，用問道盤標定著那呼應的方位。它並不在凌霜所領的這條主路上，而是偏向——森林更深、更凶險的西南方。\n\n「那裡，有東西。」墨飛心中篤定，「與問道盤相關的東西。」\n\n——\n\n當夜，眾人於一處靈氣稍穩的谷地紮營歇息。\n\n墨飛尋了個由頭，悄然來到凌霜身側。\n\n「師姐。」他壓低聲音，「西南方，有一股道韻，在呼應我的……問道盤。」\n\n凌霜正閉目調息，聞言，那雙秋眸緩緩睜開，深深地凝視著他。良久，她才輕聲道:「你，終於感應到了。」\n\n「師姐早知道?」\n\n「我不知那具體是何物。」凌霜清冷的聲音裡，難得地帶上了一絲鄭重，「但我知道，這萬妖森林的深處，藏著一處上古遺跡。三年前，我隨師尊入此秘境，師尊曾在那遺跡之外，駐足良久，神色凝重，只留下一句——『此地道韻，非問道之器不可解』。」\n\n「問道之器。」墨飛心頭巨震。\n\n「後來我在你身上，感應到一絲同源的、極其微弱的道韻波動。」凌霜的目光，落在他的眉心，彷彿能看穿那識海中的玉盤，「我便猜，你所持的，或許，正是那『問道之器』。」\n\n「所以，我帶你，來了。」\n\n墨飛怔怔地望著凌霜，心底翻江倒海。他一直以為，問道盤的祕密，只有他一人知曉。卻不想，這位深不可測的內門天驕，早已窺見了端倪，更為他，鋪好了這一趟探尋之路。\n\n「師姐，為何要幫我?」他忍不住問。\n\n凌霜沉默片刻，那清冷的臉上，掠過一縷極淡的、複雜的情緒。\n\n「因為我師尊臨終前，曾有一願未了。」她輕聲道，聲音裡藏著遙遠的追憶，「他窮盡一生，追尋『道之本源』，卻困於這遺跡之外，抱憾而終。」\n\n「他說，若有朝一日，有持『問道之器』者現世……」凌霜抬眸，直直望入墨飛的眼睛，「便是，叩開那扇門的時候。」\n\n「墨飛，」她一字一句，「我幫你，是為了我師尊那未了的道;也是為了……我自己，想親眼看看，那扇門後，究竟是什麼。」\n\n谷地的篝火，在二人之間，輕輕搖曳。\n\n墨飛望著凌霜那雙藏著追憶與探尋的眸子，忽然覺得，眼前這個高高在上、深不可測的天驕，與他，竟有著某種奇妙的、共通的東西——他們，都是在這以力證道的世間，執著地，追尋著另一種「道」的人。\n\n「多謝師姐。」他鄭重一揖，「這扇門，墨飛，願與師姐，一同去叩。」\n\n——\n\n然而，這一番密談，卻被一雙陰鷙的眼睛，遠遠地，窺見了。\n\n不遠處的暗影裡，洛雲軒死死盯著那篝火旁相談甚歡的二人，一張臉，早已扭曲得不成模樣。\n\n他愛慕凌霜久矣，苦苦追求而不得。而那個他視若螞蟻的墨飛，卻不但在秘境入口出盡風頭，此刻更與凌霜，單獨密談，情狀親密!\n\n妒火，如毒蛇般，噬咬著他的心。\n\n「墨飛……」他從牙縫裡，擠出這個名字，眼中，凶光畢露，「一個下賤的雜役，也配與師姐並肩?也配，得師姐另眼相待?」\n\n「這萬妖森林，凶險萬分。」他陰惻惻地低語，一個惡毒的念頭，在他心底，悄然生根，「若你，不慎死在了哪頭妖獸的口中……那，可就怨不得別人了。」\n\n他望著墨飛的背影，那陰鷙的目光裡，殺機，已然凝聚。\n\n——\n\n翌日，隊伍繼續深入。\n\n行至一處岔路，凌霜停下腳步。她清冷的目光掃過眾人，緩緩道:「前方地形複雜，妖獸兇猛。為採集更多機緣，我等分作兩隊。」\n\n「一隊隨我，往東北的『百獸谷』;另一隊，往西南的『幽瘴林』採集靈材。兩隊，三日後，於此地會合。」\n\n墨飛心頭一動——西南，正是問道盤呼應的方位!\n\n他正欲請纓，凌霜卻已先一步，清冷開口:「墨飛，你隨西南一隊。」她的目光，似有深意地，在墨飛身上一掃——她這是，借分隊之名，將他，往那遺跡的方向，送去。\n\n「是。」墨飛會意，鄭重應下。\n\n可他話音剛落，一道陰陽怪氣的聲音，便響了起來。\n\n「既如此，」洛雲軒越眾而出，「西南幽瘴林凶險，便由我，帶隊前往。師姐放心，有我在，定護得諸位師弟師妹周全。」他說得冠冕堂皇，那落在墨飛身上的目光，卻閃過一絲不易察覺的、狠戾的得意。\n\n凌霜秀眉微蹙，似有遲疑。\n\n墨飛心中警鈴大作。他的問道盤，早已將洛雲軒那眼底一閃而過的殺機，盡數捕捉。\n\n這洛雲軒，主動請纓帶隊西南，絕非好意——他，是要借這凶險的幽瘴林、借這脫離凌霜視線的三日，對自己，下殺手!\n\n一場，潛藏於秘境深處的殺局，已然，悄然張開。\n\n墨飛垂下眼，唇角，卻壓下一絲冷意。\n\n「洛雲軒，你想在這幽瘴林裡，借妖獸之手，除掉我?」他心底冷笑，「好。」\n\n「那我倒要看看——」\n\n「是你這築基後期的殺局算得深，還是我墨飛的問道盤，算得，更深。」\n\n——\n\n西南一隊，共八人，由洛雲軒領隊，往那瘴氣瀰漫的幽瘴林行去。\n\n隊中除了墨飛，尚有昨日被他所救的那名女弟子——名喚沈清弦，是內門一位長老的記名弟子，性子清冷卻心地良善;還有幾名與洛雲軒交好、唯他馬首是瞻的弟子。\n\n墨飛看得分明:這一局，洛雲軒占盡了地利人和。八人之中，大半唯洛雲軒之命是從;而這幽瘴林，更是凶險難測，任何一場「意外」，都可解釋為妖獸所為。\n\n可墨飛，並不慌。\n\n他有問道盤。洛雲軒的每一分惡意，每一絲異動，都逃不過他的眼。何況——他心底，還藏著一件洛雲軒絕不知曉的底牌:他此刻的真實戰力，配上那套配置，早已不輸於這築基後期的洛雲軒。\n\n「藏拙。」他垂眸，將那份鋒芒，深深斂去，「先看看，你這殺局，要怎麼出手。」\n\n行至幽瘴林深處，洛雲軒果然，開始動作了。\n\n他以「探路
