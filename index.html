」為名，將隊伍,一步步,引向瘴氣最濃、妖獸最密的凶險地帶。行至一處紫黑瘴氣翻湧的沼澤邊,他忽然停下腳步,「無意」地,將手中一枚引動妖獸的「血煞珠」,悄然捏碎。\n\n那濃烈的血腥氣,瞬間在瘴氣中瀰漫開來。\n\n下一刻,沼澤深處,一聲震天的咆哮響起!一頭渾身覆著黑色鱗甲、雙目赤紅的巨型妖獸,轟然自沼澤中暴起——\n\n【黑沼蛟│築基後期│戰力 400│受血煞之氣引動,狂暴嗜殺】\n\n「不好!妖獸暴起!」洛雲軒「驚呼」一聲,率先閃到一旁,同時,身形一晃,「慌亂」之中,竟一把將墨飛,狠狠推向了那暴怒的黑沼蛟!\n\n「墨師弟小心——!」他嘴上「驚呼」,那一推的力道,卻是實打實地,要將墨飛,送進那妖蛟的血盆大口!\n\n好狠的算計!借妖獸暴起之機,一推,便可將墨飛置於死地,事後,更可推得一乾二淨——「是墨飛自己躲避不及,喪身妖口」。\n\n若是尋常築基三層的弟子,遭此暗算,又猝逢戰力四百的越級妖獸,只怕當場,便要血濺五步。\n\n可惜,他算計的,是墨飛。\n\n早在洛雲軒捏碎血煞珠的剎那,墨飛的問道盤,便已將這殺局,連同那即將暴起的黑沼蛟、洛雲軒那一推的軌跡,盡數,算得清清楚楚。\n\n他甚至,故意露出一副「猝不及防」的模樣,任由洛雲軒將他推出。\n\n而在被推向妖蛟的剎那——墨飛的身形,詭異地一擰,借著那推力,不偏不倚,卸向了黑沼蛟攻擊的死角;《厚土樁》《太一光明經》的護體之力,同時催發到極致。\n\n黑沼蛟那雷霆一撲,擦著他的身側,轟然砸進了瘴氣裡。\n\n墨飛,毫髮無傷。\n\n他穩穩落地，回頭,望向那臉上「驚慌」尚未褪去、眼底得意卻已凝固的洛雲軒,唇角,勾起一抹冰冷的弧度。\n\n「洛師兄，」他聲音平靜,卻字字如刀,「多謝你這一推。」\n\n「不過——」他望著那頭被引來的、暴怒的黑沼蛟,又望了望面色劇變的洛雲軒,眼底寒光一閃，\n\n「你引來的這頭妖獸,」\n\n「該怎麼收場,你,可算清楚了?」"}, {"t": "第二十三章 遺跡", "c": "那頭戰力四百的黑沼蛟，一撲落空，暴怒地調轉身軀，赤紅的雙目，卻不再盯著墨飛——而是死死鎖住了離它最近的、方才捏碎血煞珠的洛雲軒!\n\n血煞之氣，本就出自洛雲軒之手，那氣息，在他身上，最為濃烈。\n\n「你——!」洛雲軒魂飛魄散。他千算萬算，算計著要借妖獸除掉墨飛，卻萬萬沒算到，那被引來的凶獸，第一個要撕碎的，竟是他自己!\n\n黑沼蛟咆哮著，朝洛雲軒,狂撲而至!\n\n「救我!快救我!」洛雲軒色厲內荏地祭出一身法器，卻在那戰力四百、又受血煞催狂的妖蛟面前，脆弱得如同紙糊。妖蛟一爪拍飛他的法器，利齒,便朝他的頭顱,咬下!\n\n千鈞一髮之際——\n\n一枚金系氣刃，破空而至，狠狠釘入黑沼蛟的眼中!\n\n黑沼蛟一聲慘嘶，那一口，堪堪偏開，救下了洛雲軒一條性命。\n\n出手的，是墨飛。\n\n洛雲軒癱坐在地，難以置信地望著那個他方才還要置於死地、此刻卻反手救了他的少年。\n\n「你……你為何救我?」他嘶聲問，聲音抖得不成樣子。\n\n「我不是救你。」墨飛淡淡道,身形已欺近那受傷暴怒的黑沼蛟，「你死不死，與我無關。」\n\n「我只是——」他一邊以《寒瀑劍》的寒氣遲滯妖蛟,一邊冷冷道，「不想讓凌霜師姐的隊伍,折損在你這蠢貨引來的禍事上。」\n\n言罷,他不再看洛雲軒，將全副心神，投入了與黑沼蛟的搏殺。\n\n戰力四百的越級妖獸,墨飛獨力難支。可他此刻已非吳下阿蒙——築基三層、戰力三百二,配上那六維俱全的配置,他雖不能力壓,卻能以算計周旋。\n\n他一邊揚聲,將問道盤算出的破法傳給眾人:「此蛟眼、腹為弱點!沈師妹,以你的冰系,封它下盤!其餘人,金火屬性,攻其雙眼!」\n\n那沈清弦本就對墨飛心存感激,又見他臨危不亂,當即依言,一道冰封,鎖住了妖蛟的下盤。其餘弟子,也在墨飛的指揮下,或攻或守,漸漸將那狂暴的妖蛟,逼入絕境。\n\n最終，墨飛抓住妖蛟受冰封而滯澀的剎那,將一枚淬鋒丹的增益,盡數灌注刀身,一記蓄勢已久的破甲重擊,自那被氣刃洞穿的眼窩,直搗其腦!\n\n黑沼蛟龐大的身軀,劇烈一顫,轟然倒地,沒了聲息。\n\n——\n\n戰罷,眾人皆是心有餘悸。\n\n而所有人的目光,都複雜地,在墨飛與那癱坐在地的洛雲軒之間,來回逡巡。\n\n方才那一幕,眾人皆看得分明:是洛雲軒捏碎了引妖的血煞珠,是他「失手」將墨飛推向妖蛟。那所謂的「意外」,分明,是一場針對墨飛的、拙劣的殺局!\n\n只是那殺局搬起石頭,砸了自己的腳;而墨飛,非但識破了殺局、全身而退,更反手,救了洛雲軒一命,還力挽狂瀾,斬殺了妖蛟。\n\n高下,人品,一目了然。\n\n「洛師兄,」沈清弦冷冷開口，清麗的臉上滿是鄙夷，「你捏碎血煞珠、推墨師兄入險,這『意外』,回去之後,你可要,好好向凌霜師姐解釋。」\n\n洛雲軒面如死灰。他偷雞不成蝕把米,不但沒能除掉墨飛,反倒當著眾人的面,將自己那狠毒的嘴臉,暴露無遺。他知道,回去之後,凌霜必不會輕饒。\n\n「墨飛……」他望著墨飛，眼中，是刻骨的怨毒,卻又夾雜著一絲被救的、屈辱的複雜，「你別得意!此仇,我洛雲軒,記下了!」\n\n「隨便你。」墨飛連看都懶得看他一眼，收起斷刀，望向了森林更深的西南方。\n\n那裡,問道盤的「呼應」,已強烈到了極致。\n\n「遺跡,就在前方。」他心中篤定。\n\n——\n\n墨飛不再理會洛雲軒,獨自一人,循著那呼應的牽引,往西南深處行去。沈清弦與幾名弟子見狀,也默默跟上——經此一事,他們早已對墨飛心悅誠服。唯有洛雲軒,遠遠綴在後方,眼神陰晴不定。\n\n穿過一片瘴氣最濃的密林,前方,豁然開朗。\n\n一座古老、恢弘、卻早已殘破的巨大建築遺跡,靜靜矗立在森林的中央,被無盡的歲月與瘴氣所籠罩。那遺跡以某種黝黑的、非金非石的材質築成,其上,銘刻著與秘境石門同源的、繁複到極致的上古符文,靈光雖已黯淡,卻仍透出一股睥睨萬古的、洪荒般的氣息。\n\n當墨飛的目光,落在那遺跡的剎那——\n\n識海裡的問道盤,轟然震動!那一直隱隱的「呼應」,在這一刻,化作了驚濤駭浪!盤面之上,道紋暴亮,一行行他從未見過的字符,瘋狂閃爍!\n\n【偵測到:上古「問道」道統遺跡!】\n【與宿主識海『問道盤』——同源!同宗!】\n【權能共鳴中……遺跡禁制,正在為宿主……鬆動。】\n\n墨飛渾身劇震,呼吸幾乎停滯。\n\n問道道統!\n\n原來,他這方問道盤,並非什麼孤立的奇物。它,是一整個早已湮沒於歲月的、上古「問道」道統的傳承之器!而這座萬妖森林深處的遺跡,便是那道統,遺留於世的——最後的痕跡!\n\n凌霜的師尊窮盡一生而不得其門而入的遺跡,此刻,竟因他識海中的問道盤,而禁制鬆動,緩緩,為他,敞開了一道縫!\n\n「這就是……問道盤的來歷。」墨飛望著那恢弘的遺跡,心潮澎湃,難以自已，「我一直在尋的答案,終於……」\n\n他一步,一步,朝著那扇因他而鬆動的、通往上古道統的遺跡之門,走去。\n\n沈清弦等人望著那突然「活」過來、與墨飛遙相呼應的遺跡,皆是駭然失色,不敢近前。\n\n而遠處的洛雲軒,望著這一幕,那陰鷙的眼底,除了怨毒,更騰起了一股熾烈的、瘋狂的貪婪——\n\n「上古遺跡……道統傳承……」他舔了舔乾裂的嘴唇,眼中凶光大盛，「墨飛,原來,你身上,藏著這等驚天的祕密!」\n\n「這等機緣,豈能,讓你這雜役獨得?」\n\n一個比方才更加瘋狂、更加惡毒的念頭,在他心底,轟然炸開。\n\n而墨飛,渾然不覺。他的全副心神,都已被那扇緩緩敞開的、通往問道道統的遺跡之門,牢牢吸引。\n\n門後,那湮沒了萬古的祕密,正等著他,親手,揭開。\n\n——\n\n墨飛踏入遺跡之門的剎那，身後那道因問道盤而鬆動的禁制光幕，便再度合攏，將沈清弦等人，隔絕在外。\n\n「墨師兄!」沈清弦在門外驚呼，卻被那禁制擋得無法近前。\n\n「無妨。」墨飛的聲音，自光幕內傳出，沉靜而篤定，「這遺跡,唯持問道之器者,方能入內。你們,在外等我。」\n\n言罷，他不再遲疑，一步步，深入那湮沒了萬古的遺跡。\n\n遺跡之內，比外觀所見，更為恢弘。一條幽深的長廊，兩壁銘刻著無數古老的壁畫與符文。墨飛以問道盤的「觀道」之能，一路行去，那些早已無人能解的壁畫，竟在他眼前，緩緩流轉，訴說起一段湮沒於時光深處的往事——\n\n那是一個,早已消逝的上古道統。\n\n不同於當世「以力證道」的主流,這「問道」道統的先賢們,窮盡一生,追尋的,是「丈量大道、參透萬物之理」的另一條路。他們不以境界壓人,不以蠻力爭鋒,而是以一雙「看得見道」的眼睛,以「算盡天地之理」的智慧,走出了一條,驚才絕艷、卻又曲高和寡的證道之路。\n\n而墨飛識海中的問道盤——正是這問道道統的先賢,傾盡畢生道行所煉的、丈量大道的至寶!\n\n「原來如此……原來如此!」墨飛望著那壁畫,只覺得一股熱血,直衝天靈。\n\n他一直以為,自己這「以算證道」的路,是廢根無奈之下的自創,是離經叛道的旁門。卻不想——在這萬古之前,早有一整個道統的先賢,將這條路,走得驚天動地!\n\n他不是孤身一人。他,是這湮沒道統的,唯一傳人!\n\n長廊的盡頭，是一座空曠的大殿。大殿中央，一方古樸的道台之上，懸浮著一縷若有若無的、散發著溫潤道韻的光團。\n\n當墨飛靠近的剎那,那光團驟然一亮,一道蒼老、悠遠、彷彿穿越了萬古歲月的意念,直接,印入了他的識海——\n\n「持問道之器者……你,終於來了。」\n\n「吾乃問道一脈,末代傳人之殘念。」\n\n「問道之道,以觀為始,以算為徑,以理證道……然,此路艱險,曲高和寡,終至道統凋零,唯餘吾一縷殘念,與這半殘之器,苦守萬古,只為……等一個,能將此道,重新走下去的後人。」\n\n「你,可願,承此道統?」\n\n墨飛立於道台之前，望著那縷苦守了萬古的殘念，心潮澎湃，難以自已。\n\n他想起青石鎮測靈石前的宣判，想起這一路以「算」翻盤的每一場血戰，想起程伯那句「以算證道，一旦走通，便是別人一輩子都望塵莫及的境地」——\n\n原來，他這一路懵懂走來的「算著打」，竟真的，暗合了一整個上古道統的至理!\n\n「晚輩墨飛，」他鄭重地，對著那縷殘念，深深一拜，一字一句，斬釘截鐵，\n\n「願承問道之道!」\n\n「將這條，先賢們未走完的路——」\n\n「親手,走到那,萬古無人抵達的盡頭!」\n\n那縷殘念，似有所感，溫潤的道韻，將墨飛,緩緩包裹。\n\n而就在此時——\n\n遺跡之外，那道合攏的禁制光幕上，忽然，裂開了一道細微的縫隙。\n\n一道陰鷙的身影，趁著沈清弦等人不備，如鬼魅般，悄然,擠入了那道縫隙,潛入了遺跡之中。\n\n正是,心懷叵測的,洛雲軒。\n\n他望著大殿中那被道韻包裹的墨飛，望著那道台之上散發著無盡機緣的光團，眼中，貪婪與怨毒，燃燒成一片瘋狂的火焰。\n\n「上古道統的傳承……」他舔著嘴唇，一步步，向著渾然不覺的墨飛，陰森森地,逼近，「墨飛,你死之後,這潑天的機緣,便都是我洛雲軒的了!」\n\n他的手中，一枚淬滿劇毒的煉器世家秘寶，已然，悄然，對準了墨飛的後心。\n\n而沉浸在承接道統之中的墨飛，對這近在咫尺的殺機，竟,一無所覺。"}, {"t": "第二十四章 傳承", "c": "那枚淬滿劇毒的秘寶，對準了墨飛的後心，洛雲軒陰森的殺意，已凝聚到了頂點。\n\n墨飛,渾然不覺。\n\n或者說——在旁人看來,渾然不覺。\n\n可他識海中的問道盤,自那縷殘念傳承之時起,便已與這整座問道遺跡的道韻,連成了一體。這遺跡之內的一草一木、一絲一縷的異動,皆逃不過它的感知。\n\n早在洛雲軒擠入禁制縫隙的剎那,一行猩紅的警示,便已在墨飛識海深處,悄然亮起:\n\n【警示:洛雲軒潛入。殺意極濃。目標:宿主後心。】\n【毒器:「化骨蝕魂針」,見血封喉。】\n\n墨飛的心,沉靜如水。\n\n他沒有動,任由洛雲軒一步步逼近,任由那毒針對準自己的後心——他要的,是讓這條藏在暗處的毒蛇,把它最惡毒的獠牙,徹底,亮出來。\n\n「墨飛,受死吧!」\n\n洛雲軒再不遲疑,將那枚化骨蝕魂針,挾著滔天的毒力,狠狠,刺向墨飛的後心!\n\n就在毒針即將入體的前一線——\n\n墨飛,動了。\n\n他的身形,如同蒼鷹般,詭異地向側一旋。那本該貫穿他後心的毒針,擦著他的衣衫,堪堪刺空!\n\n「什麼?!」洛雲軒駭然變色。他這一擊,蓄謀已久,又趁其「不備」,自問天衣無縫,怎料,竟被對方,在最後一瞬,精準避開!\n\n而他偷襲落空、身形前傾、破綻大開的這一剎那——正是墨飛,算好了的,反殺之機。\n\n「洛雲軒。」墨飛的聲音,冰冷得沒有一絲溫度,身形已欺至他身側，「我早說過,你想在秘境裡除掉我。」\n\n「所以,我一直,在等你出手。」\n\n他的話音未落,一套環環相扣的殺招,已然爆發!\n\n《太一光明經》全屬性增幅,將他此刻的戰力,推至巔峰;《寒瀑劍》水系寒氣,鎖住洛雲軒的身形;《裂石訣》金系氣刃,無視護體,直取其要害!承接了道統道韻的加持,他這一套配置,比之從前,更添了三分玄妙——那金系氣刃之中,竟隱隱蘊上了一絲「問道」的至理,鋒銳無匹!\n\n洛雲軒方才偷襲落空,舊力已盡,新力未生,又哪裡擋得住這雷霆一擊?\n\n「噗!」金系氣刃,洞穿了他的護體,狠狠釘入他的肩頭。洛雲軒慘嘶一聲,踉蹌跌退,一身築基後期的修為,竟被墨飛這一套精妙絕倫的配置,壓制得死死的,連還手之力都無!\n\n「你、你的戰力……怎會如此之高?!」洛雲軒面如死灰,難以置信,「你分明,只是築基三層!」\n\n「戰力三百二。」墨飛淡淡道,斷刀已抵上他的咽喉，「你我,本就相差無幾。」\n\n「而你,」他眼底寒光一閃，「卻蠢到,以為一個能一路越級、力戰雷無極的人,會真的,任你偷襲得手。」\n\n「洛雲軒,你輸就輸在——」\n\n「你到現在,都還當我,是隻,可以隨手碾死的螞蟻。」\n\n洛雲軒癱軟在地,面如金紙,眼中,是無盡的驚駭與絕望。他偷雞不成,反倒將自己,徹底,送進了絕境。\n\n「你……你要殺我?」他嘶聲問。\n\n墨飛凝視著他,良久,卻緩緩,收回了斷刀。\n\n「殺你?」他淡淡道，「你這條命,不值得我,在承接道統的聖地,染上血污。」\n\n「這遺跡之內的一切,你都看見了。」他望著洛雲軒,一字一句,「你若識相,回去之後,便當,什麼都沒發生過。你今日在秘境中,對我下的兩次殺手——沈師妹他們,都看在眼裡。」\n\n「這把柄,我,替你,留著。」\n\n洛雲軒渾身一顫。他終於明白,墨飛留他一命,非是慈悲,而是要以那兩次殺手的把柄,牢牢,拿捏住他。從此,他洛雲軒,便如芒刺在背,再不敢,對墨飛,有半分異動。\n\n「我……」洛雲軒咬著牙,滿是屈辱與怨毒,卻終究,一句狠話都不敢再說,踉蹌著,退出了大殿。\n\n墨飛望著他狼狽的背影,收回目光,不再理會。\n\n在他心中,洛雲軒這等跳梁小丑,早已不值一提。他此行真正的收穫,那足以改變他一生的機緣,才剛剛,開始。\n\n——\n\n大殿之內，那縷苦守了萬古的殘念，靜靜地，注視著這一切。\n\n「以弱勝強，以算破局，留敵一命以為己用……」殘念的意念，帶著一絲欣慰的嘆息，「好，好一個問道傳人。你這份心性與智慧,遠勝於吾當年。」\n\n「你既願承此道統,吾,便將這問道一脈,傾盡萬古所悟,盡數,傳你。」\n\n話音落下，那縷溫潤的道韻，化作一片浩瀚的信息洪流，湧入墨飛的識海！\n\n那是問道道統，萬古以來的積累——\n\n是「觀道」的更高深法門，讓他能看穿的，不再只是數值與破綻，更是那萬物運轉、道則流轉的至理;\n\n是一部名為《問道錄》的無上道法，教他如何以「算」御敵、以「理」證道，將他那套「配置」之道，推向一個前所未有的境界;\n\n更是,那方半殘的問道盤,缺失已久的另一半權能——\n\n【問道盤·權能大幅解封!】\n【新增權能:「推衍」——可推演戰局、功法、乃至天機之變。】\n【新增權能:「道眼」——可窺見更高境界者之部分虛實(如凌霜、程伯之流)。】\n【問道盤·由「殘」轉「全」……宿主道途,自此,豁然開朗。】\n\n墨飛盤坐於道台之前，任由那浩瀚的信息與道韻，在他體內、識海中，奔湧、沉澱、融匯。\n\n他能清晰地感覺到，自己那雙眼睛,正在發生脫胎換骨的蛻變——他「看得見」的世界,正變得,前所未有的,清晰而深邃。\n\n不知過了多久，當墨飛緩緩睜開眼時，那雙眸子深處，彷彿有星河流轉，有大道紋路，一閃而逝。\n\n他站起身，只覺得天地萬物,在他眼中,盡皆化作了可觀、可算、可推衍的道則。他這一路懵懂踐行的「以算證道」，在承接了完整的道統之後，終於，有了根、有了魂、有了那通往至高之境的,清晰路徑。\n\n「多謝前輩傳承。」他對著那已然,徹底消散的殘念,深深一拜。\n\n那縷苦守萬古的殘念,在傾盡所有之後,終於,含笑,歸於了大道。臨消散前,一句悠遠的話語,迴盪在大殿之中——\n\n「問道一脈……就託付,給你了……」\n\n「去吧……去把這條路……走到,吾等,未曾抵達的,盡頭……」\n\n大殿之內，重歸寂靜。\n\n墨飛立於道台之前，握了握拳，只覺得體內道基圓融、識海清明,一股睥睨天下的自信與戰意,自心底,油然而生。\n\n他,已不再是那個,只能靠問道盤「看帳」的廢根少年。\n\n他,是問道一脈的傳人。是這方天地間,唯一一個,能「觀天地、算大道、以理證道」的——問道者。\n\n「這條路，」他望向大殿之外，那通往更廣闊天地的方向，眼底，是化不開的、燃燒著的、屬於一個道統傳人的雄心，\n\n「先賢們沒能走完。」\n\n「那便,由我墨飛,替你們——」\n\n「走下去。」\n\n——\n\n殘念消散之後，那道台之下，緩緩升起一方古樸的石匣。\n\n墨飛心中一動，上前將石匣打開。匣中所藏，讓他呼吸都為之一滯——\n\n其一，是一枚溫潤的、通體流轉著道紋的白玉令牌，正是問道一脈的道統信物;其二，是幾張以某種獸皮繪就的、記載著上古問道秘法與煉丹古方的殘卷;其三，則是數件散發著幽幽寶光的法器與一小堆,連問道盤都難以估量其價值的,上古靈材。\n\n這些,都是那消散的殘念,留給傳人的、最後的餽贈。\n\n墨飛小心翼翼地,將這些無價之寶,盡數收入納物袋。單是那幾張問道秘法,便足以讓他那套配置,再上數個台階;而那些上古靈材,更是他日後衝擊金丹、乃至更高境界的,絕佳助力。\n\n「這一趟萬妖森林,」墨飛心底火熱，「來對了。」\n\n收好祕藏，他忽然想試一試,那新解封的權能。\n\n他凝神,催動那名為「推衍」的新權能,將心念,投向大殿之外——\n\n剎那間,一幅玄之又玄的畫面,在他識海中,緩緩鋪展:遺跡之外,沈清弦等人焦急守候的身影;更遠處,洛雲軒負傷奔逃、眼中怨毒未消的模樣;乃至那東北方,凌霜一隊,正遭遇一頭妖獸圍攻的險狀……皆化作一道道清晰的「推演」,呈於他眼前!\n\n「這便是……推衍。」墨飛心神巨震。\n\n從前的問道盤,只能「看」眼前之物;而如今,這「推衍」之能,竟能讓他,推演那視線之外的、戰局的流轉與變化!這於瞬息萬變的搏殺、於運籌帷幄的謀略而言,是何等逆天的權能!\n\n他又將那「道眼」之能,投向記憶中凌霜的身影。\n\n往日,問道盤凝視凌霜,只得一片「深不可測」的問號。可此刻,那「道眼」運轉,凌霜那深不可測的氣息之上,竟緩緩,浮現出一角清晰的虛實——\n\n【凌霜│築基後期(巔峰)│戰力……約1500】\n〔劍道天賦,冠絕當世。然……其命宮之中,似有一縷隱疾潛藏〕\n\n「戰力一千五百!」墨飛悚然一驚。凌霜那深藏的實力,竟恐怖至斯,幾近元嬰!而那「命宮隱疾」四字,更讓他心頭,莫名一沉。\n\n從前看不透的人,如今,能窺見一角了。\n\n墨飛闔上眼,壓下心頭的驚濤。他清楚地知道,自己,已然,徹底,脫胎換骨。\n\n那個站在測靈石前、被判「無緣」的廢根;那個躲在雜役堂、藏拙求存的少年;那個在擂台上、以命搏道的挑戰者——\n\n都已成為過去。\n\n從今日起,他墨飛,是問道一脈,睥睨古今的,唯一傳人。\n\n「凌霜師姐那邊,有險。」他睜開眼,眸中星河流轉,再無半分遲疑，「該我,去還她這一路的照拂了。」\n\n他握緊斷刀,一步,踏出了那扇苦守了萬古的遺跡之門。\n\n門外的天光,灑在他身上。而此刻走出遺跡的少年,眉宇之間,已然,多了一股,俯瞰眾生的,問道者的氣度。"}, {"t": "第二十五章 馳援", "c": "墨飛走出遺跡，沈清弦等人立刻圍了上來。\n\n「墨師兄!你沒事吧?那洛雲軒方才臉色慘白地逃了出去,還有那遺跡……」沈清弦一連串的驚問，卻在觸及墨飛的目光時，戛然而止。\n\n她怔怔地望著墨飛。\n\n還是那身樸素青衫，還是那張沉靜的臉。可不知為何，此刻的墨師兄，周身,竟透著一股說不出的、俯瞰眾生的氣度。那雙眼睛，深邃得彷彿藏著一整片星河，讓她這築基中期的修為，竟莫名地，生出一絲仰望之感。\n\n「無妨。」墨飛淡淡道，聲音卻透著不容置疑的鎮定，「洛雲軒的事,回去再算。此刻——」\n\n他眸光一凝，望向東北方，那「推衍」之能,早已將凌霜一隊的險狀,盡數映入他識海:\n\n【推衍:東北·百獸谷】\n【凌霜一隊,遭「九嬰妖蟒」圍攻。此妖,築基巔峰,九首同攻,毒煞滔天,戰力約900。】\n【凌霜……為護同門,力戰不退,然……命宮隱疾,恐為毒煞所引,危!】\n\n戰力九百的九嬰妖蟒!更兼凌霜那「命宮隱疾」，一旦被毒煞引動——\n\n墨飛心頭一沉。\n\n「凌霜師姐有難!」他斷喝一聲，不再多言，身形暴起，化作一道青光，朝著東北方,疾馳而去，「沈師妹,你們隨後跟來!」\n\n——\n\n百獸谷中，一場惡戰，正酣。\n\n那頭九嬰妖蟒，九顆猙獰的蟒首同時攻出，毒煞漫天，將凌霜一隊,逼入了絕境。數名弟子已然負傷，護體光幕搖搖欲墜。\n\n凌霜白衣勝雪，數十柄飛劍縱橫,劍光如織,獨力撐起了整個戰局。她劍道通神,一人之力,竟將那戰力九百的妖蟒,死死纏住。可那九嬰妖蟒生有九首,毒煞無窮,饒是她天資絕世,久戰之下,也漸露疲態。\n\n更兇險的是——那滔天的毒煞之氣,正一絲一縷,滲入她的經脈,悄然,引動著她命宮深處那縷,潛藏已久的隱疾!\n\n凌霜的臉色，以肉眼可見的速度，蒼白了下去。她御劍的手,微微一顫,一道劍光,竟出現了一瞬的滯澀。\n\n就是這一瞬。\n\n九嬰妖蟒抓住這稍縱即逝的破綻，一顆巨大的蟒首，裹挾著致命的毒煞，朝凌霜當頭,咬下!\n\n「師姐小心!」眾弟子失聲驚呼，卻救之不及。\n\n凌霜心神被隱疾所擾,竟避讓不及。眼看那毒煞蟒首,便要將這絕世天驕,吞入腹中——\n\n嗤!\n\n一道蘊著問道至理的、鋒銳到極致的金色氣刃，破空而至，精準地,洞穿了那顆咬向凌霜的蟒首的獨目!\n\n九嬰妖蟒發出一聲驚天的慘嘶，那致命的一咬，堪堪偏開。\n\n凌霜死裡逃生，猛地抬頭,循著那氣刃的來向望去——\n\n只見一道青衫身影，自谷口飛掠而至，身形沉穩，氣度睥睨。他一雙眸子深處，星河流轉;周身,環繞著一股她既熟悉、又陌生的道韻。\n\n是墨飛。\n\n可又,不全是,她記憶中的那個墨飛。\n\n「墨飛?你……」凌霜清冷的眸中，第一次，露出了毫不掩飾的震驚。她分明感覺到，此刻的墨飛，那身氣息，較之三日之前，竟已,判若兩人!\n\n「師姐，穩住心神，這妖蟒交給我。」墨飛落在她身側，聲音沉靜如淵，「你命宮的隱疾，被毒煞引動了。速速退後,運轉功法,壓制隱疾。」\n\n凌霜心頭巨震——他,竟連她那深藏的命宮隱疾,都看得一清二楚?!\n\n可此刻,她已無暇細想。墨飛那份沉穩與篤定,竟讓她這絕世天驕,鬼使神差地,信了他,依言退後,凝神壓制那躁動的隱疾。\n\n而墨飛，獨自一人，迎向了那頭戰力九百的九嬰妖蟒。\n\n——\n\n九百的戰力，是墨飛此刻的近三倍。\n\n若在從前，這是一場,毫無勝算的死戰。\n\n可如今的墨飛，已非昔日。他承接了完整的問道道統，解封了「推衍」與「道眼」的權能，那套配置，更蘊上了問道的至理。\n\n他凝神望去，那「推衍」之能,將九嬰妖蟒九首同攻的軌跡、毒煞流轉的規律、乃至那唯一的、生死攸關的破綻,盡數,推演而出:\n\n【推衍:九嬰妖蟒·九首各司其職,然……九首之力,同出一源——其心臟,位於第五首之下。九首攻勢輪轉,每逢第五首吐信,其心臟護甲,現半息空門。】\n\n半息空門。心臟死穴。\n\n墨飛的眼底，星河流轉，一片清明。\n\n他不與那九首硬拚，只以《寒瀑劍》遲滯、《太一光明經》護體、《厚土樁》反彈，將那漫天毒煞與九首攻勢,一一化解、周旋。他如同一位技藝精湛的舞者,在那九死一生的毒煞之網中,精準地,踏著問道盤推演出的節奏,靜待著,那第五首吐信的,半息空門。\n\n一輪。兩輪。三輪。\n\n當那第五首終於吐信、心臟護甲現出半息空門的剎那——\n\n墨飛，動了。\n\n他將這一路的機緣、傳承、與畢生所學,盡數凝於一擊。《裂石訣》金系氣刃,蘊上問道至理,破開毒煞、洞穿護甲,如一道貫日的長虹,自那半息的空門,直搗妖蟒心臟!\n\n轟!\n\n九嬰妖蟒那九顆猙獰的蟒首，同時發出一聲驚天動地的哀嚎。它龐大的身軀,劇烈地抽搐了幾下,轟然,倒在了血泊之中。\n\n戰力九百的築基巔峰妖蟒——被一個築基三層的少年,以一場算無遺策的搏殺,斬殺於此!\n\n——\n\n百獸谷中，一片死寂。\n\n凌霜一隊的弟子們,望著那倒下的妖蟒,又望著那收刀而立、氣度睥睨的青衫少年,一個個,張大了嘴,忘了言語。\n\n而凌霜，這位向來清冷、深不可測的絕世天驕,此刻，望著墨飛的背影,那雙秋水般的眸子裡，翻湧著震撼、驚異，與一種,連她自己都未曾預料的,複雜情緒。\n\n三日之前，是她，護著這個煉氣圓滿的少年，一路走來。\n\n而三日之後，卻是這個少年，以一種讓她都望塵莫及的方式，反手，救了她一命，斬殺了她都難以獨力降服的妖蟒。\n\n墨飛轉過身，走到凌霜面前,遞上一枚,方才自遺跡祕藏中所得的、蘊著純陽道韻的丹藥:「師姐,此丹可壓制毒煞,暫緩你命宮的隱疾。回宗之後,我再為你,細細調理。」\n\n凌霜怔怔地,接過那枚丹藥。她凝視著墨飛,良久,清冷的唇,終於,極輕地,啟開:\n\n「你……在那遺跡之中,得了問道道統的傳承?」\n\n「是。」墨飛坦然點頭,「師姐師尊未了的道,晚輩,承下了。」\n\n凌霜靜靜地望著他,那眸中的震撼,漸漸,化作了一縷,前所未有的、溫柔而鄭重的光。\n\n「好。」她輕聲道，聲音裡，是釋然，是欣慰，更有一絲不易察覺的情愫，\n\n「我師尊……可以瞑目了。」\n\n「而你墨飛——」她抬眸,望向那走出遺跡、脫胎換骨的少年,唇角,綻開一抹,墨飛從未見過的、清淺而真實的笑意，\n\n「這條問道之路，我，願,陪你,一同走下去。」\n\n百獸谷的天光,灑在二人身上。\n\n墨飛望著眼前這位不再遙不可及、眼中盛滿星光的絕世天驕,心底,某個角落，悄然，被觸動了。\n\n「好。」他鄭重應下，唇角揚起，「一同走下去。」\n\n而在他識海深處，那由「殘」轉「全」的問道盤，正靜靜流轉著溫潤的道韻,彷彿,在為這新生的問道者,與他那,才剛剛,鋪展開來的,睥睨古今的仙途——\n\n輕輕,喝彩。\n\n秘境之行,已近尾聲。而墨飛知道,承接了問道道統的他,即將面對的,是一個,遠比萬妖森林,更廣闊、也更兇險的,天地。\n\n金丹之路,在前方,等著他。\n\n而那,湮沒於萬古的問道一脈,那通往至高之境的,漫漫長路——\n\n也才,剛剛,開始。\n\n——\n\n兩隊會合，秘境歷練，已近終期。\n\n回程的路上，墨飛,成了所有人矚目的中心。\n\n那斬殺九嬰妖蟒、力救凌霜的一幕，早已隨著沈清弦等人的口，傳遍了整支隊伍。眾內門弟子望向墨飛的目光，再無半分入秘境時的輕蔑,唯有敬畏與心悅誠服。那個曾被洛雲軒斥為「拖累」的煉氣雜役,如今,已是他們心中,深不可測的存在。\n\n而洛雲軒，則像一條喪家之犬，遠遠綴在隊伍的最後方,不敢與任何人對視。他兩次於秘境中對墨飛痛下殺手,又擅闖遺跡、圖謀傳承,這些惡行,沈清弦等人皆看在眼裡。他心知,回宗之後,等待他的,將是宗規的嚴懲,與凌霜的雷霆之怒。\n\n墨飛卻並未急著發作。他將那兩次殺手的把柄,牢牢攥在手中,如同一柄懸於洛雲軒頭頂的利劍。這條毒蛇,他要留著,慢慢,清算。\n\n「墨師兄,」沈清弦行至墨飛身側,清麗的臉上滿是敬佩，「經此一事,回宗之後,你之名,必將響徹整個內門。」\n\n墨飛淡淡一笑:「虛名而已。」\n\n他的目光，望向隊伍前方那道白衣勝雪的身影——凌霜正回眸望他,四目相接,那絕世天驕的眼底,漾起一縷清淺的、只予他一人的笑意。\n\n墨飛的心,微微一動。\n\n這一趟萬妖森林，他得了問道道統的傳承，解封了問道盤的權能，斬殺了越級的妖王，更……與這位曾遙不可及的天驕，並肩而立，結下了一段,微妙而深厚的情誼。\n\n收穫，遠超他入秘境時的想像。\n\n「問道盤的來歷，我已知曉。」他望向那通往宗門的方向，眼底，是化不開的篤定與雄心，「問道一脈的道統，我已承下。」\n\n「接下來——」\n\n他握了握拳,那雙星河流轉的眸子裡，燃起了一團,足以照亮整條仙途的火:\n\n「便是,以這問道之道,結金丹、破元嬰、渡天劫……一步一步,登上那,先賢們未曾抵達的,萬古之巔。」\n\n「而那時,」他望向天際那輪高懸的驕陽，一字一句，\n\n「這方天地,再無人,敢輕視,一個『廢根』的,問道之路。」\n\n秘境的出口，那扇散發著洪荒氣息的石門，已遙遙在望。\n\n墨飛邁開腳步，一步，一步，堅定地，朝著那扇通往嶄新天地的門，走去。\n\n一個廢根少年的問道傳奇，在承接了萬古道統之後，正式，翻開了,更加波瀾壯闊的,新的一頁。\n\n（卷三·問道傳承 上 完）"}, {"t": "第二十六章 清算", "c": "問劍宗，內門議事殿。\n\n秘境歷練歸來的次日，一場針對洛雲軒的問責，便在此地展開。\n\n主位之上，端坐著幾位內門長老，皆是元嬰之境的大能。凌霜立於一側，白衣勝雪，清冷的目光，落在殿中那個垂首而立的洛雲軒身上，不含一絲溫度。\n\n「洛雲軒，」一位鬚眉皆白的長老沉聲開口，「秘境歷練，本為同門砥礪。你身為帶隊之人，卻於幽瘴林中，捏碎血煞珠、暗推同門入險;更於上古遺跡外，行偷襲暗殺之事。此等惡行，可有?」\n\n洛雲軒面如死灰。他知道，此事，沈清弦等八人皆是人證，鐵證如山，抵賴不得。\n\n「弟子……弟子一時鬼迷心竅……」他撲通跪地，磕頭如搗蒜，「求長老開恩!」\n\n「鬼迷心竅?」凌霜終於開口，清冷的聲音，如寒冰刺骨，「你兩次三番,對同門痛下殺手,只因妒忌。這等心性,也配,列於我問劍宗內門?」\n\n她玉手一揮，一道劍光,將洛雲軒周身的護體靈光,盡數斬碎:「若非墨飛心性寬和,留你一命,你這條命,早已喪於秘境。」\n\n殿中眾長老,交換了一個眼神。洛雲軒之罪,已是板上釘釘。\n\n「念你尚是初犯，」那白眉長老終究緩了口氣，「按宗規：廢去半數修為，逐出內門，貶為外門雜役，思過三年。若再犯——逐出師門!」\n\n「不——!」洛雲軒慘嘶一聲。廢去半數修為、貶為雜役——這對一個心高氣傲的天驕而言,無異於生不如死!\n\n可他縱有萬般不甘,在這幾位元嬰長老面前,也不敢有半分反抗。他怨毒地,望了墨飛一眼,那眼神裡的刻骨仇恨,幾乎要化為實質。而後,便被兩名執事弟子,如死狗般,拖了下去。\n\n墨飛立於殿中，靜靜地看著這一切，面色平靜。\n\n洛雲軒的下場，是他咎由自取。可墨飛的問道盤，在洛雲軒被拖下去的剎那，卻悄然閃過一行「推衍」——\n\n【推衍:洛雲軒·煉器世家「洛家」嫡子。此番受辱,其家族,恐不會善罷甘休。潛在敵意:極高。】\n\n墨飛心中一凜。\n\n煉器世家洛家——那是一個,遠比洛雲軒本人,要龐大、要棘手得多的存在。今日清算了洛雲軒,不過是斬斷了一條毒蛇的獠牙;而那條毒蛇背後,那個盤踞已久的巢穴,只怕,已因今日之事,而對他,燃起了滔天的敵意。\n\n「麻煩,還在後頭。」墨飛心底了然。可他眼底,卻無半分懼意。這仙途之上,敵人只會越來越多、越來越強。他要做的,是讓自己,強到,無人敢動。\n\n——\n\n議事殿散去。\n\n墨飛之名，經此秘境一役，徹底,響徹了整個問劍宗內門。\n\n斬殺越級妖蟒、力救凌霜天驕、承得上古遺跡傳承——這一樁樁,一件件,皆是驚世駭俗的事蹟。往日那些對他不屑一顧的內門天驕,如今提及「墨飛」二字,無不,鄭重三分。\n\n甚至,連宗門的幾位元嬰長老,都對這個「以弱勝強、屢建奇功」的築基弟子,起了愛才之心,暗中,派人送來了不少修行資源。\n\n一時間,墨飛在內門的地位,水漲船高。\n\n可墨飛卻並未被這突如其來的聲名所擾。他心中清楚,這虛名之下,是更深的忌憚,也是更多的敵意。他謹記程伯「藏拙」的叮囑,對外,依舊只顯露築基三層的修為;那承自道統的完整權能、那推衍道眼的通天之能,他,一分,都未曾洩露。\n\n「洛家的敵意,宗門的關注,同門的忌憚……」墨飛立於聽濤居的院中,望著天際,心中盤算著，「木秀於林,風必摧之。」\n\n「這聲名,是助力,也是靶子。」\n\n他垂下眼,眸中星河流轉:「當務之急,是儘快,將這身修為與傳承,徹底,消化、掌控。」\n\n「唯有實力,才是,立於這風口浪尖,唯一的,倚仗。」\n\n——\n\n當夜，聽濤居。\n\n墨飛剛欲閉關參悟那承自道統的《問道錄》，院門，卻被一縷清冷的霜雪之氣，輕輕叩響。\n\n是凌霜。\n\n她一襲白衣，立於月下靈木之側，那清冷絕塵的臉上，此刻，卻透著一絲不易察覺的疲憊與蒼白。\n\n「師姐?」墨飛心中一動，那「道眼」悄然運轉——〔凌霜·命宮隱疾,今日,又有發作之兆〕。\n\n「你的『道眼』，連我這隱疾，都瞞不過。」凌霜似看穿他的心思,唇角泛起一絲苦澀的笑意，「秘境之中,那毒煞,終究,引動了我命宮的舊患。這幾日,發作得,愈發頻繁了。」\n\n墨飛神色一凜。他早在秘境之中,便已窺見凌霜那「命宮隱疾」。此患潛藏於她命宮深處,尋常手段難以根除,更會隨修為精進、心神損耗而反覆發作。這,竟是這位絕世天驕,深藏於那睥睨眾生的表象之下的,致命隱憂。\n\n「師姐,可否,讓我一觀?」墨飛鄭重道，「我承問道道統,得遺跡祕藏之古方;又習辨藥煉丹之術。或許——能為師姐,尋出一線根除的生機。」\n\n凌霜靜靜地望著他。\n\n這命宮隱疾,是她此生最大的祕密,也是最深的痛。連宗門那幾位元嬰長老、乃至她的師尊,窮盡手段,都只能壓制,無法根除。她從不曾,對任何人提起。\n\n可此刻,面對墨飛那雙星河流轉、盛滿真誠的眼睛,她那顆向來清冷孤高的心,竟鬼使神差地,軟了下來。\n\n「好。」她輕聲道，一步,走入院中,在墨飛面前,緩緩坐下，「這隱疾,困了我十年。若你,真能尋出生機……」\n\n她抬眸,望向墨飛,那雙秋水般的眸子裡,是十年孤寂之後,第一次,燃起的,一絲微弱的希望：\n\n「墨飛,我這條命,便,信你一回。」\n\n月光如水，靈木輕搖。\n\n墨飛望著眼前這位卸下了所有防備、將性命相托的絕世天驕，心底,某處,重重一動。\n\n「師姐放心。」他鄭重道，那雙承接了問道道統的眼睛,緩緩,運轉起「觀道」與「道眼」之能,凝神,望向凌霜那深藏隱疾的命宮，\n\n「你護了我一路。」\n\n「這一次,換我,來替你,算出一條,活路。」\n\n——\n\n墨飛凝神，將那新解封的「觀道」「道眼」之能，盡數運轉，探入凌霜那深藏的命宮。\n\n尋常修士診病，靠的是搭脈、觀氣、以神識探查，隔靴搔癢，往往只能窺其表象。可墨飛不同——問道盤的「觀道」，能將那命宮深處，道則的紊亂、隱疾的根源，化作可觀、可解的「道紋」，纖毫畢現地，攤在他眼前。\n\n片刻後，墨飛的臉色，凝重了下來。\n\n【凌霜·命宮隱疾·觀道解析】\n〔非尋常病症。乃一縷『上古劍煞』,深植命宮。〕\n〔此劍煞,來歷不明,似為凌霜幼年,承一部『絕世劍道功法』時,一併引入。它是她劍道通神之源,亦是……蝕她性命之根。〕\n〔壓制易,根除難。強行剝離,則其劍道盡毀;放任不理,則劍煞終將反噬,危及性命。〕\n\n墨飛倒吸一口涼氣。\n\n原來，凌霜那冠絕當世的劍道天賦，與這蝕她性命的命宮隱疾，竟是,同出一源!那一縷上古劍煞,既是她驚才絕艷的根基,也是懸於她頭頂的,催命之刃!\n\n這也難怪,宗門那幾位元嬰長老,乃至她師尊,都束手無策——強行根除,便毀了她的劍道;放任不管,便是慢性自戕。這是一個,近乎無解的死局。\n\n「如何?」凌霜見他神色凝重，心,微微一沉，「果然……無藥可醫,是麼?」十年來,無數次的希望與失望,早已將她的心,磨得近乎麻木。\n\n「不。」墨飛卻緩緩搖頭，眸中，星河流轉，「尋常之法,確是無解——因為他們,只把它當『病』來治。要麼壓制,要麼剝離。」\n\n「可它,不只是病。」墨飛一字一句，「它,是一縷『道』。是一縷,與師姐劍道,糾纏了十年的,上古劍煞之道。」\n\n凌霜身子一震，怔怔地望著他。\n\n「治病,講究驅邪扶正。」墨飛的聲音，沉靜而篤定，「可『道』,不能驅,只能——『化』。」\n\n「我承問道道統,得『觀道』之能,能看清這劍煞的道則紋路;更有遺跡祕藏中,一部關於『煉化道韻』的古法。」他望向凌霜,眼中,燃起一絲希望的光，「若能以問道之法,循序漸進,將這一縷上古劍煞的『煞』,一絲一絲地,煉化、馴服,化『煞』為『劍』——」\n\n「那麼,它便不再是蝕你性命的催命之刃,而會徹底,化作,你劍道的一部分。」\n\n「屆時,隱疾自除,師姐的劍道,更會,再上一層樓。」\n\n凌霜聽得,呼吸都停滯了。\n\n化煞為劍!以問道之法,將這困了她十年的死局,不是「治」,而是「化」——這等匪夷所思、卻又暗合大道的思路,是她窮盡十年,都不曾想到的!\n\n「只是,」墨飛話鋒一轉，神色鄭重，「此法凶險,亦需時日。煉化劍煞,需以師姐的心神為爐、以我的問道之能為引,更需幾味,能安神定煞的,上古靈材為藥。」\n\n「這幾味靈材,」他略一沉吟，「遺跡祕藏中,尚缺其二。需得,另尋機緣。」\n\n凌霜卻已顧不得那凶險與艱難。她望著墨飛，那雙向來清冷的眸子裡，此刻，盈滿了十年來,從未有過的,滾燙的希望與感激。\n\n「墨飛,」她輕聲道，聲音微微發顫，「你可知,你這一番話,對我而言,意味著什麼?」\n\n十年了。她背負著這催命的隱疾,以絕世之姿,行走於世,看似風光無限,實則,如履薄冰,每一日,都在與那潛藏的死亡,賽跑。而今日,這個她一度護在羽翼之下的少年,卻以一種,連宗門大能都不曾有的方式,為她,指出了一條,活路。\n\n「師姐言重了。」墨飛坦然一笑，「你護我一路,我還你一線生機。你我之間,不必言謝。」\n\n凌霜靜靜地望著他，月光下，那張清冷絕塵的臉上，緩緩，綻開了一抹，前所未有的、柔和而明媚的笑意。\n\n「好。」她輕聲道，眼底星光璀璨，「那從今往後，我凌霜的這條命，這一身劍道——」\n\n「便,交予你,墨飛,一同,參詳了。」\n\n那一夜，聽濤居的月色，格外溫柔。\n\n一個承接了萬古道統的問道少年，與一位背負著催命劍煞的絕世劍修，在這方小小的院落裡，因一縷「化煞為劍」的希望，將彼此的命運，悄然，交纏在了一起。\n\n而墨飛還不知道，凌霜命宮中那一縷「來歷不明的上古劍煞」，其源頭，竟也隱隱，牽連著那湮沒萬古的問道一脈,與這方天地,最深的祕密。\n\n這條為凌霜尋藥、化煞的路，將引領著他，一步步，走向那，更廣闊、也更驚心動魄的,天地深處。"}, {"t": "第二十七章 問道錄", "c": "自秘境歸來,墨飛便閉了關,一頭紮進了那部承自道統的《問道錄》之中。\n\n《問道錄》,是問道一脈的無上道法。它不教人如何以蠻力破敵,而是教人如何「觀天地、算大道、以理證道」。這部道法,與墨飛那雙看得見數值的眼睛、那顆最擅算計的心,簡直是,天作之合。\n\n隨著參悟的深入,墨飛只覺得,自己那套「以配為法、以算證道」的路,正被這部古老的道法,一點一點,拓寬、加深、拔高。\n\n從前,他能算清一場戰局的破綻;如今,他漸漸能「推衍」一場戰局的走向。\n\n從前,他能看清一件靈材的品階;如今,他漸漸能「觀」透一件靈材背後,道則流轉的至理。\n\n從前,他的功法配置,是「湊」出來的;如今,他能以問道之理,將六部功法的道韻,融會貫通,搭配得渾然天成,威力,更勝往昔。\n\n一月之後,墨飛出關。\n\n他的境界,已自築基三層,穩穩地,踏入了築基巔峰;而戰力,更是在《問道錄》與道統傳承的加持下,一舉突破,達到了——\n\n【墨飛│築基巔峰│戰力 680】\n\n戰力六百八!\n\n這個數字,已然,超越了昔日那位外門第一人雷無極,直逼,那些真正的內門頂尖天驕!\n\n而這,還只是他隱藏於「藏拙」表象之下的,真實實力。\n\n「築基巔峰。」墨飛立於院中,握了握拳,只覺得體內道基圓融、真元磅礴，「離金丹,只剩,臨門一腳了。」\n\n金丹,是修士的第二道大關。結成金丹,便可稱得上是,一方修士,壽元大增,實力更是脫胎換骨。而以墨飛此刻的底蘊——均衡道基、問道傳承、六部功法、完整權能——他這一枚金丹,只怕,將結得,與眾不同。\n\n「不急。」他心中盤算著，「金丹一結,便再難更改。需得,將這問道之道,參悟得更透徹些,方能結出,最契合我道的金丹。」\n\n「何況——」他望向凌霜所居的方向，眼神一凝，「師姐化煞所需的兩味靈材,還未著落。」\n\n——\n\n為凌霜「化煞為劍」,尚缺兩味安神定煞的上古靈材:一味,喚作「凝魂草」;一味,喚作「息壤玉髓」。\n\n這兩味靈材,皆是極其罕見之物。墨飛以「推衍」之能,反覆推算,又借閱了內門藏經閣的無數典籍,終於,尋得了些許線索——\n\n那「凝魂草」,據載,生於宗門千里之外的一處「幽冥墟」,乃是死氣與生機交纏之地所孕;而那「息壤玉髓」,更是可遇不可求,唯有在某些上古大能隕落之地的地脈深處,方有一線尋獲的可能。\n\n「幽冥墟……」墨飛沉吟。此地凶險,非同小可,絕非他此刻,可以獨自涉足。\n\n他將這線索,說與凌霜。凌霜聽罷,秀眉微蹙:「幽冥墟,乃是宗門劃定的『禁地』之一,死氣瀰漫,妖魔橫行,便是元嬰修士,亦不敢輕易深入。此事,急不得。」\n\n「待你我修為再進一步,或有宗門歷練之機,再行圖謀不遲。」她望向墨飛，眼中,是十年隱疾之後,難得的從容，「這隱疾困了我十年,也不差,再等些時日。有你這一線『化煞』的希望,我,已知足。」\n\n墨飛鄭重點頭。凌霜說得在理,以他二人此刻的修為,貿然闖入那等禁地,無異於送死。\n\n「那便,先各自精進。」墨飛道，「待時機成熟,我再陪師姐,走這一趟。」\n\n「好。」凌霜清淺一笑。\n\n只是,二人都未曾料到,那「時機」,竟會,以一種,他們都不願見到的方式,提前,降臨。\n\n——\n\n三日後,內門,風雲驟變。\n\n一則消息,如驚雷般,傳遍了問劍宗——\n\n煉器世家「洛家」的一位嫡系長老,親臨問劍宗!\n\n那洛家,乃是這一方天地,首屈一指的煉器世家,底蘊深厚,勢力龐大,便是問劍宗,也要與之交好,不願輕易得罪。而此番,那洛家長老親至,名義上,是為「探望」被廢修為、貶為雜役的洛雲軒;實則——\n\n「墨飛,你惹上大麻煩了。」沈清弦匆匆尋來,面帶憂色，「那洛家長老,是洛雲軒的親叔父,洛天罡,元嬰後期的大能!他此番前來,分明,是為洛雲軒,討公道的!」\n\n墨飛心中一沉。他的問道盤,在秘境之時,便已推衍出洛家「潛在敵意極高」。這一日,終究,還是來了。\n\n「元嬰後期……」墨飛眸光微凝。這個境界的大能,遠非他此刻,所能抗衡。若那洛天罡,執意要為洛雲軒出頭,尋他的麻煩,他,根本,毫無還手之力。\n\n「他若要當眾殺我,宗門,可會相護?」墨飛沉聲問。\n\n沈清弦面露難色:「宗規森嚴,洛天罡縱是大能,也不敢在宗門之內,公然殺你。可是……」\n\n「可是,他若以『長輩』之名,尋個由頭,設一場『比試』,借比試之機,對你下狠手——」她憂心忡忡，「便是名正言順,宗門也無從干涉了。」\n\n墨飛沉默了。\n\n他明白了。洛天罡此來,不會蠢到公然殺人,授人以柄。他要的,是一場「合乎規矩」的清算——以勢壓人,設一個他無法拒絕的局,再借那局,將他這個「傷了洛家顏面」的螞蟻,堂堂正正地,碾死。\n\n「以勢壓人的局……」墨飛闔上眼,那「推衍」之能,悄然運轉,將洛天罡可能設下的種種手段,一一,推演。\n\n良久,他睜開眼,眸中,寒光一閃,卻無半分懼意。\n\n「洛家,煉器世家。」他低聲自語，「洛天罡,元嬰後期。」\n\n「這一局,他占盡了勢,占盡了力。」\n\n「可他,不知道我墨飛,是問道傳人。」他握了握拳,眸中,星河流轉，\n\n「以勢壓人的局,我接了。」\n\n「就讓我,用這問道之算——」\n\n「破一破,你這,煉器世家的,通天之勢。」\n\n——\n\n當日午後，內門廣場。\n\n洛天罡，果然，來了。\n\n他是一位身形高大、面容冷峻的中年修士，一襲繡著玄鐵紋路的長袍，周身縈繞著元嬰後期特有的、深不可測的威壓。他身側，跟著那個被廢了修為、如今形容枯槁的洛雲軒——洛雲軒望向墨飛的眼神，怨毒中，此刻，多了一絲有恃無恐的猙獰。\n\n問劍宗的幾位長老,亦被驚動,趕來相陪,神色間,對這洛家大能,頗多客氣與忌憚。凌霜也立於一側,清冷的臉上,罕見地,凝著一層寒霜。\n\n「哪一位,是墨飛?」洛天罡開口,聲音低沉,不怒自威。\n\n「晚輩墨飛。」墨飛越眾而出,不卑不亢地拱手。\n\n洛天罡那雙鷹隼般的眼睛，落在墨飛身上，上下打量，眼中，掠過一絲毫不掩飾的輕蔑:「就是你，傷了我洛家的顏面，廢了我洛家的嫡子?」\n\n「洛師兄兩次三番,於秘境中對晚輩痛下殺手,又擅闖遺跡、圖謀傳承。」墨飛坦然道，「此事,宗門長老明察秋毫,自有公斷。晚輩,不過自保而已。」\n\n「自保?」洛天罡冷笑一聲，那笑聲裡,是元嬰大能睥睨蟻螻的傲慢，「一個小小的築基雜役,傷我洛家嫡子,還敢言『自保』?」\n\n他不再看墨飛，轉而對那幾位問劍宗長老,拱了拱手，語氣看似溫和,實則綿裡藏針:「幾位道友,我洛家與貴宗,素來交好。今日,老夫並非,要為難貴宗。只是,我那侄兒,受了委屈,老夫這個做叔父的,總得,替他,討個說法。」\n\n「老夫聽聞,這位墨飛小友,天資卓絕,於秘境中,越級斬妖,力挫強敵。」他話鋒一轉，那鷹隼般的目光,再度,鎖住墨飛，「既如此,老夫,便想與這位小友,切磋切磋。」\n\n「就當,是了結我洛家與他之間的,這段恩怨。」\n\n「點到為止,如何?」\n\n此言一出,四周,一片死寂。\n\n那幾位問劍宗長老,面面相覷,神色為難。洛天罡這番話,說得滴水不漏——他一個元嬰後期的大能,要與一個築基弟子「切磋」,美其名曰「了結恩怨、點到為止」,可這其中的凶險,誰人不知?\n\n境界懸殊如天塹。這「切磋」之中,洛天罡只需「一個不慎」,便可將墨飛,重創,乃至,擊殺於當場。事後,一句「切磋失手」,便可推得,一乾二淨。\n\n這,便是「以勢壓人」的局。名正言順,無懈可擊。\n\n凌霜再也按捺不住,清冷的聲音,如寒冰炸響:「洛前輩!以元嬰之境,欺凌一介築基後輩,傳揚出去,只怕,有損洛家,煉器世家的,清譽!」\n\n洛天罡卻只是淡淡一笑:「凌霜小友,老夫只是『切磋』,並未,要取他性命。莫非——」他目光一冷,「這位墨飛小友,做下了傷我洛家嫡子的事,卻,連一場切磋的膽量,都沒有?」\n\n這頂帽子扣下來,墨飛若是拒絕,便是「心虛」「膽怯」,便坐實了「以下犯上、卻不敢承擔」的名聲。\n\n進退維谷。\n\n眾人的目光,皆聚於墨飛一身,有擔憂,有看戲,有幸災樂禍。洛雲軒更是,已然,露出了得意的獰笑。\n\n墨飛卻在這死局之中,緩緩地,笑了。\n\n他抬起頭,迎上洛天罡那睥睨蟻螻的目光,一字一句,清晰而平靜:\n\n「洛前輩要切磋,晚輩,接了。」\n\n此言一出,四周,一片譁然。連凌霜,都秀眉緊蹙,眼中滿是憂色。\n\n唯有墨飛自己知道,他這雙眼睛背後,那方由「殘」轉「全」的問道盤,那「推衍」之能,早已將洛天罡此局的每一分「勢」,每一分「力」,都算得清清楚楚。\n\n「不過,」墨飛話鋒一轉,眸中,寒光一閃，「切磋,總得,有個彩頭。」\n\n「晚輩,想與洛前輩,立一個,賭約。」"}, {"t": "第二十八章 賭約", "c": "「賭約?」洛天罡眉頭一挑，眼中閃過一絲玩味，「你一個築基雜役，也配與老夫,立賭約?」\n\n「洛前輩既說是『切磋』、是『了結恩怨』,」墨飛不卑不亢,「那總不能,白白切磋一場。晚輩斗膽,提個賭約——」\n\n「若晚輩,在洛前輩手下,撐過三十招,不敗、不倒。」他一字一句，聲音清越，傳遍全場，「那今日這段恩怨,便一筆勾銷。洛家,自此,不得再尋晚輩的麻煩。」\n\n「反之,若晚輩撐不過三十招——」他頓了頓,坦然道，「任憑洛前輩,處置。」\n\n四周一片嘩然。\n\n撐過元嬰後期大能三十招而不敗?這少年,是瘋了不成?境界懸殊如天塹,洛天罡隨手一擊,便足以要他的命,他竟妄想,撐三十招?\n\n洛天罡也是一愣,隨即,放聲大笑:「好!好一個不知天高地厚的小子!」\n\n他求之不得。這賭約,於他而言,穩賺不賠——一個築基雜役,撐過他三十招?簡直是天方夜譚。他只需,在這三十招內,將墨飛「不慎」重創,便可名正言順,將其拿捏於股掌。\n\n「老夫,便應了你這賭約!」洛天罡傲然道，「三十招。老夫倒要看看,你這築基螞蟻,能在老夫手下,蹦躂幾息!」\n\n那幾位問劍宗長老,見二人立了賭約,雖仍憂心,卻也不便再阻攔。凌霜秀眉緊蹙,望向墨飛,眼中滿是擔憂,墨飛卻回她一個,沉靜而篤定的眼神。\n\n——\n\n比試,於內門廣場,一座巨大的防護法陣中,展開。\n\n洛天罡負手而立,渾不將墨飛放在眼裡。他甚至,並未立刻催動全力,只淡淡道:「小子,老夫讓你先出手。」\n\n這是何等的傲慢與輕視。\n\n墨飛卻不惱。他的問道盤,那「推衍」之能,早已將洛天罡此刻的狀態、氣息的流轉、乃至他那看似隨意的站姿之下,真元運行的規律,盡數,拆解、推演。\n\n【推衍:洛天罡·元嬰後期。其真元雄渾,遠非墨飛可撼。然——其恃境界之高,輕敵傲慢,真元運轉,鬆懈而無防。】\n【破局之要:不求傷敵,只求「不敗不倒」。以問道之算,尋其攻勢間隙;以配置之全,化其雷霆之威;以《木靈訣》《太一光明經》之續航,撐過三十招。】\n【勝算推演:七成。】\n\n七成。\n\n墨飛心中,有了底。\n\n他要的,從來不是「戰勝」這位元嬰大能——那是癡心妄想。他要的,是「撐過三十招」。而這,正是他那套算無遺策、攻防補控俱全的配置,最擅長的,以弱抗強、以巧化力!\n\n「洛前輩,承讓。」墨飛拱手,身形卻並未搶攻,反而,穩穩地,擺出了一個以守為攻的架勢，《厚土樁》《太一光明經》的護體之力,催發到極致。\n\n洛天罡見他不攻反守,眼中譏誚更濃:「縮頭烏龜?也罷,老夫,便來會會你這烏龜殼!」\n\n他終於出手了。\n\n一掌，看似隨意，卻蘊著元嬰後期那雄渾如淵的真元。那一掌,尚未及體,墨飛便覺得,一股足以碾碎山嶽的威壓,轟然壓下!\n\n第一招。\n\n墨飛不硬接。問道盤早已算出這一掌的軌跡與力道,他身形一卸,以最巧妙的角度,將那雷霆之力,卸開三分;《厚土樁》的反彈與減傷,又化去三分;餘下的力道,他以血肉之軀,配合《太一光明經》的護體,硬生生扛下!\n\n轟!墨飛被震得倒退十步,氣血翻湧,卻穩穩,站住了。\n\n【氣血 大損,然未倒。第一招,撐過。】\n\n洛天罡微微一怔。他這一掌,雖未盡全力,卻也足以重創尋常築基。這小子,竟卸開、扛下了?\n\n「有點意思。」他眼中,終於,多了一絲鄭重，「再接老夫一掌!」\n\n第二招,第三招,第四招……\n\n洛天罡的攻勢，一招快過一招，一招重過一招。而墨飛，如同一葉扁舟，在那滔天的巨浪之中，搖搖欲墜，卻始終，不曾傾覆。\n\n他將那套配置的精妙,發揮到了極致——卸、避、化、扛,以《寒瀑劍》遲滯,以《木靈訣》回血,以《太一光明經》全屬性護體。他從不與洛天罡硬拚真元,只以問道之算,尋那每一招的間隙,以最小的代價,撐過每一擊。\n\n十招過去,墨飛雖已渾身浴血、氣血將竭,卻,依舊,屹立不倒!\n\n全場，鴉雀無聲。\n\n那幾位問劍宗長老，望著陣中那個以築基之軀、硬撐元嬰大能十招而不倒的少年,眼中，滿是難以置信的震撼。凌霜緊握的雙拳,微微顫抖,那清冷的眸中,是掩不住的,揪心與驚異。\n\n而洛天罡的臉色,則越來越難看。\n\n一個築基雜役,竟撐過了他十招!他堂堂元嬰後期,若真讓這小子撐過了三十招,那他洛家的顏面,他這元嬰大能的顏面,將蕩然無存!\n\n「找死!」洛天罡眼中,厲色暴漲。他不再留手,周身元嬰真元盡數爆發,一身氣勢,暴漲數倍!\n\n他要以,泰山壓頂之勢,在剩下的招數裡,將這小子,徹底,碾碎!\n\n墨飛望著那暴怒的元嬰大能，望著那足以毀天滅地的真元威壓，非但沒有退縮，眼底，反而燃起了熊熊的戰意。\n\n「二十招了。」他抹了把嘴角的血,喘息著,唇角,卻揚起一絲鋒芒，「洛前輩,還剩十招。」\n\n「你這通天的『勢』——」他握緊斷刀，那雙星河流轉的眸子,直直迎上洛天罡的殺意，\n\n「可算得過,我這問道之『算』?」\n\n——\n\n最後的十招，成了墨飛此生，最兇險、也最輝煌的十招。\n\n洛天罡盡起元嬰真元，每一擊，都是雷霆萬鈞、山崩地裂。那防護法陣，被轟得劇烈震顫，靈光暴閃。而墨飛，在那足以毀滅一切的攻勢之下，一次又一次，被震飛、吐血、跌倒，卻又一次又一次，倔強地，撐著斷刀，重新，站起。\n\n他的問道盤，已被逼到了極限。每一招的破解，都精準到了毫釐之間;每一分氣血、每一縷真元的調度，都算計到了極致。他以那均衡道基的圓融、那六部功法的相濟、那問道傳承的玄妙，將「以弱抗強」四字，演繹到了，登峰造極。\n\n二十五招。二十七招。二十九招。\n\n當洛天罡那第三十招，那蘊著滔天怒火、勢要將墨飛徹底轟殺的一掌，轟然落下時——\n\n墨飛，做出了最後一算。\n\n他沒有硬接，也沒有閃避。他將全身僅剩的一絲真元、將《厚土樁》的反彈、將《太一光明經》的護體、將一枚早已備好的「淬鋒丹」，盡數，凝於那面對雷霆的一「卸」之中。\n\n轟隆！\n\n驚天動地的一擊之後，煙塵瀰漫。\n\n當那煙塵，緩緩散去——\n\n墨飛，渾身浴血，衣衫襤褸，單膝跪地，一柄斷刀，深深，插在地上，撐著他那搖搖欲墜的身軀。\n\n可他，沒有倒。\n\n那雙星河流轉的眸子，穿透瀰漫的煙塵，直直，望向面色鐵青的洛天罡，一字一句，聲音雖弱，卻清晰地，傳遍了鴉雀無聲的全場：\n\n「三十招。」\n\n「洛前輩，晚輩，撐過了。」\n\n全場，死寂。\n\n隨即，爆發出，山呼海嘯般的、無法抑制的驚呼與喝彩！\n\n一個築基巔峰的少年，硬撐一位元嬰後期大能三十招，不敗、不倒！這等驚世駭俗的一幕，縱觀問劍宗萬載歷史，也是聞所未聞！\n\n洛天罡立於陣中，望著那個跪而不倒的少年，臉色，青一陣，白一陣，最終，化作一片，難以置信的鐵青。\n\n他輸了。\n\n他一個元嬰後期的大能，設下這以勢壓人的死局，卻，敗在了一個築基雜役的「三十招之約」上。這一敗，讓他洛家的顏面，讓他這元嬰大能的顏面，掃地無存。\n\n「好……好一個墨飛。」洛天罡從牙縫裡，擠出這幾個字，那雙鷹隼般的眼睛裡，翻湧著怨毒、震驚，與一絲，被徹底顛覆的荒謬感，「賭約，老夫，認了。」\n\n他一甩衣袖，那綿裡藏針的傲慢，此刻，已化作了掩不住的陰沉:「今日之事，就此了結。」\n\n話雖如此，可他臨去前，那落在墨飛身上的、淬滿了刻骨怨毒的一瞥，卻分明在說——這一段樑子，非但沒有了結，反而，因這場當眾的慘敗，結得，更深了。\n\n墨飛望著洛天罡與那如喪家之犬般的洛雲軒，狼狽離去的背影，緩緩，闔上了眼。\n\n他知道，自己以「三十招之約」，暫時，逼退了洛家這通天之勢。可他也清楚，煉器世家洛家，那真正的滔天怒火，只怕，才剛剛，被他這一場當眾的羞辱，徹底，點燃。\n\n「洛家……」他撐著斷刀，緩緩站起，任由凌霜與沈清弦焦急地上前攙扶，心底，一片清明，「這一次，我贏了『勢』。」\n\n「可要真正,讓洛家,再不敢動我——」他望向那更高、更遠的天際，眸中，戰意熊熊，\n\n「我還得,贏了『力』。」\n\n「金丹。」他一字一頓，那是他此刻，最迫切的目標，也是他，攀向更高之境的，下一級台階，\n\n「是時候了。」"}, {"t": "第二十九章 問道金丹", "c": "與洛天罡一戰，墨飛雖勝，卻也重創。他在藥堂靜養了半月，方才將傷勢，徹底調理妥當。\n\n而這半月，墨飛也想明白了一件事——他必須，儘快，結成金丹。\n\n洛家之患，如芒在背。他今日以「三十招之約」，靠著問道之算，堪堪逼退洛天罡;可若那洛家，執意要以真正的實力碾壓他，他這築基之境，終究，還是太弱。唯有結成金丹，實力脫胎換骨，他才有真正立足、乃至反擊的資本。\n\n何況，為凌霜「化煞為劍」、深入幽冥墟尋藥，也需要，更強的實力，作為後盾。\n\n「結丹。」墨飛心意已決。\n\n他閉了關。\n\n結丹，是修士的第二道天塹。它不同於築基之「築基」，而是要將一身磅礴的真元，於丹田之中，凝練、壓縮，最終，孕育出一枚，蘊含無上道韻的「金丹」。金丹的品階，將直接決定，修士未來的成就上限。\n\n尋常修士結丹，多是水到渠成，以自身修為，自然凝聚。而金丹之品階，多為「一品」至「九品」，九品最高，卻也，可遇不可求。\n\n可墨飛的結丹，卻與眾不同。\n\n他有問道盤，有《問道錄》，有那雙看得見「道」的眼睛。他的結丹，不是「自然凝聚」，而是——「以算凝丹」。\n\n【問道凝丹·推衍中……】\n【宿主道基:均衡·圓融。六維俱穩,無有短板。】\n【建議:以「問道」之理為核,以六維均衡之力為體,凝聚「道韻金丹」。此丹,無有偏頗,契合宿主「以算證道」之路,品階……不可估量。】\n\n墨飛依著問道盤的推衍，將一身磅礴的真元，緩緩，導入丹田。他以《問道錄》的至理為引，將那六維均衡的力量，一絲一縷，均勻地，凝練、壓縮。\n\n這是一個，極其精細、極其漫長的過程。稍有偏差，那即將成形的金丹，便會出現裂痕、雜質，品階大跌，乃至，結丹失敗，一身修為，付諸東流。\n\n可墨飛，有問道盤。\n\n那真元凝聚的每一分火候、那道韻融合的每一分程度，都清清楚楚地，化作數字，攤在他眼前。他如同一位最精湛的匠人，將那枚金丹的每一分，都雕琢到了，極致的完美。\n\n一日，兩日，三日……\n\n丹田之中，那枚金丹的雛形，在墨飛「以算凝丹」的精雕細琢下，緩緩，成形。它圓潤無瑕，通體流轉著溫潤的、六色交融卻又渾然一體的道韻，散發著一股，睥睨萬物的、玄之又玄的氣息。\n\n——\n\n結丹的最後一步，是「引動天地，淬鍊丹成」。\n\n當那金丹雛形即將成形的剎那，墨飛周身的天地靈氣，驟然，瘋狂地，向他湧來!那是天地，對一枚即將誕生的、非凡金丹的，共鳴與淬鍊!\n\n聽濤居上空，靈氣翻湧，異象橫生。一道道五彩的靈光，自九天垂落，將墨飛的小院，籠罩其中。這等結丹異象之盛，驚動了整個內門!\n\n「這是……結丹異象?誰在結丹?」\n\n「是聽濤居!是墨飛!他……他要結丹了!」\n\n無數內門弟子，乃至幾位長老，皆被這驚人的異象，吸引而來，望著那籠罩聽濤居的漫天靈光，駭然失色。\n\n凌霜更是第一時間趕到，望著那異象，那清冷的眸中，滿是驚異與期盼。\n\n而在那漫天靈光之中，墨飛盤坐於院心，將那湧來的磅礴天地靈氣，盡數，引入丹田，淬鍊著那枚即將成形的道韻金丹。\n\n轟！\n\n隨著一聲彷彿響徹天地的清鳴，墨飛丹田之中，那枚圓潤無瑕、六色交融的金丹，終於，徹底，凝聚成形!\n\n【墨飛│金丹一層】\n【道韻金丹·九品圓滿(特殊：問道)！】\n【氣血、法力、真元……全面暴漲,壽元大增】\n【戰力 680 → 2100】\n【〔此金丹以問道之理為核、六維均衡為體,無有偏頗,乃萬中無一之「問道道韻金丹」。契合宿主證道之路,潛力……無可限量〕】\n\n金丹一層!戰力，一舉，突破兩千一百!\n\n九品圓滿的道韻金丹！\n\n墨飛緩緩睜開眼，只覺得天地為之一新。那結成的金丹，於他丹田之中，圓融流轉，蘊含著磅礴到近乎無窮的力量;而他那雙眼睛，那問道盤的權能，在金丹之力的加持下，更是，清明、深邃了數倍。\n\n他，終於，自那個被判「無緣」的廢根，那個蜷縮於雜役堂的少年，一步一步，結成了，這方天地間，萬中無一的，問道金丹!\n\n漫天靈光，緩緩散去。\n\n墨飛立於院中，望著那些被異象引來的、面帶震撼的內門弟子與長老，望著那些，如今，再無一人敢輕視的目光，唇角，揚起一抹沉靜的弧度。\n\n「九品圓滿……」一位聞訊趕來的元嬰長老，望著感知中墨飛那澎湃的金丹之力，喃喃自語，眼中，是掩不住的狂喜與愛才，「我問劍宗，出了一位，九品金丹的天驕!」\n\n九品圓滿的金丹，意味著什麼?意味著，墨飛未來的成就，將不可限量;意味著，他這個曾被視為「僥倖」的雜役，如今，已是問劍宗，最頂尖的天驕之一!\n\n而凌霜，望著那金丹初成、氣度愈發深不可測的墨飛，那清冷的臉上，綻開了一抹，由衷的、燦爛的笑意。\n\n「墨飛，」她走上前，眸中星光璀璨，「你，成功了。」\n\n「嗯。」墨飛點頭，望向她，那雙星河流轉的眸子裡，是化不開的篤定與溫和，「金丹已成。」\n\n「接下來——」他望向那千里之外的幽冥墟方向，一字一句，\n\n「便該，兌現我的承諾了。」\n\n「師姐，你那困了十年的隱疾，你那『化煞為劍』的生機——」\n\n「是時候，去尋，那兩味靈材了。」\n\n凌霜怔了怔，隨即，那眸中，盈滿了滾燙的、無以言表的動容。\n\n金丹初成，實力大進。而墨飛，第一個念頭，竟不是急著鞏固修為、揚名立萬，而是——踐諾，為她，尋那化煞的生機。\n\n「好。」她輕聲道，聲音，微微發顫，「幽冥墟……我陪你去。」\n\n而墨飛還不知道，這一趟幽冥墟之行，他不但將為凌霜，尋得化煞之藥，更將，在那死氣瀰漫的上古禁地深處，觸及，那關於問道一脈、關於這方天地，最為驚天的一角，秘辛。\n\n——\n\n金丹初成，墨飛在內門的地位，已然，今非昔比。\n\n九品圓滿的道韻金丹，這是連宗門那幾位元嬰長老，都為之側目的資質。往日那些暗中的忌憚與敵意，此刻，大多化作了敬畏與拉攏。甚至，宗門特意，將他自那清幽的聽濤居，遷入了內門核心、專供頂尖天驕修行的「問劍崖」。\n\n而深入幽冥墟為凌霜尋藥一事，墨飛也並未莽撞。\n\n幽冥墟，是宗門劃定的禁地，死氣瀰漫，妖魔橫行，尋常弟子，嚴禁入內。墨飛與凌霜，若要前往，需得，宗門特許。\n\n好在，墨飛如今，已是宗門重點栽培的天驕;而凌霜，更是掌門親傳。二人聯名，以「歷練、採集稀有靈材」為由，向宗門申請，很快，便獲得了那位掌管內門事務的元嬰長老的首肯——那長老甚至，特意叮囑，賜下了兩枚,可在危急時傳訊求援的「護道玉符」。\n\n臨行前，墨飛去了一趟外門，探望石敢。\n\n那憨厚的漢子，得了墨飛所贈的《磐石訣》，這半年來，苦修不輟，如今，已築基一層，在外門，也算,站穩了腳跟。見到墨飛，石敢又是激動又是敬佩:「墨兄弟!俺聽說了!你結金丹了!還是最頂級的九品!俺就知道，俺這兄弟，是要,幹大事的人!」\n\n墨飛失笑，與這實誠的兄弟，敘了半日舊，又留下一批修行資源與丹藥,方才,依依作別。\n\n「石大哥，你且安心修煉。」臨別時，墨飛鄭重道，「待我這趟歷練歸來，再助你，更上一層。你我兄弟，一同,往那高處走。」\n\n石敢重重點頭，那雙眼睛，又紅了。\n\n——\n\n三日後，問劍宗後山，一處幽深的傳送陣前。\n\n墨飛與凌霜，一身勁裝，並肩而立。那傳送陣，直通,千里之外的幽冥墟外圍。\n\n「墨飛，」凌霜望著那散發著幽幽死氣的傳送陣，清冷的臉上，罕見地，凝著一絲鄭重，「幽冥墟凶險，我雖去過外圍，卻也未曾,深入。此行，你我，需得,萬分小心。」\n\n「師姐放心。」墨飛握了握拳，那雙星河流轉的眸子裡，是化不開的篤定，「有問道盤『推衍』之能，這幽冥墟的凶險，逃不過我的眼。」\n\n他望向凌霜，一字一句，鄭重許諾:「這一趟，我定會,為師姐,尋得那兩味靈材，助你,徹底,化解那困了十年的隱疾。」\n\n凌霜靜靜地望著他，那雙秋水般的眸子裡，盈滿了，將性命相托的信任與,某種,愈發清晰的情愫。\n\n「我信你。」她輕聲道。\n\n墨飛點頭，不再多言。他握緊凌霜的手——那一瞬，凌霜身子微不可察地一顫，卻並未抽回——二人的身影，一同，踏入了那散發著死氣的傳送陣。\n\n白光一閃。\n\n當那白光散去，撲面而來的，是一股濃郁到令人窒息的、混雜著腐朽與死亡的氣息。\n\n眼前，是一片,灰暗、死寂、瀰漫著滾滾黑色死氣的,恐怖之地。天空,是永恆的鉛灰色;大地,寸草不生,唯有森森的白骨與嶙峋的怪石;遠處,隱隱傳來,非人非獸的、令人毛骨悚然的嘶嚎。\n\n幽冥墟，到了。\n\n墨飛握緊了斷刀，那「推衍」之能，悄然運轉，將這死氣瀰漫的禁地，一寸一寸，映入識海。\n\n「師姐，」他沉聲道，眸光一凝，「跟緊我。」\n\n「這幽冥墟的死氣之下，藏著的凶險——」\n\n「比萬妖森林，還要,深上,十倍。」"}, {"t": "第三十章 幽冥墟", "c": "幽冥墟，名副其實，是一片被死亡籠罩的絕地。\n\n墨飛與凌霜，沿著問道盤推衍出的、死氣相對稀薄的路徑，緩緩深入。這裡沒有生機，沒有靈氣，只有無邊無際的、滾滾翻湧的黑色死氣。那死氣沾身，便會侵蝕真元、腐蝕神魂;若非墨飛以《太一光明經》的純陽之力，時時護持二人周身，只怕，行不了多遠，便要被那死氣，侵入根本。\n\n「這裡的死氣，古怪得很。」墨飛一邊護持，一邊沉吟，「尋常禁地，死氣雖濃，卻無『序』。可這幽冥墟的死氣，隱隱之中，竟似有一種……人為布置的『陣勢』之感。」\n\n凌霜聞言，秀眉微蹙:「你是說，這幽冥墟，並非天然形成，而是……有人，刻意，煉成的死地?」\n\n「不好說。」墨飛搖頭。他那新解封的「觀道」之能，在這死氣之中，隱隱捕捉到了一絲，與問道遺跡同源的、極其微弱的道韻殘留。這讓他心底，那本記著疑點的帳，又重了幾分。\n\n這幽冥墟的深處，恐怕，也藏著，與問道一脈相關的秘辛。\n\n——\n\n行約半日，前方，出現了一片,由累累白骨堆成的、廣袤的「骨原」。\n\n那凝魂草，據問道盤推衍，便生於這骨原深處，一處死氣與一絲微弱生機交纏的「陰陽眼」之中。\n\n可這骨原，絕非坦途。\n\n墨飛的問道盤，驟然亮起警示:\n\n【警示:骨原之下,潛藏「屍傀」。】\n【屍傀·群│金丹一至二層│受死氣滋養,不知疲倦、不知痛楚,群起攻之。數量:極多。】\n\n話音未落，那滿地的白骨，竟,詭異地,動了起來!一具具由死氣凝聚、白骨拼湊而成的、青面獠牙的屍傀，自骨原之下，紛紛,爬起，猩紅的眼中，燃著幽幽鬼火，朝著墨飛與凌霜，蜂擁而來!\n\n金丹一二層的屍傀，數以百計!\n\n「來得好!」墨飛卻不懼反喜。他金丹初成，一身磅礴的真元，正需一場酣暢淋漓的搏殺，來錘鍊、來掌控!\n\n他一馬當先，將那六部功法的配置，盡數催發。《裂石訣》金系氣刃，如今蘊上金丹之力與問道至理，鋒銳無匹,一斬,便是數具屍傀齊齊碎裂;《太一光明經》的純陽光罩，更是那些死氣屍傀的剋星，所過之處，屍傀成片消融!\n\n而凌霜，更是驚才絕艷。她一聲清叱，數十柄飛劍破空而出，劍光如織，縱橫捭闔。那一柄柄飛劍,在她手中,彷彿有了生命,幻化出漫天的、璀璨奪目的劍陣，將撲來的屍傀,絞殺得,片甲不留!\n\n一人問道之算，一人劍道之絕。\n\n二人並肩而戰，配合得，天衣無縫。墨飛以問道盤推衍屍傀的攻勢與弱點，將破法，實時傳於凌霜;凌霜則以那通神的劍道，將破法，化為一道道致命的劍光。\n\n那看似無窮無盡的屍傀大軍，在二人這珠聯璧合的搏殺之下，竟被，殺得節節敗退，紛紛,重歸,那累累的白骨。\n\n饒是如此，這一場鏖戰，也足足持續了一個時辰。當最後一具屍傀，碎裂於凌霜的劍下時，二人，也已是,真元耗損，微微,喘息。\n\n「這幽冥墟，」凌霜收起飛劍，望著那重歸死寂的骨原，清麗的臉上，難得地，帶上了一絲鄭重，「果然，名不虛傳。」\n\n「這，還只是外圍。」墨飛沉聲道，「越往深處，只怕越是凶險。」\n\n他望向骨原深處，那「觀道」之能，已捕捉到了那一絲，與死氣交纏的、微弱的生機——凝魂草，就在前方。\n\n——\n\n穿過骨原，二人來到了那處「陰陽眼」。\n\n那是一方,不足丈許的、奇異的所在。四周死氣滾滾，唯獨這方寸之地，卻有一絲微弱的、翠綠的生機，倔強地，流轉著。而在那生機的中心，一株通體瑩白、散發著淡淡魂光的靈草，靜靜地，生長著。\n\n凝魂草。\n\n墨飛凝神望去，問道盤印證:【凝魂草·五百年│安神定魂之極品靈材，正是化解凌霜劍煞所需。】\n\n「找到了!」凌霜眸中，閃過一絲,壓抑不住的,激動與希望。\n\n墨飛卻並未立刻上前。他的「推衍」之能，已察覺到,這凝魂草看似唾手可得，實則，那「陰陽眼」的生機與四周的死氣，維持著一種，極其微妙的平衡。強行採摘，一旦破壞了這平衡，只怕,便會引動,那潛藏於死氣深處的,更大的凶險。\n\n「師姐，稍待。」墨飛沉聲道，「這凝魂草的採摘，需得，以問道之法，先穩住這『陰陽眼』的平衡。」\n\n他盤膝坐下，凝神,運轉問道盤的「觀道」之能，將那「陰陽眼」中，死氣與生機交纏的道則,一絲一縷,看清、算透。而後,他以《太一光明經》的純陽之力為引,小心翼翼地,將那即將傾覆的平衡,一分一分,穩住。\n\n半個時辰後，墨飛終於，尋得了那唯一的、可安然採摘的時機。他伸出手,以一種近乎虔誠的手法,將那株凝魂草,連根,穩穩地,採了下來。\n\n「陰陽眼」的平衡，穩穩,維持。四周的死氣,並未,因這採摘,而暴動。\n\n「成了。」墨飛長舒一口氣，將那株珍貴的凝魂草，小心收好，「第一味靈材，到手。」\n\n凌霜望著他那小心翼翼、算無遺策的模樣,眼中,那份動容,又深了一分。\n\n換作旁人，得見這化解隱疾的靈材，只怕,早已迫不及待地,強行採摘,乃至,因此引動凶險,喪身於此。唯有墨飛,能以那份極致的沉穩與算計,將這採摘的每一步,都算到,萬無一失。\n\n「墨飛，」她輕聲道，「有你在,我這困了十年的心結,第一次，覺得,真的,有解開的一日。」\n\n墨飛回她一笑，那笑容裡，是化不開的篤定:「會的。」\n\n「一味已得。」他望向幽冥墟那,死氣更濃、凶險更甚的深處，眸光一凝，\n\n「還有一味,息壤玉髓。」\n\n「它,就在,這幽冥墟,最深處的,地脈之中。」\n\n「而那裡——」他握緊了斷刀,那「推衍」之能,隱隱捕捉到了一絲,令他心悸的,恐怖氣息，\n\n「藏著,這幽冥墟,真正的,主人。」\n\n——\n\n夜幕降臨——雖然這幽冥墟，永無晝夜之分，只有那永恆的鉛灰。二人尋了一處死氣稍薄的巖洞，暫且歇息，恢復消耗的真元。\n\n墨飛以《太一光明經》，在洞口布下一圈純陽光罩，隔絕外間的死氣。凌霜則取出隨身的靈食與清水，二人就著微光，簡單用了些。\n\n「墨飛，」凌霜忽然開口，望著洞外那滾滾的死氣，清冷的聲音裡，帶著一絲少見的、悠遠的情緒，「你可曾想過，這幽冥墟，這萬妖森林的遺跡，這你識海中的問道盤……它們背後，到底，藏著一個，怎樣的過往?」\n\n墨飛沉默片刻，緩緩道:「想過。」\n\n「我這問道盤，是問道一脈的傳承之器。」他望著那本記著疑點的帳，一一道來，「萬妖森林的遺跡，是問道一脈的道統所在。而這幽冥墟的死氣之下，我亦感應到了，與之同源的道韻。」\n\n「這幾處，皆與問道一脈，有關。」他眸光一凝，「而問道一脈，一個曾以『觀天地、算大道』而驚才絕艷的道統，為何，會湮沒於萬古，唯餘殘念苦守?」\n\n「一個道統的覆滅，」墨飛一字一句，聲音沉了下來，「絕非,無因。」\n\n凌霜心頭一震，望向他。\n\n「我有一種預感。」墨飛望向幽冥墟的深處，眸中，掠過一絲凝重，「問道一脈的覆滅，這幽冥墟的死氣，或許……都指向,同一個,湮沒於歷史深處的,敵人。」\n\n「而那個敵人——」他握了握拳，「說不定，至今，仍未,真正,消亡。」\n\n洞中，一時,靜默。\n\n凌霜望著墨飛那凝重的側臉，心底，忽然湧起一股，難以言喻的情緒。這個少年，承接了一個湮沒道統的傳承，卻並未,沉溺於那潑天的機緣;他的目光，早已,越過了眼前的敵人與機緣，投向了,那個關於「道統覆滅」的、更深、更遠的謎團。\n\n「墨飛，」她輕聲道，那清冷的眸中，是前所未有的鄭重與……並肩的決意，「無論那背後，藏著怎樣的過往，怎樣的敵人——」\n\n「這條路，我，與你，一同走。」\n\n墨飛回頭，望著凌霜那雙盛滿星光與決意的眸子，心底，某處，重重一暖。\n\n「好。」他鄭重應下。\n\n那一夜，在這死氣瀰漫的幽冥墟深處，一方小小的純陽光罩之中，兩個追尋著「另一種道」的年輕人，將彼此的命運與道途，貼得，更近了一分。\n\n而幽冥墟的深處，那潛藏於地脈之中的、恐怖的氣息，卻在這一夜，隱隱，甦醒了幾分——彷彿，也察覺到了,兩個不速之客的到來。\n\n一場，真正的凶險,正在,那死氣的最深處,悄然,張開。"}, {"t": "第三十一章 屍魔", "c": "翌日，二人繼續深入。\n\n越往幽冥墟深處，那死氣，便越是濃郁、凝滯，彷彿化為了實質的黑霧，連墨飛的《太一光明經》純陽光罩，都被侵蝕得，隱隱波動。而那與問道一脈同源的道韻殘留，也越發清晰——墨飛越來越確信，這幽冥墟的深處，藏著一個，天大的秘密。\n\n問道盤的「推衍」，將前路的凶險，一一映出。二人小心翼翼，避開了數處潛藏的死氣漩渦與屍傀巢穴，終於，來到了幽冥墟的核心——一處，深不見底的、散發著恐怖死氣的,巨大地淵。\n\n那息壤玉髓，據推衍，便生於這地淵深處的,地脈之中。\n\n「就是這裡。」墨飛立於地淵之畔，望著那翻湧著黑色死氣的、深不見底的淵口，眸光凝重。\n\n然而，就在他話音落下的剎那——\n\n那深淵之中，死氣，驟然，瘋狂地翻湧起來!一股，遠比屍傀、遠比冰蟒、遠比洛天罡，都要恐怖百倍的、令人靈魂戰慄的氣息，自那地淵深處，緩緩，升騰而起!\n\n墨飛的問道盤，爆發出前所未有的、猩紅的警示:\n\n【警示:超高危目標·地淵深處!】\n【幽冥屍魔王│元嬰後期│戰力……約 4500】\n【〔幽冥墟之主。上古隕落大能之屍身,受萬古死氣滋養,化為屍魔。它,便是這整片死氣之地的「陣眼」與源頭〕】\n\n元嬰後期!戰力，四千五百!\n\n墨飛的瞳孔，驟然收縮。\n\n這是一個，遠遠超出他此刻認知的、恐怖的存在。他金丹一層，戰力不過兩千一;凌霜築基巔峰，戰力千五。二人聯手，也不過三千餘。而那屍魔王，戰力四千五——是他們聯手，都難以匹敵的,元嬰後期大能!\n\n「不好!」凌霜臉色劇變，「是元嬰屍魔!墨飛，快退!」\n\n可已經晚了。\n\n那地淵之中，一隻覆滿了黑色屍斑、大如山嶽的枯手，猛地，探出淵口!緊接著，一具身高數丈、周身縈繞著滔天死氣、雙目燃著幽綠鬼火的,恐怖屍魔，自那地淵深處，緩緩，爬了上來!\n\n它一現世，那滔天的死氣威壓，便如實質般，轟然壓下!墨飛與凌霜，只覺得,渾身真元凝滯,呼吸都變得,無比艱難。\n\n「跑不掉了。」墨飛沉聲道，強撐著那威壓，飛快地，運轉問道盤，推衍破局之法。\n\n【推衍:正面對抗,必死。】\n【然……此屍魔,乃「陣眼」所化,受死氣禁制束縛,不能離地淵太遠。】\n【破局:引其遠離地淵,趁其力弱之隙,取息壤玉髓後,速退。】\n【勝算……取材而退:三成。】\n\n三成。\n\n墨飛深吸一口氣。三成，總比,正面對抗的必死之局,要好。\n\n「師姐，」他沉聲道，眸中，星河流轉，「這屍魔，離不開地淵。我引它遠離,你趁機,下地淵,取息壤玉髓!」\n\n「不行!」凌霜斷然拒絕，「它戰力四千五，你引它,便是九死一生!要冒險,也是我來!」\n\n「師姐!」墨飛卻不容置疑，「你劍道通神，取材、脫身，你比我快。而引敵、周旋,以問道盤推衍走位、化解攻勢——這世上，沒人,比我更擅長!」\n\n「這是,眼下,唯一的破局之法。信我!」\n\n凌霜望著他那不容拒絕的、篤定的眼神，心中，天人交戰。最終，她那雙秋眸，一咬牙,盈滿了決絕:「好!你,萬萬,小心!取到玉髓,我即刻,來接你!」\n\n「去!」\n\n墨飛一聲斷喝，身形暴起，化作一道流光，非但沒有退避，反而，直直,衝向了那恐怖的屍魔王!\n\n——\n\n引動一頭戰力四千五的元嬰屍魔，是墨飛此生，最兇險的一場豪賭。\n\n他將問道盤的「推衍」之能，催發到了極致。那屍魔王的每一次攻擊、每一縷死氣的流轉、每一步移動的軌跡，都被他，實時，拆解、推演。他如同一片，在狂風巨浪中翻飛的葉子，在那足以毀天滅地的攻勢之下，以一種近乎奇跡的方式，一次次，堪堪，避過。\n\n他一邊避，一邊,以言語、以《裂石訣》的騷擾，將那屍魔王，一步一步，引離那地淵。\n\n那屍魔王，靈智已失，只餘嗜殺的本能。它被墨飛這「打不到、又不斷騷擾」的存在,激得狂怒,不管不顧地,追殺而來，離那地淵，越來越遠。\n\n而另一邊，凌霜抓住時機，御劍如電，一頭,扎進了那翻湧著死氣的地淵，直取,地脈深處的,息壤玉髓!\n\n墨飛與那屍魔王的周旋，卻,越來越兇險。\n\n那屍魔王雖離了地淵、威勢稍減，可它戰力,終究,遠在墨飛之上。墨飛避得,越來越勉強;那滔天的死氣,一次次,擦著他的身側掠過,將他的護體,一層層,削薄。\n\n【氣血 大損……推衍:再周旋一炷香,宿主,力竭。】\n\n一炷香。\n\n墨飛咬著牙，將自己那套配置、那問道之算，都逼到了極限。他在心底，一遍遍地，推衍著凌霜取材的進度，推衍著自己僅存的每一分氣血與真元。\n\n「快……師姐,快一點……」他一邊避開屍魔王那毀滅性的一擊，一邊，在心底，嘶聲吶喊。\n\n而就在他氣血將竭、避無可避的,千鈞一髮之際——\n\n地淵的方向，一道璀璨奪目的劍光，沖天而起!\n\n「墨飛——!接住!」\n\n凌霜的清叱，響徹幽冥墟。緊接著，一道流光，挾著一枚,散發著溫潤土黃光華的靈材,朝墨飛,激射而來!\n\n是息壤玉髓!她,取到了!\n\n墨飛精神一振,伸手,穩穩接住那枚玉髓。\n\n「走!」\n\n他不再與屍魔王糾纏,身形一轉,催動全身僅剩的真元,朝著凌霜的方向,亡命,奔逃!\n\n那屍魔王,見獵物欲逃,發出一聲驚天的咆哮,滔天死氣,鋪天蓋地,朝二人,追殺而至!\n\n——\n\n那屍魔王的追殺，快如鬼魅。二人雖已取材，卻被那滔天死氣，逼得,節節敗退,眼看,便要被那屍魔王,追上。\n\n「師姐，它離地淵越遠，那束縛它的死氣禁制，便越強!」墨飛一邊奔逃,一邊飛快地推衍，「再引它,遠離,百丈!」\n\n二人不敢回頭,拚盡全力,又往前狂奔了百丈。\n\n果然,那屍魔王追出這一段,那束縛它的、無形的死氣禁制,驟然,發揮了作用!它龐大的身軀,猛地一滯,彷彿被一根無形的鎖鏈,死死,拽住,再難,前進分毫!\n\n它憤怒地咆哮著,朝二人,揮出最後一擊。可那一擊,終究,追之不及,只將二人,震得,氣血翻湧,狼狽跌出。\n\n「成了!它,追不出來了!」墨飛喘息著,拉起凌霜，「快,趁它被禁制束縛,離開幽冥墟!」\n\n二人不敢有絲毫停留,循著問道盤標出的、最短的退路,亡命,奔逃。那屍魔王的咆哮,在身後,越來越遠,終於,徹底,消失。\n\n——\n\n不知逃了多久,當那濃郁的死氣,終於,漸漸稀薄,眼前,重現那幽冥墟的外圍時,墨飛與凌霜,才,雙雙,癱倒在地,大口大口地,喘著粗氣。\n\n劫後餘生。\n\n「取到了……都取到了……」凌霜望著墨飛手中那枚息壤玉髓,又摸了摸自己懷中的凝魂草,那清冷的臉上,是掩不住的,狂喜與後怕。\n\n化解她十年隱疾的兩味靈材,終於,湊齊了。\n\n「值了。」墨飛虛弱地笑了笑,望著那枚玉髓，「這一趟,九死一生,總算,沒有白來。」\n\n他頓了頓,神色卻凝重起來:「只是那屍魔王……」\n\n「那是一具,上古隕落大能的屍身。」墨飛緩緩道，將方才推衍所得,一一道來，「戰力四千五,元嬰後期。而它,竟是這整片幽冥墟死氣的『陣眼』與源頭。」\n\n「師姐,你想過沒有——」他眸光一凝，「一個元嬰後期的上古大能,是如何隕落於此?又是誰,將它的屍身,煉成陣眼,布下這方圓千里的、死氣瀰漫的絕地?」\n\n凌霜悚然一驚。\n\n「這幽冥墟,」墨飛一字一句，「絕非天然。它是一座,以上古大能屍身為引、以萬古死氣為陣的,人為煉成的,死亡禁地。」\n\n「而煉成它的那隻手——」他望向那死氣瀰漫的深處，眸中，掠過一絲寒意，「其道行之高、心思之毒,遠超想像。」\n\n「更可怕的是,」墨飛的聲音,沉了下來，「我在那屍魔王身上,乃至這整片死氣之中,都感應到了,與問道一脈,同源的道韻。」\n\n凌霜臉色微變:「你是說……煉成這幽冥墟的人,與問道一脈的覆滅——」\n\n「有關。」墨飛斬釘截鐵，「甚至,那個煉成幽冥墟的、湮沒於歷史深處的敵人,或許,便是,當年,覆滅了整個問道一脈的,元兇。」\n\n死氣瀰漫的幽冥墟外圍,一時,靜默。\n\n墨飛望著那片吞噬了無數生機的、恐怖的絕地,握緊了拳。他來時,只為替凌霜尋藥;卻不想,在這死亡之地,竟窺見了,問道一脈覆滅的,第一絲,線索。\n\n「這筆帳,」他一字一頓，眸中，星河與寒意,交織，\n\n「湮沒萬古的問道一脈的血仇——」\n\n「我墨飛,作為唯一的傳人,遲早,要,親手,算清楚。」\n\n他扶起凌霜,將那兩味用命換來的靈材,小心收好。\n\n「先回宗門。」他望向凌霜，眸色轉柔，「靈材已齊,該,兌現我的承諾了。」\n\n「師姐十年的心結,是時候,徹底,解開了。」"}, {"t": "第三十二章 化煞", "c": "回到問劍宗，墨飛沒有耽擱，即刻，為凌霜「化煞為劍」，做起了準備。\n\n他向宗門，借了一處僻靜、靈氣充沛的閉關密室，又以那遺跡祕藏中的古方為引，將凝魂草、息壤玉髓，並數味輔材，親手，煉成了一爐,散發著溫潤安神之光的「定煞丹」。\n\n以問道盤的「觀道」把控火候，這一爐丹，煉得，完美無瑕。\n\n一切就緒。\n\n密室之中，凌霜盤膝而坐，卸去了周身的防備。她那清冷絕塵的臉上，此刻，帶著一絲，將性命與劍道，盡數相托的，鄭重與信任。\n\n「墨飛，」她輕聲道，「這一次，若成，我這困了十年的隱疾，便可根除;若敗——」\n\n「不會敗。」墨飛打斷她，語氣篤定，「我已推衍過千百遍。師姐，你只需，放鬆心神，將那命宮劍煞，交予我。」\n\n「其餘的，」他望著她，那雙星河流轉的眸子裡，是化不開的自信與溫和，「信我。」\n\n凌霜靜靜地望著他，良久，那清冷的唇角，綻開一抹，柔和的笑意:「我信你。」\n\n——\n\n化煞，開始了。\n\n墨飛服下一枚凝神丹，將問道盤的「觀道」之能，催發到極致，神識，緩緩，探入凌霜那深藏的命宮。\n\n那一縷上古劍煞，果然，如問道盤所示，深植於凌霜命宮，與她的劍道本源，糾纏得，密不可分。它散發著森然的、毀滅性的煞氣，卻又，在那煞氣之中，蘊藏著一種，極致鋒銳、極致純粹的「劍之至理」。\n\n尋常修士，只會見那「煞」，欲除之而後快，卻不知，那「煞」與「劍」，早已，融為一體，強行剝離，便是,兩敗俱傷。\n\n可墨飛，有問道盤。有《問道錄》中，那「煉化道韻」的至理。\n\n他不驅、不剝，而是——「化」。\n\n他以那爐定煞丹的溫潤之力，將那狂暴的煞氣，一絲一縷，安撫、定住;再以《太一光明經》的純陽道韻為引,將那被定住的煞氣中,「煞」的部分,一點一點,煉化、剝離;而後,以問道之理,將剩下的、那純粹的「劍之至理」，重新，一絲一縷，融回凌霜的劍道本源之中。\n\n這是一個，比結金丹，還要精細萬倍的過程。\n\n那命宮劍煞，稍有不慎，便會暴走，反噬凌霜的心神與性命。墨飛的問道盤，將那煞氣的每一分流轉、每一絲暴動的先兆，都算到了，極致。他如同一位，在刀尖上跳舞的舞者，將這「化煞為劍」的每一步，都走得，如履薄冰，卻又，穩如泰山。\n\n密室之中，凌霜的臉上，時而，因劍煞的暴動，而痛苦地扭曲;時而，又因那煞氣被一絲絲化去，而漸漸，舒緩。她死死咬著牙，將心神，全然,交予墨飛，任由他，在她那最脆弱的命宮深處，施展著這場，關乎她生死與道途的,玄妙手術。\n\n一個時辰。兩個時辰。\n\n墨飛已是滿頭大汗，神識，消耗巨大。可他不敢有絲毫鬆懈——這化煞的最後關頭，最是凶險。那積蓄了十年的劍煞，在被大量化去之後，發起了，最後的、也是最猛烈的，一次反撲!\n\n【警示:劍煞暴動!命宮動搖!】\n\n「師姐,穩住!」墨飛嘶聲道，將全部的神識與問道之力，盡數，壓上!\n\n那一瞬，是驚心動魄的角力。墨飛以問道盤推衍出的、最精妙的手法，將那暴動的劍煞，死死，鎖住;凌霜則以她那通神的劍道意志，配合著墨飛，將那最後一縷「煞」，一咬牙，徹底,煉化、馴服!\n\n嗡——!\n\n一聲，彷彿劍鳴般的清越之音,自凌霜命宮深處,響起。\n\n那困了她十年的、蝕她性命的上古劍煞——徹底，消失了。\n\n取而代之的，是一縷,純粹到了極致的、與她劍道渾然一體的、鋒銳無匹的「劍之至理」!\n\n化煞，成了!\n\n凌霜猛地睜開眼，那雙秋水般的眸子裡，此刻，有精芒流轉，有劍意縱橫——她只覺得，體內那困擾了十年的隱患，蕩然無存;而她那本就通神的劍道，在化煞為劍之後，竟，更上一層,臻至了一個,前所未有的,圓融之境!\n\n「成了……真的，成了……」她怔怔地，感受著體內那,煥然一新的劍道與再無隱患的命宮，那雙向來清冷的眸子裡，第一次，盈滿了,滾燙的淚光。\n\n十年了。她背負著這催命的劍煞，以絕世之姿，行走於世,看似風光,實則,每一日,都在與死亡賽跑,每一次突破,都要以命相搏。這份,深埋於心底的孤獨與恐懼,無人能懂,無人能解。\n\n而今日，這個少年，卻,親手,替她,解開了。\n\n「墨飛……」她抬眸，望向那,神識消耗、面色蒼白，卻,笑意溫和的少年，那清冷了十年的心，在這一刻，徹底，融化。\n\n「多謝。」她輕聲道，聲音，微微發顫，那二字之中，藏著的，是十年的重負,一朝卸下的,無以言表的,感激與情動。\n\n「我說過，」墨飛虛弱地笑了笑,「你護我一路,我還你一線生機。」\n\n「如今——」他望著她那,再無隱患、劍意圓融的模樣，眼中，是由衷的欣慰，「生機,已還。你我之間,兩清了。」\n\n「兩清?」凌霜卻搖了搖頭,那雙盈滿淚光的眸子裡,漾起一縷,墨飛從未見過的、清晰而灼熱的情愫。\n\n她緩緩起身,走到墨飛面前,伸出手,極輕地,為他,拭去額角的汗珠。\n\n「這份恩情,」她輕聲道，一字一句，情真意切，「我凌霜,不想,兩清。」\n\n「我想……用一輩子,慢慢,還。」\n\n密室之中,靈氣氤氳。\n\n墨飛怔怔地,望著眼前這位卸下了所有清冷與孤高、眸中盛滿星光與情意的絕世劍修，那顆向來只為「證道」而跳動的心，在這一刻，重重地,漏了一拍。\n\n——\n\n那一刻的旖旎，終究，被墨飛心底翻湧的驚濤，沖淡了。\n\n因為就在方才，化煞的最後關頭，當他以「觀道」之能，深入那上古劍煞的最深處，將它徹底煉化的剎那——\n\n他，看見了。\n\n那一縷劍煞的最深處，並非空無一物。它，竟殘留著一絲，極其古老、極其晦澀的「烙印」。而那烙印之上，浮現出的道韻——\n\n墨飛的臉色，在那一瞬，變得慘白。\n\n那道韻，他認得。\n\n那是一種，與問道一脈同源、卻又被某種極致邪異的力量，徹底扭曲、污染了的——「反問道」之韻!\n\n「師姐，」墨飛沉聲開口，打斷了那密室中旖旎的氣氛，神色凝重得可怕，「你這一縷上古劍煞，來歷，只怕，非同小可。」\n\n凌霜一怔:「怎麼?」\n\n「你可還記得，這劍煞，是你幼年，承一部『絕世劍道功法』時，一併引入的?」墨飛一字一句，「那部劍道功法，是何來歷?」\n\n凌霜秀眉微蹙，追憶道:「那是……我師尊，於一處上古遺跡中，尋得的一部殘卷。師尊說，那劍道，驚才絕艷，卻,隱隱,透著一絲,不祥……」\n\n「果然。」墨飛眸光一凝，「師姐，我在你這劍煞的最深處，看見了一絲『反問道』的烙印。」\n\n「反問道?」凌霜駭然。\n\n「問道一脈，以『觀天地、算大道』證道。」墨飛沉聲道，「而『反問道』——是一種，將這問道之理，徹底扭曲、顛倒，化為『毀道、噬道』的，極致邪異之力。」\n\n「我有一種預感。」他望向凌霜，眼中，掠過一絲寒意，「當年，覆滅了整個問道一脈的元兇，煉成那幽冥墟死地的黑手，還有,你師尊尋得的那部『不祥』劍道殘卷——」\n\n「它們背後，或許，是同一股，湮沒於萬古、卻從未真正消亡的,『反問道』的,邪異勢力!」\n\n密室之中，一片死寂。\n\n凌霜望著墨飛，那雙剛剛盈滿情意的眸子裡，此刻，也染上了一層,凝重的寒霜。\n\n「若真如此……」她輕聲道，「那我這一縷劍煞，我師尊所得的那部殘卷……都不過是那股邪異勢力，遺落於世的,一鱗半爪。」\n\n「而它們真正的源頭——」\n\n「那個，覆滅了問道一脈的敵人。」墨飛接口，一字一頓，眸中，燃起熊熊的戰意與探尋，「至今，仍潛藏於這方天地的,某個角落。」\n\n「甚至……」他心底，掠過一絲不祥的預感，「說不定，早已，開始,悄然,布局。」\n\n化煞的喜悅，被這驚天的推測，沖淡。\n\n可墨飛與凌霜的心，卻在這一刻，貼得，更近了。他們不再只是,並肩尋藥的同道;他們,是共同背負著問道一脈血仇、共同追尋著那湮沒真相的,同路人。\n\n「墨飛，」凌霜握住他的手，那向來清冷的眸中，是前所未有的堅定，「這條路，這筆帳，我陪你，一起走，一起算。」\n\n墨飛回握住她的手，重重點頭，眸中，星河流轉:\n\n「好。」\n\n「化煞已成，你我道途，再無隱患。」他望向那,通往更廣闊天地的方向，一字一句，\n\n「接下來——便是,結金丹、破元嬰,一步步,強大起來。」\n\n「直到有一天，我墨飛，強到,能親手,將那湮沒萬古的『反問道』元兇，揪出來——」\n\n「為問道一脈的萬千先賢,討回,一個,公道。」\n\n密室之外，問劍宗的天光，依舊明媚。可墨飛知道，一場,橫跨萬古、關乎道統存亡的,驚天棋局,已然,在這方天地的深處,悄然,鋪開。\n\n而他，這問道一脈的唯一傳人，已,身在局中。"}, {"t": "第三十三章 邪影", "c": "為凌霜化煞成功之後，墨飛在問劍宗，徹底,聲名鵲起。\n\n九品圓滿的道韻金丹、硬撼元嬰大能三十招不敗、深入幽冥墟禁地取材而歸、更以匪夷所思的手段，化解了內門第一天驕凌霜,那困擾十年的隱疾——這一樁樁,一件件,皆是驚世駭俗的傳奇。\n\n一時間，墨飛之名，如日中天，成了問劍宗新一代弟子中，當之無愧的,第一天驕。便是那些元嬰長老，提及他時,也多是,讚許有加,愛才之心,溢於言表。\n\n然而，樹大招風。\n\n墨飛越是耀眼，那來自暗處的敵意，便越是,濃烈。\n\n其中，最深、最毒的一道，來自——煉器世家，洛家。\n\n那日內門廣場，洛天罡以元嬰之尊，卻敗於墨飛的「三十招之約」，當眾丟盡了顏面。這一箭之仇，洛家，豈會善罷甘休?\n\n只是，礙於問劍宗的顏面與宗規，洛家,不便,明著,對墨飛動手。於是，他們,選擇了，一條更陰狠的路。\n\n——\n\n這一日，墨飛正於問劍崖閉關，參悟《問道錄》，鞏固金丹。\n\n一縷極其隱晦、卻又,令他心悸的邪異氣息，忽然，掠過他那,敏銳到極致的問道盤感知。\n\n墨飛猛地睜開眼。\n\n那氣息,一閃即逝,快得如同錯覺。可他那承接了完整道統的問道盤，卻,清晰地，捕捉到了它的一絲殘留——\n\n【警示:偵測到「反問道」之韻!極其微弱,轉瞬即逝。】\n【方位:問劍宗……內部。】\n\n墨飛的心，沉了下去。\n\n反問道之韻!就在問劍宗內部!\n\n這意味著什麼?意味著,那湮沒萬古的「反問道」邪異勢力，其爪牙，竟已，悄然，滲入了問劍宗!\n\n「洛家……」墨飛眸光一凝。他幾乎立刻,便將這股邪異氣息，與那對他恨之入骨的洛家，聯繫在了一起。\n\n煉器世家洛家，勢力龐大，底蘊深厚。若他們,為了報復自己，而不惜,與那「反問道」的邪異勢力,勾結——\n\n那這盤棋,便,大了。\n\n墨飛不動聲色，卻,悄然，將問道盤的「推衍」與「道眼」，暗中，運轉起來，密切,監視著宗門內,那一切,可疑的異動。\n\n——\n\n果然，數日之後，異變，陡生。\n\n問劍宗，一位閉關衝擊元嬰的長老，於閉關之中，突然，走火入魔，暴斃而亡!\n\n那長老，修為精深，心性堅定，本不該有此劫難。可他的屍身，卻,以一種,詭異的速度,枯萎、腐朽,周身,縈繞著一絲,若有若無的、邪異的黑氣。\n\n宗門震動。\n\n幾位元嬰長老親自查探，卻,查不出，那長老暴斃的緣由，只當是，衝擊元嬰失敗的意外。\n\n唯有墨飛，在那長老的屍身之上，以「觀道」之能，清晰地，看見了——那與幽冥墟死氣、與凌霜劍煞,同源的，「反問道」的,邪異烙印!\n\n「不是意外。」墨飛心中，一片冰寒，「是有人,以『反問道』之法,暗中,害了他!」\n\n「反問道」之力，最擅,便是「毀道、噬道」。那長老衝擊元嬰、道心最脆弱的剎那，被那邪法一引,道基崩潰,走火入魔,便,順理成章。\n\n而這，分明，是一次,精準的、無聲的,暗殺!\n\n「兇手，就在宗門之內。」墨飛眸光森然。他將「道眼」催發到極致,一日日,暗中,篩查著宗門內,每一個,可能與「反問道」相關的存在。\n\n三日後，他，鎖定了目標。\n\n那是一名，新近，因「與洛家交好」而被引薦入宗、掌管內門一處丹房的,執事修士,名喚,陰無常。\n\n當墨飛的「道眼」，掠過那陰無常的剎那——\n\n【陰無常│金丹後期│戰力……偽裝下,真實戰力,約 3000!】\n【〔警示:此人氣息,經『反問道』邪法遮掩。其真身,乃「反問道」一脈之爪牙。潛入問劍宗,受洛家接引,目的……不明,恐與『針對墨飛』及某種更大的圖謀,有關〕】\n\n墨飛的瞳孔，驟然,收縮。\n\n金丹後期，真實戰力三千！一個,潛藏於問劍宗內部的、與洛家勾結的、「反問道」邪修!\n\n那長老之死，只怕，便是此人所為。而他潛入問劍宗的目的，除了配合洛家,對付自己——只怕,還藏著,一個,更深、更大的,圖謀!\n\n「原來如此。」墨飛闔上眼,將這一切,盡數,推衍、串聯，「洛家報復是明,反問道潛入是暗。」\n\n「他們,是想借洛家與我的私怨為掩護,在這問劍宗內,行那,不可告人之事。」\n\n墨飛睜開眼，眸中，寒光與戰意，交織。\n\n他知道，一場,遠比洛天罡那「三十招之約」，要凶險、要致命得多的,暗戰,已然,悄然,降臨。\n\n而這一次，他面對的，不再只是,一個心胸狹隘的洛家;而是,那,湮沒萬古、覆滅了問道一脈的、真正的,「反問道」邪異勢力,伸向這問劍宗的,第一隻,爪牙。\n\n「陰無常。」墨飛,將這個名字,鄭重,記下,眸中,殺意,凝聚，\n\n「反問道的爪牙……」\n\n「來得好。」他握了握拳，那是,問道一脈,與反問道,湮沒了萬古的血仇,第一次,以這樣的方式,重新,交鋒，\n\n「就讓我,這問道傳人,親手,拔了你這第一隻,伸進來的,爪牙。」\n\n「也好,順著你這條線——」他望向那,潛藏於暗處的,龐大陰影，\n\n「把你們,反問道的,狐狸尾巴,一寸一寸,揪出來。」\n\n——\n\n墨飛沒有,貿然,打草驚蛇。\n\n陰無常,金丹後期,真實戰力三千,遠在他之上。更兼此人潛藏於暗、詭計多端,又有洛家為奧援。若無萬全之策,貿然出手,只怕,反受其害。\n\n他做的第一件事，是尋了凌霜。\n\n密室之中，墨飛將所察,和盤托出。凌霜聽罷，那清冷的臉上，也染上了一層,凝重的寒霜。\n\n「反問道的爪牙,竟已潛入宗門……」她眸光森然，「那長老之死,原來,是他的手筆。」\n\n「此事,非同小可。」墨飛沉聲道，「陰無常一日不除,宗門,便一日,危機四伏。可他真實戰力三千,又受『反問道』邪法遮掩,尋常長老,根本,看不穿他的偽裝。」\n\n「我們,若無實據,貿然指認,」他搖頭，「反倒會被他,反咬一口。」\n\n「那便,尋實據。」凌霜眸光一凝，「拿到他行邪法、通反問道的鐵證,呈於掌門與眾長老。屆時,便是他反問道爪牙的身份,再無所遁形。」\n\n「正是此意。」墨飛頷首。\n\n二人一拍即合，暗中，張開了一張，針對陰無常的,無聲之網。墨飛以問道盤的「道眼」與「推衍」，日夜，監視著陰無常的一舉一動，靜待,他,露出破綻的,那一刻。\n\n——\n\n然而，那陰無常，也非泛泛之輩。\n\n他既是「反問道」潛入宗門的爪牙，行事，自是,滴水不漏。他白日裡，是那個和善謙恭的丹房執事;唯有夜深人靜之時，才,悄然,行那,不可告人之事。\n\n而更讓墨飛心驚的是——數日的監視下來，他發現，陰無常暗中,搜集的,竟是宗門那,幾位閉關衝擊元嬰的長老的,修行資訊,與……問劍宗鎮宗大陣的,一部分,陣圖!\n\n「他不只是要害人。」墨飛心中,警鈴大作，「他,是在,為某種,針對整個問劍宗的,大陰謀,做準備!」\n\n反問道爪牙潛入,勾結洛家,暗殺長老,窺伺鎮宗大陣——這一樁樁,串聯起來,指向的,是一個,足以,撼動整個問劍宗根基的,滔天陰謀!\n\n墨飛的臉色,前所未有的凝重。\n\n他原以為,自己面對的,不過是洛家的私怨、陰無常的暗殺。可如今看來,這背後,是「反問道」邪異勢力,對問劍宗,乃至,對這一整片天地,一盤,籌謀已久的,大棋!\n\n而他墨飛,這問道一脈的唯一傳人,恰恰,是這盤棋上,那顆,最不該出現、卻,足以,攪動全局的,變數。\n\n「陰無常,洛家,反問道……」墨飛立於問劍崖之巔,望著那,被夜色籠罩的、看似平靜的問劍宗，眸中,星河與寒意,交織，\n\n「這盤棋,越來越大了。」\n\n「可惜,」他握了握拳,眼底,是問道傳人,迎向邪異的,凜然戰意，\n\n「你們,終究,還是,低估了,一個,能『看見一切』的,問道者。」\n\n「這場暗戰,」他一字一頓，\n\n「我,接了。」"}, {"t": "第三十四章 破邪", "c": "機會，在七日之後，降臨。\n\n這一夜，月隱星沉。墨飛的「道眼」，捕捉到陰無常，鬼鬼祟祟地，潛入了宗門後山，一處，鎮宗大陣的,樞紐節點。\n\n「動手了。」墨飛眸光一凝。\n\n他早已,與凌霜,布好了局。此刻，他一面，以傳訊玉符，暗中,知會凌霜與那位,唯一被他們,私下取信的元嬰長老——玄虛真人;一面，自己,悄然,尾隨,而至。\n\n後山，鎮宗大陣的樞紐前。\n\n陰無常，正以一種,詭異的邪法，將一枚,散發著幽幽黑光的、蘊著「反問道」之韻的,邪異法器,悄然,埋入那陣眼的地脈之中。\n\n「果然。」墨飛藏於暗處，「道眼」將那一幕,盡數,看穿——【陰無常正以「反問道」邪器,侵蝕、篡改鎮宗大陣的陣眼。一旦得逞,問劍宗鎮宗大陣,將現致命破綻!】\n\n這鐵證，他要的，正是這一刻。\n\n「陰無常!」墨飛自暗處，緩步而出，聲音,冷冽如冰，「深夜潛入陣眼，行此邪法。你這『反問道』的爪牙，藏得，可真夠深。」\n\n陰無常猛地回頭，見是墨飛，那張和善謙恭的臉，瞬間，褪去了偽裝，化作一片,陰鷙與森然。\n\n「墨飛?」他眼中，凶光畢露，「你,竟識破了我?」\n\n他並不慌亂。他冷冷地打量著墨飛，唇角，勾起一抹,殘忍的冷笑:「也罷。你既然,看穿了我,那便,只有,死路一條。」\n\n「一個小小的金丹一層,」他周身，那被邪法遮掩的、金丹後期的恐怖真元，轟然，爆發，「也敢,壞我大事?今夜,我便,送你,去死!」\n\n金丹後期，真實戰力三千。\n\n墨飛金丹一層，戰力,不過兩千一。\n\n境界、戰力，皆處下風。\n\n可墨飛的眼底,卻無半分懼意。\n\n他要的，本就不是,獨力,擊殺此人。他要的，是,拖住他，是,以問道之算，撐到,凌霜與玄虛真人,趕來的,那一刻!\n\n「送我去死?」墨飛冷笑，那套環環相扣的配置，與那由「殘」轉「全」的問道盤，同時，運轉，「陰無常，你且看看，是你,送得了我——」\n\n「還是,我,拖得垮你。」\n\n一場,以弱抗強的搏殺，就此，展開。\n\n陰無常的「反問道」邪法，詭異、陰毒，最擅,毀道、噬道。那一縷縷邪異的黑氣，專攻墨飛的道基與神魂。若是尋常修士，只怕，早已,道心崩潰。\n\n可墨飛，是問道傳人。\n\n「反問道」，是「問道」的扭曲與顛倒。而墨飛的問道盤、《問道錄》，恰恰，是這「反問道」邪法，最,針鋒相對的,剋星!\n\n那一縷縷邪異的黑氣攻來，墨飛的「觀道」，便將其道則紋路，看得,一清二楚;那看似防不勝防的邪法，在他眼中，破綻，畢露。他以《太一光明經》的純陽正道之力，一次次,將那邪氣,消融、化解;更以問道盤推衍出的走位，將陰無常那,毀滅性的攻勢，一次次,巧妙,避過。\n\n「不可能!」陰無常又驚又怒，「你的『問道』之力……為何,能,剋制我的邪法?!你到底,是什麼人?!」\n\n「我是誰?」墨飛一邊周旋，一邊冷冷道，「我，是你們『反問道』，湮沒了萬古，卻,終究,沒能,斬草除根的——」\n\n「問道一脈,唯一的,傳人。」\n\n陰無常聞言，如遭雷擊，那陰鷙的臉上，第一次，露出了,毫不掩飾的,驚駭與恐懼:「問道傳人?!你,你竟是問道一脈的餘孽?!怎麼可能!問道一脈,早已,被我教,滅絕殆盡——」\n\n「我教?」墨飛眸光一凝,牢牢,抓住了這個詞。\n\n反問道,自稱「我教」。這意味著，那覆滅問道一脈的，並非零散的邪修，而是,一個,有組織、有傳承的,龐大邪教!\n\n這條線索,太重要了。\n\n「陰無常，」墨飛的問道盤，已推衍出,凌霜與玄虛真人,即將趕到，他不再周旋，眼底,寒光一閃，「你這『反問道』的來歷，你們『我教』的圖謀，還有你今夜,篡改陣眼的鐵證——」\n\n「今夜,便都,由不得你,狡辯了。」\n\n話音未落——\n\n一道璀璨奪目的劍光，與一股，元嬰後期的,浩瀚威壓，自後山之巔，轟然,降臨!\n\n「何方邪祟,竟敢,潛入我問劍宗,篡改鎮宗大陣!」\n\n是凌霜，與元嬰長老，玄虛真人!\n\n陰無常臉色劇變。他今夜之事,已被墨飛,盡數看穿;那埋入陣眼的邪器,更是,鐵證如山。如今,元嬰長老親至,他,插翅難逃!\n\n「墨飛!問道餘孽!」陰無常眼中，凶光與怨毒，燃燒成一片瘋狂，「今日之仇,我教,必百倍,奉還!」\n\n他自知不敵,竟一咬牙,施展出一門,詭異的「血遁」邪術,不惜,自損修為,化作一道血光,亡命,遁逃!\n\n「哪裡走!」玄虛真人一聲大喝，元嬰威壓,轟然壓下。可那陰無常的血遁,詭異至極,竟,在那威壓之下,堪堪,遁走,只留下,一地,狼藉,與那,埋入陣眼的,邪異法器。\n\n——\n\n陰無常雖遁，其罪證，卻，鐵證如山。\n\n玄虛真人取出那枚埋入陣眼的邪異法器，以元嬰神識一探，臉色，驟然，大變:「這是……『反問道』的邪器!噬道毀基之物!若非今夜及時發現，一旦此物,徹底,侵蝕陣眼——我問劍宗鎮宗大陣,危矣!」\n\n他望向墨飛，那雙,深邃的老眼裡,滿是,驚異與鄭重:「墨飛，此番,若非你,識破此獠,力挽狂瀾——後果，不堪設想。你,立了,大功。」\n\n墨飛拱手，卻,神色凝重:「真人，此事,非同小可。那陰無常，是『反問道』一脈,潛入宗門的爪牙。他勾結洛家,暗殺長老,更圖謀,篡改鎮宗大陣。」\n\n「而他口中的『我教』——」墨飛一字一句，「只怕,是一個,湮沒於萬古、卻從未消亡的,龐大邪教。他們的圖謀,絕不止,一個問劍宗。」\n\n玄虛真人聞言，臉色，愈發凝重。他久經世事,自然聽得出,此事背後,那滔天的凶險。\n\n「此事，老夫，必稟明掌門,徹查洛家,嚴防『反問道』!」他鄭重道，又深深看了墨飛一眼，「墨飛,你既能識破邪法,想來,對這『反問道』,知之甚深。日後,宗門,或有,仰仗你之處。」\n\n墨飛垂眸，並未,將問道盤與問道傳承的秘密，全盤托出。他只道:「晚輩,略知一二。若宗門有需,晚輩,義不容辭。」\n\n——\n\n此夜之後，問劍宗，暗流洶湧。\n\n掌門震怒，徹查洛家。那洛家,引薦陰無常入宗,雖矢口否認「知情」,卻也,因此事,與問劍宗,徹底,交惡。而洛天罡,更是,將這筆帳,盡數,算在了墨飛頭上——若非墨飛,揪出陰無常,洛家與反問道的勾結,又豈會,敗露?\n\n「墨飛……墨飛……」洛家別院之中，洛天罡,咬牙切齒，那雙鷹隼般的眼睛裡，怨毒,幾乎,化為實質，「一而再,再而三!你這問道餘孽,真當,我洛家,奈何,不了你?!」\n\n而墨飛,亦是心知肚明。\n\n經此一役，他,徹底，站上了風口浪尖。\n\n反問道,已知,他這問道傳人的存在——一個,他們,以為早已滅絕的,道統餘孽。他們,絕不會,善罷甘休。\n\n洛家,更是,恨他入骨,只待,尋一個,將他,除之而後快的,時機。\n\n「明槍暗箭,只怕,要,接踵而至了。」墨飛立於問劍崖,望著那,夜色沉沉的天際，心底,一片,清明,卻,無半分,懼意。\n\n「反問道,洛家……敵人,越來越強,越來越多。」他握了握拳，眸中，戰意熊熊，\n\n「那我,便只有,一條路。」\n\n「變強。」他一字一頓，「快,一點,變強。」\n\n「金丹一層,不夠。金丹圓滿,不夠。」他望向那更高、更遠的元嬰之境，眸中，星河流轉，\n\n「唯有,踏入元嬰,乃至,更高之境——」\n\n「我,才有,真正的,底氣,去面對,那湮沒萬古的『反問道』,去揪出,那覆滅了問道一脈的,真正元兇。」\n\n「也才有,底氣,護住,我想護的人。」他望向凌霜所居的方向，眼神,轉柔,隨即,又化為,一片,凜然的,堅定。\n\n夜風獵獵。\n\n一個問道傳人的仇與志、情與劫，在這問劍宗的夜色之中，交織成一張，越來越大、也越來越沉重的網。\n\n而墨飛知道，他,已無退路。\n\n唯有,一路向前,一路變強,將這網中的每一個敵人、每一道劫難,親手,算破、斬斷——\n\n直到,登上那,問道一脈,先賢們,未曾,抵達的,巔峰。"}, {"t": "第三十五章 論道大會", "c": "經此一役，墨飛更是心無旁騖，一頭紮進了閉關之中。\n\n他清楚，唯有實力，才是這風口浪尖之上，唯一的倚仗。有問劍宗傾力栽培的資源，有九品道韻金丹的底蘊，有《問道錄》的至理，他的修為，一日千里。\n\n三月之後，他出關之時，那丹田之中的道韻金丹，已然，圓融無漏，臻至了——金丹圓滿之境!\n\n【墨飛│金丹圓滿│戰力 3600】\n\n戰力三千六！\n\n這個數字，已然，超越了那潛入宗門的邪修陰無常，直逼，一位，尋常的元嬰初期修士！以金丹之境，有此戰力，縱觀問劍宗，也是,前所未有的,妖孽。\n\n「離元嬰，只差一步了。」墨飛立於問劍崖，握了握拳，體內磅礴的真元，奔湧不息。可他並不急於，衝擊元嬰——元嬰乃是第三道大關，一旦結成元嬰，便再難更改。他要,將這金丹之道，參悟到極致，方能,結出,與眾不同的元嬰。\n\n就在墨飛,潛心參悟之際，宗門，傳來了一樁,轟動整個修行界的大事——\n\n三十年一度的「天南論道大會」，即將，於天南第一聖地「論道峰」，舉行!\n\n天南論道大會，是天南一域,所有頂尖宗門、世家、乃至散修天驕，共聚一堂的,盛會。屆時，各方天驕，將於論道峰上，論道、鬥法、爭鋒，一決高下。表現卓絕者，不但能揚名立萬，更能得,各大聖地的,傳承與機緣。\n\n這是,整個天南一域,年輕一代天驕的,最高舞台。\n\n「三十年一度……」墨飛心中一動。\n\n問劍宗,作為天南數一數二的大宗，自然,受邀。而宗門,經過一番嚴格的遴選，最終，選定了,代表問劍宗,出戰的,天驕名單。\n\n墨飛之名，赫然，位列榜首。\n\n與他一同入選的，還有,凌霜,以及,另外幾名，內門的頂尖天驕。\n\n「墨飛，」凌霜尋到他，那清冷的臉上，罕見地，帶著一絲,鄭重與期許，「這天南論道大會，非同小可。屆時，天南各域的絕世天驕，齊聚一堂。你我,將面對的,是,遠比問劍宗內,強大得多的,對手。」\n\n「而且，」她眸光一凝，聲音,壓低了幾分，「如此盛會，各方勢力雲集,魚龍混雜。那『反問道』的邪教,只怕,也不會,錯過,這等,渾水摸魚的良機。」\n\n墨飛聞言，眸光,微微,一凝。\n\n凌霜說得在理。天南論道大會，天驕雲集，機緣遍地，正是,那潛藏於暗處的「反問道」邪教,興風作浪的,最好時機。\n\n「反問道,洛家……」墨飛心中，飛快地，盤算著。他那「推衍」之能，隱隱,生出一絲,不祥的預感——這一趟論道大會,只怕，不會，太平。\n\n可他眼底,卻無半分退意,反而,燃起了熾烈的戰意。\n\n「天南各域的絕世天驕……」他握了握拳，「我墨飛,自青石鎮一路走來,鬥的,便是那些,天賦遠勝於我的天驕。」\n\n「這論道大會,正好——」他眸中,星河流轉，「讓我看看，我這問道之道，在這天南一域的,真正的,天驕之林裡，能走到,哪一步。」\n\n「也正好，」他眼神一冷，「順著這渾水，會一會，那『反問道』的,狐狸尾巴。」\n\n「師姐，」他望向凌霜，鄭重道，「這論道大會，我，去定了。」\n\n凌霜望著他那,戰意熊熊的眸子，清冷的唇角，綻開一抹，柔和而讚許的笑意:「好。」\n\n「這一趟，」她一字一句，眼中，是並肩的決意，「我,與你,同去。」\n\n——\n\n半月之後，問劍宗，赴會的隊伍，正式，啟程。\n\n一艘華美的、鐫刻著問劍宗徽記的巨型靈舟，載著墨飛、凌霜等一眾天驕，破空而起，朝著,那,天南聖地,論道峰的方向，疾馳,而去。\n\n靈舟之上，墨飛立於舟頭，望著那腳下,飛速掠過的、廣袤無垠的天南大地，心潮，起伏。\n\n三十年一度的天南論道大會。天驕雲集的最高舞台。潛藏於暗的反問道邪教。恨他入骨的煉器世家洛家。\n\n這一趟論道之行，註定，是一場,龍爭虎鬥、暗流洶湧的,大劫。\n\n可墨飛的眼底，卻是一片，迎向風浪的,澄澈與篤定。\n\n「來吧。」他望向那，天際盡頭,那座,傳說中的,論道聖地，一字一頓，\n\n「天南的,天驕也好，反問道的,邪祟也罷——」\n\n「這一趟，就讓,你們,見識見識——」\n\n「什麼叫,問道。」\n\n——\n\n三日後，論道峰，遙遙在望。\n\n那是一座，比問劍宗，還要恢弘、還要磅礴的,萬丈仙山。峰頂，雲海翻湧，仙光繚繞，一座座古樸的論道台，懸浮於雲端，散發著,亙古的道韻。無數道靈舟、遁光，自四面八方,匯聚而來，將這片天空,點綴得,如同,群星璀璨。\n\n天南各域的頂尖勢力，皆已,雲集於此。\n\n墨飛立於舟頭，以「道眼」，掠過那一艘艘靈舟、一道道遁光——那其中，元嬰大能，比比皆是;金丹天驕，更是,多如過江之鯽。他甚至，隱隱，感應到了幾道，深不可測、令他心悸的,恐怖氣息——那是,已臻至,化神之境的,老怪物!\n\n「果然，是天南的最高舞台。」墨飛心中，凜然。這裡的底蘊與強者，遠非,問劍宗一隅,可比。\n\n問劍宗的靈舟，緩緩，停靠於論道峰,劃分給各大宗門的,靈舟泊位。\n\n一行人剛落地，便迎來了，數道，帶著審視與輕慢的目光。\n\n「喲，這便是問劍宗的隊伍?」一道,陰陽怪氣的聲音，傳來。那是鄰近泊位,一個身著華服、面帶倨傲的青年,身後,跟著幾名同門，「我當是誰,原來,是問劍宗那位,近來,傳得神乎其神的『墨飛』?」\n\n墨飛以「道眼」一掃——【姬無雙│金丹後期│戰力3200│天南名門「星辰宗」天驕,自視甚高,與洛家,交好】。\n\n又是一個，與洛家沾親帶故的。\n\n「聽聞閣下，」姬無雙斜睨著墨飛，語氣,充滿了不加掩飾的譏誚，「不過是個,出身鄉野、靠著幾分,取巧伎倆,才爬上來的,雜役?也配，代表問劍宗，出戰這天南論道大會?」\n\n「我星辰宗的天驕,自幼便以,頂尖資源,悉心栽培。似你這等,野路子出身的——」他嗤笑一聲，「在這論道峰上，怕是,連第一輪,都撐不過去。」\n\n他身後幾名弟子，跟著,一陣哄笑。\n\n墨飛卻,恍若未聞。這等,以出身、以資質,論人高下的輕慢，他從青石鎮的測靈石前，一路,聽到現在，早已，波瀾不驚。\n\n「是不是取巧伎倆,是不是撐不過第一輪，」墨飛淡淡抬眸，迎上姬無雙那倨傲的目光，語氣，溫吞，卻,字字清晰，「論道台上，見真章便是。」\n\n「姬師兄若是,對我這『野路子』,如此,不屑——」他唇角，壓下一絲鋒芒，「不妨,論道之時,尋我一戰。」\n\n「屆時，是,取巧伎倆,還是,真才實學;是,雜役,還是,天驕——」\n\n「你,自會,知曉。」\n\n姬無雙臉上的譏誚，微微，一僵。他沒料到，這個「鄉野雜役」，竟,如此,不卑不亢，那份沉靜的氣度，竟讓他這,名門天驕，隱隱，生出一絲,說不清的,忌憚。\n\n「好一張,利嘴!」姬無雙冷哼一聲，「墨飛，我記住你了!論道台上,我,定要,親手,將你這雜役,打回原形!」\n\n言罷，他一甩衣袖，帶著人，悻悻,離去。\n\n凌霜行至墨飛身側，望著那姬無雙離去的背影，清冷的眸中，掠過一絲寒意:「星辰宗姬無雙，與洛家,過從甚密。這論道大會之上，只怕，洛家,已借他之手,對你,布下了,天羅地網。」\n\n「不止洛家。」墨飛望向那,雲霧繚繞、暗流洶湧的論道峰，眸光，深邃，「還有，那潛藏於暗的,反問道。」\n\n「明槍暗箭，齊至。」他握了握拳，眼底，卻是一片，迎向風浪的,凜然戰意，\n\n「那便，一個一個——」\n\n「算過去。」"}, {"t": "第三十六章 問道驚天南", "c": "天南論道大會，正式，開幕。\n\n論道峰頂，九座巨大的、懸浮於雲端的論道台，同時，燃起了戰火。來自天南各域的年輕天驕，於台上,論道、鬥法，一決,高下。\n\n這一屆的論道大會，規則，與問劍宗那外門大比，頗為相似——捉對廝殺，勝者晉級，敗者淘汰;連勝者，逐級而上，直至,決出，這一屆的,天南第一天驕。\n\n只是，這裡的對手，個個，皆是,各大宗門、世家,傾力栽培的絕世天驕，實力，遠非,問劍宗一隅,可比。金丹後期、乃至,金丹圓滿的天驕，比比皆是。\n\n墨飛的首戰，對手，是一名，來自天南「焚天谷」的火系天驕。\n\n【向天燒│金丹後期│戰力3100│火系,攻勢剛猛霸道,爆發力驚人】\n\n金丹後期，戰力三千一。比墨飛的金丹圓滿、戰力三千六，略低。可那火系功法的剛猛霸道，卻,極為難纏。\n\n戰鼓一響，向天燒便,狂攻而至，一身焚天烈焰,鋪天蓋地，攻勢之猛，讓台下觀戰的天驕，都為之側目。\n\n可墨飛，卻,穩如泰山。\n\n他那由「殘」轉「全」的問道盤，將向天燒每一記火術的軌跡、力道、乃至,那烈焰之中，道則流轉的破綻，盡數，拆解、推演。他不與那剛猛的火焰,硬拚,只以《寒瀑劍》的水系寒氣,層層,克制、遲滯;以《太一光明經》的護體，化解那焚天之勢;再以問道盤推衍出的走位，將那看似,無懈可擊的攻勢，一次次,巧妙,避過。\n\n向天燒的烈焰，燒了半晌，竟,連墨飛的衣角，都未能,真正,燎到。\n\n「你這打法……」向天燒又驚又怒，「怎麼,像是,能未卜先知一般?!」\n\n「不是未卜先知。」墨飛淡淡道，抓住向天燒一輪攻勢,舊力用盡的剎那，身形,一晃,欺身而近，「是我，算得到你的每一招。」\n\n一記蘊著問道至理的《裂石訣》金系氣刃，破開向天燒倉促凝起的火焰護體，狠狠，抵上了他的咽喉。\n\n「你，輸了。」\n\n全場，一片,寂靜。\n\n一個名不見經傳的問劍宗弟子，竟,乾淨利落地，擊敗了焚天谷的火系天驕?台下,無數道目光，齊齊，投向了那台上，一身青衫、氣度沉靜的少年。\n\n「墨飛?就是那個，問劍宗傳得神乎其神的……」\n\n「他的打法，好生古怪。分明,境界、戰力,並不佔絕對上風,卻,將對手,玩弄於股掌之間……」\n\n墨飛,並未,理會這些議論。他從容,退場，靜待,下一輪。\n\n——\n\n一輪，兩輪，三輪。\n\n墨飛，如同一台，精密到極致的算珠，將一個又一個，天南各域的絕世天驕，送下了論道台。\n\n他的打法，詭異而高效，卻又，暗合大道。他從不與人，比拚境界與蠻力;他總能，提前，算到對手的每一招;總能，精準地，抓住那,一閃即逝的破綻;總能，以最省力、最刁鑽的方式，將勝勢，攥進手裡。\n\n那些自幼被頂尖資源栽培的天驕，一個個，敗在他手下，卻,連他,是如何取勝的，都,看不分明。\n\n「問道……」台下，漸漸，有見多識廣的老者，望著墨飛那玄妙的打法，眸中，掠過一絲,驚疑，「這少年的道，怎麼……透著一絲,古老到,近乎失傳的,韻味?」\n\n墨飛之名，隨著這一場場，驚世駭俗的勝利，開始，在這天南論道大會之上，悄然，傳開。\n\n那個曾被姬無雙譏為「鄉野雜役」的問劍宗弟子，如今，已成了，這一屆論道大會上，最耀眼、也最神秘的，一匹,黑馬。\n\n而那高踞於論道峰頂、俯瞰全場的,各大聖地的化神老怪們，也漸漸，將,審視的目光，投向了,那個,一路,越級,連勝的,青衫少年。\n\n「問劍宗，墨飛。」一位,鬚眉皆白的化神老者，望著台上的墨飛，眼中，掠過一絲,深深的,興味，「以『算』證道,以弱勝強……有點意思。」\n\n「這一屆的論道大會——」他撫著長鬚，緩緩道，「怕是，要因這少年,而,不同了。」\n\n——\n\n第五輪，墨飛，終於，對上了那放言要將他「打回原形」的星辰宗天驕，姬無雙。\n\n【姬無雙│金丹後期│戰力3200│星辰宗天驕,修一部星辰劍陣,遠近皆能,變化繁多】\n\n姬無雙自恃甚高，一上台，便將那星辰劍陣，盡數,催發。漫天星辰之力，化作,無數道,飄忽不定的劍光，虛實相間，將整座論道台，籠罩在一片，璀璨而致命的,星海之中。\n\n那星辰劍陣，變化繁多，尋常對手，只怕，早已，被那漫天星光，迷了眼、亂了神。\n\n可墨飛，有問道盤。\n\n那看似無跡可尋的星辰劍陣，在他「觀道」之能的注視下，那,道則的流轉、劍光的軌跡、乃至,那陣法的,唯一,陣眼，皆,纖毫畢現。\n\n「星辰劍陣，變化雖繁，」墨飛立於那星海之中，氣定神閒，「陣眼，卻,只有一個。」\n\n他不去理會那漫天,虛實難辨的星光，只以問道盤推衍出的路徑，如閒庭信步般，在那,致命的星海之中，精準地，一步一步，直取,那,唯一的,陣眼!\n\n「不可能!」姬無雙駭然變色，「你,竟能,看穿,我星辰劍陣的,陣眼?!」\n\n他慌忙,想要,變陣。可已經,晚了。\n\n墨飛,已至陣眼之前。一記蘊著問道至理的《裂石訣》，破開陣眼那,最薄弱的護持，狠狠，一擊——\n\n轟!那看似,無懈可擊的星辰劍陣,陣眼被破,登時，土崩瓦解，漫天星光，盡數，潰散!\n\n失了劍陣的姬無雙，如同,被拔了牙的猛虎。墨飛身形一晃，一套環環相扣的配置,連消帶打,將他,逼入絕境。三招之內，斷刀，已抵上了姬無雙的咽喉。\n\n「姬師兄，」墨飛淡淡開口，那是姬無雙,親口說過的話，此刻,被墨飛,原封,奉還，「是取巧伎倆,還是真才實學;是雜役，還是天驕——」\n\n「你，可,知曉了?」\n\n姬無雙面如死灰，那份倨傲，早已，蕩然無存，唯有，無盡的，驚駭與屈辱:「我……認輸。」\n\n台下，一片,譁然。星辰宗的天驕姬無雙，那與洛家交好、放言要碾壓墨飛的名門之後，竟,被墨飛，以破陣之姿，乾淨利落地，擊敗!\n\n這一戰，徹底，奠定了墨飛，在這一屆論道大會上，「黑馬」的地位。\n\n——\n\n然而，就在墨飛連勝六輪、聲名鵲起之際，論道峰的暗處，一雙,淬滿了邪異與陰毒的眼睛，也，牢牢地，鎖住了他。\n\n那是,一道，混跡於觀戰人群中的、氣息,被邪法遮掩得,天衣無縫的,黑袍身影。\n\n當墨飛擊敗姬無雙、走下論道台的剎那，那黑袍身影的唇角，勾起一抹,森然的冷笑，一縷，只有墨飛的問道盤,才能,捕捉到的,極其微弱的「反問道」之韻，一閃,而逝。\n\n墨飛的腳步，微微，一頓。\n\n他,感應到了。\n\n「反問道……來了。」他不動聲色，眸光,卻,驟然，一冷。\n\n反問道的爪牙，果然，如凌霜所料，藉著這論道大會的渾水，潛入了論道峰。而他們的目標——\n\n墨飛以「道眼」，暗中，掃過那,一閃而逝的黑袍身影,那深藏的氣息之下,竟,是,一位,元嬰後期的,恐怖大能!\n\n一個，元嬰後期的，反問道大能，混跡於論道峰，死死，盯著,他這個,問道傳人。\n\n「來為陰無常,報仇?」墨飛心中，飛快地，推衍，「還是……這論道大會之上,反問道,另有,更大的,圖謀?」\n\n他望向那，人群攢動、看似,盛世繁華的,論道峰，眸中，寒光一閃。\n\n明處，是洛家、姬無雙的,明槍;暗處，是反問道大能的,毒箭。\n\n這一屆的天南論道大會，於墨飛而言，早已，不只是一場，天驕爭鋒的舞台。\n\n而是一座，殺機四伏、龍潭虎穴般的，大劫。\n\n「都來吧。」墨飛握了握拳，那雙星河流轉的眸子裡，是問道傳人，迎向一切風浪的,凜然無懼，\n\n「這一趟，我倒要看看——」\n\n「是你們,反問道的邪，勝過我問道的正;還是我這問道之算,能算破,你們,藏在這繁華之下的,滔天,殺局。」"}, {"t": "第三十七章 驚變", "c": "論道大會，進行至第七日，已入尾聲。\n\n墨飛一路,過關斬將,連勝十餘輪，殺入了,這一屆論道大會的,前八強!一個名不見經傳的問劍宗弟子，以「問道」之姿，力壓天南各域無數絕世天驕，這等戰績，早已，轟動了整個論道峰。\n\n各大聖地的化神老怪，望向墨飛的目光，皆,多了幾分,鄭重與招攬之意。而問劍宗的隊伍，更是,與有榮焉，聲勢，大振。\n\n然而，墨飛的心中，卻,始終，懸著一根弦。\n\n那潛藏於暗處的、反問道的元嬰大能，這幾日，如同,附骨之疽，始終，在暗中，窺伺著他。而他那「推衍」之能，更是，隱隱，捕捉到了，一絲,越來越濃烈的,不祥氣息——彷彿，有一場，籌謀已久的,滔天陰謀，正,在這論道峰的繁華之下，悄然，逼近,爆發的臨界。\n\n「反問道潛伏於此，絕不只是為了對付我。」墨飛心中，警鈴大作，「這論道峰上，究竟，藏著,什麼,能讓他們,如此,大動干戈的,東西?」\n\n他將「道眼」與「推衍」，暗中，催發到極致，一寸一寸，篩查著這論道峰的,每一個角落。\n\n終於，他,鎖定了異常。\n\n論道峰的最深處，那座，供奉著天南諸聖地,歷代傳承的、被層層禁制守護的「藏道閣」之中——那,與問道遺跡、與幽冥墟,同源的,微弱道韻，此刻，正,愈發，清晰!\n\n「藏道閣!」墨飛瞳孔一縮。\n\n反問道的目標，不是他，甚至,不是問劍宗。是——這論道峰的藏道閣!那裡，供奉著天南諸聖地萬載積累的傳承，其中，只怕，就藏著,某件，與「問道一脈」相關的、被反問道,覬覦已久的,至寶!\n\n而這論道大會，天驕雲集、群雄匯聚、大能林立——如此,喧囂而混亂的時機，正是，反問道，趁亂,潛入藏道閣、盜取至寶的,絕佳,掩護!\n\n「不好!」墨飛心中，一片冰寒。\n\n他必須，立刻，示警!\n\n——\n\n可就在墨飛，欲尋凌霜與問劍宗長老示警的,剎那——\n\n異變，陡生!\n\n轟隆!\n\n一聲,驚天動地的巨響，自論道峰深處,那藏道閣的方向,轟然,炸響!緊接著，一股,滔天的、混雜著,無邊死氣與邪異之力的,黑色氣浪，沖天而起，將那半邊天空，都染成了，一片,詭異的,墨黑!\n\n「藏道閣被襲!」\n\n「有魔修,盜寶!護法大陣,被破了!」\n\n整座論道峰，瞬間，大亂!無數大能、天驕，紛紛，朝著藏道閣的方向，掠去。而那滔天的黑色氣浪之中，一道道,身著黑袍、氣息邪異的,身影，正,護著一件，散發著,古老道韻的,黑色匣子，亡命，突圍!\n\n反問道，果然，出手了!他們，趁著論道大會的混亂，強闖藏道閣，盜走了，那件，覬覦已久的至寶!\n\n「攔住他們!」諸聖地的化神老怪，勃然大怒，紛紛，出手攔截。一時間，論道峰上，元嬰、化神大能，鬥作一團,天崩地裂，威能，滔天!\n\n而墨飛，卻,在那一片混亂之中，死死，盯住了，那被黑袍人,護在中央的,黑色匣子。\n\n他的「觀道」之能，已將那匣中之物，看得,一清二楚——\n\n【偵測到:上古「問道」道統之物!】\n【〔藏道閣所藏，乃問道一脈,遺落於天南的,一件『問道信物』。其中,或藏著,問道一脈覆滅的,真相,與……那『反問道』元兇的,線索!〕】\n\n墨飛的心，狂跳,不止。\n\n那匣中之物，竟是,問道一脈的信物!是,關乎問道一脈覆滅真相的,關鍵!\n\n反問道，不惜,強闖聖地、與諸聖地大能為敵，也要,盜走此物——他們，是想,徹底，抹去,問道一脈,存在過的,最後痕跡!\n\n「不能，讓他們，得逞!」墨飛眸中，寒光暴漲。\n\n那件問道信物，於旁人，或許，只是,一件,來歷不明的古物;可於他這,問道傳人——那是,他追尋已久的,問道一脈的,真相!是,萬千先賢的,遺澤!\n\n「反問道……」墨飛握緊了斷刀，將問道盤的「推衍」，催發到極致,鎖定了那突圍的黑袍人,與那黑色匣子的,軌跡，\n\n「你們,想抹去,問道一脈的,最後痕跡——」\n\n「那便，先,問過,我這,問道一脈的,唯一傳人!」\n\n在那諸聖地大能,鬥作一團、無暇他顧的,混亂之中，一道青衫身影,如離弦之箭，避開了,漫天的,恐怖餘波，直直，朝著,那盜寶突圍的,黑袍人,追殺,而去!\n\n——\n\n那護寶突圍的黑袍人，是一名，金丹圓滿的反問道弟子。他負責，將那問道信物，護送出重圍。\n\n在諸聖地大能,鬥作一團的混亂之中,他自以為,無人,能顧得上他這條,不起眼的偏路。\n\n卻不想，一道青衫身影，如鬼魅般，攔在了他的面前。\n\n「留下,那匣子。」墨飛冷冷開口。\n\n「哪來的小輩,找死!」那黑袍人厲喝一聲，催動一身邪異真元，一縷縷「反問道」的黑氣，朝墨飛,絞殺而來。\n\n可他選錯了對手。\n\n「反問道」，是墨飛的問道盤，最,針鋒相對的剋星。那看似,防不勝防的邪法，在墨飛的「觀道」之下，破綻,畢露。他以《太一光明經》的純陽正道之力，將那邪氣，一一，化解;再以問道盤推衍出的殺招，配合金丹圓滿、戰力三千六的恐怖實力——\n\n三招!\n\n僅僅三招，墨飛便,以碾壓之勢，破開那黑袍人的防禦，一記蘊著問道至理的《裂石訣》，貫穿了他的胸膛!\n\n那黑袍人，難以置信地，睜大了雙眼，至死，都不明白，自己,怎會,敗得,如此,之快。\n\n墨飛一把,奪過那,散發著古老道韻的黑色匣子。\n\n指尖觸及的剎那，那匣中的問道信物，竟，如遊子歸家般，發出一陣，溫潤的、與他識海問道盤,遙相呼應的,清鳴!\n\n「拿到了!」墨飛心中，一喜。\n\n可還未等他，收好匣子——\n\n一股，令他,靈魂,都為之戰慄的,恐怖威壓，自身後，轟然，壓下!\n\n「問道餘孽!竟是你!」\n\n一道，森然而暴怒的聲音，響起。墨飛猛地回頭——只見，那潛藏了多日的、反問道的元嬰後期大能，此刻,已褪去偽裝，一身,滔天的邪異之力，鋪天蓋地，朝他,鎮壓而來!\n\n【反問道·護法·墨淵│元嬰後期│戰力……約 5000！】\n\n元嬰後期，戰力五千！\n\n那是，遠比幽冥墟屍魔王,還要,恐怖的存在！是,此刻的墨飛，拍馬,都難以望其項背的,滔天巨物！\n\n「陰無常廢物，壞我大事;今日，你這問道餘孽,又來,搶奪聖物!」墨淵那雙,淬滿邪異的眼睛裡，凶光,滔天，「我教,籌謀百年,豈容,你這區區螞蟻,一再,壞事!」\n\n「今日，我便，親手，將你這,問道一脈,最後的餘孽——」他一掌，攜著,毀天滅地的邪異之力，朝墨飛，轟然,拍落，\n\n「連同這問道信物，一併,徹底,抹殺!」\n\n那一掌之下，天地失色。墨飛只覺得，那股足以，將他，連魂帶魄，都碾成齏粉的恐怖威壓，已然，臨頭！\n\n生死一線!\n\n墨飛的問道盤，瘋狂運轉，卻,只推衍出，一片，冰冷的,絕望——【正面對抗:必死。逃:亦難逃元嬰後期,神識鎖定。】\n\n千鈞一髮之際——\n\n墨飛,做出了,最後的抉擇。他一手，死死，護住那問道信物;一手,毫不猶豫地，捏碎了，那枚，玄虛真人臨行前,贈予的,「護道玉符」!\n\n嗡!\n\n一道，蘊著問劍宗一位化神太上長老，一縷神念的,護道之光，自玉符中，轟然，爆發，堪堪，擋下了墨淵那,毀滅性的一掌!\n\n轟隆!\n\n護道之光,與那邪異一掌，轟然相撞，滔天的餘波，將墨飛，狠狠，震飛出去，口噴鮮血，重傷,垂危!\n\n可他,活下來了。\n\n「問劍宗的老怪物……」墨淵見一擊未能得手，又見那護道玉符驚動了問劍宗的化神大能，眼中，凶光一閃，終究，不敢,過度,糾纏。他,狠狠地，剜了墨飛一眼，那怨毒的目光，彷彿，要將他,刻進骨髓。\n\n「問道餘孽,你記住了!」他厲聲道，聲音，如附骨之疽，「你搶了聖物,壞了我教大事!這筆帳，我墨淵，我反問道——」\n\n「早晚，要你,連本帶利，一併,償還!」\n\n言罷，他不敢再留，化作一道邪異的黑光，倉皇，遁逃，消失在了，那論道峰的,漫天混亂之中。\n\n墨飛,重傷,倒在地上，卻,死死地，將那問道信物，護在懷中。\n\n他望著墨淵遁逃的方向，又望向懷中那，溫潤呼應的,問道信物，喘息著，唇角，卻,揚起一絲，帶血的,笑意。\n\n「信物……保住了。」\n\n「反問道……墨淵……我教……」他將這一切,一一,刻入心底，眸中，是重傷之下，卻,越燃越烈的,戰意，\n\n「這筆帳。」\n\n「早晚，我墨飛,會,親手,同你們——」\n\n「算,個,清楚。」"}, {"t": "第三十八章 信物", "c": "反問道強闖藏道閣、盜取聖物一事，震動了整個天南修行界。\n\n雖有諸聖地大能聯手攔截，那反問道，卻,仍,趁亂,逃逸了大半。唯有,墨飛,自那盜寶的黑袍人手中，硬生生，奪回了，那件,最為關鍵的,問道信物。\n\n當論道峰的化神老怪們，得知那件失而復得的聖物，竟是被一個「金丹圓滿的小輩」奪回，更力抗,反問道元嬰護法,一擊而不亡時——皆是，震驚不已。\n\n而當他們，得知那件聖物，乃是,湮沒萬古的「問道一脈」的信物，且，那少年墨飛，竟,能與之，遙相呼應時——\n\n整個論道峰的頂層，都，為之，轟動了。\n\n「問道一脈……那個,傳說中,以『算』證道、驚才絕艷,卻於萬古之前,一夕覆滅的,神秘道統?」\n\n「那少年,能與問道信物呼應……莫非,他,是問道一脈的,傳人?!」\n\n墨飛,那「問道傳人」的身份，經此一役，再難,隱藏。\n\n——\n\n論道峰，一處清幽的療傷靜室。\n\n墨飛重傷未愈，靜臥榻上。凌霜守在一側，親手，為他，餵下療傷靈藥，那雙,向來清冷的眸子裡，此刻，滿是,揪心與後怕。\n\n「你這人……」她輕聲埋怨，聲音卻,微微發顫，「明知那墨淵,是元嬰後期的大能，你,一個金丹，竟,還敢,去奪那聖物……你,可知道，你若,晚一步,捏碎玉符——」\n\n「可我，若不去奪，」墨飛虛弱地笑了笑，望著懷中那件,溫潤的問道信物，「這問道一脈,遺落於世的,最後真相，便,永遠，落入,反問道之手了。」\n\n「這信物，」他一字一句，眼神,鄭重，「是萬千問道先賢的,遺澤。是,我這唯一傳人,追尋已久的,真相。」\n\n「我，不能,讓它,湮沒。」\n\n凌霜靜靜地望著他，那份揪心與埋怨，終究，化作了，一縷,深深的,動容與敬佩。\n\n眼前這個少年，重傷垂危，念念不忘的，卻,不是自身的安危,而是,一個湮沒道統的,傳承與真相。這份,守護道統的,執著與擔當，讓她這,絕世天驕，都,為之,動容。\n\n「墨飛，」她握住他的手，輕聲道，「養好傷。這信物之中的真相，你我，一同，去解。」\n\n墨飛點頭。他運轉起,那由「殘」轉「全」的問道盤，將神識，探入那件，與之呼應的,問道信物之中。\n\n那信物之內，緩緩，浮現出，一段，塵封了萬古的,影像與意念——\n\n那是,問道一脈，最後的,歲月。\n\n墨飛,看見了。他看見，那曾以「觀天地、算大道」而驚才絕艷的問道一脈，是如何，在一夕之間，被一股，極致邪異、極致龐大的力量，覆滅、屠戮，幾近,滅絕。\n\n而那覆滅問道一脈的元兇——\n\n墨飛的瞳孔，驟然，收縮。\n\n那是一個，自稱「噬道天教」的、龐大而古老的,邪教!他們,信奉「毀道、噬道」之理，將天地間一切「道統」，視為,可供吞噬、壯大己身的,養料!而問道一脈,那參透萬物、丈量大道的至理,更是,被他們，視為,天下,最肥美的,獵物!\n\n「噬道天教……」墨飛喃喃，將這個名字，刻入骨髓，「反問道,原來,只是,他們對外的,一個,分支。」\n\n「他們的目標，」墨飛的臉色，前所未有的凝重，「不只是,問道一脈。是,這天地間，一切,道統與傳承。」\n\n「他們,煉幽冥墟、盜藏道閣、暗殺長老、覬覦聖物——都是,為了,吞噬,更多的,道!」\n\n一個，遠比,他想像中，還要龐大、還要恐怖的,滔天陰謀,自這問道信物之中，緩緩，揭開了，它的,一角。\n\n而那信物的最後，那湮沒萬古的問道先賢的殘念，留下了，一句，令墨飛,心神劇震的,話語——\n\n【問道傳人……噬道天教,未曾,真正,消亡。它,潛藏於這天地的最深處,已,悄然,復甦。】\n【欲破噬道,唯有,重興問道。踏元嬰、破化神、證大道……集齊,散落於天地的,問道信物,重鑄,問道道統。】\n【方能,與那噬道天教,一決……生死。】\n\n墨飛緩緩睜開眼，那雙眸子深處，星河激盪，是前所未有的,凝重,與,燃燒著的,使命。\n\n「重興問道，對抗噬道。」他一字一頓，望向那,更廣闊、也更凶險的,天地深處，\n\n「這，便是,我這問道傳人，此生，註定的,道。」\n\n——\n\n墨飛,養傷三日,方才,痊癒。\n\n而這三日，論道大會，也,落下了帷幕。\n\n因藏道閣一役，墨飛,力抗反問道、奪回聖物，其「問道傳人」之名，早已，響徹天南。雖因受傷,未能,再戰,他,仍以,連勝十餘輪、殺入八強的戰績，並,守護聖物的,大功，被,列為,這一屆論道大會，最耀眼的,天驕之一。\n\n論道結束後，數位,諸聖地的,化神老怪，竟,親自，尋上門來，欲收,墨飛,為徒。\n\n「小友,以問道之姿,力壓群雄,又心繫道統,老夫,甚是欣賞。」一位,道骨仙風的化神老者，語重心長，「不若,入我聖地,老夫,親自,傳你,大道?」\n\n這等,機緣,足以，讓天南,任何一個天驕,趨之若鶩。\n\n可墨飛，卻，一一，婉拒了。\n\n「多謝諸位前輩,厚愛。」他鄭重拱手，「只是,晚輩,身負,問道一脈的傳承與使命，此生,註定,要重興問道、對抗噬道。這條路，晚輩,只能,自己,走。」\n\n「何況,」他望向凌霜，眼神,轉柔，「晚輩的根,在問劍宗。」\n\n那幾位化神老怪，聞言，非但沒有,不悅，反而，對墨飛，更添了幾分,讚許。這份,不為機緣所動、守護道統的,道心，比,任何,天縱之資，都更為,難得。\n\n「好一個,問道傳人。」那道骨仙風的老者,撫須而笑，「也罷。他日,你若,需要,對抗噬道天教,我等聖地，願,助你一臂之力。噬道天教,禍亂天地,乃是,我等,共同之敵。」\n\n有了諸聖地,這一句,承諾，墨飛,重興問道的路上，便,多了幾分,底氣。\n\n——\n\n赴會的隊伍，啟程,返回問劍宗。\n\n靈舟之上，墨飛立於舟頭，望著那,腳下掠過的,廣袤天南，心潮，起伏。\n\n這一趟論道大會，他,收穫良多——揚名天南、奪回問道信物、揭開噬道天教的驚天陰謀、得諸聖地相助之諾。可他也,清楚地，看見了，那橫亙於前的,滔天巨浪。\n\n噬道天教，一個,覆滅了問道一脈、潛藏了萬古、如今,悄然,復甦的,龐大邪教。而洛家，只怕,早已,與這噬道天教,勾結，成了,那邪教,伸向天南的,一枚,棋子。\n\n「墨淵,戰力五千,元嬰後期。」墨飛心中，飛快地，盤算，「而這,還只是噬道天教的,一名,護法。他們真正的,底蘊,只怕，深不可測。」\n\n「我,金丹圓滿,戰力三千六。」他握了握拳，眸光，一凝，「太弱了。」\n\n「欲破噬道，欲重興問道，欲護住,我想護的人——」他望向凌霜，又望向那,青石鎮的,遙遠方向，眸中，燃起，熊熊的,決意，\n\n「我,必須，儘快，踏入,元嬰。」\n\n「元嬰,化神,乃至,更高之境……」他一字一頓，「這問道一脈,先賢們,未曾走完的路，我,要,一步一步，親手，走下去。」\n\n「直到，強到,足以，與那噬道天教，正面,一決,生死。」\n\n靈舟破空，載著一位,新生的問道傳人，與他那,才剛剛,揭開序幕的,問道與噬道的,萬古之爭，朝著,問劍宗的方向，疾馳,而去。\n\n而墨飛還不知道，就在他,揚名天南、揭開噬道天教陰謀之際，那,遙遠的,青石鎮，那,將他,養大成人的,跛腳老鎮醫程伯的身上，一樁，塵封了,數十年的,驚天秘辛，也，正,因這天地間,問道與噬道的,風雲再起，而，悄然，浮出,水面。\n\n一封，來自青石鎮的、染著,淡淡血跡的,傳訊，正，穿越,千山萬水，朝著,問劍宗的墨飛，飛,來。"}, {"t": "第三十九章 血訊", "c": "問劍宗，問劍崖。\n\n墨飛歸來後，本欲，立刻閉關，衝擊元嬰。可就在他，剛剛，靜下心神之際——\n\n一枚，染著,淡淡血跡的、樣式古樸的傳訊玉符，穿越了千山萬水，帶著一絲，微弱到,幾乎斷絕的靈力，落入了,他的手中。\n\n墨飛的心，猛地，一沉。\n\n這玉符的樣式，他認得——那是，程伯,壓箱底的物件之一，是,他離開青石鎮時，程伯，悄悄，塞給他的，說是,「危急時,可傳個訊」。\n\n而此刻，這玉符之上，那,淡淡的血跡,那,微弱得,幾乎斷絕的靈力……\n\n墨飛的手，微微，顫抖起來。他,迫不及待地，將神識，探入玉符。\n\n一段，斷斷續續、夾雜著,劇烈打鬥聲的,蒼老話語，傳入了他的識海——\n\n「墨飛……青石鎮……有,噬道天教的人……來了……」\n\n「他們……是衝著,問道一脈……衝著,你……來的……」\n\n「老頭子,攔不住……墨飛,莫要,回來……危險……你,身負,問道傳承,萬萬,不可,涉險……」\n\n「保重……去,重興,問道……」\n\n話音,在一陣,劇烈的爆響中，戛然,而止。\n\n玉符,那微弱的靈力，也，徹底，斷絕。\n\n「程伯——!」墨飛,豁然,起身，一顆心，如墜冰窟。\n\n青石鎮！噬道天教！程伯！\n\n那個將他,養大成人的、跛腳的老鎮醫;那個問道盤都看不透、身藏諸多秘辛的、待他,如親生子的老人——此刻,竟,為了,保護他、保護「問道」的秘密，正,獨自，面對著,噬道天教的,屠刀!\n\n「他們……是衝著問道一脈來的。」墨飛的腦中，念頭,飛轉，「程伯,一個,尋常的鎮醫,噬道天教,為何,要對他,下手?」\n\n「除非——」一個，他,一直,深埋於心底、卻,始終,不敢深想的,念頭，轟然，炸開，\n\n「除非，程伯……他,本就,與問道一脈,有關!」\n\n問道盤看不透他;他懂得,遠超一個鎮醫的,修行見識;他有,「遠超凡品」的納物袋;他,那句,意味深長的「以算證道」;他，這枚，能穿越千里、還帶著,防護靈力的,傳訊玉符……\n\n一條條，被墨飛,深埋於心底的,疑點，在這一刻，串聯了起來，齊齊，指向了，一個，他,從未,敢想的,真相——\n\n程伯，那個,青石鎮的,跛腳老鎮醫，絕非，一個,尋常的凡人!\n\n「程伯……你,到底,是誰?」墨飛,眼眶,發紅，「你,為我,隱藏了,多少?又,為我，背負了,多少?」\n\n可此刻，已容不得他，細想。\n\n「莫要回來」——程伯的最後一句叮囑，猶在耳邊。\n\n可墨飛，又,豈能,聽從?\n\n那,是將他,從一個,墜崖的廢材、一個,人人恥笑的搗藥少年，一手，養大成人的，唯一的,至親!\n\n「程伯,你為我,遮風擋雨十六年。」墨飛,眼中，是,焚天的,焦急與決意，「如今,你有難——」\n\n「我,豈能,棄你,於不顧!」\n\n「回去!」他一字一頓，斬釘截鐵，「就算,是龍潭虎穴,是,噬道天教的,滔天殺局——」\n\n「我墨飛，也定要，回,青石鎮!」\n\n——\n\n墨飛,即刻,尋了凌霜。\n\n凌霜聽罷,那清冷的臉上,也染上了,凝重的寒霜。\n\n「青石鎮,遠在,問劍宗,萬里之外。」她沉吟道，「噬道天教,既已,對你的故鄉,下手，這,分明,是,衝你而來的,殺局。他們,是想,以你至親為餌,引你,涉險。」\n\n「我知道。」墨飛的眼神，卻,無比,堅定，「可那是,程伯。是,養我十六年的,至親。這局，是明知的,火坑，我,也,必須,跳。」\n\n凌霜,靜靜地，望著他。那份，明知是餌、明知凶險，卻,為了至親，義無反顧的,決絕與赤誠，讓她那顆心，重重，一動。\n\n「好。」她,不再,勸阻，反而，眸中，燃起了,並肩的,決意，「我,陪你，一同,去。」\n\n「師姐——」\n\n「你護道統、護至親，」凌霜打斷他，一字一句，「我,護你。」\n\n「你我,早已,是,同路人。」她握住他的手，那向來清冷的眸子裡，是,滾燙的,並肩之志，「這一趟青石鎮,無論,是,噬道天教的,元嬰護法,還是,滔天的,殺局——」\n\n「你我,一同,面對。」\n\n墨飛望著凌霜那,盛滿決意與情意的眸子，心底，一片，滾燙。\n\n「多謝,師姐。」他,重重,握住她的手，不再多言。\n\n二人,即刻，向宗門，報備了,緣由。宗門,得知,墨飛,竟能,以問道之姿,對抗噬道天教，又念及他,守護聖物、揚名天南的,大功，當即,首肯，更,特許他二人，動用,宗門的,長途傳送大陣，直抵，青石鎮,鄰近的,城池。\n\n星夜。\n\n問劍宗傳送陣，白光,一閃。\n\n墨飛與凌霜的身影，消失於,問劍宗，朝著,那,萬里之外、正,籠罩於,噬道天教,陰影之下的,青石鎮，疾馳,而去。\n\n而墨飛的心中，除了,焚天的焦急，更,懸著，那個，即將,揭曉的、關於程伯、也關於他自己身世的，驚天,秘辛。\n\n——\n\n自傳送陣落腳的城池，到青石鎮，尚有,數百里之遙。\n\n墨飛與凌霜，御風而行，一路，疾馳。那焚天的焦急，讓墨飛，恨不得，生出雙翼。\n\n越是靠近青石鎮，那空氣中，便,越是，瀰漫著,一絲，令墨飛,心悸的,邪異氣息——那是，噬道天教的,「反問道」之韻!\n\n「他們，果然，還在。」墨飛的臉色，前所未有的凝重。\n\n半日之後，青石鎮，遙遙，在望。\n\n可眼前的景象，卻,讓墨飛的心，狠狠，一沉。\n\n那個,生養了他十六年的,寧靜小鎮，此刻，正,籠罩在,一片，詭異的、墨黑色的,死氣之中。鎮外的田野，草木枯萎;鎮口那棵,他,測靈石失敗、被人恥笑的,老槐樹，早已，枯死;而那,平日裡,炊煙嫋嫋、人聲鼎沸的,街巷，此刻，卻，死一般的，沉寂。\n\n「噬道天教,以邪法,封了整座鎮子。」凌霜眸光森然，「這死氣之下，鎮民……」\n\n「還活著。」墨飛的「觀道」，已探明,鎮中情形，「他們,被那死氣,困住、鎮壓,神魂,卻,尚存。噬道天教,並未,屠戮鎮民——」\n\n「他們,要的,是活口。」墨飛一字一句，眼神,冰寒，「是,以整座青石鎮的,鎮民為質，以,程伯為餌——」\n\n「引我,入局。」\n\n這是一個，堂堂正正、又,惡毒至極的,陽謀。噬道天教，料定,他這問道傳人，絕不會，棄故鄉,至親,於不顧。他們，就在,這青石鎮，布下了,天羅地網，等著,他,自投羅網。\n\n「師姐，」墨飛沉聲道，「這鎮中，必有,噬道天教的,埋伏。甚至，那元嬰後期的,墨淵，都,可能，在此。」\n\n「我知道。」凌霜握緊了手中的劍訣，那清冷的眸中，是,並肩的,決絕，「可你我,已無退路。」\n\n「程伯,還在鎮中。」墨飛望向那,死氣沉沉的青石鎮，眸中,焦急與戰意,交織，「無論,前方,是何等,滔天的殺局——」\n\n「我,都要，闖進去。」\n\n他不再遲疑，握緊斷刀，一步，踏入了，那,籠罩著,墨黑死氣的,青石鎮。\n\n熟悉的街巷，此刻，寂靜得，令人心悸。墨飛循著記憶，也循著那,程伯氣息,最後,殘留的方向，一步，一步，朝著,鎮中,那間,他,生活了十六年的,「濟生堂」，走去。\n\n濟生堂的木門，緊閉著，門上，還殘留著,劇烈打鬥的,痕跡與,幾道,焦黑的,邪異印記。\n\n墨飛的心，提到了嗓子眼。\n\n「程伯……」他,一步,上前，顫抖著，推開了，那扇,熟悉的,木門。\n\n門內，藥香依舊，卻,混雜著，一絲，濃重的,血腥。\n\n而在那，藥碾子旁，一道，蒼老而佝僂的、渾身浴血的身影，正,倚著牆壁，緩緩，抬起頭來，望向,門口的墨飛。\n\n正是，程伯。\n\n「臭小子……」老人,望著門口的墨飛，那渾濁的老眼裡，是,又驚,又怒,又,說不出的,複雜與慈愛，「不是,叫你……莫要,回來麼……」\n\n墨飛望著那,渾身浴血、氣息奄奄的老人，眼眶，瞬間，紅了。\n\n「程伯!」他,一個箭步，衝了上去。"}, {"t": "第四十章 遺孤", "c": "墨飛,一把,扶住,那渾身浴血的老人。\n\n他慌忙,取出療傷靈丹，又運轉問道盤，探查程伯的傷勢——那一探之下，墨飛的心，沉到了谷底。\n\n程伯的傷，太重了。他的道基,已被那噬道邪法，侵蝕、崩毀;那一縷縷邪異的黑氣，正,順著他的經脈，一點一點，噬食著他的生機與神魂。\n\n尋常療傷之法，根本，無濟於事。\n\n「別忙活了，臭小子。」程伯,卻,虛弱地,擺了擺手，唇角，溢著,血,卻,笑了笑，「老頭子,這身子……早,不成了。」\n\n「程伯,你別說話!」墨飛,眼眶,發紅，「我以問道之法,替你,化去這邪氣——你,撐住!」\n\n「化不掉的。」程伯,搖搖頭，那渾濁的老眼裡，是,一片,了然的,平靜，「這噬道天教的邪法，最是,歹毒。老頭子,這條命，早在,他們破門而入時，便，註定了。」\n\n「老頭子,是,強撐著,這一口氣——」他,望著墨飛，那目光裡，是,滔天的，慈愛與，不捨，「在,等你,回來。」\n\n「有些話，」他,喘息著，一字一句，「老頭子，得,親口，告訴你。」\n\n墨飛,再也,忍不住，淚水，奪眶而出:「程伯……」\n\n「臭小子，別哭。」程伯,伸出,顫抖的、枯瘦的手，替他,拭去,眼角的淚，一如,他幼年時,那般，「聽,老頭子，說。」\n\n「你,一直,好奇，老頭子，是誰,對麼?」\n\n墨飛,重重,點頭。\n\n程伯,望著,濟生堂那,熟悉的,藥香與陳設，眼神，悠遠，彷彿,穿透了,數十年的,歲月——\n\n「老頭子，本名,程守拙。」他緩緩道，「數十年前……是,問道一脈,最後的,守護者之一。」\n\n墨飛,渾身一震,如遭雷擊:「問道一脈?!程伯,你,竟是……」\n\n「當年，問道一脈,被噬道天教,傾覆、屠戮，幾近,滅絕。」程伯的聲音，帶著,萬古的,滄桑與,悲愴，「我等，少數,倖存的守護者，帶著,道統的,火種，四散,潛逃，只為,替問道一脈，留一線,復興的,生機。」\n\n「而那,最珍貴的,火種——」他,望向墨飛，那目光裡，是,無盡的,溫柔，「便是,一個,尚在襁褓中的,問道一脈的,血脈遺孤。」\n\n墨飛的呼吸，驟然，停滯。\n\n「那個,遺孤……」他,聲音,顫抖，「是……」\n\n「是你,墨飛。」程伯,一字一句，「你,是,問道一脈,最後的,血脈。是,問道一脈,傾覆之時，被,拚死,搶救出來的，唯一的，希望。」\n\n轟!\n\n墨飛的腦中，一片,轟鳴。\n\n原來如此!原來如此!\n\n他一直以為，那方問道盤，是他,墜崖之時，偶然,得到的,機緣。卻不想——他,本就是,問道一脈的,血脈遺孤!那問道盤，會,認他為主、會,為他,而解封,傳承——並非偶然，而是,血脈的,呼喚，是,道統的,傳承，冥冥之中，早已,註定!\n\n「當年，」程伯繼續道，「為了,將你,藏好,不被噬道天教,追殺,我,自毀,大半修為，隱去,一身,氣息,扮作,一個,尋常的,跛腳鎮醫，將你，帶到,這偏遠的,青石鎮，隱姓埋名，將你，養大。」\n\n「我,不敢,教你修行，怕,那一絲,問道的氣息，引來,噬道天教的,追殺。」老人,眼中，含淚，「我,只能，眼睜睜地，看著你，被那測靈石，判為『廢根』，被,全鎮,恥笑……」\n\n「臭小子，你,不知道，」程伯,老淚縱橫，「你,每受一分,委屈，老頭子這心裡，便，痛,一分啊……」\n\n墨飛,早已，泣不成聲。他,終於，明白了——程伯那,一次次,深沉而複雜的,目光;那句,「不是無緣，是無人替你點那盞燈」;那,悄悄塞給他的,納物袋;那句,「以算證道」的,了然……\n\n原來，這老人，為了,守護他，守護問道一脈的,最後火種，隱姓埋名，自毀修為，默默，背負了,數十年!\n\n「程伯……」墨飛，握住老人那,枯瘦冰涼的手，「你為何，從不曾，告訴我……」\n\n「怕,你,涉險。」程伯,虛弱地,笑了笑，「怕,你,揹上,這,滔天的,血仇與,重擔。老頭子,只盼,你,能,平平安安地，過完,這一生……」\n\n「可,天意弄人。」他,望向墨飛,那,已然,承接了道統、氣度不凡的模樣，眼中，是,欣慰，是,驕傲，也是，無盡的,不捨，「你,終究，還是，走上了,這條路。你,終究，還是,那,問道一脈的，麒麟兒……」\n\n「程伯，」墨飛,含淚，一字一句，斬釘截鐵，「我承下了,問道傳承。我,定會,重興,問道，親手，覆滅那,噬道天教，為,問道一脈的,萬千先賢——」\n\n「討回,公道!」\n\n程伯,望著他，那渾濁的老眼裡，最後的,光芒，燃燒得，格外，明亮:\n\n「好……好……」他,喃喃，「問道一脈……後繼,有人……我,程守拙……縱死……」\n\n「也，可以，去見，列位,先賢了……」\n\n就在此時——\n\n濟生堂之外，那,墨黑的死氣，驟然，翻湧!一股，令墨飛,靈魂,都為之,戰慄的,恐怖威壓，鋪天蓋地，鎮壓,而來!\n\n一道，森然而,陰冷的聲音，自門外，響起——\n\n「問道餘孽，果然，如約，回來了。」\n\n「墨淵，在此，恭候,多時了。」\n\n——\n\n墨淵，那反問道的元嬰後期護法，一步，踏入了，濟生堂那,狹小的院落。\n\n他一身，滔天的邪異之力，將整座濟生堂，都籠罩在，一片，死亡的,威壓之下。他那雙,淬滿邪異的眼睛，掃過墨飛，掃過那,氣息奄奄的程守拙，唇角，勾起一抹，殘忍的,冷笑。\n\n「程守拙，問道一脈,最後的守護者。」墨淵,森然道，「我教，找了你,數十年。卻不想,你,竟躲在,這等,鳥不拉屎的小鎮,裝了,數十年的,鎮醫。」\n\n「若非,這問道餘孽,揚名天南、暴露了行蹤，我教,又豈能,順藤摸瓜，尋到,你這,老不死的?」\n\n他望向墨飛，眼中，凶光，滔天:「墨飛。今日，我便，在此，將你這,問道一脈,最後的,血脈與,守護者——」\n\n「一併，斬草除根!讓你們,問道一脈，徹底，從這天地間,湮滅!」\n\n戰力五千的元嬰後期大能，那毀天滅地的威壓，鎮壓而下。墨飛與凌霜聯手，也不過,四千餘的戰力，在這,絕對的,實力面前，脆弱得，如同,螻蟻。\n\n墨飛,將重傷的程伯,護在身後，斷刀,橫於身前，那雙,含淚的眸子裡，是,焚天的,悲憤與，決絕。\n\n「墨淵！」他嘶聲道，「噬道天教，覆滅問道一脈，禍亂天地。這筆血債——」\n\n「今日，你,休想，再,添一筆!」\n\n「就憑你?」墨淵,放聲,狂笑，「一個,金丹圓滿的,螞蟻，也敢，在,老夫面前，猖狂?」\n\n他,一掌，攜著,滔天的邪異之力，朝著墨飛，轟然，拍落!\n\n那一掌之下，天地失色，濟生堂,那,承載了墨飛,十六年記憶的,老屋，轟然，崩塌!\n\n千鈞一髮之際——\n\n「臭小子……讓開!」\n\n一直,氣息奄奄的程守拙，竟,在這一刻，猛地，爆發出，他,生命中，最後的,一絲,力量!\n\n他,自毀了,那,苟延殘喘的,道基，將畢生,僅存的,修為與,神魂，盡數，燃燒!那一瞬，這位,問道一脈,最後的守護者，佝僂的身軀，竟,爆發出，一縷,微弱,卻,無比,純粹的,問道之光!\n\n他，撲在墨飛身前，以那,燃燒生命,凝成的,問道之光，硬生生，擋下了，墨淵那,毀滅性的,一掌!\n\n轟隆！\n\n「程伯——!」墨飛,撕心裂肺地，嘶吼。\n\n煙塵散去。程守拙,那燃燒了,生命最後一絲力量的,身軀，已然，倒在,血泊之中，氣息，徹底，斷絕。\n\n可他的唇角,卻,帶著,一絲，安詳的,笑意;他那渾濁的老眼，望著,身後的墨飛，彷彿，在說——\n\n「去吧……問道一脈的,麒麟兒……」\n\n「莫要,回頭……」\n\n程守拙，這位，隱姓埋名數十年、以生命,守護了,問道最後火種的,老人，用他,燃燒殆盡的,最後一縷生命，為墨飛，擋下了,那,必死的一擊，也，為他，換來了，一線，反擊的，生機。\n\n墨飛，跪在程伯的身旁，望著那，安詳而,冰冷的,面容，只覺得，天崩地裂，五內俱焚。\n\n那個，將他,養大成人的,至親;那個,為他,背負了,數十年,秘辛與,重擔的,老人;那個,在他,被全鎮恥笑時,唯一,相信他的,程伯——\n\n就這樣，為了他，永遠地，走了。\n\n無盡的,悲痛,與,滔天的,恨意，如,火山般，在墨飛的,胸中，轟然，噴發!\n\n「程伯……」他,渾身,顫抖，淚如雨下，那雙眸子，卻，在這,焚天的悲憤之中，漸漸，燃起了，一種,前所未有的、璀璨到,極致的,光芒!\n\n他的道心，在這，生離死別的,極致淬鍊之下，轟然，昇華!\n\n丹田之中，那枚,九品圓滿的道韻金丹，被,這滔天的悲憤與,昇華的道心，猛地，一激，竟，發出了，一陣，衝擊元嬰的、清越的,鳴響!\n\n墨淵，望著那,跪地不起、周身,卻,道韻暴漲的墨飛，眼中，閃過一絲，訝異:「怎麼?你這螞蟻，被,嚇傻了?還是……」\n\n他的話，戛然而止。\n\n因為他,分明，感應到——那個,跪在地上的少年，那,原本,金丹圓滿的氣息，此刻，竟，正以，一種，驚人的速度，瘋狂,攀升、蛻變!\n\n「不……不可能!」墨淵,駭然，「你,竟要，在此刻——」\n\n「衝擊，元嬰?!」"}, {"t": "第四十一章 問道元嬰", "c": "衝擊元嬰，本是,水磨工夫，需,萬全準備、天時地利，稍有,不慎，便是,道基崩毀、身死道消的,下場。\n\n可墨飛的這一次突破，卻，是在,至親隕落的,悲憤之中，是在,強敵環伺的,絕境之下，是在，道心,轟然昇華的，那一剎那，水到渠成、勢不可擋!\n\n程伯之死，是,墨飛此生，最痛的,一道傷。可也正是這道傷，這場,生離死別的,極致淬鍊，讓墨飛，對「道」的體悟，對「問道」的執念，昇華到了，一個，前所未有的,境界。\n\n他終於，徹底,明白了——他為何而修。\n\n不是為了力，不是為了,揚名。是,為了,守護。是,為了，那,問道一脈,萬千先賢的,遺澤;是,為了,程伯,用生命,守護的,火種;是,為了,重興問道、對抗噬道，還這天地，一個,朗朗的,乾坤!\n\n以,守護為心;以,問道為道。\n\n這，便是,他墨飛的，元嬰之道!\n\n丹田之中，那枚九品圓滿的道韻金丹，在這昇華道心的催動下，轟然，破碎!碎裂的金丹之力，與那，磅礴的真元、與那，承自道統的,問道之韻，重新，凝聚、蛻變——\n\n一尊，通體流轉著,六色道韻、眉心,綻放著,一縷,問道之光的,元嬰虛影，於墨飛的,識海之巔，緩緩，凝聚，成形!\n\n【墨飛│元嬰一層│問道元嬰(特殊)！】\n【道基蛻變:金丹化嬰。以「守護」為心,以「問道」為道。】\n【氣血、法力、神識、壽元……全面暴漲！】\n【戰力 3600 → 8000！】\n【〔此問道元嬰,承問道道統、歷生死昇華而成,契合宿主證道之路,潛力……直指大道〕】\n\n元嬰一層！戰力，一舉，突破八千！\n\n那一瞬，墨飛周身，六色道韻,沖天而起!整座青石鎮上空,那,籠罩已久的,墨黑死氣，竟,被那,浩瀚的問道之光，逼退、驅散!天光，重新，灑落。\n\n墨飛，緩緩，起身。\n\n他,身上，還帶著,程伯的血;他的眼中，還含著,未乾的淚。可此刻的他，那氣息，那氣度，已然,脫胎換骨——由,一個,金丹修士，蛻變為，一位，真正的，元嬰大能!\n\n而更重要的是，他那雙,承接了問道道統的眼睛，在元嬰之力的加持下，那「觀道」「推衍」「道眼」的權能,更是,清明、深邃了,數倍!\n\n墨淵，望著那，破境而出、戰力,直逼於他的墨飛，那張,森然的臉上，第一次，露出了,難以置信的,駭然:\n\n「元嬰……你,竟真的,在,絕境之中,破了元嬰?!還是,這等,恐怖的,問道元嬰?!」\n\n「戰力八千……」他,倒吸一口涼氣，「你,一個,剛破境的元嬰一層，戰力，竟,追平了我這,元嬰後期?!」\n\n「墨淵。」墨飛,緩緩,抬眸，那雙,含淚的眸子裡，此刻，是,焚天的,恨意，與,問道傳人的,凜然,殺意，「程伯的血債。」\n\n「今日——」他,一字一頓，握緊了斷刀，那斷刀之上，六色道韻與,問道之光，交相輝映，鋒銳，直指蒼穹，\n\n「該，你,償還了!」\n\n——\n\n問道元嬰的墨飛，與那反問道護法墨淵，於這，青石鎮的,廢墟之上，展開了，一場，天崩地裂的,搏殺!\n\n戰力，雖已相近。可墨淵，畢竟，是,元嬰後期的,老牌大能，經驗、底蘊，皆遠勝墨飛。\n\n然而——墨飛，有問道盤。有《問道錄》。有那，剋制「反問道」的，問道正道之力。更有，那，為程伯復仇的，焚天決意!\n\n墨淵那,詭異陰毒的「反問道」邪法，在墨飛,昇華後的「觀道」之下，破綻,盡顯;那,毀道噬道的黑氣，被墨飛,那,浩瀚的問道之光與,《太一光明經》的純陽正道，一次次，消融、克制!\n\n而墨飛,那,承問道至理的,一套配置，配合,元嬰之力，更是，威能,滔天。他以「推衍」之能，將墨淵的每一招，都算到,毫釐;以問道之算，將墨淵，那,老辣的經驗與底蘊，一分一分，抵銷、化解!\n\n二人，鬥得，難解難分。青石鎮的廢墟，在二人,滔天的威能之下，被，夷為，平地。\n\n凌霜，亦在一旁，尋隙,以那,化煞為劍、更上層樓的,絕世劍道，助墨飛，一臂之力。\n\n一人問道之算，一人劍道之絕，聯手，將那，元嬰後期的墨淵，竟，死死,壓制!\n\n「怎麼可能……」墨淵,又驚,又怒,又,漸生,懼意，「我,堂堂,元嬰後期,反問道護法，竟,被,一個,剛破境的問道小子,與,一個,築基丫頭，壓著,打?!」\n\n他,終於，明白，為何,教中，會,如此,忌憚,問道一脈。這「問道」之道，簡直，便是,他們「反問道」的，天生剋星!\n\n「墨淵!」墨飛,抓住,墨淵,一招,舊力用盡的,破綻，一記,凝聚了,元嬰真元、問道至理、與，滔天恨意的,《裂石訣》，破開墨淵的護體，狠狠，洞穿了，他的,肩頭!\n\n「啊——!」墨淵,慘嘶一聲，一身邪異真元,潰散大半，踉蹌，跌退。\n\n墨飛，欺身,而上，斷刀，直取，墨淵,咽喉，勢要，為程伯，報,這血海深仇!\n\n——\n\n墨淵，重傷之下，自知,再難匹敵。\n\n「今日,栽了……」他,眼中，凶光與,狠戾，交織，「可你,別得意,問道餘孽!」\n\n他，不惜,再次，自損修為，施展那,詭異的「血遁」邪術，化作一道,狼狽的血光，亡命,遁逃。臨去前，那,淬滿了怨毒與,忌憚的聲音，迴盪在青石鎮的廢墟之上：\n\n「我教教主,早已,注意到了你!問道復興?哼!在,我噬道天教,傾天之勢面前——」\n\n「你這,螻蟻之火，遲早，會被,徹底，撲滅!你,等著!」\n\n墨飛欲追，卻,終究，被那,血遁之術，遁走。他,金丹圓滿破元嬰,不過,片刻，元嬰之力，尚未,徹底,穩固，強行追殺一位,元嬰後期的老怪，反而,凶險。\n\n「跑得了,一時。」墨飛,望著墨淵遁逃的方向，眸中，寒光凜冽，「跑不了,一世。」\n\n「程伯的血債，噬道天教,覆滅問道一脈的血仇——」他,一字一頓，「我墨飛,記,下了。」\n\n墨淵一逃，那籠罩青石鎮的,墨黑死氣，也,隨之,潰散。被困的鎮民，紛紛，甦醒，雖，驚魂未定，卻，皆，保住了性命。\n\n而墨飛，卻，再顧不得，這些。\n\n他,緩緩，走回,那,濟生堂的廢墟,走到,程伯,那,冰冷的,身軀旁，緩緩，跪下。\n\n「程伯……」\n\n這位，將他，從一個,墜崖廢材，養育成人的,至親;這位，隱姓埋名數十年、以生命，守護了,問道最後火種的,老人——終究，還是，為了他，永遠地，閉上了,眼。\n\n墨飛,伏在程伯身旁，這位,力抗元嬰大能、破境元嬰的,問道傳人，此刻，卻，哭得，像個，尋常的，失去了至親的，孩子。\n\n十六年的養育之恩，數十年的,守護之情，還有那,尚未,來得及，說出口的,一聲,「謝謝」——都，隨著，這位,老人的,離去，化作了，墨飛心底，永遠的，痛。\n\n——\n\n墨飛，與凌霜，將程守拙，安葬於，青石鎮後山，那,他,墜崖得盤、命運,自此,轉折的，山腳之下。\n\n墓碑之上，墨飛，親手，刻下——\n\n「先師　程守拙　之墓」\n\n「問道守護者，長眠於此。」\n\n葬禮之後，墨飛，立於墓前，久久，佇立。青石鎮的鎮民，得知,是這位,曾被他們,恥笑的「廢根」墨飛，救了,他們，救了,整座鎮子，皆，跪伏於地，感激涕零。\n\n而墨飛，卻，只是，望著那，方,新立的,墓碑，眼神，一片，堅定,而,深沉。\n\n「程伯，」他，一字一句，聲音，雖輕，卻，重逾千鈞，「你以生命，守護的，問道火種，我，接住了。」\n\n「你，未竟的,心願，你,背負的,血仇——」\n\n「我，墨飛，會，替你，也替，問道一脈的，萬千先賢，一一，了結。」\n\n「噬道天教,教主……」他，望向那，天地深處，那，潛藏著,滔天邪教的,方向，眸中，星河與,恨意，交織，燃燒，\n\n「你既,注意到了我——」\n\n「那便,好好,記著,我這個名字。」\n\n「墨飛。」他，一字一頓，那是，一個，問道傳人，向,湮沒萬古的,邪教，發出的，正式的，宣戰，\n\n「問道一脈，最後的血脈。也是——」\n\n「將,親手，覆滅,你噬道天教的,那個人。」\n\n山風,獵獵，吹動,墨飛的,衣袂。\n\n一個問道傳人的,復仇與使命，一場，橫跨萬古、關乎道統存亡的，問道與噬道的,終極之戰——\n\n自程伯,這一方，青石鎮後山的,墓碑之前，正式，拉開了，序幕。\n\n而墨飛,知道，前路，縱有,萬般,凶險，縱有,噬道天教,那,深不可測的,滔天底蘊——\n\n他，已,再無,退路。\n\n唯有，一路，向前。一路，變強。\n\n直到，將這問道一脈,先賢們,未曾,走完的路，走到，那，能與噬道天教，一決生死的，巔峰。"}, {"t": "第四十二章 歸宗", "c": "墨飛與凌霜，安頓好青石鎮的鎮民，便，返回了問劍宗。\n\n墨飛歸來之時，已非，昔日,那個,金丹圓滿的天驕。他,一身,問道元嬰的氣息，深不可測，戰力，直逼,元嬰後期。整個問劍宗，為之，震動。\n\n而他帶回的消息，更是，讓宗門，上下,凜然——\n\n噬道天教，一個,覆滅了問道一脈、潛藏萬古、如今,悄然,復甦的,龐大邪教。他們，煉幽冥墟、盜藏道閣、暗殺長老、更，屠戮了，墨飛的故鄉青石鎮，殺害了，隱姓埋名的,問道守護者程守拙。\n\n而煉器世家洛家，早已，與這噬道天教，暗中,勾結，成了，那邪教，伸向天南的,一枚,棋子!\n\n問劍宗掌門，那位，深居簡出的化神大能，聞訊，勃然大怒。他,立刻，聯合天南,幾位，曾與墨飛,有過一面之緣、允諾相助的,聖地大能，對洛家，展開了，雷霆,清算!\n\n洛家，這，與噬道天教勾結、禍亂天南的,煉器世家，在,諸聖地與問劍宗的,聯手,問罪之下，樹倒猢猻散。洛天罡，這,墨飛的,老對頭，見大勢已去，不敢,再留，竟,拋下,家族，投奔了，噬道天教，亡命，遁逃。而那,被廢修為的,洛雲軒，則,在洛家傾覆的,混亂中，不知,所蹤。\n\n一個，曾,不可一世的,煉器世家，就此，煙消雲散。\n\n「洛家……」墨飛，望著那，傳來的，消息，眸中，並無,多少，快意，「不過，是,噬道天教的，一枚,棄子。」\n\n「真正的,元兇，」他,眸光，一凝，「是,那，潛藏於，天地最深處的，噬道天教,教主。」\n\n——\n\n洛家傾覆之後，墨飛，在問劍宗的地位，達到了，前所未有的,巔峰。\n\n問道元嬰、力抗噬道護法、揭發噬道陰謀、更是,問道一脈,唯一的血脈傳人——他，早已，超越了，「天驕」的範疇，成了，問劍宗,乃至,整個天南，對抗噬道天教的,一面，旗幟。\n\n問劍宗掌門，親自，將他，召入,主峰，以,平輩之禮，相待。\n\n「墨飛，」那位，鶴髮童顏的化神掌門，鄭重道，「噬道天教,禍亂天地,乃是,我輩修士,共同之敵。而你，身負問道傳承，是,剋制,那邪教邪法的,關鍵。」\n\n「日後,對抗噬道，我問劍宗，乃至,天南諸聖地，皆，願,以你,馬首是瞻。」\n\n墨飛，鄭重，拱手:「晚輩，義不容辭。」\n\n他,承接了問道道統，便,註定，要,扛起，這,重興問道、對抗噬道的,大旗。這，是,程伯用生命,託付的,使命，也是，他此生，無可推卸的,道。\n\n「只是，」墨飛，話鋒一轉，神色，凝重，「噬道天教,潛藏萬古，底蘊,深不可測。那墨淵，不過，是,一名護法，戰力，便,已五千。其教中，元嬰、化神,大能，只怕，不知,凡幾。」\n\n「以我等,如今的,實力——」他，一字一句，「還,遠遠，不足，與之，正面，抗衡。」\n\n「當務之急，」墨飛，眸光，深邃，「是，儘快，變強;是，尋回，那，散落於天地的，其餘,問道信物，重鑄，問道道統;是，聯合，天南諸聖地，共禦，噬道。」\n\n掌門，聞言，深深，頷首:「你，思慮，周全。此事，便,依你。宗門，會,全力，助你。」\n\n——\n\n自主峰,歸來，墨飛，於問劍崖，閉關，鞏固元嬰。\n\n凌霜，守在,崖外。\n\n當墨飛，出關之時，那,問道元嬰，已然，圓融、穩固。他的戰力，在,元嬰之力,徹底,穩定之後，更是，攀升至了——戰力,近萬!\n\n「墨飛。」凌霜，迎上前來，那雙，向來清冷的眸子裡，是,揪心過後的,溫柔，「程伯的事……你,節哀。」\n\n墨飛,望著她，那,盛滿了,關切與,情意的眸子，心底，那道，因程伯而生的,傷痛，似乎，也,被，撫慰了,幾分。\n\n「多謝師姐。」他,輕聲道，「這一路，若非有你，一同,面對……」\n\n「你我之間，」凌霜，打斷他，那清冷的臉上，綻開一抹，柔和而堅定的笑意，「不必言謝。」\n\n「重興問道，對抗噬道——」她，握住他的手，一字一句，「這條路，無論，多長，多險，我，都,陪你，一同，走到,盡頭。」\n\n墨飛，回握住她的手，那雙,星河流轉的眸子裡，是,前所未有的,篤定與,溫柔:\n\n「好。」\n\n一場，橫跨萬古的，問道與噬道之爭;一段，並肩而行的,情深意重。\n\n在這，程伯隕落、問道復興的，風雨之中，墨飛與凌霜，將，彼此的,命運與道途，緊緊，交纏。\n\n而墨飛,知道，前路，那,滔天的,噬道之劫，才，剛剛，開始。\n\n他，必須，變得，更強。\n\n「元嬰,近萬。」他，望向,那,更高、更遠的，化神之境，眸中，戰意，熊熊，\n\n「還不夠。」\n\n「為了,程伯，為了,問道一脈的,萬千先賢，為了，護住,我想護的人——」\n\n「我，要，一路,向前，直到，那，能與噬道天教，教主，正面一決的，那一日。」\n\n——\n\n然而，墨飛想要,安穩,精進的願望，終究，落了空。\n\n洛家傾覆、墨淵重傷而歸，讓潛藏於暗的噬道天教,顏面盡失。而墨飛,這問道傳人的,異軍突起，更如同,一根,深深刺入,噬道天教心頭的,芒刺。\n\n那,一度，注意到墨飛的,噬道天教教主，終於，決定，不再，坐視。\n\n半月之後，一則，令整個天南,為之,震動的,消息，如驚雷般，傳來——\n\n噬道天教，糾集,教中大能，並，天南諸多，與之勾結的,魔道勢力，欲，大舉，進犯，天南!\n\n而他們的,第一個目標——\n\n正是，問道傳人墨飛，所在的，問劍宗!\n\n「他們，要，先,拔了問劍宗這面,對抗噬道的,旗幟。」墨飛,握緊了拳，眸光,森然，「更要，趁我,元嬰初成、根基未穩之際，將我這，問道傳人，扼殺於,搖籃!」\n\n問劍宗，上下，一片，凝重。\n\n噬道天教，籌謀萬古，底蘊深不可測。此番,傾巢而出，其鋒芒,之盛，縱是,問劍宗這等,天南大宗，也，感,泰山壓頂。\n\n「傳訊,諸聖地!」掌門，當機立斷，「噬道天教,禍亂天下，乃,我輩，共同之敵!此番，正是,聯合,諸聖地，共禦,噬道的,時候!」\n\n一封封,求援的傳訊，自問劍宗，飛向，天南各大,聖地。而那些，曾,允諾相助、又,深恨,噬道天教的,聖地大能，紛紛，響應。一時間，天南,正道，風雲，匯聚，一場，正邪,大戰的,陰雲，籠罩，天南。\n\n墨飛，立於問劍崖之巔，望著那，因，噬道來襲，而,嚴陣以待的,問劍宗，望著那，天南正道，匯聚的,滾滾,雲潮，眸中，星河激盪。\n\n程伯的血仇，問道一脈的,萬古之恨，與那,覆滅了問道的,噬道天教——\n\n終於，要，正面，交鋒了。\n\n「來得好。」墨飛，握緊了,那，六色道韻流轉的,斷刀，眼底，是，問道傳人，迎向,滔天邪教的,凜然,無懼，\n\n「噬道天教,你們,覆滅問道一脈，禍亂天地，逍遙,萬古。」\n\n「這一次——」他，望向那，天地深處，那，滾滾而來的,邪異氣息，一字一頓，\n\n「便，讓我，這，問道一脈,最後的血脈，親手，替,萬千先賢——」\n\n「向,你們，討回，這，萬古的，血債!」\n\n天南正道與噬道天教的，一場，驚天,大戰，一觸，即發。\n\n而墨飛，這問道傳人，已然，立於，這場，關乎道統存亡、天地正邪的,滔天棋局的,最,中央。"}, {"t": "第四十三章 兵臨", "c": "三日之後，噬道天教，兵臨，問劍宗。\n\n那是一支，令人，膽寒的,大軍。\n\n天際盡頭，滾滾的、墨黑色的死氣與邪雲，鋪天蓋地，湧來，將那,萬里晴空，都染成了，一片,詭異的,墨黑。邪雲之中，一道道，氣息，邪異而恐怖的,身影，若隱若現——那是，噬道天教,傾巢而出的,大能，與，天南諸多，投靠了噬道的,魔道邪修!\n\n其中，元嬰大能，數以十計;更有,幾道，深不可測、令人,靈魂,戰慄的,化神級,恐怖氣息，隱於，那,滔天邪雲的，最深處!\n\n「好,強大的,陣容。」墨飛立於問劍宗山門之巔，以「道眼」，掃過那,滾滾而來的,噬道大軍，眸光，凝重。\n\n好在，問劍宗，亦非，孤軍。\n\n三日之間，天南諸聖地，響應問劍宗之邀，紛紛，派來,精銳,馳援。此刻，問劍宗的山門之後，同樣，匯聚了，天南正道，滾滾的,雲潮——問劍宗的化神掌門、太上長老，諸聖地的,化神大能，並,無數，元嬰、金丹的,天驕修士，嚴陣，以待!\n\n正邪兩道，各自，滔天的,大軍，於這問劍宗的,萬里晴空之上，遙遙，對峙。一場，關乎，天南正邪、關乎，道統存亡的,滔天大戰，一觸，即發!\n\n墨黑的邪雲之中，一道，森然的聲音，響徹，天地——\n\n「問劍宗，交出，問道餘孽,墨飛，交出，問道信物!」\n\n「否則，我噬道天教，今日，便，血洗，問劍宗，讓你們，這天南正道，見識見識，我教，噬道之威!」\n\n那，出言之人，墨飛，認得。\n\n正是，那,重傷遁逃、又,再度歸來的,反問道護法，墨淵!此刻,他,傷勢已癒，戰力，恢復如初，更,隱隱，較,先前，更盛,幾分。而在他身後，那,幾道,化神級的恐怖氣息，更是，讓,問劍宗這方，諸多,大能，都，面色，凝重。\n\n問劍宗掌門，越眾而出，一身，化神威壓，浩瀚如淵，朗聲，回應:\n\n「噬道天教，覆滅道統，禍亂天地,乃,天地公敵!今日,爾等,兵臨我問劍宗,正好——」\n\n「我天南正道，便,與爾等，這,萬古邪祟，做一個，了斷!」\n\n「墨飛,絕不,能交!問道信物,絕不,能給!」\n\n雙方，再無,轉圜。\n\n「既如此——」墨淵那,森然的聲音，化作,一聲,滔天的,咆哮，「殺!」\n\n「屠盡,問劍宗!奪回,問道信物!噬盡,天南,一切,道統!」\n\n轟隆——!\n\n那滾滾的,墨黑邪雲，如,決堤的洪水，攜著，噬道天教,傾天的,邪異之力，朝著,問劍宗，鎮壓，而來!\n\n而問劍宗這方，天南正道的,滾滾雲潮，亦,轟然,迎上!\n\n一時間，天崩地裂，日月無光!元嬰、化神,大能，鬥作一團，滔天的,威能,餘波，將那,萬里晴空，攪得，天翻地覆!整座問劍宗的護山大陣，在，那，噬道大軍的,狂攻之下，靈光，暴閃，搖搖，欲墜!\n\n正邪，兩道，關乎,天南存亡的,滔天大戰，就此，於這，問劍宗的,萬里天穹之上，轟然，爆發!\n\n——\n\n墨飛，亦，投身於，這場，天崩地裂的,大戰之中。\n\n他，以問道元嬰、戰力近萬之姿，配合，那，剋制「反問道」邪法的,問道之道，於，那,噬道大軍之中，縱橫，捭闔!\n\n那些,元嬰、金丹的,噬道魔修，以「反問道」的,邪異之力,攻來，在墨飛的「觀道」之下，破綻,盡顯;那,毀道噬道的,黑氣，被墨飛,那,浩瀚的問道之光，一次次，消融、克制!\n\n他，如同,一柄，出鞘的問道之劍，所過之處，噬道魔修，紛紛，潰敗、隕落!他那,剋制邪法的,問道正道之力，更是，成了，這場,大戰之中，天南正道，最,鋒利的，一把,利刃!\n\n「問道之力……果然，是，我教邪法的,天敵!」噬道天教的魔修，見了墨飛，皆，膽寒，避退。\n\n而墨飛,那,問道傳人的，赫赫威名，也，在這，天崩地裂的,大戰之中，第一次，以，如此，耀眼的方式，響徹，天南!\n\n可墨飛，卻，並未,被這,一時的,順勢，沖昏頭腦。他那「推衍」之能，早已，敏銳地，捕捉到——\n\n這場,看似，正邪,勢均力敵的,大戰之下，噬道天教，那，真正的,殺招，那，隱於,邪雲最深處的,幾道,化神級,恐怖氣息，還，未曾，出手。\n\n「他們，在,等。」墨飛,眸光,一凝，「在,等,一個，一擊斃命的,時機。」\n\n「這場大戰，」他,望向那,滾滾的邪雲深處，眸中，寒光，凜冽，\n\n「真正的,凶險，還,沒有,到來。」\n\n——\n\n墨飛的預感，很快，應驗。\n\n激戰之中，噬道天教那，隱於邪雲最深處的,幾道,化神級恐怖氣息，之一，終於，出手了!\n\n那是一道，通體，纏繞著,無邊死氣、氣息，古老而恐怖的,黑袍身影。他，並未,理會,戰場上，那，鬥作一團的,大能，而是，以一種，詭異的、避開了所有正道大能耳目的方式，悄然，欺近了——問劍宗，那，維繫著整座護山大陣的,核心,陣樞!\n\n「不好!」墨飛,那「推衍」之能，第一時間，捕捉到了,這,致命的,異動，「他要,毀,護山大陣的,陣樞!」\n\n護山大陣，是問劍宗，抵禦噬道大軍的，最後,屏障。一旦，陣樞被毀，護山大陣，崩潰——那，滔天的噬道大軍，便，可,長驅直入，問劍宗，將，萬劫，不復!\n\n而那,偷襲陣樞的,黑袍化神，避開了，所有正道大能的,視線——唯有，墨飛,那,承接了問道道統的「道眼」與「推衍」，才，看穿了，他的,行蹤與,陰謀!\n\n「師姐!」墨飛,一聲,暴喝，傳音,凌霜，「護住,戰場!陣樞,有,化神偷襲，我,去!」\n\n他，不再,遲疑，身形，化作，一道，六色道韻的流光，避開,漫天的,恐怖餘波，直直，朝著，那，護山大陣的,陣樞，疾馳，而去!\n\n那，偷襲陣樞的,黑袍化神，見,竟有,一個,小小的,元嬰，識破了,他的行蹤、攔了上來，眼中，掠過一絲,訝異,與,不屑:\n\n「一個,元嬰螻蟻,也敢，壞我,教主,大計?」\n\n他，一掌，攜著,毀天滅地的,化神威壓，朝墨飛，隔空，拍落!\n\n那一掌之下，天地，為之，變色!墨飛只覺得，一股，遠比墨淵,還要,恐怖,十倍的,滔天威壓，鎮壓而下——那，是，化神大能，與，元嬰之間，那,不可逾越的，天塹!\n\n墨飛的問道盤，瘋狂運轉，卻，只推衍出，一片，冰冷的,絕望——【化神威壓,元嬰,難撼。正面對抗:必死。】\n\n千鈞一髮之際，墨飛，卻，沒有,退避。\n\n因為他,身後，便是,那，維繫著問劍宗,萬千生靈的,護山陣樞。他,一退，那陣樞，便,毀於一旦。\n\n「明知,不可為——」墨飛,握緊了,那，六色道韻的斷刀，眸中，燃起，焚天的,戰意，「可,有些東西，我,墨飛，退,不得!」\n\n他，將，問道元嬰的,全部力量、將，那,承自道統的,問道至理、將,一枚,珍藏已久的,護道底牌，盡數，凝於，那,迎向化神一掌的,一「算」之中!\n\n以，元嬰，撼，化神——這，是一場，比,青石鎮硬撼墨淵，更加，九死一生的，豪賭!\n\n轟隆——!\n\n那，化神的一掌，與墨飛，那，凝聚了問道至理的，拚死一擊，轟然，相撞!\n\n滔天的,餘波，將墨飛，狠狠，震飛，口噴鮮血，重傷,垂危!可他，卻，以，那，問道之算，將，那，化神一掌的,毀滅之力，堪堪，卸開、化解，護住了，身後，那，至關重要的，護山陣樞!\n\n「什麼?!」那,黑袍化神，駭然，「一個,元嬰，竟,擋下了,我,一掌?!」\n\n而墨飛，重傷，跌落，卻，死死地，護在，那，陣樞之前，抹了把,嘴角的血，眸中，戰意，不減反增:\n\n「陣樞……我，護住了。」\n\n「你們,噬道天教的,殺局——」他，喘息著，一字一頓，那雙,含著,焚天戰意的眸子，直直，迎上，那,黑袍化神，「今日，就，敗,在,這，一步之上!」\n\n因為，就在，墨飛，以命，擋下,這一掌，為，戰場，爭取到，那，寶貴的,一瞬之際——\n\n那被墨飛，傳音,示警的,凌霜，與，問劍宗的,化神太上長老，已然，察覺，此處的,異變，攜著，滔天的,劍光與,威壓，朝著，這，護山陣樞，疾,馳,而至!"}, {"t": "第四十四章 斬墨淵", "c": "那，偷襲陣樞的黑袍化神，見凌霜與問劍宗太上長老,已然,殺至，自知，陰謀,敗露，再難得手，狠狠，剜了墨飛一眼，竟，化作一道死氣，遁回了,那,滾滾的,邪雲之中。\n\n護山陣樞，保住了。\n\n墨飛,以，元嬰之軀，硬撼化神一掌、守住陣樞的,壯舉，經此一役，傳遍了，整個戰場。天南正道，士氣，大振;而噬道天教，那，欲，以偷襲陣樞，一擊制勝的,毒計，也，就此，破產!\n\n「墨飛,護道之功，當,記首位!」問劍宗太上長老，浩瀚的聲音，響徹戰場，為墨飛，療著傷，眼中,滿是,讚許。\n\n墨飛,服下靈丹，運轉問道元嬰,強行,將傷勢，壓下。他,望向,那，戰場之中，那道,森然的,反問道護法的身影——墨淵。\n\n「太上長老，」他,一字一頓，眸中，是,焚天的,恨意，「墨淵此獠，屠我故鄉，殺我至親程伯。此仇——」\n\n「晚輩,要,親手,了結。」\n\n太上長老，望著墨飛那,燃燒著,復仇之火、卻，又，清明,無比的眸子，深深，頷首:「去吧。老夫，為你,護法。」\n\n有化神太上長老，為他,壓陣,擋住,那，噬道其餘的,大能，墨飛，再無,後顧之憂。\n\n他，化作，一道，六色道韻的流光，直直，朝著，那，戰場之中，正,肆虐的,墨淵，疾馳，而去!\n\n「墨淵!」墨飛，一聲，暴喝，那斷刀之上，六色道韻與,滔天恨意，交相輝映!\n\n墨淵，回頭，見是墨飛，那森然的臉上，掠過一絲，忌憚，隨即，又，化作，狠戾的,冷笑:「問道餘孽?你這,元嬰,傷勢未癒，也敢，來,尋死?」\n\n「今日,正好——」他，周身，邪異真元，暴漲，「我便,將，你這,問道一脈，最後的血脈，徹底，抹殺!為，青石鎮那一戰，雪恥!」\n\n——\n\n墨飛與墨淵，這，兩個，湮沒了萬古的,問道與反問道的,宿敵，於，這，天崩地裂的,戰場之上，展開了，最終的,決戰!\n\n墨淵，元嬰後期，戰力,五千有餘;墨飛，元嬰一層,圓滿，戰力，近萬。\n\n論戰力，墨飛，已然，反超!\n\n而更重要的是——墨飛的「問道」，是墨淵那「反問道」邪法的，天生剋星!\n\n墨淵那,詭異陰毒的邪法，在墨飛，昇華後的「觀道」之下，破綻，盡顯;那,毀道噬道的黑氣，被墨飛，那，浩瀚的問道之光，與《太一光明經》的純陽正道，一次次，消融、克制!而墨飛,那，承問道至理的,一套配置，配合，近萬的,元嬰真元，更是，威能，滔天!\n\n一攻，一守，一算，一破。\n\n那，青石鎮一戰，尚能，將墨飛，逼入絕境的,墨淵，此刻，在，破境元嬰、戰力反超的墨飛面前，竟，被，死死，壓制，節節，敗退!\n\n「不可能……」墨淵，又驚,又怒,又,懼，「短短,月餘,你,竟,強大到,如斯地步?!」\n\n「因為,我,要，為，程伯，報仇。」墨飛,一邊，以問道之算，破開墨淵的邪法，一邊，一字一句，那聲音裡，是,焚天的,恨,與，冰冷的,決絕，「因為，我,身後，是，問道一脈,萬千,先賢的,血債。」\n\n「墨淵,你,屠戮青石鎮,殺害程伯之時，」墨飛，眸中，寒光，暴漲，「可曾，想過，會有,今日?」\n\n他，不再，給墨淵，任何，喘息之機。問道元嬰的,全部力量，那，剋制邪法的，問道之道，那，為程伯復仇的，滔天決意，盡數，在這一刻，爆發!\n\n《太一光明經》全屬性增幅，將墨飛的戰力，推至,巔峰;《寒瀑劍》鎖住墨淵的身形;《厚土樁》化解他的反撲;而那，蘊著,問道至理的《裂石訣》金系氣刃——\n\n在墨淵，一輪邪法，用老、護體最薄的，那,一息破綻——\n\n墨飛，將，元嬰真元、問道至理、與，為至親復仇的,全部恨意，凝於，那，雷霆的,一擊!\n\n那氣刃，無視,墨淵倉促凝起的,邪異護體，如，貫日的長虹，直直，洞穿了——墨淵的，眉心!\n\n「這一刀——」墨飛，一字一頓，聲音,冰冷，「為，程伯。」\n\n墨淵，那，森然的臉上，凝固著，難以置信的,驚駭。他，至死，都，不曾想到，自己，這，元嬰後期的,反問道護法，竟，會，隕落於，一個，他，一度，視為螻蟻的，問道少年之手。\n\n「教主……會，為我……」他，喃喃，那，最後的,氣息，也，隨之，斷絕。\n\n一代，反問道護法，禍亂天南、血債累累的,墨淵，就此，隕落於，這，問劍宗的,戰場之上。\n\n墨飛，收刀，立於墨淵的,屍身之前，久久，佇立。\n\n程伯的血仇，得報了，一半。\n\n「程伯，」他，望向，青石鎮的,遙遠方向，眸中，含淚，卻，無比，堅定，「墨淵，我,替你,斬了。」\n\n「而那，真正的元兇，那噬道天教的,教主——」他，望向，那，滾滾的,邪雲深處，一字一頓，\n\n「這，血債的，另一半，我，遲早，也會，親手，向他，討回。」\n\n——\n\n墨淵一死，噬道天教這方，士氣，大挫。\n\n墨淵，是此番，領軍的,主將之一。他，這，元嬰後期的護法，竟，隕落於，一個，問道少年之手——這一幕，落在，那，鬥作一團的,噬道魔修眼中，如,當頭，一盆，冷水。\n\n而墨飛，那，剋制「反問道」邪法的,問道之道，更是，在這，天崩地裂的,大戰之中，愈發，耀眼。他，如同,一柄，收割的問道之劍，於，那，噬道大軍之中，縱橫，捭闔，所過之處，噬道魔修，紛紛，潰敗、隕落!\n\n「問道之力……剋我邪法!」\n\n「那,問道傳人,太可怕了!連,墨淵護法,都,死在他手上!」\n\n噬道魔修，見了墨飛，皆，膽寒，避退。而天南正道這方，見，主將被斬、又有,問道傳人,這柄,克敵利刃,大放異彩，士氣，如虹，攻勢，愈發，凌厲!\n\n問劍宗掌門，率諸聖地化神大能，將，噬道那,幾道，化神級的,恐怖存在，死死，纏住;而墨飛，與凌霜，並，天南無數,元嬰、金丹天驕，則，將，那，群龍無首的,噬道大軍，殺得，節節，敗退!\n\n正邪，兩道的,勝負天平，在墨淵隕落、問道傳人大放異彩的,這一刻，終於，緩緩，倒向了——天南正道!\n\n那，隱於邪雲深處、指揮全局的,噬道天教,大能，見，主將已斃、大勢已去，又見，那，問道傳人，如,附骨之疽，剋制著,教中邪法，終究，不敢，再，戀戰。\n\n「撤!」\n\n一聲，森然的,號令，響徹戰場。那，滾滾的,墨黑邪雲，如,退潮般，倉皇，遁退。噬道大軍，丟下，遍地的,屍首，狼狽，撤離，問劍宗的,天穹。\n\n臨去前，那，隱於邪雲最深處的、一道，最為,恐怖的,化神級氣息，那,冰冷,而,古老的,聲音，如,魔音,般，迴盪，於，整個戰場，只餘，墨飛一人，能，聽得，真切——\n\n「問道傳人……墨飛。」\n\n「你,壞我教,大計，斬我教,護法。教主，已然，記住,你了。」\n\n「這一次，是，你們，僥倖。可,你,以為，斬了,一個墨淵，便，能，逆轉，這，問道與噬道的,萬古之勢?」\n\n「我噬道天教，傳承萬古，底蘊,通天。教主一脈的,真正,底牌，你，連,見，都,未曾,見過。」\n\n「好自為之。」那聲音，最後，森然，一笑，「他日，教主,親臨,之時——」\n\n「便，是，你,問道一脈，這，最後一縷,餘火，徹底，熄滅,之日。」\n\n那聲音，隨著,邪雲的,退散，漸漸，消弭。\n\n墨飛，立於，那，血染的,戰場之上，望著,噬道大軍,遁逃的方向，久久，佇立。\n\n問劍宗，守住了。這一戰，天南正道，慘勝。\n\n可墨飛，卻，無半分,輕鬆。\n\n那,噬道天教教主，那，隱於邪雲最深處的,化神級恐怖氣息，那句「教主一脈的,真正,底牌,你連見都未曾見過」——\n\n如同,一座，無形的,大山，沉甸甸地，壓在，他的心頭。\n\n「這一戰，」墨飛，握了握拳，眸中，戰意與，凝重，交織，「不過，是，問道與噬道,萬古之爭的，第一場，小小的,交鋒。」\n\n「真正的,滔天大劫，那,噬道天教,教主，那，通天的,底蘊——」\n\n他，望向，那，天地,最深處，那，潛藏著,滔天邪教的,方向，眸中，星河，激盪，\n\n「還，在,後頭。」\n\n「而我墨飛——」他，一字一頓，那，是，一個，問道傳人，立於，慘勝的,戰場之上，向，那，萬古之敵，許下的,無聲之誓，\n\n「唯有,一路,向前，變得,更強。」\n\n「強到，能，親手，掀翻，你噬道天教，這，通天的,底牌。」\n\n「強到，能，為，問道一脈的,萬千先賢，與，我的,程伯——」\n\n「討回,那，萬古的，公道。」"}, {"t": "第四十五章 立於天南", "c": "問劍宗一戰，天南正道，雖，慘勝，卻，也，付出了，慘重的,代價。\n\n數位，元嬰、金丹的,天驕修士，殞於此役;問劍宗的護山大陣，更是，被，摧毀了,大半。可，他們，終究，守住了，問劍宗，守住了，問道傳人，也，守住了，天南正道，對抗噬道的，最後一面，旗幟。\n\n而經此一役，墨飛之名，徹底，響徹，整個天南。\n\n以，元嬰之境，硬撼，化神一掌、守住護山陣樞;於，萬軍之中，斬殺，反問道護法墨淵;更以，那，剋制邪法的,問道之道，成為，這，正邪大戰，逆轉,勝負的，關鍵——\n\n「問道傳人墨飛」，這個名字，已，成了，整個天南正道，對抗噬道天教的,精神象徵。\n\n戰後，天南諸聖地的,化神大能，齊聚問劍宗，共商，抗擊，噬道之,大計。而在這，群英,匯聚的,議事之中，墨飛，這，一個，元嬰一層的,後輩，竟，被，那，一眾，化神大能，奉為，上賓，言必稱，「問道傳人」。\n\n「諸位前輩，」議事之上，墨飛，起身，鄭重道，「噬道天教，此番，雖，退，卻，元氣未傷。其教主一脈的,真正底蘊，我等，尚未,窺見。」\n\n「而據，問道信物,所示——」他，一字一句，「欲，真正，對抗噬道，唯有，重興問道。而重興問道，需，集齊，那，散落於，天下的,其餘,問道信物，重鑄，問道道統。」\n\n「這，便是，晚輩,接下來，要，走的路。」\n\n那一眾,化神大能，聞言，皆，鄭重，頷首。\n\n「墨飛小友,所言,極是。」那位，曾，於論道大會，欲收墨飛為徒的,道骨仙風的化神老者，撫須道，「問道之道，剋制,噬道邪法。你，重鑄問道道統之日，便，是，我天南正道，真正，有,底氣，蕩平,噬道之時。」\n\n「此事，關乎，天南存亡。」問劍宗掌門，鄭重道，「我等，諸聖地，願,傾力，相助!但有,問道信物的,線索，必,第一時間，告知於你!」\n\n有了,天南諸聖地的,鼎力,相助，墨飛，重興問道的,路上，便，不再，是，孤軍,奮戰。\n\n——\n\n議事之後，墨飛，回到，那，已，開始，重建的,問劍崖。\n\n凌霜，早已，在此，等候。\n\n「都，安排好了?」她，輕聲問。\n\n「嗯。」墨飛，點頭，「諸聖地，願，助我，尋回，散落的,問道信物。而據,那，論道大會所得的信物,推衍——其餘的,信物，散落於,天南各域，乃至，更遙遠的,天地。」\n\n「這，註定，是，一趟,漫長,而,凶險的,旅程。」他，望向，那，天地深處，眸中，星河，激盪。\n\n「無論，多長,多險，」凌霜，握住他的手，那清冷的眸中，是，並肩的,決意與，深深的,情意，「我，都，陪你。」\n\n墨飛，回望著她，那，因，並肩生死、患難與共，而，愈發，深厚的,情誼，讓他，心底，一片，滾燙。\n\n「師姐，」他，一字一句，鄭重，「這一路，有你,同行——」\n\n「是，我墨飛，此生，最大的,幸運。」\n\n凌霜，那，向來清冷的臉上，緩緩，綻開，一抹，明媚而，動人的,笑意，那雙,秋水般的眸子裡，星光，璀璨。\n\n崖上，晚風，輕拂。\n\n一個，承接了問道道統、身負萬古血仇與使命的,問道傳人;一位，化煞為劍、劍道通神的,絕世劍修——兩顆，因，共同的,道與,情，而，緊緊，相依的心，在這，慘勝之後的，寧靜之中，貼得，更近。\n\n「程伯，」墨飛，望向,青石鎮的方向，心底，默念，「你，用生命,守護的,問道火種。」\n\n「我，會，帶著它，走遍，這，天地。集齊,信物，重鑄，道統。」\n\n「直到,有一天——」他，望向，那，噬道天教，潛藏的，天地最深處，眸中，是，問道傳人，那，堅定,不移的,使命與,戰意，\n\n「問道之光，重新，照亮，這，方，天地。」\n\n「而，那覆滅了,問道一脈的,噬道天教，那,潛藏萬古的,教主——」\n\n「終將，在,我墨飛，重鑄的,問道之道面前，付出，覆滅道統的，血債。」\n\n天南的,天穹，於，這場，慘烈的,大戰之後，重歸，澄澈。\n\n而，一個，問道傳人的,傳奇，一場，橫跨,萬古、關乎,道統存亡的,問道與噬道之爭，才，剛剛，走過，它的，序章。\n\n前路,漫漫。\n\n墨飛,握緊了，那，六色道韻流轉的,斷刀，眼底，是，迎向，那，萬里,前程的,澄澈與,無畏。\n\n——\n\n此後半年，墨飛，於問劍宗，潛心，修行。\n\n有，問道元嬰的,絕佳底蘊，有，問道信物,溫養道基，有，宗門與諸聖地的,傾力,栽培，他的修為，一日千里。半年之後，他，已自，元嬰一層，穩穩，突破，至了，元嬰後期，戰力，更是，突破了，兩萬大關!\n\n【墨飛│元嬰後期│戰力 21000】\n\n已然，比肩，昔日,那,不可一世的,反問道護法墨淵。\n\n而這半年，他，也，並未,忘記,那，遠在外門的,兄弟——石敢。\n\n石敢，得墨飛，時時，接濟,資源、指點,修行，這半年，亦是，突飛猛進，已，築基後期，在外門，成了，數一數二的,人物。得知墨飛,即將,遠行,尋找,問道信物，這，憨厚的漢子，二話不說，便，要，隨行。\n\n「墨兄弟去哪，俺石敢，就跟到哪!」他，拍著胸脯，「刀山火海，俺,也,陪你,闖!」\n\n墨飛，望著這，情深義重的兄弟，心底，一暖，重重，點頭:「好!你我兄弟，一同,往，那，更高、更遠的,天地,去!」\n\n——\n\n一切，準備,妥當。\n\n這一日，墨飛，於問劍崖之巔，以，那，論道大會所得的問道信物為引，催動,那，承自道統的「推衍」之能，開始，推演，其餘,問道信物的,下落。\n\n那，問道信物，在他,元嬰後期的,神識,催動之下，綻放出，一縷，璀璨的道韻。而那道韻，如，指引，般，遙遙，指向了——天南之外，一片，更為,遼闊、也更為,凶險的,天地!\n\n【推衍:其餘問道信物之一——位於「西陲·萬劍門」。】\n【〔萬劍門,西陲第一劍道大宗。其鎮派之寶「問劍碑」中,或藏著,一片,問道信物。然……西陲,魚龍混雜,噬道天教的,勢力,亦,滲透其中。此行,凶險〕】\n\n「萬劍門……問劍碑……」墨飛，望著那，道韻,指引的,西陲方向，眸光，一凝。\n\n第一片,問道信物的,線索，尋到了。\n\n而那，遙遠的,西陲，那，凶險的,萬劍門——正是，他，重興問道之路上，要，踏出的，下一步。\n\n「師姐，石大哥。」墨飛，回頭，望向，那，早已，準備妥當的,凌霜與石敢，眸中，戰意，熊熊，「第一片,信物的,線索,有了。」\n\n「西陲，萬劍門。」他，一字一頓，望向，那，天地盡頭，那，更廣闊、也更未知的,方向，\n\n「我們，出發。」\n\n一艘，嶄新的靈舟，載著，問道傳人墨飛、絕世劍修凌霜、憨厚兄弟石敢，自問劍宗,騰空而起，朝著，那，天南之外、西陲深處的,萬劍門，破空，而去。\n\n靈舟之上，墨飛，立於舟頭，回望，那，漸漸遠去的,問劍宗——那，他，自，雜役堂，一路，崛起的,地方;那，他，結識夥伴、化解隱疾、承接使命的,地方;那，埋葬著，他,一段,青澀歲月的,地方。\n\n而後，他，轉過身，望向，那，靈舟前方，那，遼闊,無垠、危機,四伏，卻，也，機緣,遍地的,廣袤,天地。\n\n「程伯，問道一脈的,先賢們。」他，望向,那，萬里,前程，眸中，是，一個,問道傳人，踏上,征途的,澄澈與,豪情，\n\n「我墨飛的,問道之路——」\n\n「這，才，剛剛，開始。」\n\n靈舟,破空,遠去，載著，一段，橫跨萬古、蕩氣迴腸的,問道傳奇，駛向，那，更為，波瀾壯闊的，未來。\n\n（卷三·問道傳承 完）"}, {"t": "第四十六章 西陲", "c": "靈舟，破空，西行，足足，飛了，一月，方才，抵達，天南與西陲的,交界。\n\n越過那道，橫亙天地的,巨大山脈，眼前的天地，為之一變。\n\n西陲，是一片，遠比天南，更為，蒼茫、遼闊，也更為,狂野的,土地。這裡，靈氣，更加，狂暴而,駁雜;天地之間，隱隱，透著，一股，肅殺的,劍意——傳聞，西陲，乃是，上古,劍道，最為，昌盛之地，萬千,劍修，匯聚，劍氣，沖霄。\n\n而墨飛，以「道眼」，掃過這，蒼茫的西陲，心中，卻，愈發，凝重。\n\n「這裡的,強者，遠比,天南，更多。」他，沉聲道，「化神大能，隨處，可見;甚至……我，隱隱，感應到了,幾道，比,化神,更為,恐怖的,氣息。」\n\n化神之上，是為，煉虛、合體，乃至,那，傳說中的,大乘之境。西陲，這，古老而,狂野的,劍道之地，底蘊，深不可測。\n\n「西陲，臥虎藏龍。」凌霜，亦，神色，凝重，「你我，在,天南，或算,頂尖天驕;可到了,這裡——只怕，需得，處處，小心。」\n\n石敢，望著那，蒼茫遼闊、劍氣沖霄的西陲，也，不由得，咋舌:「乖乖……這地方，比,天南，還要,唬人。」\n\n墨飛，收回目光，眸中，卻，無半分,怯意。\n\n「臥虎藏龍，也好;強者如林，也罷。」他，望向，那，問道信物,指引的,萬劍門方向，一字一頓，「這第一片，問道信物，我，勢在,必得。」\n\n「走。」\n\n——\n\n萬劍門，坐落於，西陲東部，一座，名為，「萬劍峰」的,巍峨,仙山之上。\n\n那，是一座，比，問劍宗，還要，恢弘、還要,古老的,劍道聖地。萬丈,劍峰之上，插滿了，億萬柄，古老的,飛劍;那，沖天的,劍氣，將，半邊,天空，都，染成了，一片,凜冽的,劍光。傳聞，萬劍門的,鎮派之寶「問劍碑」，乃，上古,一位，劍道大能，以，畢生,劍意，所鑄，其中，蘊藏著，無上的,劍道傳承——\n\n而墨飛，要尋的,那片,問道信物，據推衍，便，藏於，那，問劍碑之中。\n\n「問劍碑，是,萬劍門的,鎮派之寶。」凌霜，沉吟道，「那片,問道信物，若，真,藏於其中，只怕，萬劍門，自己，都，未必,知曉。」\n\n「想，取得，只怕，不易。」\n\n「先,不急,強取。」墨飛，眸光，一凝，「萬劍門，乃，西陲,正道大宗，與，噬道天教，亦是,勢不兩立。或許——我等，可，以，問道傳人的,身份，坦誠，相商。」\n\n「何況，」他，眸光，一閃，「我，隱隱,感應到，那,問劍碑之中，除了,劍道傳承，那片,問道信物的,道韻，正,與，我識海的,問道盤，遙相,呼應。」\n\n「有,這份,呼應——」墨飛，一字一頓，「或許，能，成為，取信,萬劍門的,契機。」\n\n——\n\n然而，墨飛一行，尚未,行至,萬劍門山門，便，遇上了,麻煩。\n\n萬劍峰下，一處，繁華的,坊市，忽然，一陣，騷亂。數道，氣息，邪異的,身影，正，於，那，坊市之中，公然，擄掠，一名,懷抱,古劍的,少女!\n\n「救命!救命啊!」那少女，驚恐,呼救，「他們，是,噬道天教的,人!他們，要,搶,我家,傳承的,古劍!」
