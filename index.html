毫。那是她家族傳承的信物，是她拚死也要守住的東西。\n\n這一幕，落在墨飛眼中，竟與他守護問道信物的執念隱隱重合。\n\n墨飛卻不再多言。那少女的呼救，那噬道魔修的猖狂，他見了豈能坐視？\n\n「石大哥，護好四周。」墨飛一步踏出，那元嬰後期的浩瀚氣息與那六色道韻同時綻放，「這噬道的爪牙，我來會會。」\n\n他身形一晃，如一道問道之光攔在了那擄掠少女的黑袍人面前，聲音冰冷：\n\n「光天化日，噬道邪祟也敢擄掠良善？這少女，」墨飛眸中寒光凜冽，「你們放，是不放？」\n\n——\n\n那為首的黑袍人見墨飛攔路，眼中掠過一絲陰鷙：「哪來的不長眼的東西？也敢管我噬道天教的閒事？」\n\n他周身邪異真元暴漲——那是一名元嬰中期的噬道魔修。\n\n可他選錯了對手。\n\n墨飛，元嬰後期，戰力兩萬有餘，更兼那剋制「反問道」邪法的問道之道。那魔修一縷縷毀道噬道的黑氣攻來，在墨飛的「觀道」之下破綻盡顯。墨飛甚至未曾動用全力，只一記蘊著問道至理的《裂石訣》，便破開那魔修的邪異護體，將他重重擊飛，釘在地上動彈不得。\n\n其餘幾名金丹的黑袍人，見首領一招便被秒殺，皆駭得魂飛魄散，丟下那少女亡命遁逃。\n\n「一個元嬰後期的問道修士？！」被擊飛的魔修首領難以置信，「你到底是誰？」\n\n「你們噬道天教覆滅問道一脈、禍亂天地。」墨飛緩步上前，居高臨下，眸中寒光凜冽，「而我，正是你們想斬草除根、卻斬不盡的——問道一脈的傳人。」\n\n「問道傳人？！」那魔修首領聞言如遭雷擊，那陰鷙的臉上瞬間血色盡褪，「你就是墨飛？斬殺墨淵護法的那個問道傳人？」\n\n墨飛之名，經天南一戰早已傳遍噬道天教。這魔修一聽便嚇得亡魂大冒，再不敢多言，竟也施展邪術、不惜自損遁逃，只留下一句色厲內荏的狠話：\n\n「你等著！此事我必稟報西陲分壇……」\n\n墨飛並未追殺。他收回目光，望向那被救下的、驚魂未定的少女。\n\n那少女約莫二八年華，生得清麗，懷中緊緊抱著一柄古樸的長劍。她望著墨飛，眼中滿是劫後餘生的感激：\n\n「多謝前輩救命之恩！小女子柳輕眉，乃萬劍門記名弟子。」她盈盈一拜，「這噬道天教的惡徒覬覦我家傳承的這柄『問心劍』已久。今日若非前輩出手——」\n\n「萬劍門弟子？」墨飛心中一動。\n\n真是得來全不費功夫。他正愁如何尋一個取信萬劍門的契機，卻不想這坊市之中一場見義勇為，便恰好救下了一名萬劍門的弟子。\n\n「柳姑娘不必多禮。」墨飛扶起她，溫言道，「路見不平，理所應當。」\n\n他略一沉吟，坦然道：「實不相瞞。我墨飛，乃天南問劍宗弟子，此番遠來西陲，正是有一樁關乎萬劍門鎮派之寶『問劍碑』的要事，欲求見貴門掌門。」\n\n「不知柳姑娘可否代為引薦？」\n\n柳輕眉聞言，感激之下自是滿口應承：「前輩救命之恩尚未報答，這點小事何足掛齒！前輩隨我來便是！」\n\n「只是——」她遲疑一下，壓低聲音，「前輩，那『問劍碑』乃我萬劍門鎮派之寶，門中看守森嚴。而近來，門中也頗不太平。」\n\n「不太平？」墨飛眸光一凝。\n\n「嗯。」柳輕眉神色凝重，「近來門中接連有長老離奇走火入魔，更隱隱傳言，說那噬道天教的爪牙早已滲透進了萬劍門的內部……」\n\n那少女柳輕眉一路引著三人上山，一路低聲訴說著門中近來的異狀：先是幾位德高望重的長老無故走火入魔，或死或廢；接著門中氣氛日漸壓抑，人人自危，卻查不出半分緣由。她一個記名弟子，本不該知曉這些，只因她那柄祖傳的「問心劍」隱隱與問劍碑有感應，才被捲入其中，險些遭了噬道天教的毒手。\n\n墨飛聽罷，心中那份凝重又添了幾分。噬道天教滲透一個宗門的手段，他在問劍宗的陰無常身上，早已領教過。\n\n墨飛與凌霜交換了一個凝重的眼神。\n\n走火入魔、噬道滲透——這一幕，與當初問劍宗陰無常潛入之事何其相似。\n\n「看來，」墨飛望向那劍氣沖霄的萬劍門，眸光森然，「噬道天教覬覦的不只是那問劍碑中的問道信物。」\n\n「這萬劍門，」他一字一頓，「只怕也早已是一座暗藏殺機的龍潭虎穴。」"}, {"t": "第四十七章 問劍碑", "c": "在柳輕眉的引薦下，墨飛一行順利登上了萬劍峰，見到了萬劍門的掌門——劍無塵。\n\n劍無塵是一位身著樸素劍袍、周身卻縈繞著凜冽劍意的老者。他已臻化神之境，一雙眸子銳利如劍，彷彿能洞穿一切虛妄。\n\n得知墨飛是斬殺墨淵、力抗噬道的問道傳人，劍無塵那銳利的眸中掠過一絲鄭重與讚許。\n\n「問道傳人。」他緩緩道，「墨飛小友力抗噬道之事，老夫亦有耳聞。噬道天教禍亂天下、覆滅道統，乃我輩共同之敵。小友遠來西陲，所為何事？」\n\n墨飛坦然將來意和盤托出：「晚輩此番前來，是為貴門鎮派之寶——問劍碑。」\n\n「問劍碑？」劍無塵眉頭微皺。\n\n「晚輩身負重興問道一脈的使命。」墨飛一字一句，「而據晚輩所持的問道信物推衍，貴門那問劍碑之中隱藏著一片問道一脈的信物。」\n\n「晚輩斗膽，懇請一觀問劍碑，以印證此事。」\n\n此言一出，滿殿皆驚。萬劍門的問劍碑乃鎮派之寶，豈容外人覬覦？幾位萬劍門的長老當即面露不悅。\n\n劍無塵卻並未動怒。他那銳利的眸子深深凝視著墨飛，良久，方緩緩道：\n\n「口說無憑。問劍碑乃本門鎮派之寶，非本門核心弟子不得靠近。」\n\n「不過——」他話鋒一轉，「小友既說那問劍碑與你的問道信物遙相呼應，老夫便給你一個機會。」\n\n「隨我來。」\n\n——\n\n問劍碑供奉於萬劍峰峰頂，一座古老而莊嚴的劍冢之中。\n\n那是一方高達數丈的古樸石碑，通體縈繞著凜冽到極致的劍意。碑面之上銘刻著億萬道玄奧的劍痕，靈光流轉，散發著一股睥睨萬古的劍道至理。\n\n傳聞唯有劍道天賦絕世、且與問劍碑有緣者，方能於這碑前感悟那無上的劍道傳承。萬劍門歷代無數天驕於此碑前窮盡一生，也未必能感悟分毫。\n\n那問劍碑矗立於劍冢的最中央，四周插滿了萬劍門歷代先賢的佩劍，劍氣縱橫，肅穆森然。饒是墨飛見多識廣，立於這方古碑之前，也不由得心生一絲敬畏——那碑上億萬道劍痕之中，蘊藏的是一位上古劍道大能畢生的求索與證道，那是何等的境界。\n\n墨飛緩步走近那問劍碑。\n\n當他靠近的剎那——\n\n那一直沉寂的問劍碑竟驟然亮起！\n\n千百年來，這方古碑始終沉默地矗立於劍冢之中，任萬劍門歷代天驕在它面前叩問劍道，也不曾有過半分回應。可此刻，當墨飛靠近的剎那，那碑上億萬道劍痕之間，竟有一縷溫潤的道韻自那凜冽的劍意深處緩緩浮現，如沉睡萬古的遊子聽見了故人的呼喚，與墨飛識海中的問道盤遙相呼應。\n\n【偵測到：問劍碑深處，藏有——問道信物！】\n【〔此信物被上古劍道大能以劍意封存於問劍碑之中。唯有問道傳人，方能以問道之力將其喚醒、取出〕】\n\n「果然！」墨飛眸中一亮。\n\n那一幕落在劍無塵與眾多萬劍門弟子的眼中，卻是驚天動地。\n\n「問劍碑，它亮了？！」\n\n「千百年來，這問劍碑從未如此異動過！那墨飛，他究竟做了什麼？」\n\n劍無塵那銳利的眸中更是翻湧起滔天的驚異。他執掌萬劍門數百年，這問劍碑於他亦是深不可測、無法盡窺，可此刻它竟因這問道傳人的靠近而甦醒、呼應。\n\n「墨飛小友，」劍無塵聲音都帶上了一絲鄭重，「你所言非虛。這問劍碑果然與你的問道一脈有著某種淵源。」\n\n墨飛鄭重拱手：「掌門，這問劍碑之中的問道信物關乎問道一脈的復興，關乎對抗噬道天教的大計。晚輩懇請掌門允准，將其喚醒、取出。」\n\n「而那問劍碑本身的無上劍道傳承——」墨飛坦然道，「晚輩分毫不取。它仍是貴門鎮派之寶。」\n\n劍無塵沉吟。\n\n問道信物關乎天下道統存亡，而墨飛又允諾不取問劍碑的劍道傳承。這於萬劍門並無損失，反倒能結一份問道傳人的善緣，共禦噬道。\n\n「好。」劍無塵終於頷首，「老夫允了。」\n\n然而，就在此時——\n\n峰頂那一直靜謐的劍冢深處，一道陰鷙而森然的聲音突兀響起：\n\n「掌門，此事萬萬不可！」\n\n墨飛眸光驟然一凝。他那「道眼」早已捕捉到——那出言阻攔之人是一名萬劍門的長老，其氣息之下竟纏繞著一絲極其隱晦的「反問道」之韻。\n\n噬道天教滲透進萬劍門的那條毒蛇，終於在這問劍碑前露出了它的尾巴。\n\n墨飛心中冷笑。他早在方才登殿之時，便隱隱察覺殿中有一道氣息不對；只是那邪韻藏得極深，若非他這問道傳人的「道眼」，尋常化神都未必能識破。這古長天潛伏門中，德高望重，卻在他即將取出問道信物的關頭跳出來阻攔——狐狸的尾巴，藏得再好，也總有露出來的一刻。\n\n——\n\n那出言阻攔的長老名喚古長天，乃萬劍門一位元嬰後期的執法長老，德高望重。\n\n「掌門，這墨飛來歷不明，妄稱問道傳人。」古長天陰惻惻地道，「他覬覦我門鎮派之寶，其心可誅！那問劍碑異動，焉知不是他施了什麼妖法蠱惑？萬萬不可讓他靠近問劍碑！」\n\n他這番話說得冠冕堂皇，引得幾位不明就裡的長老紛紛附和。\n\n墨飛卻冷冷一笑。\n\n「古長老，」他一字一句，那承接了問道道統的「道眼」將古長天那深藏的邪異氣息盡數看穿，「你如此急於阻攔我靠近問劍碑——」\n\n「是怕我取走那問道信物，還是怕我壞了你噬道天教覬覦問劍碑已久的大計？」\n\n此言一出，滿殿皆驚！\n\n「墨飛，你血口噴人！」古長天臉色驟變，厲聲喝道。\n\n「墨飛小友遠來是客，古長天卻是本門執法長老。」殿中一位老者沉聲道，「這等指控，非同小可，可有實據？」\n\n「實據？」墨飛冷冷一笑，「他方才那句『萬萬不可讓他靠近問劍碑』，急切得不像是在防一個外人，倒像是在護一件他覬覦已久、生怕被人搶了的東西。」\n\n「是不是血口噴人，」墨飛眸光森然，「掌門一探便知。」\n\n「掌門！」他轉向劍無塵，鄭重道，「這古長天身上纏繞著噬道天教的『反問道』之韻！近來貴門那接連走火入魔的長老，只怕皆是他以邪法暗害！他潛伏門中，覬覦的正是這問劍碑與其中的問道信物！」\n\n劍無塵那銳利如劍的眸子驟然一凝，神識如劍暴射，探向古長天。\n\n那一探之下，劍無塵臉色劇變！\n\n古長天那看似精純的元嬰真元之下，果然纏繞著一絲極其隱晦、卻千真萬確的「反問道」邪韻。\n\n「古長天！」劍無塵勃然大怒，一身化神威壓轟然鎮壓而下，「你竟真是噬道天教的爪牙？你暗害同門、潛伏門中——」\n\n古長天見身份敗露，那德高望重的偽裝瞬間褪去，化作一片陰鷙與狠戾。\n\n「墨飛！問道餘孽！」他怨毒地剜了墨飛一眼，「壞我大事！」\n\n「也罷！事已至此——」他眼中凶光暴漲，周身那隱藏已久的邪異真元轟然爆發，竟不顧一切地朝著那問劍碑撲去，「這問劍碑與問道信物，我教覬覦已久！今日得不到——」\n\n「那便讓它與這問道信物一同毀滅！誰也別想得到！」\n\n他一掌攜著滔天的邪異之力，狠狠朝著那問劍碑——那蘊藏著無上劍道傳承與問道信物的鎮派之寶轟然拍落。\n\n「住手！」劍無塵大驚，那可是萬劍門萬載的鎮派根基！\n\n千鈞一髮之際——\n\n一道六色道韻的流光，比劍無塵還要快上一線！\n\n原來，早在踏入劍冢的那一刻，墨飛的「推衍」便已將古長天列為最大的變數。他算到了此獠一旦身份敗露，極可能狗急跳牆、玉石俱焚——與其讓問道信物落入墨飛之手，噬道天教寧可將它與問劍碑一同毀去。正因算到了這一步，他才始終暗中戒備，將一縷元嬰真元蓄勢待發。\n\n墨飛暴起！他將問道元嬰的全部力量凝於斷刀，一記蘊著問道至理的雷霆之擊，硬生生攔在了古長天那毀碑一掌與問劍碑之間。\n\n轟隆——！"}, {"t": "第四十八章 護碑", "c": "墨飛那凝聚了問道至理的雷霆一擊，與古長天那玉石俱焚的毀碑一掌轟然相撞。\n\n滔天的餘波將二人同時震退。而那萬劍門的鎮派之寶問劍碑，在墨飛的拚死一擋之下安然無恙。\n\n「問道餘孽！」古長天見毀碑不成，狂怒暴喝，一身邪異真元盡數催發，朝墨飛瘋狂攻來，「我先殺了你！」\n\n可他選錯了對手。\n\n古長天元嬰後期，戰力不過五千餘；而墨飛同為元嬰後期，戰力卻已突破兩萬，更兼那剋制「反問道」邪法的問道之道。\n\n古長天雖是元嬰後期的執法長老，可他修的是那陰損的「反問道」邪法，論及正面搏殺，遠不及墨飛這般攻守兼備。更何況，「反問道」在「問道」面前，本就如孩童持木劍鬥宗師，處處受制。\n\n那古長天一縷縷毀道噬道的黑氣，在墨飛的「觀道」之下破綻盡顯，那看似凶險的邪法被墨飛那浩瀚的問道之光一一消融、克制。不過數招，墨飛便以碾壓之勢破開古長天的邪異護體，一記蘊著問道至理的《裂石訣》將他重創、釘於地上。\n\n而一旁早已勃然大怒的劍無塵，更是一劍斬出，那化神劍意如天河傾瀉，將那重傷的古長天周身真元盡數封鎖，動彈不得。\n\n「古長天！你暗害同門、勾結噬道，更欲毀我鎮派之寶！」劍無塵那銳利的眸中殺意滔天，「萬劍門數百年養你、栽培你，你竟是這等狼心狗肺的噬道爪牙！」\n\n古長天被那化神劍意鎖住，動彈不得，那陰鷙的臉上卻仍帶著一絲狠戾的冷笑：\n\n「哼……我教籌謀萬古，勢不可擋。你們這些井底之蛙，還在為一塊破碑沾沾自喜？」\n\n「等我教教主一統這天地道統之日——」他森然獰笑，「爾等皆將淪為噬道的養料！」\n\n「還猖狂？」劍無塵冷哼，一劍封了他的言語與真元，命門中弟子將這噬道爪牙押入劍獄，嚴加看管，以待審訊。\n\n事後，萬劍門徹查古長天潛伏門中的所作所為，這才驚覺：那接連走火入魔的幾位長老，皆是被他以「反問道」邪法暗中蠶食道基所害；而他潛伏數年，處心積慮，圖謀的正是伺機盜取問劍碑中的問道信物，獻予噬道天教。若非墨飛及時識破，這西陲第一劍宗的萬載根基，險些便毀於一旦。\n\n一場潛藏於萬劍門的噬道殺局，就此被墨飛一舉破去。\n\n——\n\n護碑破奸，墨飛於萬劍門立下大功。\n\n劍無塵望向墨飛的眼神，早已從最初的審視化作了由衷的鄭重與感激。\n\n「墨飛小友，」他鄭重拱手，「若非你識破古長天、力保問劍碑，後果不堪設想。這份恩情，我萬劍門記下了。」\n\n「掌門言重。」墨飛回禮，「噬道天教禍亂天下，你我共禦，本是分內之事。」\n\n劍無塵不再遲疑。他當即宣布，允准墨飛喚醒、取出那問劍碑中的問道信物。\n\n墨飛緩步走到那問劍碑前。\n\n他凝神運轉那承自道統的《問道錄》道法，與識海中的問道盤，將那浩瀚的問道之力緩緩注入問劍碑。\n\n那一直沉睡於凜冽劍意深處的問道信物，感受到同源道韻的呼喚，緩緩甦醒。\n\n嗡——\n\n一縷溫潤而璀璨的問道之光自那問劍碑的深處緩緩升起，飛入墨飛的掌心，化作一枚古樸的、與他先前那片信物一般無二的問道信物。\n\n第二片問道信物，到手！\n\n當墨飛握住那第二片信物的剎那，識海中那兩片問道信物遙相呼應，綻放出更加璀璨的道韻。一段比先前更為清晰、也更為驚人的問道傳承與秘辛，緩緩湧入墨飛的識海——那是問道一脈覆滅前夕更深層的真相，是關於噬道天教教主的更多線索。\n\n那第二片信物所承載的道韻，遠比第一片更為完整、更為厚重。隨著它與識海中第一片信物的共鳴，一幅幅塵封萬古的畫面，在墨飛的識海中緩緩鋪展：問道一脈鼎盛時的輝煌，先賢們觀天算地、證道成聖的盛況，以及那場覆滅一切的萬古之戰的更多細節。\n\n墨飛緩緩闔上眼，沉浸於那湧入的信息洪流之中。\n\n而那問劍碑在交出問道信物之後，那凜冽的劍意非但未曾減損，反而因問道之力的溫養愈發精純、圓融——這讓一旁的劍無塵與萬劍門眾弟子皆驚喜不已。\n\n「問道之力，竟能溫養劍意？！」劍無塵望著那愈發圓融的問劍碑，眼中滿是震撼與讚嘆，「問道傳人，果然非同凡響。」\n\n劍無塵望著那愈發圓融的問劍碑，又望向墨飛，眼中的敬重更深了幾分。他執掌萬劍門數百年，見慣了天驕輩出，卻從未見過墨飛這般——明明可以憑實力強取，卻偏偏坦坦蕩蕩，只取問道信物、分毫不動那劍道傳承。這份光風霽月的胸襟，比那驚人的實力，更令他折服。\n\n墨飛取得信物，與劍無塵結下深厚的善緣。萬劍門這西陲第一劍道大宗，自此成了墨飛重興問道、對抗噬道的又一大助力。\n\n而墨飛卻在那湧入識海的信息之中，臉色漸漸凝重起來。因為那第二片信物所揭示的、關於噬道天教教主的線索，比他想像中還要恐怖百倍。\n\n——\n\n墨飛於萬劍門一處清幽的靜室，靜靜參詳那第二片信物所揭示的秘辛。凌霜守在一側。\n\n「墨飛，」她見他臉色凝重，輕聲問道，「這第二片信物，透露了什麼？」\n\n墨飛緩緩睜開眼，那雙星河流轉的眸子裡是前所未有的凝重：\n\n「噬道天教的教主。」他一字一句，「我知道他是誰了。」\n\n「當年覆滅問道一脈的元兇，那噬道天教的教主——」墨飛聲音沉了下來，「他並非什麼後起的邪修。」\n\n「他是一個自問道一脈尚未覆滅的萬古之前便已存在的——」\n\n「合體境的上古大能。」\n\n「合體境？！」凌霜秀眉緊蹙。那是遠比化神還要高出兩個大境界的恐怖存在，「他竟活了萬古？」\n\n「不。」墨飛搖頭，眸中掠過一絲寒意，「不是活了萬古。」\n\n「是——他以『噬道』之法吞噬天地間一切道統與傳承，來延續自己的壽元、壯大自己的力量。」\n\n「問道一脈那參透萬物、丈量大道的無上道統，」墨飛一字一頓，「便是他萬古之前吞噬的最肥美的一份養料。」\n\n「他覆滅問道一脈，並非只為除去一個道統——」墨飛望向那天地最深處，眸中是滔天的恨意與凝重，「而是為了吞噬問道一脈的道，來成就他自己！」\n\n靜室之內一片死寂。\n\n凌霜望著墨飛那雙盛滿了凝重的眸子，只覺得一股寒意自脊背直竄天靈。\n\n從元嬰到合體，中間隔著化神、煉虛兩個大境界，每一階都是天塹，每一階都足以讓一域強者望而卻步。而那教主，更是站在合體巔峰、活了萬古的存在。以墨飛如今元嬰後期的修為去丈量這道鴻溝，簡直如螻蟻仰望蒼穹。\n\n一個以吞噬天下道統為食、活了萬古的合體境上古大能。這便是墨飛此生註定要面對的最終之敵。這是何等絕望的鴻溝？\n\n「墨飛……」凌霜握住他的手，聲音微微發顫，「合體境，那幾乎是這方天地的頂點，你如何能……」\n\n「我知道。」墨飛卻反握住她的手，那凝重的臉上燃起了一種不肯認命的決絕，「以我如今的元嬰之境，別說對抗，便是站到他面前都不夠。」\n\n「可——」他望向那識海中兩片遙相呼應的問道信物，眸中星河激盪，「那湮沒萬古的問道先賢，早已為我指明了道路。」\n\n「集齊散落天下的問道信物，重鑄問道道統。」他一字一句，斬釘截鐵，「問道之力剋制噬道。當問道道統徹底重興之日——」\n\n「便是我有底氣去面對那噬道教主，去為問道一脈的萬千先賢，去為我的程伯——」\n\n「討回那萬古血債之時！」\n\n凌霜望著墨飛那明知前路是何等絕望的鴻溝、卻依舊眼神堅定、鬥志昂揚的模樣，那顆心被深深觸動。\n\n「好。」她重重握緊他的手，那清冷的眸中是並肩至死的決意，「這條路，這萬古的血仇——」\n\n「我凌霜，陪你一同走到盡頭。」\n\n窗外，西陲的劍氣沖霄。\n\n第二片問道信物已然到手，而那最終之敵的真面目，也第一次浮出水面。"}, {"t": "第四十九章 化神之途", "c": "墨飛於萬劍門盤桓月餘。\n\n這一月，劍無塵感念墨飛護碑破奸之恩，又敬他問道傳人的擔當，不但將萬劍門一應珍稀資源供墨飛取用，更親自以化神劍道之悟為墨飛指點修行。\n\n而墨飛亦投桃報李。他以問道之力助劍無塵梳理那因古長天暗害而紊亂的門中劍陣，更以問道盤的「觀道」，替萬劍門那幾位中了噬道邪法、命懸一線的長老尋出了化解之法。\n\n問道與劍道，正道與正道，惺惺相惜。\n\n一月之後，墨飛欲繼續尋訪其餘問道信物的行程。臨別之際，劍無塵親自相送，並取出一枚萬劍門的信物，鄭重相贈：\n\n「墨飛小友，這是萬劍門的『召劍令』。他日你對抗噬道，但有所需，持此令，我萬劍門億萬劍修願為你拔劍！」\n\n墨飛鄭重接過。至此，繼天南諸聖地之後，西陲第一劍宗萬劍門，亦成了他重興問道、對抗噬道的又一大臂助。\n\n那被救的少女柳輕眉更是紅著眼眶前來相送，將一柄親手溫養的靈劍塞給石敢——原來這一月，那憨厚的漢子與這清麗的劍門少女竟暗生情愫。\n\n柳輕眉本是萬劍門記名弟子，經此一事，又見墨飛一行俱是心懷道義的正道之士，便求了掌門，願隨他們一同歷練、共禦噬道。劍無塵感念墨飛之恩，又見這丫頭心意已決，便也應允了。石敢捧著那靈劍，憨憨地紅了臉，惹得墨飛與凌霜相視一笑。\n\n——\n\n離開萬劍門，靈舟繼續西行。\n\n墨飛握著那兩片問道信物，以「推衍」之能繼續追尋其餘信物的下落。那散落於天地的問道信物如一顆顆散落的星辰，指引著他重興問道的漫漫長路。\n\n而這一路，墨飛也並未停下精進的腳步。\n\n有兩片問道信物溫養道基，有天南諸聖地、萬劍門傳授的無上道法，有那一路斬妖除魔、對抗噬道的歷練，墨飛的修為一日千里。\n\n不知過了多久，這一日，靈舟行至一處靈氣磅礴的靈山之巔。墨飛只覺得體內那圓融的問道元嬰隱隱躁動，那橫亙於元嬰與化神之間的天塹第一次鬆動。\n\n「化神，要到了。」墨飛心中一動。\n\n化神是修士的第四道大關。踏入化神，神識化形，一域強者，實力將再度脫胎換骨。而唯有一步步踏入更高的境界，他才有真正的底氣去面對那噬道教主那合體境的恐怖存在。\n\n「師姐，石大哥，」墨飛望向凌霜與石敢，「我欲於此閉關，衝擊化神。」\n\n「去吧。」凌霜柔聲道，眸中是並肩的信任，「我與石敢為你護法。」\n\n墨飛於那靈山之巔盤膝坐下。\n\n他運轉那承自道統的《問道錄》，以兩片問道信物為引，將體內磅礴的元嬰真元緩緩導向那化神的關隘。\n\n以「守護」為心，以「問道」為道，以這一路斬妖除魔、對抗噬道的道心為基——那一尊問道元嬰於識海之巔緩緩凝練、蛻變，那眉心的問道之光愈發璀璨、深邃。\n\n化神一關，需以神識化形，將一身元神之力凝練得如實質一般。這一步，多少元嬰大能窮盡壽元也難以跨越，稍有不慎，神識潰散，便是萬劫不復。\n\n可墨飛卻有問道盤相助。那神識化形的每一分火候、每一絲玄機，皆被他的「觀道」看得分明；他循著那清晰的階梯，一步一步，將那玄之又玄的化神之路，走得穩健而從容。\n\n墨飛衝擊化神的異象引動天地。那靈山之巔靈氣翻湧、仙光繚繞，一縷縷玄奧的道則之力自九天垂落，將墨飛籠罩其中。\n\n而就在墨飛即將踏入化神的那關鍵剎那——\n\n他識海之中那兩片問道信物忽然同時爆發出前所未有的璀璨道韻！那道韻與墨飛衝擊化神的道則交相輝映，竟將他那本就與眾不同的化神之途推向了一個更為玄妙、也更為高遠的境界！\n\n【墨飛│化神一層│問道化神(特殊)！】\n【神識化形。以「問道」證道，以「守護」為心。】\n【戰力……突破五萬！】\n【〔此問道化神承兩片問道信物之力、歷萬千歷練而成。問道之光愈盛；剋制噬道之力愈強〕】\n\n化神一層！戰力五萬！\n\n墨飛緩緩睜開眼，那眸中星河浩瀚、道則流轉。他只覺得天地萬物在他眼中盡皆化作可觀、可算、可推衍的大道紋路。他那承接了問道道統的一雙眼睛、那問道盤的權能，在化神之力的加持下更是臻至了一個前所未有的清明之境。\n\n化神，一域強者。這四個字，於當年那個站在青石鎮測靈石前、被判「五色靈根俱滅」的廢根少年而言，是連做夢都不敢想的高度。可如今，他不但走到了，還將這化神之境，走出了問道一脈獨有的、直指大道的玄妙。\n\n他終於自那個被判「無緣」的廢根、那個蜷縮於雜役堂的少年，一步一步走到了這神識化形、一域強者的化神之境。\n\n「化神。」墨飛立於那靈山之巔，望向那天地深處那潛藏著噬道教主的方向，眸中戰意熊熊，「離那合體境的教主，還很遠。」\n\n「可我會一步一步走過去。」\n\n「集齊信物，重鑄道統，踏化神、破煉虛、證合體……」他一字一頓，那是一個問道傳人向那萬古之敵許下的宣言，「直到有一天。」\n\n「我墨飛重鑄的問道之光——將親手照破你噬道天教萬古的黑暗。」\n\n——\n\n墨飛破境化神，那衝天的道韻異象驚動了方圓千里。\n\n凌霜與石敢望著那破境而出、氣度已然睥睨一域的墨飛，皆露出由衷的欣喜。\n\n「化神……墨兄弟，你竟這麼快就化神了！」石敢激動得直搓手。他如今也已金丹之境，可望著墨飛那一日千里的修行速度，仍是望塵莫及，唯有滿心敬佩。\n\n「一步一步走罷了。」墨飛淡淡一笑。\n\n他望向那識海中兩片遙相呼應的問道信物，心中卻並未因化神而鬆懈分毫。\n\n化神於尋常修士已是一域強者、高高在上，可於墨飛而言，這不過是他重興問道、對抗噬道的漫漫長路上又一級尋常的台階。他那最終之敵，是一個活了萬古、以吞噬道統為食的合體境上古大能，那橫亙於化神與合體之間的鴻溝深不可測。\n\n「還遠遠不夠。」墨飛握了握拳，眸中是永不熄滅的戰意，「唯有集齊信物，重鑄道統，一路向前。」\n\n而就在墨飛破境化神的同一時刻——\n\n天地最深處，那潛藏了萬古的噬道天教總壇，一雙古老而深邃、彷彿蘊藏著無盡歲月的眸子緩緩睜開。\n\n「問道傳人……墨飛……」一道蒼老而威嚴到極致的聲音於那無邊的黑暗中緩緩響起，「兩片問道信物……化神之境……」\n\n「有意思。萬古以來，問道一脈這縷火種，竟還是燒了起來。」\n\n那聲音並無多少怒意，反而帶著一絲貓戲老鼠般的漠然與殘忍：\n\n「也罷。就讓你多蹦躂一陣，多集幾片信物。」\n\n「待你重鑄了那問道道統——」那雙古老的眸子深處掠過一絲令人毛骨悚然的貪婪，「本座再將你與那重鑄的道統一併吞噬。」\n\n「屆時，問道一脈萬古的道，便將徹底成為本座的養料。」\n\n「墨飛……好好長大罷。」\n\n那聲音緩緩消弭於無邊的黑暗。\n\n——\n\n墨飛立於靈山之巔，望向那天地深處，心底那敏銳到極致的問道盤，竟隱隱捕捉到了一絲來自那最深處的、令人心悸的窺伺。\n\n他眸光一凝。\n\n「教主……」他喃喃，眼底卻無半分懼意，唯有越燃越烈的戰意，「你在看我。」\n\n「看罷。」他望向那萬里前程，一字一頓，「總有一天，我會走到你面前。」\n\n「以這問道之光——終結你噬道天教萬古的罪孽。」\n\n靈舟再度騰空，載著一位新晉化神的問道傳人，朝著那下一片問道信物、那更廣闊也更凶險的天地深處破空而去。\n\n前路浩浩蕩蕩。而一個問道傳人的傳奇，正朝著那橫跨萬古的終極之戰，一步一步堅定走去。"}, {"t": "第五十章 問道之光", "c": "此後數載，墨飛行遍天南、西陲，乃至更遙遠的天地。\n\n他循著問道信物的指引，一步一步追尋那散落於天下的問道遺澤。這一路，他斬妖除魔，破解噬道天教一個又一個潛藏的殺局；他結交天下正道，將那對抗噬道的烽火一處一處點燃。\n\n這數載間，他的足跡遍布三域：在天南，他掃平了噬道殘留的爪牙；在西陲，他協同萬劍門肅清了滲透的邪修；在更遙遠的邊荒之地，他一次次破去噬道天教潛藏的殺局，救下一個個瀕臨滅門的中小宗門。所到之處，「問道傳人」四字便如一道光，讓那些長年活在噬道陰影下的修士，重新看見了反抗的希望。\n\n問道傳人墨飛之名，早已響徹這方天地。他成了一面旗幟——一面凝聚天下正道、對抗噬道天教的旗幟。\n\n而他的修為，亦在這數載的歷練與信物溫養之中穩步精進，自化神一層一路攀至了化神後期，戰力早已突破二十萬。\n\n他集齊了第三片、第四片問道信物。那散落的問道道統，正在他的手中一片一片重新匯聚。而每重聚一片信物，那問道之力剋制噬道的威能便愈發強盛，那湮沒萬古的問道之光便愈發璀璨。\n\n每一片信物之中，都封存著一位問道先賢畢生的證道之悟。當它們一片片匯聚、共鳴，墨飛便彷彿能聽見那萬千先賢跨越萬古的低語——他們將未竟的道、未償的願，盡數託付給了他這最後的血脈。這份沉甸甸的傳承，是他前行的重擔，更是他前行的力量。\n\n——\n\n這一日，墨飛回到了青石鎮。\n\n那生養了他十六年的小鎮早已重歸寧靜與祥和。經歷了噬道之劫的鎮民，在墨飛的暗中庇護與資助下重建了家園，日子過得安穩而紅火。\n\n墨飛獨自一人來到鎮後山，那方靜靜矗立的墓碑之前。\n\n「先師　程守拙　之墓」。\n\n「程伯。」墨飛立於墓前，久久佇立。\n\n鎮後山的這方墓碑，是墨飛每每行至中州、天南交界，總會繞道前來的地方。無論修為攀升到何等境界，無論肩上的使命何等沉重，只要立於這方墓碑之前，他便彷彿又變回了那個在濟生堂裡搗藥、聽老人絮絮叨叨講述藥理的少年。\n\n數載未見。他早已從那個被程伯護在羽翼之下的廢根少年，成長為一位睥睨一域、身負重興問道之使命的化神大能。\n\n「程伯，」他緩緩蹲下身，一如幼年時在濟生堂聽程伯講述藥理那般，輕聲訴說，「這些年，我走了很遠。」\n\n「我承下了問道道統。我集齊了四片問道信物。我踏入了化神。」\n\n「我還知道了——覆滅問道一脈、殺害你的那噬道天教教主，是一個活了萬古、以吞噬道統為食的合體境上古大能。」\n\n他望著那冰冷的墓碑，眸中是化不開的思念與堅定，「這條路很長，很險。前方的那個敵人，強大得令人絕望。」\n\n「可，程伯，」他一字一句，聲音雖輕，卻重逾千鈞，「你用生命守護的問道火種，我接住了。而且——」\n\n「我會讓它燒得越來越旺。」\n\n「直到有一天，」墨飛抬眼，望向那天地最深處那潛藏著噬道教主的方向，眸中星河浩瀚，戰意滔天，「我重鑄問道道統，登臨那能與教主一決生死的巔峰。」\n\n「親手為你，為問道一脈的萬千先賢——討回那萬古的公道。」\n\n山風獵獵，吹動墨飛的衣袂。\n\n墓碑無言，可那碑前的青草卻在這化神大能浩瀚的問道之光溫養下愈發青翠、蔥蘢，彷彿那長眠於此的老人正欣慰地聆聽著這一切。\n\n——\n\n墨飛起身，離開青石鎮。\n\n鎮口那棵曾枯死的老槐樹，早已在問道之光的滋養下重新抽枝發芽，煥發生機。\n\n而就在那老槐樹下——那他當年測靈石失敗、被判「無緣」、被全鎮恥笑的地方——墨飛停下腳步。\n\n他回望這方承載了他全部起點的小鎮。\n\n從那個五色靈根一起熄滅、戰力為零的廢根少年，到如今這身負道統、睥睨一域、將扛起重興問道之使命的化神大能。\n\n這一路，他靠的不是天賦。是那一雙看得見「道」的眼睛，是那一顆肯拿命去算的心，是那一部一部撿來、算來、拚來的配置，是程伯的守護與凌霜的並肩，是那一句貫穿始終的——\n\n「以算證道。」\n\n「投入才有份量。」他望著那方小小的測靈石還靜靜地立在槐樹下，唇角揚起一抹沉靜而悠遠的笑意，「看得見，才不浪費。」\n\n「當年，你判我無緣。」他望著那測靈石，一字一頓，彷彿在對那曾宣判他命運的冰冷石頭，也對那個曾被宣判的自己輕聲訴說——\n\n「可我墨飛，偏要以這廢根之軀，問一問這天地大道。」\n\n——\n\n靈舟破空遠去。\n\n舟頭，墨飛、凌霜並肩而立。石敢與柳輕眉相伴於側。\n\n前方是第五片問道信物的指引，是那更廣闊、也更凶險的天地，是那橫跨萬古、關乎道統存亡的終極之戰。\n\n而這一葉載著一位問道傳人，與他重興道統之志、萬古血仇之恨、並肩而行之情的靈舟，正朝著那浩浩蕩蕩的前程堅定駛去。\n\n一個廢根少年的問道傳奇——從青石鎮那方熄滅的測靈石起步，歷落霞谷的血、雜役堂的苦、問劍宗的崛起、萬妖森林的傳承、青石鎮的生離死別、天南西陲的烽火——如今已化作這天地間一道愈燃愈亮、剋制萬古黑暗的問道之光。\n\n而這道光將照向何方？將走到何等高遠的盡頭？\n\n靈舟之上，凌霜望著那舟頭負手而立、氣度愈發深沉的墨飛，忽然輕聲開口：\n\n「墨飛，你可曾後悔？」\n\n「後悔？」\n\n「後悔撿起那方問道盤。」凌霜望著那浩瀚的天地，「若不曾得它，你或許只是青石鎮一個尋常的鎮醫，一生安穩，無需背負這萬古的血仇與重擔。」\n\n墨飛聞言卻笑了。\n\n「後悔？」他搖搖頭，望向那識海中四片遙相呼應、道韻流轉的問道信物，眸中是一片澄澈的篤定，「師姐，你可知道，這一路我最慶幸的是什麼？」\n\n「不是得了問道盤，不是承了道統，不是踏入化神。」\n\n「是——」他望向凌霜，望向身側的石敢與柳輕眉，又望向那青石鎮的方向、那長眠的程伯，眼神溫柔而堅定，「是這一路，我終於活成了一個『看得見』的人。」\n\n「看得見一部功法的價值，看得見一個對手的破綻，看得見一個道統的興衰，更看得見——」他一字一句，「什麼值得我拿命去守護。」\n\n「這便夠了。」\n\n「哪怕前方是那活了萬古的教主，哪怕這條路走到天荒地老——」他望向那萬里前程，一字一頓，「我也走得心甘情願。」\n\n這一句「心甘情願」，墨飛說得雲淡風輕，卻重逾千鈞。凌霜比誰都清楚，這條路的盡頭，是一個活了萬古、足以令天地色變的恐怖存在；她也比誰都清楚，眼前這個少年，會為了那份「守護」，一路走到底，縱是粉身碎骨也絕不回頭。\n\n正因如此，她才更要一直，陪在他的身側。\n\n凌霜望著他，那清冷的臉上綻開一抹璀璨而動人的笑意。她不再多問，只緩緩將手覆上他的手。\n\n兩人並肩，望著那靈舟前方浩浩蕩蕩的天地。\n\n無需多言。\n\n——\n\n問道之途，五十級台階，不過是這橫跨萬古的漫漫長路的第一段。\n\n前方還有更多的信物待尋，更強的敵人待破，更高的境界待登，還有那最終橫亙於路的盡頭的——噬道教主，那萬古的黑暗。\n\n可墨飛知道，只要這問道之光不滅，只要這一顆「以算證道、以守護為心」的道心不改——這條路，他終能走到那先賢們未曾抵達的盡頭。\n\n而此刻，它才剛剛踏過第五十級台階。\n\n前路浩浩萬里。\n\n問道之途，未完待續。\n\n（卷四·西陲問劍　上　第一部·問道啟程　完）"}, {"t": "第五十一章 中州", "c": "離開西陲，靈舟一路東行，跨越萬里，朝著這方天地的中樞——中州疾馳而去。\n\n中州是這方天地最為繁華、也最為兇險的核心之地。這裡宗門林立，強者如雲，靈氣之濃郁遠非天南、西陲可比。傳聞中州的頂尖大宗，隨便一位供奉長老便是煉虛、乃至合體之境的老怪物。\n\n而墨飛以「推衍」之能追尋到的第五片問道信物，正藏於中州腹地——一座名為「天樞城」的萬族大城之中。\n\n「中州……」墨飛立於舟頭，以「道眼」遙遙掃過那越來越近的、繁華到極致的中州大地，眸光凝重，「這裡的水，比天南、西陲都要深。」\n\n「噬道天教總壇，據那第二片信物所示，便隱於中州某處。」凌霜亦是神色鄭重，「我等深入中州，無異於闖入噬道的心腹之地。」\n\n「正因如此，」墨飛眸光一凝，「這第五片信物才更不容有失。若被噬道搶先，重鑄道統便遙遙無期。」\n\n數載並肩，墨飛與凌霜的修為、默契皆已臻至化神後期的圓融。而石敢也已在墨飛的傾力栽培下突破元嬰，那與他情投意合的柳輕眉更是萬劍門特許，隨行一同歷練。\n\n四人一舟，載著問道復興的希望，駛入了這龍潭虎穴般的中州。\n\n越是深入中州，墨飛便越是感到一股無形的壓力。這裡的天空之上，時常有御空而過的遁光，隨便一道，氣息都不弱於化神；那些矗立於雲端的巨型宗門，其護山大陣散發出的威壓，更是遠非天南、西陲的宗門可比。他甚至在一座不起眼的酒樓之中，感應到了一位深藏不露、氣息渾濁如淵的合體老怪——那老怪只是隨意地飲著酒，卻讓墨飛那敏銳的問道盤，都不由自主地繃緊了一分。\n\n「難怪師姐說，中州臥虎藏龍。」墨飛收回目光，低聲道，「在天南，我或算頂尖；可到了這裡，一個化神後期，實在算不得什麼。」\n\n「正因如此，才更要謹慎。」凌霜柔聲道，「我等此行的目的是信物，不是揚名。能不動聲色地取到信物、全身而退，才是上策。」\n\n墨飛頷首。他將那外露的氣息盡數收斂，一行人扮作尋常的遊歷散修，低調地融入了那滔天的人潮之中。\n\n——\n\n天樞城是中州腹地一座橫跨萬里的萬族大城。\n\n城中人族、妖族、乃至各色非人的古老種族摩肩接踵，繁華的坊市一眼望不到盡頭，沖天的靈氣與各色勢力的氣息交織成一片令人眼花繚亂的滔天洪流。\n\n墨飛一行剛入天樞城，便被那遠超想像的繁華與底蘊所震撼。\n\n「好一座天樞城。」石敢咋舌，「這一座城，怕是比咱天南整個地界都要熱鬧。」\n\n墨飛卻無暇欣賞這繁華。他以「推衍」追尋著那第五片信物的道韻——那道韻指引著他來到了天樞城最深處，一座名為「藏珍樓」的萬族拍賣行。\n\n藏珍樓是天樞城、乃至整個中州最大的拍賣行。天下的奇珍異寶、上古遺物皆匯聚於此。\n\n「信物在藏珍樓之中。」墨飛眸光一凝，「多半是近日將要拍賣的某件拍品。」\n\n「拍賣？」凌霜秀眉微蹙，「若那信物被當作拍品公開拍賣，只怕覬覦者眾多。」\n\n「不止覬覦者眾。」墨飛沉聲道，那「道眼」早已掃過藏珍樓內外，「這藏珍樓之中，我感應到了不止一道隱藏極深的『反問道』邪韻。」\n\n「噬道天教的爪牙也盯上了這件拍品。」\n\n一場圍繞著第五片問道信物、於這中州腹地繁華拍賣行中的明爭暗奪，一觸即發。\n\n「看來，」墨飛望向那金碧輝煌的藏珍樓，眸中戰意與凝重交織，「這中州的第一場硬仗，就擺在眼前了。」\n\n——\n\n三日後，藏珍樓舉行一場萬族矚目的大拍賣。\n\n墨飛一行以散修的身份混入拍賣大廳。那大廳之中早已座無虛席——中州各大宗門、世家、乃至深居簡出的老怪物，皆為這場拍賣中的幾件壓軸重寶而來。\n\n墨飛以「道眼」暗中掃過全場。這一掃，讓他心頭一凜——\n\n這大廳之中化神大能比比皆是，更有數道深不可測的煉虛級恐怖氣息隱於暗處。而其中至少有三道氣息之下纏繞著那隱晦的「反問道」邪韻。\n\n「噬道天教來了不止一人。」墨飛心中飛快盤算，「而且其中有煉虛級的大能。」\n\n以他如今化神後期的修為，若那煉虛級的噬道大能執意搶奪信物，他正面硬撼，勝算渺茫。\n\n「這一局，」墨飛眸光森然，「不能硬拚。」\n\n「得算。」\n\n拍賣一件接著一件進行。奇珍異寶層出不窮，引得全場陣陣驚呼、競價連連。\n\n一枚上古大能煉製的護身法寶、一株年份逾萬載的靈藥、一卷殘缺卻仍蘊著無上劍意的功法……每一件拍品出場，都引來一陣激烈的爭搶。那些深居簡出的老怪物一開口，動輒便是數百萬靈石，聽得石敢在一旁咋舌不已。\n\n「乖乖，」他壓低聲音，「這隨便一件，都夠咱天南一個宗門吃用好幾年了。」\n\n墨飛卻無心這些。他的目光始終落在那大廳深處——那幾道隱於暗處的「反問道」邪韻，自始至終都未曾離去。他們也和墨飛一樣，在靜靜地等待著那件真正的目標登場。狩獵者與狩獵者，隔著滿場的喧囂，無聲地對峙著。\n\n而墨飛卻始終凝神靜待——他在等那件蘊藏著問道信物的壓軸拍品登場。\n\n終於，當拍賣行至尾聲，那藏珍樓的拍賣師取出一件用黑布蒙著的古樸匣子時——\n\n墨飛的問道盤驟然一跳！\n\n那匣中散發出的一縷溫潤道韻，正與他識海中的四片信物遙相呼應。\n\n「就是它！」墨飛眸光一亮，「第五片問道信物！」\n\n而與此同時，那隱於暗處的三道「反問道」邪韻也齊齊一凝。\n\n明爭暗奪的序幕，就此拉開。\n\n——\n\n「諸位道友，」拍賣師掀開那黑布，露出匣中一枚古樸而散發著溫潤道韻的玉牌，「此物乃老樓自一處上古遺跡所得。其中蘊藏著一絲玄奧的、無人能解的古老道韻，來歷不明，卻絕非凡品。」\n\n「起拍價——三百萬上品靈石！」\n\n全場先是一靜，隨即競價之聲此起彼伏。\n\n「三百五十萬！」\n\n「五百萬！」\n\n那不明來歷的古老道韻引得不少見多識廣的大能都心動競價。而墨飛以「道眼」看得分明——那幾道隱於暗處的「反問道」邪韻，也紛紛藉他人之口暗中加價。\n\n噬道天教，志在必得。\n\n墨飛並未急於出手。他這數載斬妖除魔、破噬道殺局，又得天南諸聖地、萬劍門相助，早已積攢下一筆不菲的靈石。可面對噬道天教那傾力一搏的財力，他若一味硬拚競價，只怕也難以持久。\n\n「八百萬！」\n\n「一千萬！」\n\n競價很快突破千萬大關，令尋常修士盡皆咋舌退場。到最後，場中競價的只餘兩方——一方是那暗中操控幾個傀儡的噬道大能；另一方——\n\n「一千五百萬。」墨飛終於出手了。\n\n他以問道之力暗中傳音那拍賣師，亮明問劍宗與萬劍門的聯名信物——這兩大正道大宗的名頭，加上他那足額的靈石，讓那藏珍樓的拍賣師也不敢怠慢。\n\n「一千八百萬！」噬道那方咬牙加價。\n\n「兩千萬。」墨飛平靜跟上，將這數載積攢的家底盡數押上。\n\n那噬道大能那方終於遲疑了。這古老道韻雖珍貴，卻還不值得他們傾盡分壇之財去硬拚。何況他們尚不知這玉牌竟是問道信物。\n\n「兩千萬一次——」\n\n「兩千萬兩次——」\n\n「成交！」拍賣師一錘定音，「恭喜這位道友！」\n\n墨飛長舒一口氣。第五片問道信物，到手！\n\n然而——就在那盛放信物的玉匣經由藏珍樓執事送至墨飛手中的剎那——\n\n那隱於暗處、競價失利的噬道大能，終於狗急跳牆。\n\n「既然買不到——」一道森然而恐怖的煉虛威壓驟然自大廳深處爆發，「那便搶！」\n\n「所有人都別想活著離開！」\n\n轟隆！整座金碧輝煌的藏珍樓拍賣大廳，在那煉虛級的滔天邪異威壓之下劇烈震顫。那噬道大能竟不惜在這中州腹地、萬族雲集的拍賣行中公然出手，欲強奪信物。\n\n一時間大廳大亂，眾多修士驚呼逃竄。\n\n電光石火之間，墨飛的問道盤已將全場的態勢推衍了一遍。那煉虛大能戰力驚人，同盟諸人皆不在身側，正面硬撼是死路一條；可懷中的信物，是他跨越萬里、傾盡家底才換來的，關乎問道道統的重鑄，斷無拱手相讓之理。\n\n「拖。」他心中飛快盤算，「這是天樞城的地界，藏珍樓背後必有靠山。只要撐過這一瞬，變數自會出現。」\n\n而墨飛將那問道信物玉匣死死護在懷中，眸光森然如冰。\n\n「果然還是來硬的。」他握緊了那六色道韻的斷刀，「凌霜師姐、石大哥，護好清眉。」\n\n「這煉虛級的噬道大能——」他望向那大廳深處那滔天的邪異威壓，眸中戰意凜冽，「今日這信物，他搶不走。」\n\n一場於這中州第一拍賣行中的血戰，一觸即發。"}, {"t": "第五十二章 城主", "c": "那煉虛級的噬道大能，一掌攜著毀天滅地的邪異之力朝著墨飛隔空鎮壓。\n\n化神與煉虛之間隔著一道難以逾越的天塹。墨飛縱有問道之道、剋制邪法，也難以正面硬撼。\n\n千鈞一髮之際，墨飛並未硬接。他那「推衍」之能早已算好退路——他一手護住信物，一手催動《太一光明經》的護體之力，身形如鬼魅般借著大廳混亂的人潮詭異一閃，堪堪卸開了那毀滅一掌的鋒芒。\n\n「想跑？」那噬道大能狂笑，邪異真元再度鎖定墨飛。\n\n可就在此時——\n\n「放肆！」\n\n一道蒼老而威嚴到極致的聲音自藏珍樓最深處轟然響起。緊接著，一股遠比那噬道大能還要恐怖的、彷彿能鎮壓萬古的滔天威壓，自那天樞城的方向驟然降臨。\n\n那噬道大能那鎖定墨飛的邪異真元，在這威壓之下竟如冰雪消融，瞬間潰散。\n\n「何方邪祟，竟敢在我天樞城藏珍樓中公然行凶、壞我規矩？！」\n\n那聲音話音方落，一道身著玄金龍袍、氣度睥睨萬古的老者身影已然出現在大廳中央。他周身縈繞著一股古老而浩瀚的合體境威壓。\n\n「天樞城城主，龍傲天！」大廳中殘存的修士盡皆駭然跪伏。\n\n合體境！天樞城城主龍傲天，竟是一位合體境的老怪物！\n\n那噬道大能見城主親至，那森然的臉上血色盡褪。他一個煉虛，在合體境的城主面前脆弱得如同螻蟻。\n\n「龍城主……」他強自鎮定，「我教與你天樞城向來井水不犯河水。今日不過是追討一件舊物，誤傷了貴樓規矩……」\n\n「舊物？」龍傲天那睥睨的目光掃過墨飛懷中的信物，又掃過那噬道大能，眼中掠過一絲深意，「在我天樞城拍下的拍品，便是買家的私產。你噬道天教欲在我城中強奪——」\n\n「是不將我天樞城放在眼裡？」\n\n那合體威壓驟然加重。那噬道大能被壓得搖搖欲墜，冷汗涔涔。他自知今日若再糾纏，只怕便要交代在這天樞城主的手中。\n\n「龍城主好大的威風！」他色厲內荏，狠狠剜了墨飛一眼，「今日之事，我教記下了！那問道餘孽——」\n\n「你也護不了他一世！」\n\n言罷，他不敢再留，施展邪術化作一道黑光倉皇遁逃。\n\n——\n\n一場藏珍樓的血戰，因天樞城主龍傲天的親臨而消弭於無形。\n\n墨飛將那問道信物玉匣護在懷中，望向那睥睨萬古的合體境城主，心中凜然。\n\n他沒想到這天樞城主竟是一位合體境的老怪物。而方才那噬道大能口稱「問道餘孽」，早已將他的身份暴露。\n\n果不其然，龍傲天那睥睨的目光緩緩落在墨飛身上，那古老的眸中掠過一絲深深的興味。\n\n「問道餘孽……」龍傲天緩緩道，「噬道天教如此忌憚追殺於你。你便是近來攪動天南、西陲風雲的問道傳人墨飛？」\n\n「晚輩墨飛，見過城主。」墨飛不卑不亢拱手，「多謝城主出手相援。」\n\n龍傲天深深凝視著墨飛，良久，忽然那威嚴的臉上綻開一絲莫測的笑意：\n\n「有趣。」龍傲天撫著長鬚，那睥睨萬古的眸中，第一次對一個晚輩生出了真正的興味，「一個化神小輩，身邊帶著一位化神劍修、一位元嬰武修，卻能讓潛藏中州的噬道天教，不惜派出煉虛大能，在老夫的地界公然搶奪。你這問道之道，究竟有何玄機，竟讓那萬古邪教如此忌憚？」\n\n「小友可願隨老夫入城主府一敘？」\n\n「老夫對你這問道之道，與那噬道天教的恩怨——」他眼中精光一閃，「頗有些興趣。」\n\n墨飛心中一動。\n\n天樞城主龍傲天，合體境的老怪物，坐鎮中州腹地。若能得此人相助，那他對抗噬道、重鑄道統的路上便又多了一尊通天的臂助。\n\n只是——這龍傲天深不可測，其用意尚不明朗。\n\n「道眼」運轉，墨飛凝視龍傲天，那盤面卻只回一片深不可測的問號——與當初的程伯、凌霜一般，這合體境的老怪物墨飛以化神之境尚無法窺其虛實。\n\n「福兮禍兮。」墨飛心中念頭飛轉，卻終究坦然一笑：\n\n「城主相邀，晚輩榮幸之至。」\n\n一場圍繞著問道信物的血戰暫告段落。而墨飛與這中州合體境城主的一段際遇，卻才剛剛開始。\n\n——\n\n天樞城主府，一處古樸清幽的靜室。\n\n龍傲天屏退左右，只與墨飛對坐。那合體境的浩瀚威壓此刻已然收斂，化作一位和藹老者的從容。\n\n「小友，你方才拍下的玉牌，」龍傲天開門見山，「並非尋常古物，對麼？」\n\n墨飛坦然取出那問道信物。他已然看出，這龍傲天絕非尋常之輩，隱瞞無益。\n\n「城主好眼力。」他將信物置於案上，「此物乃問道一脈的信物。晚輩身負重興問道之使命，集齊散落的問道信物、重鑄問道道統，正是晚輩此生之道。」\n\n龍傲天望著那散發著溫潤道韻的信物，那古老的眸中掠過一絲深深的追憶與鄭重。\n\n「問道一脈……」他長嘆一聲，「老夫活了數千載，也只在少年之時聽師尊提起過這個湮沒於萬古的道統。」\n\n「當年問道一脈以觀天地、算大道而驚才絕艷，卻一夕之間被那噬道天教傾覆、屠戮。」龍傲天緩緩道，「而那覆滅問道的噬道教主——」\n\n他話音一頓，眼中掠過一絲忌憚，「是一個活了萬古、以吞噬天下道統為食的合體巔峰魔頭。便是老夫這合體境界，在他面前也不過是螻蟻。」\n\n墨飛心頭一凜。連這合體境的城主，都對那噬道教主如此忌憚。\n\n「城主為何對問道一脈、對噬道天教知之甚深？」墨飛問道。\n\n龍傲天望著他那銳利卻坦誠的眸子，沉默片刻，方緩緩道：\n\n「因為老夫的師尊，當年便是死於噬道天教之手。」他聲音低沉，那睥睨萬古的合體大能，此刻眼中竟流露出一絲數千載都未曾磨滅的痛楚，「師尊臨終前拉著老夫的手，說噬道天教乃這天地大道之蠹，早晚要將天下道統盡數吞噬。他要老夫活下去，看著、守著，等一個能真正終結噬道的人出現。」\n\n「老夫記著這句話，活了數千載。」龍傲天長嘆一聲，「坐鎮天樞城，明面上是中州一方城主，暗地裡卻也一直在暗中防備、對抗那潛藏於中州的噬道天教總壇。可老夫終究只是防備——這數千載，老夫從未敢真正對那總壇動手。噬道教主那合體巔峰的意志，太可怕了，可怕到老夫連正視的勇氣都沒有。」\n\n「直到今日，老夫見到了你。」他望向墨飛，那古老的眸中重新燃起了光，「一個化神小輩，卻讓整個噬道天教如臨大敵。你身上那問道之光，是老夫等了數千載，才終於等到的答案。」\n\n「墨飛，」龍傲天望向他，那古老的眸中燃起一絲同仇敵愾的決意，「你重興問道、對抗噬道，老夫坐鎮中州、防備噬道。你我雖萍水相逢，卻是同道中人。」\n\n「這中州腹地噬道爪牙遍布。你身負五片信物，早已是他們必除之而後快的眼中釘。」他鄭重道，「今日你我既已相識，他日你在中州若遇噬道凶險，可持此物尋老夫。」\n\n他取出一枚鐫刻著天樞城徽記的玉符遞予墨飛，「天樞城億萬守軍，願為你重興問道之路添一份力。」\n\n「還有一事。」龍傲天話鋒一轉，「你既要在中州尋信物、對抗噬道，遲早要衝擊煉虛。天樞城最深處有一座靈峰，靈氣為中州之冠，又有老夫的合體威壓庇護，最宜閉關。你若不棄，儘管去用。」\n\n墨飛心中一暖。他自幼失怙，程伯走後，這世間肯這般真心相待、傾力相助的長輩，已是寥寥。眼前這位活了數千載的城主，那份同仇敵愾之下的提攜之意，讓他這一路孤軍奮戰的問道傳人，心底泛起一絲難得的暖意。\n\n「城主大恩，晚輩銘記於心。」墨飛鄭重接過那玉符。繼天南諸聖地、西陲萬劍門之後，中州合體境城主龍傲天這一尊通天的臂助，亦入了他對抗噬道的同盟。\n\n「多謝城主。」墨飛深深一揖，心底卻也清楚——這天樞城主深不可測，其相助固然是同仇敵愾，可這中州的水，只怕比他想像的還要深上百倍。\n\n離開城主府時，已是深夜。天樞城的萬家燈火在腳下鋪展成一片璀璨的星海，繁華喧鬧，一如尋常。可墨飛知道，在這片繁華之下，一張萬古經營的邪網，正靜靜潛伏，等著吞噬一切。\n\n「這一次，我不再是孤身一人了。」他望著手中那枚天樞城的玉符，心中默念。天南諸聖地、西陲萬劍門、如今又添了中州的龍傲天——問道的火種，正一點一點，匯聚成足以燎原的烈焰。\n\n「五片信物已聚。」墨飛望向那案上的信物，眸中戰意燃燒，「還有四片。」\n\n「而那潛藏於中州腹地的噬道總壇——」他望向那天樞城繁華之下的暗流深處，一字一頓，「離我越來越近了。」"}, {"t": "第五十三章 舊敵", "c": "得天樞城主龍傲天相助，墨飛一行於天樞城中暫得一處安穩的落腳之地。\n\n墨飛並未急於離開中州。\n\n其一，那第六片問道信物的道韻，經他推衍同樣指向中州某處；其二，這天樞城靈氣磅礴，又有城主龍傲天庇護，正是他潛心修行、衝擊煉虛的絕佳之地。\n\n化神之上，是為煉虛。踏入煉虛，方能粉碎虛空、御虛而行，實力再度脫胎換骨。而唯有一步步踏入更高之境，他才有底氣去面對那噬道教主那合體巔峰的恐怖存在。\n\n於是墨飛一邊修行、參悟五片信物的道韻，一邊以「推衍」暗中追尋那第六片信物、與那潛藏於中州的噬道總壇的線索。\n\n然而，樹欲靜而風不止。\n\n墨飛拍得問道信物、又得城主庇護一事，早已傳入那潛藏於中州的噬道天教總壇。而那總壇派出前來查探、追殺墨飛的爪牙之中，竟有一張墨飛無比熟悉的臉。\n\n——\n\n這一日，墨飛於天樞城一處坊市追尋第六片信物的線索。\n\n一道陰鷙而怨毒的目光，遠遠地鎖住了他。\n\n墨飛那「道眼」早已察覺。他循著那目光望去——只見人群之中一個身著黑袍、面容枯槁而陰狠的青年，正死死地盯著他。\n\n那青年，墨飛認得。\n\n「洛雲軒？」墨飛眸光一凝。\n\n正是那當年於問劍宗被廢修為、於洛家傾覆後不知所蹤的洛雲軒。\n\n只是此刻的洛雲軒早已不復當年那錦衣天驕的模樣。他面容枯槁，氣息邪異——顯然洛家傾覆之後，他竟投靠了噬道天教，以那邪異的「反問道」之法重新修煉，如今已恢復至元嬰之境。\n\n「墨飛……」洛雲軒一步步走出人群，那枯槁的臉上是刻骨的怨毒，「數年不見，你竟已化神。而我——」\n\n「我洛家因你而傾覆，我一身修為因你而盡毀！」他聲音嘶啞，怨毒滔天，「這血海深仇，我日日夜夜都不曾忘記！」\n\n「如今我投了噬道天教，重修邪法——」他獰笑，「便是為了有朝一日能親手將你這問道餘孽碎屍萬段！」\n\n墨飛望著眼前這因怨恨而墮入邪道、面目全非的昔日宿敵，心中並無多少波瀾，唯有一絲悵然。\n\n他還記得初入問劍宗時，那個錦衣華服、意氣風發的洛家天驕，是何等的不可一世。那時的洛雲軒，天賦絕頂、資源優渥，本該有一條坦蕩的青雲之路。可他偏偏將那份天賦，都用在了嫉妒與算計之上，一次次地對墨飛痛下殺手，最終親手將自己推入了深淵。\n\n「同樣是站在測靈石前，」墨飛心中默然，「你我走的，竟是截然相反的兩條路。」\n\n「洛雲軒，」他緩緩道，「你洛家的傾覆，是因你叔父勾結噬道、禍亂天南；你一身修為盡毀，是因你於秘境兩次三番對我痛下殺手，咎由自取。」\n\n「這些帳你不算在自己頭上，反倒遷怒於我，更墮入邪道——」墨飛眸光一冷，「你是越走越偏了。」\n\n「巧言令色！」洛雲軒厲聲暴喝，「今日狹路相逢，我便要替噬道天教取了你的項上人頭，奪了你的問道信物！」\n\n他周身邪異真元暴漲，一縷縷毀道噬道的黑氣朝墨飛絞殺而來。那邪法陰毒詭異，黑氣所過之處，連空氣都被腐蝕出一絲絲焦痕，直取墨飛的道基與神魂。這是「反問道」邪法最歹毒之處——它不與你比拚力量，而是要蝕你的道、亂你的心。\n\n可洛雲軒忘了，這世上剋制「反問道」最徹底的，正是墨飛的問道之道。\n\n可他忘了——他如今不過元嬰之境，而墨飛早已是化神後期，戰力逾二十萬。\n\n雲泥之別。\n\n墨飛甚至未曾動用全力。\n\n在他那昇華後的「觀道」之下，洛雲軒那自以為凶險的邪法，破綻脈絡盡數纖毫畢現，簡直如同孩童揮舞的木劍。他一縷純陽問道之光一揮，便將那絞來的滿天黑氣盡數消融，連他的衣角都未曾沾染。身形一晃，他已欺至洛雲軒身前，一記蘊著問道至理的、輕描淡寫的一擊，便將這昔日的宿敵重重擊飛，釘於地上，動彈不得。\n\n那份實力上的天塹之差，讓周遭圍觀的修士盡皆倒吸一口涼氣。\n\n洛雲軒難以置信地望著那如天塹般的實力差距，那枯槁的臉上血色盡褪：\n\n「怎……怎麼可能……你強大到如斯地步……」\n\n「洛雲軒。」墨飛居高臨下，望著這昔日的宿敵，眼神複雜，「你我自青石鎮測靈石前結怨至今。」\n\n「我本可取你性命。」他一字一頓，「可念在昔日同門一場——」\n\n「我再給你一個回頭的機會。」\n\n——\n\n「回頭？」洛雲軒卻發出一陣淒厲而瘋狂的大笑，「哈哈哈！墨飛，你以為我還回得了頭麼？」\n\n「我已入了噬道天教，修了反問道邪法。這邪法噬人道心、蝕人神魂——」他那枯槁的臉上是一片墮入深淵的絕望與癲狂，「我早已不是人了。」\n\n「我回不了頭，也不想回頭。」他獰笑，「我只想拉著你這害我家破人亡的仇人一同墮入地獄！」\n\n墨飛望著他那徹底墮入邪道、無可救藥的模樣，心底那一絲悵然終究化作了一聲長嘆。\n\n「既如此……」\n\n就在此時——\n\n一道森然的神識自遠處隔空傳來，帶著一絲冰冷的譏誚：「洛雲軒，一個廢物也敢妄動問道傳人？壞了教主的大計，你擔待得起？」\n\n那神識話音方落，一縷邪異的黑氣竟自洛雲軒的體內驟然暴起——那是噬道天教種在洛雲軒體內的禁制。\n\n「啊——！」洛雲軒慘嘶一聲，那元嬰道基在那禁制的反噬之下瞬間崩潰。他望著墨飛，眼中是無盡的怨毒、與一絲臨死前的清明：\n\n「墨飛……噬道天教……他們連自己人都……」\n\n話未說完，他便化作一灘被邪氣噬盡的枯骨，氣息斷絕。\n\n噬道天教那隱於暗處的大能，竟為不讓洛雲軒壞事，直接滅了自己人的口。\n\n墨飛望著那一灘枯骨，眸光森然。\n\n「連棋子都說棄就棄。」他一字一頓，「噬道天教果然是一群噬道、噬人、乃至噬己的邪祟。」\n\n洛雲軒這昔日的宿敵，就這樣以一種淒慘而可悲的方式落幕。他一生執著於天賦、執著於仇恨，最終墮入邪道，成了噬道天教棄若敝屣的一枚棋子。\n\n「這便是執迷於仇恨、墮入邪道的下場。」墨飛望著那枯骨，心中警醒。\n\n他並非全然無情。洛雲軒固然咎由自取，可將他一步步逼入這絕境、又在他還剩最後一絲用處耗盡時便毫不猶豫地滅口的，正是那噬道天教。它們給了洛雲軒力量與復仇的幻象，實則不過是將他當作一枚隨時可棄的棋子。\n\n「你們噬道天教，最擅長的，便是這般蠱惑人心。」墨飛望向那滅口神識傳來的方向，眸光森然，「以力量為餌，以仇恨為鉤，將一個個走投無路的人，拖入你們的深淵，再榨乾他們最後一絲價值。」\n\n「這樣的邪教，」他一字一頓，「若不將它連根拔起，這天地間，還會有多少個洛雲軒。」\n\n而墨飛也從洛雲軒臨死前的那一縷神識、那滅口的噬道大能的方位，捕捉到了一絲關於那潛藏於中州的噬道總壇的線索——\n\n那滅口的神識，來自天樞城西南方數千里外一處名為「萬骨淵」的凶險禁地。\n\n「萬骨淵……」墨飛眸光一凝，將這線索牢牢記下，「噬道天教在中州的一處分壇，只怕就藏在那裡。」\n\n墨飛親手將那一灘枯骨掩埋於坊市外的一處荒坡之下。無論生前如何，洛雲軒終究曾是問劍宗的同門，也終究只是這場萬古棋局裡，一枚被人利用又拋棄的可憐棋子。立一抔黃土，也算是他為這段糾纏了數年的恩怨，畫下的一個句點。\n\n「安息吧。」他低聲道，「你我之間的帳，到此為止。剩下的，是我與噬道天教的帳了。」\n\n「而第六片問道信物——」他以「推衍」一算，那信物的道韻竟也隱隱指向那萬骨淵的方向。\n\n「信物與噬道分壇同在一處。」墨飛眸中戰意燃燒，「看來這一趟萬骨淵，避無可避。」\n\n他望向那西南方那煞氣瀰漫的萬骨淵方向，握了握那六色道韻的斷刀：\n\n「不過——在那之前。」\n\n他收回目光，眸中是一片沉靜的篤定，「我需得先踏入煉虛。」\n\n「唯有煉虛之力，我才有底氣去闖那噬道分壇，去取那第六片信物。」\n\n天樞城的天穹暗流湧動。而墨飛重興問道的腳步，正一步一步朝著那潛藏於中州的噬道巢穴堅定逼近。"}, {"t": "第五十四章 煉虛", "c": "天樞城城主龍傲天，特意為墨飛闢出一處靈氣最為磅礴的閉關靈峰。\n\n墨飛於那靈峰之巔盤膝坐下，開始衝擊煉虛。\n\n煉虛是修士的第五道大關。踏入煉虛便能初步掌握「虛空」之力，粉碎虛空、御虛而行，神識更可遍布數百里。這是一道比化神還要凶險百倍的天塹——無數化神大能困於此關，窮盡壽元也未能寸進。\n\n可墨飛卻有著旁人難以企及的底蘊。\n\n他有五片問道信物溫養道基，有《問道錄》的無上道法，有那承接了問道道統的問道盤將修行的每一步化作清晰的階梯，更有那一路斬妖除魔、對抗噬道磨礪出的堅不可摧的道心。\n\n墨飛運轉《問道錄》，以五片問道信物為引，將體內磅礴的化神真元緩緩導向那煉虛的關隘。\n\n以「問道」證道，以「守護」為心，以那粉碎一切虛妄、直指大道的問道之意——他那一尊問道化神於識海之巔緩緩凝練、蛻變，那眉心的問道之光愈發璀璨、通透，竟開始隱隱勾勒出一絲「虛空」的玄奧道則。\n\n——\n\n煉虛的關隘，最兇險之處在於「粉碎虛空」。\n\n修士需以自身神識感悟那天地間無處不在、卻又無形無質的「虛空」道則，並將其粉碎、掌控。這一步稍有不慎，神識便會迷失於那無邊的虛空亂流之中，永劫不復。\n\n而墨飛卻有問道盤的「觀道」與「推衍」。\n\n那無形無質的虛空道則，在他那昇華後的「觀道」之下竟化作一道道可觀、可算的玄奧紋路。他如同一位最精湛的工匠，將那虛空道則的每一分結構都看得一清二楚，再以問道之力循著那紋路一絲一縷將其粉碎、掌控。\n\n「原來如此……這便是虛空之道。」墨飛闔目參悟，只覺得那一直玄奧難明的虛空道則在他眼前緩緩展開，變得清晰而可解。\n\n饒是如此，這一步依舊凶險萬分。當墨飛的神識真正探入那虛空亂流的最深處時，一股足以將神魂撕碎的狂暴之力驟然襲來，那無邊的虛空彷彿要將他的意識連根拔起、永遠吞噬。尋常修士到了這一步，多半便是神魂潰散、身死道消的下場。\n\n墨飛的問道盤在識海之中瘋狂運轉，一道道推衍的軌跡亮起又熄滅。他不與那狂暴之力硬抗，而是如順水行舟般，循著問道盤算出的、那唯一一條穩定的道則脈絡，一點一點地將自己的神識，錨定在那崩碎的虛空之中。\n\n他以「問道」解「虛空」，以「算」破「天塹」。那困住無數化神大能的煉虛關隘，在墨飛這問道之道面前竟被一絲一縷撬開。\n\n轟——\n\n隨著一聲彷彿響徹天地的清鳴，墨飛識海之中那一尊問道化神周身勾勒出的那一絲虛空道則驟然圓滿。他體內那橫亙已久的煉虛天塹轟然粉碎。\n\n【墨飛│煉虛一層│問道煉虛！】\n【粉碎虛空。神識遍布數百里；初掌虛空之力。】\n【戰力……突破五十萬！】\n【〔問道煉虛，以問道解虛空、以算破天塹。剋制噬道之力愈盛；問道之光直指大道〕】\n\n煉虛一層！戰力五十萬！\n\n墨飛緩緩睜開眼。那一睜眼，方圓數百里的天地萬物皆映入他的神識，那天地間無處不在的虛空之力，皆可為他所掌控。\n\n他只覺得自己仿佛與這方天地融為一體。那承接了問道道統的一雙眼睛、那問道盤的權能，在煉虛之力的加持下更是臻至了一個前所未有的通明之境。\n\n他終於自那個被判「無緣」的廢根，一步一步走到了這粉碎虛空、御虛而行的煉虛之境。\n\n——\n\n「煉虛……你竟真的破了煉虛。」\n\n一道蒼老而震撼的聲音響起。是聞訊趕來的城主龍傲天。\n\n他望著那破境而出、氣息已然可與煉虛老怪比肩的墨飛，那古老的眸中滿是難以置信的驚異：「數載之間自化神破至煉虛？這等修行速度……老夫活了數千載，也聞所未聞！」\n\n「城主謬讚。」墨飛淡淡一笑，「不過是仰仗問道傳承，一步一步走來罷了。」\n\n龍傲天望著墨飛，那古老的眸中，那最初的興味早已化作了鄭重的正視乃至一絲敬畏。\n\n他忽然明白為何噬道天教會如此忌憚這問道一脈的傳人。這「問道」之道剋制噬道邪法，而這問道傳人的成長之速更是恐怖如斯。\n\n「墨飛，」龍傲天鄭重道，「有你這問道傳人坐鎮中州正道、對抗噬道，便多了幾分勝算。」\n\n墨飛卻望向那西南方那煞氣瀰漫的萬骨淵方向，眸中戰意熊熊：\n\n「城主，晚輩煉虛已成。」\n\n「這萬骨淵的噬道分壇，那第六片問道信物——」他一字一頓，「是時候去取了。」\n\n——\n\n衝擊煉虛之後，墨飛於天樞城又盤桓半月，將那煉虛之力徹底穩固。\n\n半月之間，凌霜亦在那磅礴靈氣與墨飛問道之力的溫養下，一舉突破至了煉虛初期。二人並肩御虛而行，那患難與共、日益深厚的情誼也在這一次次並肩的精進中愈發濃烈。\n\n出關那日，凌霜正立於靈峰之下等他。晨光為她清冷的側臉鍍上一層柔和的金邊。\n\n「恭喜。」她輕聲道，「煉虛了。」\n\n「同喜。」墨飛望著她那已然臻至煉虛初期的氣息，唇角微揚，「這一路，你我竟是一同走到了煉虛。」\n\n凌霜聞言，那向來清冷的眸中泛起一絲極淡的笑意：「當年在問劍宗，你我不過是築基、金丹的後輩。如今並肩御虛而行，回頭想想，竟像做夢一般。」\n\n「不是夢。」墨飛望著她，一字一頓，「是你我一步一步，真真切切走出來的。」\n\n晨風拂過靈峰，兩人並肩而立，一時無言，卻自有一種患難與共、水乳交融的默契，在彼此心間流淌。\n\n石敢與柳輕眉亦收穫頗豐——石敢已元嬰後期，柳輕眉也踏入金丹。四人實力皆水漲船高。\n\n一切準備妥當。\n\n臨行前，天樞城主龍傲天將墨飛喚至城主府。\n\n「萬骨淵乃中州西南一處上古凶險禁地。」龍傲天神色凝重，「那裡煞氣滔天，白骨成淵，傳聞是上古一場大戰的埋骨之地。而噬道天教於中州的一處分壇，據老夫暗中查探，正潛藏於那萬骨淵的最深處。」\n\n「那分壇之中坐鎮的，」龍傲天一字一句，「是一位噬道天教的護法，喚作血屠。此獠煉虛巔峰，戰力恐近百萬，心狠手辣，殺人如麻。」\n\n煉虛巔峰，戰力近百萬。墨飛煉虛一層，戰力五十萬。\n\n又是一場越級的硬仗。\n\n「墨飛，」龍傲天鄭重道，「以你煉虛一層正面對抗血屠，勝算不足。老夫本欲親往，可老夫一離天樞城，只怕那潛藏於城中的噬道爪牙便要趁虛而入。」\n\n「城主不必親往。」墨飛卻坦然一笑，眸中是一片篤定，「這萬骨淵，晚輩去得。」\n\n「血屠戰力近百萬，遠在我之上。」他一字一頓，「可晚輩這一路，鬥的何曾是戰力？」\n\n「以問道之算破越級之敵——」他握了握那六色道韻的斷刀，眸中戰意凜冽，「這正是晚輩最擅長的事。」\n\n龍傲天望著墨飛那睥睨強敵的自信與無畏，那古老的眸中掠過一絲深深的讚許與期許。\n\n「好。」他鄭重道，取出幾枚珍稀的護道法器與療傷丹藥，「這些你帶著。萬事小心。」\n\n「若遇無法抗衡的凶險——」他一字一頓，「捏碎老夫給你的那枚傳訊玉符。老夫縱是拚了這天樞城，也會來接你。」\n\n墨飛心中一暖，鄭重接過，深深一揖。\n\n「城主放心。」他直起身，眸中戰意與篤定交織，「這一趟，晚輩不只要取回第六片信物，更要斬了那血屠，替萬骨淵那億萬被煉作怨魂的冤魂，討一個公道。」\n\n龍傲天望著他，那古老的眸中閃過一絲欣慰。他忽然覺得，師尊當年那句「等一個能終結噬道的人」，或許，真的等到了。\n\n「去吧。」他揮了揮手，「老夫在天樞城，等你的好消息。」\n\n——\n\n三日後，中州西南。\n\n墨飛一行御虛而行，抵達了那煞氣滔天的萬骨淵。\n\n眼前是一片望不到盡頭的巨大深淵。淵中白骨成山，煞氣如墨黑的潮水滾滾翻湧，那一縷縷怨毒的鬼哭之聲自淵底隱隱傳來，令人毛骨悚然。\n\n而那第六片問道信物的道韻，與那噬道分壇的邪異氣息，皆自那萬骨淵的最深處傳來。\n\n「信物與噬道分壇就在淵底。」墨飛以「道眼」遙遙掃過那深不見底的萬骨淵，眸光森然。\n\n「師姐、石大哥、清眉，」他回頭鄭重道，「淵中凶險莫測，血屠更是煉虛巔峰的強敵。你們跟緊我，以問道盤推衍的路徑而行，切莫妄動。」\n\n「這萬骨淵的噬道分壇——」他望向那滾滾的煞氣深處，眸中戰意燃燒，「我們闖進去。」\n\n一行人身形一晃，如幾道破開黑暗的問道之光，直直朝著那煞氣滔天、殺機四伏的萬骨淵淵底掠去。"}, {"t": "第五十五章 萬骨淵", "c": "萬骨淵名副其實，是一座由白骨與煞氣堆積而成的人間地獄。\n\n墨飛一行御虛深入。那滾滾的墨黑煞氣沾身便會侵蝕神魂，那淵中白骨所化的「骨煞傀儡」更是成群撲來。\n\n可這些於煉虛的墨飛而言，已不足為懼。他以《太一光明經》的純陽問道之光護持眾人，以「推衍」避開淵中的重重殺陣，那撲來的骨煞傀儡在他一縷問道之光下便成片消融。\n\n越往淵底，那怨煞便越是濃烈。淵壁之上，密密麻麻地嵌著無數森森白骨，那是萬古以來被血屠煉作怨魂的犧牲者，此刻皆化作淒厲的鬼哭，在幽暗中此起彼伏。一道道由白骨與怨氣凝成的骨煞傀儡，自那墨黑的煞海中不斷湧出，撲向墨飛一行。\n\n「莫要被那鬼哭亂了心神。」墨飛沉聲提醒。他一縷純陽問道之光化作屏障，將眾人籠罩其中，那侵蝕神魂的怨煞一觸即消。凌霜劍光如虹，柳輕眉靈藥護身，石敢那護道之軀更是硬生生撞開一條血路。\n\n一行人勢如破竹，直搗萬骨淵的最深處。\n\n淵底是一座以白骨與黑石築成的森然宮殿——正是噬道天教潛藏於中州的一處分壇。而那第六片問道信物的道韻，正自那宮殿的最深處傳來。\n\n「來得好快。」\n\n一道森然而嗜血的聲音自那宮殿之前響起。\n\n一名身著血色長袍、周身縈繞著滔天煞氣的魔頭緩步走出。他面容枯瘦，雙目赤紅，那一身煉虛巔峰的恐怖氣息混雜著無邊的血腥。\n\n【血屠│煉虛巔峰│戰力……約92萬】\n【〔噬道天教護法。以血煞之法，煉萬骨淵怨魂為己用。心狠手辣，殺人如麻〕】\n\n戰力九十二萬。墨飛，煉虛一層，五十萬。近乎一倍的差距。\n\n「問道餘孽，墨飛。」血屠那赤紅的眸中是毫不掩飾的殺意與貪婪，「教主早有法旨——取你項上人頭者重賞。」\n\n「更兼你身上那五片問道信物……」他舔了舔乾裂的嘴唇，「今日都將是我血屠的囊中之物！」\n\n墨飛卻並不慌亂。他那「推衍」之能早已將血屠周身的煞氣、那血煞之法的道則、乃至那分壇的陣勢盡數拆解、推演。\n\n【推衍：血屠以血煞之法煉怨魂為助。然——其血煞之力最忌『純陽問道』之光。且此分壇之陣，乃以萬骨怨煞為引，其陣眼……在血屠身後宮殿之中。】\n【破局：以問道之光克制血煞；引血屠離陣，破其陣眼，則其力大減。】\n\n「血屠，」墨飛緩緩握緊那六色道韻的斷刀，眸中戰意凜冽，「你以萬骨怨煞為助，可你忘了——」\n\n「我這問道之光，」他周身六色道韻與純陽問道之光驟然暴漲，「恰恰是你那血煞邪法的天敵！」\n\n一場煉虛之境的越級搏殺，於這萬骨淵的淵底森然宮殿之前轟然爆發。\n\n血屠一身血煞滔天。他驅使那萬骨淵的億萬怨魂化作漫天的血色煞氣，朝墨飛絞殺而來。那煞氣所過之處，連虛空都被腐蝕、扭曲。\n\n可那滔天的血煞一觸及墨飛那浩瀚的純陽問道之光，便如冰雪消融，成片潰散。\n\n「問道之光……果然剋制我的血煞！」血屠又驚又怒。\n\n它萬萬沒想到，自己苦煉萬載、視為無敵的血煞邪法，在這問道傳人面前，竟如陽光下的積雪般不堪一擊。那些被它奴役了千百年的怨魂，一旦觸及墨飛那純淨浩瀚的問道之光，非但不再聽它號令，反而如久旱逢甘霖般，發出一聲聲解脫的悲鳴。\n\n「你這些怨魂，本就是被你以邪法強行禁錮、日夜煎熬的可憐亡魂。」墨飛一邊揮刀消融血煞，一邊冷冷道，「今日，我便替它們，討一個超脫。」\n\n墨飛不與他硬拚。他以「推衍」將血屠的每一招都算到毫釐，以問道之光克制其血煞，更以「虛空」之力御虛而行，將血屠一步一步引離那以萬骨怨煞為引的陣法核心。\n\n「石大哥、凌霜師姐，拖住他！」墨飛傳音，「我去破那分壇陣眼！」\n\n血屠戰力雖近百萬，可那是倚仗這萬骨淵億萬怨魂加持的陣勢。一旦那陣眼被破、怨魂潰散，他的戰力便要大打折扣。\n\n凌霜的絕世劍道、石敢的元嬰蠻力，配合墨飛問道之算，將那血屠死死纏住；而墨飛則抓住那一絲空隙，身形一晃化作一道問道之光，直直朝著那分壇深處的陣眼掠去。\n\n——\n\n分壇深處，那以億萬怨魂凝聚的陣眼，一方散發著滔天血煞的血色骨幢赫然矗立。\n\n「就是它！」墨飛眸光一凝。\n\n他以「觀道」將那陣眼的道則看得一清二楚，再以那浩瀚的純陽問道之光凝於斷刀，一記蘊著問道至理的雷霆之擊，狠狠劈在那血色骨幢之上。\n\n那純陽問道之光正是血煞怨魂的天敵。那血色骨幢在這一擊之下轟然碎裂，那被禁錮於陣中的億萬怨魂得問道之光超度，發出一聲如釋重負的悲鳴，緩緩消散。\n\n陣眼一破，那籠罩萬骨淵的滔天血煞登時潰散大半。而那正與凌霜、石敢纏鬥的血屠，那倚仗萬骨怨煞的恐怖戰力也隨之一落千丈。\n\n「不！我的陣眼！」血屠慘嘶，那赤紅的雙目是難以置信的驚駭，「你竟破了我萬載煉成的血煞大陣？！」\n\n「血屠。」墨飛身形一晃已回到戰場，那六色道韻的斷刀直指血屠，「你倚仗萬骨怨魂，而我一縷問道之光便超度了它們。」\n\n「你那血煞邪法噬人、噬魂、噬道——」墨飛眸中寒光凜冽，「而我問道之道，正是要破你這萬古的邪法！」\n\n失了陣眼加持的血屠，此刻不過煉虛巔峰的尋常戰力。而墨飛，煉虛一層，戰力五十萬，配上那剋制血煞的問道之道、那精妙絕倫的配置——\n\n攻守之勢，逆轉。\n\n墨飛與凌霜聯手，那一人問道之算、一人劍道之絕，將那血屠死死壓制。血屠那滔天的血煞，在問道之光的克制下節節潰敗。\n\n「這一戰——」墨飛抓住血屠一招舊力用盡的破綻，將煉虛真元、問道至理盡數凝於斷刀，一記貫日長虹直取血屠眉心，「為萬骨淵億萬被你煉作怨魂的冤魂！」\n\n眼見大勢已去，血屠竟不惜自爆道基，將那萬骨淵殘存的怨煞盡數引動，化作一頭滔天的血色怨魔，發出最後一擊瘋狂的反撲。那怨魔張開血盆大口，攜著萬載的怨毒，朝墨飛與凌霜狠狠撲來。\n\n「雕蟲小技。」墨飛眸光一凝，並不退避。他將煉虛真元、問道至理與那八方信物的道韻盡數凝於斷刀，六色道韻暴漲到極致。\n\n「凌霜師姐，助我！」\n\n「好！」凌霜長劍一引，那化煞為劍的絕世劍意與墨飛的問道之光交融，化作一道貫日的長虹。\n\n那蘊著問道至理的一擊，破開那血色怨魔、也破開血屠倉促凝起的血煞護體，狠狠洞穿了他的眉心。\n\n血屠那殺人如麻的噬道護法，難以置信地睜大了赤紅的雙目，一身血煞潰散，龐大的身軀轟然倒地。\n\n一代噬道護法、血債累累的血屠，就此隕落於這萬骨淵的淵底。\n\n——\n\n血屠一死，那噬道分壇群龍無首，作鳥獸散。\n\n墨飛走入那森然的分壇深處，一眼便望見了——那散發著溫潤道韻的第六片問道信物，靜靜地供奉於一方血色的祭台之上。\n\n原來噬道天教早已尋得這片信物，卻因無法煉化、參透其中的問道道韻，只得將其供奉於此，以血煞鎮壓。\n\n「第六片信物。」墨飛緩步上前，將那片信物取入掌心。\n\n識海之中，六片問道信物遙相呼應，綻放出前所未有的璀璨道韻。那湮沒萬古的問道道統，已然重聚過半。\n\n而那六片信物的呼應，也讓墨飛窺見了更多——那關於噬道天教中州總壇的方位，那關於那最終之敵噬道教主的更多線索。\n\n墨飛立於那空蕩的祭台前，久久佇立。\n\n萬骨淵的怨煞已隨陣眼的破除而漸漸消散，那困了億萬冤魂的血色地獄，第一次透進了一縷天光。他彷彿聽見，那無數超脫的亡魂，在消散前發出的、如釋重負的嘆息。\n\n「安息吧。」他輕聲道，「你們的血債，我已替你們，向血屠討回了。」\n\n凌霜行至他身側，望著那愈發完整的問道道統，柔聲道：「六片了。離重鑄道統，越來越近了。」\n\n「是啊。」墨飛握緊那六片信物，眸中戰意與使命交織，「六片信物，還有三片。」\n\n「而那潛藏於中州的噬道總壇——」他以「推衍」將那方位牢牢鎖定，眸光森然，「已然在望。」\n\n萬骨淵的煞氣，隨著血屠的隕落、陣眼的破除緩緩消散。而墨飛重興問道的腳步，正一步一步朝著那噬道天教的心臟堅定逼近。"}, {"t": "第五十六章 聯盟", "c": "連破噬道兩壇、斬墨淵與血屠兩大護法、更集齊六片問道信物——墨飛之名，經此已響徹天南、西陲、中州三域。\n\n「問道傳人」，這面對抗噬道的旗幟愈發鮮明。\n\n而噬道天教於天南、中州接連失利，那潛藏萬古的邪教終於坐不住了。他們一面加緊籌謀那覆蓋三域的滔天陰謀，一面將墨飛這問道傳人列為教中第一必除之大敵。\n\n墨飛深知獨木難支。噬道天教底蘊通天，麾下煉虛、合體大能不知凡幾。若不能凝聚天下正道之力，僅憑他一人，縱是重鑄道統也難以與之抗衡。\n\n於是，在天樞城主龍傲天的牽線之下，墨飛以問道傳人的身份，向天南諸聖地、西陲萬劍門、中州各大正道宗門發出聯名——共結一個對抗噬道天教的「問道同盟」！\n\n那一封封聯名的傳訊，如星火飛向三域。而那些深受噬道之害、又親眼見證墨飛屢破噬道的正道勢力，紛紛響應。\n\n天南諸聖地的化神大能、西陲萬劍門劍無塵、中州天樞城龍傲天……三域無數頂尖的正道強者齊聚天樞城，共商抗擊噬道之大計。\n\n「諸位道友，」議事之上，墨飛越眾而出，那煉虛的氣度睥睨全場，「噬道天教覆滅道統、禍亂天地，乃我輩共同之敵。」\n\n「而據六片問道信物所示——那噬道教主是一個活了萬古、以吞噬天下道統為食的合體巔峰魔頭。他的目標絕不止問道一脈一個道統。」\n\n「他要吞噬的，是這天地間一切的道統與傳承！」墨飛一字一句，聲如洪鐘，「換言之——在座諸位所在的每一個宗門、每一份傳承，都是他砧板上的魚肉！」\n\n此言一出，滿座皆驚，繼而是一片同仇敵愾的凜然。\n\n在座之中，不乏當年曾對這「鄉野出身」的問道傳人心存輕慢的名門大能。可這一路，墨飛以化神撼化神、斬墨淵於天南、破血屠於萬骨淵、力抗噬道護法而不亡——一樁樁、一件件，早已將那些輕慢，盡數化作了心悅誠服的敬重。\n\n更有那些曾被噬道天教屠戮得幾近滅門的中小宗門，此刻望向墨飛的眼中，是近乎孤注一擲的信任。噬道天教這萬古邪教，太可怕了，可怕到讓他們幾乎失去了反抗的勇氣。而墨飛與他那面「問道」的旗幟，是他們在無邊黑暗中，終於看見的一縷光。\n\n「問道傳人所言極是！」劍無塵長身而起，「噬道天教人人得而誅之！我萬劍門願奉問道傳人號令，共禦噬道！」\n\n「我天南諸聖地亦然！」\n\n「天樞城願為同盟馬前卒！」\n\n一時間，三域正道群情激昂。天南聖地的化神、西陲萬劍門的劍修、中州各宗的掌教，這些平日裡各據一方、甚少往來的頂尖勢力，此刻竟因同一個目標，摒棄前嫌，聚於一堂。這是萬古以來，正道對抗噬道，第一次真正意義上的合縱連橫。\n\n「問道同盟」就此正式結成！而墨飛這問道傳人眾望所歸，被推舉為這問道同盟的——盟主。\n\n一個曾被判「無緣」的廢根少年，如今竟成了凝聚三域正道、對抗萬古邪教的一面旗幟，一位盟主。\n\n墨飛望著滿殿因他一言而群情激昂的頂尖強者，心中並無多少得意，反倒生出一種沉甸甸的重量。這一面旗幟之下，聚攏的是三域無數人的性命與期望；他每一個決斷，都將牽動無數同道的生死。\n\n「這副擔子，我接了。」他在心底默念，「程伯用命護下的火種，我不但要讓它燒起來，還要讓它，護住每一個願意隨我而戰的人。」\n\n他忽然想起青石鎮那盞無人為他點亮的燈。如今，他要做的，是替這天地間所有被噬道陰影籠罩的人，點亮一盞燈。\n\n——\n\n問道同盟既成，墨飛便將那追尋其餘信物、探查噬道總壇之事，與同盟諸勢力共同推進。\n\n而那第七片問道信物的道韻，經墨飛反覆推衍，指向了一處令在座諸多大能都神色凝重的所在——\n\n「歸墟秘境。」龍傲天緩緩道出那四個字，眼中掠過一絲忌憚。\n\n「歸墟秘境？」墨飛問道。\n\n「那是這方天地最為古老、也最為凶險的秘境之一。」劍無塵接口，「傳聞歸墟乃是上古大道崩碎之地。其中蘊藏著無數上古傳承，卻也充斥著足以湮滅合體大能的恐怖凶險。」\n\n「更關鍵的是——」龍傲天神色凝重，「據老夫所知，那歸墟秘境的深處隱藏著一段關乎問道一脈與噬道天教那萬古之戰的真相。」\n\n墨飛心頭一震。\n\n問道一脈與噬道天教的萬古之戰的真相！那正是他追尋已久的答案。\n\n「第七片信物藏於歸墟。」墨飛眸光一凝，「而歸墟深處更藏著問道與噬道萬古之戰的真相。」\n\n「凶險？」墨飛聞言，唇角反而揚起一絲淡淡的弧度，「諸位前輩，這一路，我墜過崖、闖過秘境、入過幽冥墟、下過萬骨淵。若因『凶險』二字便退卻，問道一脈的道統，早在萬古之前便該徹底斷絕了。」\n\n「何況，」他眸光一凝，「那歸墟深處藏著的，不只是一片信物，更是問道與噬道萬古之戰的真相。那真相，關乎我如何真正戰勝噬道，關乎這重興問道之路，究竟該如何走到盡頭。」\n\n「這歸墟秘境——」他望向那同盟諸位凝重的大能，一字一頓，戰意燃燒，「我勢必要走一趟。」\n\n「而這一趟——」他望向凌霜，望向那滿殿願隨他出生入死的同盟諸強，眸中是凝聚了三域正道之力的決意，「不再是我一人獨行。」\n\n自青石鎮墜崖得盤、孤身一人踏上修行路，到如今身後聚起三域正道——這一句「不再是我一人獨行」，墨飛說得格外鄭重。他知道，這條重興問道的路，從來不是他一個人的路，而是所有不願坐視這方天地大道被吞噬的人，共同的路。\n\n——\n\n半月之後，問道同盟遴選精銳，組成一支探索歸墟秘境的隊伍。\n\n領隊的是墨飛，同行的有凌霜、石敢、柳輕眉，更有天樞城主龍傲天親自坐鎮，以及萬劍門、諸聖地派來的數位煉虛、化神大能。\n\n如此陣容，縱是面對歸墟的古老凶險，也多了幾分底氣。\n\n歸墟秘境的入口位於中州東海之濱，一處永恆籠罩著濃霧的神秘海域。\n\n當墨飛一行以同盟尋得的古老秘鑰，開啟那通往歸墟的虛空裂隙時——一股古老而蒼茫、彷彿來自大道崩碎之初的恐怖氣息撲面而來。\n\n那虛空裂隙之後，是一片深不見底的、蒼茫的灰白。濃霧翻湧，隱隱有大道崩碎後殘留的、玄奧而危險的道音在其間迴響，聽得人心神搖曳。饒是同行的幾位煉虛、化神大能，望著那裂隙，也不由得屏住了呼吸。\n\n「都小心。」墨飛沉聲道，那煉虛神識遍布四周，「歸墟之中凶險莫測。以問道盤推衍的路徑而行，切莫走散。」\n\n一行人魚貫踏入那通往歸墟的虛空裂隙。\n\n白光一閃。\n\n當那白光散去，眼前是一片令眾人皆屏息的奇異天地——\n\n那是一片破碎的天地。殘缺的大陸漂浮於無邊的虛空之中，崩碎的大道法則化作一道道璀璨而恐怖的「道則亂流」，於虛空中肆意穿梭，那空氣之中瀰漫著一股蒼茫而古老、彷彿凝固了萬古歲月的氣息。\n\n這便是歸墟，上古大道崩碎之地。\n\n「好一片破碎的天地……」饒是見多識廣的龍傲天，望著眼前的景象也不由得動容。\n\n墨飛以「觀道」掃過這片破碎的天地，心頭卻是一凜——那虛空中肆意穿梭的「道則亂流」，每一道都蘊含著足以湮滅煉虛乃至合體大能的恐怖威能。\n\n「這裡的每一道亂流，都是催命的符咒。」墨飛眸光凝重，「唯有以問道盤推衍亂流的軌跡，尋那安穩的縫隙而行。」\n\n他那承接了問道道統的「推衍」之能，在這崩碎的大道法則之前發揮到了極致。那看似雜亂無章、殺機四伏的道則亂流，在他眼中化作一道道可觀、可算的玄奧軌跡。\n\n「跟緊我。」墨飛一馬當先，循著那問道盤推衍出的安穩縫隙，帶領眾人在那殺機四伏的道則亂流之中小心翼翼地穿行。\n\n「第七片信物，與那問道與噬道萬古之戰的真相——」他望向那歸墟更深、更古老的深處，眸中是探尋萬古的熾熱，「就在這破碎天地的最深處。」\n\n歸墟的亂流璀璨而恐怖。而墨飛一行正如一群破開大道崩碎之謎的問道者，朝著那湮沒了萬古真相的歸墟深處堅定行去。"}, {"t": "第五十七章 萬古真相", "c": "歸墟深處，越往裡走，那古老而蒼茫的氣息便越是濃郁。\n\n墨飛以問道盤推衍著道則亂流的軌跡，帶領眾人穿過一片又一片破碎的漂浮大陸。沿途，他們見到了無數上古文明的遺跡——殘破的宮殿、崩斷的巨劍，乃至一具具早已化為森森白骨的上古大能的遺骸。\n\n「這歸墟……究竟曾發生過怎樣的大戰？」饒是龍傲天，望著那遍地的上古遺骸也心生寒意。\n\n墨飛卻在那越來越濃的問道信物道韻牽引下隱隱感應到——這歸墟的最深處，那關於問道與噬道萬古之戰的真相，正緩緩向他揭開。\n\n穿過最後一片殺機四伏的道則亂流，眼前豁然開朗。\n\n那是一方位於歸墟最中心的、相對安穩的古老大殿。大殿之上，一方散發著溫潤道韻的問道信物靜靜懸浮；而在那信物的周圍，環繞著一圈早已斑駁的、記載著上古往事的道韻壁畫。\n\n當墨飛靠近的剎那，識海中的六片信物與那大殿之上的第七片遙相呼應。那環繞四周的道韻壁畫也隨之緩緩亮起，將一段湮沒了萬古的真相映入墨飛的眼簾——\n\n那是問道一脈與噬道天教那萬古之戰的全貌。\n\n墨飛看見了。\n\n上古之時，問道一脈以「觀天地、算大道」證道成聖，乃是天地間最為昌盛的道統之一。問道先賢們參透萬物之理、丈量大道之奧，本欲以這問道之光引領眾生共證大道。\n\n然而——就在問道一脈即將參透那天地間最為核心的「大道本源」之際，一個恐怖的存在出現了。\n\n那便是噬道。\n\n「噬道」並非一個尋常的魔頭。它是一縷誕生於大道崩碎之初的、與「證道」截然相反的意志——它信奉「毀道、噬道」，以吞噬天地間一切的道與傳承來壯大自身，妄圖將這方天地的一切大道盡數吞噬，化為它一己的養料。\n\n而問道一脈那即將參透「大道本源」的無上道統，恰恰是噬道眼中最為肥美的獵物。\n\n於是，一場關乎天地大道存續的萬古之戰爆發了。\n\n問道一脈的萬千先賢，與那噬道意志及其麾下的噬道大軍，於這天地之間展開了一場慘烈到極致的大戰。\n\n壁畫之上，那一幕幕悲壯的畫面，在墨飛眼前緩緩流轉：無數身著素袍的問道修士，以觀天算地之能布下浩大的問道之陣，將那墨黑的噬道意志一次次逼退；而那噬道意志則化作滔天的黑潮，吞噬著一位又一位先賢的道統與神魂，每吞噬一分，便壯大一分。天地為之變色，大道為之崩鳴。先賢們明知不敵，卻無一人後退——因為他們守的，不是自己的性命，而是這方天地的大道本源。\n\n這歸墟，正是那萬古之戰最為慘烈的主戰場；這破碎的天地、遍地的遺骸，皆是那場大戰留下的痕跡。\n\n然而，問道一脈終究還是敗了。\n\n那噬道意志太過強大、太過古老。問道先賢雖重創噬道，卻也被噬道覆滅、屠戮，幾近滅絕。而那噬道意志，更以吞噬問道道統之力凝聚實體，化為了那後世所稱的——噬道天教教主。\n\n「原來如此……」墨飛望著那壁畫，只覺得一股滔天的悲愴與恨意自心底湧起，「噬道教主並非凡人得道。它本身，便是那誕生於大道崩碎之初的、『毀道噬道』的恐怖意志所化。」\n\n「而我問道一脈——」他眸中含淚，「是為了守護這方天地的大道，才與那噬道意志死戰萬古，幾近滅絕！」\n\n那一刻，墨飛終於徹底明白了「問道」二字的分量。它從來都不只是他賴以逆襲、以弱勝強的一雙眼睛、一套算法。它是萬千先賢以性命守護的、這方天地大道的希望。他所繼承的，不只是一份能看見數值的傳承，更是一份沉甸甸的、跨越萬古的使命。\n\n程伯隱姓埋名數十載，龍傲天燃盡數千年道行——原來，他們守護的，從來都是同一樣東西。\n\n那壁畫的最後，一位問道先賢的殘念留下了一段最終的話語——\n\n【問道傳人……噬道未滅，乃因它是大道崩碎之『反』，不死不滅。】\n【欲真正勝噬道，非滅之，而可——需以問道之光重證大道本源，以『證道』之圓滿補那大道之『崩碎』。】\n【當大道不再崩碎，那噬道意志便失其根；問道之光終將照破萬古黑暗。】\n【集齊九片信物，重鑄問道道統，證那大道本源——此方為問道傳人真正之使命。】\n\n墨飛緩緩闔上眼，那一顆心被這萬古的真相震得久久不能平靜。\n\n原來他這問道傳人的使命，遠比他想像的還要宏大、還要沉重。\n\n那不只是為問道一脈復仇，不只是覆滅噬道天教，而是——重證那天地的「大道本源」，補全那崩碎的大道，從根本上斷絕那噬道意志的根。\n\n「守護這方天地的大道。」墨飛睜開眼，那眸中星河浩瀚，是前所未有的清明與使命，「這便是問道一脈萬古以來真正的道。」\n\n「程伯，先賢們——」他望向那天地深處，一字一頓，「這萬古的使命，我墨飛接下了。」\n\n他伸手，將那大殿之上的第七片問道信物取入掌心。\n\n七片信物遙相呼應，那重鑄的問道道統已過七成。而那通往大道本源、通往終結噬道的道路，也在這歸墟深處的萬古真相之中第一次完整地鋪展在了墨飛的面前。\n\n只是——他尚不知，就在他參透真相、取得信物的同時，那歸墟的虛空之外，一道恐怖到足以湮滅一切的合體巔峰氣息，正循著那七片信物共鳴的道韻悄然逼近。\n\n噬道教主麾下最強的大護法之一，已然尋至歸墟。\n\n——\n\n「好一個問道傳人。連歸墟深處的秘辛都被你窺破了。」\n\n一道古老、森然、彷彿蘊藏著無盡毀滅之力的聲音，自大殿之外緩緩響起。\n\n墨飛心頭劇震，那「道眼」掃過殿外——\n\n一道通體縈繞著墨黑死氣、氣息恐怖到令整片歸墟都為之顫抖的黑袍身影緩步走入。他周身那滔天的威壓，竟比那天樞城主龍傲天還要恐怖數倍。\n\n【噬道天教·大護法·噬天│合體巔峰│戰力……深不可測，約五百萬！】\n\n合體巔峰！戰力五百萬！\n\n那是比龍傲天還要恐怖的、真正站在這方天地頂端的存在。\n\n「噬天大護法。」龍傲天臉色劇變，一步擋在墨飛身前，那合體威壓轟然迸發，「你竟親自來了。」\n\n「龍傲天。」那名為噬天的大護法漠然掃了他一眼，「你一個合體初期，也敢擋本座？」\n\n「教主有令——」噬天那墨黑的眸子死死鎖住墨飛，與他懷中的七片信物，「問道餘孽墨飛，連同他身上的問道信物，一併帶回。」\n\n「教主早已算到，你集齊信物、參透真相之後，必會來這歸墟。」噬天那墨黑的眸子裡沒有絲毫情緒，彷彿在陳述一件再尋常不過的事，「本座在此，等你多時了。萬古以來，問道一脈的餘火，一次次被撲滅，又一次次死灰復燃。這一次，教主要親眼看著，這最後一縷火種，連同你集齊的信物，一併回到我噬道天教的掌中。」\n\n「至於爾等問道同盟的螻蟻——」他那滔天的死氣威壓鋪天蓋地鎮壓而下，「盡數屠戮！」\n\n歸墟深處，那安穩的大殿，在那合體巔峰的滔天威壓之下轟然崩塌。\n\n那滔天的死氣威壓一落，同行的幾位煉虛、化神大能，登時被壓得跪倒在地，臉色慘白，連站起的力氣都沒有。那是煉虛、化神與合體巔峰之間，根本無法逾越的鴻溝。\n\n墨飛護住懷中的七片信物，望著那恐怖到令人絕望的噬天大護法，那煉虛的身軀在那五百萬戰力的威壓之下搖搖欲墜。他甚至能清晰地感覺到，只需噬天一個念頭，便能將在場所有人盡數碾成齏粉。\n\n可他的眸中，卻無半分屈服。他一手護住信物，一手死死撐住那快要跪下的膝蓋，硬生生，在那滔天的威壓之下，站得筆直。\n\n「合體巔峰，五百萬……」他眸光森然，卻無半分退意，「這便是噬道天教真正的底蘊。」\n\n「龍城主，」他沉聲道，「護好眾人。這歸墟亂流之中，或有一線生機。」\n\n而那噬天大護法那毀滅一切的一掌，已然攜著滔天死氣，朝著墨飛與龍傲天轟然拍落。\n\n墨飛的問道盤在識海之中飛速運轉，將這絕境的每一分生機、每一絲變數，盡數推演。合體巔峰，戰力五百萬——正面對抗，必死無疑；可懷中的七片信物、身後的同盟諸人，他一樣都不能捨。\n\n「總有一條路。」他死死盯著那壓下的滔天死氣，在心底冷冷盤算，「哪怕只有一線，我也要把它算出來。」\n\n一場於歸墟深處、關乎問道同盟存亡的絕境之戰，就此爆發。"}, {"t": "第五十八章 斷後", "c": "噬天大護法那毀滅一切的一掌，攜著滔天死氣，轟然落下。\n\n那一掌之下，歸墟深處的虛空都被壓得扭曲、塌陷，連那穿梭不休的道則亂流，都為之一滯。這是合體巔峰、戰力五百萬的一擊，足以將尋常合體大能連人帶魂碾成齏粉。\n\n龍傲天那合體初期的浩瀚真元盡數爆發，一掌硬接！\n\n轟隆——！\n\n兩股合體之力相撞，那歸墟深處的破碎大陸都為之崩裂。方圓百里的漂浮殘陸盡數化為齏粉，狂暴的餘波如颶風般席捲開來。龍傲天被那噬天五百萬的恐怖威能震得倒退百丈，一口鮮血噴出，那身玄金龍袍瞬間破碎，露出的臂膀上龜裂出一道道駭人的血痕。\n\n合體初期與合體巔峰之間，那鴻溝同樣深不可測。\n\n「就憑你，也想擋本座？」噬天漠然，那墨黑的眸子裡沒有絲毫波瀾，彷彿方才那一擊於他不過是隨手拂塵。他一步踏出，那滔天的死氣再度凝聚，鎮壓而下。\n\n墨飛立於龍傲天身後，那「推衍」之能已將這絕境算得清清楚楚。他的問道盤在識海之中瘋狂運轉，一條條慘白的推衍結果閃過，最終只匯成一片冰冷的絕望——\n\n【噬天：合體巔峰，戰力五百萬。正面對抗：同盟諸人必全滅。】\n【唯一生機：歸墟道則亂流。以問道盤推衍亂流軌跡，引噬天入亂流最亂之處，趁隙遁走。】\n\n墨飛的指尖，微微發顫。\n\n不是因為懼怕，而是因為他算到的那條「唯一生機」，需要有人留下來，把噬天死死拖在原地，替其餘人爭出鑽入亂流的一瞬。而那個留下的人，必死無疑。\n\n「城主！眾位前輩！」墨飛暴喝，那煉虛神識瞬間將問道盤推衍出的逃生路徑，一條條標記、傳遍在場每一個人的識海，「隨我入亂流！以問道之光護身，循我標出的縫隙而行，一步都不能錯！」\n\n歸墟的道則亂流，於尋常大能是催命的絕地。那一道道璀璨的亂流之中，蘊藏著大道崩碎的殘暴之力，連合體巔峰的噬天，都需避讓三分。可於能看穿亂流軌跡的墨飛而言，那卻是唯一的生機——最凶險的地方，恰恰是他們最安全的屏障。\n\n只是要鑽進去，得先有人擋住噬天那一瞬的追擊。\n\n龍傲天一聽墨飛的呼喝，便立刻明白了他的用意。這位活了數千載的老人，那被血染紅的臉上，竟緩緩綻開一絲釋然的笑意。\n\n「墨飛，你帶眾人先走！」他抹了把嘴角的血，那古老的眸中是決絕的悲壯，「這噬天合體巔峰，非我拚死纏住，你們無法脫身！」\n\n「城主——！」墨飛心頭劇震，「不行！要走一起走，我另算路徑——」\n\n「莫要婦人之仁！」龍傲天猛地斷喝，那聲音裡是不容置疑的威嚴，「你以為老夫算不明白這筆帳？你身負七片信物，身負問道復興，身負重證大道、斷絕那噬道意志之根的萬古使命！這天地間，能走完那條路的，只有你一個！」\n\n「你若死在這裡，」他一字一頓，「問道一脈萬古的火種，才是真正地，滅了。」\n\n墨飛怔在原地，喉頭像是被什麼堵住，一個字也吐不出來。\n\n龍傲天卻不再看他，只將目光投向那步步逼近的噬天，那古老的眸中翻湧起數千載的滄桑。\n\n「老夫這條命，數千載，早已賺夠了。」他緩緩道，聲音輕得像是自語，「當年師尊死在噬道天教手裡，老夫窩囊了一輩子，坐鎮天樞城，明裡是一方城主，暗裡卻只敢縮著防備，連替師尊報仇的膽子都沒有。」\n\n「這一輩子，活得太小心了。」他忽然笑了，那笑意裡有一種卸下重擔的輕鬆，「臨了臨了，能為問道復興、為這方天地的大道，堂堂正正地斷這一次後——」\n\n「老夫，死而無憾。」\n\n言罷，龍傲天不再遲疑。他那合體初期的全部真元、乃至畢生積攢的道行，在這一刻盡數點燃、燃燒！\n\n他周身爆發出一輪璀璨到極致的合體之光，那光芒之盛，竟將這片幽暗的歸墟深處，照得亮如白晝。他整個人化作一頭撲火的飛蛾，帶著那玉石俱焚的決絕，狠狠地、死死地纏住了那恐怖的噬天大護法。\n\n「走！」他用那燃燒生命的最後一喝，為墨飛一行，硬生生撕開了一線逃生的契機。\n\n墨飛眼眶赤紅，淚幾乎奪眶而出。可他知道，此刻任何一絲猶豫，都是對龍傲天這壯烈犧牲的辜負。要對得起這條命，他就必須活著走出去。\n\n「城主大恩，墨飛沒齒難忘——」他嘶聲一喝，那聲音已然哽咽，卻仍死死護住凌霜、石敢、柳輕眉與同盟諸人，循著問道盤推衍的亂流縫隙，亡命遁走！\n\n那噬天大護法被龍傲天燃燒生命的拚死一擊死死纏住，一時竟真的抽不開身。而墨飛一行則如幾道破開絕望的問道之光，鑽入那殺機四伏、卻也唯一通往生機的道則亂流之中。\n\n那亂流之中，每一道崩碎的大道之力擦身而過，都足以將人瞬間絞成飛灰。墨飛神識全開，問道盤將每一道亂流的軌跡都算到毫釐，一聲聲「左！停！上三丈！」的指令急促地傳遍眾人。凌霜緊隨其後，以劍意護住斷尾；石敢那護道之軀替眾人擋下四濺的餘波；柳輕眉則將療傷的靈藥一枚枚喂進重傷者口中。一行人險之又險地在死亡的縫隙間穿行。\n\n一道暗金色的道則亂流毫無徵兆地自斜刺裡暴漲，直直朝隊伍中一名同盟的化神長老絞去。那長老修為不俗，卻哪裡見過這等大道崩碎之力，竟一時僵在原地。千鈞一髮之際，墨飛神識暴漲，問道盤瞬間推衍出那亂流下一息的走向，斷刀一揮，一縷純陽問道之光精準地劈在那亂流的「節點」之上，將它硬生生逼偏了半寸——恰恰半寸，那長老貼著死亡擦身而過，冷汗已濕透了整件道袍。\n\n「不要停！」墨飛嘶聲喝道，聲音裡是滴血般的焦灼，「這裡的每一道亂流都在變，慢一息，就出不去了！」\n\n眾人不敢有絲毫遲疑，咬牙跟緊那一道六色道韻的流光。歸墟深處的每一寸虛空，都彷彿在崩塌、在吞噬；那穿梭的亂流如萬千把無形的巨刃，將這片天地反覆切割。若非墨飛那承接了問道道統的「觀道」與「推衍」，換作任何一位大能領路，這一行人，怕是早已盡數埋骨於此。\n\n「想跑？！」身後，噬天狂怒的咆哮傳來。他終於察覺墨飛等人遁入亂流，欲要追擊，可那燃燒了生命的龍傲天如附骨之疽，將他死死拖住，一雙手臂竟死死扣住噬天的身軀，任那滔天死氣一寸寸將自己吞噬，也絕不鬆開分毫。而那恐怖的道則亂流，更是連他合體巔峰都需避讓，一時竟真追之不及。\n\n墨飛一行在那亂流之中穿行了不知多久，終於望見了歸墟出口那一線微光。而身後——\n\n那燃燒了畢生道行、以合體之軀斷後的天樞城主龍傲天，在拖住噬天足足一炷香、為墨飛一行爭取到足夠的逃生之機後——那璀璨的合體之光，終於緩緩黯淡、消散。\n\n而在生命燃盡的最後一瞬，龍傲天的識海裡，掠過的並非數千載的權勢與風光，而是少年時師尊臨終前那句未曾兌現的囑託。他彷彿又回到了那個站在師尊墳前、握緊了拳卻不敢動彈的青年。這一次，他不再退縮了。\n\n「師尊……」他無聲地笑了笑，「弟子……來遲了。可弟子，終究，還是替您，做了一件對得起這身道行的事。」\n\n一代坐鎮中州數千載、暗中對抗噬道一生的合體大能，天樞城主龍傲天，為了問道的復興、為了這方天地的大道，壯烈隕落於這歸墟深處。他至死，臉上都帶著那卸下重擔般的、釋然的笑意。\n\n——\n\n當墨飛一行終於衝出歸墟、脫離險境時，個個皆重傷垂危，靈舟之上一片死寂。\n\n沒有人說話。方才那一場絕境，那位老人燃燒生命的背影，重重地壓在每一個人的心頭。\n\n墨飛握著那七片問道信物，立於舟頭，望向歸墟的方向，淚無聲滑落。\n\n程伯為護他而死，倒在那濟生堂的廢墟裡；如今，龍傲天又為護問道復興而亡，燃盡在那歸墟的深處。一位又一位，為問道、為這方天地的大道慷慨赴死的前輩。他們本可以不必如此——程伯本可以繼續做他的鎮醫，龍傲天本可以繼續做他的城主，安穩地度完餘生。可他們都選擇了，把生的希望，交到他墨飛的手上。\n\n「城主……」墨飛一字一頓，那眸中的悲痛，一分一分地，淬鍊成了焚天的決意與滔天的恨意，「你的犧牲，你們每一個人的犧牲，我墨飛，都記下了。」\n\n「噬道天教，噬天大護法，還有那躲在最深處、以吞噬道統為食的噬道教主——」他望向那天地深處那潛藏著萬古邪祟的方向，一字一頓，聲音冷得像歸墟的寒霜，「這一筆又一筆的血債，我會以重證的大道之光，親手向你們討回。」\n\n「而重證大道的第一步——」他望向那識海中七片遙相呼應的信物，眸中戰意如火，「便是儘快突破合體，集齊最後兩片信物，重鑄問道道統！」\n\n凌霜走到他身側，默默握住了他那顫抖的手。她什麼也沒說，只是那清冷的眸中，同樣燃著並肩到底的決意。\n\n歸墟一役，問道同盟痛失龍傲天這一員大將，元氣大傷。可那重興問道、對抗噬道的烽火，卻在這一次次的犧牲與悲痛之中，燒得愈發熾烈、愈發不可撲滅。"}, {"t": "第五十九章 合體之志", "c": "天樞城，一片縞素。\n\n那座曾經繁華喧鬧、萬族雲集的中州第一大城，此刻家家戶戶門前皆掛起了白幡。街巷之上，往來的修士神情肅穆，人人腰間繫著一縷素麻。龍傲天，這位坐鎮天樞城數千載、庇護了一城生靈、暗中對抗噬道一生的合體大能，於歸墟斷後、壯烈隕落。消息傳回，整座城池，乃至整個問道同盟，皆為之悲慟。\n\n沒有屍骨可還——那位老人，連同他畢生的道行，一併燃盡在了歸墟的深處。\n\n墨飛親手為龍傲天，於天樞城後山那座他生前最愛登臨遠眺的靈峰之巔，立下了一座衣冠冢。冢中所葬，只有那件被墨飛小心收殮的、殘破的玄金龍袍一角。\n\n葬禮那日，天樞城億萬生靈，自發地朝著後山的方向，遙遙跪拜。而墨飛，在那新立的墓碑前，長跪不起。\n\n程伯、龍傲天……一位又一位，為問道、為這方天地的大道，慷慨赴死的前輩。他們的面容在墨飛的腦海中一一浮現——程伯替他拭去眼角淚水時那枯瘦的手，龍傲天燃燒生命時那釋然的笑意。這些畫面，如一塊塊沉重的巨石，壓在他的心頭，壓得他幾乎喘不過氣。\n\n可也正是這一塊塊巨石，將他那顆「以守護為心」的道心，淬鍊得愈發堅硬、愈發澄澈、愈發堅不可摧。\n\n「城主，」他一字一頓，聲音沙啞，「你以合體之軀斷後，為我爭得的這條命、這七片信物，我墨飛，絕不會辜負。」\n\n「噬天大護法，戰力五百萬，合體巔峰。」他望向那歸墟的方向，眸光森然，「以我如今煉虛之境，尚不能與之匹敵。歸墟一戰，若非你以命相搏，我等，早已盡數埋骨於那道則亂流之中。」\n\n「可——」他緩緩起身，握緊了那六色道韻的斷刀，眸中戰意如淵底之火，「這筆血債，我遲早要親手討回。而要討回它，我必須，突破合體。」\n\n墓前不遠處，石敢與柳輕眉靜靜站著。那憨厚的漢子紅著眼眶，那雙曾在雜役堂替墨飛扛過無數重活的粗糙大手，此刻正死死攥著，指節發白。\n\n「墨兄弟，」石敢甕聲甕氣地開口，聲音裡帶著哽咽，「俺沒什麼本事，境界也跟不上你。可俺這條命，是你當年在雜役堂拉拔起來的。往後不管去哪，不管多凶，俺石敢……都跟著你。」\n\n柳輕眉亦上前一步，那清麗的臉上淚痕未乾，卻是一臉的堅定：「我萬劍門的『召劍令』還在墨大哥手上。師父說過，這召劍令一出，萬劍門億萬劍修，皆為問道而拔劍。這一場仗，我們陪你打到底。」\n\n墨飛望著這兩位一路同行的同伴，又望向遠處靈舟上那些自歸墟死裡逃生、卻無一人退卻的同盟大能，心底那被悲痛壓得幾乎窒息的地方，終於透進了一絲暖意。\n\n他不是一個人在戰。程伯、龍傲天用命護下的這條路，還有這麼多人，願意與他一同走下去。\n\n「好。」他重重點頭，將這一份份託付，一一收進心底，「那便，一同走到盡頭。」\n\n——\n\n合體，是修士的第六道大關，也是這方天地絕大多數修士窮盡一生都無法企及的巔峰。\n\n化神御虛，煉虛掌空，而合體之境，則是元神與軀體合而為一，念動之間便可搬山填海、粉碎虛空、執掌一方天地之力。踏入此境，便是真正睥睨一域、開宗立派的存在。中州偌大，合體大能亦不過寥寥數位，龍傲天便是其一。\n\n而墨飛，如今距離這一境，只差一步。\n\n有七片問道信物日夜溫養道基，有歸墟深處那段萬古真相所悟的「重證大道」之理，有這一路從青石鎮到中州、對抗噬道淬鍊出的堅定道心，更有那承接了問道道統、清明通透的問道盤——他這一步合體，萬事俱備，只待一個契機。\n\n而那契機，正是歸墟深處，那位問道先賢殘念所留下的最後一句話——\n\n「以『證道』之圓滿，補那大道之『崩碎』。」\n\n墨飛在那墓前跪了整整三日，反覆咀嚼著這一句話。到第三日清晨，當第一縷天光灑落靈峰之巔時，他終於徹底想通了。\n\n他這一步合體，不該只求個人力量的極致突破。那樣的合體，縱使強橫，也不過是又一個困於力量的修士。真正的問道合體，該是以問道之道，去感悟那天地間殘缺的「大道本源」，以自身一路證來的道，去圓滿它、去補全它。\n\n——以己之證道，補天地之崩碎。\n\n這是一條前所未有的合體之路，是問道一脈萬千先賢窮盡萬古也未曾走通的路。也是唯一，能真正對抗那「噬道意志」、斷絕其根的道路。\n\n墨飛於天樞城最深處的閉關靈峰，盤膝而坐，開始衝擊合體。\n\n凌霜守在一側，為他護法。這數載並肩，從問劍宗到西陲、從中州到歸墟，她早已與墨飛心意相通、生死與共。望著那即將踏入合體、眉宇間已褪去青澀的少年，她那清冷的眸中，滿是化不開的柔情與信任。她知道，這一步一旦踏出，他們並肩要走的路，將更長、更險，也更接近那萬古的宿敵。可她從未後悔。\n\n墨飛運轉《問道錄》，以七片問道信物為引，將體內磅礴的煉虛真元，與那承自道統的問道之韻，緩緩融匯、凝練。\n\n他不求個人力量的極致。他以「觀道」之能，將神識一寸寸探向那天地間無處不在、卻又處處殘缺的「大道本源」——\n\n那是一片浩瀚無垠、玄奧難言的大道之海。可當墨飛的神識真正觸及它時，他才驚覺，那看似完整的大道，竟處處透著「崩碎」的痕跡：一道道細密的裂紋蜿蜒其上，一塊塊本該圓滿的道則缺失殘破。那，正是萬古之前，問道與噬道那一場大戰、乃至噬道意志萬古噬道所留下的，天地之傷。\n\n「原來如此……」墨飛心神劇震，「噬道意志之所以不死不滅，正是因為這大道本身，已然崩碎。它是這『崩碎』所生的『反』，只要大道一日不圓滿，它便一日有根可依。」\n\n他以問道之光，一絲一縷地感悟著那大道的殘缺；又以自身一路證來的道之力，一分一毫地去彌補、去圓滿那崩碎的縫隙——\n\n以「證道」補「崩碎」，以「問道」證「本源」。\n\n那一尊問道元神，於墨飛的識海之巔，緩緩地與他的軀體合而為一。那眉心綻放的問道之光，愈發璀璨、愈發浩瀚，竟隱隱地，與那天地間殘缺的大道本源，遙相呼應、共鳴。他補上的每一道細微的裂紋，那大道之海便回饋給他一縷精純浩瀚的本源之力。\n\n轟——\n\n隨著一聲響徹天地、彷彿自大道深處傳來的清鳴，墨飛那橫亙已久的合體天塹，轟然跨越！\n\n【墨飛│合體一層│問道合體(特殊)！】\n【元神歸一。念動之間，搬山填海、粉碎虛空。初窺大道本源。】\n【戰力……突破三百萬！】\n【〔問道合體，以證道補崩碎、以問道證本源。剋制噬道之力愈發強盛；問道之光，已可微撼大道〕】\n\n合體一層！戰力三百萬！\n\n墨飛緩緩睜開眼。那一睜眼，天地萬物、山川草木、乃至那流轉於虛空之間的大道紋路，皆清晰無比地映入他的眼簾。他念動之間，靈峰之外的一片虛空應聲粉碎，又在他一念之間重新彌合；遠處的一道山河，隨他的心意微微變色。他終於，自那個在青石鎮測靈石前被判「無緣」的廢根少年，一步一步，走到了這睥睨一域、初窺大道的合體之境。\n\n而更重要的是——他這問道合體，因悟「重證大道」而成。那剋制「噬道意志」的問道之光，較之從前，強盛了何止十倍。他甚至隱隱感覺到，若有朝一日真能集齊九片信物、重鑄問道道統、補全那大道本源，那潛藏萬古、不死不滅的噬道意志，或許，真的能被連根拔起。\n\n凌霜望著那破境而出、周身縈繞著浩大問道之光的墨飛，那清冷的眸中，第一次泛起了淚光。她知道，他離那個目標，又近了一大步。\n\n「合體。」墨飛立於靈峰之巔，望向那歸墟的方向，又望向那潛藏於中州腹地的噬道總壇，眸中戰意熊熊，「城主，我來了。」\n\n「噬天大護法的血債，龍城主的仇——」他一字一頓，握緊了那六色道韻的斷刀，「是時候，去討了。」\n\n——\n\n而就在墨飛破境合體、那浩大問道之光沖天而起的同一刻，中州腹地最深處，那潛藏了萬古的噬道總壇之中，一雙古老而深邃的眸子，再度緩緩睜開。\n\n「問道合體……以證道補崩碎……」那蒼老而威嚴到極致的聲音，於無邊的黑暗中緩緩響起，第一次，那漠然之中，竟摻入了一絲極淡、卻真實存在的凝重，「這小子，竟真的窺見了那條路。」\n\n「萬古以來，問道一脈的餘火，本座撲滅過無數次。可還從未有一縷，燒到過『補全大道』這一步。」那聲音沉默片刻，終是化作一聲冰冷的低笑，「也好。等你集齊了信物、重鑄了道統、把那條路走到最盡頭——本座再親手將你連人帶道，一併吞下。屆時，那補全的大道本源，便盡歸本座所有。」\n\n「墨飛……」那古老的眸子深處，掠過一絲貓戲鼠般的殘忍，「加快些吧。本座，等著你，把最肥美的那份養料，親手送上門來。」\n\n墨飛立於靈峰之巔，那敏銳到極致的問道盤，忽然一跳。他隱隱感應到，那來自天地最深處、令人心悸的窺伺，又一次，落在了他的身上。\n\n他不驚不懼，只握緊了斷刀，遙遙望向那噬道總壇的方向，一字一頓：「看罷。這一次，走到你面前的，會是我。」"}, {"t": "第六十章 東海遺珠", "c": "破境合體之後，墨飛以「推衍」之能，鎖定了第八片問道信物的下落——中州東海，一處名為「沉淵」的深海禁地。\n\n那道韻自八片信物的共鳴中浮現，如一根若有若無的絲線，牽引著他的神識，指向那片幽暗深邃的海域。\n\n「沉淵。」天樞城的議事廳中，一位熟悉中州地理的同盟長老聽聞此名，神色微變，「那是中州東海最凶險的一處禁地。傳聞沉淵深不見底，海底盤踞著上古的兇獸與早已成精的海妖，更有無數在海底大戰中沉沒的古修怨魂。尋常化神大能墜入其中，十有八九，有去無回。」\n\n「而那第八片問道信物，」墨飛以問道盤將推衍的結果一一鋪陳，「據我所算，正藏於沉淵最深處，一座上古沉沒的仙宮之中。」\n\n眾人聞言皆是神色凝重。可墨飛的眸中，卻無半分怯意。如今他已是合體之境，戰力三百萬，念動之間可執掌一方虛空；又有問道同盟諸多大能相助。此行雖險，底氣卻足。\n\n同行的，除了凌霜、石敢、柳輕眉，還有萬劍門派來的一位化神長老，以及數名同盟的煉虛大能。眾人乘一艘同盟秘製的、可深潛萬丈的靈舟——那靈舟通體以玄鐵與避水靈玉打造，外覆一層堅固的護罩——緩緩沉入了那幽暗的沉淵。\n\n越往深處，水壓越是恐怖。那深海的水，濃稠得如同墨汁，靈舟的護罩在無形的重壓之下，發出一陣陣不堪重負的呻吟。靈氣也越發狂暴、駁雜，其間更纏繞著一縷縷陰寒的怨氣與死氣，彷彿有無數雙看不見的手，在幽暗中窺伺、撕扯。\n\n「都打起精神。」墨飛立於舟首，那合體的神識籠罩全舟，「這沉淵的死氣，最擅侵蝕神魂。以問道之光護住識海，莫要被那怨氣所惑。」\n\n話音方落，那幽暗的深海之中，異變陡生。一頭頭通體漆黑、雙目泛著幽幽綠光的上古海妖，自那墨汁般的海水中撲出，張開滿是獠牙的血盆大口，朝靈舟狠狠咬來。那海妖體型龐大，最大的一頭幾乎與靈舟等長，一尾掃來，便激起滔天的暗流。\n\n可這些，於合體的墨飛而言，已不足為懼。\n\n他負手立於舟首，念動之間，便可鎮壓一片海域。一道道蘊著大道之理的問道之光自他周身綻放，那撲來的海妖，或被那浩大的威壓生生壓回海底，或在他一縷純陽問道之光下發出淒厲的哀鳴、紛紛潰退。凌霜的劍光、石敢的護罩、同盟大能的法術交織成一張密網，將漏網的海妖一一擋下。\n\n一行人勢如破竹，靈舟穿過重重死氣與妖群，直抵沉淵最深處。\n\n那裡，幽暗的海底之上，一座早已被歲月與海水侵蝕得斑駁不堪的上古仙宮，靜靜矗立。那仙宮規模宏大，殿宇連綿，只是宮牆傾頹、殿角崩塌，處處透著一股歷經萬古滄桑的死寂。而那第八片問道信物的道韻，正自仙宮最深處，悠悠傳來，與墨飛識海中的八片信物遙相呼應。\n\n然而，仙宮之前，卻已有「人」，捷足先登。\n\n一道通體覆滿黑色鱗甲、氣息邪異的身影，正守在那仙宮的正門之前。那是一頭化為人形的上古海妖，身形高大，鱗甲森然。可最令墨飛眸光一冷的是——它周身，竟縈繞著那他無比熟悉的「反問道」邪韻。\n\n「噬道天教，竟已將爪牙，滲透到了這沉淵之中。」墨飛沉聲道。\n\n看來，覬覦這方天地一切道統的噬道天教，早已將手，伸向了這片深海禁地。\n\n那噬道海妖，戰力堪堪煉虛。它守在仙宮之前，顯是也在覬覦那問道信物，卻因無法參透那玄奧的問道道韻，遲遲無法將其取出，只得在此苦守。\n\n見墨飛一行到來，那噬道海妖非但不懼，反而猙獰一笑，那滿口獠牙泛著幽光：「問道餘孽？來得正好！這問道信物，本座取它不出；可你身上，卻帶著整整八片——殺了你，將你識海的問道盤與那八片信物一併奪來獻給教主，本座這千年的苦功，也算沒白費！」\n\n它周身邪異真元暴漲，海水為之沸騰，朝墨飛狠狠撲來。\n\n可它，選錯了對手。\n\n墨飛，如今合體之境，戰力三百萬，更兼那剋制「反問道」邪法的問道之道。那噬道海妖那自以為凶險的邪法，在他昇華後的「觀道」之下，道則流轉、破綻脈絡，盡數纖毫畢現。那翻湧的滔天邪氣，尚未近身，便被他周身那一輪純陽問道之光，如烈日融雪般，盡數消融。\n\n墨飛甚至未曾動用全力。他只念動之間，一道蘊著大道之理的問道之光垂落，便將那煉虛的噬道海妖，連同它那千年苦修的鱗甲護體，一併鎮壓、洞穿，重創於當場。\n\n「一縷……一縷問道之光，便鎮壓煉虛？！」那噬道海妖被釘在海底，難以置信，那猙獰的臉上血色盡褪，「你、你竟已合體？！一個問道餘孽，怎會……怎會突破得如此之快！」\n\n它自知不敵，掙扎著欲逃回那幽暗的深海。可墨飛念頭一動，那沉淵方圓數里的虛空，竟為之凝固——合體大能，執掌一方虛空，那海妖游動的軀體被生生定在原地，插翅難逃。\n\n「你們噬道天教，屠戮同門、勾結邪祟、覆滅道統，萬古以來，作惡無數。」墨飛一步踏出，踏著那凝固的虛空，緩緩逼近，眸中寒光凜冽，「程伯、龍城主、無數問道先賢……這一筆筆的血債，總要有人來償。」\n\n「今日，便由你，先償一份。」\n\n一記問道之光落下，那噬道海妖連一聲慘嘶都未能發出，便化為飛灰，消散在那幽暗的海水之中。\n\n——\n\n而那被墨飛以虛空定住、又化為飛灰的噬道海妖，臨滅前那句「本座這千年苦功」，卻在墨飛心中留下一絲異樣。他略一沉吟，以問道盤「觀道」，掃過那仙宮正門之上殘留的痕跡——那門扉之上，赫然有無數道被邪法反覆蝕刻、卻始終未能破開的印記。\n\n「這海妖，在此苦守了千年，日日試圖破開這仙宮的封印。」墨飛心中瞭然，「連它都取不出的信物，可見這問道封印之精妙。也難怪噬道天教尋得諸多信物，卻始終無法參透——問道之道，本就非他們噬道邪法所能窺探。」\n\n這一念，讓他愈發確信了那位問道先賢殘念所言：這九片信物、這問道道統，唯有問道傳人，方能真正繼承。這是先賢們早在萬古之前，便為他這最後的血脈，留下的最後一道保險。\n\n斬了噬道海妖，墨飛緩步走入那上古仙宮。\n\n仙宮之中，早已空無一物。那些本該陳列的珍寶、典籍，或被歲月侵蝕成灰，或早已被歷代闖入的盜寶者搜刮一空。唯有正殿的最深處，一方古樸的玉台之上，那第八片問道信物，散發著溫潤而純淨的道韻，靜靜懸浮，彷彿在此等候了萬古，只為等一個能將它喚醒的問道傳人。\n\n墨飛緩步上前，以問道之力將其喚醒、取出。\n\n當那第八片信物落入掌心的剎那，他識海之中，八片問道信物同時遙相呼應，綻放出前所未有的璀璨道韻！那道韻交織、共鳴，彷彿八位問道先賢的殘念在此刻齊聲低吟。那重鑄的問道道統，已然過了八成！而那通往「大道本源」的感悟，也在這八片信物的共鳴之中，愈發清晰、愈發完整。\n\n「八片信物。」墨飛握著那愈發完整的問道道統，眸中戰意與使命交織，「只剩，最後一片了。」\n\n集齊九片，重鑄道統，補全大道，斷絕噬道之根——那萬古的使命，已然近在咫尺。\n\n而那第九片、也是最後一片問道信物的道韻——當墨飛以八片信物之力，全力推衍其下落之時，那推衍的結果，讓他瞳孔驟然一縮。\n\n那最後一片信物，竟就藏於——中州腹地，那潛藏了萬古的，噬道天教總壇之中！\n\n「最後一片信物，在噬道總壇。」墨飛眸光森然。他很快便想通了其中的緣由：「他們早已尋得這片信物，卻和那沉淵的海妖一樣，無法參透其中的問道道韻。取之不得，又不甘落於他人之手，便只得以邪法將它鎮壓、供奉於那巢穴的最深處。」\n\n「他們大約做夢也想不到，」墨飛唇角泛起一絲冷冽的弧度，「這片被他們鎮壓的信物，有朝一日，會成為我攻破他們總壇的鑰匙。」\n\n他望向那噬道總壇的方向，一字一頓，戰意熊熊：「想集齊九片信物、重鑄問道道統、補全那崩碎的大道——便必須，攻破那噬道天教的心臟。」\n\n「盟主，」隨行的萬劍門化神長老聞言，神色凝重，「噬道總壇乃萬古邪教的巢穴，護壇大陣森嚴，更有那合體巔峰的噬天大護法、乃至那噬道教主坐鎮。我等縱是傾問道同盟之力，正面攻打，也是九死一生。」\n\n「我知道。」墨飛緩緩點頭，眸光卻無半分退縮，「可最後一片信物在彼處，這一戰，避無可避。」\n\n「何況，」他望向那八片流轉生輝的信物，眸中掠過一絲決然，「龍城主的仇未報，程伯的仇未報，問道一脈萬千先賢的血債未償。這一戰，縱是龍潭虎穴，我墨飛，也早已等了很久了。」\n\n沉淵的幽暗海水之中，墨飛握緊了那六色道韻的斷刀。八片信物在他識海中流轉生輝，映得他的眸子亦是一片璀璨。\n\n決戰的號角，已然在遠方，隱隱吹響。而這一次，輪到他，主動叩響那萬古邪教的巢穴之門了。"}, {"t": "第六十一章 誓師", "c": "第九片，也是最後一片問道信物，藏於噬道天教總壇之中。\n\n這意味著，墨飛若要集齊九片信物、重鑄問道道統、乃至補全那崩碎的大道本源，便避無可避地要與那潛藏了萬古的噬道天教，展開一場正面的決戰。\n\n墨飛自沉淵歸來，將這一切稟明了問道同盟。\n\n天樞城，議事大殿。\n\n三域正道的頂尖強者齊聚一堂。天南諸聖地的化神老怪、西陲萬劍門掌門劍無塵、中州各大宗門的掌教……數十位煉虛、化神、乃至合體的正道強者，分列大殿兩側。龍傲天的衣冠冢就立在城後的靈峰之上，那位老人斷後隕落的消息，讓每一個人的臉上，都凝著一層揮之不去的沉痛。\n\n可也正是這沉痛，讓那直搗噬道總壇的決意，在眾人心中愈發堅定。\n\n「諸位道友。」墨飛立於殿中，那合體的氣度睥睨全場，聲如洪鐘，一字一句都清晰地傳入每個人耳中，「龍城主，為護問道復興、為替我等斷後，血染歸墟，屍骨無存。程守拙前輩，為守問道最後的火種，殞於青石。萬劍門古長天之亂、萬骨淵血屠之惡……這一路走來，多少為問道、為這方天地大道而戰的前輩與同道，慷慨赴死。」\n\n殿中一片寂靜，唯有墨飛的聲音在梁柱間回蕩。\n\n「而今，最後一片問道信物，就藏在噬道天教的巢穴之中。」他一字一句，「重鑄問道道統、補全大道本源、徹底斷絕那噬道意志之根——這唯一的希望，就在那噬道總壇的最深處。」\n\n「我，墨飛，決意，率問道同盟，直搗噬道天教總壇！」\n\n他環視全場，眸中戰意如烈日般灼人：「噬道天教，覆滅道統、禍亂天地、屠我同道、殺我至親。這萬古的血債，這滔天的罪孽——」\n\n「今日，便讓我等，以問道同盟之力，做一個了斷！」\n\n他頓了頓，聲音陡然拔高，響徹整座大殿：「願，隨盟主，直搗總壇者——」他握緊了那六色道韻的斷刀，一字一頓，「請，起！」\n\n轟——\n\n殿中，三域正道的頂尖強者，齊齊起身！\n\n劍無塵長劍出鞘，劍鳴清越：「萬劍門，願為問道，拔劍到底！」諸聖地的化神大能紛紛起身，那道骨仙風的老者撫須長笑：「噬道天教乃天地公敵，此戰，我天南諸聖地，傾力相隨！」中州各大宗門的掌教亦轟然應諾，數十位煉虛、化神、乃至合體的正道強者，眸中皆燃著同仇敵愾的戰意。\n\n「願隨盟主，直搗總壇！」\n\n「蕩平噬道，重興問道！」\n\n三域正道，群情激昂，那一聲聲吶喊匯成滔天的聲浪，幾乎將議事大殿的穹頂掀開。一支由三域頂尖強者匯聚而成、對抗萬古邪教的問道大軍，就此集結。\n\n墨飛望著這滿殿的戰意，望著這一張張因共同的道而聚在一起的面孔，心底那被龍傲天之死壓下的沉痛，終於化作了一股熊熊燃燒的力量。\n\n他知道，他從來都不是一個人。\n\n「盟主。」一位天南聖地的化神老者越眾而出，正是當年論道大會上曾欲收墨飛為徒的道骨仙風之人。他鄭重一揖，「當年在論道峰，老夫便看出你這問道之道，是這天地正道對抗噬道的希望。今日一戰，老夫這把老骨頭，便交給你了。」\n\n「還有我萬骨淵一役後歸附的散修同道。」一名獨臂的煉虛修士按刀而立，「我等本是被噬道天教屠戮得走投無路的殘卒，是盟主的問道之光，讓我等重新有了活下去、也有了拚一場的底氣。這條命，早就是問道的了。」\n\n一位又一位，或名門大能，或無名散修，紛紛起身表態。他們之中，有人失去了宗門，有人失去了至親，有人只是不願再看著這天地的道統一個接一個被吞噬。而此刻，他們都因同一面旗幟、同一個名字，聚在了這座大殿之中。\n\n墨飛深深一揖，回敬滿殿諸強：「墨飛，代問道一脈萬千先賢，謝過諸位。」\n\n——\n\n——\n\n噬道天教總壇，隱於中州腹地，一處名為「幽冥血海」的恐怖絕地。\n\n軍議之上，墨飛以問道盤將那幽冥血海的地勢，一一鋪陳於眾人面前。\n\n那裡血海翻湧，死氣滔天，被噬道天教以萬古之力，布下了層層恐怖的護壇大陣。而那總壇之中坐鎮的，除了那合體巔峰、戰力五百萬的噬天大護法，更有那活了萬古、以吞噬道統為食的——噬道教主。\n\n「以問道同盟如今的實力，正面強攻那護壇大陣，無異於以卵擊石。」墨飛沉聲道，「噬道總壇經營萬古，大陣森嚴，更有噬天乃至教主坐鎮。我等若正面硬撼，只怕未及破陣，便要折損大半。屆時縱然攻入，也再無餘力面對教主。」\n\n「盟主可有良策？」劍無塵問道，殿中諸強的目光，皆聚於墨飛一身。\n\n墨飛眸光一凝：「這護壇大陣，看似固若金湯。可天下，沒有無懈可擊的陣法。」\n\n他那「觀道」與「推衍」之能，早已將那自八片信物共鳴中窺得的、關於噬道總壇的一切，反覆推演了千百遍。\n\n「大陣的破綻，在於它的『陣眼』——那鎮壓最後一片問道信物的血色祭壇。」墨飛一字一句，「那祭壇，以問道信物的道韻為引，維繫著整座大陣的核心。噬道天教取不出那信物，便索性以它為陣樞，鎮壓、供奉於總壇最深處。」\n\n「而這，恰恰是他們萬萬想不到的破綻——」他眸中寒光一閃，「他們以問道信物鎮壓大陣，可那信物，卻唯獨對我這問道傳人遙相呼應！」\n\n「換言之，」他一字一頓，「我可以問道之力，隔空喚動那鎮於陣眼的信物，自內擾亂那護壇大陣！」\n\n殿中諸強聞言，皆是眼前一亮。\n\n「屆時，」墨飛望向那群情激昂的同盟諸強，眸中是運籌帷幄的篤定，「同盟自外強攻，牽制噬道大軍與那護壇大陣；我則潛入近前，自內喚動信物、擾亂陣樞。內外夾擊——」\n\n「這噬道天教萬載經營的護壇大陣，必破！」\n\n「而一旦破陣——」墨飛望向那幽冥血海的方向，握緊了斷刀，一字一頓，戰意滔天，「便是我墨飛，親手向那噬道教主、向這覆滅了問道一脈的萬古邪祟，討回這萬古血債之時！」\n\n三域正道聞言，皆眸中燃起熊熊的戰意與勝利的希望。\n\n軍議既定，各方強者依墨飛所劃分的陣列，各歸其位。問道大軍，浩浩蕩蕩，開赴中州腹地。\n\n出征那日，天樞城萬民相送。墨飛立於軍陣之首，回望了一眼那城後靈峰之上的衣冠冢。\n\n「城主，」他在心底默念，「你我未竟的仇，今日，我去了結。」\n\n出征前夜，天樞城的城頭之上，墨飛獨自佇立，望著那中州腹地的方向。\n\n「在想什麼？」凌霜不知何時來到他身側，將一件披風輕輕搭在他肩上。\n\n「在想這一路走來的人。」墨飛輕聲道，「程伯、龍城主……還有那些連名字都來不及記住、就倒在噬道屠刀下的同道。這一戰，是為他們打的。」\n\n凌霜靜靜地立在他身側，那清冷的側臉在月色下柔和了幾分：「那你也要記得，這一戰，還是為活著的人打的。為石敢、為清眉、為滿城願意隨你出征的人……也為你自己。」\n\n墨飛回過頭，望進她那雙盛滿了星光與情意的眸子，心底最緊繃的那根弦，忽然鬆了一分。\n\n「等這一戰打完，」他輕聲道，「等問道道統重鑄、這天地的大道補全……我想帶你，回青石鎮看看。那裡有一棵老槐樹，如今應該又抽新芽了。」\n\n凌霜微微一怔，隨即那向來清冷的唇角，綻開一抹極淺、卻極動人的笑意：「好。我等你。」\n\n城頭之上，兩人並肩而立，望著那即將迎來滔天決戰的天地。這一夜的寧靜，短暫而珍貴，卻足以讓他們，在踏入那萬古殺局之前，記住自己究竟為何而戰。\n\n——\n\n翌日，問道大軍，誓師出征。旌旗蔽空，遁光如潮，一支由三域頂尖強者匯聚而成的正道大軍，浩浩蕩蕩，開赴中州腹地那名為「幽冥血海」的萬古絕地。\n\n大軍行進之間，墨飛立於軍陣之首，將此戰的部署，在心中又推演了一遍。\n\n同盟諸強分為三路：劍無塵率萬劍門與西陲劍修為前鋒，正面撕開噬道大軍的防線；諸聖地化神大能為中軍，穩住陣腳、牽制那護壇大陣；餘下煉虛與散修為策應，護住後方、接應傷者。而墨飛自己，則帶著凌霜、石敢、柳輕眉，趁兩軍激戰、噬道無暇他顧之際，直插那護壇大陣的陣眼。\n\n「每一步，都算過了。」墨飛低聲自語，指尖在那六色道韻的斷刀上輕輕摩挲，「可算得再精，這一戰，終究要用命去拚。」\n\n他比任何人都清楚，噬天大護法戰力五百萬，而那噬道教主，更是活了萬古、深不可測的合體巔峰意志所化。以他如今合體一層、戰力三百萬之身，正面對上任何一個，都是九死一生。\n\n可他別無選擇。最後一片信物在彼處，重鑄道統、補全大道的唯一希望在彼處，程伯與龍傲天的血仇亦在彼處。\n\n「來吧。」他望向那越來越近的、天際盡頭那一抹詭異的墨黑，眸中戰意如淵底翻湧的岩漿，「這一戰，我等了太久。」\n\n一場關乎問道復興、關乎這方天地大道存亡的滔天決戰，終於，拉開了序幕。"}, {"t": "第六十二章 兵臨血海", "c": "幽冥血海，位於中州腹地最幽深的一處絕地。\n\n尋常修士莫說踏足，便是遠遠望上一眼，都要被那滔天的死氣與怨煞侵蝕心神。血紅色的海水一望無際，翻湧著粘稠如漿的血浪；海面之上終年瀰漫著灰黑的濃霧，霧中隱隱有無數冤魂的哀嚎，此起彼伏，如泣如訴。那是萬古以來，被噬道天教吞噬了道統、殘殺了性命的無數修士與生靈，怨氣所化。\n\n這，便是潛藏了萬古的噬道天教總壇之所在。\n\n當問道大軍的靈舟艦隊，破開層層濃霧、兵臨那血海之畔時，饒是這些見慣了大場面的三域頂尖強者，也不由得面色凝重，握緊了各自的法器。\n\n「好濃的死氣。」凌霜立於墨飛身側，眉頭微蹙，那向來清冷的臉上也添了幾分肅然，「這血海之中，不知沉了多少冤魂。」\n\n「萬古以來，被噬道天教吞噬道統、殘殺的修士乃至無辜生靈，怕是不計其數。」墨飛眸光沉沉，望著那翻湧的血浪，聲音裡透著一絲寒意，「這一整片血海，便是那萬古罪孽，一寸寸堆砌而成。他們以血海為屏、以怨煞為兵，將這裡經營成了整個中州最不可撼動的巢穴。」\n\n他抬起頭，望向血海的最深處。\n\n那裡，透過灰黑的濃霧，隱隱可見一座巍峨、猙獰的黑色宮殿，懸浮於血海之上。那宮殿以無數森森白骨與墨黑山石堆砌而成，殿脊之上盤踞著猙獰的邪獸雕像，透著一股睥睨萬古的森然。宮殿周身，縈繞著一層扭曲的、肉眼可見的血色光罩——那，便是噬道天教的護壇大陣。\n\n「護壇大陣，已然開啟。」墨飛以問道之力遙遙感應著那大陣的脈動，那大陣之中蘊藏的邪異之力，浩瀚得令他都心頭一凜，「大陣之下，噬道天教的爪牙，只怕已是嚴陣以待。他們，早就等著我們來了。」\n\n話音未落——\n\n嗚——嗚——嗚——\n\n血海之上，驟然響起一陣淒厲、悠長的號角之聲！那號角聲穿透濃霧，激得血海之上的怨魂哀嚎愈發淒厲。緊接著，那血色的海面猛地翻湧、沸騰，無數道邪異的身影自那粘稠的血浪之中破水而出。\n\n那是噬道天教的教眾。他們周身縈繞著「反問道」的邪韻，一個個面目猙獰、雙目赤紅，如同從十八層地獄中爬出的惡鬼。粗略一掃，竟有數千之眾；其中，煉虛、化神的強者，亦不在少數。他們無聲地列陣於血海之上，那滔天的邪異氣機匯聚成一片墨黑的雲潮，與問道大軍遙遙對峙。\n\n一時間，血海之上，殺氣騰騰，一觸即發。\n\n「來得好！」劍無塵長劍出鞘，那凜冽的劍鳴清越激昂，響徹整片血海。他一馬當先，身後西陲劍修盡數拔劍，億萬劍氣沖霄而起，竟將那壓頂的墨黑邪雲，硬生生逼退了三分，「諸位道友，隨我，殺！」\n\n「蕩平噬道，重興問道！」\n\n問道大軍轟然應諾。三域正道的頂尖強者，自靈舟之上御空而起，如一道道璀璨的流光，撲向那血海之上的噬道教眾。\n\n剎那間，幽冥血海之上，殺聲震天。劍光、法決、神通，與那噬道教眾的邪異真元狠狠碰撞在一起。血海翻湧，靈氣暴亂，一道道恐怖的餘波，將那血色的海水激起千丈高的血浪。正道的璀璨與噬道的墨黑，在這片萬古絕地之上激烈交織。\n\n這，是問道與噬道、正邪兩道，萬古以來最為慘烈的一場正面交鋒。\n\n墨飛立於靈舟之首，並未第一時間出手。\n\n他那「觀道」之眼，冷靜地掃過整個戰場，將敵我雙方的態勢盡收眼底。哪一路壓上、哪一處吃緊、噬道的援兵自何處湧來——一切，都在他的推衍之中。作為問道同盟的盟主、作為此戰的主帥，他必須在最關鍵的時刻，做出最正確的決斷。他的每一個判斷，都關乎身後這數十位大能、乃至整個問道復興的成敗。\n\n「噬道教眾雖眾，卻不過是烏合之眾。」墨飛低聲自語，眸光一凝，「同盟諸強足以與之周旋。真正的威脅，是那護壇大陣，與陣後坐鎮的噬天大護法。」\n\n他抬起手。\n\n「凌霜、石敢、柳輕眉。」\n\n「在！」三人齊聲應諾。凌霜劍眉星目，一身戰意；石敢古拙沉穩，那護道之軀堅逾金石；柳輕眉則纖手一揚，一縷縷靈藥的清香已然護住了周身。自青石鎮、問劍宗一路走來，這三人早已是墨飛最為信重、也最默契的同伴。\n\n「隨我突陣。」墨飛眸光森然，望向那血色的護壇大陣，「同盟諸強在外纏住噬道教眾、牽制大陣；而我等，趁亂直取那大陣的陣眼！」\n\n「陣眼？」石敢一怔，「盟主，那護壇大陣森嚴無比，血色光罩連劍無塵前輩的劍氣都難破，我等如何突破？」\n\n「這大陣的核心，是鎮於陣眼的那最後一片問道信物。」墨飛眸中寒光一閃，「而那信物，唯獨對我這問道傳人遙相呼應。只要我能靠得夠近，便可以問道之力隔空喚動那陣眼信物，自內擾亂這萬古護壇大陣。」\n\n「屆時大陣一亂——」他握緊了那六色道韻的斷刀，眸中戰意如烈日般灼人，「便是我等長驅直入、直搗黃龍之時！」\n\n「好！」凌霜三人眸中戰意燃燒，齊聲應諾。\n\n墨飛足尖一點，靈舟之首一道六色道韻的流光沖天而起。凌霜、石敢、柳輕眉緊隨其後。四道流光避開那血海之上慘烈的正面戰場，如離弦之箭，直直插向那血色護壇大陣的方向。\n\n血海之上的正面戰場，已然殺得天昏地暗。\n\n劍無塵一劍當先，那化神劍意如天河傾瀉，硬生生在噬道大軍中撕開一道血口。他身後的西陲劍修結成劍陣，億萬劍氣如潮水般湧入，將撲來的化神噬道魔修一一斬落。諸聖地的化神大能各展神通，或掌托山河、或口吐劍芒，將那護壇大陣的血色光罩纏得死死的，讓它無暇他顧。而那些自萬骨淵、自各地死裡逃生歸附的散修，此刻更是紅了眼，前赴後繼地撲向噬道教眾——他們早已將這一戰，當作了替死去同道復仇的最後一戰。\n\n正道與噬道，在這片萬古血海之上，以命相搏。\n\n而四道流光，正借著這慘烈的掩護，悄然逼近那護壇大陣。\n\n那大陣顯然察覺到了闖入者。那扭曲的血色光罩猛地一顫，無數道血紅色的劍芒自光罩之上激射而出，如暴雨般朝墨飛四人籠罩而來。那每一道血芒都蘊著恐怖的煞氣與怨力，尋常煉虛觸之即潰。\n\n「小心！」墨飛低喝一聲，那六色道韻的斷刀橫空一斬。\n\n一道蘊著大道之理的問道之光，如一輪初升的朝陽，自刀鋒之上綻放。那漫天的血色劍芒撞上這純陽問道之光，竟如冰雪遇上烈日，一片片消融、潰散。\n\n「不愧是問道之道。」凌霜眸光一亮，「這反問道的邪煞，在盟主的問道之力下，竟毫無還手之力。」\n\n「這正是問道一脈萬古以來剋制噬道邪法的根本。」墨飛一邊揮刀消融著那漫天血芒，一邊沉聲道，「噬道，吞噬、竊取、顛倒因果；而問道，則溯本、清源、叩問大道之真。邪不勝正——在這問道之光面前，那萬古邪法，不過是無根之木。」\n\n四道流光在墨飛問道之光的護持下，硬生生撕開那血色大陣的層層攻勢，離那陣眼越來越近。石敢一馬當先，那護道之軀撞開一頭又一頭撲來的噬道教眾，為墨飛硬生生開出一條血路；柳輕眉纖手翻飛，一枚枚療傷、增益的靈藥精準地落在同伴身上；凌霜長劍如虹，將試圖攔截的化神教眾一一逼退。\n\n配合著墨飛那洞悉一切的「觀道」與剋制邪法的問道之光，這一支小小的、卻精悍無比的隊伍，竟真的在那森嚴的護壇大陣之中，殺出了一條直插陣眼的通路。\n\n「就快到了。」墨飛感應著那愈發清晰的信物道韻，眸光一凝，「陣眼信物的呼應，越來越強。再進三里——」\n\n然而，就在四人離陣眼只剩最後一段距離時，墨飛那「推衍」之能，卻猛地捕捉到一絲致命的異動。\n\n血海最深處，那股足以令整片血海都為之震顫的滔天氣機，動了。\n\n「不好。」墨飛眸光一凝，「他察覺到我們的意圖了。」\n\n而血海最深處，那坐鎮陣後、氣息滔天的魁梧身影，緩緩睜開了雙眼。\n\n那是噬天大護法。合體巔峰，戰力五百萬。他那墨黑的眸子，一眼便越過漫天混戰，鎖定了那直插而來的四道流光，尤其是為首那一道最璀璨的問道之光。\n\n「問道餘孽……」噬天大護法獰笑一聲，那滔天的邪異氣機轟然爆發，將他周身的血海都壓得凹陷下去，「歸墟一戰讓你僥倖逃脫，今日又自己送上門來——來送死麼？」\n\n那五百萬戰力的滔天氣機，如一座血色的山岳，朝墨飛四人轟然壓下。天地為之變色，血海為之分開。\n\n墨飛眸光驟然一凝，握緊了手中的斷刀。\n\n宿敵當前。為龍傲天償命的這一戰——來了。"}, {"t": "第六十三章 喚陣", "c": "那坐鎮陣後的噬天大護法，並未坐等墨飛靠近陣眼。\n\n它那魁梧的身軀自血海之上騰起，化作一道血色的殘影，帶著五百萬戰力的滔天氣機，如一座血色的山岳，狠狠朝墨飛壓下。它要在墨飛觸及陣眼之前，將這問道盟主，連同他那威脅到教主大計的問道信物，一併碾碎。\n\n墨飛並未硬接。\n\n他那「觀道」之眼，早在噬天出手的剎那，便將這一擊的力道、軌跡、乃至那煞氣流轉的每一絲破綻，盡數看破。在那滔天巨掌壓落的瞬間，他的身形如一縷輕煙，恰到好處地自那巨掌的側翼飄然滑過。那五百萬戰力的一擊，堪堪擦著他的衣角，轟在血海之上——\n\n轟隆！\n\n血海為之炸裂！千丈高的血浪沖天而起，露出海底幽深的、翻湧著死氣的溝壑。那一掌的餘威，竟將方圓數里的血海生生犁開。\n\n「以巧破力。」墨飛的身形於那炸裂的血浪之中飄然而立，斷刀橫胸，眸光平靜，「噬天大護法，你的力量確實恐怖。可一味恃強鬥狠——在我問道之眼面前，破綻太多。」\n\n「哦？」噬天大護法望著那竟避開了自己全力一擊的墨飛，赤紅的雙眼中閃過一絲訝異，隨即化為更盛的獰笑，「不錯！歸墟一戰你不過煉虛，如今再見，竟已合體。難怪教主如此忌憚於你。一個合體初入之境，竟能避開本座全力一擊——」\n\n「可那又如何？」它周身邪異氣機暴漲，滔天的煞氣將整個血海攪得一片猩紅，「你能避開一擊、兩擊，可你能避開本座千擊、萬擊麼？你我戰力相差近倍，這場消耗——你，輸定了！」\n\n它一步踏出，那魁梧的身軀化為一道血色的殘影，朝墨飛狂攻而來。拳拳到肉，掌掌裂空，那五百萬戰力的攻勢如狂風暴雨，將墨飛重重籠罩。每一擊落空，都在血海上轟出一個深不見底的巨坑。\n\n墨飛沉著應對。「觀道」洞悉來勢，「問道」剋制邪煞，那飄逸的身法在那狂風暴雨般的攻勢之中穿梭遊走。他以三百萬之力，硬生生周旋於噬天五百萬戰力的狂攻之下，竟始終未被真正擊中要害。\n\n可噬天所言非虛——雙方戰力相差近倍，這般周旋，消耗終究是巨大的。一掌擦過墨飛的肩頭，那滔天的煞氣瞬間撕裂了他的衣袍，在他肩上留下一道深可見骨的血痕。\n\n「墨飛！」凌霜三人大驚，欲上前相助。\n\n「莫要靠近！」墨飛低喝一聲，攔住三人，「噬天交給我！你們護住四周，替我擋下暗處的冷箭——我需要一息喘息的工夫！」\n\n他抹去嘴角溢出的一絲血跡，眸光非但沒有絲毫懼色，反而愈發明亮、鋒利。\n\n——這，正是墨飛要的局面。\n\n他故意以身法周旋，以看似狼狽的閃避，將噬天大護法那睥睨一切的注意力，牢牢吸引在自己身上。噬天越是輕視他、越是急於將他碾碎，便越是不會分神去顧及那護壇大陣的陣眼。\n\n而墨飛真正的殺招，此刻，已然蓄勢待發。\n\n「就是現在。」\n\n墨飛識海之中，那八片問道信物驟然綻放出璀璨的道韻。他一邊以殘存的心神應付著噬天的狂攻，一邊將那合體的全部神魂之力凝聚一線，如一道無形的絲線，遙遙探向那鎮於護壇大陣陣眼的、最後一片問道信物。\n\n「第九片信物——」他在心底低喝，那是同源道統之間跨越萬古的呼喚，「聽我號令。」\n\n「喚！」\n\n嗡——\n\n一聲清越、悠遠的道韻，自那血色宮殿的最深處，轟然響起。\n\n那鎮於陣眼的第九片問道信物，仿佛沉睡了萬古的遊子終於聽到了同源的呼喚，猛地掙脫那萬古邪法的鎮壓，綻放出一輪純陽浩大的問道之光。那光芒穿透血色宮殿，與墨飛識海中的八片信物遙相呼應。剎那間，九道同源的道韻，跨越整個血海，連成一線。\n\n轟——\n\n異變陡生！\n\n那維繫著整座護壇大陣的核心陣眼，因這第九片信物的失控而劇烈震盪。那籠罩血色宮殿的大陣光罩猛地一暗，一道道猙獰的裂痕自那光罩之上蜿蜒綻開，血色的光芒開始瘋狂地閃爍、潰散。\n\n「這……這是怎麼回事？！」\n\n正狂攻墨飛的噬天大護法，赫然感到那萬古護壇大陣，竟在一瞬之間出現了巨大的動盪。它猛地回頭，望向那劇烈震顫的血色宮殿，赤紅的雙眼中第一次露出了驚駭之色。\n\n「陣眼……陣眼失控了？！怎麼可能！那信物明明已被教主以萬古邪法牢牢鎮壓——」\n\n「你們錯就錯在——」墨飛趁噬天分神的剎那，身形暴退，脫離戰圈。那肩頭的傷勢已被柳輕眉以靈藥護住，他眸中是運籌帷幄的鋒芒，「不該以問道信物，做你們護壇大陣的陣眼。」\n\n「那信物是問道一脈的道統所繫——」他一字一頓，聲如金石，「它認的是問道傳人，它呼應的是我！你們鎮得住它一時，卻鎮不住它萬世。你們以為將它鎮壓在陣眼最是穩妥，卻不知，那恰恰是我攻破你們萬古大陣的鑰匙。」\n\n「大陣已亂——」墨飛握緊了那六色道韻的斷刀，回望那血海之上仍在慘烈鏖戰的同盟諸強，暴喝一聲，聲震九霄，「同盟諸道友，護壇大陣已破！隨我長驅直入，直搗總壇！」\n\n「破陣了！」\n\n「盟主破陣了！隨盟主殺入總壇！」\n\n血海之上，士氣如虹的問道大軍眸中燃起滔天的戰意。那原本固若金湯的護壇大陣，此刻裂痕遍布、搖搖欲墜。劍無塵一聲長嘯，率西陲劍修化作漫天劍光，順著那大陣的裂隙狠狠殺入；諸聖地大能緊隨其後，三域正道如決堤的洪流，湧向那血色宮殿。\n\n大陣一破，那困守其中的噬道教眾，登時亂了陣腳。失了護壇大陣的加持，它們那倚仗邪陣才得以支撐的邪異之力，瞬間潰散大半。而問道大軍則士氣大振，攻勢如虹，將那潰亂的噬道教眾殺得節節敗退，鮮血與邪氣染紅了半片血海。\n\n「守住陣線！攔住他們！」血色宮殿之中，傳來噬道天教護教長老們驚怒交加的嘶吼。可大勢已去，那萬古經營的護壇大陣一朝崩解，任他們如何調度，也擋不住三域正道那復仇的怒潮。\n\n眼見同盟已成功殺入，墨飛心頭一塊巨石落地。他不再有後顧之憂，可以全心全意，應付眼前這最後的天塹了。\n\n而那坐鎮陣後的噬天大護法，望著這一瞬逆轉的戰局，望著那搖搖欲墜的護壇大陣，赤紅的雙眼中怒火滔天。\n\n「問道餘孽！好一招釜底抽薪！」它那滔天的邪異氣機轟然鎖定墨飛，一字一句，殺意凜然，「可你別忘了——大陣雖破，本座還在！只要斬了你這問道盟主，奪回那信物，這破陣，便是徒勞！今日本座便是拚著重傷，也要將你斬於此地！」\n\n它那五百萬戰力的滔天氣機，再度化作一座血色的山岳，朝墨飛轟然壓下。\n\n墨飛眸光一凝，斷刀橫胸。\n\n破陣已成，同盟已如潮水般殺入。可眼前這宿敵，仍是擋在總壇之前、擋在他與噬道教主之間的最後一道天塹。\n\n「噬天。」墨飛望著那壓來的滔天氣機，眸中戰意與為龍傲天復仇的決意交織燃燒，「歸墟一戰，我護著眾人逃，未能與你痛快一戰。」\n\n那五百萬戰力的滔天氣機轟然壓至，墨飛卻迎著它，一步踏出。\n\n「觀道！」\n\n他那洞悉一切的問道之眼全開，將噬天這一掌的力道脈絡看得纖毫畢現。斷刀斜挑，六色道韻於刀鋒綻放，精準地劈在那血色氣機的一處破綻之上。轟隆一聲，那看似固若金湯的滔天一擊，竟被墨飛這一刀斬出一道裂口，煞氣自裂口潰散而出。\n\n「合體之後，你的每一擊，我都看得更清楚了。」墨飛身形飄然，斷刀一振，那浩大的問道之光將他周身映得金燦，「噬天，你倚仗的是吞噬萬千道統拼湊而來的蠻力。可那力量，終究不是你自己的道。」\n\n「巧言！」噬天怒喝，攻勢愈發狂暴。二人於那崩裂的血海之上，一時鬥得天翻地覆。血浪滔天，煞氣沖霄，那一招一式的餘波，都將血海攪得地動山搖。\n\n墨飛以三百萬之力周旋於五百萬戰力的狂攻之下，雖仍落於下風，可他那「觀道」之眼，卻在一次次接招之中，越來越清晰地看穿了噬天那滔天力量的底細。\n\n「就快了。」他一邊閃避，一邊在心底冷冷盤算，「你這身力量的破綻，我已經快要找到了。」\n\n「這一次，」他握緊斷刀，一字一頓，眸中戰意如淵底翻湧的岩漿，「我不躲了。」"}, {"t": "第六十四章 血戰噬天", "c": "那五百萬戰力的滔天氣機，如一座血色的山岳，朝墨飛轟然壓下。\n\n墨飛不再躲避。\n\n他將識海之中那八片問道信物的道韻盡數喚醒，那新破的「問道合體」之力如長江大河，於他體內奔湧、匯聚。八道問道先賢的殘念，彷彿在此刻與他同在。\n\n「以證道補崩碎，以問道證本源。」墨飛低喝一聲，那合體的氣機於他周身凝聚成一輪浩大純陽的問道之光，將血海之上的猩紅都逼退了三分。\n\n【墨飛│合體一層│問道合體(特殊)│戰力300萬】\n\n三百萬對五百萬。戰力上，墨飛仍是遠遜。可他眸中，卻無半分懼色。\n\n「觀道！」\n\n那洞悉一切的問道之眼，將噬天壓下的這一擊、那煞氣流轉的每一絲脈絡盡數看破。墨飛斷刀斜挑，那六色道韻於刀鋒綻放，精準地斬在那血色山岳的一處破綻之上。\n\n轟隆！那看似固若金湯的滔天一擊，竟被墨飛這一刀斬出一道巨大的裂口，那五百萬戰力的煞氣自那裂口潰散而出，餘威將血海攪得一片猩紅。\n\n「以巧破力。」墨飛身形飄然，斷刀一振，「噬天，你的力量確實恐怖，可一味恃強鬥狠，在我問道之眼面前，破綻太多。」\n\n「哦？」噬天大護法望著那竟避開了自己全力一擊的墨飛，赤紅的雙眼中閃過一絲訝異，隨即化為更盛的獰笑，「不錯！難怪教主如此忌憚於你。一個合體初入之境，竟能一次次避開本座全力一擊——」\n\n「可那又如何？」它周身邪異氣機暴漲，「你我戰力相差近倍，這場消耗，你輸定了！」\n\n它一步踏出，那魁梧的身軀化為一道血色的殘影，朝墨飛狂攻而來。拳拳到肉，掌掌裂空，那五百萬戰力的攻勢如狂風暴雨，將墨飛籠罩其中。\n\n墨飛沉著應對。\n\n他那「觀道」之眼將噬天的每一次攻勢盡數看破，那飄逸的身法在那狂風暴雨般的攻勢之中游刃有餘地穿梭、閃避。可噬天所言非虛——雙方戰力相差近倍，這般硬拚消耗，墨飛終究落於下風。\n\n一掌擦過墨飛的胸膛，那護體的問道之光被轟得一陣劇烈動盪。他悶哼一聲，一縷鮮血自嘴角溢出，身形在血海之上劃出一道長長的痕跡。\n\n「墨飛！」凌霜三人焦急萬分，卻插不上手——這等層次的對決，他們一旦靠近，只怕反成墨飛的拖累。凌霜只能咬牙，將漫天劍光化作屏障，替墨飛擋下那四濺傷及旁人的餘波。\n\n「無妨。」墨飛穩住身形，抹去嘴角的血，眸中戰意不減反增，「噬天的攻勢，我已看得越來越清楚了。」\n\n噬天冷笑，攻勢愈發凌厲。它那滔天的邪異之力化作千百道血色的爪影，自四面八方朝墨飛絞來，每一道都足以撕裂虛空。這是它縱橫萬古、鮮有敗績的殺招，尋常合體大能陷入其中，早已被絞成齏粉。\n\n墨飛卻不慌不亂。他以「推衍」預判每一道爪影的落點，身形在那看似密不透風的絞殺之中，尋著那一線線稍縱即逝的縫隙穿梭。斷刀所至，一縷縷純陽問道之光將撲近的血爪一一消融。他像一葉在驚濤駭浪中顛簸卻始終不沉的扁舟，任噬天的攻勢如何滔天，總能在最險的一瞬避開致命的鋒芒。\n\n「你這打法……」噬天又驚又怒，「分明戰力遠不及本座，怎的就是傷你不得？！」\n\n「因為你打的是我的『過去』，而我算的是你的『下一招』。」墨飛淡淡道，斷刀劃開一道血爪，「你每出一招，我便多懂你一分。噬天，你越是急於殺我，便越是把自己的底，一分分掀給我看。」\n\n這一番周旋，看似墨飛狼狽落於下風，實則他那「觀道」之眼，正一寸寸地，將噬天那五百萬戰力的每一絲脈絡，都刻進了識海。\n\n——這，正是墨飛以弱搏強的底氣。\n\n他的「觀道」之眼並非一成不變。每接下噬天一擊，他便對那合體巔峰的力量運轉多一分理解；每看破一處破綻，他對那五百萬戰力的脈絡便多一分洞悉。戰得越久，墨飛對噬天便越是了如指掌。這是他自青石鎮一路走來，以弱勝強、以算破敵的不二法門——用時間，用一次次的接招，把對手的底，一寸寸算穿。\n\n「有意思。」墨飛一邊閃避狂攻，一邊喃喃自語，那眸中精光愈發明亮，「你的力量源自吞噬。可吞噬而來的力量，終究駁雜不純。這五百萬戰力之中……竟有近三成，是虛浮不穩的。就像一座地基鬆動的高樓，看似巍峨，實則一觸即塌。」\n\n「破綻，找到了。」\n\n墨飛眸光驟然一凝。\n\n那一直被動防禦的身形猛地一變。斷刀之上，六色道韻暴漲到極致，那浩大的問道之光如一輪噴薄而出的烈日，將整片血海映得金燦。八片信物的道韻在他識海中齊齊轟鳴，彷彿萬千問道先賢的意志盡數匯於這一刀。\n\n「問道一式——」\n\n「叩天問道！」\n\n那一刀，並非以力破力。墨飛將這一路所悟的問道至理、將對噬天力量的全部洞悉、將為龍傲天復仇的滔天決意，盡數凝於一線。刀光落處，不去硬撼那五百萬的煞氣，而是精準地、狠狠地劈向噬天那三成虛浮不穩的力量根節。\n\n轟——\n\n噬天那滔天的攻勢，竟被這一刀從內裡撕開！那駁雜不純的煞氣如決堤般自那根節潰散，噬天悶哼一聲，那自它踏入合體巔峰以來，從未有過的踉蹌，第一次出現在了它龐大的身軀之上。\n\n「這……這不可能！」噬天赤紅的雙眼中滿是駭然，「本座五百萬的戰力，竟被你一刀，破了根基？！」\n\n「你的力量，是吞噬萬千道統拼湊而成。」墨飛立於那金燦的問道之光中，斷刀直指噬天，一字一頓，「看似滔天，內裡卻千瘡百孔。而我這一刀，問的正是你力量的『本源』——問你這一身力，究竟有幾分，是真正屬於你自己的道。」\n\n「噬道，噬來的終究不是自己的道。」他眸中戰意凜冽，「而問道，問的才是真正的大道。噬天，你我今日一戰，勝負早在你選擇『吞噬』而非『證道』的那一刻，便已註定。」\n\n失了三成根基的噬天，那五百萬的戰力已然大打折扣。而墨飛那剋制噬道的問道之光、那越戰越明的「觀道」、那如臂使指的合體之力，此刻攻守易勢。\n\n墨飛不再退避。他一步踏前，如一道金色的長虹，欺身而上。斷刀翻飛，一刀又一刀，蘊著問道至理的攻勢如潮水般湧向噬天。那曾逼得龍傲天燃燒生命、逼得同盟諸強絕望而逃的噬天大護法，此刻竟被墨飛死死壓制，節節敗退，只能狼狽地舉臂招架。\n\n「龍城主為護我等，燃盡畢生道行，屍骨無存。」墨飛一刀斬開噬天倉促凝起的血色護體，一字一頓，那聲音裡是滔天的恨與冰冷的決絕，「這一刀——」\n\n「為龍傲天！」\n\n那蘊著問道至理、蘊著滔天決意的一擊，帶著八片信物的浩瀚道韻，狠狠洞穿了噬天的胸膛。純陽的問道之光自傷口炸開，將那盤踞於噬天體內的無數怨魂道統，盡數超度、淨化。\n\n噬天那合體巔峰的魁梧身軀劇烈一震，赤紅的雙眼中滿是難以置信。它至死都不曾想到，自己這五百萬戰力、追隨教主萬古的大護法，竟會被一個剛破合體、戰力僅三百萬的問道傳人，重創於此。\n\n「問道……竟真能剋我噬道……」它踉蹌後退，那滔天的邪異氣機第一次現出頹勢，聲音裡是難以置信的驚懼，「教主……教主說得對……問道一脈，果然……果然是我噬道天教的死敵……」\n\n「你既知我問道是你噬道的死敵，」墨飛一步逼近，斷刀之上六色道韻未散，「便該知道，你們萬古之前覆滅問道一脈，非但沒能斬草除根，反倒為自己種下了今日的禍根。」\n\n「程守拙前輩隱姓埋名數十載，護下了問道最後的火種；龍城主燃盡畢生道行，為我斷後於歸墟；問道一脈萬千先賢，以殘念為我指路。」墨飛的聲音如金石相擊，一字一頓，「你們噬道天教吞噬了道，卻永遠吞噬不了『人心』。而這人心裡的道，才是真正不滅的光。」\n\n噬天張了張嘴，還想說什麼，可那被問道之光淨化的傷口再也支撐不住它龐大的軀體。它踉蹌著，那睥睨萬古的氣焰，一寸寸熄滅下去。\n\n而此時，血海之上，破陣而入的問道大軍，已如決堤的洪流般殺入了那搖搖欲墜的噬道總壇。劍光沖霄，正氣浩蕩，那萬古以來被噬道陰影籠罩的血海，第一次，被問道的光芒照亮。\n\n墨飛立於那金色的問道之光中，斷刀直指重創頹敗的噬天，一步步逼近。他的身後，是浴血奮戰的同盟；他的前方，是那潛藏了萬古、即將現身的最終之敵。\n\n決戰，已至最烈。而那噬道教主，那真正的萬古黑暗——也終於，要現身了。"} function updateBGM(){ var a=document.getElementById('bgm'); if(!a) return; try{ a.volume=0.5; }catch(e){} var want=state.musicOn && window._audioReady && !state.dead; if(want){ if(a.paused){ var p=a.play(); if(p&&p.catch) p.catch(function(){}); } } else { if(!a.paused) a.pause(); } }
function getCoin(k){ return k==='lingshi'?Math.floor(state.lingshi||0):Math.floor((state.coin&&state.coin[k])||0); }
function setCoin(k,v){ if(k==='lingshi') state.lingshi=v; else { state.coin=state.coin||{}; state.coin[k]=v; } }
function normalizeWallet(){ for(var i=0;i<CUR.length-1;i++){ var per=CUR[i+1].per; var c=getCoin(CUR[i].k); if(c>=per){ var up=Math.floor(c/per); setCoin(CUR[i].k,c-up*per); setCoin(CUR[i+1].k,getCoin(CUR[i+1].k)+up); } } }
function gainLingshi(base){ base=Math.floor(base||0); if(base<=0) return; state.lingshi=(state.lingshi||0)+base; normalizeWallet(); }
function canAfford(cost){ cost=Math.floor(cost||0); if(cost<=0) return true; var t=getCoin('lingshi'); if(t>=cost) return true; var per=1; for(var i=1;i<CUR.length;i++){ per*=CUR[i].per; var n=getCoin(CUR[i].k); if(n>0){ if(per>=cost) return true; t+=n*per; if(t>=cost) return true; } } return t>=cost; }
function ensureLow(need){ need=Math.floor(need); if(getCoin('lingshi')>=need) return true; var guard=0; while(getCoin('lingshi')<need && guard++<500){ var j=-1; for(var x=1;x<CUR.length;x++){ if(getCoin(CUR[x].k)>0){ j=x; break; } } if(j<0) return false; var per=1; for(var y=1;y<=j;y++) per*=CUR[y].per; var deficit=need-getCoin('lingshi'); var cnt=Math.min(getCoin(CUR[j].k), Math.max(1,Math.ceil(deficit/per))); setCoin(CUR[j].k,getCoin(CUR[j].k)-cnt); setCoin(CUR[j-1].k,getCoin(CUR[j-1].k)+cnt*CUR[j].per); } return getCoin('lingshi')>=need; }
function payLingshi(cost){ cost=Math.floor(cost||0); if(cost<=0) return true; if(!canAfford(cost)) return false; ensureLow(cost); if(getCoin('lingshi')<cost) return false; state.lingshi-=cost; normalizeWallet(); return true; }
function lingshiDisp(){ for(var i=CUR.length-1;i>=0;i--){ var n=getCoin(CUR[i].k); if(n>0) return fmt(n)+' '+CUR[i].nm; } return '0 下品靈石'; }
function wealthDisp(){ var total=0, mul=1; for(var i=0;i<CUR.length;i++){ if(i>0 && CUR[i].per) mul*=CUR[i].per; total+=getCoin(CUR[i].k)*mul; } return fmt(total); }
/* ===== 分階計價 + 購買確認 + 找零手續費 ===== */
var CHANGE_FEE=8;
function tierPer(i){ var p=1; for(var k=1;k<=i;k++) p*=CUR[k].per; return p; }
function costTier(cost){ cost=Math.floor(cost||0); var T=0; for(var i=0;i<CUR.length;i++){ if(cost/tierPer(i)>=10000) T=i+1; else break; } if(T>CUR.length-1)T=CUR.length-1; return T; }
function qCost(cost){ cost=Math.floor(cost||0); if(cost<=0)return 0; var T=costTier(cost); var p=tierPer(T); return Math.max(p, Math.round(cost/p)*p); }
function costDisp(cost){ var c=qCost(cost); if(c<=0) return '0 '+CUR[0].nm; var T=costTier(c); var p=tierPer(T); return fmt(Math.round(c/p))+' '+CUR[T].nm; }
function tierWealthLE(T){ var t=0; for(var i=0;i<=T;i++) t+=getCoin(CUR[i].k)*tierPer(i); return t; }
function totalWealth(){ var t=0; for(var i=0;i<CUR.length;i++) t+=getCoin(CUR[i].k)*tierPer(i); return t; }
function canAffordTier(cost){ return totalWealth()>=qCost(cost); }
function payPreview(cost){
  var c=qCost(cost); var T=costTier(c); var payTier=CUR[T].nm;
  if(c<=0) return {ok:true,clean:true,disp:costDisp(c),payTier:payTier};
  if(totalWealth()<c) return {ok:false,disp:costDisp(c),payTier:payTier};
  var clean=tierWealthLE(T)>=c;
  if(clean) return {ok:true,clean:true,disp:costDisp(c),payTier:payTier};
  var rem=c, snap={}; CUR.forEach(function(cu){ snap[cu.k]=getCoin(cu.k); });
  for(var i=T;i>=0;i--){ var pv=tierPer(i); var use=Math.min(snap[CUR[i].k], Math.floor(rem/pv)); snap[CUR[i].k]-=use; rem-=use*pv; }
  var acc=0, broke=[];
  for(var j=T+1;j<CUR.length && acc<rem;j++){ var pv2=tierPer(j); while(snap[CUR[j].k]>0 && acc<rem){ snap[CUR[j].k]--; acc+=pv2; if(broke.indexOf(CUR[j].nm)<0)broke.push(CUR[j].nm); } }
  var change=acc-rem, Tm1=T-1, changeUnits=0, fee=0, changeTier=(Tm1>=0?CUR[Tm1].nm:CUR[0].nm);
  if(change>0){ var ptm1=tierPer(Tm1>=0?Tm1:0); var u=Math.floor(change/ptm1); fee=u-Math.floor(u*(1-CHANGE_FEE/100)); changeUnits=u-fee; }
  return {ok:true,clean:false,disp:costDisp(c),payTier:payTier,broke:broke,changeUnits:changeUnits,changeTier:changeTier,fee:fee};
}
function payByTier(cost){
  var c=qCost(cost); if(c<=0) return true; if(totalWealth()<c) return false;
  var T=costTier(c), rem=c;
  for(var i=T;i>=0;i--){ var pv=tierPer(i); var have=getCoin(CUR[i].k); var use=Math.min(have, Math.floor(rem/pv)); if(use>0){ setCoin(CUR[i].k, have-use); rem-=use*pv; } }
  if(rem>0){ var acc=0; for(var j=T+1;j<CUR.length && acc<rem;j++){ var pv2=tierPer(j); while(getCoin(CUR[j].k)>0 && acc<rem){ setCoin(CUR[j].k, getCoin(CUR[j].k)-1); acc+=pv2; } } var change=acc-rem; var Tm1=T-1; if(change>0){ if(Tm1<0){ state.lingshi=(state.lingshi||0)+change; } else { var ptm1=tierPer(Tm1); var u=Math.floor(change/ptm1); u=Math.floor(u*(1-CHANGE_FEE/100)); setCoin(CUR[Tm1].k, getCoin(CUR[Tm1].k)+u); } } }
  normalizeWallet(); return true;
}
function askBuyConfirm(cost,fn,args,title){ state.buyConfirm={fn:fn,args:args,title:title,pv:payPreview(cost)}; render(); }
function confirmBuyCancel(){ state.buyConfirm=null; render(); }
function confirmBuyOK(){ var b=state.buyConfirm; if(!b){ return; } state.buyConfirm=null; state._payGo=true; try{ window[b.fn].apply(null,b.args); }finally{ state._payGo=false; } }

  h+='<div style="display:flex;gap:8px;"><button class="item-btn" style="background:#3a8a4a;color:#fff;padding:9px;flex:1;" onclick="confirmBuyOK()">確認購買</button><button class="item-btn" style="background:#999;color:#fff;padding:9px;flex:1;" onclick="confirmBuyCancel()">取消</button></div>';
  h+='</div></div>'; return h; }

/* ===== 換幣暫存（按兌幣才生效；取消或離開還原） ===== */
function ensureExchWork(ctx){ if(!state.exchWork || state.exchWork.ctx!==ctx){ state.exchWork={ctx:ctx, lingshi:Math.floor(state.lingshi||0), coin:JSON.parse(JSON.stringify(state.coin||{}))}; } }
function ewGet(k){ var w=state.exchWork; if(!w) return getCoin(k); return k==='lingshi'?Math.floor(w.lingshi||0):Math.floor((w.coin&&w.coin[k])||0); }
function ewSet(k,v){ var w=state.exchWork; if(!w) return; v=Math.max(0,Math.floor(v)); if(k==='lingshi') w.lingshi=v; else { if(!w.coin)w.coin={}; w.coin[k]=v; } }
function exchUp(i,fee){ if(!state.exchWork) return; var lo=CUR[i],hi=CUR[i+1]; var need=Math.ceil(hi.per/(1-fee/100)); var have=ewGet(lo.k); var cnt=Math.floor(have/need); if(cnt<=0){ showToast('需 '+fmt(need)+' '+lo.nm+' 兌 1 '+hi.nm); return; } ewSet(lo.k, have-cnt*need); ewSet(hi.k, ewGet(hi.k)+cnt); render(); }
function exchDown(i,fee){ if(!state.exchWork) return; var hi=CUR[i],lo=CUR[i-1]; if(ewGet(hi.k)<=0){ showToast('沒有 '+hi.nm); return; } var got=Math.floor(hi.per*(1-fee/100)); ewSet(hi.k, ewGet(hi.k)-1); ewSet(lo.k, ewGet(lo.k)+got); render(); }
function exchDirty(){ var w=state.exchWork; if(!w) return false; if(Math.floor(w.lingshi||0)!==Math.floor(state.lingshi||0)) return true; for(var i=1;i<CUR.length;i++){ if((((w.coin||{})[CUR[i].k])||0)!==getCoin(CUR[i].k)) return true; } return false; }
function commitExch(){ var w=state.exchWork; if(!w) return; if(!exchDirty()){ showToast('未做任何兌換'); return; } state.lingshi=Math.floor(w.lingshi||0); state.coin=JSON.parse(JSON.stringify(w.coin||{})); normalizeWallet(); state.exchWork=null; addLog('【換幣】兌換完成','good'); showToast('兌換完成'); saveState(); render(); }
function cancelExch(){ state.exchWork=null; render(); }

function _encSf(){ return 1+(state.realm||0); }
function encReward(rw){ if(!rw) return '無所獲'; var a=[]; var sf=_encSf();
 if(rw.lingshi){ var v=Math.round(rw.lingshi*sf); gainLingshi(v); a.push('靈石+'+fmt(v)); }
 if(rw.xiuwei){ var xw=Math.round(rw.xiuwei*REALMS[state.realm].qiPerSec*1200); state.qi+=xw; state.totalQi+=xw; a.push('修為+'+fmt(xw)); }
 if(rw.weiwang){ state.weiwang=(state.weiwang||0)+rw.weiwang; a.push('威望+'+rw.weiwang); }
 if(rw.shouyuan){ state.shouyuan=Math.max(1,(state.shouyuan||0)+rw.shouyuan); a.push('壽元'+(rw.shouyuan>0?'+':'')+rw.shouyuan+' 年'); }
 if(rw.kuangshi){ state.kuangshi=(state.kuangshi||0)+rw.kuangshi; a.push('礦石+'+rw.kuangshi); }
 if(rw.lingcao){ state.lingcao=(state.lingcao||0)+rw.lingcao; a.push('靈草+'+rw.lingcao); }
 if(rw.gxCard){ state.gxCard=(state.gxCard||0)+rw.gxCard; a.push('卓越卡+'+rw.gxCard); }
 if(rw.baoxiang){ state.baoxiang=(state.baoxiang||0)+rw.baoxiang; a.push('寶箱+'+rw.baoxiang); }
 if(rw.elixir){ var ek=ELIXIRS.filter(function(e){return state.realm>=e.minRealm;}); var pick=ek.length?ek[Math.floor(Math.random()*ek.length)]:ELIXIRS[0]; state.elixirs[pick.id]=(state.elixirs[pick.id]||0)+rw.elixir; a.push(pick.name+'×'+rw.elixir); }
 return a.join('、')||'無所獲'; }
function encRwText(rw){ if(!rw) return ''; var a=[]; if(rw.lingshi)a.push('靈石'); if(rw.xiuwei)a.push('修為'); if(rw.weiwang)a.push('威望'); if(rw.kuangshi)a.push('礦石'); if(rw.elixir)a.push('丹藥'); if(rw.baoxiang)a.push('寶箱'); if(rw.shouyuan)a.push('壽元'); if(rw.gxCard)a.push('卓越卡'); return a.join('、'); }
function encChoiceSub(c){ if(c.quest) return '接取任務：'+c.quest.desc; if(c.cost){ var s=[]; if(c.cost.lingshi)s.push(fmt(c.cost.lingshi)+'+ 靈石'); return '耗費 '+s.join('、'); } if(c.risk!==undefined) return '成敗約各半，賭一把'; if(c.reward&&encRwText(c.reward)) return '即時獲得'; return '平安離去'; }
var _encTimer=null,_encInt=null,_encDeadline=0;
function startEncTimer(){ clearEncTimer(); _encDeadline=Date.now()+5000; _encTimer=setTimeout(autoEncChoose,5000); _encInt=setInterval(function(){ var el=document.getElementById('enc-count'); if(el){ var r=Math.ceil((_encDeadline-Date.now())/1000); el.textContent=(r>0?r:0); } },250); }
function clearEncTimer(){ if(_encTimer){ clearTimeout(_encTimer); _encTimer=null; } if(_encInt){ clearInterval(_encInt); _encInt=null; } }
function autoEncChoose(){ var e=state.encNow; if(!e){ clearEncTimer(); return; } var ok=[]; for(var i=0;i<e.choices.length;i++){ var c=e.choices[i]; if(c.cost&&c.cost.lingshi&&!canAfford(c.cost.lingshi)) continue; ok.push(i); } if(!ok.length) ok=[e.choices.length-1]; encChoose(ok[Math.floor(Math.random()*ok.length)]); }
function toggleAdminAutoEnc(){ state.adminAutoEnc=!state.adminAutoEnc; showToast(state.adminAutoEnc?'奇遇將自動取最佳（不跳介面）':'奇遇恢復跳出選擇介面'); saveState(); render(); }
function _scoreRw(rw){ if(!rw) return 0; return (rw.lingshi||0)+(rw.weiwang||0)*5+(rw.xiuwei||0)*120000+(rw.elixir||0)*5000+(rw.baoxiang||0)*9000+(rw.shouyuan||0)*1500+(rw.kuangshi||0)*200+(rw.lingcao||0)*150+(rw.gxCard||0)*30000; }
function encResolveBest(){ var e=state.encNow; if(!e) return; var best=0,bs=-1e18; for(var i=0;i<e.choices.length;i++){ var c=e.choices[i]; var rw=c.quest?c.quest.reward:(c.risk!==undefined?c.win:c.reward); var sc=_scoreRw(rw); if(sc>bs){ bs=sc; best=i; } } var cc=e.choices[best]; var rw2=cc.quest?cc.quest.reward:(cc.risk!==undefined?cc.win:cc.reward); var g=encReward(rw2); state.encNow=null; addLog('【奇遇·特權】'+e.title+'：'+g,'great'); showToast('奇遇（自動最佳）：'+g); saveState(); render(); }
function rollEncounter(force){ if(state.encNow||state.dead||state.offlineMode||state.currentTab==='battle') return; if(getDays()-(state.lastEncDay!=null?state.lastEncDay:-1e9) < ENC_COOLDOWN_DAYS) return; if(force||Math.random()<0.002){ state.lastEncDay=getDays(); state.encNow=ENCOUNTERS[Math.floor(Math.random()*ENCOUNTERS.length)]; if(state.admin&&state.adminAutoEnc){ encResolveBest(); } else { render(); startEncTimer(); } } }
function encChoose(ci){ clearEncTimer(); var e=state.encNow; if(!e) return; var c=e.choices[ci]; if(!c) return; var msg='';

 else if(c.risk!==undefined){ if(Math.random()<c.risk){ msg='成功！'+encReward(c.win); } else { msg='失手…'+encReward(c.lose); } }
 else { msg=encReward(c.reward); }
 state.encNow=null; addLog('【奇遇】'+e.title+'：'+msg,'good'); if(msg) showToast(msg); saveState(); render(); }
function encqDone(q){ if(q.type==='kill') return ((state.killTotal||0)-(q.base||0))>=q.need; if(q.type==='days') return getDays()>=((q.start||0)+(q.days||0)); return false; }
function encqProg(q){ if(q.type==='kill'){ var d=(state.killTotal||0)-(q.base||0); if(d>q.need)d=q.need; if(d<0)d=0; return '進度 '+d+' / '+q.need; } if(q.type==='days'){ var r=((q.start||0)+(q.days||0))-getDays(); return r<=0?'護送完成':'尚餘 '+r+' 天'; } return ''; }

window._holdT=null; window._holdI=null; window._suppressClick=false;
function holdFire(btn){ if(btn && btn.onclick){ try{ btn.onclick.call(btn, {stopPropagation:function(){}, preventDefault:function(){}, stopImmediatePropagation:function(){}}); }catch(e){} } }
function holdStart(btn){
  if(window._holdT){clearTimeout(window._holdT);window._holdT=null;}
  if(window._holdI){clearInterval(window._holdI);window._holdI=null;}
  window._suppressClick=true;    // 避免 mouseup 後的自然 click 重複觸發
  // 直接把「停止」綁在被點的按鈕本身：render() 會讓此按鈕脫離 DOM，
  // iOS 的 touchend 仍派發到原按鈕，綁在它身上才收得到（綁 document 會漏接）。
  try{
    btn.addEventListener('touchend', holdStop, {once:true});
    btn.addEventListener('touchcancel', holdStop, {once:true});
    btn.addEventListener('mouseup', holdStop, {once:true});
    btn.addEventListener('mouseleave', holdStop, {once:true});
  }catch(e){}
  holdFire(btn);                 // 立即 +1（或 -1）
  window._holdT=setTimeout(function(){
    window._holdI=setInterval(function(){ holdFire(btn); }, 100);
  }, 2000);
}
function holdStop(){
  if(window._holdT){clearTimeout(window._holdT);window._holdT=null;}
  if(window._holdI){clearInterval(window._holdI);window._holdI=null;}
}
if(!window._holdInit){

    ev.preventDefault();
    holdStart(btn);
  });
  document.addEventListener('touchstart', function(ev){
    var btn = ev.target && ev.target.closest && ev.target.closest('.qbtn');
    if(!btn) return;
    ev.preventDefault();
    holdStart(btn);
  }, {passive:false});
  document.addEventListener('mouseup', holdStop);
  document.addEventListener('mouseleave', holdStop);
  document.addEventListener('touchend', holdStop);
  document.addEventListener('touchcancel', holdStop);
  // 在 capture phase 攔截 mousedown 之後的 click，避免雙重觸發
  document.addEventListener('click', function(ev){
    var btn = ev.target && ev.target.closest && ev.target.closest('.qbtn');

      ev.stopPropagation();
      ev.stopImmediatePropagation();
    }

function guideHTML(){ return '<div class="ts-mask" onclick="event.stopPropagation();closeGuide()"></div><div class="task-sheet" onclick="event.stopPropagation()"><div class="ts-head">📖 玩法攻略<span class="ts-x" onclick="closeGuide()">✕</span></div><div class="ts-scroll" style="padding:4px 12px 14px;"><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🌀 核心玩法循環</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">本作為修仙掛機遊戲，兩條主線並行：①<b>靜心修煉</b>（掛機自動累積修為，悟性越高越快）；②<b>入境歷練</b>（擊殺妖獸換取大量修為與掉落）。前期掛機慢、擊殺快，<b>擊殺是主要成長來源</b>。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">⚡ 突破境界</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">修為蓄滿「突破所需」（＝境界基準×1400）即可衝境，每個小階都要蓄滿一次。突破有<b>成功率</b>，越高境越難；<b>心性</b>可提高成功率並抗心魔（失敗扣壽元）。渡劫期以上突破即「渡劫」，戰力與法寶能加成功率。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">⚔️ 戰鬥系統（最重要）</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">・手動施放<b>法術</b>：傷害＝功法威力＋攻擊×0.5，且<b>不吃怪物防禦</b>，是穿透高防怪的關鍵。<br>・自動戰鬥＝30%物攻＋70%自動施法，法力足夠時同樣吃功法傷害；但物攻要扣防，裝備不足時<b>手動施法效率遠高於純掛機</b>。<br>・<b>法力管理</b>：法術耗法力，見底會退回劍氣（弱）。靈力型功法可擴充法力上限。<br>・減傷上限85%；閃避／反擊／暴擊靠身形、眼力與功法。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">📚 功法配置建議</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">內功四系優先：<b>金</b>（攻擊）、<b>土</b>（防禦＋減傷）、<b>光</b>（全屬性％）、<b>水</b>（閃避）。外功／法術帶一支高傷單體或群體（火系有濺射）。靈力型補法力池。功法可升至 <b>Lv10</b>（威力約×3.5）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">💠 投資優先序</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;"><b>同階全套裝備 ＞ 功法升滿 ＞ 洞府設施 ＞ 宗門階級</b>。裝備的根骨／體魄換算成攻防，是戰力主體；設施（食堂血量、酒肆法力、礦山攻防）為永久％加成。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🧬 素質對照</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">根骨→攻擊＋減傷；體魄→血量＋防禦；悟性→修練效率＋法力上限；眼力→暴擊＋命中；身形→閃避＋反擊；心性→突破率＋抗心魔；福緣→掉寶倍率；機緣→晉升機緣。突破會自動成長全素質（越高境長越多）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">💰 貨幣與兌幣</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">靈石分階（下品→…→仙玉→神石），滿額自動進位；大額交易以錢袋總額支付。萬寶樓／城主府／宗門接待所可兌幣（有手續費）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🗺️ 場所・越級・變異・大BOSS</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">每突破一境，開放「當前＋下一境」場所，可<b>越級打怪</b>（高風險、多半打不過，屬耍帥）。一般歷練每隻怪 <b>8%</b> 機率變「變異」（×3~5）。每場所有固定「<b>王</b>」大BOSS（×20~25，附2~3變異護衛），戰鬥畫面可挑戰。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🏯 宗門試煉與上呈</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">入宗後六階：外門→內門→真傳弟子→外門→內門→傳功長老，各給永久增幅（長老另加防禦／減傷，傳功再加暴擊／機緣）。主殿可「上呈」功法換點數（傳功長老需50）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🌌 境界階梯</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">凡人→煉氣→築基→金丹→元嬰→化神→渡劫→大羅金仙→<b>準聖→聖人→道祖</b>（頂）。對應裝備階：凡品…仙品→混沌→<b>太初→鴻蒙→大道</b>。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">💡 小技巧</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">・打不動時先回頭把同階裝備補滿、功法升級，再挑戰同境最強怪。<br>・洞府 💾 可匯出存檔備份。<br>・道途只記大BOSS戰績。</div></div></div>'; }
