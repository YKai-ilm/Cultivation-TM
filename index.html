\n\n噬道天教!\n\n墨飛，眸光，驟然，一冷。\n\n那幾道，擄掠少女的,黑袍人，以「道眼」一掃——【噬道魔修,金丹至元嬰不等】。他們，竟，如此，明目張膽，於，這，萬劍門,眼皮底下，行,擄掠之事!\n\n「噬道天教的,爪牙，果然，也，滲透,到了,西陲。」墨飛，心中，瞭然。\n\n而那，坊市之中，往來的,西陲修士，見是,噬道天教的人，竟，大多，噤若寒蟬，避之，唯恐,不及，無一人，敢，上前，相救。\n\n「連,萬劍門的,地界，噬道天教，都，敢，如此，猖狂?」凌霜，秀眉，緊蹙，「這西陲，只怕，早已，被，噬道，滲透得，千瘡百孔。」\n\n墨飛，卻，不再，多言。\n\n那少女的,呼救，那，噬道魔修的,猖狂——他，見了，豈能，坐視?\n\n「石大哥，護好,四周。」墨飛，一步，踏出，那，元嬰後期的,浩瀚氣息，與，那，六色道韻，同時，綻放，「這，噬道的,爪牙——」\n\n「我，來,會會。」\n\n他，身形，一晃，如，一道，問道之光，攔在了,那，擄掠少女的,黑袍人,面前，聲音，冰冷:\n\n「光天化日，噬道邪祟，也敢，擄掠良善?」\n\n「這少女，」墨飛，眸中，寒光,凜冽，「你們，放，是,不放?」\n\n——\n\n那，為首的黑袍人，見墨飛，攔路，眼中，掠過一絲，陰鷙:「哪來的,不長眼的,東西?也，敢，管，我噬道天教的,閒事?」\n\n他，周身，邪異真元，暴漲——那，是,一名，元嬰中期的,噬道魔修。\n\n可他，選錯了對手。\n\n墨飛，元嬰後期，戰力,兩萬有餘;更兼，那，剋制「反問道」邪法的,問道之道。\n\n那魔修，一縷縷,毀道噬道的,黑氣，攻來，在墨飛的「觀道」之下，破綻，盡顯。墨飛，甚至，未曾，動用，全力，只，一記，蘊著,問道至理的《裂石訣》，便，破開,那魔修的,邪異護體，將他，重重，擊飛，釘在,地上，動彈,不得!\n\n其餘,幾名，金丹的,黑袍人，見,首領，一招，便,被,秒殺，皆，駭得，魂飛魄散，丟下,那少女，亡命，遁逃。\n\n「一個,元嬰後期的,問道修士?!」被擊飛的,魔修首領，難以置信，「你，你到底,是誰?!」\n\n「你們，噬道天教，覆滅問道一脈，禍亂天地。」墨飛，緩步，上前，居高臨下，眸中，寒光，凜冽，「而我——正是，你們，想，斬草除根，卻，斬,不盡的——」\n\n「問道一脈的,傳人。」\n\n「問道傳人?!」那魔修首領，聞言，如遭雷擊，那,陰鷙的臉上，瞬間，血色，盡褪，「你，你就是,墨飛?!斬殺,墨淵護法的,那個,問道傳人?!」\n\n墨飛之名，經,天南一戰，早已，傳遍，噬道天教。這魔修，一聽，便，嚇得，亡魂,大冒。他，再不敢，多言，竟，也，施展,邪術，不惜，自損，遁逃，只，留下，一句，色厲內荏的，狠話:\n\n「你，等著!此事，我，必，稟報，西陲,分壇……」\n\n墨飛，並未,追殺。他，收回目光，望向，那，被救下的、驚魂未定的,少女。\n\n那少女，約莫，二八年華，生得，清麗，懷中，緊緊，抱著，一柄，古樸的,長劍。她，望著墨飛，眼中，滿是,劫後餘生的,感激:\n\n「多謝,前輩,救命之恩!小女子,柳輕眉,乃,萬劍門,記名弟子。」她，盈盈，一拜，「這，噬道天教的,惡徒，覬覦,我家,傳承的,這柄『問心劍』,已久。今日，若非,前輩,出手——」\n\n「萬劍門,弟子?」墨飛，心中，一動。\n\n真是，得來，全不費功夫。他，正愁，如何，尋一個，取信,萬劍門的,契機;卻，不想，這，坊市之中，一場,見義勇為，便，恰好，救下了，一名，萬劍門的,弟子。\n\n「柳姑娘，不必,多禮。」墨飛，扶起她，溫言道，「路見不平，理所應當。」\n\n他，略一沉吟，坦然道:「實不相瞞。我，墨飛，乃,天南,問劍宗弟子，此番，遠來,西陲，正是，有一樁，關乎,萬劍門,鎮派之寶『問劍碑』的,要事，欲，求見，貴門,掌門。」\n\n「不知,柳姑娘，可否，代為，引薦?」\n\n柳輕眉，聞言，感激,之下，自是，滿口，應承:「前輩，救命之恩,尚未,報答，這點,小事，何足,掛齒!前輩,隨我,來,便是!」\n\n「只是——」她，遲疑，一下，壓低,聲音，「前輩，那『問劍碑』,乃，我萬劍門，鎮派之寶，門中，看守，森嚴。而近來，門中……也，頗，不太平。」\n\n「不太平?」墨飛，眸光，一凝。\n\n「嗯。」柳輕眉，神色，凝重，「近來，門中，接連，有,長老，離奇,走火入魔;更，隱隱，傳言，說，那,噬道天教的,爪牙，早已，滲透，進了,萬劍門的,內部……」\n\n墨飛，與凌霜，交換了，一個，凝重的,眼神。\n\n走火入魔、噬道滲透——這，一幕，與，當初，問劍宗，陰無常,潛入之事，何其,相似!\n\n「看來，」墨飛，望向，那，劍氣沖霄的,萬劍門，眸光，森然，「噬道天教，覬覦的，不只是,那，問劍碑中的,問道信物。」\n\n「這，萬劍門，」他，一字一頓，\n\n「只怕，也，早已，是，一座，暗藏,殺機的,龍潭虎穴。」"}, {"t": "第四十七章 問劍碑", "c": "在柳輕眉的引薦下，墨飛一行，順利，登上了，萬劍峰，見到了，萬劍門的,掌門——劍無塵。\n\n劍無塵，是一位，身著,樸素劍袍、周身，卻，縈繞著，凜冽劍意的,老者。他，已臻，化神之境，一雙,眸子，銳利,如劍，彷彿，能，洞穿,一切,虛妄。\n\n得知墨飛，是，斬殺墨淵、力抗噬道的,問道傳人，劍無塵，那,銳利的眸中，掠過一絲，鄭重與，讚許。\n\n「問道傳人。」他，緩緩道，「墨飛小友,力抗噬道之事,老夫,亦有,耳聞。噬道天教,禍亂天下，覆滅道統，乃,我輩,共同之敵。小友，遠來,西陲，所為,何事?」\n\n墨飛，坦然，將，來意，和盤，托出:「晚輩，此番，前來，是為，貴門，鎮派之寶——問劍碑。」\n\n「問劍碑?」劍無塵，眉頭，微皺。\n\n「晚輩，身負，重興,問道一脈的,使命。」墨飛，一字一句，「而據，晚輩，所持的,問道信物,推衍——貴門，那，問劍碑之中，隱藏著，一片，問道一脈的,信物。」\n\n「晚輩，斗膽，懇請，一觀，問劍碑，以，印證，此事。」\n\n此言一出，滿殿，皆驚。萬劍門的,問劍碑，乃，鎮派之寶，豈容，外人，覬覦?幾位，萬劍門的,長老，當即，面露,不悅。\n\n劍無塵，卻，並未,動怒。他，那，銳利的眸子，深深，凝視著墨飛，良久，方，緩緩，道:\n\n「口說,無憑。問劍碑，乃，本門，鎮派之寶，非，本門,核心,弟子，不得,靠近。」\n\n「不過——」他，話鋒，一轉，「小友，既說，那問劍碑，與，你的,問道信物，遙相,呼應。老夫，便，給你,一個,機會。」\n\n「隨我，來。」\n\n——\n\n問劍碑，供奉於，萬劍峰,峰頂，一座，古老而,莊嚴的,劍冢之中。\n\n那，是一方，高達數丈的,古樸石碑，通體，縈繞著，凜冽,到，極致的,劍意。碑面之上，銘刻著，億萬道,玄奧的,劍痕，靈光,流轉，散發著，一股，睥睨,萬古的,劍道,至理。\n\n傳聞，唯有，劍道,天賦,絕世、且，與，問劍碑,有緣者，方能，於，這碑前，感悟，那，無上的,劍道傳承。萬劍門,歷代,無數,天驕，於此碑前，窮盡,一生，也，未必，能，感悟,分毫。\n\n墨飛，緩步，走近，那，問劍碑。\n\n當他，靠近的,剎那——\n\n那，一直，沉寂的,問劍碑，竟，驟然，亮起!一縷，溫潤的,道韻，自那，凜冽的劍意深處，緩緩，浮現，與，墨飛，識海中的,問道盤，遙相，呼應!\n\n【偵測到:問劍碑深處,藏有——問道信物！】\n【〔此信物,被上古劍道大能,以劍意,封存於問劍碑之中。唯有,問道傳人,方能,以問道之力,將其,喚醒、取出〕】\n\n「果然!」墨飛，眸中，一亮。\n\n那，一幕，落在，劍無塵，與，眾多，萬劍門弟子的,眼中，卻，是，驚天，動地!\n\n「問劍碑……它，亮了?!」\n\n「千百年來，這問劍碑，從未,如此,異動過!那,墨飛，他，究竟，做了,什麼?!」\n\n劍無塵，那，銳利的眸中，更是，翻湧，起，滔天的,驚異。他，執掌萬劍門,數百年，這問劍碑，於他，亦是，深不可測、無法,盡窺;可此刻，它，竟，因，這，問道傳人的，靠近，而，甦醒、呼應!\n\n「墨飛小友，」劍無塵，聲音，都，帶上了，一絲，鄭重，「你，所言，非虛。這問劍碑，果然，與，你的,問道一脈，有著，某種，淵源。」\n\n墨飛，鄭重，拱手:「掌門，這問劍碑之中的,問道信物，關乎，問道一脈的,復興，關乎，對抗,噬道天教的,大計。晚輩，懇請，掌門，允准，晚輩，將，其,喚醒、取出。」\n\n「而，那，問劍碑,本身的，無上劍道傳承——」墨飛，坦然道，「晚輩，分毫，不取。它，仍，是，貴門，鎮派之寶。」\n\n劍無塵，沉吟。\n\n問道信物，關乎，天下,道統存亡;而，墨飛，又，允諾，不取，問劍碑的,劍道傳承。這，於，萬劍門，並無,損失，反倒，能，結一份，問道傳人的,善緣，共禦,噬道。\n\n「好。」劍無塵，終於，頷首，「老夫，允了。」\n\n然而，就在，此時——\n\n峰頂，那，一直，靜謐的,劍冢深處，一道，陰鷙,而，森然的,聲音，突兀，響起:\n\n「掌門，此事，萬萬,不可!」\n\n墨飛，眸光，驟然，一凝。他，那「道眼」，早已，捕捉到——那，出言,阻攔之人，一名，萬劍門的,長老，其，氣息之下，竟，纏繞著，一絲，極其,隱晦的——「反問道」之韻!\n\n噬道天教，滲透，進，萬劍門的,那條,毒蛇，終於，在，這，問劍碑前，露出了，它的，尾巴。\n\n——\n\n那，出言,阻攔的長老，名喚,古長天，乃，萬劍門，一位，元嬰後期的,執法長老，德高望重。\n\n「掌門，這墨飛，來歷不明,妄稱,問道傳人。」古長天，陰惻惻地,道，「他，覬覦,我門,鎮派之寶，其心，可誅!那問劍碑,異動，焉知，不是，他，施了,什麼,妖法,蠱惑?萬萬，不可，讓他，靠近，問劍碑!」\n\n他，這番話，說得，冠冕堂皇，引得，幾位，不明就裡的長老，紛紛，附和。\n\n墨飛，卻，冷冷,一笑。\n\n「古長老，」他，一字一句，那，承接了問道道統的「道眼」，將，古長天，那，深藏的,邪異氣息，盡數，看穿，「你，如此，急於，阻攔我，靠近，問劍碑——」\n\n「是，怕我，取走，那，問道信物;還是，怕我，壞了，你，噬道天教，覬覦，問劍碑,已久的,大計?」\n\n此言一出，滿殿，皆驚!\n\n「墨飛,你,血口噴人!」古長天，臉色，驟變，厲聲，喝道。\n\n「是不是,血口噴人，」墨飛，眸光，森然，「掌門，一探，便知。」\n\n「掌門!」他，轉向，劍無塵，鄭重道，「這古長天，身上，纏繞著，噬道天教的『反問道』之韻!近來，貴門，那，接連,走火入魔的,長老，只怕，皆，是，他,以邪法，暗害!他，潛伏,門中，覬覦的，正是，這，問劍碑,與，其中的,問道信物!」\n\n劍無塵，那，銳利如劍的眸子，驟然，一凝，神識，如,劍，暴射，探向，古長天!\n\n那，一探之下，劍無塵，臉色，劇變!\n\n古長天，那，看似,精純的,元嬰真元之下，果然，纏繞著，一絲，極其,隱晦、卻，千真萬確的——「反問道」邪韻!\n\n「古長天!」劍無塵，勃然大怒，一身，化神威壓，轟然，鎮壓，而下，「你，竟,真是，噬道天教的,爪牙?!你，暗害同門，潛伏門中——」\n\n古長天，見，身份，敗露，那，德高望重的,偽裝，瞬間，褪去，化作，一片，陰鷙,與，狠戾!\n\n「墨飛!問道餘孽!」他，怨毒地，剜了墨飛,一眼，「壞我,大事!」\n\n「也罷!事已至此——」他，眼中，凶光，暴漲，周身，那，隱藏已久的,邪異真元，轟然，爆發，竟，不顧一切地，朝著，那，問劍碑，撲去，「這問劍碑,與，問道信物，我教，覬覦，已久!今日，得不到——」\n\n「那便，讓，它，與，這問道信物，一同，毀滅!誰,也，別想，得到!」\n\n他，一掌，攜著，滔天的,邪異之力，狠狠，朝著，那，問劍碑，那，蘊藏著，無上劍道傳承與，問道信物的，鎮派之寶，轟然，拍落!\n\n「住手!」劍無塵，大驚，那，可是，萬劍門，萬載的,鎮派根基!\n\n千鈞一髮之際——\n\n一道，六色道韻的流光，比，劍無塵，還要，快上，一線!\n\n墨飛，暴起!他，早，以「推衍」，算到了，古長天，這，狗急跳牆、玉石俱焚的一擊!\n\n他，將，問道元嬰的,全部力量，凝於，斷刀，一記，蘊著，問道至理的,雷霆之擊，硬生生，攔在了，古長天，那，毀碑一掌，與，問劍碑，之間!\n\n轟隆——!"}, {"t": "第四十八章 護碑", "c": "墨飛那，凝聚了問道至理的雷霆一擊，與古長天那，玉石俱焚的毀碑一掌，轟然，相撞!\n\n滔天的餘波，將二人，同時，震退。而那，萬劍門的鎮派之寶問劍碑，在墨飛的，拚死一擋之下，安然，無恙!\n\n「問道餘孽!」古長天，見，毀碑不成，狂怒，暴喝，一身，邪異真元，盡數，催發，朝墨飛，瘋狂，攻來，「我,先,殺了你!」\n\n可他，選錯了對手。\n\n古長天，元嬰後期，戰力，不過，五千餘;而墨飛，同為，元嬰後期，戰力，卻，已，突破,兩萬!更兼，那，剋制「反問道」邪法的,問道之道!\n\n那，古長天，一縷縷,毀道噬道的黑氣，在墨飛的「觀道」之下，破綻，盡顯;那，看似,凶險的,邪法，被墨飛，那，浩瀚的問道之光，一一，消融、克制!\n\n不過，數招，墨飛，便，以，碾壓之勢，破開,古長天的,邪異護體，一記，蘊著,問道至理的《裂石訣》，將他，重創，釘於，地上!\n\n而，一旁，早已，勃然大怒的,劍無塵，更是，一劍，斬出，那，化神劍意，如，天河,傾瀉，將，那，重傷的,古長天，周身,真元，盡數，封鎖，動彈，不得!\n\n「古長天!你，暗害同門、勾結噬道、更，欲，毀我，鎮派之寶!」劍無塵，那，銳利的眸中，殺意，滔天，「萬劍門，數百年，養你,栽培你，你，竟，是，這等,狼心狗肺的,噬道爪牙!」\n\n古長天，被，那，化神劍意，鎖住，動彈不得，那，陰鷙的臉上，卻，仍，帶著，一絲，狠戾的,冷笑:\n\n「哼……我教，籌謀,萬古，勢,不可擋。你們，這些，井底之蛙，還在，為，一塊,破碑，沾沾自喜?」\n\n「等，我教教主，一統，這，天地道統之日——」他，森然，獰笑，「爾等，皆，將，淪為，噬道的,養料!」\n\n「還，猖狂?」劍無塵，冷哼，一劍，封了他的,言語與,真元，命，門中，弟子，將，這，噬道爪牙，押,入,劍獄，嚴加，看管，以待，審訊。\n\n一場，潛藏於，萬劍門的,噬道殺局，就此，被，墨飛，一舉，破去。\n\n——\n\n護碑破奸，墨飛，於，萬劍門，立下，大功。\n\n劍無塵，望向墨飛的眼神，早已，從，最初的,審視，化作了，由衷的,鄭重與,感激。\n\n「墨飛小友，」他，鄭重，拱手，「若非，你，識破,古長天，力保,問劍碑——後果，不堪，設想。這份,恩情，我萬劍門，記,下了。」\n\n「掌門，言重。」墨飛，回禮，「噬道天教，禍亂,天下，你我，共禦，本是，分內之事。」\n\n劍無塵，不再，遲疑。他，當即，宣布，允准，墨飛，喚醒、取出，那，問劍碑中的,問道信物。\n\n墨飛，緩步，走到，那，問劍碑前。\n\n他，凝神，運轉，那，承自道統的「問道錄」道法，與，識海中的,問道盤，將，那，浩瀚的問道之力，緩緩，注入，問劍碑。\n\n那，一直，沉睡於，凜冽劍意深處的,問道信物，感受到，同源道韻的,呼喚，緩緩，甦醒!\n\n嗡——\n\n一縷，溫潤而，璀璨的,問道之光，自那，問劍碑的，深處，緩緩，升起，飛入，墨飛的，掌心，化作，一枚，古樸的、與，他，先前，那片信物，一般無二的——問道信物!\n\n第二片，問道信物，到手!\n\n當墨飛，握住，那，第二片信物的，剎那，識海中，那，兩片，問道信物，遙相，呼應，綻放出，更加,璀璨的道韻!一段，比，先前，更為，清晰、也更為，驚人的,問道傳承與,秘辛，緩緩，湧入，墨飛的，識海——\n\n那，是，問道一脈，覆滅,前夕，更深層的,真相;是，關於，噬道天教,教主的，更多，線索!\n\n墨飛，緩緩，闔上眼，沉浸於，那，湧入的,信息洪流之中。\n\n而，那，問劍碑，在，交出，問道信物之後，那，凜冽的劍意，非但,未曾,減損，反而，因，問道之力的,溫養，愈發，精純、圓融——這，讓，一旁的,劍無塵，與，萬劍門眾弟子，皆，驚喜，不已。\n\n「問道之力，竟，能，溫養,劍意?!」劍無塵，望著，那，愈發，圓融的,問劍碑，眼中，滿是，震撼與，讚嘆，「問道傳人，果然，非同,凡響。」\n\n墨飛，取得信物，與，劍無塵，結下，深厚的,善緣。萬劍門，這，西陲第一劍道大宗，自此，成了，墨飛，重興問道、對抗噬道的，又，一大,助力。\n\n而墨飛，卻，在，那，湧入識海的,信息之中，臉色，漸漸，凝重，起來。\n\n因為，那，第二片信物，所揭示的,關於，噬道天教教主的,線索——\n\n比，他，想像中，還要，恐怖，百倍。\n\n——\n\n墨飛，於，萬劍門，一處，清幽的靜室，靜靜，參詳，那，第二片信物，所揭示的,秘辛。\n\n凌霜，守在，一側。\n\n「墨飛，」她，見他，臉色，凝重，輕聲，問道，「這第二片信物，透露了，什麼?」\n\n墨飛，緩緩，睜開眼，那雙,星河流轉的眸子裡，是，前所未有的,凝重:\n\n「噬道天教的,教主。」他，一字一句，「我，知道，他，是,誰了。」\n\n「當年，覆滅問道一脈的,元兇，那，噬道天教的,教主——」墨飛，聲音，沉了下來，「他，並非，什麼，後起的,邪修。」\n\n「他，是，一個，自，問道一脈,尚未,覆滅的,萬古之前，便，已，存在的——」\n\n「合體境的,上古,大能。」\n\n「合體境?!」凌霜，秀眉，緊蹙，那，是，遠比，化神，還要，高出，兩個,大境界的,恐怖存在!「他，竟，活了，萬古?」\n\n「不。」墨飛，搖頭，眸中，掠過一絲，寒意，「不是,活了,萬古。」\n\n「是——他，以『噬道』之法，吞噬，天地間，一切,道統與,傳承，來，延續,自己的,壽元、壯大,自己的,力量。」\n\n「問道一脈，那，參透萬物、丈量大道的,無上道統，」墨飛，一字一頓，「便，是，他，萬古之前，吞噬的，最,肥美的，一份，養料。」\n\n「他，覆滅問道一脈，並非，只為,除去,一個,道統——」墨飛，望向，那，天地最深處，眸中，是，滔天的,恨意，與，凝重，「而是，為了，吞噬，問道一脈的,道，來，成就，他，自己!」\n\n靜室之內，一片，死寂。\n\n凌霜，望著墨飛，那雙,盛滿了,凝重的眸子，只覺得，一股,寒意，自，脊背，直,竄，天靈。\n\n一個，以，吞噬天下道統為食、活了萬古的,合體境,上古大能。這，便是，墨飛，此生，註定，要，面對的，最終之敵。\n\n這，是，何等，絕望的,鴻溝?\n\n「墨飛……」凌霜，握住他的手，聲音，微微，發顫，「合體境……那，幾乎，是，這方天地的,頂點……你,如何，能……」\n\n「我知道。」墨飛，卻，反握住她的手，那，凝重的臉上，卻，燃起了，一種，不肯，認命的,決絕，「以我，如今的,元嬰之境，別說，對抗，便是，站到，他，面前，都，不夠。」\n\n「可——」他，望向，那，識海中，兩片，遙相呼應的,問道信物，眸中，星河，激盪，「那，湮沒萬古的,問道先賢，早已，為我，指明了,道路。」\n\n「集齊,散落天下的,問道信物，重鑄，問道道統。」他，一字一句，斬釘截鐵，「問道之力，剋制,噬道。當,問道道統，徹底,重興之日——」\n\n「便，是，我，有,底氣，去，面對，那，噬道教主，去，為，問道一脈的,萬千先賢，去，為，我的,程伯——」\n\n「討回，那，萬古血債,之時!」\n\n凌霜，望著墨飛，那，明知,前路，是，何等，絕望的,鴻溝，卻，依舊，眼神,堅定、鬥志,昂揚的模樣，那顆，心，被，深深，觸動。\n\n「好。」她，重重，握緊，他的手，那清冷的眸中，是，並肩,至死的,決意，「這條路，這，萬古的血仇——」\n\n「我，凌霜，陪你，一同，走到，盡頭。」\n\n窗外，西陲的,劍氣，沖霄。\n\n第二片問道信物，已然，到手。而，那，最終之敵的,真面目，也，第一次，浮出，水面。"}, {"t": "第四十九章 化神之途", "c": "墨飛，於，萬劍門，盤桓，月餘。\n\n這一月，劍無塵，感念，墨飛，護碑破奸之恩，又，敬他，問道傳人的,擔當，不但，將，萬劍門，一應,珍稀資源，供墨飛,取用，更，親自，以，化神,劍道之悟，為墨飛，指點,修行。\n\n而墨飛，亦，投桃報李。他，以，問道之力，助劍無塵，梳理，那，因，古長天,暗害而，紊亂的,門中,劍陣;更，以，問道盤的「觀道」，替，萬劍門，那，幾位，中了,噬道邪法、命懸一線的,長老，尋出，了，化解之法。\n\n問道與劍道，正道與正道，惺惺相惜。\n\n一月之後，墨飛，欲，繼續，尋訪，其餘,問道信物的,行程。臨別之際，劍無塵，親自，相送，並，取出，一枚，萬劍門的,信物，鄭重，相贈:\n\n「墨飛小友，這，是，萬劍門的『召劍令』。他日，你，對抗噬道，但有,所需，持此令，我萬劍門，億萬,劍修，願為,你，拔劍！」\n\n墨飛，鄭重，接過。至此，繼，天南諸聖地之後，西陲第一劍宗萬劍門，亦，成了，他，重興問道、對抗噬道的,又，一大,臂助。\n\n那，被救的,少女柳輕眉，更是，紅著眼眶，前來，相送，將，一柄，親手,溫養的,靈劍，塞給石敢——原來，這一月，那，憨厚的漢子，與，這，清麗的劍門少女，竟，暗生，情愫。石敢，捧著，那，靈劍，憨憨地，紅了臉，惹得，墨飛與凌霜，相視，一笑。\n\n——\n\n離開萬劍門，靈舟，繼續，西行。\n\n墨飛，握著，那，兩片，問道信物，以「推衍」之能，繼續，追尋，其餘,信物的，下落。那，散落於，天地的,問道信物，如，一顆顆，散落的,星辰，指引著，他，重興問道的,漫漫，長路。\n\n而這一路，墨飛，也，並未，停下，精進的,腳步。\n\n有，兩片,問道信物,溫養道基，有，天南諸聖地、萬劍門,傳授的,無上道法，有，那，一路，斬妖除魔、對抗噬道的,歷練——墨飛的修為，一日千里。\n\n不知，過了，多久，這一日，靈舟，行至，一處，靈氣，磅礴的,靈山之巔。墨飛，只覺得，體內，那，圓融的問道元嬰，隱隱，躁動，那，橫亙於，元嬰與，化神之間的,天塹，第一次，鬆動!\n\n「化神……要到了。」墨飛，心中，一動。\n\n化神，是，修士的，第四道,大關。踏入，化神，神識，化形，一域強者，實力，將，再度，脫胎換骨。而，唯有，一步步，踏入，更高的，境界，他，才有，真正的,底氣，去，面對，那，噬道教主，那，合體境的,恐怖存在。\n\n「師姐，石大哥，」墨飛，望向，凌霜與石敢，「我，欲，於此，閉關，衝擊，化神。」\n\n「去吧。」凌霜，柔聲道，眸中，是，並肩的,信任，「我，與，石敢，為你，護法。」\n\n墨飛，於，那，靈山之巔，盤膝，坐下。\n\n他，運轉，那，承自道統的《問道錄》，以，兩片,問道信物為引，將，體內，磅礴的,元嬰真元，緩緩，導向，那，化神的,關隘。\n\n以，「守護」為心，以，「問道」為道，以，這一路,斬妖除魔、對抗噬道的,道心,為基——\n\n那，一尊，問道元嬰，於，識海之巔，緩緩，凝練、蛻變，那，眉心的,問道之光，愈發，璀璨、深邃!\n\n墨飛，衝擊，化神的,異象，引動，天地。那，靈山之巔，靈氣，翻湧，仙光，繚繞，一縷縷，玄奧的,道則之力，自，九天，垂落，將，墨飛，籠罩，其中!\n\n而，就在，墨飛，即將，踏入，化神的,那，關鍵，剎那——\n\n他，識海之中，那，兩片,問道信物，忽然，同時，爆發出，前所未有的，璀璨道韻!那道韻，與，墨飛，衝擊化神的,道則，交相輝映，竟，將，他，那，本就，與眾不同的,化神之途，推向了，一個，更為，玄妙、也更為，高遠的,境界!\n\n【墨飛│化神一層│問道化神(特殊)！】\n【神識化形。以「問道」證道,以「守護」為心。】\n【戰力……突破,五萬！】\n【〔此問道化神,承兩片問道信物之力、歷萬千歷練而成。問道之光,愈盛;剋制噬道之力,愈強〕】\n\n化神一層！戰力，五萬！\n\n墨飛，緩緩，睜開眼，那，眸中，星河，浩瀚，道則，流轉!他，只覺得，天地萬物，在，他，眼中，盡皆，化作，可觀、可算、可推衍的,大道紋路。他，那，承接了問道道統的，一雙眼睛，那，問道盤的權能，在，化神之力的,加持下，更是，臻至了，一個，前所未有的，清明,之境!\n\n他，終於，自，那個，被判「無緣」的廢根，那個，蜷縮於雜役堂的少年，一步，一步，走到了，這，神識化形、一域強者的,化神之境!\n\n「化神。」墨飛，立於，那，靈山之巔，望向，那，天地深處，那，潛藏著,噬道教主的,方向，眸中，戰意，熊熊，\n\n「離，那，合體境的,教主，還，很遠。」\n\n「可，我，會，一步，一步，走過去。」\n\n「集齊,信物，重鑄，道統，踏，化神、破,煉虛、證,合體……」他，一字一頓，那，是，一個，問道傳人，向，那，萬古之敵，許下的,宣言，\n\n「直到，有，一天。」\n\n「我，墨飛，重鑄的,問道之光——」\n\n「將，親手，照破,你，噬道天教,萬古的,黑暗。」\n\n——\n\n墨飛破境化神，那，衝天的道韻異象，驚動了，方圓,千里。\n\n凌霜與石敢，望著，那，破境而出、氣度，已然，睥睨一域的墨飛，皆，露出，由衷的,欣喜。\n\n「化神……墨兄弟，你，竟，這麼快，就，化神了!」石敢，激動得，直搓手。他，如今，也，已，金丹之境，可，望著墨飛，那，一日千里的,修行速度，仍，是，望塵莫及,唯有，滿心，敬佩。\n\n「一步，一步，走罷了。」墨飛，淡淡，一笑。\n\n他，望向，那，識海中，兩片，遙相呼應的,問道信物，心中，卻，並未,因,化神而，鬆懈,分毫。\n\n化神，於，尋常修士，已是，一域強者、高高在上。可，於，墨飛,而言，這，不過，是，他，重興問道、對抗噬道的,漫漫長路上，又，一級，尋常的,台階。\n\n他，那，最終之敵，是，一個，活了萬古、以吞噬道統為食的,合體境,上古大能。那，橫亙於，化神與合體之間的,鴻溝，深不可測。\n\n「還，遠遠，不夠。」墨飛，握了握拳，眸中，是，永不,熄滅的,戰意，「唯有，集齊,信物，重鑄道統，一路，向前。」\n\n而，就在，墨飛，破境化神的，同一時刻——\n\n天地，最深處，那，潛藏了，萬古的,噬道天教,總壇，一雙，古老,而，深邃、彷彿，蘊藏著,無盡歲月的,眸子，緩緩，睜開。\n\n「問道傳人……墨飛……」一道，蒼老,而，威嚴,到極致的,聲音，於，那，無邊的,黑暗中，緩緩，響起，「兩片問道信物……化神之境……」\n\n「有意思。萬古以來，問道一脈，這縷,火種，竟，還是，燒了，起來。」\n\n那聲音，並無,多少,怒意，反而，帶著，一絲，貓戲老鼠般的,漠然與，殘忍:\n\n「也罷。就，讓，你，多，蹦躂,一陣。多，集，幾片,信物。」\n\n「待，你，重鑄了，那，問道道統——」那雙，古老的眸子，深處，掠過一絲，令人,毛骨悚然的,貪婪，「本座，再，將，你，與，那，重鑄的道統，一併，吞噬。」\n\n「屆時，問道一脈，萬古的,道，便，將，徹底，成為，本座的,養料。」\n\n「墨飛……好好，長大罷。」\n\n那聲音，緩緩，消弭於，無邊的,黑暗。\n\n——\n\n墨飛，立於，靈山之巔，望向，那，天地深處，心底，那，敏銳到極致的,問道盤，竟，隱隱，捕捉到了，一絲，來自，那，最深處的、令人,心悸的,窺伺。\n\n他，眸光，一凝。\n\n「教主……」他，喃喃，眼底，卻，無半分,懼意，唯有，越燃，越烈的，戰意，「你，在，看,我。」\n\n「看罷。」他，望向，那，萬里,前程，一字一頓，\n\n「總有一天，我，會，走到,你，面前。」\n\n「以，這，問道之光——」\n\n「終結，你，噬道天教，萬古的，罪孽。」\n\n靈舟，再度，騰空，載著，一位，新晉，化神的,問道傳人，朝著，那，下一片，問道信物、那，更廣闊,也更凶險的,天地深處，破空，而去。\n\n前路，浩浩，蕩蕩。而，一個，問道傳人的,傳奇，正，朝著，那，橫跨萬古的,終極之戰，一步，一步，堅定，走去。"}, {"t": "第五十章 問道之光", "c": "此後數載，墨飛，行遍，天南、西陲，乃至，更遙遠的,天地。\n\n他，循著，問道信物的,指引，一步，一步，追尋，那，散落於，天下的,問道遺澤。這一路，他，斬妖除魔，破解，噬道天教，一個又一個，潛藏的,殺局;他，結交，天下,正道，將，那，對抗噬道的,烽火，一處，一處，點燃。\n\n問道傳人墨飛之名，早已，響徹，這，方，天地。他，成了，一面，旗幟——一面，凝聚，天下正道、對抗，噬道天教的,旗幟。\n\n而他的修為，亦，在，這，數載的,歷練與,信物,溫養之中，穩步，精進，自，化神一層，一路，攀至了，化神後期，戰力，早已，突破，二十萬。\n\n他，集齊了，第三片、第四片，問道信物。那，散落的,問道道統，正，在，他的手中，一片，一片，重新，匯聚。\n\n而，每，重聚，一片信物，那，問道之力，剋制噬道的,威能，便，愈發，強盛;那，湮沒萬古的,問道之光，便，愈發，璀璨。\n\n——\n\n這一日，墨飛，回到了，青石鎮。\n\n那，生養了，他十六年的,小鎮，早已，重歸，寧靜與，祥和。經歷了，噬道之劫的,鎮民，在，墨飛的,暗中,庇護與,資助下，重建了，家園，日子，過得，安穩，而，紅火。\n\n墨飛，獨自一人，來到，鎮後山，那，方，靜靜矗立的,墓碑之前。\n\n「先師　程守拙　之墓」。\n\n「程伯。」墨飛，立於，墓前，久久，佇立。\n\n數載，未見。他，早已，從，那個，被程伯，護在羽翼之下的,廢根少年，成長為，一位，睥睨一域、身負，重興問道之使命的,化神大能。\n\n「程伯，」他，緩緩，蹲下身，一如，幼年時，在濟生堂，聽程伯，講述,藥理那般，輕聲，訴說，「這些年，我，走了，很遠。」\n\n「我，承下了，問道道統。我，集齊了，四片,問道信物。我，踏入了，化神。」\n\n「我，還，知道了——覆滅問道一脈、殺害你的,那，噬道天教教主，是，一個，活了萬古、以吞噬道統為食的,合體境,上古大能。」\n\n他，望著，那，冰冷的,墓碑，眸中，是，化不開的,思念，與，堅定，「這條路，很長，很險。前方的,那個敵人，強大得，令人，絕望。」\n\n「可，程伯，」他，一字一句，聲音，雖輕，卻，重逾千鈞，「你，用生命，守護的，問道火種，我，接住了。而且——」\n\n「我，會，讓，它，燒得，越來越旺。」\n\n「直到，有一天，」墨飛，抬眼，望向，那，天地，最深處，那，潛藏著,噬道教主的,方向，眸中，星河，浩瀚，戰意，滔天，「我，重鑄，問道道統，登臨，那，能與，教主，一決生死的,巔峰。」\n\n「親手，為，你，為，問道一脈的,萬千先賢——」\n\n「討回，那，萬古的，公道。」\n\n山風，獵獵，吹動，墨飛的,衣袂。\n\n墓碑，無言，可，那，碑前的,青草，卻，在，這，化神大能，浩瀚的,問道之光,溫養下，愈發，青翠、蔥蘢，彷彿，那，長眠於此的,老人，正，欣慰地，聆聽著，這，一切。\n\n——\n\n墨飛，起身，離開，青石鎮。\n\n鎮口，那，棵，曾，枯死的,老槐樹，早已，在，問道之光的,滋養下，重新，抽枝，發芽，煥發，生機。\n\n而，就在，那，老槐樹下——那，他，當年，測靈石失敗、被判「無緣」、被，全鎮，恥笑的，地方——\n\n墨飛，停下，腳步。\n\n他，回望，這，方，承載了，他，全部,起點的,小鎮。\n\n從，那個，五色靈根，一起熄滅、戰力為零的,廢根少年;到，如今，這，身負道統、睥睨一域、將，扛起，重興問道之使命的,化神大能。\n\n這一路，他，靠的，不是，天賦。是，那，一雙，看得見「道」的眼睛;是，那，一顆，肯，拿命去，算的心;是，那，一部，一部，撿來、算來、拚來的,配置;是，程伯的,守護,與，凌霜的,並肩;是，那，一句，貫穿始終的——\n\n「以，算，證道。」\n\n「投入，才有，份量。」他，望著，那，方，小小的,測靈石，還，靜靜地，立在，槐樹下，唇角，揚起，一抹，沉靜，而，悠遠的,笑意，「看得見，才，不，浪費。」\n\n「當年，你，判我，無緣。」他，望著，那，測靈石，一字一頓，彷彿，在，對，那，曾，宣判他,命運的,冰冷石頭，也，對，那個，曾，被，宣判的,自己，輕聲，訴說，\n\n「可，我，墨飛，偏，要，以，這，廢根之軀——」\n\n「問，一問，這，天地大道。」\n\n——\n\n靈舟，破空，遠去。\n\n舟頭，墨飛，凌霜，並肩,而立。石敢，與，柳輕眉，相伴，於側。\n\n前方，是，第五片,問道信物的,指引，是，那，更廣闊、也更凶險的,天地，是，那，橫跨萬古、關乎道統存亡的,終極之戰。\n\n而，這，一葉，載著，一位，問道傳人，與，他，重興道統之志、萬古血仇之恨、並肩而行之情的,靈舟，正，朝著，那，浩浩蕩蕩的,前程，堅定，駛去。\n\n一個，廢根少年的,問道傳奇——\n\n從，青石鎮，那，方，熄滅的，測靈石，起步;歷，落霞谷的，血、雜役堂的,苦、問劍宗的,崛起、萬妖森林的,傳承、青石鎮的,生離死別、天南西陲的,烽火——\n\n如今，已，化作，這，天地間，一道，愈燃，愈亮、剋制,萬古黑暗的，問道之光。\n\n而，這道光，將，照向，何方?將，走到，何等，高遠的,盡頭?\n\n靈舟之上，凌霜，望著，那，舟頭，負手而立、氣度，愈發，深沉的墨飛，忽然，輕聲，開口:\n\n「墨飛，你,可曾，後悔?」\n\n「後悔?」\n\n「後悔，撿起，那，方，問道盤。」凌霜，望著，那，浩瀚的,天地，「若，不曾，得它，你，或許，只是，青石鎮，一個，尋常的,鎮醫，一生，安穩，無需，背負，這，萬古的,血仇與,重擔。」\n\n墨飛，聞言，卻，笑了。\n\n「後悔?」他，搖搖頭，望向，那，識海中，四片，遙相呼應、道韻,流轉的,問道信物，眸中，是，一片，澄澈的,篤定，「師姐，你，可知道，這,一路，我，最,慶幸的,是,什麼?」\n\n「不是，得了,問道盤;不是，承了，道統;不是，踏入，化神。」\n\n「是——」他，望向，凌霜，望向，身側的,石敢與柳輕眉，又，望向，那，青石鎮的,方向，那，長眠的,程伯，眼神，溫柔，而，堅定，「是，這一路，我，終於，活成了，一個，『看得見』的人。」\n\n「看得見，一部功法的,價值;看得見，一個對手的,破綻;看得見，一個道統的,興衰;更，看得見——」他，一字一句，「什麼，值得，我，拿命，去，守護。」\n\n「這，便，夠了。」\n\n「哪怕，前方，是，那，活了萬古的,教主;哪怕，這條路，走，到，天荒，地老——」他，望向，那，萬里,前程，一字一頓，\n\n「我，也，走得，心甘，情願。」\n\n凌霜，望著他，那，清冷的臉上，綻開，一抹，璀璨，而，動人的,笑意。她，不再，多問，只，緩緩，將，手，覆上，他的手。\n\n兩人，並肩，望著，那，靈舟前方，浩浩蕩蕩的,天地。\n\n無需，多言。\n\n——\n\n問道之途，五十級台階，不過，是，這，橫跨萬古的,漫漫長路的,第一段。\n\n前方，還有，更多的,信物，待,尋;更強的,敵人，待,破;更高的,境界，待,登。還有，那，最終，橫亙於，路的,盡頭的——噬道教主，那，萬古的,黑暗。\n\n可墨飛，知道，只要，這，問道之光，不滅;只要，這，一顆，「以算證道、以守護為心」的道心，不改——\n\n這條路，他，終能，走到，那，先賢們，未曾，抵達的,盡頭。\n\n\n它，才，剛剛，踏過，第五十級，台階。\n\n前路，浩浩，萬里。\n\n問道之途，未完，待續。\n\n（卷四·西陲問劍 上　第一部·問道啟程　完）"}];

function updateBGM(){ var a=document.getElementById('bgm'); if(!a) return; try{ a.volume=0.5; }catch(e){} var want=state.musicOn && window._audioReady && !state.dead; if(want){ if(a.paused){ var p=a.play(); if(p&&p.catch) p.catch(function(){}); } } else { if(!a.paused) a.pause(); } }
function getCoin(k){ return k==='lingshi'?Math.floor(state.lingshi||0):Math.floor((state.coin&&state.coin[k])||0); }
function setCoin(k,v){ if(k==='lingshi') state.lingshi=v; else { state.coin=state.coin||{}; state.coin[k]=v; } }
function normalizeWallet(){ for(var i=0;i<CUR.length-1;i++){ var per=CUR[i+1].per; var c=getCoin(CUR[i].k); if(c>=per){ var up=Math.floor(c/per); setCoin(CUR[i].k,c-up*per); setCoin(CUR[i+1].k,getCoin(CUR[i+1].k)+up); } } }
function gainLingshi(base){ base=Math.floor(base||0); if(base<=0) return; state.lingshi=(state.lingshi||0)+base; normalizeWallet(); }
function canAfford(cost){ cost=Math.floor(cost||0); if(cost<=0) return true; var t=getCoin('lingshi'); if(t>=cost) return true; var per=1; for(var i=1;i<CUR.length;i++){ per*=CUR[i].per; var n=getCoin(CUR[i].k); if(n>0){ if(per>=cost) return true; t+=n*per; if(t>=cost) return true; } } return t>=cost; }
function ensureLow(need){ need=Math.floor(need); if(getCoin('lingshi')>=need) return true; var guard=0; while(getCoin('lingshi')<need && guard++<500){ var j=-1; for(var x=1;x<CUR.length;x++){ if(getCoin(CUR[x].k)>0){ j=x; break; } } if(j<0) return false; var per=1; for(var y=1;y<=j;y++) per*=CUR[y].per; var deficit=need-getCoin('lingshi'); var cnt=Math.min(getCoin(CUR[j].k), Math.max(1,Math.ceil(deficit/per))); setCoin(CUR[j].k,getCoin(CUR[j].k)-cnt); setCoin(CUR[j-1].k,getCoin(CUR[j-1].k)+cnt*CUR[j].per); } return getCoin('lingshi')>=need; }
function payLingshi(cost){ cost=Math.floor(cost||0); if(cost<=0) return true; if(!canAfford(cost)) return false; ensureLow(cost); if(getCoin('lingshi')<cost) return false; state.lingshi-=cost; normalizeWallet(); return true; }
function lingshiDisp(){ for(var i=CUR.length-1;i>=0;i--){ var n=getCoin(CUR[i].k); if(n>0) return fmt(n)+' '+CUR[i].nm; } return '0 下品靈石'; }
function wealthDisp(){ var total=0, mul=1; for(var i=0;i<CUR.length;i++){ if(i>0 && CUR[i].per) mul*=CUR[i].per; total+=getCoin(CUR[i].k)*mul; } return fmt(total); }
/* ===== 分階計價 + 購買確認 + 找零手續費 ===== */
var CHANGE_FEE=8;
function tierPer(i){ var p=1; for(var k=1;k<=i;k++) p*=CUR[k].per; return p; }
function costTier(cost){ cost=Math.floor(cost||0); var T=0; for(var i=0;i<CUR.length;i++){ if(cost/tierPer(i)>=10000) T=i+1; else break; } if(T>CUR.length-1)T=CUR.length-1; return T; }
function qCost(cost){ cost=Math.floor(cost||0); if(cost<=0)return 0; var T=costTier(cost); var p=tierPer(T); return Math.max(p, Math.round(cost/p)*p); }
function costDisp(cost){ var c=qCost(cost); if(c<=0) return '0 '+CUR[0].nm; var T=costTier(c); var p=tierPer(T); return fmt(Math.round(c/p))+' '+CUR[T].nm; }
function tierWealthLE(T){ var t=0; for(var i=0;i<=T;i++) t+=getCoin(CUR[i].k)*tierPer(i); return t; }
function totalWealth(){ var t=0; for(var i=0;i<CUR.length;i++) t+=getCoin(CUR[i].k)*tierPer(i); return t; }
function canAffordTier(cost){ return totalWealth()>=qCost(cost); }
function payPreview(cost){
  var c=qCost(cost); var T=costTier(c); var payTier=CUR[T].nm;
  if(c<=0) return {ok:true,clean:true,disp:costDisp(c),payTier:payTier};
  if(totalWealth()<c) return {ok:false,disp:costDisp(c),payTier:payTier};
  var clean=tierWealthLE(T)>=c;
  if(clean) return {ok:true,clean:true,disp:costDisp(c),payTier:payTier};
  var rem=c, snap={}; CUR.forEach(function(cu){ snap[cu.k]=getCoin(cu.k); });
  for(var i=T;i>=0;i--){ var pv=tierPer(i); var use=Math.min(snap[CUR[i].k], Math.floor(rem/pv)); snap[CUR[i].k]-=use; rem-=use*pv; }
  var acc=0, broke=[];
  for(var j=T+1;j<CUR.length && acc<rem;j++){ var pv2=tierPer(j); while(snap[CUR[j].k]>0 && acc<rem){ snap[CUR[j].k]--; acc+=pv2; if(broke.indexOf(CUR[j].nm)<0)broke.push(CUR[j].nm); } }
  var change=acc-rem, Tm1=T-1, changeUnits=0, fee=0, changeTier=(Tm1>=0?CUR[Tm1].nm:CUR[0].nm);
  if(change>0){ var ptm1=tierPer(Tm1>=0?Tm1:0); var u=Math.floor(change/ptm1); fee=u-Math.floor(u*(1-CHANGE_FEE/100)); changeUnits=u-fee; }
  return {ok:true,clean:false,disp:costDisp(c),payTier:payTier,broke:broke,changeUnits:changeUnits,changeTier:changeTier,fee:fee};
}
function payByTier(cost){
  var c=qCost(cost); if(c<=0) return true; if(totalWealth()<c) return false;
  var T=costTier(c), rem=c;
  for(var i=T;i>=0;i--){ var pv=tierPer(i); var have=getCoin(CUR[i].k); var use=Math.min(have, Math.floor(rem/pv)); if(use>0){ setCoin(CUR[i].k, have-use); rem-=use*pv; } }
  if(rem>0){ var acc=0; for(var j=T+1;j<CUR.length && acc<rem;j++){ var pv2=tierPer(j); while(getCoin(CUR[j].k)>0 && acc<rem){ setCoin(CUR[j].k, getCoin(CUR[j].k)-1); acc+=pv2; } } var change=acc-rem; var Tm1=T-1; if(change>0){ if(Tm1<0){ state.lingshi=(state.lingshi||0)+change; } else { var ptm1=tierPer(Tm1); var u=Math.floor(change/ptm1); u=Math.floor(u*(1-CHANGE_FEE/100)); setCoin(CUR[Tm1].k, getCoin(CUR[Tm1].k)+u); } } }
  normalizeWallet(); return true;
}
function askBuyConfirm(cost,fn,args,title){ state.buyConfirm={fn:fn,args:args,title:title,pv:payPreview(cost)}; render(); }
function confirmBuyCancel(){ state.buyConfirm=null; render(); }
function confirmBuyOK(){ var b=state.buyConfirm; if(!b){ return; } state.buyConfirm=null; state._payGo=true; try{ window[b.fn].apply(null,b.args); }finally{ state._payGo=false; } }

  h+='<div style="display:flex;gap:8px;"><button class="item-btn" style="background:#3a8a4a;color:#fff;padding:9px;flex:1;" onclick="confirmBuyOK()">確認購買</button><button class="item-btn" style="background:#999;color:#fff;padding:9px;flex:1;" onclick="confirmBuyCancel()">取消</button></div>';
  h+='</div></div>'; return h; }

/* ===== 換幣暫存（按兌幣才生效；取消或離開還原） ===== */
function ensureExchWork(ctx){ if(!state.exchWork || state.exchWork.ctx!==ctx){ state.exchWork={ctx:ctx, lingshi:Math.floor(state.lingshi||0), coin:JSON.parse(JSON.stringify(state.coin||{}))}; } }
function ewGet(k){ var w=state.exchWork; if(!w) return getCoin(k); return k==='lingshi'?Math.floor(w.lingshi||0):Math.floor((w.coin&&w.coin[k])||0); }
function ewSet(k,v){ var w=state.exchWork; if(!w) return; v=Math.max(0,Math.floor(v)); if(k==='lingshi') w.lingshi=v; else { if(!w.coin)w.coin={}; w.coin[k]=v; } }
function exchUp(i,fee){ if(!state.exchWork) return; var lo=CUR[i],hi=CUR[i+1]; var need=Math.ceil(hi.per/(1-fee/100)); var have=ewGet(lo.k); var cnt=Math.floor(have/need); if(cnt<=0){ showToast('需 '+fmt(need)+' '+lo.nm+' 兌 1 '+hi.nm); return; } ewSet(lo.k, have-cnt*need); ewSet(hi.k, ewGet(hi.k)+cnt); render(); }
function exchDown(i,fee){ if(!state.exchWork) return; var hi=CUR[i],lo=CUR[i-1]; if(ewGet(hi.k)<=0){ showToast('沒有 '+hi.nm); return; } var got=Math.floor(hi.per*(1-fee/100)); ewSet(hi.k, ewGet(hi.k)-1); ewSet(lo.k, ewGet(lo.k)+got); render(); }
function exchDirty(){ var w=state.exchWork; if(!w) return false; if(Math.floor(w.lingshi||0)!==Math.floor(state.lingshi||0)) return true; for(var i=1;i<CUR.length;i++){ if((((w.coin||{})[CUR[i].k])||0)!==getCoin(CUR[i].k)) return true; } return false; }
function commitExch(){ var w=state.exchWork; if(!w) return; if(!exchDirty()){ showToast('未做任何兌換'); return; } state.lingshi=Math.floor(w.lingshi||0); state.coin=JSON.parse(JSON.stringify(w.coin||{})); normalizeWallet(); state.exchWork=null; addLog('【換幣】兌換完成','good'); showToast('兌換完成'); saveState(); render(); }
function cancelExch(){ state.exchWork=null; render(); }

function _encSf(){ return 1+(state.realm||0); }
function encReward(rw){ if(!rw) return '無所獲'; var a=[]; var sf=_encSf();
 if(rw.lingshi){ var v=Math.round(rw.lingshi*sf); gainLingshi(v); a.push('靈石+'+fmt(v)); }
 if(rw.xiuwei){ var xw=Math.round(rw.xiuwei*REALMS[state.realm].qiPerSec*1200); state.qi+=xw; state.totalQi+=xw; a.push('修為+'+fmt(xw)); }
 if(rw.weiwang){ state.weiwang=(state.weiwang||0)+rw.weiwang; a.push('威望+'+rw.weiwang); }
 if(rw.shouyuan){ state.shouyuan=Math.max(1,(state.shouyuan||0)+rw.shouyuan); a.push('壽元'+(rw.shouyuan>0?'+':'')+rw.shouyuan+' 年'); }
 if(rw.kuangshi){ state.kuangshi=(state.kuangshi||0)+rw.kuangshi; a.push('礦石+'+rw.kuangshi); }
 if(rw.lingcao){ state.lingcao=(state.lingcao||0)+rw.lingcao; a.push('靈草+'+rw.lingcao); }
 if(rw.gxCard){ state.gxCard=(state.gxCard||0)+rw.gxCard; a.push('卓越卡+'+rw.gxCard); }
 if(rw.baoxiang){ state.baoxiang=(state.baoxiang||0)+rw.baoxiang; a.push('寶箱+'+rw.baoxiang); }
 if(rw.elixir){ var ek=ELIXIRS.filter(function(e){return state.realm>=e.minRealm;}); var pick=ek.length?ek[Math.floor(Math.random()*ek.length)]:ELIXIRS[0]; state.elixirs[pick.id]=(state.elixirs[pick.id]||0)+rw.elixir; a.push(pick.name+'×'+rw.elixir); }
 return a.join('、')||'無所獲'; }
function encRwText(rw){ if(!rw) return ''; var a=[]; if(rw.lingshi)a.push('靈石'); if(rw.xiuwei)a.push('修為'); if(rw.weiwang)a.push('威望'); if(rw.kuangshi)a.push('礦石'); if(rw.elixir)a.push('丹藥'); if(rw.baoxiang)a.push('寶箱'); if(rw.shouyuan)a.push('壽元'); if(rw.gxCard)a.push('卓越卡'); return a.join('、'); }
function encChoiceSub(c){ if(c.quest) return '接取任務：'+c.quest.desc; if(c.cost){ var s=[]; if(c.cost.lingshi)s.push(fmt(c.cost.lingshi)+'+ 靈石'); return '耗費 '+s.join('、'); } if(c.risk!==undefined) return '成敗約各半，賭一把'; if(c.reward&&encRwText(c.reward)) return '即時獲得'; return '平安離去'; }
var _encTimer=null,_encInt=null,_encDeadline=0;
function startEncTimer(){ clearEncTimer(); _encDeadline=Date.now()+5000; _encTimer=setTimeout(autoEncChoose,5000); _encInt=setInterval(function(){ var el=document.getElementById('enc-count'); if(el){ var r=Math.ceil((_encDeadline-Date.now())/1000); el.textContent=(r>0?r:0); } },250); }
function clearEncTimer(){ if(_encTimer){ clearTimeout(_encTimer); _encTimer=null; } if(_encInt){ clearInterval(_encInt); _encInt=null; } }
function autoEncChoose(){ var e=state.encNow; if(!e){ clearEncTimer(); return; } var ok=[]; for(var i=0;i<e.choices.length;i++){ var c=e.choices[i]; if(c.cost&&c.cost.lingshi&&!canAfford(c.cost.lingshi)) continue; ok.push(i); } if(!ok.length) ok=[e.choices.length-1]; encChoose(ok[Math.floor(Math.random()*ok.length)]); }
function toggleAdminAutoEnc(){ state.adminAutoEnc=!state.adminAutoEnc; showToast(state.adminAutoEnc?'奇遇將自動取最佳（不跳介面）':'奇遇恢復跳出選擇介面'); saveState(); render(); }
function _scoreRw(rw){ if(!rw) return 0; return (rw.lingshi||0)+(rw.weiwang||0)*5+(rw.xiuwei||0)*120000+(rw.elixir||0)*5000+(rw.baoxiang||0)*9000+(rw.shouyuan||0)*1500+(rw.kuangshi||0)*200+(rw.lingcao||0)*150+(rw.gxCard||0)*30000; }
function encResolveBest(){ var e=state.encNow; if(!e) return; var best=0,bs=-1e18; for(var i=0;i<e.choices.length;i++){ var c=e.choices[i]; var rw=c.quest?c.quest.reward:(c.risk!==undefined?c.win:c.reward); var sc=_scoreRw(rw); if(sc>bs){ bs=sc; best=i; } } var cc=e.choices[best]; var rw2=cc.quest?cc.quest.reward:(cc.risk!==undefined?cc.win:cc.reward); var g=encReward(rw2); state.encNow=null; addLog('【奇遇·特權】'+e.title+'：'+g,'great'); showToast('奇遇（自動最佳）：'+g); saveState(); render(); }
function rollEncounter(force){ if(state.encNow||state.dead||state.offlineMode||state.currentTab==='battle') return; if(getDays()-(state.lastEncDay!=null?state.lastEncDay:-1e9) < ENC_COOLDOWN_DAYS) return; if(force||Math.random()<0.002){ state.lastEncDay=getDays(); state.encNow=ENCOUNTERS[Math.floor(Math.random()*ENCOUNTERS.length)]; if(state.admin&&state.adminAutoEnc){ encResolveBest(); } else { render(); startEncTimer(); } } }
function encChoose(ci){ clearEncTimer(); var e=state.encNow; if(!e) return; var c=e.choices[ci]; if(!c) return; var msg='';

 else if(c.risk!==undefined){ if(Math.random()<c.risk){ msg='成功！'+encReward(c.win); } else { msg='失手…'+encReward(c.lose); } }
 else { msg=encReward(c.reward); }
 state.encNow=null; addLog('【奇遇】'+e.title+'：'+msg,'good'); if(msg) showToast(msg); saveState(); render(); }
function encqDone(q){ if(q.type==='kill') return ((state.killTotal||0)-(q.base||0))>=q.need; if(q.type==='days') return getDays()>=((q.start||0)+(q.days||0)); return false; }
function encqProg(q){ if(q.type==='kill'){ var d=(state.killTotal||0)-(q.base||0); if(d>q.need)d=q.need; if(d<0)d=0; return '進度 '+d+' / '+q.need; } if(q.type==='days'){ var r=((q.start||0)+(q.days||0))-getDays(); return r<=0?'護送完成':'尚餘 '+r+' 天'; } return ''; }

window._holdT=null; window._holdI=null; window._suppressClick=false;
function holdFire(btn){ if(btn && btn.onclick){ try{ btn.onclick.call(btn, {stopPropagation:function(){}, preventDefault:function(){}, stopImmediatePropagation:function(){}}); }catch(e){} } }
function holdStart(btn){
  if(window._holdT){clearTimeout(window._holdT);window._holdT=null;}
  if(window._holdI){clearInterval(window._holdI);window._holdI=null;}
  window._suppressClick=true;    // 避免 mouseup 後的自然 click 重複觸發
  // 直接把「停止」綁在被點的按鈕本身：render() 會讓此按鈕脫離 DOM，
  // iOS 的 touchend 仍派發到原按鈕，綁在它身上才收得到（綁 document 會漏接）。
  try{
    btn.addEventListener('touchend', holdStop, {once:true});
    btn.addEventListener('touchcancel', holdStop, {once:true});
    btn.addEventListener('mouseup', holdStop, {once:true});
    btn.addEventListener('mouseleave', holdStop, {once:true});
  }catch(e){}
  holdFire(btn);                 // 立即 +1（或 -1）
  window._holdT=setTimeout(function(){
    window._holdI=setInterval(function(){ holdFire(btn); }, 100);
  }, 2000);
}
function holdStop(){
  if(window._holdT){clearTimeout(window._holdT);window._holdT=null;}
  if(window._holdI){clearInterval(window._holdI);window._holdI=null;}
}
if(!window._holdInit){

    ev.preventDefault();
    holdStart(btn);
  });
  document.addEventListener('touchstart', function(ev){
    var btn = ev.target && ev.target.closest && ev.target.closest('.qbtn');
    if(!btn) return;
    ev.preventDefault();
    holdStart(btn);
  }, {passive:false});
  document.addEventListener('mouseup', holdStop);
  document.addEventListener('mouseleave', holdStop);
  document.addEventListener('touchend', holdStop);
  document.addEventListener('touchcancel', holdStop);
  // 在 capture phase 攔截 mousedown 之後的 click，避免雙重觸發
  document.addEventListener('click', function(ev){
    var btn = ev.target && ev.target.closest && ev.target.closest('.qbtn');

      ev.stopPropagation();
      ev.stopImmediatePropagation();
    }

function guideHTML(){ return '<div class="ts-mask" onclick="event.stopPropagation();closeGuide()"></div><div class="task-sheet" onclick="event.stopPropagation()"><div class="ts-head">📖 玩法攻略<span class="ts-x" onclick="closeGuide()">✕</span></div><div class="ts-scroll" style="padding:4px 12px 14px;"><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🌀 核心玩法循環</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">本作為修仙掛機遊戲，兩條主線並行：①<b>靜心修煉</b>（掛機自動累積修為，悟性越高越快）；②<b>入境歷練</b>（擊殺妖獸換取大量修為與掉落）。前期掛機慢、擊殺快，<b>擊殺是主要成長來源</b>。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">⚡ 突破境界</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">修為蓄滿「突破所需」（＝境界基準×1400）即可衝境，每個小階都要蓄滿一次。突破有<b>成功率</b>，越高境越難；<b>心性</b>可提高成功率並抗心魔（失敗扣壽元）。渡劫期以上突破即「渡劫」，戰力與法寶能加成功率。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">⚔️ 戰鬥系統（最重要）</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">・手動施放<b>法術</b>：傷害＝功法威力＋攻擊×0.5，且<b>不吃怪物防禦</b>，是穿透高防怪的關鍵。<br>・自動戰鬥＝30%物攻＋70%自動施法，法力足夠時同樣吃功法傷害；但物攻要扣防，裝備不足時<b>手動施法效率遠高於純掛機</b>。<br>・<b>法力管理</b>：法術耗法力，見底會退回劍氣（弱）。靈力型功法可擴充法力上限。<br>・減傷上限85%；閃避／反擊／暴擊靠身形、眼力與功法。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">📚 功法配置建議</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">內功四系優先：<b>金</b>（攻擊）、<b>土</b>（防禦＋減傷）、<b>光</b>（全屬性％）、<b>水</b>（閃避）。外功／法術帶一支高傷單體或群體（火系有濺射）。靈力型補法力池。功法可升至 <b>Lv10</b>（威力約×3.5）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">💠 投資優先序</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;"><b>同階全套裝備 ＞ 功法升滿 ＞ 洞府設施 ＞ 宗門階級</b>。裝備的根骨／體魄換算成攻防，是戰力主體；設施（食堂血量、酒肆法力、礦山攻防）為永久％加成。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🧬 素質對照</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">根骨→攻擊＋減傷；體魄→血量＋防禦；悟性→修練效率＋法力上限；眼力→暴擊＋命中；身形→閃避＋反擊；心性→突破率＋抗心魔；福緣→掉寶倍率；機緣→晉升機緣。突破會自動成長全素質（越高境長越多）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">💰 貨幣與兌幣</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">靈石分階（下品→…→仙玉→神石），滿額自動進位；大額交易以錢袋總額支付。萬寶樓／城主府／宗門接待所可兌幣（有手續費）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🗺️ 場所・越級・變異・大BOSS</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">每突破一境，開放「當前＋下一境」場所，可<b>越級打怪</b>（高風險、多半打不過，屬耍帥）。一般歷練每隻怪 <b>8%</b> 機率變「變異」（×3~5）。每場所有固定「<b>王</b>」大BOSS（×20~25，附2~3變異護衛），戰鬥畫面可挑戰。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🏯 宗門試煉與上呈</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">入宗後六階：外門→內門→真傳弟子→外門→內門→傳功長老，各給永久增幅（長老另加防禦／減傷，傳功再加暴擊／機緣）。主殿可「上呈」功法換點數（傳功長老需50）。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">🌌 境界階梯</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">凡人→煉氣→築基→金丹→元嬰→化神→渡劫→大羅金仙→<b>準聖→聖人→道祖</b>（頂）。對應裝備階：凡品…仙品→混沌→<b>太初→鴻蒙→大道</b>。</div><div style="font-size:13px;font-weight:800;color:#8a4a1f;margin:10px 2px 4px;">💡 小技巧</div><div style="font-size:12px;color:#4a3a24;line-height:1.85;">・打不動時先回頭把同階裝備補滿、功法升級，再挑戰同境最強怪。<br>・洞府 💾 可匯出存檔備份。<br>・道途只記大BOSS戰績。</div></div></div>'; }

  if(!MB) return; var _wasAuto=window._btRunning; var _wasBoss=MB.boss; MB.over=true; state.hp=Math.max(0,Math.floor(MB.php));
  var round=MB.round, php=Math.max(0,Math.floor(MB.php)); var label=(MB.mons?MB.mons.map(function(m){return m.name;}).join('、'):((MB.mon&&MB.mon.name)||'妖獸'));
  if(win){ bmPush('🎉 全數擊敗 '+label+'！','great'); addLog('【歷練】全數擊敗 '+label+'（'+round+'回合）','great'); }
  else { var loss=Math.max(1,Math.floor(state.shouyuan*0.02)); state.shouyuan=Math.max(1,state.shouyuan-loss);
    var _dn=MB.mons?MB.mons[MB.cur].name:(MB.mon&&MB.mon.name); bmPush('❌ 不敵 '+_dn+'，重傷而歸，壽元 -'+loss,'bad'); addLog('【歷練】敗於 '+label+'，壽元-'+loss,'bad'); }
  state.lastBattle={win:win,mon:label,rounds:round,php:php,mhp:0};
  if(state.battleLocationName){ var _np=MONSTERS.filter(function(m){return m.loc===state.battleLocationName;}); state.encounterMon=_np.length?_np[Math.floor(Math.random()*_np.length)]:null; }
  if(!state.battleReports) state.battleReports=[];
  state.battleReports.unshift({win:win,mon:label,rounds:round,php:php,mhp:0,gains:''});
  if(state.battleReports.length>30) state.battleReports.length=30;
  saveState();
  if(win && !_wasBoss){ if(_wasAuto) window._btRespawn=true; setTimeout(function(){ window._btRespawn=false; if(state.currentTab!=='battle'){ window._btRunning=false; return; } if(MB && !MB.over) return; if(!_isBossLoc(state.battleLocationName) && Math.random()<0.06){ state.bossPrompt={loc:state.battleLocationName,auto:_wasAuto}; window._btRunning=false; window._btAnim=false; render(); return; } mbStart(); render(); if(_wasAuto && !window._btStop && !_needHp() && window._autoLoop){ window._btRunning=true; window._btAnim=true; window._btStop=false; window._autoLoop(); } else { window._btRunning=false; render(); } }, (_wasAuto?450:1200)); }
}
function _needHp(){ if((state.hp||0)<=0){ showToast('氣血耗盡，請先至修練頁「恢復」'); return true; } return false; }
function actAttack(){ if(window._btRunning||_needHp()) return; mbEnsure(); if(_aliveCount()<=1){ mbExchange('attack', null, {target:_firstAliveE()}); } else { _tgtPick={kind:'attack'}; render(); } }
function actBurst(){ if(window._btRunning||_needHp()) return; if(!MB||MB.over||MB.round<5) return; mbExchange('burst'); }
function spellPool(){
  var arr=[];
  for(var id in state.gongfa){ var g=state.gongfa[id]; if(!g||g.cat!=='waigong') continue; var d=gfParseLv(id, g.level||1); if(!d) continue; arr.push({name:g.name, ic:g.ic, desc:d.eff, fx:GF_FX[d.elem]||'劍氣', gf:true, dmg:d.dmg, splash:d.splash, splashN:d.splashN, splashFactor:d.splashFactor, elem:d.elem, aoe:d.aoe, mpCost:d.mpCost}); }
  if(arr.length===0){ return BT_SKILLS.filter(function(s){return s.kind==='atk'&&s.name!=='劍氣斬';}); }
  return arr;
}
function neigongPool(){ var arr=[]; for(var id in state.gongfa){ var g=state.gongfa[id]; if(!g||g.cat!=='neigong') continue; var d=gfParseLv(id,g.level||1); if(!d) continue; arr.push({name:g.name, ic:g.ic, desc:d.eff, elem:d.elem, id:id, gf:true}); } return arr; }
function actSpell(){ if(window._btRunning||_needHp()) return; mbEnsure(); _cfgOpen=false; _spellOpen=true; _spellSel=null; _spellElem=null; render(); }
function selectSpell(i){ var s=spellPool()[i]; if(!s) return; _spellOpen=false; _spellSel=null; if(_aliveCount()<=1||s.aoe){ render(); mbExchange('spellpick', null, {skill:s, target:_firstAliveE()}); } else { _tgtPick={kind:'spellpick', skill:s}; render(); } }
function closeSpellPicker(){ _spellOpen=false; _spellSel=null; render(); }
function confirmSpell(){ if(_spellSel===null) return; var s=spellPool()[_spellSel]; _spellOpen=false; _spellSel=null; if(_aliveCount()<=1||s.aoe){ render(); mbExchange('spellpick', null, {skill:s, target:_firstAliveE()}); } else { _tgtPick={kind:'spellpick', skill:s}; render(); } }
function selectTarget(idx){ var pa=_tgtPick; _tgtPick=null; if(!pa){ render(); return; } render(); mbExchange(pa.kind, null, {skill:pa.skill, target:idx}); }
function closeTgtPick(){ _tgtPick=null; render(); }
function openSpellCfg(){ if(window._btRunning) return; _spellOpen=false; _cfgOpen=true; _cfgCat=null; _cfgElem=null; _cfgSel=[]; render(); }
function setCfgCat(c){ _cfgCat=c; _cfgElem=null; if(c==='neigong'){ var _ids=neigongPool().map(function(x){return x.id;}); _cfgSel=(state.autoNeigong||[]).filter(function(x){return _ids.indexOf(x)>=0;}); } else { var _nms=spellPool().map(function(x){return x.name;}); _cfgSel=(state.autoSpells||[]).filter(function(x){return _nms.indexOf(x)>=0;}); } render(); }
function backCfgCat(){ _cfgCat=null; _cfgElem=null; render(); }
function _cfgIdOf(s){ return _cfgCat==='neigong'? s.id : s.name; }
function toggleCfgSpell(name){ var i=_cfgSel.indexOf(name); if(i>=0){ _cfgSel.splice(i,1); } else if(_cfgSel.length<5){ _cfgSel.push(name); } else { showToast('最多五項'); return; } render(); }
function closeSpellCfg(){ _cfgOpen=false; render(); }
function _spellKey(s){ return s.gf?s.elem:s.fx; }
function _spellKeyName(k){ for(var i=0;i<GF_ELEMS.length;i++){ if(GF_ELEMS[i].k===k) return GF_ELEMS[i].nm; } return k; }
function _spellGroups(pool){ var seen={}, out=[]; pool.forEach(function(s){ var k=_spellKey(s); if(!seen[k]){ seen[k]={k:k, nm:_spellKeyName(k), ic:s.ic, count:0}; out.push(seen[k]); } seen[k].count++; }); return out; }
function setSpellElem(k){ _spellElem=k; render(); }
function backSpellElem(){ _spellElem=null; render(); }
function setCfgElem(k){ _cfgElem=k; render(); }
function backCfgElem(){ _cfgElem=null; render(); }
function selectSpellByName(nm){ var pool=spellPool(); var s=null; for(var i=0;i<pool.length;i++){ if(pool[i].name===nm){ s=pool[i]; break; } } if(!s) return; _spellOpen=false; _spellSel=null; _spellElem=null; if(_aliveCount()<=1||s.aoe){ render(); mbExchange('spellpick', null, {skill:s, target:_firstAliveE()}); } else { _tgtPick={kind:'spellpick', skill:s}; render(); } }
function confirmSpellCfg(){ if(_cfgCat==='neigong'){ state.autoNeigong=_cfgSel.slice(); if(MB){ try{ MB.p=playerCombat(); }catch(e){} } showToast('已綁定 '+_cfgSel.length+' 本內功（開場啟動）'); } else { state.autoSpells=_cfgSel.slice(); showToast(_cfgSel.length?('已設定 '+_cfgSel.length+' 項外功法術'):'已清空'); } _cfgOpen=false; _cfgCat=null; saveState(); render(); }
function actGuard(){ if(window._btRunning||_needHp()) return; mbEnsure(); mbExchange('guard'); }
function actFlee(){ if(window._btRunning) return;
  bmPush('道友足下生風，遁離戰場，此戰作罷。','info');
  MB=null; setBar('bt-php',100); setBar('bt-ehp',100); var rn=document.getElementById('bt-rn'); if(rn) rn.textContent='0'; }
function endBattle(){ MB=null; window._btRunning=false; window._btAnim=false; window._btStop=true; window._btRespawn=false; state.bossPrompt=null; state.battleLocationName=null; state.battleLocationRealm=null; state.encounterMon=null; switchTab('map'); }
function castSkill(i){ var s=BT_SKILLS[i]; if(!s) return; castFx(s);
  if(s.kind==='atk'){ var mon=MONSTERS.find(function(m){return m.realm===state.realm;})||MONSTERS[MONSTERS.length-1]; var p=playerCombat(); var dmg=Math.max(1,Math.floor(_physDmg(p.atk,mon.def,p.pen)*(0.8+Math.random()*0.5))); setTimeout(function(){ showDamage(dmg); }, 180); } }
function _vampHeal(dmg){ if(!MB||!MB.p||!(MB.p.vamp>0)||dmg<=0) return; var h=Math.floor(dmg*MB.p.vamp); if(h<=0) return; MB.php=Math.min(MB.pmax,(MB.php||0)+h); state.hp=Math.floor(MB.php); setBar('bt-php',MB.php/MB.pmax*100); }
function showDamage(n){ var d=document.getElementById('bt-dmg'); if(!d) return; d.textContent='-'+fmt(n); d.classList.remove('show'); void d.offsetWidth; d.classList.add('show'); }
function toggleBtSpeed(){ state.btSpeed=((state.btSpeed||1)>=3)?1:((state.btSpeed||1)+1); render(); }
function quickBattle(){ doBattle(); render(); }

function bmPush(txt, cls){
  if(!state.battleLog) state.battleLog=[];
  state.battleLog.unshift({t:txt, c:cls||'info'});
  if(state.battleLog.length>200) state.battleLog.pop();
  var box=document.getElementById('bt-msg');
  if(box){ var d=document.createElement('div'); d.className='bt-line '+(cls||'info'); d.textContent=txt; box.insertBefore(d, box.firstChild); box.scrollTop=0; }
}
function setBar(id,pct){ var el=document.getElementById(id); if(el) el.style.width=Math.max(0,Math.min(100,pct))+'%'; }
function _syncVals(){ var e=function(id,t){ var el=document.getElementById(id); if(el) el.textContent=t; }; e('bt-phpv',fmt(Math.max(0,Math.floor(state.hp)))); e('bt-pmpv',fmt(Math.max(0,Math.floor(state.mp)))); e('bt-pepv',fmt(Math.max(0,Math.floor(state.ep)))); if(MB&&MB.mons&&MB.mons[MB.cur]) e('bt-ehpv',fmt(Math.max(0,Math.floor(MB.mons[MB.cur].hp)))); }
function _btCtrlInner(){ var _resume=(MB && !MB.over && (MB.round||0)>0 && !window._btRunning); return '<button class="bt-auto-btn"'+(window._btRunning?' style="opacity:0.55;"':'')+' onclick="startAutoBattle()">'+(_resume?'▶️ 繼續戰鬥':'⚔️ 自動攻擊')+'</button>'+(window._btRunning?'<button class="bt-stop-btn" onclick="stopAutoBattle()">■ 停止</button>':('<button class="bt-cfg-btn" onclick="openSpellCfg()">⚙️ 法術設定</button><button class="bt-flee-btn" onclick="actFlee()">🏃 逃跑</button><button class="bt-end-btn" onclick="endBattle()">🚪 結束歷練</button>')); }
function _updBtCtrl(){ var el=document.getElementById('bt-ctrl'); if(el) el.innerHTML=_btCtrlInner(); }
function toggleAutoBattle(){ if(window._btRunning){ window._btStop=true; } else { startAutoBattle(); } }
function stopAutoBattle(){ window._btStop=true; window._btRunning=false; _updBtCtrl(); }
function openItemUse(){ if(window._btRunning) return; mbEnsure(); _spellOpen=false; _cfgOpen=false; _itemOpen=true; _itemCat=null; render(); }
function closeItemUse(){ _itemOpen=false; render(); }
function setItemCat(c){ _itemCat=c; render(); }
function backItemCat(){ _itemCat=null; render(); }
function useBattleItem(cat,id){
  if(cat==='dan'){ var own=state.elixirs[id]||0; if(own<=0) return; state.elixirs[id]=own-1; if(state.elixirs[id]<=0) delete state.elixirs[id]; var _e=ELIXIRS.find(function(x){return x.id===id;}); var nm=(_e&&_e.name)||'丹藥';
    if(id==='huixue'){ state.hp=Math.min(state.hpMax,(state.hp||0)+300); if(MB){ MB.php=state.hp; setBar('bt-php',MB.php/MB.pmax*100); } bmPush('🩸 服用回血丹，回復氣血 +300','good'); }
    else if(id==='huiqi'){ state.mp=Math.min(state.mpMax,(state.mp||0)+300); setBar('bt-pmp',state.mp/state.mpMax*100); bmPush('💧 服用回氣丹，回復法力 +300','good'); }
    else if(id==='jindan'){ state.boostUntil=Date.now()+3600000; bmPush('💊 服用聚靈丹（修煉×2）','good'); }
    else if(id==='shouyuan'){ state.shouyuan+=100; bmPush('💊 服用壽元丹，壽元 +100 年','good'); }
    else if(_e&&_e.tribRealm){ state.tribPillBuff[_e.tribRealm]=(state.tribPillBuff[_e.tribRealm]||0)+_e.tribBonus; bmPush('💊 服用 '+nm,'good'); }
    else bmPush('💊 服用 '+nm,'good');
    showToast('使用 '+nm); _itemOpen=false; saveState(); render();
  } else if(cat==='gear'){ _itemOpen=false; equipItem(id); }
  else if(cat==='art'){ var a=ARTIFACTS.find(function(x){return x.id===id;}); showToast((a?a.name:'法寶')+'：'+(a?a.effect:'')+'（被動常駐）'); _itemOpen=false; render(); }
}
function _autoPickSpell(){
  var pool;
  if(state.autoSpells && state.autoSpells.length){ var sp=spellPool(); pool=sp.filter(function(s){ return state.autoSpells.indexOf(s.name)>=0; }); if(!pool.length) pool=sp; }
  else { pool=BT_SKILLS.filter(function(s){return s.kind==='atk'&&s.name!=='劍氣斬';}); }
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}
function startAutoBattle(){
  if(window._btRunning||_needHp()) return;
  mbEnsure();
  if(MB && !MB.over){ MB.roundCap=(MB.round||0)+99; }
  window._btRunning=true; window._btAnim=true; window._btStop=false; window._btRespawn=false;
  _updBtCtrl();
  window._autoLoop=function loop(){
    if(window._btStop || (MB&&MB.round>=(MB.roundCap||99)) || state.currentTab!=='battle'){ if(MB&&!MB.over&&MB.round>=(MB.roundCap||99)) bmPush('⌛ 已鏖戰 '+MB.round+' 回合，暫歇喘息——可先使用道具/法術，按「▶️ 繼續戰鬥」續戰至分出勝負','info'); if(window._btStop) bmPush('⏸️ 自動攻擊已停止','info'); window._btStop=false; window._btRunning=false; window._btAnim=false; window._btRespawn=false; render(); return; }
    if(!MB || MB.over){ if(window._btRespawn) return; window._btRunning=false; window._btAnim=false; render(); return; }
    var _cb=function(){ if(!MB || MB.over){ if(window._btRespawn) return; window._btRunning=false; window._btAnim=false; window._btStop=false; render(); return; } setTimeout(window._autoLoop, 104); };
    if(Math.random()<0.30){ mbExchange('attack', _cb, {target:_randomAliveE()}); }
    else { var _as=_autoPickSpell(); var _ac=_as?(_as.gf?(_as.mpCost||(GF_MP_BASE[state.realm]||50)):(GF_MP_BASE[state.realm]||50)):0;
      if(_as && (state.mp||0)>=_ac){ mbExchange('spellpick', _cb, {skill:_as, target:_randomAliveE()}); }
      else { mbExchange('attack', _cb, {target:_randomAliveE()}); } }
  };
  window._autoLoop();
}

function battleWithAnim(){ playBattleAnim('swordAttack'); setTimeout(function(){ doBattle(); }, 1000); }
</script>
