」為名，將隊伍，一步步，引向瘴氣最濃、妖獸最密的凶險地帶。行至一處紫黑瘴氣翻湧的沼澤邊，他忽然停下腳步，「無意」地，將手中一枚引動妖獸的「血煞珠」，悄然捏碎。\n\n那濃烈的血腥氣，瞬間在瘴氣中瀰漫開來。\n\n下一刻，沼澤深處，一聲震天的咆哮響起!一頭渾身覆著黑色鱗甲、雙目赤紅的巨型妖獸，轟然自沼澤中暴起——\n\n【黑沼蛟│築基後期│戰力 400│受血煞之氣引動，狂暴嗜殺】\n\n「不好!妖獸暴起!」洛雲軒「驚呼」一聲，率先閃到一旁，同時，身形一晃，「慌亂」之中，竟一把將墨飛，狠狠推向了那暴怒的黑沼蛟!\n\n「墨師弟小心——!」他嘴上「驚呼」，那一推的力道，卻是實打實地，要將墨飛，送進那妖蛟的血盆大口!\n\n好狠的算計!借妖獸暴起之機，一推，便可將墨飛置於死地，事後，更可推得一乾二淨——「是墨飛自己躲避不及，喪身妖口」。\n\n若是尋常築基三層的弟子，遭此暗算，又猝逢戰力四百的越級妖獸，只怕當場，便要血濺五步。\n\n可惜，他算計的，是墨飛。\n\n早在洛雲軒捏碎血煞珠的剎那，墨飛的問道盤，便已將這殺局，連同那即將暴起的黑沼蛟、洛雲軒那一推的軌跡，盡數，算得清清楚楚。\n\n他甚至，故意露出一副「猝不及防」的模樣，任由洛雲軒將他推出。\n\n而在被推向妖蛟的剎那——墨飛的身形，詭異地一擰，借著那推力，不偏不倚，卸向了黑沼蛟攻擊的死角;《厚土樁》《太一光明經》的護體之力，同時催發到極致。\n\n黑沼蛟那雷霆一撲，擦著他的身側，轟然砸進了瘴氣裡。\n\n墨飛，毫髮無傷。\n\n他穩穩落地，回頭，望向那臉上「驚慌」尚未褪去、眼底得意卻已凝固的洛雲軒，唇角，勾起一抹冰冷的弧度。\n\n「洛師兄，」他聲音平靜，卻字字如刀，「多謝你這一推。」\n\n「不過——」他望著那頭被引來的、暴怒的黑沼蛟，又望了望面色劇變的洛雲軒，眼底寒光一閃，\n\n「你引來的這頭妖獸，」\n\n「該怎麼收場，你，可算清楚了?」"}, {"t": "第二十三章 遺跡", "c": "那頭戰力四百的黑沼蛟，一撲落空，暴怒地調轉身軀，赤紅的雙目，卻不再盯著墨飛——而是死死鎖住了離它最近的、方才捏碎血煞珠的洛雲軒!\n\n血煞之氣，本就出自洛雲軒之手，那氣息，在他身上，最為濃烈。\n\n「你——!」洛雲軒魂飛魄散。他千算萬算，算計著要借妖獸除掉墨飛，卻萬萬沒算到，那被引來的凶獸，第一個要撕碎的，竟是他自己!\n\n黑沼蛟咆哮著，朝洛雲軒，狂撲而至!\n\n「救我!快救我!」洛雲軒色厲內荏地祭出一身法器，卻在那戰力四百、又受血煞催狂的妖蛟面前，脆弱得如同紙糊。妖蛟一爪拍飛他的法器，利齒，便朝他的頭顱，咬下!\n\n千鈞一髮之際——\n\n一枚金系氣刃，破空而至，狠狠釘入黑沼蛟的眼中!\n\n黑沼蛟一聲慘嘶，那一口，堪堪偏開，救下了洛雲軒一條性命。\n\n出手的，是墨飛。\n\n洛雲軒癱坐在地，難以置信地望著那個他方才還要置於死地、此刻卻反手救了他的少年。\n\n「你……你為何救我?」他嘶聲問，聲音抖得不成樣子。\n\n「我不是救你。」墨飛淡淡道，身形已欺近那受傷暴怒的黑沼蛟，「你死不死，與我無關。」\n\n「我只是——」他一邊以《寒瀑劍》的寒氣遲滯妖蛟，一邊冷冷道，「不想讓凌霜師姐的隊伍，折損在你這蠢貨引來的禍事上。」\n\n言罷，他不再看洛雲軒，將全副心神，投入了與黑沼蛟的搏殺。\n\n戰力四百的越級妖獸，墨飛獨力難支。可他此刻已非吳下阿蒙——築基三層、戰力三百二，配上那六維俱全的配置，他雖不能力壓，卻能以算計周旋。\n\n他一邊揚聲，將問道盤算出的破法傳給眾人:「此蛟眼、腹為弱點!沈師妹，以你的冰系，封它下盤!其餘人，金火屬性，攻其雙眼!」\n\n那沈清弦本就對墨飛心存感激，又見他臨危不亂，當即依言，一道冰封，鎖住了妖蛟的下盤。其餘弟子，也在墨飛的指揮下，或攻或守，漸漸將那狂暴的妖蛟，逼入絕境。\n\n最終，墨飛抓住妖蛟受冰封而滯澀的剎那，將一枚淬鋒丹的增益，盡數灌注刀身，一記蓄勢已久的破甲重擊，自那被氣刃洞穿的眼窩，直搗其腦!\n\n黑沼蛟龐大的身軀，劇烈一顫，轟然倒地，沒了聲息。\n\n——\n\n戰罷，眾人皆是心有餘悸。\n\n而所有人的目光，都複雜地，在墨飛與那癱坐在地的洛雲軒之間，來回逡巡。\n\n方才那一幕，眾人皆看得分明:是洛雲軒捏碎了引妖的血煞珠，是他「失手」將墨飛推向妖蛟。那所謂的「意外」，分明，是一場針對墨飛的、拙劣的殺局!\n\n只是那殺局搬起石頭，砸了自己的腳;而墨飛，非但識破了殺局、全身而退，更反手，救了洛雲軒一命，還力挽狂瀾，斬殺了妖蛟。\n\n高下，人品，一目了然。\n\n「洛師兄，」沈清弦冷冷開口，清麗的臉上滿是鄙夷，「你捏碎血煞珠、推墨師兄入險，這『意外』，回去之後，你可要，好好向凌霜師姐解釋。」\n\n洛雲軒面如死灰。他偷雞不成蝕把米，不但沒能除掉墨飛，反倒當著眾人的面，將自己那狠毒的嘴臉，暴露無遺。他知道，回去之後，凌霜必不會輕饒。\n\n「墨飛……」他望著墨飛，眼中，是刻骨的怨毒，卻又夾雜著一絲被救的、屈辱的複雜，「你別得意!此仇，我洛雲軒，記下了!」\n\n「隨便你。」墨飛連看都懶得看他一眼，收起斷刀，望向了森林更深的西南方。\n\n那裡，問道盤的「呼應」，已強烈到了極致。\n\n「遺跡，就在前方。」他心中篤定。\n\n——\n\n墨飛不再理會洛雲軒，獨自一人，循著那呼應的牽引，往西南深處行去。沈清弦與幾名弟子見狀，也默默跟上——經此一事，他們早已對墨飛心悅誠服。唯有洛雲軒，遠遠綴在後方，眼神陰晴不定。\n\n穿過一片瘴氣最濃的密林，前方，豁然開朗。\n\n一座古老、恢弘、卻早已殘破的巨大建築遺跡，靜靜矗立在森林的中央，被無盡的歲月與瘴氣所籠罩。那遺跡以某種黝黑的、非金非石的材質築成，其上，銘刻著與秘境石門同源的、繁複到極致的上古符文，靈光雖已黯淡，卻仍透出一股睥睨萬古的、洪荒般的氣息。\n\n當墨飛的目光，落在那遺跡的剎那——\n\n識海裡的問道盤，轟然震動!那一直隱隱的「呼應」，在這一刻，化作了驚濤駭浪!盤面之上，道紋暴亮，一行行他從未見過的字符，瘋狂閃爍!\n\n【偵測到:上古「問道」道統遺跡!】\n【與宿主識海『問道盤』——同源!同宗!】\n【權能共鳴中……遺跡禁制，正在為宿主……鬆動。】\n\n墨飛渾身劇震，呼吸幾乎停滯。\n\n問道道統!\n\n原來，他這方問道盤，並非什麼孤立的奇物。它，是一整個早已湮沒於歲月的、上古「問道」道統的傳承之器!而這座萬妖森林深處的遺跡，便是那道統，遺留於世的——最後的痕跡!\n\n凌霜的師尊窮盡一生而不得其門而入的遺跡，此刻，竟因他識海中的問道盤，而禁制鬆動，緩緩，為他，敞開了一道縫!\n\n「這就是……問道盤的來歷。」墨飛望著那恢弘的遺跡，心潮澎湃，難以自已，「我一直在尋的答案，終於……」\n\n他一步，一步，朝著那扇因他而鬆動的、通往上古道統的遺跡之門，走去。\n\n沈清弦等人望著那突然「活」過來、與墨飛遙相呼應的遺跡，皆是駭然失色，不敢近前。\n\n而遠處的洛雲軒，望著這一幕，那陰鷙的眼底，除了怨毒，更騰起了一股熾烈的、瘋狂的貪婪——\n\n「上古遺跡……道統傳承……」他舔了舔乾裂的嘴唇，眼中凶光大盛，「墨飛，原來，你身上，藏著這等驚天的祕密!」\n\n「這等機緣，豈能，讓你這雜役獨得?」\n\n一個比方才更加瘋狂、更加惡毒的念頭，在他心底，轟然炸開。\n\n而墨飛，渾然不覺。他的全副心神，都已被那扇緩緩敞開的、通往問道道統的遺跡之門，牢牢吸引。\n\n門後，那湮沒了萬古的祕密，正等著他，親手，揭開。\n\n——\n\n墨飛踏入遺跡之門的剎那，身後那道因問道盤而鬆動的禁制光幕，便再度合攏，將沈清弦等人，隔絕在外。\n\n「墨師兄!」沈清弦在門外驚呼，卻被那禁制擋得無法近前。\n\n「無妨。」墨飛的聲音，自光幕內傳出，沉靜而篤定，「這遺跡，唯持問道之器者，方能入內。你們，在外等我。」\n\n言罷，他不再遲疑，一步步，深入那湮沒了萬古的遺跡。\n\n遺跡之內，比外觀所見，更為恢弘。一條幽深的長廊，兩壁銘刻著無數古老的壁畫與符文。墨飛以問道盤的「觀道」之能，一路行去，那些早已無人能解的壁畫，竟在他眼前，緩緩流轉，訴說起一段湮沒於時光深處的往事——\n\n那是一個，早已消逝的上古道統。\n\n不同於當世「以力證道」的主流，這「問道」道統的先賢們，窮盡一生，追尋的，是「丈量大道、參透萬物之理」的另一條路。他們不以境界壓人，不以蠻力爭鋒，而是以一雙「看得見道」的眼睛，以「算盡天地之理」的智慧，走出了一條，驚才絕艷、卻又曲高和寡的證道之路。\n\n而墨飛識海中的問道盤——正是這問道道統的先賢，傾盡畢生道行所煉的、丈量大道的至寶!\n\n「原來如此……原來如此!」墨飛望著那壁畫，只覺得一股熱血，直衝天靈。\n\n他一直以為，自己這「以算證道」的路，是廢根無奈之下的自創，是離經叛道的旁門。卻不想——在這萬古之前，早有一整個道統的先賢，將這條路，走得驚天動地!\n\n他不是孤身一人。他，是這湮沒道統的，唯一傳人!\n\n長廊的盡頭，是一座空曠的大殿。大殿中央，一方古樸的道台之上，懸浮著一縷若有若無的、散發著溫潤道韻的光團。\n\n當墨飛靠近的剎那，那光團驟然一亮，一道蒼老、悠遠、彷彿穿越了萬古歲月的意念，直接，印入了他的識海——\n\n「持問道之器者……你，終於來了。」\n\n「吾乃問道一脈，末代傳人之殘念。」\n\n「問道之道，以觀為始，以算為徑，以理證道……然，此路艱險，曲高和寡，終至道統凋零，唯餘吾一縷殘念，與這半殘之器，苦守萬古，只為……等一個，能將此道，重新走下去的後人。」\n\n「你，可願，承此道統?」\n\n墨飛立於道台之前，望著那縷苦守了萬古的殘念，心潮澎湃，難以自已。\n\n他想起青石鎮測靈石前的宣判，想起這一路以「算」翻盤的每一場血戰，想起程伯那句「以算證道，一旦走通，便是別人一輩子都望塵莫及的境地」——\n\n原來，他這一路懵懂走來的「算著打」，竟真的，暗合了一整個上古道統的至理!\n\n「晚輩墨飛，」他鄭重地，對著那縷殘念，深深一拜，一字一句，斬釘截鐵，\n\n「願承問道之道!」\n\n「將這條，先賢們未走完的路——」\n\n「親手，走到那，萬古無人抵達的盡頭!」\n\n那縷殘念，似有所感，溫潤的道韻，將墨飛，緩緩包裹。\n\n而就在此時——\n\n遺跡之外，那道合攏的禁制光幕上，忽然，裂開了一道細微的縫隙。\n\n一道陰鷙的身影，趁著沈清弦等人不備，如鬼魅般，悄然，擠入了那道縫隙，潛入了遺跡之中。\n\n正是，心懷叵測的，洛雲軒。\n\n他望著大殿中那被道韻包裹的墨飛，望著那道台之上散發著無盡機緣的光團，眼中，貪婪與怨毒，燃燒成一片瘋狂的火焰。\n\n「上古道統的傳承……」他舔著嘴唇，一步步，向著渾然不覺的墨飛，陰森森地，逼近，「墨飛，你死之後，這潑天的機緣，便都是我洛雲軒的了!」\n\n他的手中，一枚淬滿劇毒的煉器世家秘寶，已然，悄然，對準了墨飛的後心。\n\n而沉浸在承接道統之中的墨飛，對這近在咫尺的殺機，竟，一無所覺。"}, {"t": "第二十四章 傳承", "c": "那枚淬滿劇毒的秘寶，對準了墨飛的後心，洛雲軒陰森的殺意，已凝聚到了頂點。\n\n墨飛，渾然不覺。\n\n或者說——在旁人看來，渾然不覺。\n\n可他識海中的問道盤，自那縷殘念傳承之時起，便已與這整座問道遺跡的道韻，連成了一體。這遺跡之內的一草一木、一絲一縷的異動，皆逃不過它的感知。\n\n早在洛雲軒擠入禁制縫隙的剎那，一行猩紅的警示，便已在墨飛識海深處，悄然亮起:\n\n【警示:洛雲軒潛入。殺意極濃。目標:宿主後心。】\n【毒器:「化骨蝕魂針」，見血封喉。】\n\n墨飛的心，沉靜如水。\n\n他沒有動，任由洛雲軒一步步逼近，任由那毒針對準自己的後心——他要的，是讓這條藏在暗處的毒蛇，把它最惡毒的獠牙，徹底，亮出來。\n\n「墨飛，受死吧!」\n\n洛雲軒再不遲疑，將那枚化骨蝕魂針，挾著滔天的毒力，狠狠，刺向墨飛的後心!\n\n就在毒針即將入體的前一線——\n\n墨飛，動了。\n\n他的身形，如同蒼鷹般，詭異地向側一旋。那本該貫穿他後心的毒針，擦著他的衣衫，堪堪刺空!\n\n「什麼?!」洛雲軒駭然變色。他這一擊，蓄謀已久，又趁其「不備」，自問天衣無縫，怎料，竟被對方，在最後一瞬，精準避開!\n\n而他偷襲落空、身形前傾、破綻大開的這一剎那——正是墨飛，算好了的，反殺之機。\n\n「洛雲軒。」墨飛的聲音，冰冷得沒有一絲溫度，身形已欺至他身側，「我早說過，你想在秘境裡除掉我。」\n\n「所以，我一直，在等你出手。」\n\n他的話音未落，一套環環相扣的殺招，已然爆發!\n\n《太一光明經》全屬性增幅，將他此刻的戰力，推至巔峰;《寒瀑劍》水系寒氣，鎖住洛雲軒的身形;《裂石訣》金系氣刃，無視護體，直取其要害!承接了道統道韻的加持，他這一套配置，比之從前，更添了三分玄妙——那金系氣刃之中，竟隱隱蘊上了一絲「問道」的至理，鋒銳無匹!\n\n洛雲軒方才偷襲落空，舊力已盡，新力未生，又哪裡擋得住這雷霆一擊?\n\n「噗!」金系氣刃，洞穿了他的護體，狠狠釘入他的肩頭。洛雲軒慘嘶一聲，踉蹌跌退，一身築基後期的修為，竟被墨飛這一套精妙絕倫的配置，壓制得死死的，連還手之力都無!\n\n「你、你的戰力……怎會如此之高?!」洛雲軒面如死灰，難以置信，「你分明，只是築基三層!」\n\n「戰力三百二。」墨飛淡淡道，斷刀已抵上他的咽喉，「你我，本就相差無幾。」\n\n「而你，」他眼底寒光一閃，「卻蠢到，以為一個能一路越級、力戰雷無極的人，會真的，任你偷襲得手。」\n\n「洛雲軒，你輸就輸在——」\n\n「你到現在，都還當我，是隻，可以隨手碾死的螞蟻。」\n\n洛雲軒癱軟在地，面如金紙，眼中，是無盡的驚駭與絕望。他偷雞不成，反倒將自己，徹底，送進了絕境。\n\n「你……你要殺我?」他嘶聲問。\n\n墨飛凝視著他，良久，卻緩緩，收回了斷刀。\n\n「殺你?」他淡淡道，「你這條命，不值得我，在承接道統的聖地，染上血污。」\n\n「這遺跡之內的一切，你都看見了。」他望著洛雲軒，一字一句，「你若識相，回去之後，便當，什麼都沒發生過。你今日在秘境中，對我下的兩次殺手——沈師妹他們，都看在眼裡。」\n\n「這把柄，我，替你，留著。」\n\n洛雲軒渾身一顫。他終於明白，墨飛留他一命，非是慈悲，而是要以那兩次殺手的把柄，牢牢，拿捏住他。從此，他洛雲軒，便如芒刺在背，再不敢，對墨飛，有半分異動。\n\n「我……」洛雲軒咬著牙，滿是屈辱與怨毒，卻終究，一句狠話都不敢再說，踉蹌著，退出了大殿。\n\n墨飛望著他狼狽的背影，收回目光，不再理會。\n\n在他心中，洛雲軒這等跳梁小丑，早已不值一提。他此行真正的收穫，那足以改變他一生的機緣，才剛剛，開始。\n\n——\n\n大殿之內，那縷苦守了萬古的殘念，靜靜地，注視著這一切。\n\n「以弱勝強，以算破局，留敵一命以為己用……」殘念的意念，帶著一絲欣慰的嘆息，「好，好一個問道傳人。你這份心性與智慧，遠勝於吾當年。」\n\n「你既願承此道統，吾，便將這問道一脈，傾盡萬古所悟，盡數，傳你。」\n\n話音落下，那縷溫潤的道韻，化作一片浩瀚的信息洪流，湧入墨飛的識海！\n\n那是問道道統，萬古以來的積累——\n\n是「觀道」的更高深法門，讓他能看穿的，不再只是數值與破綻，更是那萬物運轉、道則流轉的至理;\n\n是一部名為《問道錄》的無上道法，教他如何以「算」御敵、以「理」證道，將他那套「配置」之道，推向一個前所未有的境界;\n\n更是，那方半殘的問道盤，缺失已久的另一半權能——\n\n【問道盤·權能大幅解封!】\n【新增權能:「推衍」——可推演戰局、功法、乃至天機之變。】\n【新增權能:「道眼」——可窺見更高境界者之部分虛實(如凌霜、程伯之流)。】\n【問道盤·由「殘」轉「全」……宿主道途，自此，豁然開朗。】\n\n墨飛盤坐於道台之前，任由那浩瀚的信息與道韻，在他體內、識海中，奔湧、沉澱、融匯。\n\n他能清晰地感覺到，自己那雙眼睛，正在發生脫胎換骨的蛻變——他「看得見」的世界，正變得，前所未有的，清晰而深邃。\n\n不知過了多久，當墨飛緩緩睜開眼時，那雙眸子深處，彷彿有星河流轉，有大道紋路，一閃而逝。\n\n他站起身，只覺得天地萬物，在他眼中，盡皆化作了可觀、可算、可推衍的道則。他這一路懵懂踐行的「以算證道」，在承接了完整的道統之後，終於，有了根、有了魂、有了那通往至高之境的，清晰路徑。\n\n「多謝前輩傳承。」他對著那已然，徹底消散的殘念，深深一拜。\n\n那縷苦守萬古的殘念，在傾盡所有之後，終於，含笑，歸於了大道。臨消散前，一句悠遠的話語，迴盪在大殿之中——\n\n「問道一脈……就託付，給你了……」\n\n「去吧……去把這條路……走到，吾等，未曾抵達的，盡頭……」\n\n大殿之內，重歸寂靜。\n\n墨飛立於道台之前，握了握拳，只覺得體內道基圓融、識海清明，一股睥睨天下的自信與戰意，自心底，油然而生。\n\n他，已不再是那個，只能靠問道盤「看帳」的廢根少年。\n\n他，是問道一脈的傳人。是這方天地間，唯一一個，能「觀天地、算大道、以理證道」的——問道者。\n\n「這條路，」他望向大殿之外，那通往更廣闊天地的方向，眼底，是化不開的、燃燒著的、屬於一個道統傳人的雄心，\n\n「先賢們沒能走完。」\n\n「那便，由我墨飛，替你們——」\n\n「走下去。」\n\n——\n\n殘念消散之後，那道台之下，緩緩升起一方古樸的石匣。\n\n墨飛心中一動，上前將石匣打開。匣中所藏，讓他呼吸都為之一滯——\n\n其一，是一枚溫潤的、通體流轉著道紋的白玉令牌，正是問道一脈的道統信物;其二，是幾張以某種獸皮繪就的、記載著上古問道秘法與煉丹古方的殘卷;其三，則是數件散發著幽幽寶光的法器與一小堆，連問道盤都難以估量其價值的，上古靈材。\n\n這些，都是那消散的殘念，留給傳人的、最後的餽贈。\n\n墨飛小心翼翼地，將這些無價之寶，盡數收入納物袋。單是那幾張問道秘法，便足以讓他那套配置，再上數個台階;而那些上古靈材，更是他日後衝擊金丹、乃至更高境界的，絕佳助力。\n\n「這一趟萬妖森林，」墨飛心底火熱，「來對了。」\n\n收好祕藏，他忽然想試一試，那新解封的權能。\n\n他凝神，催動那名為「推衍」的新權能，將心念，投向大殿之外——\n\n剎那間，一幅玄之又玄的畫面，在他識海中，緩緩鋪展:遺跡之外，沈清弦等人焦急守候的身影;更遠處，洛雲軒負傷奔逃、眼中怨毒未消的模樣;乃至那東北方，凌霜一隊，正遭遇一頭妖獸圍攻的險狀……皆化作一道道清晰的「推演」，呈於他眼前!\n\n「這便是……推衍。」墨飛心神巨震。\n\n從前的問道盤，只能「看」眼前之物;而如今，這「推衍」之能，竟能讓他，推演那視線之外的、戰局的流轉與變化!這於瞬息萬變的搏殺、於運籌帷幄的謀略而言，是何等逆天的權能!\n\n他又將那「道眼」之能，投向記憶中凌霜的身影。\n\n往日，問道盤凝視凌霜，只得一片「深不可測」的問號。可此刻，那「道眼」運轉，凌霜那深不可測的氣息之上，竟緩緩，浮現出一角清晰的虛實——\n\n【凌霜│築基後期(巔峰)│戰力……約1500】\n〔劍道天賦，冠絕當世。然……其命宮之中，似有一縷隱疾潛藏〕\n\n「戰力一千五百!」墨飛悚然一驚。凌霜那深藏的實力，竟恐怖至斯，幾近元嬰!而那「命宮隱疾」四字，更讓他心頭，莫名一沉。\n\n從前看不透的人，如今，能窺見一角了。\n\n墨飛闔上眼，壓下心頭的驚濤。他清楚地知道，自己，已然，徹底，脫胎換骨。\n\n那個站在測靈石前、被判「無緣」的廢根;那個躲在雜役堂、藏拙求存的少年;那個在擂台上、以命搏道的挑戰者——\n\n都已成為過去。\n\n從今日起，他墨飛，是問道一脈，睥睨古今的，唯一傳人。\n\n「凌霜師姐那邊，有險。」他睜開眼，眸中星河流轉，再無半分遲疑，「該我，去還她這一路的照拂了。」\n\n他握緊斷刀，一步，踏出了那扇苦守了萬古的遺跡之門。\n\n門外的天光，灑在他身上。而此刻走出遺跡的少年，眉宇之間，已然，多了一股，俯瞰眾生的，問道者的氣度。"}, {"t": "第二十五章 馳援", "c": "墨飛走出遺跡，沈清弦等人立刻圍了上來。\n\n「墨師兄!你沒事吧?那洛雲軒方才臉色慘白地逃了出去，還有那遺跡……」沈清弦一連串的驚問，卻在觸及墨飛的目光時，戛然而止。\n\n她怔怔地望著墨飛。\n\n還是那身樸素青衫，還是那張沉靜的臉。可不知為何，此刻的墨師兄，周身，竟透著一股說不出的、俯瞰眾生的氣度。那雙眼睛，深邃得彷彿藏著一整片星河，讓她這築基中期的修為，竟莫名地，生出一絲仰望之感。\n\n「無妨。」墨飛淡淡道，聲音卻透著不容置疑的鎮定，「洛雲軒的事，回去再算。此刻——」\n\n他眸光一凝，望向東北方，那「推衍」之能，早已將凌霜一隊的險狀，盡數映入他識海:\n\n【推衍:東北·百獸谷】\n【凌霜一隊，遭「九嬰妖蟒」圍攻。此妖，築基巔峰，九首同攻，毒煞滔天，戰力約900。】\n【凌霜……為護同門，力戰不退，然……命宮隱疾，恐為毒煞所引，危!】\n\n戰力九百的九嬰妖蟒!更兼凌霜那「命宮隱疾」，一旦被毒煞引動——\n\n墨飛心頭一沉。\n\n「凌霜師姐有難!」他斷喝一聲，不再多言，身形暴起，化作一道青光，朝著東北方，疾馳而去，「沈師妹，你們隨後跟來!」\n\n——\n\n百獸谷中，一場惡戰，正酣。\n\n那頭九嬰妖蟒，九顆猙獰的蟒首同時攻出，毒煞漫天，將凌霜一隊，逼入了絕境。數名弟子已然負傷，護體光幕搖搖欲墜。\n\n凌霜白衣勝雪，數十柄飛劍縱橫，劍光如織，獨力撐起了整個戰局。她劍道通神，一人之力，竟將那戰力九百的妖蟒，死死纏住。可那九嬰妖蟒生有九首，毒煞無窮，饒是她天資絕世，久戰之下，也漸露疲態。\n\n更兇險的是——那滔天的毒煞之氣，正一絲一縷，滲入她的經脈，悄然，引動著她命宮深處那縷，潛藏已久的隱疾!\n\n凌霜的臉色，以肉眼可見的速度，蒼白了下去。她御劍的手，微微一顫，一道劍光，竟出現了一瞬的滯澀。\n\n就是這一瞬。\n\n九嬰妖蟒抓住這稍縱即逝的破綻，一顆巨大的蟒首，裹挾著致命的毒煞，朝凌霜當頭，咬下!\n\n「師姐小心!」眾弟子失聲驚呼，卻救之不及。\n\n凌霜心神被隱疾所擾，竟避讓不及。眼看那毒煞蟒首，便要將這絕世天驕，吞入腹中——\n\n嗤!\n\n一道蘊著問道至理的、鋒銳到極致的金色氣刃，破空而至，精準地，洞穿了那顆咬向凌霜的蟒首的獨目!\n\n九嬰妖蟒發出一聲驚天的慘嘶，那致命的一咬，堪堪偏開。\n\n凌霜死裡逃生，猛地抬頭，循著那氣刃的來向望去——\n\n只見一道青衫身影，自谷口飛掠而至，身形沉穩，氣度睥睨。他一雙眸子深處，星河流轉;周身，環繞著一股她既熟悉、又陌生的道韻。\n\n是墨飛。\n\n可又，不全是，她記憶中的那個墨飛。\n\n「墨飛?你……」凌霜清冷的眸中，第一次，露出了毫不掩飾的震驚。她分明感覺到，此刻的墨飛，那身氣息，較之三日之前，竟已，判若兩人!\n\n「師姐，穩住心神，這妖蟒交給我。」墨飛落在她身側，聲音沉靜如淵，「你命宮的隱疾，被毒煞引動了。速速退後，運轉功法，壓制隱疾。」\n\n凌霜心頭巨震——他，竟連她那深藏的命宮隱疾，都看得一清二楚?!\n\n可此刻，她已無暇細想。墨飛那份沉穩與篤定，竟讓她這絕世天驕，鬼使神差地，信了他，依言退後，凝神壓制那躁動的隱疾。\n\n而墨飛，獨自一人，迎向了那頭戰力九百的九嬰妖蟒。\n\n——\n\n九百的戰力，是墨飛此刻的近三倍。\n\n若在從前，這是一場，毫無勝算的死戰。\n\n可如今的墨飛，已非昔日。他承接了完整的問道道統，解封了「推衍」與「道眼」的權能，那套配置，更蘊上了問道的至理。\n\n他凝神望去，那「推衍」之能，將九嬰妖蟒九首同攻的軌跡、毒煞流轉的規律、乃至那唯一的、生死攸關的破綻，盡數，推演而出:\n\n【推衍:九嬰妖蟒·九首各司其職，然……九首之力，同出一源——其心臟，位於第五首之下。九首攻勢輪轉，每逢第五首吐信，其心臟護甲，現半息空門。】\n\n半息空門。心臟死穴。\n\n墨飛的眼底，星河流轉，一片清明。\n\n他不與那九首硬拚，只以《寒瀑劍》遲滯、《太一光明經》護體、《厚土樁》反彈，將那漫天毒煞與九首攻勢，一一化解、周旋。他如同一位技藝精湛的舞者，在那九死一生的毒煞之網中，精準地，踏著問道盤推演出的節奏，靜待著，那第五首吐信的，半息空門。\n\n一輪。兩輪。三輪。\n\n當那第五首終於吐信、心臟護甲現出半息空門的剎那——\n\n墨飛，動了。\n\n他將這一路的機緣、傳承、與畢生所學，盡數凝於一擊。《裂石訣》金系氣刃，蘊上問道至理，破開毒煞、洞穿護甲，如一道貫日的長虹，自那半息的空門，直搗妖蟒心臟!\n\n轟!\n\n九嬰妖蟒那九顆猙獰的蟒首，同時發出一聲驚天動地的哀嚎。它龐大的身軀，劇烈地抽搐了幾下，轟然，倒在了血泊之中。\n\n戰力九百的築基巔峰妖蟒——被一個築基三層的少年，以一場算無遺策的搏殺，斬殺於此!\n\n——\n\n百獸谷中，一片死寂。\n\n凌霜一隊的弟子們，望著那倒下的妖蟒，又望著那收刀而立、氣度睥睨的青衫少年，一個個，張大了嘴，忘了言語。\n\n而凌霜，這位向來清冷、深不可測的絕世天驕，此刻，望著墨飛的背影，那雙秋水般的眸子裡，翻湧著震撼、驚異，與一種，連她自己都未曾預料的，複雜情緒。\n\n三日之前，是她，護著這個煉氣圓滿的少年，一路走來。\n\n而三日之後，卻是這個少年，以一種讓她都望塵莫及的方式，反手，救了她一命，斬殺了她都難以獨力降服的妖蟒。\n\n墨飛轉過身，走到凌霜面前，遞上一枚，方才自遺跡祕藏中所得的、蘊著純陽道韻的丹藥:「師姐，此丹可壓制毒煞，暫緩你命宮的隱疾。回宗之後，我再為你，細細調理。」\n\n凌霜怔怔地，接過那枚丹藥。她凝視著墨飛，良久，清冷的唇，終於，極輕地，啟開:\n\n「你……在那遺跡之中，得了問道道統的傳承?」\n\n「是。」墨飛坦然點頭，「師姐師尊未了的道，晚輩，承下了。」\n\n凌霜靜靜地望著他，那眸中的震撼，漸漸，化作了一縷，前所未有的、溫柔而鄭重的光。\n\n「好。」她輕聲道，聲音裡，是釋然，是欣慰，更有一絲不易察覺的情愫，\n\n「我師尊……可以瞑目了。」\n\n「而你墨飛——」她抬眸，望向那走出遺跡、脫胎換骨的少年，唇角，綻開一抹，墨飛從未見過的、清淺而真實的笑意，\n\n「這條問道之路，我，願，陪你，一同走下去。」\n\n百獸谷的天光，灑在二人身上。\n\n墨飛望著眼前這位不再遙不可及、眼中盛滿星光的絕世天驕，心底，某個角落，悄然，被觸動了。\n\n「好。」他鄭重應下，唇角揚起，「一同走下去。」\n\n而在他識海深處，那由「殘」轉「全」的問道盤，正靜靜流轉著溫潤的道韻，彷彿，在為這新生的問道者，與他那，才剛剛，鋪展開來的，睥睨古今的仙途——\n\n輕輕，喝彩。\n\n秘境之行，已近尾聲。而墨飛知道，承接了問道道統的他，即將面對的，是一個，遠比萬妖森林，更廣闊、也更兇險的，天地。\n\n金丹之路，在前方，等著他。\n\n而那，湮沒於萬古的問道一脈，那通往至高之境的，漫漫長路——\n\n也才，剛剛，開始。\n\n——\n\n兩隊會合，秘境歷練，已近終期。\n\n回程的路上，墨飛，成了所有人矚目的中心。\n\n那斬殺九嬰妖蟒、力救凌霜的一幕，早已隨著沈清弦等人的口，傳遍了整支隊伍。眾內門弟子望向墨飛的目光，再無半分入秘境時的輕蔑，唯有敬畏與心悅誠服。那個曾被洛雲軒斥為「拖累」的煉氣雜役，如今，已是他們心中，深不可測的存在。\n\n而洛雲軒，則像一條喪家之犬，遠遠綴在隊伍的最後方，不敢與任何人對視。他兩次於秘境中對墨飛痛下殺手，又擅闖遺跡、圖謀傳承，這些惡行，沈清弦等人皆看在眼裡。他心知，回宗之後，等待他的，將是宗規的嚴懲，與凌霜的雷霆之怒。\n\n墨飛卻並未急著發作。他將那兩次殺手的把柄，牢牢攥在手中，如同一柄懸於洛雲軒頭頂的利劍。這條毒蛇，他要留著，慢慢，清算。\n\n「墨師兄，」沈清弦行至墨飛身側，清麗的臉上滿是敬佩，「經此一事，回宗之後，你之名，必將響徹整個內門。」\n\n墨飛淡淡一笑:「虛名而已。」\n\n他的目光，望向隊伍前方那道白衣勝雪的身影——凌霜正回眸望他，四目相接，那絕世天驕的眼底，漾起一縷清淺的、只予他一人的笑意。\n\n墨飛的心，微微一動。\n\n這一趟萬妖森林，他得了問道道統的傳承，解封了問道盤的權能，斬殺了越級的妖王，更……與這位曾遙不可及的天驕，並肩而立，結下了一段，微妙而深厚的情誼。\n\n收穫，遠超他入秘境時的想像。\n\n「問道盤的來歷，我已知曉。」他望向那通往宗門的方向，眼底，是化不開的篤定與雄心，「問道一脈的道統，我已承下。」\n\n「接下來——」\n\n他握了握拳，那雙星河流轉的眸子裡，燃起了一團，足以照亮整條仙途的火:\n\n「便是，以這問道之道，結金丹、破元嬰、渡天劫……一步一步，登上那，先賢們未曾抵達的，萬古之巔。」\n\n「而那時，」他望向天際那輪高懸的驕陽，一字一句，\n\n「這方天地，再無人，敢輕視，一個『廢根』的，問道之路。」\n\n秘境的出口，那扇散發著洪荒氣息的石門，已遙遙在望。\n\n墨飛邁開腳步，一步，一步，堅定地，朝著那扇通往嶄新天地的門，走去。\n\n一個廢根少年的問道傳奇，在承接了萬古道統之後，正式，翻開了，更加波瀾壯闊的，新的一頁。\n\n（卷三·問道傳承 上 完）"}, {"t": "第二十六章 清算", "c": "問劍宗，內門議事殿。\n\n秘境歷練歸來的次日，一場針對洛雲軒的問責，便在此地展開。\n\n主位之上，端坐著幾位內門長老，皆是元嬰之境的大能。凌霜立於一側，白衣勝雪，清冷的目光，落在殿中那個垂首而立的洛雲軒身上，不含一絲溫度。\n\n「洛雲軒，」一位鬚眉皆白的長老沉聲開口，「秘境歷練，本為同門砥礪。你身為帶隊之人，卻於幽瘴林中，捏碎血煞珠、暗推同門入險;更於上古遺跡外，行偷襲暗殺之事。此等惡行，可有?」\n\n洛雲軒面如死灰。他知道，此事，沈清弦等八人皆是人證，鐵證如山，抵賴不得。\n\n「弟子……弟子一時鬼迷心竅……」他撲通跪地，磕頭如搗蒜，「求長老開恩!」\n\n「鬼迷心竅?」凌霜終於開口，清冷的聲音，如寒冰刺骨，「你兩次三番，對同門痛下殺手，只因妒忌。這等心性，也配，列於我問劍宗內門?」\n\n她玉手一揮，一道劍光，將洛雲軒周身的護體靈光，盡數斬碎:「若非墨飛心性寬和，留你一命，你這條命，早已喪於秘境。」\n\n殿中眾長老，交換了一個眼神。洛雲軒之罪，已是板上釘釘。\n\n「念你尚是初犯，」那白眉長老終究緩了口氣，「按宗規：廢去半數修為，逐出內門，貶為外門雜役，思過三年。若再犯——逐出師門!」\n\n「不——!」洛雲軒慘嘶一聲。廢去半數修為、貶為雜役——這對一個心高氣傲的天驕而言，無異於生不如死!\n\n可他縱有萬般不甘，在這幾位元嬰長老面前，也不敢有半分反抗。他怨毒地，望了墨飛一眼，那眼神裡的刻骨仇恨，幾乎要化為實質。而後，便被兩名執事弟子，如死狗般，拖了下去。\n\n墨飛立於殿中，靜靜地看著這一切，面色平靜。\n\n洛雲軒的下場，是他咎由自取。可墨飛的問道盤，在洛雲軒被拖下去的剎那，卻悄然閃過一行「推衍」——\n\n【推衍:洛雲軒·煉器世家「洛家」嫡子。此番受辱，其家族，恐不會善罷甘休。潛在敵意:極高。】\n\n墨飛心中一凜。\n\n煉器世家洛家——那是一個，遠比洛雲軒本人，要龐大、要棘手得多的存在。今日清算了洛雲軒，不過是斬斷了一條毒蛇的獠牙;而那條毒蛇背後，那個盤踞已久的巢穴，只怕，已因今日之事，而對他，燃起了滔天的敵意。\n\n「麻煩，還在後頭。」墨飛心底了然。可他眼底，卻無半分懼意。這仙途之上，敵人只會越來越多、越來越強。他要做的，是讓自己，強到，無人敢動。\n\n——\n\n議事殿散去。\n\n墨飛之名，經此秘境一役，徹底，響徹了整個問劍宗內門。\n\n斬殺越級妖蟒、力救凌霜天驕、承得上古遺跡傳承——這一樁樁，一件件，皆是驚世駭俗的事蹟。往日那些對他不屑一顧的內門天驕，如今提及「墨飛」二字，無不，鄭重三分。\n\n甚至，連宗門的幾位元嬰長老，都對這個「以弱勝強、屢建奇功」的築基弟子，起了愛才之心，暗中，派人送來了不少修行資源。\n\n一時間，墨飛在內門的地位，水漲船高。\n\n可墨飛卻並未被這突如其來的聲名所擾。他心中清楚，這虛名之下，是更深的忌憚，也是更多的敵意。他謹記程伯「藏拙」的叮囑，對外，依舊只顯露築基三層的修為;那承自道統的完整權能、那推衍道眼的通天之能，他，一分，都未曾洩露。\n\n「洛家的敵意，宗門的關注，同門的忌憚……」墨飛立於聽濤居的院中，望著天際，心中盤算著，「木秀於林，風必摧之。」\n\n「這聲名，是助力，也是靶子。」\n\n他垂下眼，眸中星河流轉:「當務之急，是儘快，將這身修為與傳承，徹底，消化、掌控。」\n\n「唯有實力，才是，立於這風口浪尖，唯一的，倚仗。」\n\n——\n\n當夜，聽濤居。\n\n墨飛剛欲閉關參悟那承自道統的《問道錄》，院門，卻被一縷清冷的霜雪之氣，輕輕叩響。\n\n是凌霜。\n\n她一襲白衣，立於月下靈木之側，那清冷絕塵的臉上，此刻，卻透著一絲不易察覺的疲憊與蒼白。\n\n「師姐?」墨飛心中一動，那「道眼」悄然運轉——〔凌霜·命宮隱疾，今日，又有發作之兆〕。\n\n「你的『道眼』，連我這隱疾，都瞞不過。」凌霜似看穿他的心思，唇角泛起一絲苦澀的笑意，「秘境之中，那毒煞，終究，引動了我命宮的舊患。這幾日，發作得，愈發頻繁了。」\n\n墨飛神色一凜。他早在秘境之中，便已窺見凌霜那「命宮隱疾」。此患潛藏於她命宮深處，尋常手段難以根除，更會隨修為精進、心神損耗而反覆發作。這，竟是這位絕世天驕，深藏於那睥睨眾生的表象之下的，致命隱憂。\n\n「師姐，可否，讓我一觀?」墨飛鄭重道，「我承問道道統，得遺跡祕藏之古方;又習辨藥煉丹之術。或許——能為師姐，尋出一線根除的生機。」\n\n凌霜靜靜地望著他。\n\n這命宮隱疾，是她此生最大的祕密，也是最深的痛。連宗門那幾位元嬰長老、乃至她的師尊，窮盡手段，都只能壓制，無法根除。她從不曾，對任何人提起。\n\n可此刻，面對墨飛那雙星河流轉、盛滿真誠的眼睛，她那顆向來清冷孤高的心，竟鬼使神差地，軟了下來。\n\n「好。」她輕聲道，一步，走入院中，在墨飛面前，緩緩坐下，「這隱疾，困了我十年。若你，真能尋出生機……」\n\n她抬眸，望向墨飛，那雙秋水般的眸子裡，是十年孤寂之後，第一次，燃起的，一絲微弱的希望：\n\n「墨飛，我這條命，便，信你一回。」\n\n月光如水，靈木輕搖。\n\n墨飛望著眼前這位卸下了所有防備、將性命相托的絕世天驕，心底，某處，重重一動。\n\n「師姐放心。」他鄭重道，那雙承接了問道道統的眼睛，緩緩，運轉起「觀道」與「道眼」之能，凝神，望向凌霜那深藏隱疾的命宮，\n\n「你護了我一路。」\n\n「這一次，換我，來替你，算出一條，活路。」\n\n——\n\n墨飛凝神，將那新解封的「觀道」「道眼」之能，盡數運轉，探入凌霜那深藏的命宮。\n\n尋常修士診病，靠的是搭脈、觀氣、以神識探查，隔靴搔癢，往往只能窺其表象。可墨飛不同——問道盤的「觀道」，能將那命宮深處，道則的紊亂、隱疾的根源，化作可觀、可解的「道紋」，纖毫畢現地，攤在他眼前。\n\n片刻後，墨飛的臉色，凝重了下來。\n\n【凌霜·命宮隱疾·觀道解析】\n〔非尋常病症。乃一縷『上古劍煞』，深植命宮。〕\n〔此劍煞，來歷不明，似為凌霜幼年，承一部『絕世劍道功法』時，一併引入。它是她劍道通神之源，亦是……蝕她性命之根。〕\n〔壓制易，根除難。強行剝離，則其劍道盡毀;放任不理，則劍煞終將反噬，危及性命。〕\n\n墨飛倒吸一口涼氣。\n\n原來，凌霜那冠絕當世的劍道天賦，與這蝕她性命的命宮隱疾，竟是，同出一源!那一縷上古劍煞，既是她驚才絕艷的根基，也是懸於她頭頂的，催命之刃!\n\n這也難怪，宗門那幾位元嬰長老，乃至她師尊，都束手無策——強行根除，便毀了她的劍道;放任不管，便是慢性自戕。這是一個，近乎無解的死局。\n\n「如何?」凌霜見他神色凝重，心，微微一沉，「果然……無藥可醫，是麼?」十年來，無數次的希望與失望，早已將她的心，磨得近乎麻木。\n\n「不。」墨飛卻緩緩搖頭，眸中，星河流轉，「尋常之法，確是無解——因為他們，只把它當『病』來治。要麼壓制，要麼剝離。」\n\n「可它，不只是病。」墨飛一字一句，「它，是一縷『道』。是一縷，與師姐劍道，糾纏了十年的，上古劍煞之道。」\n\n凌霜身子一震，怔怔地望著他。\n\n「治病，講究驅邪扶正。」墨飛的聲音，沉靜而篤定，「可『道』，不能驅，只能——『化』。」\n\n「我承問道道統，得『觀道』之能，能看清這劍煞的道則紋路;更有遺跡祕藏中，一部關於『煉化道韻』的古法。」他望向凌霜，眼中，燃起一絲希望的光，「若能以問道之法，循序漸進，將這一縷上古劍煞的『煞』，一絲一絲地，煉化、馴服，化『煞』為『劍』——」\n\n「那麼，它便不再是蝕你性命的催命之刃，而會徹底，化作，你劍道的一部分。」\n\n「屆時，隱疾自除，師姐的劍道，更會，再上一層樓。」\n\n凌霜聽得，呼吸都停滯了。\n\n化煞為劍!以問道之法，將這困了她十年的死局，不是「治」，而是「化」——這等匪夷所思、卻又暗合大道的思路，是她窮盡十年，都不曾想到的!\n\n「只是，」墨飛話鋒一轉，神色鄭重，「此法凶險，亦需時日。煉化劍煞，需以師姐的心神為爐、以我的問道之能為引，更需幾味，能安神定煞的，上古靈材為藥。」\n\n「這幾味靈材，」他略一沉吟，「遺跡祕藏中，尚缺其二。需得，另尋機緣。」\n\n凌霜卻已顧不得那凶險與艱難。她望著墨飛，那雙向來清冷的眸子裡，此刻，盈滿了十年來，從未有過的，滾燙的希望與感激。\n\n「墨飛，」她輕聲道，聲音微微發顫，「你可知，你這一番話，對我而言，意味著什麼?」\n\n十年了。她背負著這催命的隱疾，以絕世之姿，行走於世，看似風光無限，實則，如履薄冰，每一日，都在與那潛藏的死亡，賽跑。而今日，這個她一度護在羽翼之下的少年，卻以一種，連宗門大能都不曾有的方式，為她，指出了一條，活路。\n\n「師姐言重了。」墨飛坦然一笑，「你護我一路，我還你一線生機。你我之間，不必言謝。」\n\n凌霜靜靜地望著他，月光下，那張清冷絕塵的臉上，緩緩，綻開了一抹，前所未有的、柔和而明媚的笑意。\n\n「好。」她輕聲道，眼底星光璀璨，「那從今往後，我凌霜的這條命，這一身劍道——」\n\n「便，交予你，墨飛，一同，參詳了。」\n\n那一夜，聽濤居的月色，格外溫柔。\n\n一個承接了萬古道統的問道少年，與一位背負著催命劍煞的絕世劍修，在這方小小的院落裡，因一縷「化煞為劍」的希望，將彼此的命運，悄然，交纏在了一起。\n\n而墨飛還不知道，凌霜命宮中那一縷「來歷不明的上古劍煞」，其源頭，竟也隱隱，牽連著那湮沒萬古的問道一脈，與這方天地，最深的祕密。\n\n這條為凌霜尋藥、化煞的路，將引領著他，一步步，走向那，更廣闊、也更驚心動魄的，天地深處。"}, {"t": "第二十七章 問道錄", "c": "自秘境歸來，墨飛便閉了關，一頭紮進了那部承自道統的《問道錄》之中。\n\n《問道錄》，是問道一脈的無上道法。它不教人如何以蠻力破敵，而是教人如何「觀天地、算大道、以理證道」。這部道法，與墨飛那雙看得見數值的眼睛、那顆最擅算計的心，簡直是，天作之合。\n\n隨著參悟的深入，墨飛只覺得，自己那套「以配為法、以算證道」的路，正被這部古老的道法，一點一點，拓寬、加深、拔高。\n\n從前，他能算清一場戰局的破綻;如今，他漸漸能「推衍」一場戰局的走向。\n\n從前，他能看清一件靈材的品階;如今，他漸漸能「觀」透一件靈材背後，道則流轉的至理。\n\n從前，他的功法配置，是「湊」出來的;如今，他能以問道之理，將六部功法的道韻，融會貫通，搭配得渾然天成，威力，更勝往昔。\n\n一月之後，墨飛出關。\n\n他的境界，已自築基三層，穩穩地，踏入了築基巔峰;而戰力，更是在《問道錄》與道統傳承的加持下，一舉突破，達到了——\n\n【墨飛│築基巔峰│戰力 680】\n\n戰力六百八!\n\n這個數字，已然，超越了昔日那位外門第一人雷無極，直逼，那些真正的內門頂尖天驕!\n\n而這，還只是他隱藏於「藏拙」表象之下的，真實實力。\n\n「築基巔峰。」墨飛立於院中，握了握拳，只覺得體內道基圓融、真元磅礴，「離金丹，只剩，臨門一腳了。」\n\n金丹，是修士的第二道大關。結成金丹，便可稱得上是，一方修士，壽元大增，實力更是脫胎換骨。而以墨飛此刻的底蘊——均衡道基、問道傳承、六部功法、完整權能——他這一枚金丹，只怕，將結得，與眾不同。\n\n「不急。」他心中盤算著，「金丹一結，便再難更改。需得，將這問道之道，參悟得更透徹些，方能結出，最契合我道的金丹。」\n\n「何況——」他望向凌霜所居的方向，眼神一凝，「師姐化煞所需的兩味靈材，還未著落。」\n\n——\n\n為凌霜「化煞為劍」，尚缺兩味安神定煞的上古靈材:一味，喚作「凝魂草」;一味，喚作「息壤玉髓」。\n\n這兩味靈材，皆是極其罕見之物。墨飛以「推衍」之能，反覆推算，又借閱了內門藏經閣的無數典籍，終於，尋得了些許線索——\n\n那「凝魂草」，據載，生於宗門千里之外的一處「幽冥墟」，乃是死氣與生機交纏之地所孕;而那「息壤玉髓」，更是可遇不可求，唯有在某些上古大能隕落之地的地脈深處，方有一線尋獲的可能。\n\n「幽冥墟……」墨飛沉吟。此地凶險，非同小可，絕非他此刻，可以獨自涉足。\n\n他將這線索，說與凌霜。凌霜聽罷，秀眉微蹙:「幽冥墟，乃是宗門劃定的『禁地』之一，死氣瀰漫，妖魔橫行，便是元嬰修士，亦不敢輕易深入。此事，急不得。」\n\n「待你我修為再進一步，或有宗門歷練之機，再行圖謀不遲。」她望向墨飛，眼中，是十年隱疾之後，難得的從容，「這隱疾困了我十年，也不差，再等些時日。有你這一線『化煞』的希望，我，已知足。」\n\n墨飛鄭重點頭。凌霜說得在理，以他二人此刻的修為，貿然闖入那等禁地，無異於送死。\n\n「那便，先各自精進。」墨飛道，「待時機成熟，我再陪師姐，走這一趟。」\n\n「好。」凌霜清淺一笑。\n\n只是，二人都未曾料到，那「時機」，竟會，以一種，他們都不願見到的方式，提前，降臨。\n\n——\n\n三日後，內門，風雲驟變。\n\n一則消息，如驚雷般，傳遍了問劍宗——\n\n煉器世家「洛家」的一位嫡系長老，親臨問劍宗!\n\n那洛家，乃是這一方天地，首屈一指的煉器世家，底蘊深厚，勢力龐大，便是問劍宗，也要與之交好，不願輕易得罪。而此番，那洛家長老親至，名義上，是為「探望」被廢修為、貶為雜役的洛雲軒;實則——\n\n「墨飛，你惹上大麻煩了。」沈清弦匆匆尋來，面帶憂色，「那洛家長老，是洛雲軒的親叔父，洛天罡，元嬰後期的大能!他此番前來，分明，是為洛雲軒，討公道的!」\n\n墨飛心中一沉。他的問道盤，在秘境之時，便已推衍出洛家「潛在敵意極高」。這一日，終究，還是來了。\n\n「元嬰後期……」墨飛眸光微凝。這個境界的大能，遠非他此刻，所能抗衡。若那洛天罡，執意要為洛雲軒出頭，尋他的麻煩，他，根本，毫無還手之力。\n\n「他若要當眾殺我，宗門，可會相護?」墨飛沉聲問。\n\n沈清弦面露難色:「宗規森嚴，洛天罡縱是大能，也不敢在宗門之內，公然殺你。可是……」\n\n「可是，他若以『長輩』之名，尋個由頭，設一場『比試』，借比試之機，對你下狠手——」她憂心忡忡，「便是名正言順，宗門也無從干涉了。」\n\n墨飛沉默了。\n\n他明白了。洛天罡此來，不會蠢到公然殺人，授人以柄。他要的，是一場「合乎規矩」的清算——以勢壓人，設一個他無法拒絕的局，再借那局，將他這個「傷了洛家顏面」的螞蟻，堂堂正正地，碾死。\n\n「以勢壓人的局……」墨飛闔上眼，那「推衍」之能，悄然運轉，將洛天罡可能設下的種種手段，一一，推演。\n\n良久，他睜開眼，眸中，寒光一閃，卻無半分懼意。\n\n「洛家，煉器世家。」他低聲自語，「洛天罡，元嬰後期。」\n\n「這一局，他占盡了勢，占盡了力。」\n\n「可他，不知道我墨飛，是問道傳人。」他握了握拳，眸中，星河流轉，\n\n「以勢壓人的局，我接了。」\n\n「就讓我，用這問道之算——」\n\n「破一破，你這，煉器世家的，通天之勢。」\n\n——\n\n當日午後，內門廣場。\n\n洛天罡，果然，來了。\n\n他是一位身形高大、面容冷峻的中年修士，一襲繡著玄鐵紋路的長袍，周身縈繞著元嬰後期特有的、深不可測的威壓。他身側，跟著那個被廢了修為、如今形容枯槁的洛雲軒——洛雲軒望向墨飛的眼神，怨毒中，此刻，多了一絲有恃無恐的猙獰。\n\n問劍宗的幾位長老，亦被驚動，趕來相陪，神色間，對這洛家大能，頗多客氣與忌憚。凌霜也立於一側，清冷的臉上，罕見地，凝著一層寒霜。\n\n「哪一位，是墨飛?」洛天罡開口，聲音低沉，不怒自威。\n\n「晚輩墨飛。」墨飛越眾而出，不卑不亢地拱手。\n\n洛天罡那雙鷹隼般的眼睛，落在墨飛身上，上下打量，眼中，掠過一絲毫不掩飾的輕蔑:「就是你，傷了我洛家的顏面，廢了我洛家的嫡子?」\n\n「洛師兄兩次三番，於秘境中對晚輩痛下殺手，又擅闖遺跡、圖謀傳承。」墨飛坦然道，「此事，宗門長老明察秋毫，自有公斷。晚輩，不過自保而已。」\n\n「自保?」洛天罡冷笑一聲，那笑聲裡，是元嬰大能睥睨蟻螻的傲慢，「一個小小的築基雜役，傷我洛家嫡子，還敢言『自保』?」\n\n他不再看墨飛，轉而對那幾位問劍宗長老，拱了拱手，語氣看似溫和，實則綿裡藏針:「幾位道友，我洛家與貴宗，素來交好。今日，老夫並非，要為難貴宗。只是，我那侄兒，受了委屈，老夫這個做叔父的，總得，替他，討個說法。」\n\n「老夫聽聞，這位墨飛小友，天資卓絕，於秘境中，越級斬妖，力挫強敵。」他話鋒一轉，那鷹隼般的目光，再度，鎖住墨飛，「既如此，老夫，便想與這位小友，切磋切磋。」\n\n「就當，是了結我洛家與他之間的，這段恩怨。」\n\n「點到為止，如何?」\n\n此言一出，四周，一片死寂。\n\n那幾位問劍宗長老，面面相覷，神色為難。洛天罡這番話，說得滴水不漏——他一個元嬰後期的大能，要與一個築基弟子「切磋」，美其名曰「了結恩怨、點到為止」，可這其中的凶險，誰人不知?\n\n境界懸殊如天塹。這「切磋」之中，洛天罡只需「一個不慎」，便可將墨飛，重創，乃至，擊殺於當場。事後，一句「切磋失手」，便可推得，一乾二淨。\n\n這，便是「以勢壓人」的局。名正言順，無懈可擊。\n\n凌霜再也按捺不住，清冷的聲音，如寒冰炸響:「洛前輩!以元嬰之境，欺凌一介築基後輩，傳揚出去，只怕，有損洛家，煉器世家的，清譽!」\n\n洛天罡卻只是淡淡一笑:「凌霜小友，老夫只是『切磋』，並未，要取他性命。莫非——」他目光一冷，「這位墨飛小友，做下了傷我洛家嫡子的事，卻，連一場切磋的膽量，都沒有?」\n\n這頂帽子扣下來，墨飛若是拒絕，便是「心虛」「膽怯」，便坐實了「以下犯上、卻不敢承擔」的名聲。\n\n進退維谷。\n\n眾人的目光，皆聚於墨飛一身，有擔憂，有看戲，有幸災樂禍。洛雲軒更是，已然，露出了得意的獰笑。\n\n墨飛卻在這死局之中，緩緩地，笑了。\n\n他抬起頭，迎上洛天罡那睥睨蟻螻的目光，一字一句，清晰而平靜:\n\n「洛前輩要切磋，晚輩，接了。」\n\n此言一出，四周，一片譁然。連凌霜，都秀眉緊蹙，眼中滿是憂色。\n\n唯有墨飛自己知道，他這雙眼睛背後，那方由「殘」轉「全」的問道盤，那「推衍」之能，早已將洛天罡此局的每一分「勢」，每一分「力」，都算得清清楚楚。\n\n「不過，」墨飛話鋒一轉，眸中，寒光一閃，「切磋，總得，有個彩頭。」\n\n「晚輩，想與洛前輩，立一個，賭約。」"}, {"t": "第二十八章 賭約", "c": "「賭約?」洛天罡眉頭一挑，眼中閃過一絲玩味，「你一個築基雜役，也配與老夫，立賭約?」\n\n「洛前輩既說是『切磋』、是『了結恩怨』，」墨飛不卑不亢，「那總不能，白白切磋一場。晚輩斗膽，提個賭約——」\n\n「若晚輩，在洛前輩手下，撐過三十招，不敗、不倒。」他一字一句，聲音清越，傳遍全場，「那今日這段恩怨，便一筆勾銷。洛家，自此，不得再尋晚輩的麻煩。」\n\n「反之，若晚輩撐不過三十招——」他頓了頓，坦然道，「任憑洛前輩，處置。」\n\n四周一片嘩然。\n\n撐過元嬰後期大能三十招而不敗?這少年，是瘋了不成?境界懸殊如天塹，洛天罡隨手一擊，便足以要他的命，他竟妄想，撐三十招?\n\n洛天罡也是一愣，隨即，放聲大笑:「好!好一個不知天高地厚的小子!」\n\n他求之不得。這賭約，於他而言，穩賺不賠——一個築基雜役，撐過他三十招?簡直是天方夜譚。他只需，在這三十招內，將墨飛「不慎」重創，便可名正言順，將其拿捏於股掌。\n\n「老夫，便應了你這賭約!」洛天罡傲然道，「三十招。老夫倒要看看，你這築基螞蟻，能在老夫手下，蹦躂幾息!」\n\n那幾位問劍宗長老，見二人立了賭約，雖仍憂心，卻也不便再阻攔。凌霜秀眉緊蹙，望向墨飛，眼中滿是擔憂，墨飛卻回她一個，沉靜而篤定的眼神。\n\n——\n\n比試，於內門廣場，一座巨大的防護法陣中，展開。\n\n洛天罡負手而立，渾不將墨飛放在眼裡。他甚至，並未立刻催動全力，只淡淡道:「小子，老夫讓你先出手。」\n\n這是何等的傲慢與輕視。\n\n墨飛卻不惱。他的問道盤，那「推衍」之能，早已將洛天罡此刻的狀態、氣息的流轉、乃至他那看似隨意的站姿之下，真元運行的規律，盡數，拆解、推演。\n\n【推衍:洛天罡·元嬰後期。其真元雄渾，遠非墨飛可撼。然——其恃境界之高，輕敵傲慢，真元運轉，鬆懈而無防。】\n【破局之要:不求傷敵，只求「不敗不倒」。以問道之算，尋其攻勢間隙;以配置之全，化其雷霆之威;以《木靈訣》《太一光明經》之續航，撐過三十招。】\n【勝算推演:七成。】\n\n七成。\n\n墨飛心中，有了底。\n\n他要的，從來不是「戰勝」這位元嬰大能——那是癡心妄想。他要的，是「撐過三十招」。而這，正是他那套算無遺策、攻防補控俱全的配置，最擅長的，以弱抗強、以巧化力!\n\n「洛前輩，承讓。」墨飛拱手，身形卻並未搶攻，反而，穩穩地，擺出了一個以守為攻的架勢，《厚土樁》《太一光明經》的護體之力，催發到極致。\n\n洛天罡見他不攻反守，眼中譏誚更濃:「縮頭烏龜?也罷，老夫，便來會會你這烏龜殼!」\n\n他終於出手了。\n\n一掌，看似隨意，卻蘊著元嬰後期那雄渾如淵的真元。那一掌，尚未及體，墨飛便覺得，一股足以碾碎山嶽的威壓，轟然壓下!\n\n第一招。\n\n墨飛不硬接。問道盤早已算出這一掌的軌跡與力道，他身形一卸，以最巧妙的角度，將那雷霆之力，卸開三分;《厚土樁》的反彈與減傷，又化去三分;餘下的力道，他以血肉之軀，配合《太一光明經》的護體，硬生生扛下!\n\n轟!墨飛被震得倒退十步，氣血翻湧，卻穩穩，站住了。\n\n【氣血 大損，然未倒。第一招，撐過。】\n\n洛天罡微微一怔。他這一掌，雖未盡全力，卻也足以重創尋常築基。這小子，竟卸開、扛下了?\n\n「有點意思。」他眼中，終於，多了一絲鄭重，「再接老夫一掌!」\n\n第二招，第三招，第四招……\n\n洛天罡的攻勢，一招快過一招，一招重過一招。而墨飛，如同一葉扁舟，在那滔天的巨浪之中，搖搖欲墜，卻始終，不曾傾覆。\n\n他將那套配置的精妙，發揮到了極致——卸、避、化、扛，以《寒瀑劍》遲滯，以《木靈訣》回血，以《太一光明經》全屬性護體。他從不與洛天罡硬拚真元，只以問道之算，尋那每一招的間隙，以最小的代價，撐過每一擊。\n\n十招過去，墨飛雖已渾身浴血、氣血將竭，卻，依舊，屹立不倒!\n\n全場，鴉雀無聲。\n\n那幾位問劍宗長老，望著陣中那個以築基之軀、硬撐元嬰大能十招而不倒的少年，眼中，滿是難以置信的震撼。凌霜緊握的雙拳，微微顫抖，那清冷的眸中，是掩不住的，揪心與驚異。\n\n而洛天罡的臉色，則越來越難看。\n\n一個築基雜役，竟撐過了他十招!他堂堂元嬰後期，若真讓這小子撐過了三十招，那他洛家的顏面，他這元嬰大能的顏面，將蕩然無存!\n\n「找死!」洛天罡眼中，厲色暴漲。他不再留手，周身元嬰真元盡數爆發，一身氣勢，暴漲數倍!\n\n他要以，泰山壓頂之勢，在剩下的招數裡，將這小子，徹底，碾碎!\n\n墨飛望著那暴怒的元嬰大能，望著那足以毀天滅地的真元威壓，非但沒有退縮，眼底，反而燃起了熊熊的戰意。\n\n「二十招了。」他抹了把嘴角的血，喘息著，唇角，卻揚起一絲鋒芒，「洛前輩，還剩十招。」\n\n「你這通天的『勢』——」他握緊斷刀，那雙星河流轉的眸子，直直迎上洛天罡的殺意，\n\n「可算得過，我這問道之『算』?」\n\n——\n\n最後的十招，成了墨飛此生，最兇險、也最輝煌的十招。\n\n洛天罡盡起元嬰真元，每一擊，都是雷霆萬鈞、山崩地裂。那防護法陣，被轟得劇烈震顫，靈光暴閃。而墨飛，在那足以毀滅一切的攻勢之下，一次又一次，被震飛、吐血、跌倒，卻又一次又一次，倔強地，撐著斷刀，重新，站起。\n\n他的問道盤，已被逼到了極限。每一招的破解，都精準到了毫釐之間;每一分氣血、每一縷真元的調度，都算計到了極致。他以那均衡道基的圓融、那六部功法的相濟、那問道傳承的玄妙，將「以弱抗強」四字，演繹到了，登峰造極。\n\n二十五招。二十七招。二十九招。\n\n當洛天罡那第三十招，那蘊著滔天怒火、勢要將墨飛徹底轟殺的一掌，轟然落下時——\n\n墨飛，做出了最後一算。\n\n他沒有硬接，也沒有閃避。他將全身僅剩的一絲真元、將《厚土樁》的反彈、將《太一光明經》的護體、將一枚早已備好的「淬鋒丹」，盡數，凝於那面對雷霆的一「卸」之中。\n\n轟隆！\n\n驚天動地的一擊之後，煙塵瀰漫。\n\n當那煙塵，緩緩散去——\n\n墨飛，渾身浴血，衣衫襤褸，單膝跪地，一柄斷刀，深深，插在地上，撐著他那搖搖欲墜的身軀。\n\n可他，沒有倒。\n\n那雙星河流轉的眸子，穿透瀰漫的煙塵，直直，望向面色鐵青的洛天罡，一字一句，聲音雖弱，卻清晰地，傳遍了鴉雀無聲的全場：\n\n「三十招。」\n\n「洛前輩，晚輩，撐過了。」\n\n全場，死寂。\n\n隨即，爆發出，山呼海嘯般的、無法抑制的驚呼與喝彩！\n\n一個築基巔峰的少年，硬撐一位元嬰後期大能三十招，不敗、不倒！這等驚世駭俗的一幕，縱觀問劍宗萬載歷史，也是聞所未聞！\n\n洛天罡立於陣中，望著那個跪而不倒的少年，臉色，青一陣，白一陣，最終，化作一片，難以置信的鐵青。\n\n他輸了。\n\n他一個元嬰後期的大能，設下這以勢壓人的死局，卻，敗在了一個築基雜役的「三十招之約」上。這一敗，讓他洛家的顏面，讓他這元嬰大能的顏面，掃地無存。\n\n「好……好一個墨飛。」洛天罡從牙縫裡，擠出這幾個字，那雙鷹隼般的眼睛裡，翻湧著怨毒、震驚，與一絲，被徹底顛覆的荒謬感，「賭約，老夫，認了。」\n\n他一甩衣袖，那綿裡藏針的傲慢，此刻，已化作了掩不住的陰沉:「今日之事，就此了結。」\n\n話雖如此，可他臨去前，那落在墨飛身上的、淬滿了刻骨怨毒的一瞥，卻分明在說——這一段樑子，非但沒有了結，反而，因這場當眾的慘敗，結得，更深了。\n\n墨飛望著洛天罡與那如喪家之犬般的洛雲軒，狼狽離去的背影，緩緩，闔上了眼。\n\n他知道，自己以「三十招之約」，暫時，逼退了洛家這通天之勢。可他也清楚，煉器世家洛家，那真正的滔天怒火，只怕，才剛剛，被他這一場當眾的羞辱，徹底，點燃。\n\n「洛家……」他撐著斷刀，緩緩站起，任由凌霜與沈清弦焦急地上前攙扶，心底，一片清明，「這一次，我贏了『勢』。」\n\n「可要真正，讓洛家，再不敢動我——」他望向那更高、更遠的天際，眸中，戰意熊熊，\n\n「我還得，贏了『力』。」\n\n「金丹。」他一字一頓，那是他此刻，最迫切的目標，也是他，攀向更高之境的，下一級台階，\n\n「是時候了。」"}, {"t": "第二十九章 問道金丹", "c": "與洛天罡一戰，墨飛雖勝，卻也重創。他在藥堂靜養了半月，方才將傷勢，徹底調理妥當。\n\n而這半月，墨飛也想明白了一件事——他必須，儘快，結成金丹。\n\n洛家之患，如芒在背。他今日以「三十招之約」，靠著問道之算，堪堪逼退洛天罡;可若那洛家，執意要以真正的實力碾壓他，他這築基之境，終究，還是太弱。唯有結成金丹，實力脫胎換骨，他才有真正立足、乃至反擊的資本。\n\n何況，為凌霜「化煞為劍」、深入幽冥墟尋藥，也需要，更強的實力，作為後盾。\n\n「結丹。」墨飛心意已決。\n\n他閉了關。\n\n結丹，是修士的第二道天塹。它不同於築基之「築基」，而是要將一身磅礴的真元，於丹田之中，凝練、壓縮，最終，孕育出一枚，蘊含無上道韻的「金丹」。金丹的品階，將直接決定，修士未來的成就上限。\n\n尋常修士結丹，多是水到渠成，以自身修為，自然凝聚。而金丹之品階，多為「一品」至「九品」，九品最高，卻也，可遇不可求。\n\n可墨飛的結丹，卻與眾不同。\n\n他有問道盤，有《問道錄》，有那雙看得見「道」的眼睛。他的結丹，不是「自然凝聚」，而是——「以算凝丹」。\n\n【問道凝丹·推衍中……】\n【宿主道基:均衡·圓融。六維俱穩，無有短板。】\n【建議:以「問道」之理為核，以六維均衡之力為體，凝聚「道韻金丹」。此丹，無有偏頗，契合宿主「以算證道」之路，品階……不可估量。】\n\n墨飛依著問道盤的推衍，將一身磅礴的真元，緩緩，導入丹田。他以《問道錄》的至理為引，將那六維均衡的力量，一絲一縷，均勻地，凝練、壓縮。\n\n這是一個，極其精細、極其漫長的過程。稍有偏差，那即將成形的金丹，便會出現裂痕、雜質，品階大跌，乃至，結丹失敗，一身修為，付諸東流。\n\n可墨飛，有問道盤。\n\n那真元凝聚的每一分火候、那道韻融合的每一分程度，都清清楚楚地，化作數字，攤在他眼前。他如同一位最精湛的匠人，將那枚金丹的每一分，都雕琢到了，極致的完美。\n\n一日，兩日，三日……\n\n丹田之中，那枚金丹的雛形，在墨飛「以算凝丹」的精雕細琢下，緩緩，成形。它圓潤無瑕，通體流轉著溫潤的、六色交融卻又渾然一體的道韻，散發著一股，睥睨萬物的、玄之又玄的氣息。\n\n——\n\n結丹的最後一步，是「引動天地，淬鍊丹成」。\n\n當那金丹雛形即將成形的剎那，墨飛周身的天地靈氣，驟然，瘋狂地，向他湧來!那是天地，對一枚即將誕生的、非凡金丹的，共鳴與淬鍊!\n\n聽濤居上空，靈氣翻湧，異象橫生。一道道五彩的靈光，自九天垂落，將墨飛的小院，籠罩其中。這等結丹異象之盛，驚動了整個內門!\n\n「這是……結丹異象?誰在結丹?」\n\n「是聽濤居!是墨飛!他……他要結丹了!」\n\n無數內門弟子，乃至幾位長老，皆被這驚人的異象，吸引而來，望著那籠罩聽濤居的漫天靈光，駭然失色。\n\n凌霜更是第一時間趕到，望著那異象，那清冷的眸中，滿是驚異與期盼。\n\n而在那漫天靈光之中，墨飛盤坐於院心，將那湧來的磅礴天地靈氣，盡數，引入丹田，淬鍊著那枚即將成形的道韻金丹。\n\n轟！\n\n隨著一聲彷彿響徹天地的清鳴，墨飛丹田之中，那枚圓潤無瑕、六色交融的金丹，終於，徹底，凝聚成形!\n\n【墨飛│金丹一層】\n【道韻金丹·九品圓滿(特殊：問道)！】\n【氣血、法力、真元……全面暴漲，壽元大增】\n【戰力 680 → 2100】\n【〔此金丹以問道之理為核、六維均衡為體，無有偏頗，乃萬中無一之「問道道韻金丹」。契合宿主證道之路，潛力……無可限量〕】\n\n金丹一層!戰力，一舉，突破兩千一百!\n\n九品圓滿的道韻金丹！\n\n墨飛緩緩睜開眼，只覺得天地為之一新。那結成的金丹，於他丹田之中，圓融流轉，蘊含著磅礴到近乎無窮的力量;而他那雙眼睛，那問道盤的權能，在金丹之力的加持下，更是，清明、深邃了數倍。\n\n他，終於，自那個被判「無緣」的廢根，那個蜷縮於雜役堂的少年，一步一步，結成了，這方天地間，萬中無一的，問道金丹!\n\n漫天靈光，緩緩散去。\n\n墨飛立於院中，望著那些被異象引來的、面帶震撼的內門弟子與長老，望著那些，如今，再無一人敢輕視的目光，唇角，揚起一抹沉靜的弧度。\n\n「九品圓滿……」一位聞訊趕來的元嬰長老，望著感知中墨飛那澎湃的金丹之力，喃喃自語，眼中，是掩不住的狂喜與愛才，「我問劍宗，出了一位，九品金丹的天驕!」\n\n九品圓滿的金丹，意味著什麼?意味著，墨飛未來的成就，將不可限量;意味著，他這個曾被視為「僥倖」的雜役，如今，已是問劍宗，最頂尖的天驕之一!\n\n而凌霜，望著那金丹初成、氣度愈發深不可測的墨飛，那清冷的臉上，綻開了一抹，由衷的、燦爛的笑意。\n\n「墨飛，」她走上前，眸中星光璀璨，「你，成功了。」\n\n「嗯。」墨飛點頭，望向她，那雙星河流轉的眸子裡，是化不開的篤定與溫和，「金丹已成。」\n\n「接下來——」他望向那千里之外的幽冥墟方向，一字一句，\n\n「便該，兌現我的承諾了。」\n\n「師姐，你那困了十年的隱疾，你那『化煞為劍』的生機——」\n\n「是時候，去尋，那兩味靈材了。」\n\n凌霜怔了怔，隨即，那眸中，盈滿了滾燙的、無以言表的動容。\n\n金丹初成，實力大進。而墨飛，第一個念頭，竟不是急著鞏固修為、揚名立萬，而是——踐諾，為她，尋那化煞的生機。\n\n「好。」她輕聲道，聲音，微微發顫，「幽冥墟……我陪你去。」\n\n而墨飛還不知道，這一趟幽冥墟之行，他不但將為凌霜，尋得化煞之藥，更將，在那死氣瀰漫的上古禁地深處，觸及，那關於問道一脈、關於這方天地，最為驚天的一角，秘辛。\n\n——\n\n金丹初成，墨飛在內門的地位，已然，今非昔比。\n\n九品圓滿的道韻金丹，這是連宗門那幾位元嬰長老，都為之側目的資質。往日那些暗中的忌憚與敵意，此刻，大多化作了敬畏與拉攏。甚至，宗門特意，將他自那清幽的聽濤居，遷入了內門核心、專供頂尖天驕修行的「問劍崖」。\n\n而深入幽冥墟為凌霜尋藥一事，墨飛也並未莽撞。\n\n幽冥墟，是宗門劃定的禁地，死氣瀰漫，妖魔橫行，尋常弟子，嚴禁入內。墨飛與凌霜，若要前往，需得，宗門特許。\n\n好在，墨飛如今，已是宗門重點栽培的天驕;而凌霜，更是掌門親傳。二人聯名，以「歷練、採集稀有靈材」為由，向宗門申請，很快，便獲得了那位掌管內門事務的元嬰長老的首肯——那長老甚至，特意叮囑，賜下了兩枚，可在危急時傳訊求援的「護道玉符」。\n\n臨行前，墨飛去了一趟外門，探望石敢。\n\n那憨厚的漢子，得了墨飛所贈的《磐石訣》，這半年來，苦修不輟，如今，已築基一層，在外門，也算，站穩了腳跟。見到墨飛，石敢又是激動又是敬佩:「墨兄弟!俺聽說了!你結金丹了!還是最頂級的九品!俺就知道，俺這兄弟，是要，幹大事的人!」\n\n墨飛失笑，與這實誠的兄弟，敘了半日舊，又留下一批修行資源與丹藥，方才，依依作別。\n\n「石大哥，你且安心修煉。」臨別時，墨飛鄭重道，「待我這趟歷練歸來，再助你，更上一層。你我兄弟，一同，往那高處走。」\n\n石敢重重點頭，那雙眼睛，又紅了。\n\n——\n\n三日後，問劍宗後山，一處幽深的傳送陣前。\n\n墨飛與凌霜，一身勁裝，並肩而立。那傳送陣，直通，千里之外的幽冥墟外圍。\n\n「墨飛，」凌霜望著那散發著幽幽死氣的傳送陣，清冷的臉上，罕見地，凝著一絲鄭重，「幽冥墟凶險，我雖去過外圍，卻也未曾，深入。此行，你我，需得，萬分小心。」\n\n「師姐放心。」墨飛握了握拳，那雙星河流轉的眸子裡，是化不開的篤定，「有問道盤『推衍』之能，這幽冥墟的凶險，逃不過我的眼。」\n\n他望向凌霜，一字一句，鄭重許諾:「這一趟，我定會，為師姐，尋得那兩味靈材，助你，徹底，化解那困了十年的隱疾。」\n\n凌霜靜靜地望著他，那雙秋水般的眸子裡，盈滿了，將性命相托的信任與，某種，愈發清晰的情愫。\n\n「我信你。」她輕聲道。\n\n墨飛點頭，不再多言。他握緊凌霜的手——那一瞬，凌霜身子微不可察地一顫，卻並未抽回——二人的身影，一同，踏入了那散發著死氣的傳送陣。\n\n白光一閃。\n\n當那白光散去，撲面而來的，是一股濃郁到令人窒息的、混雜著腐朽與死亡的氣息。\n\n眼前，是一片，灰暗、死寂、瀰漫著滾滾黑色死氣的，恐怖之地。天空，是永恆的鉛灰色;大地，寸草不生，唯有森森的白骨與嶙峋的怪石;遠處，隱隱傳來，非人非獸的、令人毛骨悚然的嘶嚎。\n\n幽冥墟，到了。\n\n墨飛握緊了斷刀，那「推衍」之能，悄然運轉，將這死氣瀰漫的禁地，一寸一寸，映入識海。\n\n「師姐，」他沉聲道，眸光一凝，「跟緊我。」\n\n「這幽冥墟的死氣之下，藏著的凶險——」\n\n「比萬妖森林，還要，深上，十倍。」"}, {"t": "第三十章 幽冥墟", "c": "幽冥墟，名副其實，是一片被死亡籠罩的絕地。\n\n墨飛與凌霜，沿著問道盤推衍出的、死氣相對稀薄的路徑，緩緩深入。這裡沒有生機，沒有靈氣，只有無邊無際的、滾滾翻湧的黑色死氣。那死氣沾身，便會侵蝕真元、腐蝕神魂;若非墨飛以《太一光明經》的純陽之力，時時護持二人周身，只怕，行不了多遠，便要被那死氣，侵入根本。\n\n「這裡的死氣，古怪得很。」墨飛一邊護持，一邊沉吟，「尋常禁地，死氣雖濃，卻無『序』。可這幽冥墟的死氣，隱隱之中，竟似有一種……人為布置的『陣勢』之感。」\n\n凌霜聞言，秀眉微蹙:「你是說，這幽冥墟，並非天然形成，而是……有人，刻意，煉成的死地?」\n\n「不好說。」墨飛搖頭。他那新解封的「觀道」之能，在這死氣之中，隱隱捕捉到了一絲，與問道遺跡同源的、極其微弱的道韻殘留。這讓他心底，那本記著疑點的帳，又重了幾分。\n\n這幽冥墟的深處，恐怕，也藏著，與問道一脈相關的秘辛。\n\n——\n\n行約半日，前方，出現了一片，由累累白骨堆成的、廣袤的「骨原」。\n\n那凝魂草，據問道盤推衍，便生於這骨原深處，一處死氣與一絲微弱生機交纏的「陰陽眼」之中。\n\n可這骨原，絕非坦途。\n\n墨飛的問道盤，驟然亮起警示:\n\n【警示:骨原之下，潛藏「屍傀」。】\n【屍傀·群│金丹一至二層│受死氣滋養，不知疲倦、不知痛楚，群起攻之。數量:極多。】\n\n話音未落，那滿地的白骨，竟，詭異地，動了起來!一具具由死氣凝聚、白骨拼湊而成的、青面獠牙的屍傀，自骨原之下，紛紛，爬起，猩紅的眼中，燃著幽幽鬼火，朝著墨飛與凌霜，蜂擁而來!\n\n金丹一二層的屍傀，數以百計!\n\n「來得好!」墨飛卻不懼反喜。他金丹初成，一身磅礴的真元，正需一場酣暢淋漓的搏殺，來錘鍊、來掌控!\n\n他一馬當先，將那六部功法的配置，盡數催發。《裂石訣》金系氣刃，如今蘊上金丹之力與問道至理，鋒銳無匹，一斬，便是數具屍傀齊齊碎裂;《太一光明經》的純陽光罩，更是那些死氣屍傀的剋星，所過之處，屍傀成片消融!\n\n而凌霜，更是驚才絕艷。她一聲清叱，數十柄飛劍破空而出，劍光如織，縱橫捭闔。那一柄柄飛劍，在她手中，彷彿有了生命，幻化出漫天的、璀璨奪目的劍陣，將撲來的屍傀，絞殺得，片甲不留!\n\n一人問道之算，一人劍道之絕。\n\n二人並肩而戰，配合得，天衣無縫。墨飛以問道盤推衍屍傀的攻勢與弱點，將破法，實時傳於凌霜;凌霜則以那通神的劍道，將破法，化為一道道致命的劍光。\n\n那看似無窮無盡的屍傀大軍，在二人這珠聯璧合的搏殺之下，竟被，殺得節節敗退，紛紛，重歸，那累累的白骨。\n\n饒是如此，這一場鏖戰，也足足持續了一個時辰。當最後一具屍傀，碎裂於凌霜的劍下時，二人，也已是，真元耗損，微微，喘息。\n\n「這幽冥墟，」凌霜收起飛劍，望著那重歸死寂的骨原，清麗的臉上，難得地，帶上了一絲鄭重，「果然，名不虛傳。」\n\n「這，還只是外圍。」墨飛沉聲道，「越往深處，只怕越是凶險。」\n\n他望向骨原深處，那「觀道」之能，已捕捉到了那一絲，與死氣交纏的、微弱的生機——凝魂草，就在前方。\n\n——\n\n穿過骨原，二人來到了那處「陰陽眼」。\n\n那是一方，不足丈許的、奇異的所在。四周死氣滾滾，唯獨這方寸之地，卻有一絲微弱的、翠綠的生機，倔強地，流轉著。而在那生機的中心，一株通體瑩白、散發著淡淡魂光的靈草，靜靜地，生長著。\n\n凝魂草。\n\n墨飛凝神望去，問道盤印證:【凝魂草·五百年│安神定魂之極品靈材，正是化解凌霜劍煞所需。】\n\n「找到了!」凌霜眸中，閃過一絲，壓抑不住的，激動與希望。\n\n墨飛卻並未立刻上前。他的「推衍」之能，已察覺到，這凝魂草看似唾手可得，實則，那「陰陽眼」的生機與四周的死氣，維持著一種，極其微妙的平衡。強行採摘，一旦破壞了這平衡，只怕，便會引動，那潛藏於死氣深處的，更大的凶險。\n\n「師姐，稍待。」墨飛沉聲道，「這凝魂草的採摘，需得，以問道之法，先穩住這『陰陽眼』的平衡。」\n\n他盤膝坐下，凝神，運轉問道盤的「觀道」之能，將那「陰陽眼」中，死氣與生機交纏的道則，一絲一縷，看清、算透。而後，他以《太一光明經》的純陽之力為引，小心翼翼地，將那即將傾覆的平衡，一分一分，穩住。\n\n半個時辰後，墨飛終於，尋得了那唯一的、可安然採摘的時機。他伸出手，以一種近乎虔誠的手法，將那株凝魂草，連根，穩穩地，採了下來。\n\n「陰陽眼」的平衡，穩穩，維持。四周的死氣，並未，因這採摘，而暴動。\n\n「成了。」墨飛長舒一口氣，將那株珍貴的凝魂草，小心收好，「第一味靈材，到手。」\n\n凌霜望著他那小心翼翼、算無遺策的模樣，眼中，那份動容，又深了一分。\n\n換作旁人，得見這化解隱疾的靈材，只怕，早已迫不及待地，強行採摘，乃至，因此引動凶險，喪身於此。唯有墨飛，能以那份極致的沉穩與算計，將這採摘的每一步，都算到，萬無一失。\n\n「墨飛，」她輕聲道，「有你在，我這困了十年的心結，第一次，覺得，真的，有解開的一日。」\n\n墨飛回她一笑，那笑容裡，是化不開的篤定:「會的。」\n\n「一味已得。」他望向幽冥墟那，死氣更濃、凶險更甚的深處，眸光一凝，\n\n「還有一味，息壤玉髓。」\n\n「它，就在，這幽冥墟，最深處的，地脈之中。」\n\n「而那裡——」他握緊了斷刀，那「推衍」之能，隱隱捕捉到了一絲，令他心悸的，恐怖氣息，\n\n「藏著，這幽冥墟，真正的，主人。」\n\n——\n\n夜幕降臨——雖然這幽冥墟，永無晝夜之分，只有那永恆的鉛灰。二人尋了一處死氣稍薄的巖洞，暫且歇息，恢復消耗的真元。\n\n墨飛以《太一光明經》，在洞口布下一圈純陽光罩，隔絕外間的死氣。凌霜則取出隨身的靈食與清水，二人就著微光，簡單用了些。\n\n「墨飛，」凌霜忽然開口，望著洞外那滾滾的死氣，清冷的聲音裡，帶著一絲少見的、悠遠的情緒，「你可曾想過，這幽冥墟，這萬妖森林的遺跡，這你識海中的問道盤……它們背後，到底，藏著一個，怎樣的過往?」\n\n墨飛沉默片刻，緩緩道:「想過。」\n\n「我這問道盤，是問道一脈的傳承之器。」他望著那本記著疑點的帳，一一道來，「萬妖森林的遺跡，是問道一脈的道統所在。而這幽冥墟的死氣之下，我亦感應到了，與之同源的道韻。」\n\n「這幾處，皆與問道一脈，有關。」他眸光一凝，「而問道一脈，一個曾以『觀天地、算大道』而驚才絕艷的道統，為何，會湮沒於萬古，唯餘殘念苦守?」\n\n「一個道統的覆滅，」墨飛一字一句，聲音沉了下來，「絕非，無因。」\n\n凌霜心頭一震，望向他。\n\n「我有一種預感。」墨飛望向幽冥墟的深處，眸中，掠過一絲凝重，「問道一脈的覆滅，這幽冥墟的死氣，或許……都指向，同一個，湮沒於歷史深處的，敵人。」\n\n「而那個敵人——」他握了握拳，「說不定，至今，仍未，真正，消亡。」\n\n洞中，一時，靜默。\n\n凌霜望著墨飛那凝重的側臉，心底，忽然湧起一股，難以言喻的情緒。這個少年，承接了一個湮沒道統的傳承，卻並未，沉溺於那潑天的機緣;他的目光，早已，越過了眼前的敵人與機緣，投向了，那個關於「道統覆滅」的、更深、更遠的謎團。\n\n「墨飛，」她輕聲道，那清冷的眸中，是前所未有的鄭重與……並肩的決意，「無論那背後，藏著怎樣的過往，怎樣的敵人——」\n\n「這條路，我，與你，一同走。」\n\n墨飛回頭，望著凌霜那雙盛滿星光與決意的眸子，心底，某處，重重一暖。\n\n「好。」他鄭重應下。\n\n那一夜，在這死氣瀰漫的幽冥墟深處，一方小小的純陽光罩之中，兩個追尋著「另一種道」的年輕人，將彼此的命運與道途，貼得，更近了一分。\n\n而幽冥墟的深處，那潛藏於地脈之中的、恐怖的氣息，卻在這一夜，隱隱，甦醒了幾分——彷彿，也察覺到了，兩個不速之客的到來。\n\n一場，真正的凶險，正在，那死氣的最深處，悄然，張開。"}, {"t": "第三十一章 屍魔", "c": "翌日，二人繼續深入。\n\n越往幽冥墟深處，那死氣，便越是濃郁、凝滯，彷彿化為了實質的黑霧，連墨飛的《太一光明經》純陽光罩，都被侵蝕得，隱隱波動。而那與問道一脈同源的道韻殘留，也越發清晰——墨飛越來越確信，這幽冥墟的深處，藏著一個，天大的秘密。\n\n問道盤的「推衍」，將前路的凶險，一一映出。二人小心翼翼，避開了數處潛藏的死氣漩渦與屍傀巢穴，終於，來到了幽冥墟的核心——一處，深不見底的、散發著恐怖死氣的，巨大地淵。\n\n那息壤玉髓，據推衍，便生於這地淵深處的，地脈之中。\n\n「就是這裡。」墨飛立於地淵之畔，望著那翻湧著黑色死氣的、深不見底的淵口，眸光凝重。\n\n然而，就在他話音落下的剎那——\n\n那深淵之中，死氣，驟然，瘋狂地翻湧起來!一股，遠比屍傀、遠比冰蟒、遠比洛天罡，都要恐怖百倍的、令人靈魂戰慄的氣息，自那地淵深處，緩緩，升騰而起!\n\n墨飛的問道盤，爆發出前所未有的、猩紅的警示:\n\n【警示:超高危目標·地淵深處!】\n【幽冥屍魔王│元嬰後期│戰力……約 4500】\n【〔幽冥墟之主。上古隕落大能之屍身，受萬古死氣滋養，化為屍魔。它，便是這整片死氣之地的「陣眼」與源頭〕】\n\n元嬰後期!戰力，四千五百!\n\n墨飛的瞳孔，驟然收縮。\n\n這是一個，遠遠超出他此刻認知的、恐怖的存在。他金丹一層，戰力不過兩千一;凌霜築基巔峰，戰力千五。二人聯手，也不過三千餘。而那屍魔王，戰力四千五——是他們聯手，都難以匹敵的，元嬰後期大能!\n\n「不好!」凌霜臉色劇變，「是元嬰屍魔!墨飛，快退!」\n\n可已經晚了。\n\n那地淵之中，一隻覆滿了黑色屍斑、大如山嶽的枯手，猛地，探出淵口!緊接著，一具身高數丈、周身縈繞著滔天死氣、雙目燃著幽綠鬼火的，恐怖屍魔，自那地淵深處，緩緩，爬了上來!\n\n它一現世，那滔天的死氣威壓，便如實質般，轟然壓下!墨飛與凌霜，只覺得，渾身真元凝滯，呼吸都變得，無比艱難。\n\n「跑不掉了。」墨飛沉聲道，強撐著那威壓，飛快地，運轉問道盤，推衍破局之法。\n\n【推衍:正面對抗，必死。】\n【然……此屍魔，乃「陣眼」所化，受死氣禁制束縛，不能離地淵太遠。】\n【破局:引其遠離地淵，趁其力弱之隙，取息壤玉髓後，速退。】\n【勝算……取材而退:三成。】\n\n三成。\n\n墨飛深吸一口氣。三成，總比，正面對抗的必死之局，要好。\n\n「師姐，」他沉聲道，眸中，星河流轉，「這屍魔，離不開地淵。我引它遠離，你趁機，下地淵，取息壤玉髓!」\n\n「不行!」凌霜斷然拒絕，「它戰力四千五，你引它，便是九死一生!要冒險，也是我來!」\n\n「師姐!」墨飛卻不容置疑，「你劍道通神，取材、脫身，你比我快。而引敵、周旋，以問道盤推衍走位、化解攻勢——這世上，沒人，比我更擅長!」\n\n「這是，眼下，唯一的破局之法。信我!」\n\n凌霜望著他那不容拒絕的、篤定的眼神，心中，天人交戰。最終，她那雙秋眸，一咬牙，盈滿了決絕:「好!你，萬萬，小心!取到玉髓，我即刻，來接你!」\n\n「去!」\n\n墨飛一聲斷喝，身形暴起，化作一道流光，非但沒有退避，反而，直直，衝向了那恐怖的屍魔王!\n\n——\n\n引動一頭戰力四千五的元嬰屍魔，是墨飛此生，最兇險的一場豪賭。\n\n他將問道盤的「推衍」之能，催發到了極致。那屍魔王的每一次攻擊、每一縷死氣的流轉、每一步移動的軌跡，都被他，實時，拆解、推演。他如同一片，在狂風巨浪中翻飛的葉子，在那足以毀天滅地的攻勢之下，以一種近乎奇跡的方式，一次次，堪堪，避過。\n\n他一邊避，一邊，以言語、以《裂石訣》的騷擾，將那屍魔王，一步一步，引離那地淵。\n\n那屍魔王，靈智已失，只餘嗜殺的本能。它被墨飛這「打不到、又不斷騷擾」的存在，激得狂怒，不管不顧地，追殺而來，離那地淵，越來越遠。\n\n而另一邊，凌霜抓住時機，御劍如電，一頭，扎進了那翻湧著死氣的地淵，直取，地脈深處的，息壤玉髓!\n\n墨飛與那屍魔王的周旋，卻，越來越兇險。\n\n那屍魔王雖離了地淵、威勢稍減，可它戰力，終究，遠在墨飛之上。墨飛避得，越來越勉強;那滔天的死氣，一次次，擦著他的身側掠過，將他的護體，一層層，削薄。\n\n【氣血 大損……推衍:再周旋一炷香，宿主，力竭。】\n\n一炷香。\n\n墨飛咬著牙，將自己那套配置、那問道之算，都逼到了極限。他在心底，一遍遍地，推衍著凌霜取材的進度，推衍著自己僅存的每一分氣血與真元。\n\n「快……師姐，快一點……」他一邊避開屍魔王那毀滅性的一擊，一邊，在心底，嘶聲吶喊。\n\n而就在他氣血將竭、避無可避的，千鈞一髮之際——\n\n地淵的方向，一道璀璨奪目的劍光，沖天而起!\n\n「墨飛——!接住!」\n\n凌霜的清叱，響徹幽冥墟。緊接著，一道流光，挾著一枚，散發著溫潤土黃光華的靈材，朝墨飛，激射而來!\n\n是息壤玉髓!她，取到了!\n\n墨飛精神一振，伸手，穩穩接住那枚玉髓。\n\n「走!」\n\n他不再與屍魔王糾纏，身形一轉，催動全身僅剩的真元，朝著凌霜的方向，亡命，奔逃!\n\n那屍魔王，見獵物欲逃，發出一聲驚天的咆哮，滔天死氣，鋪天蓋地，朝二人，追殺而至!\n\n——\n\n那屍魔王的追殺，快如鬼魅。二人雖已取材，卻被那滔天死氣，逼得，節節敗退，眼看，便要被那屍魔王，追上。\n\n「師姐，它離地淵越遠，那束縛它的死氣禁制，便越強!」墨飛一邊奔逃，一邊飛快地推衍，「再引它，遠離，百丈!」\n\n二人不敢回頭，拚盡全力，又往前狂奔了百丈。\n\n果然，那屍魔王追出這一段，那束縛它的、無形的死氣禁制，驟然，發揮了作用!它龐大的身軀，猛地一滯，彷彿被一根無形的鎖鏈，死死，拽住，再難，前進分毫!\n\n它憤怒地咆哮著，朝二人，揮出最後一擊。可那一擊，終究，追之不及，只將二人，震得，氣血翻湧，狼狽跌出。\n\n「成了!它，追不出來了!」墨飛喘息著，拉起凌霜，「快，趁它被禁制束縛，離開幽冥墟!」\n\n二人不敢有絲毫停留，循著問道盤標出的、最短的退路，亡命，奔逃。那屍魔王的咆哮，在身後，越來越遠，終於，徹底，消失。\n\n——\n\n不知逃了多久，當那濃郁的死氣，終於，漸漸稀薄，眼前，重現那幽冥墟的外圍時，墨飛與凌霜，才，雙雙，癱倒在地，大口大口地，喘著粗氣。\n\n劫後餘生。\n\n「取到了……都取到了……」凌霜望著墨飛手中那枚息壤玉髓，又摸了摸自己懷中的凝魂草，那清冷的臉上，是掩不住的，狂喜與後怕。\n\n化解她十年隱疾的兩味靈材，終於，湊齊了。\n\n「值了。」墨飛虛弱地笑了笑，望著那枚玉髓，「這一趟，九死一生，總算，沒有白來。」\n\n他頓了頓，神色卻凝重起來:「只是那屍魔王……」\n\n「那是一具，上古隕落大能的屍身。」墨飛緩緩道，將方才推衍所得，一一道來，「戰力四千五，元嬰後期。而它，竟是這整片幽冥墟死氣的『陣眼』與源頭。」\n\n「師姐，你想過沒有——」他眸光一凝，「一個元嬰後期的上古大能，是如何隕落於此?又是誰，將它的屍身，煉成陣眼，布下這方圓千里的、死氣瀰漫的絕地?」\n\n凌霜悚然一驚。\n\n「這幽冥墟，」墨飛一字一句，「絕非天然。它是一座，以上古大能屍身為引、以萬古死氣為陣的，人為煉成的，死亡禁地。」\n\n「而煉成它的那隻手——」他望向那死氣瀰漫的深處，眸中，掠過一絲寒意，「其道行之高、心思之毒，遠超想像。」\n\n「更可怕的是，」墨飛的聲音，沉了下來，「我在那屍魔王身上，乃至這整片死氣之中，都感應到了，與問道一脈，同源的道韻。」\n\n凌霜臉色微變:「你是說……煉成這幽冥墟的人，與問道一脈的覆滅——」\n\n「有關。」墨飛斬釘截鐵，「甚至，那個煉成幽冥墟的、湮沒於歷史深處的敵人，或許，便是，當年，覆滅了整個問道一脈的，元兇。」\n\n死氣瀰漫的幽冥墟外圍，一時，靜默。\n\n墨飛望著那片吞噬了無數生機的、恐怖的絕地，握緊了拳。他來時，只為替凌霜尋藥;卻不想，在這死亡之地，竟窺見了，問道一脈覆滅的，第一絲，線索。\n\n「這筆帳，」他一字一頓，眸中，星河與寒意，交織，\n\n「湮沒萬古的問道一脈的血仇——」\n\n「我墨飛，作為唯一的傳人，遲早，要，親手，算清楚。」\n\n他扶起凌霜，將那兩味用命換來的靈材，小心收好。\n\n「先回宗門。」他望向凌霜，眸色轉柔，「靈材已齊，該，兌現我的承諾了。」\n\n「師姐十年的心結，是時候，徹底，解開了。」"}, {"t": "第三十二章 化煞", "c": "回到問劍宗，墨飛沒有耽擱，即刻，為凌霜「化煞為劍」，做起了準備。\n\n他向宗門，借了一處僻靜、靈氣充沛的閉關密室，又以那遺跡祕藏中的古方為引，將凝魂草、息壤玉髓，並數味輔材，親手，煉成了一爐，散發著溫潤安神之光的「定煞丹」。\n\n以問道盤的「觀道」把控火候，這一爐丹，煉得，完美無瑕。\n\n一切就緒。\n\n密室之中，凌霜盤膝而坐，卸去了周身的防備。她那清冷絕塵的臉上，此刻，帶著一絲，將性命與劍道，盡數相托的，鄭重與信任。\n\n「墨飛，」她輕聲道，「這一次，若成，我這困了十年的隱疾，便可根除;若敗——」\n\n「不會敗。」墨飛打斷她，語氣篤定，「我已推衍過千百遍。師姐，你只需，放鬆心神，將那命宮劍煞，交予我。」\n\n「其餘的，」他望著她，那雙星河流轉的眸子裡，是化不開的自信與溫和，「信我。」\n\n凌霜靜靜地望著他，良久，那清冷的唇角，綻開一抹，柔和的笑意:「我信你。」\n\n——\n\n化煞，開始了。\n\n墨飛服下一枚凝神丹，將問道盤的「觀道」之能，催發到極致，神識，緩緩，探入凌霜那深藏的命宮。\n\n那一縷上古劍煞，果然，如問道盤所示，深植於凌霜命宮，與她的劍道本源，糾纏得，密不可分。它散發著森然的、毀滅性的煞氣，卻又，在那煞氣之中，蘊藏著一種，極致鋒銳、極致純粹的「劍之至理」。\n\n尋常修士，只會見那「煞」，欲除之而後快，卻不知，那「煞」與「劍」，早已，融為一體，強行剝離，便是，兩敗俱傷。\n\n可墨飛，有問道盤。有《問道錄》中，那「煉化道韻」的至理。\n\n他不驅、不剝，而是——「化」。\n\n他以那爐定煞丹的溫潤之力，將那狂暴的煞氣，一絲一縷，安撫、定住;再以《太一光明經》的純陽道韻為引，將那被定住的煞氣中，「煞」的部分，一點一點，煉化、剝離;而後，以問道之理，將剩下的、那純粹的「劍之至理」，重新，一絲一縷，融回凌霜的劍道本源之中。\n\n這是一個，比結金丹，還要精細萬倍的過程。\n\n那命宮劍煞，稍有不慎，便會暴走，反噬凌霜的心神與性命。墨飛的問道盤，將那煞氣的每一分流轉、每一絲暴動的先兆，都算到了，極致。他如同一位，在刀尖上跳舞的舞者，將這「化煞為劍」的每一步，都走得，如履薄冰，卻又，穩如泰山。\n\n密室之中，凌霜的臉上，時而，因劍煞的暴動，而痛苦地扭曲;時而，又因那煞氣被一絲絲化去，而漸漸，舒緩。她死死咬著牙，將心神，全然，交予墨飛，任由他，在她那最脆弱的命宮深處，施展著這場，關乎她生死與道途的，玄妙手術。\n\n一個時辰。兩個時辰。\n\n墨飛已是滿頭大汗，神識，消耗巨大。可他不敢有絲毫鬆懈——這化煞的最後關頭，最是凶險。那積蓄了十年的劍煞，在被大量化去之後，發起了，最後的、也是最猛烈的，一次反撲!\n\n【警示:劍煞暴動!命宮動搖!】\n\n「師姐，穩住!」墨飛嘶聲道，將全部的神識與問道之力，盡數，壓上!\n\n那一瞬，是驚心動魄的角力。墨飛以問道盤推衍出的、最精妙的手法，將那暴動的劍煞，死死，鎖住;凌霜則以她那通神的劍道意志，配合著墨飛，將那最後一縷「煞」，一咬牙，徹底，煉化、馴服!\n\n嗡——!\n\n一聲，彷彿劍鳴般的清越之音，自凌霜命宮深處，響起。\n\n那困了她十年的、蝕她性命的上古劍煞——徹底，消失了。\n\n取而代之的，是一縷，純粹到了極致的、與她劍道渾然一體的、鋒銳無匹的「劍之至理」!\n\n化煞，成了!\n\n凌霜猛地睜開眼，那雙秋水般的眸子裡，此刻，有精芒流轉，有劍意縱橫——她只覺得，體內那困擾了十年的隱患，蕩然無存;而她那本就通神的劍道，在化煞為劍之後，竟，更上一層，臻至了一個，前所未有的，圓融之境!\n\n「成了……真的，成了……」她怔怔地，感受著體內那，煥然一新的劍道與再無隱患的命宮，那雙向來清冷的眸子裡，第一次，盈滿了，滾燙的淚光。\n\n十年了。她背負著這催命的劍煞，以絕世之姿，行走於世，看似風光，實則，每一日，都在與死亡賽跑，每一次突破，都要以命相搏。這份，深埋於心底的孤獨與恐懼，無人能懂，無人能解。\n\n而今日，這個少年，卻，親手，替她，解開了。\n\n「墨飛……」她抬眸，望向那，神識消耗、面色蒼白，卻，笑意溫和的少年，那清冷了十年的心，在這一刻，徹底，融化。\n\n「多謝。」她輕聲道，聲音，微微發顫，那二字之中，藏著的，是十年的重負，一朝卸下的，無以言表的，感激與情動。\n\n「我說過，」墨飛虛弱地笑了笑，「你護我一路，我還你一線生機。」\n\n「如今——」他望著她那，再無隱患、劍意圓融的模樣，眼中，是由衷的欣慰，「生機，已還。你我之間，兩清了。」\n\n「兩清?」凌霜卻搖了搖頭，那雙盈滿淚光的眸子裡，漾起一縷，墨飛從未見過的、清晰而灼熱的情愫。\n\n她緩緩起身，走到墨飛面前，伸出手，極輕地，為他，拭去額角的汗珠。\n\n「這份恩情，」她輕聲道，一字一句，情真意切，「我凌霜，不想，兩清。」\n\n「我想……用一輩子，慢慢，還。」\n\n密室之中，靈氣氤氳。\n\n墨飛怔怔地，望著眼前這位卸下了所有清冷與孤高、眸中盛滿星光與情意的絕世劍修，那顆向來只為「證道」而跳動的心，在這一刻，重重地，漏了一拍。\n\n——\n\n那一刻的旖旎，終究，被墨飛心底翻湧的驚濤，沖淡了。\n\n因為就在方才，化煞的最後關頭，當他以「觀道」之能，深入那上古劍煞的最深處，將它徹底煉化的剎那——\n\n他，看見了。\n\n那一縷劍煞的最深處，並非空無一物。它，竟殘留著一絲，極其古老、極其晦澀的「烙印」。而那烙印之上，浮現出的道韻——\n\n墨飛的臉色，在那一瞬，變得慘白。\n\n那道韻，他認得。\n\n那是一種，與問道一脈同源、卻又被某種極致邪異的力量，徹底扭曲、污染了的——「反問道」之韻!\n\n「師姐，」墨飛沉聲開口，打斷了那密室中旖旎的氣氛，神色凝重得可怕，「你這一縷上古劍煞，來歷，只怕，非同小可。」\n\n凌霜一怔:「怎麼?」\n\n「你可還記得，這劍煞，是你幼年，承一部『絕世劍道功法』時，一併引入的?」墨飛一字一句，「那部劍道功法，是何來歷?」\n\n凌霜秀眉微蹙，追憶道:「那是……我師尊，於一處上古遺跡中，尋得的一部殘卷。師尊說，那劍道，驚才絕艷，卻，隱隱，透著一絲，不祥……」\n\n「果然。」墨飛眸光一凝，「師姐，我在你這劍煞的最深處，看見了一絲『反問道』的烙印。」\n\n「反問道?」凌霜駭然。\n\n「問道一脈，以『觀天地、算大道』證道。」墨飛沉聲道，「而『反問道』——是一種，將這問道之理，徹底扭曲、顛倒，化為『毀道、噬道』的，極致邪異之力。」\n\n「我有一種預感。」他望向凌霜，眼中，掠過一絲寒意，「當年，覆滅了整個問道一脈的元兇，煉成那幽冥墟死地的黑手，還有，你師尊尋得的那部『不祥』劍道殘卷——」\n\n「它們背後，或許，是同一股，湮沒於萬古、卻從未真正消亡的，『反問道』的，邪異勢力!」\n\n密室之中，一片死寂。\n\n凌霜望著墨飛，那雙剛剛盈滿情意的眸子裡，此刻，也染上了一層，凝重的寒霜。\n\n「若真如此……」她輕聲道，「那我這一縷劍煞，我師尊所得的那部殘卷……都不過是那股邪異勢力，遺落於世的，一鱗半爪。」\n\n「而它們真正的源頭——」\n\n「那個，覆滅了問道一脈的敵人。」墨飛接口，一字一頓，眸中，燃起熊熊的戰意與探尋，「至今，仍潛藏於這方天地的，某個角落。」\n\n「甚至……」他心底，掠過一絲不祥的預感，「說不定，早已，開始，悄然，布局。」\n\n化煞的喜悅，被這驚天的推測，沖淡。\n\n可墨飛與凌霜的心，卻在這一刻，貼得，更近了。他們不再只是，並肩尋藥的同道;他們，是共同背負著問道一脈血仇、共同追尋著那湮沒真相的，同路人。\n\n「墨飛，」凌霜握住他的手，那向來清冷的眸中，是前所未有的堅定，「這條路，這筆帳，我陪你，一起走，一起算。」\n\n墨飛回握住她的手，重重點頭，眸中，星河流轉:\n\n「好。」\n\n「化煞已成，你我道途，再無隱患。」他望向那，通往更廣闊天地的方向，一字一句，\n\n「接下來——便是，結金丹、破元嬰，一步步，強大起來。」\n\n「直到有一天，我墨飛，強到，能親手，將那湮沒萬古的『反問道』元兇，揪出來——」\n\n「為問道一脈的萬千先賢，討回，一個，公道。」\n\n密室之外，問劍宗的天光，依舊明媚。可墨飛知道，一場，橫跨萬古、關乎道統存亡的，驚天棋局，已然，在這方天地的深處，悄然，鋪開。\n\n而他，這問道一脈的唯一傳人，已，身在局中。"}, {"t": "第三十三章 邪影", "c": "為凌霜化煞成功之後，墨飛在問劍宗，徹底，聲名鵲起。\n\n九品圓滿的道韻金丹、硬撼元嬰大能三十招不敗、深入幽冥墟禁地取材而歸、更以匪夷所思的手段，化解了內門第一天驕凌霜，那困擾十年的隱疾——這一樁樁，一件件，皆是驚世駭俗的傳奇。\n\n一時間，墨飛之名，如日中天，成了問劍宗新一代弟子中，當之無愧的，第一天驕。便是那些元嬰長老，提及他時，也多是，讚許有加，愛才之心，溢於言表。\n\n然而，樹大招風。\n\n墨飛越是耀眼，那來自暗處的敵意，便越是，濃烈。\n\n其中，最深、最毒的一道，來自——煉器世家，洛家。\n\n那日內門廣場，洛天罡以元嬰之尊，卻敗於墨飛的「三十招之約」，當眾丟盡了顏面。這一箭之仇，洛家，豈會善罷甘休?\n\n只是，礙於問劍宗的顏面與宗規，洛家，不便，明著，對墨飛動手。於是，他們，選擇了，一條更陰狠的路。\n\n——\n\n這一日，墨飛正於問劍崖閉關，參悟《問道錄》，鞏固金丹。\n\n一縷極其隱晦、卻又，令他心悸的邪異氣息，忽然，掠過他那，敏銳到極致的問道盤感知。\n\n墨飛猛地睜開眼。\n\n那氣息，一閃即逝，快得如同錯覺。可他那承接了完整道統的問道盤，卻，清晰地，捕捉到了它的一絲殘留——\n\n【警示:偵測到「反問道」之韻!極其微弱，轉瞬即逝。】\n【方位:問劍宗……內部。】\n\n墨飛的心，沉了下去。\n\n反問道之韻!就在問劍宗內部!\n\n這意味著什麼?意味著，那湮沒萬古的「反問道」邪異勢力，其爪牙，竟已，悄然，滲入了問劍宗!\n\n「洛家……」墨飛眸光一凝。他幾乎立刻，便將這股邪異氣息，與那對他恨之入骨的洛家，聯繫在了一起。\n\n煉器世家洛家，勢力龐大，底蘊深厚。若他們，為了報復自己，而不惜，與那「反問道」的邪異勢力，勾結——\n\n那這盤棋，便，大了。\n\n墨飛不動聲色，卻，悄然，將問道盤的「推衍」與「道眼」，暗中，運轉起來，密切，監視著宗門內，那一切，可疑的異動。\n\n——\n\n果然，數日之後，異變，陡生。\n\n問劍宗，一位閉關衝擊元嬰的長老，於閉關之中，突然，走火入魔，暴斃而亡!\n\n那長老，修為精深，心性堅定，本不該有此劫難。可他的屍身，卻，以一種，詭異的速度，枯萎、腐朽，周身，縈繞著一絲，若有若無的、邪異的黑氣。\n\n宗門震動。\n\n幾位元嬰長老親自查探，卻，查不出，那長老暴斃的緣由，只當是，衝擊元嬰失敗的意外。\n\n唯有墨飛，在那長老的屍身之上，以「觀道」之能，清晰地，看見了——那與幽冥墟死氣、與凌霜劍煞，同源的，「反問道」的，邪異烙印!\n\n「不是意外。」墨飛心中，一片冰寒，「是有人，以『反問道』之法，暗中，害了他!」\n\n「反問道」之力，最擅，便是「毀道、噬道」。那長老衝擊元嬰、道心最脆弱的剎那，被那邪法一引，道基崩潰，走火入魔，便，順理成章。\n\n而這，分明，是一次，精準的、無聲的，暗殺!\n\n「兇手，就在宗門之內。」墨飛眸光森然。他將「道眼」催發到極致，一日日，暗中，篩查著宗門內，每一個，可能與「反問道」相關的存在。\n\n三日後，他，鎖定了目標。\n\n那是一名，新近，因「與洛家交好」而被引薦入宗、掌管內門一處丹房的，執事修士，名喚，陰無常。\n\n當墨飛的「道眼」，掠過那陰無常的剎那——\n\n【陰無常│金丹後期│戰力……偽裝下，真實戰力，約 3000!】\n【〔警示:此人氣息，經『反問道』邪法遮掩。其真身，乃「反問道」一脈之爪牙。潛入問劍宗，受洛家接引，目的……不明，恐與『針對墨飛』及某種更大的圖謀，有關〕】\n\n墨飛的瞳孔，驟然，收縮。\n\n金丹後期，真實戰力三千！一個，潛藏於問劍宗內部的、與洛家勾結的、「反問道」邪修!\n\n那長老之死，只怕，便是此人所為。而他潛入問劍宗的目的，除了配合洛家，對付自己——只怕，還藏著，一個，更深、更大的，圖謀!\n\n「原來如此。」墨飛闔上眼，將這一切，盡數，推衍、串聯，「洛家報復是明，反問道潛入是暗。」\n\n「他們，是想借洛家與我的私怨為掩護，在這問劍宗內，行那，不可告人之事。」\n\n墨飛睜開眼，眸中，寒光與戰意，交織。\n\n他知道，一場，遠比洛天罡那「三十招之約」，要凶險、要致命得多的，暗戰，已然，悄然，降臨。\n\n而這一次，他面對的，不再只是，一個心胸狹隘的洛家;而是，那，湮沒萬古、覆滅了問道一脈的、真正的，「反問道」邪異勢力，伸向這問劍宗的，第一隻，爪牙。\n\n「陰無常。」墨飛，將這個名字，鄭重，記下，眸中，殺意，凝聚，\n\n「反問道的爪牙……」\n\n「來得好。」他握了握拳，那是，問道一脈，與反問道，湮沒了萬古的血仇，第一次，以這樣的方式，重新，交鋒，\n\n「就讓我，這問道傳人，親手，拔了你這第一隻，伸進來的，爪牙。」\n\n「也好，順著你這條線——」他望向那，潛藏於暗處的，龐大陰影，\n\n「把你們，反問道的，狐狸尾巴，一寸一寸，揪出來。」\n\n——\n\n墨飛沒有，貿然，打草驚蛇。\n\n陰無常，金丹後期，真實戰力三千，遠在他之上。更兼此人潛藏於暗、詭計多端，又有洛家為奧援。若無萬全之策，貿然出手，只怕，反受其害。\n\n他做的第一件事，是尋了凌霜。\n\n密室之中，墨飛將所察，和盤托出。凌霜聽罷，那清冷的臉上，也染上了一層，凝重的寒霜。\n\n「反問道的爪牙，竟已潛入宗門……」她眸光森然，「那長老之死，原來，是他的手筆。」\n\n「此事，非同小可。」墨飛沉聲道，「陰無常一日不除，宗門，便一日，危機四伏。可他真實戰力三千，又受『反問道』邪法遮掩，尋常長老，根本，看不穿他的偽裝。」\n\n「我們，若無實據，貿然指認，」他搖頭，「反倒會被他，反咬一口。」\n\n「那便，尋實據。」凌霜眸光一凝，「拿到他行邪法、通反問道的鐵證，呈於掌門與眾長老。屆時，便是他反問道爪牙的身份，再無所遁形。」\n\n「正是此意。」墨飛頷首。\n\n二人一拍即合，暗中，張開了一張，針對陰無常的，無聲之網。墨飛以問道盤的「道眼」與「推衍」，日夜，監視著陰無常的一舉一動，靜待，他，露出破綻的，那一刻。\n\n——\n\n然而，那陰無常，也非泛泛之輩。\n\n他既是「反問道」潛入宗門的爪牙，行事，自是，滴水不漏。他白日裡，是那個和善謙恭的丹房執事;唯有夜深人靜之時，才，悄然，行那，不可告人之事。\n\n而更讓墨飛心驚的是——數日的監視下來，他發現，陰無常暗中，搜集的，竟是宗門那，幾位閉關衝擊元嬰的長老的，修行資訊，與……問劍宗鎮宗大陣的，一部分，陣圖!\n\n「他不只是要害人。」墨飛心中，警鈴大作，「他，是在，為某種，針對整個問劍宗的，大陰謀，做準備!」\n\n反問道爪牙潛入，勾結洛家，暗殺長老，窺伺鎮宗大陣——這一樁樁，串聯起來，指向的，是一個，足以，撼動整個問劍宗根基的，滔天陰謀!\n\n墨飛的臉色，前所未有的凝重。\n\n他原以為，自己面對的，不過是洛家的私怨、陰無常的暗殺。可如今看來，這背後，是「反問道」邪異勢力，對問劍宗，乃至，對這一整片天地，一盤，籌謀已久的，大棋!\n\n而他墨飛，這問道一脈的唯一傳人，恰恰，是這盤棋上，那顆，最不該出現、卻，足以，攪動全局的，變數。\n\n「陰無常，洛家，反問道……」墨飛立於問劍崖之巔，望著那，被夜色籠罩的、看似平靜的問劍宗，眸中，星河與寒意，交織，\n\n「這盤棋，越來越大了。」\n\n「可惜，」他握了握拳，眼底，是問道傳人，迎向邪異的，凜然戰意，\n\n「你們，終究，還是，低估了，一個，能『看見一切』的，問道者。」\n\n「這場暗戰，」他一字一頓，\n\n「我，接了。」"}, {"t": "第三十四章 破邪", "c": "機會在七日之後降臨。\n\n這一夜月隱星沉。墨飛的「道眼」，捕捉到陰無常鬼鬼祟祟潛入宗門後山，摸向一處鎮宗大陣的樞紐節點。\n\n「動手了。」墨飛眸光一凝。\n\n他早已與凌霜布好了局。此刻他一面以傳訊玉符，暗中知會凌霜與那位唯一被他們私下取信的元嬰長老——玄虛真人，一面自己悄然尾隨而至。\n\n後山，鎮宗大陣的樞紐前，陰無常正以一種詭異的邪法，將一枚散發著幽幽黑光、蘊著「反問道」之韻的邪異法器，悄悄埋入那陣眼的地脈之中。\n\n「果然。」墨飛藏於暗處，「道眼」把那一幕看得清清楚楚——【陰無常正以「反問道」邪器侵蝕、篡改鎮宗大陣的陣眼。一旦得逞，問劍宗鎮宗大陣將現致命破綻！】\n\n這鐵證，正是他要的一刻。\n\n「陰無常！」墨飛自暗處緩步而出，聲音冷冽如冰，「深夜潛入陣眼，行此邪法。你這『反問道』的爪牙，藏得可真夠深。」\n\n陰無常猛地回頭，見是墨飛，那張和善謙恭的臉瞬間褪去偽裝，化作一片陰鷙森然。\n\n「墨飛？」他眼中凶光畢露，「你竟識破了我？」\n\n他並不慌亂，只冷冷打量著墨飛，唇角勾起一抹殘忍的冷笑：「也罷。你既然看穿了我，那便只有死路一條。」\n\n「一個小小的金丹一層——」他周身那被邪法遮掩的、金丹後期的恐怖真元轟然爆發，「也敢壞我大事？今夜我便送你去死！」\n\n金丹後期，真實戰力三千。墨飛金丹一層，戰力不過兩千一。境界、戰力皆處下風。\n\n可墨飛的眼底卻無半分懼意。\n\n他要的本就不是獨力擊殺此人，而是拖住他，以問道之算撐到凌霜與玄虛真人趕來的那一刻。\n\n「送我去死？」墨飛冷笑，那套環環相扣的配置與那由「殘」轉「全」的問道盤同時運轉，「陰無常，你且看看，是你送得了我——」\n\n「還是我，拖得垮你。」\n\n一場以弱抗強的搏殺就此展開。\n\n陰無常的「反問道」邪法詭異陰毒，最擅毀道噬道。那一縷縷邪異黑氣專攻墨飛的道基與神魂，若是尋常修士，只怕早已道心崩潰。\n\n可墨飛是問道傳人。「反問道」，本就是「問道」的扭曲與顛倒，而墨飛的問道盤、《問道錄》，恰恰是這邪法針鋒相對的剋星。\n\n黑氣攻來，墨飛的「觀道」便將其道則紋路看得一清二楚，那看似防不勝防的邪法在他眼中破綻畢露。他以《太一光明經》的純陽正道之力，一次次將邪氣消融化解，又以問道盤推衍出的走位，將陰無常那毀滅性的攻勢一次次巧妙避開。\n\n戰力雖差著近千，可墨飛卻打得滴水不漏。陰無常每一記邪法將出未出之際，那道則流轉的破綻便已被墨飛的「觀道」看得分明；他總能在對方舊力用盡、新力未生的那一瞬，恰到好處地欺身而近，一記《裂石訣》劃過，逼得陰無常不得不回防，攻勢為之一滯。\n\n「好一個以算破敵！」陰無常又驚又怒。他縱橫多年，何曾見過這等打法——分明境界、戰力皆在他之下，那少年卻像是能看透他的每一個念頭，將這場搏殺，硬生生拖成了一潭他掙不脫的泥沼。\n\n「不可能！」陰無常又驚又怒，「你的『問道』之力，為何能剋制我的邪法？你到底是什麼人？」\n\n「我是誰？」墨飛一邊周旋一邊冷冷道，「我是你們『反問道』湮沒了萬古、卻終究沒能斬草除根的——」\n\n「問道一脈，唯一的傳人。」\n\n陰無常聞言如遭雷擊，那陰鷙的臉上第一次露出毫不掩飾的驚駭與恐懼：「問道傳人？你竟是問道一脈的餘孽？怎麼可能！問道一脈早已被我教滅絕殆盡——」\n\n「我教？」墨飛眸光一凝，牢牢抓住了這個詞。\n\n反問道自稱「我教」。這意味著覆滅問道一脈的並非零散的邪修，而是一個有組織、有傳承的龐大邪教。這條線索太重要了。\n\n「陰無常，」墨飛的問道盤已推衍出凌霜與玄虛真人即將趕到，他不再周旋，眼底寒光一閃，「你這『反問道』的來歷，你們『我教』的圖謀，還有你今夜篡改陣眼的鐵證——」\n\n「今夜，便都由不得你狡辯了。」\n\n話音未落——\n\n一道璀璨奪目的劍光，與一股元嬰後期的浩瀚威壓，自後山之巔轟然降臨。\n\n「何方邪祟，竟敢潛入我問劍宗篡改鎮宗大陣！」\n\n是凌霜，與元嬰長老玄虛真人！\n\n陰無常臉色劇變。他今夜之事已被墨飛盡數看穿，埋入陣眼的邪器更是鐵證如山。如今元嬰長老親至，他插翅難逃。\n\n「墨飛！問道餘孽！」陰無常眼中凶光與怨毒燃燒成一片瘋狂，「今日之仇，我教必百倍奉還！」\n\n他自知不敵，竟一咬牙施展出一門詭異的「血遁」邪術，不惜自損修為，化作一道血光亡命遁逃。\n\n「哪裡走！」玄虛真人一聲大喝，元嬰威壓轟然壓下。可那血遁詭異至極，竟在威壓之下堪堪遁走，只留下一地狼藉，與那枚埋入陣眼的邪異法器。\n\n——\n\n陰無常雖遁，罪證卻鐵證如山。\n\n玄虛真人取出那枚邪器，以元嬰神識一探，臉色驟然大變：「這是『反問道』的邪器，噬道毀基之物！若非今夜及時發現，一旦此物徹底侵蝕陣眼——我問劍宗鎮宗大陣危矣！」\n\n他望向墨飛，那雙深邃的老眼裡滿是驚異與鄭重：「墨飛，此番若非你識破此獠、力挽狂瀾，後果不堪設想。你立了大功。」\n\n墨飛拱手，神色卻凝重：「真人，此事非同小可。陰無常是『反問道』潛入宗門的爪牙，他勾結洛家、暗殺長老，更圖謀篡改鎮宗大陣。」\n\n「而他口中的『我教』——」墨飛一字一句，「只怕是一個湮沒於萬古、卻從未消亡的龐大邪教。他們的圖謀，絕不止一個問劍宗。」\n\n玄虛真人聞言臉色愈發凝重。他久經世事，自然聽得出此事背後那滔天的凶險。\n\n「此事老夫必稟明掌門，徹查洛家，嚴防『反問道』。」他鄭重道，又深深看了墨飛一眼，「你既能識破邪法，想來對這『反問道』知之甚深。日後宗門，或有仰仗你之處。」\n\n墨飛垂眸，並未將問道盤與問道傳承的秘密全盤托出，只道：「晚輩略知一二。若宗門有需，晚輩義不容辭。」\n\n——\n\n此夜之後，問劍宗暗流洶湧。\n\n掌門震怒，徹查洛家。那洛家引薦陰無常入宗，雖矢口否認知情，卻也因此事與問劍宗徹底交惡。洛天罡更是將這筆帳盡數算在墨飛頭上——若非墨飛揪出陰無常，洛家與反問道的勾結又豈會敗露？\n\n「墨飛，墨飛……」洛家別院之中，洛天罡咬牙切齒，那雙鷹隼般的眼睛裡怨毒幾乎化為實質，「一而再、再而三！你這問道餘孽，真當我洛家奈何不了你？」\n\n墨飛亦是心知肚明。\n\n經此一役，他徹底站上了風口浪尖。反問道已知他這問道傳人的存在——一個他們以為早已滅絕的道統餘孽，他們絕不會善罷甘休；洛家更是恨他入骨，只待尋一個將他除之而後快的時機。\n\n凌霜尋到他時，他正立於崖邊出神。\n\n「在想反問道的事？」她走到他身側。\n\n「嗯。」墨飛點頭，「陰無常一個潛入宗門的爪牙，戰力便有三千。他口中那個『我教』，究竟是何等龐然大物，我竟一時想不透。可我知道，這只是開始。」\n\n凌霜沉默片刻，忽然道：「無論那『我教』是什麼，你都不是一個人。宗門有玄虛真人，你身邊還有我。」\n\n墨飛回頭，望進她那雙清冷卻堅定的眸子，心底那份因未知而生的沉重，悄然輕了幾分。\n\n「明槍暗箭，只怕要接踵而至了。」墨飛立於問劍崖，望著那夜色沉沉的天際，心底一片清明，卻無半分懼意。\n\n「反問道，洛家……敵人越來越強，越來越多。」他握了握拳，眸中戰意熊熊，「那我便只有一條路。」\n\n「變強。」他一字一頓，「快一點變強。」\n\n「金丹一層不夠，金丹圓滿不夠。」他望向那更高、更遠的元嬰之境，眸中星河流轉，「唯有踏入元嬰乃至更高之境，我才有真正的底氣，去面對那湮沒萬古的『反問道』，去揪出那覆滅了問道一脈的真正元兇。」\n\n「也才有底氣，護住我想護的人。」他望向凌霜所居的方向，眼神轉柔，隨即又化為一片凜然的堅定。\n\n夜風獵獵。一個問道傳人的仇與志、情與劫，在這問劍宗的夜色之中，交織成一張越來越大、也越來越沉重的網。\n\n而墨飛知道，他已無退路。唯有一路向前、一路變強，將這網中的每一個敵人、每一道劫難親手算破、斬斷——直到登上那問道一脈先賢們未曾抵達的巔峰。"}, {"t": "第三十五章 論道大會", "c": "經此一役，墨飛更是心無旁騖，一頭紮進了閉關之中。\n\n他清楚，唯有實力才是這風口浪尖之上唯一的倚仗。有問劍宗傾力栽培的資源，有九品道韻金丹的底蘊，有《問道錄》的至理，他的修為一日千里。\n\n三月之後出關之時，那丹田之中的道韻金丹已然圓融無漏，臻至了金丹圓滿之境。\n\n【墨飛│金丹圓滿│戰力3600】\n\n戰力三千六！\n\n這個數字已然超越了那潛入宗門的邪修陰無常，直逼一位尋常的元嬰初期修士。以金丹之境有此戰力，縱觀問劍宗也是前所未有的妖孽。\n\n這半年來，他不但修為突飛猛進，那由「殘」轉「全」的問道盤，運用起來也愈發如臂使指。一場場模擬推演之下，他將《太一光明經》《寒瀑劍》《裂石訣》《厚土樁》這幾部功法的配合，錘鍊得渾然一體，攻守進退，皆在算中。\n\n「離元嬰只差一步了。」墨飛立於問劍崖，握了握拳，體內磅礴的真元奔湧不息。可他並不急於衝擊元嬰——元嬰乃是第三道大關，一旦結成便再難更改。他要將這金丹之道參悟到極致，方能結出與眾不同的元嬰。\n\n就在他潛心參悟之際，宗門傳來了一樁轟動整個修行界的大事——\n\n三十年一度的「天南論道大會」，即將於天南第一聖地「論道峰」舉行！\n\n天南論道大會，是天南一域所有頂尖宗門、世家乃至散修天驕共聚一堂的盛會。屆時各方天驕將於論道峰上論道、鬥法、爭鋒，一決高下。表現卓絕者不但能揚名立萬，更能得各大聖地的傳承與機緣。這是整個天南一域年輕一代天驕的最高舞台。\n\n「三十年一度……」墨飛心中一動。\n\n問劍宗作為天南數一數二的大宗，自然受邀。經過一番嚴格遴選，宗門最終選定了代表出戰的天驕名單。墨飛之名赫然位列榜首，與他一同入選的還有凌霜，以及另外幾名內門的頂尖天驕。\n\n「墨飛，」凌霜尋到他，那清冷的臉上罕見地帶著一絲鄭重與期許，「這天南論道大會非同小可。屆時天南各域的絕世天驕齊聚一堂，你我將面對的，是遠比問劍宗內強大得多的對手。」\n\n「而且，」她眸光一凝，聲音壓低了幾分，「如此盛會，各方勢力雲集、魚龍混雜。那『反問道』的邪教，只怕也不會錯過這等渾水摸魚的良機。」\n\n墨飛聞言，眸光微微一凝。\n\n凌霜說得在理。天驕雲集、機緣遍地，正是那潛藏於暗處的「反問道」興風作浪的最好時機。他那「推衍」之能隱隱生出一絲不祥的預感——這一趟論道大會，只怕不會太平。\n\n更何況，經陰無常一事，反問道已然知曉他這問道傳人的存在。論道大會這等三教九流匯聚的場合，正是他們動手的絕佳時機。墨飛心知，這一去，明處要應付洛家借他人之手的刁難，暗處還要提防那不知藏在何處的邪教爪牙。這已不只是一場天驕的較量，更是一趟步步殺機的險行。\n\n可他眼底卻無半分退意，反而燃起了熾烈的戰意。\n\n「天南各域的絕世天驕……」他握了握拳，「我墨飛自青石鎮一路走來，鬥的便是那些天賦遠勝於我的天驕。」\n\n「這論道大會正好——」他眸中星河流轉，「讓我看看，我這問道之道在這天南一域真正的天驕之林裡，能走到哪一步。」\n\n「也正好，」他眼神一冷，「順著這渾水，會一會那『反問道』的狐狸尾巴。」\n\n「師姐，」他望向凌霜，鄭重道，「這論道大會，我去定了。」\n\n凌霜望著他那戰意熊熊的眸子，清冷的唇角綻開一抹柔和而讚許的笑意：「好。」\n\n「這一趟，」她一字一句，眼中是並肩的決意，「我與你同去。」\n\n——\n\n半月之後，問劍宗赴會的隊伍正式啟程。\n\n一艘華美的、鐫刻著問劍宗徽記的巨型靈舟，載著墨飛、凌霜等一眾天驕破空而起，朝著天南聖地論道峰的方向疾馳而去。\n\n靈舟破空，一路南行。\n\n途中，凌霜行至墨飛身側，將一枚溫養好的護身玉符遞給他：「論道大會人多眼雜，這玉符能替你擋一擊致命的偷襲，收好。」墨飛一怔，隨即鄭重接過。這一路走來，這位清冷的師姐總是這般，將關切藏在最務實的細節裡。\n\n「師姐待我，總是這般周到。」他輕聲道。\n\n凌霜卻只是望向遠方，淡淡道：「你護道統、闖險境，我護你周全。這是我該做的。」那語氣平淡，可話裡的分量，墨飛聽得分明。\n\n靈舟之上，墨飛立於舟頭，望著腳下飛速掠過的廣袤大地，心潮起伏。三十年一度的天南論道大會，天驕雲集的最高舞台，潛藏於暗的反問道邪教，恨他入骨的煉器世家洛家——這一趟論道之行，註定是一場龍爭虎鬥、暗流洶湧的大劫。\n\n可墨飛的眼底卻是一片迎向風浪的澄澈與篤定。\n\n「來吧。」他望向天際盡頭那座傳說中的論道聖地，一字一頓，「天南的天驕也好，反問道的邪祟也罷——」\n\n「這一趟，就讓你們見識見識，什麼叫問道。」\n\n——\n\n三日後，論道峰遙遙在望。\n\n那是一座比問劍宗還要恢弘磅礴的萬丈仙山。峰頂雲海翻湧、仙光繚繞，一座座古樸的論道台懸浮於雲端，散發著亙古的道韻。無數靈舟、遁光自四面八方匯聚而來，將這片天空點綴得如同群星璀璨。天南各域的頂尖勢力，皆已雲集於此。\n\n那論道峰的每一寸石階、每一根樑柱，都彷彿浸潤了三十年一度、萬千天驕爭鋒所留下的道韻。空氣中瀰漫著一種令人熱血沸騰的氣息——那是無數年輕修士，將此地視為一飛沖天的舞台，帶著各自的驕傲與野心匯聚於此，所匯成的滔天氣運。\n\n饒是墨飛心志堅定，置身於這等盛況之中，那顆好勝的心，也不由得微微一熱。\n\n墨飛立於舟頭，以「道眼」掠過那一艘艘靈舟、一道道遁光——元嬰大能比比皆是，金丹天驕更是多如過江之鯽。他甚至隱隱感應到幾道深不可測、令他心悸的恐怖氣息，那是已臻化神之境的老怪物。\n\n「果然是天南的最高舞台。」墨飛心中凜然。這裡的底蘊與強者，遠非問劍宗一隅可比。\n\n問劍宗的靈舟緩緩停靠於各大宗門的泊位。一行人剛落地，便迎來了數道帶著審視與輕慢的目光。\n\n「喲，這便是問劍宗的隊伍？」一道陰陽怪氣的聲音傳來。那是鄰近泊位一個身著華服、面帶倨傲的青年，身後跟著幾名同門，「我當是誰，原來是問劍宗那位近來傳得神乎其神的『墨飛』？」\n\n墨飛以「道眼」一掃——【姬無雙│金丹後期│戰力3200│天南名門「星辰宗」天驕，自視甚高，與洛家交好】。\n\n又是一個與洛家沾親帶故的。\n\n「聽聞閣下，」姬無雙斜睨著墨飛，語氣充滿了不加掩飾的譏誚，「不過是個出身鄉野、靠著幾分取巧伎倆才爬上來的雜役？也配代表問劍宗出戰這天南論道大會？」\n\n「我星辰宗的天驕自幼便以頂尖資源悉心栽培。似你這等野路子出身的——」他嗤笑一聲，「在這論道峰上，怕是連第一輪都撐不過去。」\n\n他身後幾名弟子跟著一陣哄笑。\n\n墨飛卻恍若未聞。這等以出身、以資質論人高下的輕慢，他從青石鎮的測靈石前一路聽到現在，早已波瀾不驚。\n\n「是不是取巧伎倆，能不能撐過第一輪，」墨飛淡淡抬眸，迎上姬無雙那倨傲的目光，語氣溫吞，卻字字清晰，「論道台上見真章便是。」\n\n「姬師兄若是對我這『野路子』如此不屑，」他唇角壓下一絲鋒芒，「不妨論道之時尋我一戰。屆時是取巧伎倆還是真才實學，是雜役還是天驕——」\n\n「你自會知曉。」\n\n姬無雙臉上的譏誚微微一僵。他沒料到這個「鄉野雜役」竟如此不卑不亢，那份沉靜的氣度竟讓他這名門天驕隱隱生出一絲說不清的忌憚。\n\n「好一張利嘴！」姬無雙冷哼一聲，「墨飛，我記住你了！論道台上，我定要親手將你這雜役打回原形！」言罷一甩衣袖，帶著人悻悻離去。\n\n凌霜行至墨飛身側，望著姬無雙離去的背影，清冷的眸中掠過一絲寒意：「星辰宗姬無雙，與洛家過從甚密。這論道大會之上，只怕洛家已借他之手，對你布下了天羅地網。」\n\n「不止洛家。」墨飛望向那雲霧繚繞、暗流洶湧的論道峰，眸光深邃，「還有那潛藏於暗的反問道。」\n\n「明槍暗箭，齊至。」他握了握拳，眼底卻是一片迎向風浪的凜然戰意，「那便一個一個——」\n\n「算過去。」"}, {"t": "第三十六章 問道驚天南", "c": "天南論道大會正式開幕。\n\n論道峰頂，九座懸浮於雲端的巨大論道台同時燃起戰火。來自天南各域的年輕天驕於台上論道、鬥法，一決高下。\n\n這一屆的規則與問劍宗那外門大比頗為相似——捉對廝殺，勝者晉級，敗者淘汰；連勝者逐級而上，直至決出這一屆的天南第一天驕。只是這裡的對手個個皆是各大宗門、世家傾力栽培的絕世天驕，實力遠非問劍宗一隅可比，金丹後期乃至金丹圓滿的天驕比比皆是。\n\n墨飛的首戰，對手是一名來自天南「焚天谷」的火系天驕。\n\n【向天燒│金丹後期│戰力3100│火系，攻勢剛猛霸道，爆發力驚人】\n\n金丹後期，戰力三千一，比墨飛的金丹圓滿、戰力三千六略低。可那火系功法的剛猛霸道，卻極為難纏。\n\n戰鼓一響，向天燒便狂攻而至，一身焚天烈焰鋪天蓋地，攻勢之猛，讓台下觀戰的天驕都為之側目。\n\n可墨飛卻穩如泰山。\n\n他那由「殘」轉「全」的問道盤，將向天燒每一記火術的軌跡、力道，乃至那烈焰之中道則流轉的破綻，盡數拆解、推演。他不與那剛猛的火焰硬拚，只以《寒瀑劍》的水系寒氣層層克制、遲滯，以《太一光明經》的護體化解那焚天之勢，再以問道盤推衍出的走位，將那看似無懈可擊的攻勢一次次巧妙避過。\n\n向天燒的烈焰燒了半晌，竟連墨飛的衣角都未能真正燎到。\n\n「你這打法……」向天燒又驚又怒，「怎麼像是能未卜先知一般？」\n\n「不是未卜先知。」墨飛淡淡道，抓住向天燒一輪攻勢舊力用盡的剎那，身形一晃欺身而近，「是我算得到你的每一招。」\n\n一記蘊著問道至理的《裂石訣》金系氣刃，破開向天燒倉促凝起的火焰護體，狠狠抵上了他的咽喉。\n\n「你，輸了。」\n\n全場一片寂靜。\n\n一個名不見經傳的問劍宗弟子，竟乾淨利落地擊敗了焚天谷的火系天驕？台下無數道目光齊齊投向那台上一身青衫、氣度沉靜的少年。\n\n「墨飛？就是那個問劍宗傳得神乎其神的……」\n\n「他的打法好生古怪。分明境界、戰力並不佔絕對上風，卻將對手玩弄於股掌之間……」\n\n這些驚疑與議論，墨飛一概充耳不聞。他心中始終繃著一根弦——這論道峰上，明有洛家與姬無雙的算計，暗有那潛藏的反問道。連勝的風光之下，是步步殺機。他每贏一場，便愈發低調，絕不因一時的揚名而露出半分破綻。\n\n墨飛並未理會這些議論。他從容退場，靜待下一輪。\n\n——\n\n一輪，兩輪，三輪。\n\n墨飛如同一台精密到極致的算珠，將一個又一個天南各域的絕世天驕送下了論道台。\n\n第二輪，他對上一位以「傀儡秘術」聞名的世家天驕。那天驕操控著十餘具堅逾金石的傀儡，攻守一體，尋常對手往往被那源源不絕的傀儡耗到力竭。可墨飛的「觀道」只一掃，便看穿了那牽引傀儡的一縷縷細微靈線，斷刀翻飛，專斬靈線，十餘具傀儡頃刻間盡數癱倒。第三輪，他面對一位速度快到殘影重重的劍修，卻以「推衍」提前算準了對方每一次身法的落點，總是不多不少、恰在那落點處，等著對方一頭撞上刀鋒。\n\n一場場看似兇險的對決，都被他以一種近乎「作弊」的方式，輕描淡寫地化解。\n\n他的打法詭異而高效，卻又暗合大道。他從不與人比拚境界與蠻力，總能提前算到對手的每一招，總能精準抓住那一閃即逝的破綻，總能以最省力、最刁鑽的方式將勝勢攥進手裡。那些自幼被頂尖資源栽培的天驕一個個敗在他手下，卻連他是如何取勝的都看不分明。\n\n「問道……」台下漸漸有見多識廣的老者望著墨飛那玄妙的打法，眸中掠過一絲驚疑，「這少年的道，怎麼透著一絲古老到近乎失傳的韻味？」\n\n墨飛之名隨著這一場場驚世駭俗的勝利，開始在這天南論道大會上悄然傳開。那個曾被姬無雙譏為「鄉野雜役」的問劍宗弟子，如今已成了這一屆最耀眼、也最神秘的一匹黑馬。\n\n那高踞於論道峰頂、俯瞰全場的各大聖地化神老怪，也漸漸將審視的目光投向了那個一路越級連勝的青衫少年。\n\n「問劍宗，墨飛。」一位鬚眉皆白的化神老者望著台上的墨飛，眼中掠過一絲深深的興味，「以『算』證道，以弱勝強，有點意思。」\n\n那老者身側，另一位聖地大能亦是若有所思：「以算證道……這路數，怎麼看都不像是這幾百年新興的功法。倒像是……某個早已失傳的古老道統。」\n\n「失傳的道統？」鬚眉皆白的老者眸光一凝，「你是說……」\n\n那人沒有再說下去，只是望著台上那青衫少年的目光，多了幾分探究與慎重。\n\n「這一屆的論道大會——」鬚眉老者撫著長鬚緩緩道，「怕是要因這少年而不同了。」\n\n——\n\n第五輪，墨飛終於對上了那放言要將他「打回原形」的星辰宗天驕，姬無雙。\n\n【姬無雙│金丹後期│戰力3200│星辰宗天驕，修一部星辰劍陣，遠近皆能，變化繁多】\n\n姬無雙自恃甚高，一上台便將那星辰劍陣盡數催發。漫天星辰之力化作無數道飄忽不定的劍光，虛實相間，將整座論道台籠罩在一片璀璨而致命的星海之中。那劍陣變化繁多，尋常對手只怕早已被那漫天星光迷了眼、亂了神。\n\n可墨飛有問道盤。\n\n那看似無跡可尋的星辰劍陣，在他「觀道」之能的注視下，道則的流轉、劍光的軌跡，乃至那陣法唯一的陣眼，皆纖毫畢現。\n\n「星辰劍陣，變化雖繁，」墨飛立於那星海之中，氣定神閒，「陣眼卻只有一個。」\n\n他不去理會那漫天虛實難辨的星光，只以問道盤推衍出的路徑，如閒庭信步般，在那致命的星海之中精準地一步一步直取那唯一的陣眼。\n\n「不可能！」姬無雙駭然變色，「你竟能看穿我星辰劍陣的陣眼？」\n\n他慌忙想要變陣，可已經晚了。墨飛已至陣眼之前，一記蘊著問道至理的《裂石訣》破開陣眼那最薄弱的護持，狠狠一擊——\n\n轟！那看似無懈可擊的星辰劍陣陣眼被破，登時土崩瓦解，漫天星光盡數潰散。\n\n失了劍陣的姬無雙如同被拔了牙的猛虎。墨飛身形一晃，一套環環相扣的配置連消帶打，將他逼入絕境。三招之內，斷刀已抵上了姬無雙的咽喉。\n\n「姬師兄，」墨飛淡淡開口，那是姬無雙親口說過的話，此刻被原封奉還，「是取巧伎倆還是真才實學，是雜役還是天驕——」\n\n「你，可知曉了？」\n\n姬無雙面如死灰，那份倨傲早已蕩然無存，唯有無盡的驚駭與屈辱：「我，認輸。」\n\n台下一片譁然。星辰宗的天驕姬無雙，那與洛家交好、放言要碾壓墨飛的名門之後，竟被墨飛以破陣之姿乾淨利落地擊敗。這一戰，徹底奠定了墨飛在這一屆論道大會上「黑馬」的地位。\n\n——\n\n然而，就在墨飛連勝六輪、聲名鵲起之際，論道峰的暗處，一雙淬滿了邪異與陰毒的眼睛也牢牢地鎖住了他。\n\n那是一道混跡於觀戰人群中、氣息被邪法遮掩得天衣無縫的黑袍身影。\n\n當墨飛擊敗姬無雙、走下論道台的剎那，那黑袍身影的唇角勾起一抹森然冷笑，一縷只有墨飛的問道盤才能捕捉到的、極其微弱的「反問道」之韻，一閃而逝。\n\n墨飛的腳步微微一頓。\n\n他感應到了。\n\n「反問道，來了。」他不動聲色，眸光卻驟然一冷。\n\n反問道的爪牙果然如凌霜所料，藉著這論道大會的渾水潛入了論道峰。墨飛以「道眼」暗中掃過那一閃而逝的黑袍身影，那深藏的氣息之下，竟是一位元嬰後期的恐怖大能。\n\n一個元嬰後期的反問道大能，混跡於論道峰，死死盯著他這個問道傳人。\n\n「來為陰無常報仇？」墨飛心中飛快推衍，「還是這論道大會之上，反問道另有更大的圖謀？」\n\n他望向那人群攢動、看似盛世繁華的論道峰，眸中寒光一閃。明處是洛家、姬無雙的明槍，暗處是反問道大能的毒箭。這一屆的天南論道大會，於墨飛而言，早已不只是一場天驕爭鋒的舞台，而是一座殺機四伏、龍潭虎穴般的大劫。\n\n「都來吧。」墨飛握了握拳，那雙星河流轉的眸子裡是問道傳人迎向一切風浪的凜然無懼，「這一趟，我倒要看看——」\n\n「是你們反問道的邪勝過我問道的正，還是我這問道之算，能算破你們藏在這繁華之下的滔天殺局。」"}, {"t": "第三十七章 驚變", "c": "論道大會進行至第七日，已入尾聲。\n\n墨飛一路過關斬將，連勝十餘輪，殺入了這一屆的前八強。一個名不見經傳的問劍宗弟子，以「問道」之姿力壓天南各域無數絕世天驕，這等戰績早已轟動了整個論道峰。各大聖地的化神老怪望向墨飛的目光，皆多了幾分鄭重與招攬之意，問劍宗的隊伍更是與有榮焉，聲勢大振。\n\n然而墨飛的心中始終懸著一根弦。\n\n那潛藏於暗處的反問道元嬰大能，這幾日如同附骨之疽，始終在暗中窺伺著他。而他那「推衍」之能更隱隱捕捉到一絲越來越濃烈的不祥氣息——彷彿有一場籌謀已久的滔天陰謀，正在這論道峰的繁華之下悄然逼近爆發的臨界。\n\n「反問道潛伏於此，絕不只是為了對付我。」墨飛心中警鈴大作，「這論道峰上，究竟藏著什麼能讓他們如此大動干戈的東西？」\n\n他將「道眼」與「推衍」暗中催發到極致，一寸一寸篩查著這論道峰的每一個角落。\n\n終於，他鎖定了異常。\n\n論道峰的最深處，那座供奉著天南諸聖地歷代傳承、被層層禁制守護的「藏道閣」之中，一縷與問道遺跡、與幽冥墟同源的微弱道韻，此刻正愈發清晰。\n\n「藏道閣！」墨飛瞳孔一縮。\n\n反問道的目標不是他，甚至不是問劍宗，而是這論道峰的藏道閣。那裡供奉著天南諸聖地萬載積累的傳承，其中只怕就藏著某件與「問道一脈」相關、被反問道覬覦已久的至寶。而這論道大會天驕雲集、群雄匯聚、大能林立，如此喧囂而混亂的時機，正是反問道趁亂潛入藏道閣、盜取至寶的絕佳掩護。\n\n「不好！」墨飛心中一片冰寒。\n\n他必須立刻示警。\n\n——\n\n可就在墨飛欲尋凌霜與問劍宗長老示警的剎那——\n\n異變陡生！\n\n轟隆！一聲驚天動地的巨響自論道峰深處那藏道閣的方向轟然炸響。緊接著，一股滔天的、混雜著無邊死氣與邪異之力的黑色氣浪沖天而起，將那半邊天空都染成了一片詭異的墨黑。\n\n「藏道閣被襲！」\n\n「有魔修盜寶！護法大陣被破了！」\n\n整座論道峰瞬間大亂。無數大能、天驕紛紛朝著藏道閣的方向掠去。而那滔天的黑色氣浪之中，一道道身著黑袍、氣息邪異的身影，正護著一件散發著古老道韻的黑色匣子亡命突圍。\n\n反問道果然出手了。他們趁著論道大會的混亂強闖藏道閣，盜走了那件覬覦已久的至寶。\n\n「攔住他們！」諸聖地的化神老怪勃然大怒，紛紛出手攔截。一時間論道峰上元嬰、化神大能鬥作一團，天崩地裂，威能滔天。\n\n而墨飛卻在那一片混亂之中死死盯住了那被黑袍人護在中央的黑色匣子。他的「觀道」之能，已將那匣中之物看得一清二楚——\n\n【偵測到：上古「問道」道統之物！】\n【〔藏道閣所藏，乃問道一脈遺落於天南的一件「問道信物」。其中或藏著問道一脈覆滅的真相，與那「反問道」元兇的線索！〕】\n\n墨飛的心狂跳不止。\n\n那匣中之物竟是問道一脈的信物，是關乎問道一脈覆滅真相的關鍵！反問道不惜強闖聖地、與諸聖地大能為敵也要盜走此物——他們是想徹底抹去問道一脈存在過的最後痕跡。\n\n「不能讓他們得逞！」墨飛眸中寒光暴漲。\n\n那件問道信物，於旁人或許只是一件來歷不明的古物，可於他這問道傳人，那是他追尋已久的問道一脈真相，是萬千先賢的遺澤。\n\n「反問道……」墨飛握緊斷刀，將問道盤的「推衍」催發到極致，鎖定了那突圍的黑袍人與那黑色匣子的軌跡，「你們想抹去問道一脈的最後痕跡——」\n\n「那便先問過我這問道一脈的唯一傳人！」\n\n那漫天的恐怖餘波，於旁人是九死一生的絕地，於墨飛卻是最好的掩護。他以「推衍」算準每一道餘波的軌跡與間隙，身形在那足以絞碎金丹的能量亂流之中穿梭遊走，竟比在平地上還要迅捷幾分。旁人只當這青衫少年是瘋了，才敢往那大能廝殺的中心地帶闖；卻不知在他眼中，那看似死地的混亂，早已被拆解成一條條清晰可行的路徑。\n\n在那諸聖地大能鬥作一團、無暇他顧的混亂之中，一道青衫身影如離弦之箭，避開漫天的恐怖餘波，直直朝著那盜寶突圍的黑袍人追殺而去。\n\n——\n\n那護寶突圍的黑袍人是一名金丹圓滿的反問道弟子，負責將那問道信物護送出重圍。在諸聖地大能鬥作一團的混亂之中，他自以為無人能顧得上他這條不起眼的偏路，卻不想一道青衫身影如鬼魅般攔在了他的面前。\n\n「留下那匣子。」墨飛冷冷開口。\n\n「哪來的小輩，找死！」那黑袍人厲喝一聲，催動一身邪異真元，一縷縷「反問道」的黑氣朝墨飛絞殺而來。\n\n可他選錯了對手。\n\n「反問道」是墨飛的問道盤最針鋒相對的剋星。那看似防不勝防的邪法在墨飛的「觀道」之下破綻畢露。他以《太一光明經》的純陽正道之力將那邪氣一一化解，再以問道盤推衍出的殺招，配合金丹圓滿、戰力三千六的恐怖實力——\n\n三招！僅僅三招，墨飛便以碾壓之勢破開那黑袍人的防禦，一記蘊著問道至理的《裂石訣》貫穿了他的胸膛。那黑袍人難以置信地睜大雙眼，至死都不明白自己怎會敗得如此之快。\n\n墨飛一把奪過那散發著古老道韻的黑色匣子。指尖觸及的剎那，那匣中的問道信物竟如遊子歸家般，發出一陣溫潤的、與他識海問道盤遙相呼應的清鳴。\n\n「拿到了！」墨飛心中一喜。\n\n可還未等他收好匣子——\n\n一股令他靈魂都為之戰慄的恐怖威壓自身後轟然壓下。\n\n「問道餘孽！竟是你！」\n\n一道森然而暴怒的聲音響起。墨飛猛地回頭，只見那潛藏了多日的反問道元嬰後期大能，此刻已褪去偽裝，一身滔天的邪異之力鋪天蓋地朝他鎮壓而來。\n\n【反問道·護法·墨淵│元嬰後期│戰力……約5000！】\n\n元嬰後期，戰力五千！\n\n那是遠比幽冥墟屍魔王還要恐怖的存在，是此刻的墨飛拍馬都難以望其項背的滔天巨物。\n\n「陰無常廢物壞我大事，今日你這問道餘孽又來搶奪聖物！」墨淵那雙淬滿邪異的眼睛裡凶光滔天，「我教籌謀百年，豈容你這區區螞蟻一再壞事！」\n\n「今日我便親手將你這問道一脈最後的餘孽——」他一掌攜著毀天滅地的邪異之力朝墨飛轟然拍落，「連同這問道信物一併徹底抹殺！」\n\n那一掌之下天地失色。墨飛只覺得那股足以將他連魂帶魄都碾成齏粉的恐怖威壓已然臨頭。\n\n生死一線！\n\n墨飛的問道盤瘋狂運轉，卻只推衍出一片冰冷的絕望——【正面對抗：必死。逃：亦難逃元嬰後期神識鎖定。】\n\n千鈞一髮之際——\n\n墨飛做出了最後的抉擇。他一手死死護住那問道信物，一手毫不猶豫地捏碎了那枚玄虛真人臨行前贈予的「護道玉符」。\n\n嗡！一道蘊著問劍宗一位化神太上長老一縷神念的護道之光自玉符中轟然爆發，堪堪擋下了墨淵那毀滅性的一掌。\n\n轟隆！護道之光與那邪異一掌轟然相撞，滔天的餘波將墨飛狠狠震飛出去，口噴鮮血，重傷垂危。\n\n可他，活下來了。\n\n「問劍宗的老怪物……」墨淵見一擊未能得手，又見那護道玉符驚動了問劍宗的化神大能，眼中凶光一閃，終究不敢過度糾纏。他狠狠剜了墨飛一眼，那怨毒的目光彷彿要將他刻進骨髓。\n\n「問道餘孽，你記住了！」他厲聲道，聲音如附骨之疽，「你搶了聖物、壞了我教大事，這筆帳，我墨淵，我反問道——」\n\n「早晚要你連本帶利一併償還！」\n\n言罷，他不敢再留，化作一道邪異的黑光倉皇遁逃，消失在了那論道峰的漫天混亂之中。\n\n墨飛重傷倒在地上，卻死死地將那問道信物護在懷中。他望著墨淵遁逃的方向，又望向懷中那溫潤呼應的問道信物，喘息著，唇角卻揚起一絲帶血的笑意。\n\n凌霜與問劍宗的幾位長老聞訊趕至時，墨飛已是重傷垂危，可那懷中的黑色匣子，卻被他護得嚴嚴實實。\n\n「墨飛！」凌霜臉色驟變，一個箭步上前將他扶住，那向來清冷的眸中滿是後怕與心疼，「你這是何苦！一個金丹，去搶元嬰大能手中的聖物——」\n\n墨飛虛弱地笑了笑，將那匣子往她懷裡一送：「這是問道一脈的信物……比我這條命，要緊。」\n\n「信物，保住了。」\n\n「反問道，墨淵，我教……」他將這一切一一刻入心底，眸中是重傷之下卻越燃越烈的戰意，「這筆帳——」\n\n「早晚，我墨飛會親手同你們，算個清楚。」"}, {"t": "第三十八章 信物", "c": "反問道強闖藏道閣、盜取聖物一事，震動了整個天南修行界。\n\n雖有諸聖地大能聯手攔截，那反問道仍趁亂逃逸了大半，唯有墨飛自那盜寶的黑袍人手中硬生生奪回了那件最為關鍵的問道信物。\n\n當論道峰的化神老怪們得知那件失而復得的聖物竟是被一個「金丹圓滿的小輩」奪回，更力抗反問道元嬰護法一擊而不亡時，皆是震驚不已。而當他們得知那件聖物乃是湮沒萬古的「問道一脈」的信物，且那少年墨飛竟能與之遙相呼應時——\n\n整個論道峰的頂層都為之轟動了。\n\n「問道一脈，那個傳說中以『算』證道、驚才絕艷，卻於萬古之前一夕覆滅的神秘道統？」\n\n「那少年能與問道信物呼應，莫非他是問道一脈的傳人？」\n\n墨飛那「問道傳人」的身份，經此一役再難隱藏。\n\n——\n\n論道峰，一處清幽的療傷靜室。\n\n墨飛重傷未愈，靜臥榻上。凌霜守在一側，親手為他餵下療傷靈藥，那雙向來清冷的眸子裡，此刻滿是揪心與後怕。\n\n「你這人……」她輕聲埋怨，聲音卻微微發顫，「明知那墨淵是元嬰後期的大能，你一個金丹竟還敢去奪那聖物。你可知道，你若晚一步捏碎玉符——」\n\n「可我若不去奪，」墨飛虛弱地笑了笑，望著懷中那件溫潤的問道信物，「這問道一脈遺落於世的最後真相，便永遠落入反問道之手了。」\n\n「這信物，」他一字一句，眼神鄭重，「是萬千問道先賢的遺澤，是我這唯一傳人追尋已久的真相。」\n\n「我不能讓它湮沒。」\n\n凌霜靜靜地望著他，那份揪心與埋怨，終究化作了一縷深深的動容與敬佩。\n\n眼前這個少年重傷垂危，念念不忘的卻不是自身的安危，而是一個湮沒道統的傳承與真相。這份守護道統的執著與擔當，讓她這絕世天驕都為之動容。\n\n「你可知，」凌霜輕聲道，替他掖了掖被角，「當年在雜役堂初見你時，我只當你是個運氣好、撿了機緣的廢根少年。可這一路看下來……」她頓了頓，那清冷的眸中泛起一絲柔和，「你身上背負的東西，比誰都重。」\n\n「重麼？」墨飛虛弱地笑了笑，「我倒覺得，正因為有這份重量，我這條命，才活得比從前踏實。廢根也好，傳人也罷，總要活出個讓自己不後悔的樣子。」\n\n凌霜靜靜地看著他，沒有再說話，只是那握著他的手，又緊了幾分。\n\n「墨飛，」她握住他的手，輕聲道，「養好傷。這信物之中的真相，你我一同去解。」\n\n墨飛點頭。他運轉起那由「殘」轉「全」的問道盤，將神識探入那件與之呼應的問道信物之中。\n\n那信物之內，緩緩浮現出一段塵封了萬古的影像與意念——\n\n那是問道一脈最後的歲月。\n\n墨飛看見了。他看見那曾以「觀天地、算大道」而驚才絕艷的問道一脈，是如何在一夕之間被一股極致邪異、極致龐大的力量覆滅、屠戮，幾近滅絕。\n\n而那覆滅問道一脈的元兇——\n\n墨飛的瞳孔驟然收縮。\n\n那是一個自稱「噬道天教」的、龐大而古老的邪教。他們信奉「毀道、噬道」之理，將天地間一切「道統」視為可供吞噬、壯大己身的養料。而問道一脈那參透萬物、丈量大道的至理，更是被他們視為天下最肥美的獵物。\n\n「噬道天教……」墨飛喃喃，將這個名字刻入骨髓，「反問道原來只是他們對外的一個分支。」\n\n「他們的目標，」墨飛的臉色前所未有的凝重，「不只是問道一脈，而是這天地間一切道統與傳承。」\n\n那影像之中，墨飛更看到了問道一脈覆滅時的慘烈：無數身著素袍的問道修士，以觀天算地之能布下大陣，卻仍擋不住那墨黑邪潮的吞噬。一位位驚才絕艷的先賢，將畢生所悟的道統煉入信物、四散託付，只為給後世留一線復興的火種。那一幕幕壯烈，看得墨飛熱血翻湧，拳頭死死攥緊。\n\n「他們煉幽冥墟、盜藏道閣、暗殺長老、覬覦聖物——都是為了吞噬更多的道！」\n\n一個遠比他想像中還要龐大、還要恐怖的滔天陰謀，自這問道信物之中緩緩揭開了它的一角。\n\n而那信物的最後，那湮沒萬古的問道先賢的殘念，留下了一句令墨飛心神劇震的話語——\n\n【問道傳人……噬道天教未曾真正消亡。它潛藏於這天地的最深處，已悄然復甦。】\n【欲破噬道，唯有重興問道。踏元嬰、破化神、證大道，集齊散落於天地的問道信物，重鑄問道道統。】\n【方能與那噬道天教一決……生死。】\n\n墨飛緩緩睜開眼，那雙眸子深處星河激盪，是前所未有的凝重，與燃燒著的使命。\n\n「重興問道，對抗噬道。」他一字一頓，望向那更廣闊、也更凶險的天地深處，「這便是我這問道傳人，此生註定的道。」\n\n——\n\n墨飛養傷三日，方才痊癒。\n\n而這三日，論道大會也落下了帷幕。\n\n因藏道閣一役，墨飛力抗反問道、奪回聖物，其「問道傳人」之名早已響徹天南。雖因受傷未能再戰，他仍以連勝十餘輪、殺入八強的戰績，並守護聖物的大功，被列為這一屆論道大會最耀眼的天驕之一。\n\n論道結束後，數位諸聖地的化神老怪竟親自尋上門來，欲收墨飛為徒。\n\n「小友以問道之姿力壓群雄，又心繫道統，老夫甚是欣賞。」一位道骨仙風的化神老者語重心長，「不若入我聖地，老夫親自傳你大道？」\n\n這等機緣足以讓天南任何一個天驕趨之若鶩。\n\n可墨飛卻一一婉拒了。\n\n「多謝諸位前輩厚愛。」他鄭重拱手，「只是晚輩身負問道一脈的傳承與使命，此生註定要重興問道、對抗噬道。這條路，晚輩只能自己走。」\n\n「何況，」他望向凌霜，眼神轉柔，「晚輩的根，在問劍宗。」\n\n那幾位化神老怪聞言非但沒有不悅，反而對墨飛更添了幾分讚許。這份不為機緣所動、守護道統的道心，比任何天縱之資都更為難得。他們見過太多天資縱橫卻心術不正的天驕，也見過太多為機緣不擇手段的後輩；而墨飛這般既有絕世之能、又有守道之心的少年，才是真正能扛起一份道統、一方天地的人物。這，也正是他們願意結交、願意相助的緣由。\n\n「好一個問道傳人。」那道骨仙風的老者撫須而笑，「也罷。他日你若需要對抗噬道天教，我等聖地願助你一臂之力。噬道天教禍亂天地，乃是我等共同之敵。」\n\n「前輩厚意，晚輩銘記。」墨飛鄭重還禮。他知道，這一句承諾的分量——諸聖地雖各有算計，可在「噬道天教」這個共同的大敵面前，他這面「問道」的旗幟，已然有了凝聚天下正道的資格。\n\n這是他孤身一人時，從未敢想的局面。\n\n有了諸聖地這一句承諾，墨飛重興問道的路上便多了幾分底氣。\n\n——\n\n赴會的隊伍啟程返回問劍宗。\n\n靈舟之上，墨飛立於舟頭，望著那腳下掠過的廣袤天南，心潮起伏。\n\n這一趟論道大會他收穫良多——揚名天南、奪回問道信物、揭開噬道天教的驚天陰謀、得諸聖地相助之諾。可他也清楚地看見了那橫亙於前的滔天巨浪。\n\n噬道天教，一個覆滅了問道一脈、潛藏了萬古、如今悄然復甦的龐大邪教。而洛家只怕早已與這噬道天教勾結，成了那邪教伸向天南的一枚棋子。\n\n「墨淵，戰力五千，元嬰後期。」墨飛心中飛快盤算，「而這還只是噬道天教的一名護法。他們真正的底蘊，只怕深不可測。」\n\n「我金丹圓滿，戰力三千六。」他握了握拳，眸光一凝，「太弱了。」\n\n「欲破噬道，欲重興問道，欲護住我想護的人——」他望向凌霜，又望向那青石鎮的遙遠方向，眸中燃起熊熊的決意，「我必須儘快踏入元嬰。」\n\n「元嬰、化神乃至更高之境……」他一字一頓，「這問道一脈先賢們未曾走完的路，我要一步一步親手走下去，直到強到足以與那噬道天教正面一決生死。」\n\n靈舟破空，載著一位新生的問道傳人，與他那才剛剛揭開序幕的問道與噬道的萬古之爭，朝著問劍宗的方向疾馳而去。\n\n而墨飛還不知道，就在他揚名天南、揭開噬道天教陰謀之際，那遙遠的青石鎮，那將他養大成人的跛腳老鎮醫程伯的身上，一樁塵封了數十年的驚天秘辛，也正因這天地間問道與噬道的風雲再起，而悄然浮出水面。\n\n一封來自青石鎮的、染著淡淡血跡的傳訊，正穿越千山萬水，朝著問劍宗的墨飛，飛來。"}, {"t": "第三十九章 血訊", "c": "問劍宗，問劍崖。\n\n墨飛歸來後本欲立刻閉關，衝擊元嬰。可就在他剛剛靜下心神之際——\n\n一枚染著淡淡血跡、樣式古樸的傳訊玉符，穿越了千山萬水，帶著一絲微弱到幾乎斷絕的靈力，落入了他的手中。\n\n墨飛的心猛地一沉。\n\n這玉符的樣式他認得——那是程伯壓箱底的物件之一，是他離開青石鎮時，程伯悄悄塞給他的，說是「危急時可傳個訊」。而此刻，這玉符之上那淡淡的血跡、那微弱得幾乎斷絕的靈力……\n\n墨飛的手微微顫抖起來。他迫不及待地將神識探入玉符。\n\n一段斷斷續續、夾雜著劇烈打鬥聲的蒼老話語，傳入了他的識海——\n\n「墨飛……青石鎮……有噬道天教的人……來了……」\n\n「他們是衝著問道一脈……衝著你……來的……」\n\n「老頭子攔不住……墨飛，莫要回來……危險……你身負問道傳承，萬萬不可涉險……」\n\n「保重……去，重興問道……」\n\n話音在一陣劇烈的爆響中戛然而止。玉符那微弱的靈力，也徹底斷絕。\n\n「程伯——！」墨飛豁然起身，一顆心如墜冰窟。\n\n青石鎮！噬道天教！程伯！\n\n那個將他養大成人的跛腳老鎮醫，那個問道盤都看不透、身藏諸多秘辛、待他如親生子的老人，此刻竟為了保護他、保護「問道」的秘密，正獨自面對著噬道天教的屠刀。\n\n「他們是衝著問道一脈來的。」墨飛腦中念頭飛轉，「程伯一個尋常的鎮醫，噬道天教為何要對他下手？」\n\n「除非——」一個他一直深埋於心底、卻始終不敢深想的念頭轟然炸開，「除非程伯他本就與問道一脈有關！」\n\n問道盤看不透他，他懂得遠超一個鎮醫的修行見識，他有「遠超凡品」的納物袋，他那句意味深長的「以算證道」，他這枚能穿越千里、還帶著防護靈力的傳訊玉符……一條條被墨飛深埋於心底的疑點，在這一刻串聯了起來，齊齊指向了一個他從未敢想的真相——\n\n程伯，那個青石鎮的跛腳老鎮醫，絕非一個尋常的凡人。\n\n「程伯，你到底是誰？」墨飛眼眶發紅，「你為我隱藏了多少？又為我背負了多少？」\n\n他的腦海中，不受控制地浮現出程伯的模樣：那個總在濟生堂裡搗藥、嘴上罵著「臭小子」、卻總把最好的那碗藥膳留給他的老人；那個在他被全鎮恥笑、失魂落魄地回到家時，只是默默替他添了雙筷子的老人；那個在他離鄉遠行時，紅著眼眶塞給他一堆物件、卻硬說「別磨蹭」的老人。\n\n十六年的點點滴滴，在這一刻如潮水般湧來，几乎將墨飛的心，撕成碎片。\n\n可此刻已容不得他細想。\n\n「莫要回來」——程伯的最後一句叮囑猶在耳邊。\n\n可墨飛又豈能聽從？那是將他從一個墜崖的廢材、一個人人恥笑的搗藥少年一手養大成人的唯一至親。\n\n「程伯，你為我遮風擋雨十六年。」墨飛眼中是焚天的焦急與決意，「如今你有難，我豈能棄你於不顧！」\n\n「回去！」他一字一頓，斬釘截鐵，「就算是龍潭虎穴，是噬道天教的滔天殺局——」\n\n「我墨飛，也定要回青石鎮！」\n\n——\n\n墨飛即刻尋了凌霜。\n\n凌霜聽罷，那清冷的臉上也染上了凝重的寒霜。\n\n「青石鎮遠在問劍宗萬里之外。」她沉吟道，「噬道天教既已對你的故鄉下手，這分明是衝你而來的殺局。他們是想以你至親為餌，引你涉險。」\n\n「我知道。」墨飛的眼神卻無比堅定，「可那是程伯，是養我十六年的至親。這局是明知的火坑，我也必須跳。」\n\n凌霜靜靜地望著他。那份明知是餌、明知凶險，卻為了至親義無反顧的決絕與赤誠，讓她那顆心重重一動。\n\n「好。」她不再勸阻，反而眸中燃起了並肩的決意，「我陪你一同去。」\n\n「師姐——」\n\n「你不必說了。」凌霜打斷他，那清冷的眸中是不容置疑的堅定，「當年在雜役堂，是你替我化解了道基的隱疾；青石學宮、問劍宗，這一路生死與共，你我早已不分彼此。」\n\n「你護道統、護至親，」她一字一句，「我護你。你我早已是同路人。」她握住他的手，那向來清冷的眸子裡是滾燙的並肩之志，「這一趟青石鎮，無論是噬道天教的元嬰護法，還是滔天的殺局——」\n\n「你我一同面對。」\n\n墨飛望著凌霜那盛滿決意與情意的眸子，心底一片滾燙。\n\n「多謝師姐。」他重重握住她的手，不再多言。\n\n二人即刻向宗門報備了緣由。宗門得知墨飛竟能以問道之姿對抗噬道天教，又念及他守護聖物、揚名天南的大功，當即首肯，更特許他二人動用宗門的長途傳送大陣，直抵青石鎮鄰近的城池。\n\n星夜，問劍宗傳送陣白光一閃，墨飛與凌霜的身影消失於問劍宗，朝著那萬里之外、正籠罩於噬道天教陰影之下的青石鎮疾馳而去。\n\n而墨飛的心中，除了焚天的焦急，更懸著那個即將揭曉的、關於程伯、也關於他自己身世的驚天秘辛。\n\n——\n\n自傳送陣落腳的城池到青石鎮，尚有數百里之遙。墨飛與凌霜御風而行，一路疾馳，那焚天的焦急讓墨飛恨不得生出雙翼。\n\n越是靠近青石鎮，那空氣中便越是瀰漫著一絲令墨飛心悸的邪異氣息——那是噬道天教的「反問道」之韻。\n\n那股邪異氣息，正是墨飛在論道峰上、在墨淵身上感受過的「反問道」之韻。它像一張無形的網，將整座青石鎮牢牢罩住。墨飛的心一寸寸沉下去——這意味著，噬道天教非但沒有得手就走，反而在此設下了埋伏，就等著他這問道傳人自投羅網。\n\n「他們果然還在。」墨飛的臉色前所未有的凝重。\n\n「還來得及麼……」他握緊了斷刀，指節發白，「程伯，你一定要撐住。」\n\n半日之後，青石鎮遙遙在望。\n\n可眼前的景象卻讓墨飛的心狠狠一沉。\n\n那個生養了他十六年的寧靜小鎮，此刻正籠罩在一片詭異的、墨黑色的死氣之中。鎮外的田野草木枯萎，鎮口那棵他測靈石失敗、被人恥笑的老槐樹早已枯死。而那平日裡炊煙嫋嫋、人聲鼎沸的街巷，此刻卻死一般的沉寂。\n\n「噬道天教以邪法封了整座鎮子。」凌霜眸光森然，「這死氣之下，鎮民……」\n\n「還活著。」墨飛的「觀道」已探明鎮中情形，「他們被那死氣困住、鎮壓神魂，卻尚存。噬道天教並未屠戮鎮民——」\n\n「他們要的是活口。」墨飛一字一句，眼神冰寒，「是以整座青石鎮的鎮民為質，以程伯為餌，引我入局。」\n\n這是一個堂堂正正、又惡毒至極的陽謀。噬道天教料定他這問道傳人絕不會棄故鄉至親於不顧，於是就在這青石鎮布下了天羅地網，等著他自投羅網。\n\n「師姐，」墨飛沉聲道，「這鎮中必有噬道天教的埋伏。甚至那元嬰後期的墨淵，都可能在此。」\n\n「我知道。」凌霜握緊了手中的劍訣，那清冷的眸中是並肩的決絕，「可你我已無退路。」\n\n「程伯還在鎮中。」墨飛望向那死氣沉沉的青石鎮，眸中焦急與戰意交織，「無論前方是何等滔天的殺局，我都要闖進去。」\n\n他不再遲疑，握緊斷刀，一步踏入了那籠罩著墨黑死氣的青石鎮。\n\n熟悉的街巷此刻寂靜得令人心悸。墨飛循著記憶，也循著那程伯氣息最後殘留的方向，一步一步朝著鎮中那間他生活了十六年的「濟生堂」走去。\n\n濟生堂的木門緊閉著，門上還殘留著劇烈打鬥的痕跡與幾道焦黑的邪異印記。\n\n墨飛的心提到了嗓子眼。\n\n「程伯……」他一步上前，顫抖著推開了那扇熟悉的木門。\n\n門內藥香依舊，卻混雜著一絲濃重的血腥。而在那藥碾子旁，一道蒼老而佝僂的、渾身浴血的身影，正倚著牆壁，緩緩抬起頭來，望向門口的墨飛。\n\n正是程伯。\n\n「臭小子……」老人望著門口的墨飛，那渾濁的老眼裡是又驚又怒、又說不出的複雜與慈愛，「不是叫你，莫要回來麼……」\n\n墨飛望著那渾身浴血、氣息奄奄的老人，眼眶瞬間紅了。\n\n「程伯！」他一個箭步衝了上去。"}, {"t": "第四十章 遺孤", "c": "墨飛一把扶住那渾身浴血的老人。\n\n他慌忙取出療傷靈丹，又運轉問道盤探查程伯的傷勢——那一探之下，墨飛的心沉到了谷底。\n\n程伯的傷太重了。他的道基已被那噬道邪法侵蝕、崩毀，那一縷縷邪異的黑氣正順著他的經脈，一點一點噬食著他的生機與神魂。尋常療傷之法，根本無濟於事。\n\n「別忙活了，臭小子。」程伯卻虛弱地擺了擺手，唇角溢著血，卻笑了笑，「老頭子這身子，早不成了。」\n\n「程伯你別說話！」墨飛眼眶發紅，「我以問道之法替你化去這邪氣——你撐住！」\n\n「化不掉的。」程伯搖搖頭，那渾濁的老眼裡是一片了然的平靜，「這噬道天教的邪法最是歹毒。老頭子這條命，早在他們破門而入時便註定了。」\n\n「老頭子是強撐著這一口氣——」他望著墨飛，那目光裡是滔天的慈愛與不捨，「在等你回來。」\n\n「有些話，」他喘息著，一字一句，「老頭子得親口告訴你。」\n\n墨飛再也忍不住，淚水奪眶而出：「程伯……」\n\n「臭小子，別哭。」程伯伸出顫抖的、枯瘦的手替他拭去眼角的淚，一如他幼年時那般，「聽老頭子說。」\n\n「你一直好奇，老頭子是誰，對麼？」\n\n墨飛重重點頭。\n\n程伯望著濟生堂那熟悉的藥香與陳設，眼神悠遠，彷彿穿透了數十年的歲月——\n\n「老頭子本名程守拙。」他緩緩道，「數十年前，是問道一脈最後的守護者之一。」\n\n墨飛渾身一震，如遭雷擊：「問道一脈？程伯，你竟是……」\n\n「當年問道一脈被噬道天教傾覆、屠戮，幾近滅絕。」程伯的聲音帶著萬古的滄桑與悲愴，「我等少數倖存的守護者，帶著道統的火種四散潛逃，只為替問道一脈留一線復興的生機。」\n\n「而那最珍貴的火種——」他望向墨飛，那目光裡是無盡的溫柔，「便是一個尚在襁褓中的、問道一脈的血脈遺孤。」\n\n墨飛的呼吸驟然停滯。\n\n「那個遺孤……」他聲音顫抖，「是……」\n\n「是你，墨飛。」程伯一字一句，「你是問道一脈最後的血脈，是問道一脈傾覆之時被拚死搶救出來的唯一希望。」\n\n轟！墨飛的腦中一片轟鳴。\n\n原來如此！原來如此！\n\n他一直以為那方問道盤是他墜崖之時偶然得到的機緣，卻不想——他本就是問道一脈的血脈遺孤。那問道盤會認他為主、會為他而解封傳承，並非偶然，而是血脈的呼喚，是道統的傳承，冥冥之中早已註定。\n\n「當年，」程伯繼續道，「為了將你藏好、不被噬道天教追殺，我自毀大半修為，隱去一身氣息，扮作一個尋常的跛腳鎮醫，將你帶到這偏遠的青石鎮，隱姓埋名，把你養大。」\n\n「我不敢教你修行，怕那一絲問道的氣息引來噬道天教的追殺。」老人眼中含淚，「我只能眼睜睜地看著你，被那測靈石判為『廢根』，被全鎮恥笑……」\n\n「臭小子，你不知道，」程伯老淚縱橫，「你每受一分委屈，老頭子這心裡便痛一分啊。」\n\n墨飛早已泣不成聲。他一直以為，自己不過是個被命運捉弄、又僥倖得了機緣的廢根少年。卻原來，從他出生的那一刻起，就有一個人，用自己的下半生、用一身的修為、用數十年的孤獨與隱忍，為他撐起了一片安穩的天。\n\n他終於明白了——程伯那一次次深沉而複雜的目光，那句「不是無緣，是無人替你點那盞燈」，那悄悄塞給他的納物袋，那句「以算證道」的了然……\n\n原來這老人為了守護他、守護問道一脈的最後火種，隱姓埋名，自毀修為，默默背負了數十年。\n\n「程伯……」墨飛握住老人那枯瘦冰涼的手，「你為何從不曾告訴我……」\n\n「怕你涉險。」程伯虛弱地笑了笑，「怕你揹上這滔天的血仇與重擔。老頭子只盼你能平平安安地過完這一生……」\n\n「可天意弄人。」他望向墨飛那已然承接了道統、氣度不凡的模樣，眼中是欣慰，是驕傲，也是無盡的不捨，「你終究還是走上了這條路。你終究還是那問道一脈的麒麟兒……」\n\n「程伯，」墨飛含淚，一字一句，斬釘截鐵，「我承下了問道傳承。我定會重興問道，親手覆滅那噬道天教，為問道一脈的萬千先賢——」\n\n「討回公道！」\n\n程伯望著他，那渾濁的老眼裡最後的光芒燃燒得格外明亮：\n\n「好……好……」他喃喃，「問道一脈，後繼有人……我程守拙，縱死……」\n\n「也可以去見列位先賢了……」\n\n就在此時——\n\n濟生堂之外，那墨黑的死氣驟然翻湧！一股令墨飛靈魂都為之戰慄的恐怖威壓鋪天蓋地鎮壓而來。\n\n一道森然而陰冷的聲音自門外響起——\n\n「問道餘孽，果然如約回來了。」\n\n「墨淵，在此恭候多時了。」\n\n——\n\n墨淵，那反問道的元嬰後期護法，一步踏入了濟生堂那狹小的院落。\n\n他一身滔天的邪異之力，將整座濟生堂都籠罩在一片死亡的威壓之下。他那雙淬滿邪異的眼睛掃過墨飛，掃過那氣息奄奄的程守拙，唇角勾起一抹殘忍的冷笑。\n\n「程守拙，問道一脈最後的守護者。」墨淵森然道，「我教找了你數十年，卻不想你竟躲在這等鳥不拉屎的小鎮，裝了數十年的鎮醫。」\n\n「若非這問道餘孽揚名天南、暴露了行蹤，我教又豈能順藤摸瓜尋到你這老不死的？」\n\n他望向墨飛，眼中凶光滔天：「墨飛，今日我便在此，將你這問道一脈最後的血脈與守護者一併斬草除根，讓你們問道一脈徹底從這天地間湮滅！」\n\n戰力五千的元嬰後期大能，那毀天滅地的威壓鎮壓而下。墨飛與凌霜聯手也不過四千餘的戰力，在這絕對的實力面前脆弱得如同螻蟻。\n\n墨飛將重傷的程伯護在身後，斷刀橫於身前，那雙含淚的眸子裡是焚天的悲憤與決絕。\n\n「墨淵！」他嘶聲道，「噬道天教覆滅問道一脈，禍亂天地。這筆血債——」\n\n「今日，你休想再添一筆！」\n\n「就憑你？」墨淵放聲狂笑，「一個金丹圓滿的螞蟻，也敢在老夫面前猖狂？」\n\n他一掌攜著滔天的邪異之力朝著墨飛轟然拍落。那一掌之下天地失色，濟生堂那承載了墨飛十六年記憶的老屋轟然崩塌。\n\n千鈞一髮之際——\n\n「臭小子……讓開！」\n\n一直氣息奄奄的程守拙，竟在這一刻猛地爆發出他生命中最後的一絲力量。\n\n他自毀了那苟延殘喘的道基，將畢生僅存的修為與神魂盡數燃燒。那一瞬，這位問道一脈最後的守護者，佝僂的身軀竟爆發出一縷微弱卻無比純粹的問道之光。他撲在墨飛身前，以那燃燒生命凝成的問道之光，硬生生擋下了墨淵那毀滅性的一掌。\n\n轟隆！\n\n「程伯——！」墨飛撕心裂肺地嘶吼。\n\n煙塵散去，程守拙那燃燒了生命最後一絲力量的身軀已然倒在血泊之中，氣息徹底斷絕。可他的唇角卻帶著一絲安詳的笑意，那渾濁的老眼望著身後的墨飛，彷彿在說——\n\n「去吧……問道一脈的麒麟兒……」\n\n「莫要回頭……」\n\n程守拙，這位隱姓埋名數十年、以生命守護了問道最後火種的老人，用他燃燒殆盡的最後一縷生命為墨飛擋下了那必死的一擊，也為他換來了一線反擊的生機。\n\n墨飛跪在程伯身旁，望著那安詳而冰冷的面容，只覺得天崩地裂，五內俱焚。\n\n那個將他養大成人的至親，那個為他背負了數十年秘辛與重擔的老人，那個在他被全鎮恥笑時唯一相信他的程伯，就這樣為了他永遠地走了。\n\n無盡的悲痛與滔天的恨意，如火山般在墨飛的胸中轟然噴發。\n\n「程伯……」他渾身顫抖，淚如雨下，那雙眸子卻在這焚天的悲憤之中漸漸燃起了一種前所未有的、璀璨到極致的光芒。\n\n他的道心，在這生離死別的極致淬鍊之下轟然昇華。\n\n丹田之中那枚九品圓滿的道韻金丹，被這滔天的悲憤與昇華的道心猛地一激，竟發出了一陣衝擊元嬰的、清越的鳴響。\n\n墨淵望著那跪地不起、周身卻道韻暴漲的墨飛，眼中閃過一絲訝異：「怎麼？你這螞蟻被嚇傻了？還是……」\n\n他的話戛然而止。\n\n因為他分明感應到——那個跪在地上的少年，那原本金丹圓滿的氣息，此刻竟正以一種驚人的速度瘋狂攀升、蛻變。\n\n「不……不可能！」墨淵駭然，「你竟要在此刻——」\n\n「衝擊元嬰？！」"}, {"t": "第四十一章 問道元嬰", "c": "衝擊元嬰，本是水磨工夫，需萬全準備、天時地利，稍有不慎便是道基崩毀、身死道消的下場。\n\n可墨飛的這一次突破，卻是在至親隕落的悲憤之中，是在強敵環伺的絕境之下，是在道心轟然昇華的那一剎那，水到渠成、勢不可擋。\n\n程伯之死，是墨飛此生最痛的一道傷。可也正是這道傷，這場生離死別的極致淬鍊，讓墨飛對「道」的體悟、對「問道」的執念昇華到了一個前所未有的境界。\n\n他終於徹底明白了——他為何而修。\n\n不是為了力，不是為了揚名，而是為了守護。是為了那問道一脈萬千先賢的遺澤，是為了程伯用生命守護的火種，是為了重興問道、對抗噬道，還這天地一個朗朗的乾坤。\n\n以守護為心，以問道為道。這便是他墨飛的元嬰之道。\n\n丹田之中那枚九品圓滿的道韻金丹，在這昇華道心的催動下轟然破碎。碎裂的金丹之力，與那磅礴的真元、與那承自道統的問道之韻重新凝聚、蛻變——\n\n一尊通體流轉著六色道韻、眉心綻放著一縷問道之光的元嬰虛影，於墨飛的識海之巔緩緩凝聚成形。\n\n【墨飛│元嬰一層│問道元嬰(特殊)！】\n【道基蛻變：金丹化嬰。以「守護」為心，以「問道」為道。】\n【氣血、法力、神識、壽元……全面暴漲！】\n【戰力3600 → 8000！】\n【〔此問道元嬰承問道道統、歷生死昇華而成，契合宿主證道之路，潛力……直指大道〕】\n\n元嬰一層！戰力一舉突破八千！\n\n那一瞬，墨飛周身六色道韻沖天而起，整座青石鎮上空那籠罩已久的墨黑死氣，竟被那浩瀚的問道之光逼退、驅散。天光，重新灑落。\n\n墨飛緩緩起身。\n\n他身上還帶著程伯的血，他的眼中還含著未乾的淚。可此刻的他，那氣息、那氣度已然脫胎換骨——由一個金丹修士蛻變為一位真正的元嬰大能。而更重要的是，他那雙承接了問道道統的眼睛，在元嬰之力的加持下，那「觀道」「推衍」「道眼」的權能更是清明、深邃了數倍。\n\n墨淵望著那破境而出、戰力直逼於他的墨飛，那張森然的臉上第一次露出了難以置信的駭然：\n\n「元嬰……你竟真的在絕境之中破了元嬰？還是這等恐怖的問道元嬰？」\n\n「戰力八千……」他倒吸一口涼氣，「你一個剛破境的元嬰一層，戰力竟追平了我這元嬰後期？」\n\n「墨淵。」墨飛緩緩抬眸，那雙含淚的眸子裡，此刻是焚天的恨意，與問道傳人的凜然殺意，「程伯的血債。」\n\n「今日——」他一字一頓，握緊了斷刀，那斷刀之上六色道韻與問道之光交相輝映，鋒銳直指蒼穹，「該你償還了！」\n\n——\n\n問道元嬰的墨飛，與那反問道護法墨淵，於這青石鎮的廢墟之上展開了一場天崩地裂的搏殺。\n\n戰力雖已相近，可墨淵畢竟是元嬰後期的老牌大能，經驗、底蘊皆遠勝墨飛。\n\n然而，墨飛有問道盤，有《問道錄》，有那剋制「反問道」的問道正道之力，更有那為程伯復仇的焚天決意。\n\n墨淵那詭異陰毒的「反問道」邪法，在墨飛昇華後的「觀道」之下破綻盡顯，那毀道噬道的黑氣被墨飛那浩瀚的問道之光與《太一光明經》的純陽正道一次次消融、克制。而墨飛那承問道至理的一套配置，配合元嬰之力更是威能滔天。他以「推衍」之能將墨淵的每一招都算到毫釐，以問道之算將墨淵那老辣的經驗與底蘊一分一分抵銷、化解。\n\n二人鬥得難解難分，青石鎮的廢墟在二人滔天的威能之下被夷為平地。\n\n凌霜亦在一旁尋隙，以那化煞為劍、更上層樓的絕世劍道助墨飛一臂之力。一人問道之算，一人劍道之絕，聯手竟將那元嬰後期的墨淵死死壓制。\n\n「怎麼可能……」墨淵又驚又怒，又漸生懼意，「我堂堂元嬰後期、反問道護法，竟被一個剛破境的問道小子與一個築基丫頭壓著打？」\n\n他終於明白，為何教中會如此忌憚問道一脈。這「問道」之道，簡直便是他們「反問道」的天生剋星。\n\n「墨淵！」墨飛抓住墨淵一招舊力用盡的破綻，一記凝聚了元嬰真元、問道至理與滔天恨意的《裂石訣》，破開墨淵的護體，狠狠洞穿了他的肩頭。\n\n「啊——！」墨淵慘嘶一聲，一身邪異真元潰散大半，踉蹌跌退。\n\n墨飛欺身而上，斷刀直取墨淵咽喉，勢要為程伯報這血海深仇。\n\n——\n\n墨淵重傷之下，自知再難匹敵。\n\n「今日栽了……」他眼中凶光與狠戾交織，「可你別得意，問道餘孽！」\n\n他不惜再次自損修為，施展那詭異的「血遁」邪術，化作一道狼狽的血光亡命遁逃。臨去前，那淬滿了怨毒與忌憚的聲音迴盪在青石鎮的廢墟之上：\n\n「我教教主早已注意到了你！問道復興？哼！在我噬道天教傾天之勢面前——」\n\n「你這螻蟻之火，遲早會被徹底撲滅！你等著！」\n\n墨飛欲追，卻終究被那血遁之術遁走。他金丹圓滿破元嬰不過片刻，元嬰之力尚未徹底穩固，強行追殺一位元嬰後期的老怪反而凶險。\n\n「跑得了一時。」墨飛望著墨淵遁逃的方向，眸中寒光凜冽，「跑不了一世。」\n\n「程伯的血債，噬道天教覆滅問道一脈的血仇——」他一字一頓，「我墨飛記下了。」\n\n墨淵一逃，那籠罩青石鎮的墨黑死氣也隨之潰散。被困的鎮民紛紛甦醒，雖驚魂未定，卻皆保住了性命。\n\n而墨飛卻再顧不得這些。\n\n他緩緩走回那濟生堂的廢墟，走到程伯那冰冷的身軀旁，緩緩跪下。\n\n「程伯……」\n\n這位將他從一個墜崖廢材養育成人的至親，這位隱姓埋名數十年、以生命守護了問道最後火種的老人，終究還是為了他永遠地閉上了眼。\n\n墨飛伏在程伯身旁，這位力抗元嬰大能、破境元嬰的問道傳人，此刻卻哭得像個尋常的、失去了至親的孩子。\n\n他多想再聽一聲那嫌棄的「臭小子」，多想再嚐一口那碗留給他的藥膳，多想告訴程伯——他墨飛，如今已經是元嬰大能了，再也不是那個需要被護在羽翼下的廢根少年了。\n\n可這一切，都晚了。老人臨終前護他周全的最後一掌，成了他此生再也無法償還的恩情。\n\n十六年的養育之恩，數十年的守護之情，還有那尚未來得及說出口的一聲「謝謝」，都隨著這位老人的離去化作了墨飛心底永遠的痛。\n\n——\n\n墨飛與凌霜將程守拙安葬於青石鎮後山，那他墜崖得盤、命運自此轉折的山腳之下。\n\n墓碑之上，墨飛親手刻下——\n\n「先師　程守拙　之墓」\n\n「問道守護者，長眠於此。」\n\n葬禮之後，墨飛立於墓前久久佇立。青石鎮的鎮民得知是這位曾被他們恥笑的「廢根」墨飛救了他們、救了整座鎮子，皆跪伏於地，感激涕零。\n\n而墨飛卻只是望著那方新立的墓碑，眼神一片堅定而深沉。\n\n「程伯，」他一字一句，聲音雖輕，卻重逾千鈞，「你以生命守護的問道火種，我接住了。」\n\n「你未竟的心願，你背負的血仇——」\n\n「我墨飛，會替你，也替問道一脈的萬千先賢一一了結。」\n\n「噬道天教教主……」他望向那天地深處那潛藏著滔天邪教的方向，眸中星河與恨意交織燃燒，「你既注意到了我——」\n\n「那便好好記著我這個名字。」\n\n那一刻，墨飛的心中再無半分迷惘。從前他修行，是為了在這弱肉強食的世道裡不被欺凌、不被輕視；而如今，他修行的意義，被程伯用生命，鍛成了一個沉甸甸的字——「守」。守道統，守至親，守這天地間一切不該被吞噬的光。\n\n「墨飛。」他一字一頓，那是一個問道傳人向湮沒萬古的邪教發出的正式宣戰，「問道一脈最後的血脈。也是——」\n\n「將親手覆滅你噬道天教的那個人。」\n\n山風獵獵，吹動墨飛的衣袂。\n\n一個問道傳人的復仇與使命，一場橫跨萬古、關乎道統存亡的問道與噬道的終極之戰，自程伯這一方青石鎮後山的墓碑之前正式拉開了序幕。\n\n而墨飛知道，前路縱有萬般凶險，縱有噬道天教那深不可測的滔天底蘊，他已再無退路。\n\n唯有一路向前，一路變強，直到將這問道一脈先賢們未曾走完的路，走到那能與噬道天教一決生死的巔峰。"}, {"t": "第四十二章 歸宗", "c": "墨飛與凌霜安頓好青石鎮的鎮民，便返回了問劍宗。\n\n墨飛歸來之時，已非昔日那個金丹圓滿的天驕。他一身問道元嬰的氣息深不可測，戰力直逼元嬰後期，整個問劍宗為之震動。\n\n而他帶回的消息更是讓宗門上下凜然——\n\n噬道天教，一個覆滅了問道一脈、潛藏萬古、如今悄然復甦的龐大邪教。他們煉幽冥墟、盜藏道閣、暗殺長老，更屠戮了墨飛的故鄉青石鎮，殺害了隱姓埋名的問道守護者程守拙。而煉器世家洛家，早已與這噬道天教暗中勾結，成了那邪教伸向天南的一枚棋子。\n\n問劍宗掌門，那位深居簡出的化神大能，聞訊勃然大怒。他立刻聯合天南幾位曾與墨飛有過一面之緣、允諾相助的聖地大能，對洛家展開了雷霆清算。\n\n洛家這與噬道天教勾結、禍亂天南的煉器世家，在諸聖地與問劍宗的聯手問罪之下樹倒猢猻散。洛天罡這墨飛的老對頭，見大勢已去不敢再留，竟拋下家族投奔了噬道天教，亡命遁逃；而那被廢修為的洛雲軒，則在洛家傾覆的混亂中不知所蹤。\n\n一個曾不可一世的煉器世家，就此煙消雲散。\n\n消息傳來時，墨飛正立於問劍崖上。他想起初入問劍宗時，洛家是何等地不可一世，洛天罡、洛雲軒又是如何一次次地欲置他於死地。如今這龐然大物一朝崩塌，他心中卻無半分快意，反倒生出一絲說不清的沉重。\n\n「一步錯，步步錯。」他低聲道，「洛家本是天南數得上號的世家，只因貪圖噬道天教許下的力量，便將滿門的前程都押了上去，最終落得個樹倒猢猻散的下場。」\n\n這世上，被噬道天教以「力量」為餌所蠱惑、最終淪為棄子的，又何止一個洛家。\n\n「洛家……」墨飛望著那傳來的消息，眸中並無多少快意，「不過是噬道天教的一枚棄子。」\n\n「真正的元兇，」他眸光一凝，「是那潛藏於天地最深處的噬道天教教主。」\n\n——\n\n洛家傾覆之後，墨飛在問劍宗的地位達到了前所未有的巔峰。\n\n問道元嬰、力抗噬道護法、揭發噬道陰謀，更是問道一脈唯一的血脈傳人——他早已超越了「天驕」的範疇，成了問劍宗乃至整個天南對抗噬道天教的一面旗幟。\n\n問劍宗掌門親自將他召入主峰，以平輩之禮相待。\n\n「墨飛，」那位鶴髮童顏的化神掌門鄭重道，「噬道天教禍亂天地，乃是我輩修士共同之敵。而你身負問道傳承，是剋制那邪教邪法的關鍵。」\n\n「日後對抗噬道，我問劍宗乃至天南諸聖地，皆願以你馬首是瞻。」\n\n墨飛鄭重拱手：「晚輩義不容辭。」\n\n他承接了問道道統，便註定要扛起這重興問道、對抗噬道的大旗。這是程伯用生命託付的使命，也是他此生無可推卸的道。\n\n「只是，」墨飛話鋒一轉，神色凝重，「噬道天教潛藏萬古，底蘊深不可測。那墨淵不過是一名護法，戰力便已五千。其教中元嬰、化神大能，只怕不知凡幾。」\n\n「以我等如今的實力——」他一字一句，「還遠遠不足與之正面抗衡。」\n\n「當務之急，」墨飛眸光深邃，「是儘快變強，是尋回那散落於天地的其餘問道信物、重鑄問道道統，是聯合天南諸聖地共禦噬道。」\n\n「還有一事。」掌門話鋒一轉，神色鄭重，「你雖已是元嬰，可噬道天教既已注意到你，往後追殺必然接踵而至。宗門會將問劍宗最頂尖的護道法器與療傷靈藥撥予你，你儘管取用。這一路，你不是為問劍宗一家而戰，是為整個天南、為這天地間所有不願被噬道吞噬的道統而戰。」\n\n墨飛聞言，心頭一熱，鄭重叩首：「晚輩，定不負宗門所託。」\n\n他知道，自承接問道道統的那一刻起，他便再不只是墨飛一人。他的背後，是問劍宗，是天南諸聖地，是問道一脈萬千先賢的期望。這份重量，壓得他脊背發沉，卻也讓他的每一步，都走得無比堅定。\n\n掌門聞言深深頷首：「你思慮周全。此事便依你，宗門會全力助你。」\n\n——\n\n自主峰歸來，墨飛於問劍崖閉關，鞏固元嬰。凌霜守在崖外。\n\n當墨飛出關之時，那問道元嬰已然圓融、穩固。他的戰力在元嬰之力徹底穩定之後，更是攀升至了戰力近萬。\n\n「墨飛。」凌霜迎上前來，那雙向來清冷的眸子裡是揪心過後的溫柔，「程伯的事，你節哀。」\n\n墨飛望著她那盛滿了關切與情意的眸子，心底那道因程伯而生的傷痛，似乎也被撫慰了幾分。\n\n「多謝師姐。」他輕聲道，「這一路，若非有你一同面對……」\n\n「你我之間，」凌霜打斷他，那清冷的臉上綻開一抹柔和而堅定的笑意，「不必言謝。」\n\n「重興問道，對抗噬道——」她握住他的手，一字一句，「這條路無論多長多險，我都陪你一同走到盡頭。」\n\n「還記得雜役堂那盞沒人替我點的燈麼？」墨飛忽然道，唇角泛起一絲淡淡的笑意，「那時我總覺得，這世上是不是就沒人肯拉我一把。可後來我才明白，有些燈，是要自己點亮的；而有些人——」他望向凌霜，「是會在你點亮燈之後，願意陪你一起，把這條路走下去的。」\n\n凌霜聞言，那清冷的眸中泛起一絲極淡的漣漪。她沒有說話，只是將手覆得更緊了些。\n\n墨飛回握住她的手，那雙星河流轉的眸子裡是前所未有的篤定與溫柔：「好。」\n\n一場橫跨萬古的問道與噬道之爭，一段並肩而行的情深意重。在這程伯隕落、問道復興的風雨之中，墨飛與凌霜將彼此的命運與道途緊緊交纏。\n\n而墨飛知道，前路那滔天的噬道之劫才剛剛開始。他必須變得更強。\n\n「元嬰近萬。」他望向那更高、更遠的化神之境，眸中戰意熊熊，「還不夠。」\n\n「為了程伯，為了問道一脈的萬千先賢，為了護住我想護的人——」\n\n「我要一路向前，直到那能與噬道天教教主正面一決的那一日。」\n\n——\n\n然而，墨飛想要安穩精進的願望終究落了空。\n\n洛家傾覆、墨淵重傷而歸，讓潛藏於暗的噬道天教顏面盡失。而墨飛這問道傳人的異軍突起，更如同一根深深刺入噬道天教心頭的芒刺。那一度注意到墨飛的噬道天教教主，終於決定不再坐視。\n\n半月之後，一則令整個天南為之震動的消息如驚雷般傳來——\n\n噬道天教糾集教中大能，並天南諸多與之勾結的魔道勢力，欲大舉進犯天南！\n\n而他們的第一個目標，正是問道傳人墨飛所在的問劍宗！\n\n「他們要先拔了問劍宗這面對抗噬道的旗幟。」墨飛握緊了拳，眸光森然，「更要趁我元嬰初成、根基未穩之際，將我這問道傳人扼殺於搖籃！」\n\n問劍宗上下一片凝重。噬道天教籌謀萬古，底蘊深不可測，此番傾巢而出，其鋒芒之盛，縱是問劍宗這等天南大宗也感泰山壓頂。\n\n「傳訊諸聖地！」掌門當機立斷，「噬道天教禍亂天下，乃我輩共同之敵！此番正是聯合諸聖地、共禦噬道的時候！」\n\n一封封求援的傳訊自問劍宗飛向天南各大聖地。而那些曾允諾相助、又深恨噬道天教的聖地大能紛紛響應。一時間，天南正道風雲匯聚，一場正邪大戰的陰雲籠罩天南。\n\n消息傳來的那一夜，墨飛獨立崖頭，久久未眠。他清楚，噬道天教此番傾巢而來，名為奪信物，實為斬草除根——要趁他元嬰初成、根基未穩之際，將他這問道傳人扼殺於搖籃。這是一場他避無可避的劫。\n\n可他心中，卻無半分退意。躲，是躲不掉的；唯有迎上去，以一場堂堂正正的大勝，讓這天下都看見——問道，不是那麼好欺的。\n\n墨飛立於問劍崖之巔，望著那因噬道來襲而嚴陣以待的問劍宗，望著那天南正道匯聚的滾滾雲潮，眸中星河激盪。\n\n程伯的血仇，問道一脈的萬古之恨，與那覆滅了問道的噬道天教，終於要正面交鋒了。\n\n「來得好。」墨飛握緊了那六色道韻流轉的斷刀，眼底是問道傳人迎向滔天邪教的凜然無懼，「噬道天教，你們覆滅問道一脈、禍亂天地、逍遙萬古。」\n\n「這一次——」他望向那天地深處那滾滾而來的邪異氣息，一字一頓，「便讓我這問道一脈最後的血脈，親手替萬千先賢——」\n\n「向你們討回這萬古的血債！」\n\n天南正道與噬道天教的一場驚天大戰一觸即發。而墨飛這問道傳人，已然立於這場關乎道統存亡、天地正邪的滔天棋局的最中央。"}, {"t": "第四十三章 兵臨", "c": "三日之後，噬道天教兵臨問劍宗。\n\n那是一支令人膽寒的大軍。\n\n天際盡頭，滾滾的、墨黑色的死氣與邪雲鋪天蓋地湧來，將那萬里晴空都染成了一片詭異的墨黑。邪雲之中，一道道氣息邪異而恐怖的身影若隱若現——那是噬道天教傾巢而出的大能，與天南諸多投靠了噬道的魔道邪修。其中元嬰大能數以十計，更有幾道深不可測、令人靈魂戰慄的化神級恐怖氣息，隱於那滔天邪雲的最深處。\n\n「好強大的陣容。」墨飛立於問劍宗山門之巔，以「道眼」掃過那滾滾而來的噬道大軍，眸光凝重。\n\n好在問劍宗亦非孤軍。\n\n三日之間，天南諸聖地響應問劍宗之邀，紛紛派來精銳馳援。此刻問劍宗的山門之後，同樣匯聚了天南正道滾滾的雲潮——問劍宗的化神掌門、太上長老，諸聖地的化神大能，並無數元嬰、金丹的天驕修士，嚴陣以待。\n\n正邪兩道各自滔天的大軍，於這問劍宗的萬里晴空之上遙遙對峙。一場關乎天南正邪、關乎道統存亡的滔天大戰一觸即發。\n\n墨黑的邪雲之中，一道森然的聲音響徹天地——\n\n「問劍宗，交出問道餘孽墨飛，交出問道信物！」\n\n「否則我噬道天教今日便血洗問劍宗，讓你們這天南正道見識見識，我教噬道之威！」\n\n那出言之人，墨飛認得。\n\n正是那重傷遁逃、又再度歸來的反問道護法墨淵。此刻他傷勢已癒，戰力恢復如初，更隱隱較先前更盛幾分。而在他身後那幾道化神級的恐怖氣息，更是讓問劍宗這方諸多大能都面色凝重。\n\n問劍宗掌門越眾而出，一身化神威壓浩瀚如淵，朗聲回應：\n\n「噬道天教覆滅道統、禍亂天地，乃天地公敵！今日爾等兵臨我問劍宗，正好——」\n\n「我天南正道便與爾等這萬古邪祟做一個了斷！墨飛絕不能交，問道信物絕不能給！」\n\n雙方再無轉圜。\n\n「既如此——」墨淵那森然的聲音化作一聲滔天的咆哮，「殺！」\n\n「屠盡問劍宗！奪回問道信物！噬盡天南一切道統！」\n\n轟隆——！\n\n那滾滾的墨黑邪雲，如決堤的洪水，攜著噬道天教傾天的邪異之力朝著問劍宗鎮壓而來。而問劍宗這方，天南正道的滾滾雲潮亦轟然迎上。\n\n一時間天崩地裂、日月無光。元嬰、化神大能鬥作一團，滔天的威能餘波將那萬里晴空攪得天翻地覆，整座問劍宗的護山大陣在那噬道大軍的狂攻之下靈光暴閃、搖搖欲墜。\n\n那是一幅足以載入天南修行史的慘烈畫卷。化神大能的每一次交手，都激起足以夷平一座山峰的餘波；元嬰修士的法術神通，將半邊天空染得五光十色。噬道的墨黑與正道的璀璨反覆交織、碰撞，血肉橫飛，遁光如雨。不斷有修士隕落，化作漫天流光墜下；也不斷有修士頂上，前赴後繼，寸步不讓。\n\n這一戰，是問道與噬道萬古恩怨的第一次正面碰撞，也是天南正道能否守住最後一面旗幟的存亡之戰。\n\n正邪兩道關乎天南存亡的滔天大戰，就此於這問劍宗的萬里天穹之上轟然爆發。\n\n——\n\n墨飛亦投身於這場天崩地裂的大戰之中。\n\n他以問道元嬰、戰力近萬之姿，配合那剋制「反問道」邪法的問道之道，於那噬道大軍之中縱橫捭闔。\n\n那些元嬰、金丹的噬道魔修以「反問道」的邪異之力攻來，在墨飛的「觀道」之下破綻盡顯，那毀道噬道的黑氣被墨飛那浩瀚的問道之光一次次消融、克制。他如同一柄出鞘的問道之劍，所過之處噬道魔修紛紛潰敗、隕落。他那剋制邪法的問道正道之力，更是成了這場大戰之中天南正道最鋒利的一把利刃。\n\n戰場之上，墨飛一人一刀，竟成了整條戰線的中流砥柱。哪一處正道修士被噬道邪法壓制、道心動搖，他便如一道流光掠至，一縷純陽問道之光落下，那侵蝕神魂的黑氣頓時消融，被壓制的同道也重新振作。他不只是在殺敵，更是在以那剋制噬道的問道之光，一次次穩住整條搖搖欲墜的戰線。\n\n「問道之力，果然是我教邪法的天敵！」噬道天教的魔修見了墨飛皆膽寒避退。\n\n而墨飛那問道傳人的赫赫威名，也在這天崩地裂的大戰之中第一次以如此耀眼的方式響徹天南。\n\n可墨飛卻並未被這一時的順勢沖昏頭腦。他那「推衍」之能早已敏銳地捕捉到——這場看似正邪勢均力敵的大戰之下，噬道天教那真正的殺招、那隱於邪雲最深處的幾道化神級恐怖氣息，還未曾出手。\n\n這場大戰，表面上是正邪兩軍的正面碰撞，可墨飛卻嗅到了一絲不尋常。噬道天教傾巢而出，那幾道最恐怖的化神氣息卻始終按兵不動，甚至隱隱有意將戰場的注意力，往正面戰線引。這絕非怯戰——這是一個獵手，在耐心地等待獵物露出破綻的那一瞬。\n\n「他們在等。」墨飛眸光一凝，「在等一個一擊斃命的時機。」\n\n他一面奮戰，一面以「推衍」不停地掃描著整個戰局。那幾道化神級的恐怖氣息始終隱於邪雲深處，按兵不動——這絕非怯戰，而是在等一個能一擊定乾坤的破綻。墨飛心知，噬道天教傾巢而出，絕不會只為與正道拚一場消耗；他們必定另有殺招。\n\n「這場大戰，」他望向那滾滾的邪雲深處，眸中寒光凜冽，「真正的凶險，還沒有到來。」\n\n——\n\n墨飛的預感很快應驗。\n\n激戰之中，噬道天教那隱於邪雲最深處的幾道化神級恐怖氣息之一，終於出手了。\n\n那是一道通體纏繞著無邊死氣、氣息古老而恐怖的黑袍身影。他並未理會戰場上那鬥作一團的大能，而是以一種詭異的、避開了所有正道大能耳目的方式，悄然欺近了問劍宗那維繫著整座護山大陣的核心陣樞。\n\n「不好！」墨飛那「推衍」之能第一時間捕捉到了這致命的異動，「他要毀護山大陣的陣樞！」\n\n護山大陣是問劍宗抵禦噬道大軍的最後屏障。一旦陣樞被毀、護山大陣崩潰，那滔天的噬道大軍便可長驅直入問劍宗，將萬劫不復。\n\n而那偷襲陣樞的黑袍化神避開了所有正道大能的視線，唯有墨飛那承接了問道道統的「道眼」與「推衍」，才看穿了他的行蹤與陰謀。\n\n「師姐！」墨飛一聲暴喝，傳音凌霜，「護住戰場！陣樞有化神偷襲，我去！」\n\n他不再遲疑，身形化作一道六色道韻的流光，避開漫天的恐怖餘波，直直朝著那護山大陣的陣樞疾馳而去。\n\n那偷襲陣樞的黑袍化神見竟有一個小小的元嬰識破了他的行蹤、攔了上來，眼中掠過一絲訝異與不屑：\n\n「一個元嬰螻蟻，也敢壞我教主大計？」\n\n他一掌攜著毀天滅地的化神威壓朝墨飛隔空拍落。那一掌之下天地為之變色，墨飛只覺得一股遠比墨淵還要恐怖十倍的滔天威壓鎮壓而下——那是化神大能與元嬰之間那不可逾越的天塹。\n\n墨飛的問道盤瘋狂運轉，卻只推衍出一片冰冷的絕望——【化神威壓，元嬰難撼。正面對抗：必死。】\n\n千鈞一髮之際，墨飛卻沒有退避。\n\n因為他身後便是那維繫著問劍宗萬千生靈的護山陣樞。他一退，那陣樞便毀於一旦。\n\n「明知不可為——」墨飛握緊了那六色道韻的斷刀，眸中燃起焚天的戰意，「可有些東西，我墨飛退不得！」\n\n他將問道元嬰的全部力量、那承自道統的問道至理、一枚珍藏已久的護道底牌，盡數凝於那迎向化神一掌的一「算」之中。\n\n以元嬰撼化神——這是一場比青石鎮硬撼墨淵更加九死一生的豪賭。\n\n轟隆——！\n\n那化神的一掌，與墨飛那凝聚了問道至理的拚死一擊轟然相撞。\n\n滔天的餘波將墨飛狠狠震飛，口噴鮮血，重傷垂危。可他卻以那問道之算將那化神一掌的毀滅之力堪堪卸開、化解，護住了身後那至關重要的護山陣樞。\n\n「什麼？！」那黑袍化神駭然，「一個元嬰，竟擋下了我一掌？」\n\n而墨飛重傷跌落，卻死死地護在那陣樞之前，抹了把嘴角的血，眸中戰意不減反增：\n\n「陣樞，我護住了。」\n\n「你們噬道天教的殺局——」他喘息著，一字一頓，那雙含著焚天戰意的眸子直直迎上那黑袍化神，「今日就敗在這一步之上！」\n\n因為就在墨飛以命擋下這一掌、為戰場爭取到那寶貴的一瞬之際，那被墨飛傳音示警的凌霜，與問劍宗的化神太上長老，已然察覺此處的異變，攜著滔天的劍光與威壓，朝著這護山陣樞疾馳而至。"}, {"t": "第四十四章 斬墨淵", "c": "那偷襲陣樞的黑袍化神，見凌霜與問劍宗太上長老已然殺至，自知陰謀敗露、再難得手，狠狠剜了墨飛一眼，竟化作一道死氣遁回了那滾滾的邪雲之中。\n\n護山陣樞，保住了。\n\n墨飛以元嬰之軀硬撼化神一掌、守住陣樞的壯舉，經此一役傳遍了整個戰場。天南正道士氣大振，而噬道天教那欲以偷襲陣樞一擊制勝的毒計，也就此破產。\n\n「墨飛護道之功，當記首位！」問劍宗太上長老浩瀚的聲音響徹戰場，為墨飛療著傷，眼中滿是讚許。\n\n墨飛服下靈丹，運轉問道元嬰強行將傷勢壓下。他望向那戰場之中那道森然的反問道護法的身影——墨淵。\n\n「太上長老，」他一字一頓，眸中是焚天的恨意，「墨淵此獠屠我故鄉、殺我至親程伯。此仇——」\n\n「晚輩要親手了結。」\n\n太上長老望著墨飛那燃燒著復仇之火、卻又清明無比的眸子，深深頷首：「去吧。老夫為你護法。」\n\n有化神太上長老為他壓陣、擋住那噬道其餘的大能，墨飛再無後顧之憂。他化作一道六色道韻的流光，直直朝著那戰場之中正肆虐的墨淵疾馳而去。\n\n「墨淵！」墨飛一聲暴喝，那斷刀之上六色道韻與滔天恨意交相輝映。\n\n墨淵回頭，見是墨飛，那森然的臉上掠過一絲忌憚，隨即又化作狠戾的冷笑：「問道餘孽？你這元嬰傷勢未癒，也敢來尋死？」\n\n「今日正好——」他周身邪異真元暴漲，「我便將你這問道一脈最後的血脈徹底抹殺，為青石鎮那一戰雪恥！」\n\n——\n\n墨飛與墨淵，這兩個湮沒了萬古的問道與反問道的宿敵，於這天崩地裂的戰場之上展開了最終的決戰。\n\n墨淵，元嬰後期，戰力五千有餘；墨飛，元嬰一層圓滿，戰力近萬。\n\n論戰力，墨飛已然反超。而更重要的是——墨飛的「問道」，是墨淵那「反問道」邪法的天生剋星。\n\n墨淵那詭異陰毒的邪法，在墨飛昇華後的「觀道」之下破綻盡顯，那毀道噬道的黑氣被墨飛那浩瀚的問道之光與《太一光明經》的純陽正道一次次消融、克制。而墨飛那承問道至理的一套配置，配合近萬的元嬰真元更是威能滔天。\n\n墨淵的邪法固然詭異，可他每一招將出未出之際，那道則流轉的破綻，早已被墨飛的「觀道」看得分明。墨飛從不與他硬拚，總是在最刁鑽的角度、最恰好的時機遞出一刀，逼得墨淵不得不回防、變招，攻勢一次次被瓦解於半途。這是一場實力的對決，更是一場算計的碾壓。\n\n一攻，一守，一算，一破。\n\n那青石鎮一戰尚能將墨飛逼入絕境的墨淵，此刻在破境元嬰、戰力反超的墨飛面前，竟被死死壓制、節節敗退。\n\n「不可能……」墨淵又驚又怒又懼，「短短月餘，你竟強大到如斯地步？」\n\n「因為我要為程伯報仇。」墨飛一邊以問道之算破開墨淵的邪法，一邊一字一句，那聲音裡是焚天的恨與冰冷的決絕，「因為我身後，是問道一脈萬千先賢的血債。」\n\n「墨淵，你屠戮青石鎮、殺害程伯之時，」墨飛眸中寒光暴漲，「可曾想過會有今日？」\n\n他不再給墨淵任何喘息之機。問道元嬰的全部力量、那剋制邪法的問道之道、那為程伯復仇的滔天決意，盡數在這一刻爆發。\n\n《太一光明經》全屬性增幅，將墨飛的戰力推至巔峰；《寒瀑劍》鎖住墨淵的身形；《厚土樁》化解他的反撲；而那蘊著問道至理的《裂石訣》金系氣刃——\n\n在墨淵一輪邪法用老、護體最薄的那一息破綻，墨飛將元嬰真元、問道至理與為至親復仇的全部恨意凝於那雷霆的一擊。\n\n那氣刃無視墨淵倉促凝起的邪異護體，如貫日的長虹，直直洞穿了墨淵的眉心。\n\n那一刀落下時，墨飛的眼前，彷彿又浮現出濟生堂那燃燒的老屋，浮現出程伯撲在他身前、以生命擋下那一掌的背影。這一刀，他等了太久；這一刀，他要替那位隱姓埋名數十載、最終為他而死的老人，親手討回。\n\n「這一刀——」墨飛一字一頓，聲音冰冷，「為程伯。」\n\n墨淵那森然的臉上凝固著難以置信的驚駭。他至死都不曾想到，自己這元嬰後期的反問道護法，竟會隕落於一個他一度視為螻蟻的問道少年之手。\n\n「教主……會為我……」他喃喃，那最後的氣息也隨之斷絕。\n\n墨淵，這個在天南興風作浪、屠戮青石鎮、逼死程守拙的反問道護法，這個曾在論道峰一掌便將墨飛打得重傷垂危的龐然大物，最終，還是倒在了他一度視若螻蟻的問道少年刀下。\n\n這，便是問道與噬道萬古相剋的注定。噬道天教縱橫萬古，靠的是吞噬、是碾壓；可他們偏偏遇上了問道一脈——那個以「算」證道、專破一切邪法的死敵。\n\n一代反問道護法、禍亂天南、血債累累的墨淵，就此隕落於這問劍宗的戰場之上。\n\n墨飛收刀，立於墨淵的屍身之前，久久佇立。\n\n程伯的血仇，得報了一半。\n\n「程伯，」他望向青石鎮的遙遠方向，眸中含淚，卻無比堅定，「墨淵，我替你斬了。」\n\n「而那真正的元兇，那噬道天教的教主——」他望向那滾滾的邪雲深處，一字一頓，「這血債的另一半，我遲早也會親手向他討回。」\n\n——\n\n墨淵一死，噬道天教這方士氣大挫。\n\n墨淵是此番領軍的主將之一。他這元嬰後期的護法竟隕落於一個問道少年之手，這一幕落在那鬥作一團的噬道魔修眼中，如當頭一盆冷水。\n\n而墨飛那剋制「反問道」邪法的問道之道，更是在這天崩地裂的大戰之中愈發耀眼。他如同一柄收割的問道之劍，於那噬道大軍之中縱橫捭闔，所過之處噬道魔修紛紛潰敗、隕落。\n\n「問道之力，剋我邪法！」\n\n「那問道傳人太可怕了！連墨淵護法都死在他手上！」\n\n噬道魔修見了墨飛皆膽寒避退。而天南正道這方，見主將被斬、又有問道傳人這柄克敵利刃大放異彩，士氣如虹，攻勢愈發凌厲。\n\n問劍宗掌門率諸聖地化神大能，將噬道那幾道化神級的恐怖存在死死纏住；而墨飛與凌霜，並天南無數元嬰、金丹天驕，則將那群龍無首的噬道大軍殺得節節敗退。\n\n正邪兩道的勝負天平，在墨淵隕落、問道傳人大放異彩的這一刻，終於緩緩倒向了天南正道。\n\n那隱於邪雲深處、指揮全局的噬道天教大能，見主將已斃、大勢已去，又見那問道傳人如附骨之疽剋制著教中邪法，終究不敢再戀戰。\n\n「撤！」\n\n一聲森然的號令響徹戰場。那滾滾的墨黑邪雲如退潮般倉皇遁退，噬道大軍丟下遍地的屍首，狼狽撤離問劍宗的天穹。\n\n臨去前，那隱於邪雲最深處的、一道最為恐怖的化神級氣息，那冰冷而古老的聲音如魔音般迴盪於整個戰場，只餘墨飛一人能聽得真切——\n\n「問道傳人，墨飛。」\n\n「你壞我教大計、斬我教護法。教主，已然記住你了。」\n\n「這一次是你們僥倖。可你以為斬了一個墨淵，便能逆轉這問道與噬道的萬古之勢？」\n\n「我噬道天教傳承萬古、底蘊通天。教主一脈的真正底牌，你連見都未曾見過。」\n\n「好自為之。」那聲音最後森然一笑，「他日教主親臨之時——」\n\n「便是你問道一脈這最後一縷餘火徹底熄滅之日。」\n\n那聲音隨著邪雲的退散漸漸消弭。\n\n墨飛立於那血染的戰場之上，望著噬道大軍遁逃的方向，久久佇立。\n\n問劍宗守住了。這一戰，天南正道慘勝。\n\n可墨飛卻無半分輕鬆。那噬道天教教主，那隱於邪雲最深處的化神級恐怖氣息，那句「教主一脈的真正底牌你連見都未曾見過」，如同一座無形的大山，沉甸甸地壓在他的心頭。\n\n「這一戰，」墨飛握了握拳，眸中戰意與凝重交織，「不過是問道與噬道萬古之爭的第一場小小的交鋒。」\n\n「真正的滔天大劫，那噬道天教教主，那通天的底蘊——」他望向那天地最深處那潛藏著滔天邪教的方向，眸中星河激盪，「還在後頭。」\n\n「而我墨飛——」他一字一頓，那是一個問道傳人立於慘勝的戰場之上，向那萬古之敵許下的無聲之誓，「唯有一路向前，變得更強。」\n\n「強到能親手掀翻你噬道天教這通天的底牌。強到能為問道一脈的萬千先賢，與我的程伯——」\n\n「討回那萬古的公道。」"}, {"t": "第四十五章 立於天南", "c": "問劍宗一戰，天南正道雖慘勝，卻也付出了慘重的代價。\n\n數位元嬰、金丹的天驕修士殞於此役，問劍宗的護山大陣更是被摧毀了大半。可他們終究守住了問劍宗，守住了問道傳人，也守住了天南正道對抗噬道的最後一面旗幟。\n\n而經此一役，墨飛之名徹底響徹整個天南。\n\n以元嬰之境硬撼化神一掌、守住護山陣樞，於萬軍之中斬殺反問道護法墨淵，更以那剋制邪法的問道之道成為這正邪大戰逆轉勝負的關鍵——「問道傳人墨飛」這個名字，已成了整個天南正道對抗噬道天教的精神象徵。\n\n戰後，天南諸聖地的化神大能齊聚問劍宗，共商抗擊噬道之大計。而在這群英匯聚的議事之中，墨飛這一個元嬰一層的後輩，竟被那一眾化神大能奉為上賓，言必稱「問道傳人」。\n\n「諸位前輩，」議事之上，墨飛起身鄭重道，「噬道天教此番雖退，卻元氣未傷。其教主一脈的真正底蘊，我等尚未窺見。」\n\n「而據問道信物所示——」他一字一句，「欲真正對抗噬道，唯有重興問道。而重興問道，需集齊那散落於天下的其餘問道信物，重鑄問道道統。」\n\n「這便是晚輩接下來要走的路。」\n\n那一眾化神大能聞言皆鄭重頷首。\n\n「墨飛小友所言極是。」那位曾於論道大會欲收墨飛為徒的道骨仙風的化神老者撫須道，「問道之道剋制噬道邪法。你重鑄問道道統之日，便是我天南正道真正有底氣蕩平噬道之時。」\n\n「此事關乎天南存亡。」問劍宗掌門鄭重道，「我等諸聖地願傾力相助！但有問道信物的線索，必第一時間告知於你！」\n\n這一場議事，於墨飛而言意義非凡。他清楚地感覺到，自己已不再是那個孤身闖蕩、事事只能靠自己算計的少年了。程伯用命護下的火種，如今終於引來了燎原的星火——天南諸聖地，願為他這面「問道」的旗幟，共同對抗那萬古邪教。\n\n有了天南諸聖地的鼎力相助，墨飛重興問道的路上便不再是孤軍奮戰。\n\n——\n\n議事之後，墨飛回到那已開始重建的問劍崖。凌霜早已在此等候。\n\n「都安排好了？」她輕聲問。\n\n「嗯。」墨飛點頭，「諸聖地願助我尋回散落的問道信物。而據那論道大會所得的信物推衍，其餘的信物散落於天南各域，乃至更遙遠的天地。」\n\n「這註定是一趟漫長而凶險的旅程。」他望向那天地深處，眸中星河激盪。\n\n這一趟尋訪信物之路，註定要走遍天南、西陲，乃至更遙遠的天地，其間凶險，不知凡幾。可凌霜卻連片刻的猶豫都沒有。\n\n「無論多長多險，」她握住他的手，那清冷的眸中是並肩的決意與深深的情意，「我都陪你。」\n\n墨飛回望著她。那因並肩生死、患難與共而愈發深厚的情誼，讓他心底一片滾燙。\n\n「師姐，」他一字一句，鄭重，「這一路有你同行，是我墨飛此生最大的幸運。」\n\n凌霜那向來清冷的臉上緩緩綻開一抹明媚而動人的笑意，那雙秋水般的眸子裡星光璀璨。\n\n崖上晚風輕拂。一個承接了問道道統、身負萬古血仇與使命的問道傳人，一位化煞為劍、劍道通神的絕世劍修，兩顆因共同的道與情而緊緊相依的心，在這慘勝之後的寧靜之中貼得更近。\n\n「程伯，」墨飛望向青石鎮的方向，心底默念，「你用生命守護的問道火種，我會帶著它走遍這天地，集齊信物，重鑄道統。」\n\n「直到有一天——」他望向那噬道天教潛藏的天地最深處，眸中是問道傳人那堅定不移的使命與戰意，「問道之光，重新照亮這方天地。」\n\n「而那覆滅了問道一脈的噬道天教，那潛藏萬古的教主，終將在我墨飛重鑄的問道之道面前，付出覆滅道統的血債。」\n\n天南的天穹，於這場慘烈的大戰之後重歸澄澈。而一個問道傳人的傳奇，一場橫跨萬古、關乎道統存亡的問道與噬道之爭，才剛剛走過它的序章。\n\n這一戰的慘勝，也讓墨飛更清醒地看見了前路的凶險。噬道天教一名護法墨淵，便已如此難纏；而那藏於最深處、活了萬古的教主，又該是何等恐怖的存在？他握著懷中那兩片問道信物，只覺得肩上的擔子，重逾千鈞。\n\n可他從未想過退縮。因為他知道，這副擔子若他不扛，便再無人能扛。\n\n前路漫漫。墨飛握緊了那六色道韻流轉的斷刀，眼底是迎向那萬里前程的澄澈與無畏。\n\n——\n\n此後半年，墨飛於問劍宗潛心修行。\n\n有問道元嬰的絕佳底蘊，有問道信物溫養道基，有宗門與諸聖地的傾力栽培，他的修為一日千里。半年之後，他已自元嬰一層穩穩突破至了元嬰後期，戰力更是突破了兩萬大關。\n\n【墨飛│元嬰後期│戰力21000】\n\n已然比肩昔日那不可一世的反問道護法墨淵。\n\n而這半年，他也並未忘記那遠在外門的兄弟——石敢。\n\n當年在雜役堂，是石敢這憨厚的漢子，一次次替瘦弱的墨飛扛下最重的活、擋下最刁的欺凌。如今墨飛飛黃騰達，卻從未忘記這位患難之交，時時以珍稀資源與修行心得相授。\n\n石敢得墨飛時時接濟資源、指點修行，這半年亦是突飛猛進，已築基後期，在外門成了數一數二的人物。得知墨飛即將遠行尋找問道信物，這憨厚的漢子二話不說便要隨行。\n\n「墨兄弟去哪，俺石敢就跟到哪！」他拍著胸脯，「刀山火海，俺也陪你闖！」\n\n「不過，」墨飛話鋒一轉，正色道，「石大哥，此行西陲，凶險遠勝天南。那裡強者如林，噬道天教的爪牙亦滲透其中。你如今雖已築基後期，可萬一遇上化神、煉虛的大能——」\n\n「俺曉得。」石敢咧嘴一笑，那憨厚的臉上滿是義氣，「俺跟著你，不是去逞能的，是去給你護後方、扛東西、擋暗箭的。俺這身板結實，關鍵時候，替墨兄弟擋一下，也值了！」\n\n墨飛望著這位從雜役堂一路相隨、從不計較得失的兄弟，心底那份暖意愈發濃烈。這一路走來，他失去了程伯，卻也收穫了凌霜、石敢這般以命相托的同伴。\n\n墨飛望著這情深義重的兄弟，心底一暖，重重點頭：「好！你我兄弟，一同往那更高、更遠的天地去！」\n\n——\n\n一切準備妥當。\n\n這一日，墨飛於問劍崖之巔，以那論道大會所得的問道信物為引，催動那承自道統的「推衍」之能，開始推演其餘問道信物的下落。\n\n那問道信物在他元嬰後期的神識催動之下綻放出一縷璀璨的道韻。而那道韻如指引般遙遙指向了——天南之外，一片更為遼闊、也更為凶險的天地。\n\n【推衍：其餘問道信物之一——位於「西陲·萬劍門」。】\n【〔萬劍門，西陲第一劍道大宗。其鎮派之寶「問劍碑」中，或藏著一片問道信物。然……西陲魚龍混雜，噬道天教的勢力亦滲透其中。此行凶險〕】\n\n「萬劍門，問劍碑……」墨飛望著那道韻指引的西陲方向，眸光一凝。\n\n第一片問道信物的線索尋到了。而那遙遠的西陲、那凶險的萬劍門，正是他重興問道之路上要踏出的下一步。\n\n「師姐，石大哥。」墨飛回頭，望向那早已準備妥當的凌霜與石敢，眸中戰意熊熊，「第一片信物的線索有了。」\n\n「西陲，萬劍門。」他一字一頓，望向那天地盡頭那更廣闊、也更未知的方向，「我們出發。」\n\n一艘嶄新的靈舟，載著問道傳人墨飛、絕世劍修凌霜、憨厚兄弟石敢，自問劍宗騰空而起，朝著那天南之外、西陲深處的萬劍門破空而去。\n\n靈舟之上，墨飛立於舟頭，回望那漸漸遠去的問劍宗——那他自雜役堂一路崛起的地方，那他結識夥伴、化解隱疾、承接使命的地方，那埋葬著他一段青澀歲月的地方。\n\n而後他轉過身，望向那靈舟前方那遼闊無垠、危機四伏，卻也機緣遍地的廣袤天地。\n\n「程伯，問道一脈的先賢們。」他望向那萬里前程，眸中是一個問道傳人踏上征途的澄澈與豪情，「我墨飛的問道之路——」\n\n「這才剛剛開始。」\n\n靈舟破空遠去，載著一段橫跨萬古、蕩氣迴腸的問道傳奇，駛向那更為波瀾壯闊的未來。\n\n（卷三·問道傳承　完）"}, {"t": "第四十六章 西陲", "c": "靈舟破空西行，足足飛了一月，方才抵達天南與西陲的交界。\n\n越過那道橫亙天地的巨大山脈，眼前的天地為之一變。\n\n西陲是一片遠比天南更為蒼茫、遼闊，也更為狂野的土地。這裡靈氣更加狂暴而駁雜，天地之間隱隱透著一股肅殺的劍意——傳聞西陲乃是上古劍道最為昌盛之地，萬千劍修匯聚，劍氣沖霄。\n\n而墨飛以「道眼」掃過這蒼茫的西陲，心中卻愈發凝重。\n\n「這裡的強者遠比天南更多。」他沉聲道，「化神大能隨處可見，甚至……我隱隱感應到了幾道比化神更為恐怖的氣息。」\n\n一路行來，墨飛更是親眼見識了西陲的彪悍。這裡的修士大多佩劍而行，動輒為了一句口角、一件寶物便拔劍相向，劍氣縱橫之下，尋常坊市都時常被波及。與天南那等講究門派規矩、論資排輩的風氣截然不同，西陲信奉的，是手中的劍與拳頭的硬。\n\n化神之上，是為煉虛、合體，乃至那傳說中的大乘之境。西陲這古老而狂野的劍道之地，底蘊深不可測。\n\n「西陲臥虎藏龍。」凌霜亦神色凝重，「你我在天南或算頂尖天驕，可到了這裡，只怕需得處處小心。」\n\n石敢望著那蒼茫遼闊、劍氣沖霄的西陲，也不由得咋舌：「乖乖……這地方比天南還要唬人。」\n\n墨飛收回目光，眸中卻無半分怯意。\n\n「臥虎藏龍也好，強者如林也罷。」他望向那問道信物指引的萬劍門方向，一字一頓，「這第一片問道信物，我勢在必得。」\n\n「走。」\n\n——\n\n萬劍門坐落於西陲東部，一座名為「萬劍峰」的巍峨仙山之上。\n\n那是一座比問劍宗還要恢弘、還要古老的劍道聖地。萬丈劍峰之上插滿了億萬柄古老的飛劍，那沖天的劍氣將半邊天空都染成了一片凜冽的劍光。傳聞萬劍門的鎮派之寶「問劍碑」，乃上古一位劍道大能以畢生劍意所鑄，其中蘊藏著無上的劍道傳承——\n\n而墨飛要尋的那片問道信物，據推衍便藏於那問劍碑之中。\n\n「問劍碑是萬劍門的鎮派之寶。」凌霜沉吟道，「那片問道信物若真藏於其中，只怕萬劍門自己都未必知曉。想取得，只怕不易。」\n\n「先不急強取。」墨飛眸光一凝，「萬劍門乃西陲正道大宗，與噬道天教亦是勢不兩立。或許我等可以問道傳人的身份坦誠相商。」\n\n「何況，」他眸光一閃，「我隱隱感應到那問劍碑之中除了劍道傳承，那片問道信物的道韻正與我識海的問道盤遙相呼應。」\n\n「有這份呼應——」墨飛一字一頓，「或許能成為取信萬劍門的契機。」\n\n畢竟，那問劍碑是萬劍門的鎮派之寶，門中弟子視若性命。若他貿然開口索要，只怕未及言明來意，便要被當作覬覦鎮寶的宵小，逐出山門。可若能讓萬劍門親眼看見那問劍碑與問道信物的呼應，便是最有力的憑證——這份天定的淵源，遠比千言萬語更能取信於人。\n\n——\n\n然而，墨飛一行尚未行至萬劍門山門，便遇上了麻煩。\n\n萬劍峰下，一處繁華的坊市，忽然一陣騷亂。數道氣息邪惡的身影，正於那坊市之中公然擄掠一名懷抱古劍的少女。\n\n「救命！救命啊！」那少女驚恐呼救，「他們是噬道天教的人！他們要搶我家傳承的古劍！」\n\n噬道天教！\n\n墨飛眸光驟然一冷。\n\n那幾道擄掠少女的黑袍人，以「道眼」一掃——【噬道魔修，金丹至元嬰不等】。他們竟如此明目張膽，於這萬劍門眼皮底下行擄掠之事。\n\n「噬道天教的爪牙，果然也滲透到了西陲。」墨飛心中瞭然。\n\n而那坊市之中往來的西陲修士，見是噬道天教的人，竟大多噤若寒蟬、避之唯恐不及，無一人敢上前相救。\n\n「連萬劍門的地界，噬道天教都敢如此猖狂？」凌霜秀眉緊蹙，「這西陲，只怕早已被噬道滲透得千瘡百孔。」\n\n那少女被幾名黑袍人拖拽著，懷中卻仍死死護著那柄古劍，任那邪異真元灼得她嬌軀顫抖，也不肯鬆手分
